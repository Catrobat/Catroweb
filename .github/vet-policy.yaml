# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# ** SafeDep vet — filter suite policy **
#
#  Mirrors the vet-action bundled "General Purpose OSS Best Practices" policy, minus the `ossf-unmaintained`
#  filter. That filter fails the build on `scorecard.scores["Maintained"] == 0`, which fires on stable,
#  low-churn but widely-used transitive dependencies (e.g. `ignore`, `json-schema-traverse`) — false
#  positives for supply-chain risk. Vulnerabilities, malware, risky licenses, low popularity and dangerous
#  release workflows are still enforced.
#
#  Wired into .github/workflows/safedep_vet.yaml via the `policy` input.
#  Docs: https://github.com/safedep/vet-action
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

name: Catroweb OSS Best Practices
description: |
  General purpose OSS consumption best practices for Catroweb. Based on the vet-action
  bundled default policy, with the maintenance-scorecard filter removed to avoid false
  positives on stable but low-activity transitive dependencies.
tags:
  - general
  - safedep-managed
filters:
  - name: critical-or-high-vulns
    check_type: CheckTypeVulnerability
    summary: Critical or high risk vulnerabilities were found
    value: |
      vulns.critical.exists(p, true) || vulns.high.exists(p, true)
  - name: low-popularity
    check_type: CheckTypePopularity
    summary: Component popularity is low by Github stars count
    value: |
      projects.exists(p, (p.type == "GITHUB") && (p.stars < 10))
  - name: risky-oss-licenses
    check_type: CheckTypeLicense
    summary: Risky OSS license was detected
    value: |
      licenses.exists(p, p == "GPL-2.0") ||
      licenses.exists(p, p == "GPL-2.0-only") ||
      licenses.exists(p, p == "GPL-3.0") ||
      licenses.exists(p, p == "GPL-3.0-only") ||
      licenses.exists(p, p == "BSD-3-Clause OR GPL-2.0")
  - name: osv-malware
    check_type: CheckTypeMalware
    summary: Malicious (malware) component detected
    value: |
      vulns.all.exists(v, v.id.startsWith("MAL-"))
  - name: ossf-dangerous-workflow
    check_type: CheckTypeSecurityScorecard
    summary: Component release pipeline appear to use dangerous workflows
    value: |
      scorecard.scores["Dangerous-Workflow"] == 0
