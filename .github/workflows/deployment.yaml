# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# ** Deployment **
#
#  Test deployments are handled by a python script that run on a schedule: https://github.com/Catrobat/Catroweb-API
#  However, the deployment to production is handled by this workflow.
#
#  - Secrets required!
#
name: Deployment
permissions:
  contents: read

# Deploy automatically when the version is bumped (release PR merged), or manually with a branch/tag selection.
on:
  push:
    branches:
      - main
    paths:
      - '.env'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (e.g. main, v26.4.0)'
        required: false
        default: 'main'

# The concurrency group prevents concurrent deploys. cancel-in-progress is false
# to avoid leaving the server in a half-deployed state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Opt in to Node.js 24 for all actions (Node.js 20 is deprecated, deadline June 2nd, 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        working-directory: player
    steps:
      # The workflow's own commit, not inputs.ref: this job runs build code, and a typed ref must not get to run
      # it in the default branch's context (Actions cache poisoning). The player does not depend on share's code.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the browser player
        run: ./scripts/prepare.sh && ./scripts/build.sh

      - name: Check that it runs (headless Chrome)
        run: ./scripts/smoke.sh

      - name: Hand the player to the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: player-webapp
          path: player/build/dist/js/webapp
          retention-days: 1

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Deployment:
  #
  #  - An SSH connection is required (public key must be registered on server!)
  #  - Add all credentials hidden in secrets to the configuration files
  #
  deploy:
    needs: player
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: 'Setup PHP and composer packages'
        uses: ./.github/actions/setup-php-composer

      # Built in its own job without secrets: the player build runs a lot of third-party code (Catroid's Gradle
      # build, TeaVM), which must never share a runner with the production SSH key. If it failed, deploy without it.
      - name: Download the browser player
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: player-webapp
          path: player/build/dist/js/webapp

      - name: Deploy Share
        uses: deployphp/action@v1
        with:
          private-key: ${{ secrets.DEPLOY_SHARE_SSH_KEY }}
          dep: deploy
        env:
          APP_NAME: Catroweb
          DEPLOY_GIT: https://github.com/Catrobat/Catroweb.git
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_BRANCH: ${{ inputs.ref || 'main' }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Post-deployment health check is handled by Deployer's smoke_test task
  # (deploy.php) which runs directly on the server via localhost. The previous
  # GitHub Actions-based smoketest was removed because GH runners cannot
  # reliably reach the production server (HTTP 000 / network timeout), causing
  # false-positive rollbacks on every deployment.
