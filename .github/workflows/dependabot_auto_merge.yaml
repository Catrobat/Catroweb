# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# ** Dependabot auto-merge **
#
#  `main` requires one approving review, so dependency bumps sat blocked on a human even with all checks green. Since
#  they are only ever a lock file change, and since the pipeline is what actually decides whether a bump is safe, they
#  are approved and queued for auto-merge here instead — majors included, deliberately: the pipeline is trusted to
#  decide, and a bump that breaks something breaks it visibly.
#
#  - Green is still enforced, by GitHub, not by this workflow:
#
#      `--auto` merges only once every *required* status check on the branch has succeeded. The required contexts are
#      the two `CI gate: ...` jobs plus `Development Container`, which together cover every job of every workflow. If a
#      check goes red the pull request simply stays open. Removing the required contexts from the branch protection
#      would turn this into an unconditional merge — so do not do that without removing this workflow too.
#
#  - One class of bump is skipped, because it *cannot* work rather than because it should not:
#
#      Anything touching `.github/workflows/**`. GITHUB_TOKEN is a GitHub App token, and an App may only write those
#      paths while holding the `workflows` permission — which cannot be granted in a workflow `permissions:` block at
#      all, since it is a PAT/App-install scope rather than one of the keys Actions accepts. Such a merge always failed:
#
#        GraphQL: refusing to allow a GitHub App to create or update workflow ... without `workflows` permission
#
#      With `--auto` that failure is *silent* — auto-merge stays enabled and the pull request simply never lands. Since
#      the github-actions ecosystem is polled daily here, that was a standing silent stall. Those bumps are announced
#      with `::notice::` and merged by Daniel's `/tidy` sweep, which runs with a token that holds the scope.
#
#  - Only Dependabot's own pull requests are touched. Everything else, including human dependency bumps, keeps the
#    normal review requirement.
#
#  - `pull_request_target` is deliberate:
#
#      On a `pull_request` run triggered by Dependabot the GITHUB_TOKEN is read-only, so it could neither approve nor
#      enable auto-merge. `pull_request_target` runs with the base branch's token instead. This workflow never checks
#      out the pull request, so no code from it is ever executed here — the steps only talk to the GitHub API.
#
name: 'Dependabot auto-merge'

permissions:
  contents: write
  pull-requests: write

on:
  pull_request_target:
    branches:
      - '**' # all branches

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  auto_merge:
    name: Approve and enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Skip bumps GITHUB_TOKEN may not merge
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if grep -q '^\.github/workflows/' <<< "$files"; then
            echo "::notice::#$PR_NUMBER touches .github/workflows/** — GITHUB_TOKEN cannot merge it, left for /tidy"
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Approve
        if: steps.gate.outputs.ok == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.gate.outputs.ok == 'true'
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
