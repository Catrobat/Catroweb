# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# ** User docs **
#
#  Checks the user docs (user-docs/, the guides rendered at /app/docs) when they change: front matter, links, media,
#  redirects and translations (user-docs/check.sh), and that pages a person reviewed only change with the label
#  update-reviewed. A pull request that changes only user-docs/ skips the other workflows' jobs (code-changed action).
#
name: 'User docs'

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'user-docs/**'
      - '.github/workflows/docs-check.yaml'
  push:
    branches: [main]
    paths:
      - 'user-docs/**'
      - '.github/workflows/docs-check.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: User docs [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the merge base with the base branch
          filter: blob:none
          sparse-checkout: user-docs
      - name: Pages, links and media
        run: user-docs/check.sh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      # A page with `reviewed: true` was checked by a person; changing it needs the label update-reviewed
      # (user-docs/TRANSLATING.md). A new push drops the label (docs-reviewed-label.yaml), so the label only covers the
      # commit a maintainer looked at.
      - name: Reviewed pages unchanged
        if: >-
          github.event_name == 'pull_request' && (github.event.action == 'synchronize'
          || !contains(github.event.pull_request.labels.*.name, 'update-reviewed'))
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --no-renames "$BASE"...HEAD -- 'user-docs/*.md' | while read -r f; do
            git show "$BASE:$f" 2>/dev/null | awk 'NR==1 && $0!="---" {exit} NR>1 && $0=="---" {exit} tolower($0) ~ /^reviewed: *true *$/ {r=1} END {exit !r}' && echo "$f"
          done)
          if [ -n "$changed" ]; then
            { echo "### Pages with reviewed: true changed"; echo "A maintainer adds the label update-reviewed after checking them:"; echo "$changed" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
            echo "These pages have reviewed: true on the base branch. Changing them needs the label update-reviewed:"
            echo "$changed"
            exit 1
          fi
