# Builds the browser player: Catroid's own engine at the commit in player/catroid.commit, compiled to JavaScript
# with gdx-teavm (see player/README.md). Runs when the player changes and nightly, so a Catroid develop change that
# breaks the web build shows up when we bump the pin.
name: Player

permissions:
  contents: read

on:
  pull_request:
    paths: ['player/**', '.github/workflows/player.yaml']
  push:
    branches: [main]
    paths: ['player/**', '.github/workflows/player.yaml']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: player
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 22 (runs the code view's export, as share does)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Build Catroid at the pinned commit
        run: ./scripts/prepare.sh

      - name: Compile the player
        run: ./scripts/build.sh

      - name: Smoke test (the engine runs and draws in headless Chrome)
        run: ./scripts/smoke.sh

      - name: Code view export (Catroid's catrobatTests and the fixtures show as in the app)
        run: python3 scripts/check_code_export.py build/dist/js/webapp/code-export build/catroid/catroid/src/androidTest/assets/catrobatTests fixtures

      - name: Conformance (Catroid's catrobatTests on the stage, compared with conformance.tsv)
        run: ./scripts/conformance.sh

      - name: Upload the player
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player
          path: |
            player/build/dist/js/webapp
            player/build/web/stub-report.tsv
            player/build/web/smoke.png
            player/build/web/teavm.log
            player/build/web/loader-check/page.html
            player/build/web/loader-check/chrome.log
            player/build/web/conformance/results.tsv
