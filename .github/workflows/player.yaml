# Builds the browser player: Catroid's own engine at the commit in player/catroid.commit, compiled to JavaScript
# with gdx-teavm (see player/README.md). Runs when the player changes and nightly; player-catroid-pin.yaml calls it to
# run the same checks at Catroid's develop HEAD before it proposes bumping the pin.
name: Player

permissions:
  contents: read

on:
  pull_request:
    paths: ['player/**', '.github/workflows/player.yaml']
  push:
    branches: [main]
    paths: ['player/**', '.github/workflows/player.yaml']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      catroid-commit:
        description: Catroid commit to build instead of player/catroid.commit
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: player
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Catroid at the pinned commit
        run: ./scripts/prepare.sh
        env:
          CATROID_COMMIT: ${{ inputs.catroid-commit }}

      - name: Compile the player
        run: ./scripts/build.sh

      - name: Smoke test (the engine runs and draws in headless Chrome)
        run: ./scripts/smoke.sh

      - name: Conformance (Catroid's catrobatTests on the stage, compared with conformance.tsv)
        run: ./scripts/conformance.sh

      - name: Upload the player
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player
          path: |
            player/build/dist/js/webapp
            player/build/web/stub-report.tsv
            player/build/web/smoke.png
            player/build/web/teavm.log
            player/build/web/loader-check/page.html
            player/build/web/loader-check/chrome.log
            player/build/web/conformance/results.tsv
