# The OpenAPI generator writes its constraints as docblock annotations, which Symfony's validator
# no longer reads. Constraints that must hold for generated request models live here instead.
OpenAPI\Server\Model\StudioBatchAddProjectsRequest:
  properties:
    project_ids:
      - NotNull: ~
      - All:
          - Type: string
      - Count:
          min: 1
          max: 50
