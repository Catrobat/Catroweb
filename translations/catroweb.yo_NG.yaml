privacy-policy:
  header: "Ìlànà ìpamọ́"
  version: "Ẹ̀yà 2.2, 17 Oṣù Kẹwàá 2019"
  text1: "Láti fún ọ ní gbogbo àǹfààní àwọn iṣẹ́ wa àti àkáǹtì tó jẹmọ́ wọn, ó pọndandan láti gba àwọn dátà kan lọ́wọ́ rẹ."
  text2: "Láti tọ́jú àti mú àwọn iṣẹ́ wa (áàpù àti wẹ́ẹ̀bùsáìtì) dára sí i àti láti ṣe ìwádìí ìmọ̀ sáyẹ́ǹsì lórí ẹ̀kọ́ ICT àti STEM/STEAM, a ń lo Google Analytics, Crashlytics, àti Firebase, gbogbo wọn láti ọ̀dọ̀ Google LLC (USA), àti Dynatrace láti ọ̀dọ̀ Dynatrace LLC (USA) láti gba metadata nípa lílò àwọn iṣẹ́ wa, fún àpẹẹrẹ, àlàyé jàǹbá, àkókò, àwọn ojú-ìwé/iboju tí a bẹ̀wò, lílò àwọn áàpù àti iṣẹ́ wa, ẹ̀rọ ìṣiṣẹ́ tí a lò, àti àlàyé nípa olùpèsè nẹ́tíwọ́ọ̀kì. Ìtúpalẹ̀ yìí àti dátà tí a gbà kò so mọ́ profaili rẹ, kò sì ní àlàyé ara ẹni kankan (a ń fi àwọn díjítì ìkẹyìn àdírẹ́sì IP pamọ́). Síbẹ̀, a óò gbé dátà tí a gbà lọ sọ́dọ̀ àwọn olùpèsè iṣẹ́ (Google LLC, USA àti Dynatrace LLC, USA). Ṣíṣe dátà dá lórí àdéhùn pẹ̀lú Google LLC àti Dynatrace LLC. Àjọṣe yìí pẹ̀lú àwọn olùpèsè iṣẹ́ bá Ìlànà Gbogbogbò Ààbò Dátà ti Ìṣọ̀kan Yúróòpù (EU GDPR) àti àdéhùn EU-USA \"Privacy Shield\" mu."
  text3: "Láti ṣẹ̀dá àti lo àkáǹtì nínú ètò wa, àti láti sọ fún ọ nípa àwọn àyípadà pàtàkì nípa àkáǹtì rẹ nípasẹ̀ ímeèlì, fún àpẹẹrẹ, ìmúdójúìwọ̀n tàbí rírú Àwọn Òfin Lílò àti Iṣẹ́ wa, àwọn òfin àwùjọ wa, tàbí àwọn ìlànà wa, a óò tọ́jú orúkọ olùmúlò rẹ àti, tí o bá pèsè rẹ̀, àdírẹ́sì ímeèlì rẹ. Tí o bá so àkáǹtì rẹ pọ̀ nípasẹ̀ Google Plus tàbí Facebook, a tún ń tọ́jú kọ́kọ́rọ́ ìdánimọ̀ tó so mọ́ àkáǹtì rẹ lórí àwọn iṣẹ́ wọ̀nyí. A kò ní lo dátà yìí fún èrò mìíràn (fún àpẹẹrẹ, ìpolówó), àyàfi tí o bá fún wa ní àṣẹ ní kedere."
  text4: "Tí o bá fẹ́, o lè fún wa ní orílẹ̀-èdè tí o ń gbé nípasẹ̀ ojú-ìwé àkáǹtì rẹ lórí ojú-òpó pínpín. Èyí yóò hàn lórí profaili gbangba rẹ, a ó sì lò ó fún ìṣirò àti ìwádìí nìkan. O lè yọ ọ́ kúrò nígbàkúùgbà nínú ètò profaili rẹ."
  text5: "O lè fagilé lílò dátà ara ẹni tó jẹ́ ti àkáǹtì rẹ nígbàkúùgbà nípa pípa àkáǹtì rẹ rẹ́ nípasẹ̀ ojú-ìwé profaili rẹ lórí https://share.catrob.at/. Lẹ́yìn pípa àkáǹtì rẹ rẹ́, o ṣì lè lo àwọn iṣẹ́ tí a pèsè, ṣùgbọ́n o kò ní lè kópa, fún àpẹẹrẹ, nípa gbígbé ètò sókè, sísọ àsọyé, tàbí fífẹ́ràn. Bákan náà, a óò pa gbogbo àkóónú tó so mọ́ àkáǹtì rẹ rẹ́, fún àpẹẹrẹ, àwọn ètò tí a gbé sókè, àsọyé, abbl."
  text6: "Láti yàgò fún ìlòkulò àwọn iṣẹ́ wa, fún àpẹẹrẹ, nípasẹ̀ ohun tí olùmúlò gbé sókè tàbí àsọyé fún èrò tí kò bófin mu, a óò tọ́jú gbogbo dátà gbangba tí olùmúlò ṣẹ̀dá (ohun tí a gbé sókè, àsọyé) sínú ibi ìpamọ́ dátà inú, pẹ̀lú àkókò àti àdírẹ́sì íńtánẹ́ẹ̀tì tí a lò. A kò ní lo dátà yìí tàbí fi ránṣẹ́ sí ilé-iṣẹ́ kankan, àyàfi tí a bá fura sí ìwà tí kò bófin mu tó, tí àwọn ilé-iṣẹ́ òfin tó ní àṣẹ sì béèrè fún un gẹ́gẹ́ bí òfin. A óò kọ́kọ́ ṣàyẹ̀wò ọ̀rọ̀ kọ̀ọ̀kan dáadáa."
  text7: "O lè forúkọ sílẹ̀ fún Ìwé Ìròyìn Catrobat tí o bá fẹ́, lórí https://catrob.at/newsletter tí a pèsè nípasẹ̀ iṣẹ́ MailChimp (The Rocket Science Group LLC d/b/a MailChimp, USA). Ìwọ yóò máa gba ìròyìn nípa iṣẹ́ àkànṣe Catrobat àti àwọn iṣẹ́ rẹ̀ sí àdírẹ́sì ímeèlì tí o pèsè. O lè dẹ́kun gbígba ìwé ìròyìn náà nígbàkúùgbà nípa lílo ìjápọ̀ \"unsubscribe\" ní ìsàlẹ̀ ìwé ìròyìn kọ̀ọ̀kan. MailChimp ló ń pèsè ìwé ìròyìn yìí, a sì ní àdéhùn ṣíṣe dátà pẹ̀lú wọn, wọ́n sì ti fi ara wọn jì fún Ìlànà Gbogbogbò Ààbò Dátà EU àti EU-USA \"Privacy Shield\". Fún àlàyé síwájú sí i nípa MailChimp, jọ̀wọ́ wo Ìlànà Ìpamọ́ àti Òfin Lílò MailChimp."
  text8: "Gbogbo Iṣẹ́ ni iṣẹ́ àkànṣe Catrobat orísun ṣíṣí ọ̀fẹ́ ń pèsè lábẹ́ International Catrobat Association – Verein zur Förderung freier Software, NGO tí kì í ṣe fún èrè tí a dá sílẹ̀ ní Graz, Austria (Ìṣọ̀kan Yúróòpù). Àwọn ìlànà wa bọ̀wọ̀ fún òfin ààbò dátà EU àti Austria (GDPR). Láti kàn sí wa, jọ̀wọ́ fi ímeèlì ránṣẹ́ sí contact@catrobat.org tàbí kọ lẹ́tà sí Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Ìṣọ̀kan Yúróòpù)."
  text9: "Tí o kò bá tíì pé ọmọ ọdún 14, alágbàtọ́ lábẹ́ òfin (nígbà púpọ̀ òbí) gbọ́dọ̀ gba ìlànà yìí."
  text10: "Ìlànà ìpamọ́ èdè Gẹ̀ẹ́sì ti Catrobat wà lórí wẹ́ẹ̀bù ní %privacy_policy%."
  disagree-text: "Láìsí ìfọwọ́sí, a kò lè ṣẹ̀dá àkáǹtì, ṣùgbọ́n àwọn ẹ̀yà pàtàkì ṣì wà ní àrọ́wọ́tó."
