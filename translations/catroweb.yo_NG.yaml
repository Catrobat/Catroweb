licenseToPlay:
  link: "Ìwé àṣẹ láti ṣeré"
  title: "Ìwé àṣẹ láti ṣeré - Fún ní ìdúpẹ́ kí o sì pín"
  text1: "Fojú inú wò ó pé iṣẹ́ Catrobat kọ̀ọ̀kan jẹ́ kéèkì, kéèkì àrà ọ̀tọ̀ kan tó wá pẹ̀lú ìlànà sísè rẹ̀ (àwọn búlọ́ọ̀kù ìṣètò). Gbogbo ọmọ ẹgbẹ́ àwùjọ Catrobat ń pín kéèkì wọn pẹ̀lú ìlànà sísè wọn. Èyí túmọ̀ sí pé o lè gbádùn àwọn kéèkì náà kí o sì kọ́ bí o ṣe lè ṣe wọ́n fúnra rẹ!"
  text2: "Kò sí ìlànà sísè àṣírí: ìtọ́sọ́nà bí a ṣe ń ṣe àwọn kéèkì wọ̀nyí ṣí sílẹ̀ fún ẹnikẹ́ni láti lò, tún lò, yí padà, kí ó sì jẹ́ ìmísí fún èrò tuntun... mo ní kéèkì."
  text3: "O lè jẹ àwọn kéèkì náà, o sì lè da ìlànà sísè àwọn ẹlòmíràn kọ láti ṣe tìrẹ, bóyá pẹ̀lú èròjà mìíràn. Òmìnira yìí wá pẹ̀lú ohun méjì tí ó rọrùn:"
  text4: "Nígbà tí a ń dá àwùjọ Catrobat sílẹ̀, a pinnu láti gba ọ̀nà yìí nítorí a gbàgbọ́ pé ó ń ṣe àtìlẹ́yìn fún ẹ̀kọ́ àti àtinúdá nínú àwùjọ. Nípa pínpín ìlànà sísè àti èròjà (ìwé àfọwọ́kọ àti iṣẹ́ ọnà), àwọn ènìyàn lè kọ́ lé èrò ara wọn, gbogbo ènìyàn yóò sì jàǹfààní."
  text5: "Nígbà tí a ń ṣe ọ̀nà wẹ́ẹ̀bùsáìtì Catrobat, a fi àwọn ẹ̀yà kún un láti gba àwọn ènìyàn níyànjú láti pín àti láti dúpẹ́ lọ́wọ́ àwọn ẹlòmíràn. Lórí ojú-ìwé iṣẹ́ kọ̀ọ̀kan, o lè máa ṣe ìgbàsílẹ̀ ìwé àfọwọ́kọ àtilẹ̀wá iṣẹ́ náà nígbà gbogbo. Tí o bá tún iṣẹ́ kan ṣe (yí ìwé àfọwọ́kọ tàbí iṣẹ́ ọnà padà, kí o sì pín àbájáde rẹ̀), a gbà ọ́ níyànjú láti dúpẹ́ nínú àkọsílẹ̀ iṣẹ́ náà, kí o dárúkọ àwọn ènìyàn àti iṣẹ́ tó fún ọ ní ìmísí."
  text6: "Kọ́ síwájú sí i nípa àwọn òfin lílò àwùjọ orí ayélujára Catrobat lórí %link-termsOfUse%."
  list1:
    item1: "pín àwọn kéèkì rẹ pẹ̀lú ìlànà sísè wọn"
    item2: "dúpẹ́ lọ́wọ́ àwọn tó fún ọ ní ìmísí"
  version: "Ẹ̀yà 1.1, 2 Oṣù Kẹrin 2013"
termsOfUse:
  title: "Àwọn Òfin Lílò"
  headline: "Káàbọ̀ sí àwùjọ Catrobat!"
  text1: "Gẹ́gẹ́ bí apá kan àwùjọ Catrobat, ò ń pín àwọn iṣẹ́ àti èrò pẹ̀lú àwọn ènìyàn:"
  text2: "A nílò ìrànlọ́wọ́ rẹ láti sọ àwùjọ yìí di ibi àtìlẹ́yìn fún gbogbo ọmọ ẹgbẹ́. Báyìí ni o ṣe lè ṣèrànlọ́wọ́:"
  text3: "Nípasẹ̀ iṣẹ́ àkànṣe Catrobat, a fẹ́ gbé ìfọwọ́sowọ́pọ̀ lárugẹ kí a sì jẹ́ kí àtinúdá gbogbo ènìyàn papọ̀ fún àǹfààní gbogbo ọmọ aráyé. Ìwọ náà lè di ọmọ ẹgbẹ́ aláàpọn nínú àwùjọ Catrobat nípa fífi àwọn iṣẹ́ rẹ fún àwùjọ gẹ́gẹ́ bí ẹ̀bùn, bí àwọn ọmọ ẹgbẹ́ aláàpọn mìíràn ṣe ń fi àwọn iṣẹ́ wọn fún ọ:"
  text4: "Ẹ̀bùn wa fún ọ:"
  text5: "Àwọn Òfin Lílò àti Iṣẹ́ wa:"
  list1:
    item1: "láti oríṣiríṣi orílẹ̀-èdè àti àṣà"
    item2: "ti gbogbo ọjọ́ orí (láti ọmọ kékeré dé ọ̀dọ́ àti àwọn bàbá àgbà àti ìyá àgbà)"
    item3: "pẹ̀lú gbogbo ìpele ìrírí"
  list2:
    item1: "Ní ọ̀wọ̀. Nígbà tí o bá ń pín àwọn iṣẹ́, jọ̀wọ́ rántí pé àwọn ènìyàn oríṣiríṣi ọjọ́ orí àti ìpìlẹ̀ ni yóò rí ohun tí o fi kún un."
    item2: "Fún ní ìdúpẹ́. Lómìnira láti ṣe ẹ̀yà tí a yí padà ti iṣẹ́ àwọn ẹlòmíràn - kàn rí i dájú pé o dúpẹ́ lọ́wọ́ wọn. Ibi kan láti dúpẹ́ ni apá àkọsílẹ̀ àti ìdúpẹ́ iṣẹ́ rẹ. Jọ̀wọ́ wo ìpínrọ̀ tó wà nísàlẹ̀ àtòjọ yìí fún àlàyé nípa yíyí àwọn iṣẹ́ olùmúlò mìíràn padà."
    item3: "Jẹ́ olóòótọ́. Má ṣe díbọ́n pé o jẹ́ ẹlòmíràn tàbí gbìyànjú láti tan àwùjọ jẹ."
    item4: "Pa àlàyé ara ẹni mọ́ ní àdáni. Má ṣe pín àdírẹ́sì ímeèlì rẹ, nọ́mbà fóònù, tàbí àlàyé ìkànsí ara ẹni mìíràn."
    item5: "Ṣèrànlọ́wọ́ láti jẹ́ kí ojú-òpó náà jẹ́ ọ̀rẹ́. Tí o bá rò pé àwọn ẹlòmíràn yóò rí iṣẹ́ tàbí àsọyé kan bí ìkà, ẹ̀gàn, ìwà ipá jù, tàbí èyí tí kò yẹ, kàn tẹ bọ́tìnnì 'jábọ̀ pé kò yẹ' kí o sì fi àlàyé kúkúrú sílẹ̀. Ẹgbẹ́ Catrobat yóò ṣàyẹ̀wò ìròyìn rẹ, wọ́n sì lè yọ iṣẹ́, àsọyé, tàbí ìfiránṣẹ́ èyíkéyìí kúrò."
  list3:
    item1: "Nípa gbígbé iṣẹ́ kan sókè sí àwọn wẹ́ẹ̀bùsáìtì wa, o gbà láti fi iṣẹ́ yìí sábẹ́ àwọn ìwé àṣẹ ọ̀fẹ́ kan fún àwọn iṣẹ́ Catrobat tí a gbé sókè. Bí àwọn ìwé àṣẹ ọ̀fẹ́ tí ètò Catrobat fúnra rẹ̀ fi wà fún ọ, àwọn ìwé àṣẹ ọ̀fẹ́ wọ̀nyí fún gbogbo ènìyàn ní ẹ̀tọ́ láti kọ́ láti inú iṣẹ́ tí àwọn ẹlòmíràn ti gbé sókè tẹ́lẹ̀, kí wọ́n sì ṣe àtúnṣe rẹ̀ láti kọ́ eré tuntun tó fani mọ́ra, eré ìdárayá àwòrán, àti àwọn iṣẹ́ mìíràn. Èyí jẹ́ kí gbogbo ènìyàn 'dúró lé èjìká àwọn ẹgbẹ́ wọn', ọ̀kan nínú wọn sì ni ìwọ! Iṣẹ́ rẹ yóò ṣe gbogbo ayé láǹfààní, yóò sì wà ní ọ̀fẹ́ fún gbogbo ènìyàn láti lò, bí ọ̀rọ̀ àti àwòrán tí àwọn olùyọ̀ǹda láti gbogbo àgbáyé fi fún Wikipedia lọ́fẹ̀ẹ́. Rò ó bí ẹ̀bùn rẹ fún ọmọ aráyé: o fún gbogbo ènìyàn, gbogbo àwọn tó gbé iṣẹ́ wọn sókè sí àwọn wẹ́ẹ̀bùsáìtì wa sì fún ọ. Nítorí náà iṣẹ́ tí a gbé sókè jẹ́ ẹ̀bùn tó ní iye ńlá tí olúwa rẹ̀ ń fún ọ lọ́fẹ̀ẹ́, pẹ̀lú àdéhùn pé o kópa nínú àwùjọ lórí òfin kan náà."
    item2: "O kò ní láti gba ẹ̀bùn náà; tí o bá gbà á, àwọn òfin kan yóò wúlò. Àǹfààní àwọn òfin wọ̀nyí ni pé o lè kọ́ láti inú iṣẹ́ náà kí o sì kọ́ lé e láti ṣe ohun tó dára jù fúnra rẹ, èyí tí o lè, fún àpẹẹrẹ, tún gbé sókè sí àwọn wẹ́ẹ̀bùsáìtì wa gẹ́gẹ́ bí tìrẹ. Àǹfààní mìíràn ni pé àwọn ìwé àṣẹ wọ̀nyí rí i dájú pé a kò lè dá ọ lẹ́bi fún ìṣòro èyíkéyìí tó bá ṣẹlẹ̀ sí àwọn ẹlòmíràn nípa lílò iṣẹ́ rẹ."
    item3: "Àdéhùn pàtàkì mìíràn ni pé o gbọ́dọ̀ dárúkọ àwọn òǹkọ̀wé tí o gbé iṣẹ́ rẹ ka iṣẹ́ wọn ní kedere. Ní àkókò kan náà, a óò ṣiṣẹ́ takuntakun kí àwọn ẹlòmíràn lè mọrírì pé ìwọ ló fi iṣẹ́ rẹ kún un, nípa dídárúkọ orúkọ àrà ọ̀tọ̀ tí o yàn láti ṣojú rẹ nínú àwùjọ Catrobat, àti nípa fífún àwọn ẹlòmíràn ní àǹfààní láti fi ìmọrírì wọn hàn sí ọ ní gbangba fún fífi iṣẹ́ rẹ fún gbogbo ènìyàn, àti fún wọn ní pàtàkì."
    item4: "Jọ̀wọ́ wo %link-licenseUploaded% fún àwọn òfin àti àdéhùn òfin pàtó."
  list4:
    item1: "A ń fún ọ ní gbogbo sọ́fítíwọ̀ọ̀ àti ohun èlò Íńtánẹ́ẹ̀tì tiwa tó jẹmọ́ ètò Catrobat, fún àpẹẹrẹ, sọ́fítíwọ̀ọ̀ tí ẹgbẹ́ Catrobat kọ, àwọn wẹ́ẹ̀bùsáìtì àti ohun èlò Íńtánẹ́ẹ̀tì wa, kóòdù orísun wa tó jẹmọ́ ètò Catrobat, àti gbogbo ohun èlò àfikún bí àwòrán, ohùn, àti ọ̀rọ̀, nísinsìnyí àti lọ́jọ́ iwájú, lábẹ́ àwọn ìwé àṣẹ ọ̀fẹ́ Catrobat."
    item2: "Àwọn ìwé àṣẹ wọ̀nyí jẹ́ kí gbogbo apá Catrobat jẹ́ ọ̀fẹ́ fún ọ, láìsanwó àti ní ti òmìnira láti lò wọ́n bí o ṣe fẹ́, pẹ̀lú ìdíwọ̀n díẹ̀ péré tó ń rí i dájú, lára àwọn mìíràn, pé ètò Catrobat yóò wà ní ọ̀fẹ́ àti wúlò fún gbogbo ènìyàn títí láé."
    item3: "Jọ̀wọ́ wo %link-licenseToPlay% fún àwọn òfin àti àdéhùn òfin pàtó. Kóòdù orísun ètò Catrobat àti ọ̀pọ̀ ìwé àti ohun èlò mìíràn wà nípasẹ̀ %link-developer%."
  list5:
    item1: "Tí ìwọ, tàbí, tí o kò bá tíì pé ọmọ ọdún 13, àwọn òbí tàbí alágbàtọ́ rẹ, bá jẹmọ́ àjọ kan tó ń kópa nínú tàbí tó ń ṣe ìrúfin ìpamọ́ oníàwọ̀n àti/tàbí ìṣọ́ ènìyàn lọ́pọ̀lọpọ̀, a kò gbà ọ́ láàyè láti lo àwọn áàpù sọ́fítíwọ̀ọ̀ wa tàbí láti wọ àwọn iṣẹ́ wa. Àlàyé pàtó ìdíwọ̀n yìí àti àwọn àyàfi kan wà ní Apá 4.a àti 4.b lórí %link-termsOfUse% wa."
    item2: "Tí o kò bá tíì pé ọmọ ọdún 13, o ní láti béèrè lọ́wọ́ àwọn òbí tàbí alágbàtọ́ rẹ bóyá wọ́n gbà ọ́ láàyè láti lo Àwọn Áàpù Sọ́fítíwọ̀ọ̀ àti Iṣẹ́ Catrobat."
    item3: "A ní ẹ̀tọ́ láti kọ̀, pa rẹ́, tàbí fi pamọ́ àwọn iṣẹ́, àkáǹtì olùmúlò, àti ohun èlò díjítà èyíkéyìí tí a gbé sókè sí àwọn wẹ́ẹ̀bùsáìtì Catrobat nígbàkúùgbà gẹ́gẹ́ bí a ṣe pinnu, fún àpẹẹrẹ tí a bá rí i pé iṣẹ́ kan ní ohun èlò tí kò yẹ tàbí pé olùmúlò kan ń rú ẹ̀tọ́ àwọn ẹlòmíràn."
    item4: "A ń fún ọ ní gbogbo sọ́fítíwọ̀ọ̀ àti ohun èlò Íńtánẹ́ẹ̀tì Catrobat pẹ̀lú ìrètí pé wọn yóò wúlò, ṣùgbọ́n láìsí ìdánilójú kankan."
    item5: "Jọ̀wọ́ wo %link-termsOfUse% wa developer.catrobat.org/terms_of_use_and_service fún àlàyé pàtó àwọn kókó òkè yìí àti àwọn òfin àti àdéhùn òfin àfikún."
  bottom1: "Máa padà wá wo ibí láti ìgbà dé ìgbà, nítorí à ń gbìyànjú nígbà gbogbo láti mú Àwọn Òfin Lílò wa dára sí i."
  bottom2: "Jọ̀wọ́ fi àbá èyíkéyìí nípa Àwọn Òfin Lílò wọ̀nyí ránṣẹ́ sí %email-webmaster%."
