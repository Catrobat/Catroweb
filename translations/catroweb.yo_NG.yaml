  subject: "Ìgbàpadà ọ̀rọ̀ aṣínà Catrobat rẹ"
  message: "%username% ọ̀wọ́n.\nO béèrè láti tún ọ̀rọ̀ aṣínà rẹ ṣe lórí %appplication_url% nítorí pé o gbàgbé ọ̀rọ̀ aṣínà rẹ.\nTí kì í bá ṣe ìwọ ló béèrè èyí, jọ̀wọ́ fojú fò ó. Yóò parí, kò sì ní wúlò mọ́ lẹ́yìn wákàtí 24.\nLáti tún ọ̀rọ̀ aṣínà rẹ ṣe kí o sì ṣẹ̀dá tuntun, jọ̀wọ́ lọ sí ojú-ìwé yìí: %confirmationUrl%\nO lè lo orúkọ olùmúlò àti ọ̀rọ̀ aṣínà rẹ nígbàkúùgbà láti wọ àwùjọ %appplication_url%.\nLáti ṣe bẹ́ẹ̀, kàn lọ sí ojú-ìwé yìí: %loginPage%\nLáti ṣàtúnkọ àlàyé profaili rẹ, lọ sí ojú-ìwé yìí: %profilePage%\nÌkíni tó dára jùlọ,\nẸgbẹ́ Catrobat rẹ.\n"
