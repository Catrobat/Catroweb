consent:
  email:
    subject: "A nílò ìfọwọ́sí òbí fún àkáǹtì Catrobat ọmọ rẹ"
    title: "A Nílò Ìfọwọ́sí Òbí"
    greeting: "Pẹ̀lẹ́ o,"
    message: "Ọmọ rẹ %username% ti ṣẹ̀dá àkáǹtì lórí Catrobat, ó sì ti jẹ́rìí àdírẹ́sì ímeèlì rẹ̀."
    explanation: "Catrobat jẹ́ pẹpẹ ẹ̀kọ́ ọ̀fẹ́ níbi tí àwọn ọ̀dọ́ ti ń kọ́ ìṣètò kọ̀ǹpútà nípa ṣíṣẹ̀dá áàpù, eré, àti eré ìdárayá àwòrán. Lábẹ́ ìlànà ààbò ọmọdé ti EU, a nílò ìfọwọ́sí rẹ kí ọmọ rẹ tó lè kópa ní kíkún nínú àwùjọ. Jọ̀wọ́ tẹ bọ́tìnnì ìsàlẹ̀ yìí láti fún wa ní ìfọwọ́sí."
    button: "Fún Ìfọwọ́sí Òbí"
    ignore: "Tí o kò bá retí ímeèlì yìí, o lè fojú fò ó láìléwu. Láìsí ìfọwọ́sí, àkáǹtì náà yóò ní iṣẹ́ tó lópin."
    whatIsCatrobat: "Catrobat jẹ́ pẹpẹ ẹ̀kọ́ ìṣètò kọ̀ǹpútà ọ̀fẹ́ tí kì í ṣe fún èrè. Kọ́ síwájú sí i ní catrobat.org."
    manageLink: "O lè ṣàkóso àkáǹtì ọmọ rẹ nígbàkúùgbà nípasẹ̀ <a href=\"%portalUrl%\" style=\"color: #00acc1;\">Ẹnu-ọ̀nà Òbí</a> wa. Kọ́ síwájú sí i nípa <a href=\"%infoUrl%\" style=\"color: #00acc1;\">ẹ̀tọ́ rẹ gẹ́gẹ́ bí òbí</a>."
  confirmed:
    title: "A Ti Fún Ní Ìfọwọ́sí"
    message: "O ṣé! Àkáǹtì %username% ti ṣiṣẹ́ ní kíkún báyìí."
    continueButton: "Ṣàwárí àwọn iṣẹ́"
parent:
  footer:
    link: "Àwọn Òbí & Alágbàtọ́"
  info:
    title: "Àlàyé fún Àwọn Òbí & Alágbàtọ́"
    intro: "Catrobat ka ààbò àti ìpamọ́ àwọn ọ̀dọ́ olùmúlò sí pàtàkì. Ojú-ìwé yìí ṣàlàyé bí a ṣe ń dáàbò bo ọmọ rẹ àti ẹ̀tọ́ tí o ní."
    whatIsCatrobat:
      title: "Kí ni Catrobat?"
      text: "Catrobat jẹ́ pẹpẹ ẹ̀kọ́ ọ̀fẹ́ tí kì í ṣe fún èrè, níbi tí àwọn ọ̀dọ́ ti ń kọ́ ìṣètò kọ̀ǹpútà nípa ṣíṣẹ̀dá áàpù, eré, àti eré ìdárayá àwòrán tiwọn. Pẹpẹ náà wà káàkiri àgbáyé, a sì ń lò ó ní àwọn ibi ẹ̀kọ́."
    dataCollected:
      title: "Dátà wo ni a ń gbà?"
      text: "A ń gba dátà tó kéré jùlọ tí a nílò láti ṣiṣẹ́ pẹpẹ náà: orúkọ olùmúlò, àdírẹ́sì ímeèlì, ọjọ́ ìbí, àti àwọn iṣẹ́ tí ọmọ rẹ ṣẹ̀dá tí ó sì gbé sókè. Fún àwọn olùmúlò tí kò tíì pé ọmọ ọdún 14, a tún ń tọ́jú àdírẹ́sì ímeèlì òbí/alágbàtọ́ fún ìdí ìfọwọ́sí. A kì í ta tàbí pín dátà ara ẹni pẹ̀lú ẹnikẹ́ta."
    yourRights:
      title: "Ẹ̀tọ́ rẹ gẹ́gẹ́ bí òbí tàbí alágbàtọ́"
      text: "Lábẹ́ ìlànà ààbò ọmọdé ti EU (GDPR) àti COPPA, o ní ẹ̀tọ́ láti: ṣàyẹ̀wò dátà tí a ní nípa ọmọ rẹ, béèrè ẹ̀dà dátà náà, fagilé ìfọwọ́sí rẹ nígbàkúùgbà (èyí tí yóò dín àkáǹtì náà kù), àti béèrè pípa àkáǹtì ọmọ rẹ àti gbogbo dátà tó jẹmọ́ rẹ̀ rẹ́ pátápátá."
    minorRestrictions:
      title: "Àwọn ìdíwọ̀n wo ló kan àkáǹtì àwọn ọmọdé?"
      text: "Àwọn olùmúlò tí kò tíì pé ọmọ ọdún 16 kò lè fi àsọyé ránṣẹ́ tàbí kà á, tẹ̀lé àwọn olùmúlò mìíràn, tàbí wo àkóónú tí a sàmì sí pé kò yẹ fún ọmọdé. Wọ́n ṣì lè ṣẹ̀dá àti gbé àwọn iṣẹ́ sókè, wo àwọn iṣẹ́ gbangba, kí wọ́n sì hùwà sí àwọn iṣẹ́ pẹ̀lú ìfẹ́ràn. Àwọn ìdíwọ̀n yìí wà láti pèsè àyíká ẹ̀kọ́ tó ní ààbò."
    manageButton: "Ṣàkóso Àkáǹtì Ọmọ Rẹ"
  portal:
    title: "Ẹnu-ọ̀nà Òbí"
    description: "Tẹ àdírẹ́sì ímeèlì rẹ láti gba ìjápọ̀ tó ní ààbò fún ṣíṣàkóso àkáǹtì Catrobat ọmọ rẹ. A óò fi ìjápọ̀ náà ránṣẹ́ sí àdírẹ́sì ímeèlì tí o pèsè nígbà ìforúkọsílẹ̀."
