licenseToPlay:
  link: 'Licencë për të luajtur'
  title: 'Licencë për të luajtur - Jep merita dhe ndaje'
  text1: Imagjino që çdo projekt Catrobat është një ëmbëlsirë, një ëmbëlsirë shumë e veçantë që vjen me recetën e saj (blloqet e programimit). Të gjithë anëtarët e komunitetit Catrobat i ndajnë ëmbëlsirat e tyre bashkë me recetat. Kjo do të thotë që mund t'i shijosh ëmbëlsirat dhe të mësosh si t'i bësh vetë!
  text2: 'Nuk ka receta sekrete: udhëzimet se si t''i bësh këto ëmbëlsira janë të hapura për këdo që t''i përdorë, ripërdorë, modifikojë dhe t''i marrë si frymëzim për ide të reja ... dua të them ëmbëlsira. '
  text3: "Mund të hash ëmbëlsirat, si dhe të kopjosh recetat e njerëzve të tjerë për të bërë të tuat, ndoshta me përbërës të ndryshëm. Kjo liri vjen me dy kërkesa të thjeshta: "
  text4: "Në krijimin e komunitetit Catrobat, ne vendosëm të miratojmë këtë qasje pasi besojmë se ajo mbështet mësimin dhe kreativitetin brenda komunitetit. Duke ndarë recetat dhe përbërësit (skriptet dhe vepra arti), njerëzit mund të ndërtojnë mbi idetë e njëri -tjetrit dhe të gjithë do të përfitojnë. "
  text5: Gjatë projektimit të faqes së Catrobat, përfshimë veçori që i nxisin njerëzit të ndajnë dhe t'u japin merita të tjerëve. Në faqen e çdo projekti mund t'i shkarkosh gjithmonë skriptet origjinale të projektit. Nëse ripërzien një projekt (duke modifikuar skriptet ose veprat e artit dhe duke ndarë rezultatin), të inkurajojmë të japësh merita te shënimet e projektit, duke përmendur njerëzit dhe projektin që të frymëzuan.
  text6: 'Mëso më shumë rreth kushteve të përdorimit të komunitetit online të Catrobat në %link-termsOfUse%.'
  list1:
    item1: ndaj ëmbëlsirat e tua së bashku me recetën
    item2: jepu merita atyre që të frymëzuan
  version: Versioni 1.1, 2 prill 2013
termsOfUse:
  title: Kushtet e përdorimit
  headline: Mirë se vjen në komunitetin Catrobat!
  text1: 'Si pjesë e komunitetit Catrobat, ti ndan projekte dhe ide me njerëz:'
  text2: "Kemi nevojë për ndihmën tënde që ky komunitet të jetë një vend mbështetës për çdo anëtar. Ja si mund të ndihmosh: "
  text3: "Përmes projektit Catrobat duam të nxisim bashkëpunimin dhe ta lejojmë kreativitetin e të gjithëve të bashkohet për të mirën e gjithë njerëzimit. Edhe ti mund të bëhesh anëtar aktiv i komunitetit Catrobat duke ia dhuruar projektet e tua komunitetit, në të njëjtën mënyrë si anëtarët e tjerë aktivë të dhurojnë ty projektet e tyre:"
  text4: 'Dhurata jonë për ty:'
  text5: 'Kushtet tona të përdorimit dhe shërbimi:'
  list1:
    item1: prej shumë shteteve dhe kulturave të ndryshme
    item2: të të gjitha moshave (prej fëmijëve të vegjël deri te gjyshërit)
    item3: me të gjitha nivelet e përvojës
  list2:
    item1: Ji i respektueshëm. Kur ndan projekte, të lutem mos harro që kontributet e tua do t'i shohin njerëz të moshave dhe prejardhjeve shumë të ndryshme.
    item2: "Jep merita. Mund të bësh pa problem versione të modifikuara të projekteve të njerëzve të tjerë - vetëm sigurohu t'u japësh merita. Një vend për të dhënë merita është seksioni i shënimeve dhe falënderimeve të projektit tënd. Të lutem shiko paragrafin poshtë kësaj liste me pika për detaje rreth modifikimit të projekteve të përdoruesve të tjerë."
    item3: "Ji i sinqertë. Mos pretendo të jesh dikush tjetër dhe mos u përpiq të mashtrosh komunitetin. "
    item4: "Mbaji të dhënat personale private. Mos e ndaj adresën tënde të emailit, numrin e telefonit ose informacione të tjera personale të kontaktit."
    item5: "Ndihmo që faqja të mbetet miqësore. Nëse mendon se të tjerët do ta gjenin një projekt ose koment të keq, fyes, tepër të dhunshëm ose ndryshe të papërshtatshëm, thjesht kliko butonin 'raporto si të papërshtatshëm' dhe lër një shpjegim të shkurtër. Ekipi i Catrobat do ta shqyrtojë raportin tënd dhe mund të heqë çdo projekt, koment ose postim."
  list3:
    item1: "Duke ngarkuar një projekt në faqet tona, pranon dhe bie dakord ta vendosësh këtë punë nën disa licenca të lira për projektet Catrobat të ngarkuara. Ngjashëm me licencat e lira nën të cilat të ofrohet vetë sistemi Catrobat, këto licenca të lira u japin të gjithëve të drejtën të mësojnë nga puna e ngarkuar më parë nga të tjerët dhe ta përshtatin e ripërziejnë atë për të ndërtuar lojërat, animacionet dhe projektet e tyre të reja magjepsëse. Kjo i lejon të gjithë të 'qëndrojnë mbi supet e shokëve', dhe një prej tyre je ti! Kështu puna jote do t'i sjellë dobi gjithë botës dhe do të mbetet e lirë për t'u përdorur nga të gjithë, pak a shumë si tekstet dhe fotot që vullnetarë nga e gjithë bota i kontribuojnë lirisht në Wikipedia. Mendoje si dhuratën tënde për njerëzimin: ti u jep të gjithëve dhe të gjithë të tjerët që ngarkojnë punën e tyre në faqet tona të japin ty. Pra, një projekt i ngarkuar është një dhuratë me vlerë të madhe që pronari i tij ta jep falas, me kushtin që të marrësh pjesë në komunitet me të njëjtat kushte."
    item2: Nuk je i detyruar ta pranosh dhuratën; nëse e pranon, vlejnë disa rregulla. Përfitimi i këtyre rregullave është që mund të mësosh nga puna dhe të ndërtosh mbi të për të bërë vetë gjëra edhe më interesante, të cilat mund t'i ngarkosh p.sh. përsëri në faqet tona si punën tënde. Një përfitim tjetër është që këto licenca sigurojnë që ti të mos mbash përgjegjësi për problemet që mund t'u lindin të tjerëve nga përdorimi i projektit tënd.
    item3: "Një kusht shtesë i rëndësishëm është që t'ua atribuosh qartë autorëve veprat mbi të cilat ke bazuar punën tënde. Në të njëjtën kohë, ne do të punojmë shumë që puna jote t'i atribuohet qartë nga të tjerët, duke përdorur emrin unik që ke zgjedhur për të të përfaqësuar në komunitetin Catrobat, dhe duke u dhënë të tjerëve mundësinë të shprehin publikisht mirënjohjen e tyre ndaj teje që ua ke dhënë punën tënde të gjithëve, dhe veçanërisht atyre. "
    item4: 'Të lutem konsultohu me %link-licenseUploaded% për termat dhe kushtet e sakta ligjore'
  list4:
    item1: "Ne të ofrojmë ty, tani dhe në të ardhmen, nën licencat e lira të Catrobat të gjithë softuerin tonë dhe burimet e internetit që lidhen me sistemin Catrobat, p.sh. softuerin e shkruar nga ekipi i Catrobat, faqet tona të internetit dhe burimet e internetit, kodin tonë burimor që lidhet me sistemin Catrobat dhe të gjitha materialet shtesë të përfshira, si p.sh. fotot, tingujt dhe tekstet."
    item2: Këto licenca i bëjnë të gjitha pjesët e Catrobat falas për ty, por edhe të lira në kuptimin që të japin lirinë t'i përdorësh si të duash, me vetëm disa kufizime që sigurojnë, ndër të tjera, që sistemi Catrobat të mbetet përgjithmonë i lirë dhe i dobishëm për të gjithë.
    item3: 'Të lutem konsultohu me %link-licenseToPlay% për termat dhe kushtet e sakta ligjore. Kodi burimor i sistemit Catrobat si dhe shumë dokumente dhe burime të tjera janë në dispozicion përmes %link-developer%.'
  list5:
    item1: 'Nëse ti, ose, nëse je nën 13 vjeç, prindërit ose kujdestarët e tu ligjorë, jeni të lidhur me një organizatë të përfshirë ose përgjegjëse për shkelje të privatësisë të tipit dragnet dhe/ose për mbikëqyrje masive, atëherë nuk të lejohet të përdorësh aplikacionet tona softuerike dhe të hysh në shërbimet tona. Detajet e sakta të këtij kufizimi dhe disa përjashtime prej tij përcaktohen në Seksionet 4.a dhe 4.b te %link-termsOfUse% tona.'
    item2: Nëse je nën 13 vjeç, duhet të pyesësh prindërit ose kujdestarët e tu ligjorë nëse të lejojnë të përdorësh aplikacionet softuerike dhe shërbimet e Catrobat.
    item3: "Ne rezervojmë të drejtën të refuzojmë, fshijmë ose fshehim projekte, llogari përdoruesish dhe çdo material dixhital të ngarkuar në faqet e Catrobat në çdo kohë sipas gjykimit tonë të vetëm, për shembull nëse zbulojmë që një projekt përmban material të papërshtatshëm ose që një përdorues shkel të drejtat e personave të tjerë."
    item4: "Të gjitha resorset e softuerit dhe internetit të Catrobat ofrohen me shpresën se do të jenë të dobishme, por pa asnjë garanci. "
    item5: 'Të lutem konsultohu me %link-termsOfUse% tona developer.catrobat.org/terms_of_use_and_service për formulimet e sakta të pikave të mësipërme dhe disa terma e kushte ligjore shtesë.'
  bottom1: Kontrollo përsëri këtu herë pas here, sepse po përpiqemi gjithmonë të përmirësojmë kushtet tona të përdorimit.
  bottom2: 'Të lutem dërgo çdo sugjerim në lidhje me këto kushte të përdorimit te %email-webmaster%'
  version: Versioni 1.3, 4 mars 2014
