  subject: Rivendosja e fjalëkalimit tënd
  message: |
    I dashur %username%.
    Ke kërkuar të rivendosësh fjalëkalimin tënd në %appplication_url% sepse e ke harruar.
    Nëse nuk e ke kërkuar këtë, të lutem shpërfille këtë mesazh. Kërkesa do të skadojë dhe do të bëhet e pavlefshme pas 24 orësh.
    Për të rivendosur fjalëkalimin tënd dhe për të krijuar një të ri, të lutem vizito faqen në vijim: %confirmationUrl%
    Mund ta përdorësh emrin e përdoruesit dhe fjalëkalimin tënd në çdo kohë për të hyrë në komunitetin %appplication_url%.
    Për ta bërë këtë, vizito faqen në vijim: %loginPage%
    Për të ndryshuar detajet e profilit tënd, shko te kjo faqe: %profilePage%
    Me përshëndetje të përzemërta,
    Ekipi yt Catrobat.
