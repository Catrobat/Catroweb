consent:
  email:
    subject: "Nevojitet pëlqimi prindëror për llogarinë Catrobat të fëmijës tënd"
    title: "Kërkohet pëlqimi prindëror"
    greeting: "Përshëndetje,"
    message: "Fëmija yt %username% ka krijuar një llogari në Catrobat dhe ka verifikuar adresën e emailit."
    explanation: "Catrobat është një platformë edukative falas ku të rinjtë mësojnë të programojnë duke krijuar aplikacione, lojëra dhe animacione. Sipas rregulloreve të BE-së për mbrojtjen e fëmijëve, na duhet pëlqimi yt para se fëmija yt të marrë pjesë plotësisht në komunitet. Të lutem kliko butonin më poshtë për të dhënë pëlqimin."
    button: "Jep pëlqimin prindëror"
    ignore: "Nëse nuk e prisje këtë email, mund ta shpërfillësh pa problem. Pa pëlqim, llogaria do të ketë funksionalitet të kufizuar."
    whatIsCatrobat: "Catrobat është një platformë edukative programimi, falas dhe jofitimprurëse. Mëso më shumë në catrobat.org."
    manageLink: 'Mund ta menaxhosh llogarinë e fëmijës tënd në çdo kohë përmes <a href="%portalUrl%" style="color: #00acc1;">Portalit për prindër</a>. Mëso më shumë rreth <a href="%infoUrl%" style="color: #00acc1;">të drejtave të tua si prind</a>.'
  confirmed:
