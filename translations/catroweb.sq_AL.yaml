privacy-policy:
  header: Politika e privatësisë 
  version: Versioni 2.2, 17 Tetor 2019 
  text1: Për të të ofruar të gjitha përfitimet e shërbimeve tona dhe të llogarisë përkatëse, është e nevojshme të mbledhim disa të dhëna nga ti.
  text2: Për të mirëmbajtur dhe përmirësuar shërbimet tona (aplikacionet dhe faqet e internetit) dhe për të bërë kërkime shkencore mbi edukimin ICT dhe STEM/STEAM, përdorim Google Analytics, Crashlytics dhe Firebase, të gjitha nga Google LLC (SHBA), si dhe Dynatrace nga Dynatrace LLC (SHBA), për të marrë meta të dhëna mbi përdorimin e shërbimeve tona, p.sh. informacione mbi rrëzimet, vulat kohore, faqet/ekranet e vizituara, përdorimin e aplikacioneve dhe shërbimeve tona, sistemin operativ të përdorur dhe informacione mbi ofruesin e rrjetit. Kjo analizë dhe të dhënat e mbledhura nuk lidhen me profilin tënd dhe nuk përmbajnë asnjë informacion personal (pjesët e fundit të adresës IP anonimizohen). Megjithatë, të dhënat e mbledhura do të transferohen te ofruesit e shërbimeve (Google LLC, SHBA dhe Dynatrace LLC, SHBA). Përpunimi i të dhënave bazohet në marrëveshjet me Google LLC dhe Dynatrace LLC. Kjo marrëdhënie me ofruesit e shërbimeve përputhet me Rregulloren e Përgjithshme të Bashkimit Evropian për Mbrojtjen e të Dhënave (EU GDPR) dhe me marrëveshjen BE-SHBA "Privacy Shield".
  text3: Për të krijuar dhe përdorur një llogari në sistemet tona, dhe për të të informuar me email për ndryshime të nevojshme në lidhje me llogarinë tënde, p.sh. përditësime ose shkelje të Kushteve tona të Përdorimit dhe Shërbimit, të rregullave të komunitetit ose të politikave tona, do të ruajmë emrin tënd të përdoruesit dhe, nëse e jep, adresën tënde të emailit. Nëse e ke lidhur llogarinë tënde përmes Google Plus ose Facebook, ruajmë gjithashtu një çelës identifikimi të lidhur me llogarinë tënde në këto shërbime. Nuk do t'i përdorim këto të dhëna për asnjë qëllim tjetër (p.sh. marketing), përveç nëse na e lejon shprehimisht.
  text4: Në mënyrë vullnetare, mund të na japësh vendin tënd të banimit përmes faqes së llogarisë tënde në faqen e ndarjes. Ky do të shfaqet në profilin tënd publik dhe do të përdoret nga ne vetëm për qëllime statistikore dhe kërkimore. Mund ta heqësh në çdo kohë te cilësimet e profilit tënd.
  text5: Mund ta tërheqësh përdorimin e të dhënave personale që i përkasin llogarisë tënde në çdo kohë duke fshirë llogarinë përmes faqes së profilit tënd në https://share.catrob.at/. Pas fshirjes së llogarisë do të mund t'i përdorësh ende shërbimet e ofruara, por jo të bashkëpunosh, p.sh. duke ngarkuar programe, komentuar ose pëlqyer. Gjithashtu, e gjithë përmbajtja e lidhur me llogarinë tënde, p.sh. programet e ngarkuara, komentet etj., do të fshihet.
  text6: Për të shmangur keqpërdorimin e shërbimeve tona, p.sh., përmes ngarkimeve ose komenteve të kontribuara nga përdoruesit për qëllime të paligjshme, të gjitha të dhënat publike të krijuara nga përdoruesit (ngarkimet, komentet) do të ruhen brenda në një bazë të dhënash, së bashku me një etiketë kohore dhe adresën e përdorur të internetit. Këto të dhëna nuk do të përdoren ose nuk do të përcillen tek asnjë institucion, përveç rasteve kur dyshohen në mënyrë të arsyeshme veprime të paligjshme dhe institucionet juridike të autorizuara zyrtarisht i kërkojnë në bazë të ligjit në fuqi. Së pari, çdo rast do të kontrollohet tërësisht në baza individuale nga ne. 
  text7: Mund të regjistrohesh vullnetarisht në buletinin e Catrobat në https://catrob.at/newsletter, që ofrohet nga ne përmes shërbimit MailChimp (The Rocket Science Group LLC d/b/a MailChimp, SHBA). Më pas do të marrësh përditësime mbi projektin Catrobat dhe shërbimet e tij në adresën e emailit që ke dhënë. Mund ta çregjistrosh buletinin në çdo kohë duke përdorur linkun "çregjistrohu" në fund të çdo buletini. Ky buletin ofrohet nga MailChimp, me të cilin kemi një marrëveshje për përpunimin e të dhënave dhe që është angazhuar ndaj Rregullores së Përgjithshme të BE-së për Mbrojtjen e të Dhënave dhe "Privacy Shield" BE-SHBA. Për detaje të mëtejshme mbi MailChimp, të lutem shiko gjithashtu Politikën e Privatësisë dhe Kushtet e Përdorimit të MailChimp.
  text8: Të gjitha shërbimet ofrohen nga projekti i lirë me burim të hapur Catrobat nën ombrellën e International Catrobat Association – Verein zur Förderung freier Software, një OJQ jofitimprurëse e regjistruar në Graz, Austri (Bashkimi Evropian). Politikat tona respektojnë ligjin e BE-së dhe të Austrisë për mbrojtjen e të dhënave (GDPR). Për të na kontaktuar, të lutem dërgo një email te contact@catrobat.org ose na shkruaj me postë në Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Bashkimi Evropian).
  text9: Nëse je nën moshën 14 vjeç, kjo politikë duhet të pranohet nga një kujdestar ligjor (zakonisht një prind).
  text10: Politika zyrtare e privatësisë e Catrobat në gjuhën angleze është e disponueshme në internet nën %privacy_policy%. 
  disagree-text: Pa miratim, ne nuk mund të krijojmë një llogari, por veçoritë kryesore janë akoma të arritshme.
