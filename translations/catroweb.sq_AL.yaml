consent:
  email:
    subject: "Nevojitet pëlqimi prindëror për llogarinë Catrobat të fëmijës tënd"
    title: "Kërkohet pëlqimi prindëror"
    greeting: "Përshëndetje,"
    message: "Fëmija yt %username% ka krijuar një llogari në Catrobat dhe ka verifikuar adresën e emailit."
    explanation: "Catrobat është një platformë edukative falas ku të rinjtë mësojnë të programojnë duke krijuar aplikacione, lojëra dhe animacione. Sipas rregulloreve të BE-së për mbrojtjen e fëmijëve, na duhet pëlqimi yt para se fëmija yt të marrë pjesë plotësisht në komunitet. Të lutem kliko butonin më poshtë për të dhënë pëlqimin."
    button: "Jep pëlqimin prindëror"
    ignore: "Nëse nuk e prisje këtë email, mund ta shpërfillësh pa problem. Pa pëlqim, llogaria do të ketë funksionalitet të kufizuar."
    whatIsCatrobat: "Catrobat është një platformë edukative programimi, falas dhe jofitimprurëse. Mëso më shumë në catrobat.org."
    manageLink: 'Mund ta menaxhosh llogarinë e fëmijës tënd në çdo kohë përmes <a href="%portalUrl%" style="color: #00acc1;">Portalit për prindër</a>. Mëso më shumë rreth <a href="%infoUrl%" style="color: #00acc1;">të drejtave të tua si prind</a>.'
  confirmed:
    title: "Pëlqimi u dha"
    message: "Faleminderit! Llogaria e %username% tani është plotësisht e aktivizuar."
    continueButton: "Zbulo projekte"
parent:
  footer:
    link: "Prindër dhe kujdestarë"
  info:
    title: "Informacion për prindërit dhe kujdestarët"
    intro: "Catrobat e merr seriozisht sigurinë dhe privatësinë e përdoruesve të rinj. Kjo faqe shpjegon si e mbrojmë fëmijën tënd dhe çfarë të drejtash ke."
    whatIsCatrobat:
      title: "Çfarë është Catrobat?"
      text: "Catrobat është një platformë edukative falas dhe jofitimprurëse ku të rinjtë mësojnë programim duke krijuar aplikacionet, lojërat dhe animacionet e tyre. Platforma është e disponueshme në mbarë botën dhe përdoret në mjedise edukative."
    dataCollected:
      title: "Çfarë të dhënash mbledhim?"
      text: "Mbledhim të dhënat minimale të nevojshme për funksionimin e platformës: emrin e përdoruesit, adresën e emailit, datën e lindjes dhe çdo projekt që fëmija yt krijon dhe ngarkon. Për përdoruesit nën 14 vjeç, ruajmë edhe adresën e emailit të një prindi/kujdestari për qëllime pëlqimi. Nuk i shesim dhe nuk i ndajmë të dhënat personale me palë të treta."
    yourRights:
      title: "Të drejtat e tua si prind ose kujdestar"
      text: "Sipas rregulloreve të BE-së për mbrojtjen e fëmijëve (GDPR) dhe COPPA, ke të drejtë: të shqyrtosh të dhënat që mbajmë për fëmijën tënd, të kërkosh një kopje të tyre, ta tërheqësh pëlqimin në çdo kohë (gjë që e kufizon llogarinë) dhe të kërkosh fshirjen përfundimtare të llogarisë së fëmijës tënd dhe të gjitha të dhënave përkatëse."
    minorRestrictions:
      title: "Çfarë kufizimesh vlejnë për llogaritë e të miturve?"
