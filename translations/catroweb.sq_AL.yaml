    <p>
    I dashur %username%.<br>
    <br>
    Ke kërkuar të rivendosësh fjalëkalimin tënd në <a href="%appplication_url%">Pocket Code</a> sepse e ke harruar.
    Nëse nuk e ke kërkuar këtë, të lutem shpërfille. Kërkesa do të skadojë dhe do të bëhet e pavlefshme pas 24 orësh.<br>
    <br>
    Për të rivendosur fjalëkalimin tënd dhe për të krijuar një të ri, të lutem kliko <a href="%confirmationUrl%">këtu.</a><br>
    <br>
    Mund ta përdorësh emrin e përdoruesit dhe fjalëkalimin tënd në çdo kohë për të hyrë në komunitetin <a href="%appplication_url%">Pocket Code</a>.<br>
    Për ta bërë këtë, thjesht vizito faqen në vijim: <a href="%loginPage%">Faqja e hyrjes</a><br>
    Për të ndryshuar detajet e profilit tënd, shko te kjo <a href="%profilePage%">faqe</a>.<br>
    <br>
    Me përshëndetje të përzemërta,<br>
    Ekipi yt Catrobat.
    </p>
