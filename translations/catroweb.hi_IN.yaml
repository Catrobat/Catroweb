parent:
  footer:
    link: "माता-पिता और अभिभावक"
  info:
    title: "माता-पिता और अभिभावकों के लिए जानकारी"
    intro: "Catrobat युवा उपयोगकर्ताओं की सुरक्षा और गोपनीयता को गंभीरता से लेता है। यह पेज बताता है कि हम तुम्हारे बच्चे की सुरक्षा कैसे करते हैं और तुम्हारे क्या अधिकार हैं।"
    whatIsCatrobat:
      title: "Catrobat क्या है?"
      text: "Catrobat एक मुफ़्त, गैर-लाभकारी शैक्षिक प्लेटफ़ॉर्म है, जहाँ युवा अपने ख़ुद के ऐप, गेम और एनिमेशन बनाकर प्रोग्रामिंग सीखते हैं। यह प्लेटफ़ॉर्म दुनिया भर में उपलब्ध है और शिक्षा में इस्तेमाल होता है।"
    dataCollected:
      title: "हम कौन-सा डेटा इकट्ठा करते हैं?"
      text: "हम प्लेटफ़ॉर्म चलाने के लिए ज़रूरी न्यूनतम डेटा इकट्ठा करते हैं: उपयोगकर्ता नाम, ईमेल पता, जन्मतिथि, और तुम्हारा बच्चा जो भी प्रोजेक्ट बनाता और अपलोड करता है। 14 साल से कम उम्र के उपयोगकर्ताओं के लिए हम सहमति के उद्देश्य से माता-पिता/अभिभावक का ईमेल पता भी रखते हैं। हम निजी डेटा न बेचते हैं, न ही किसी तीसरे पक्ष के साथ शेयर करते हैं।"
    yourRights:
      title: "माता-पिता या अभिभावक के रूप में तुम्हारे अधिकार"
      text: "EU के बाल संरक्षण नियमों (GDPR) और COPPA के तहत तुम्हें ये अधिकार हैं: हमारे पास तुम्हारे बच्चे का जो डेटा है उसे देखना, उस डेटा की कॉपी माँगना, कभी भी अपनी सहमति वापस लेना (जिससे खाता सीमित हो जाता है), और अपने बच्चे के खाते और उससे जुड़े सारे डेटा को हमेशा के लिए हटाने का अनुरोध करना।"
    minorRestrictions:
      title: "नाबालिगों के खातों पर कौन-सी पाबंदियाँ लागू होती हैं?"
      text: "16 साल से कम उम्र के उपयोगकर्ता टिप्पणियाँ न लिख सकते हैं न पढ़ सकते हैं, दूसरे उपयोगकर्ताओं को फ़ॉलो नहीं कर सकते, और बच्चों के लिए अनुपयुक्त चिह्नित सामग्री नहीं देख सकते। वे फिर भी प्रोजेक्ट बना और अपलोड कर सकते हैं, सार्वजनिक प्रोजेक्ट देख सकते हैं और लाइक से प्रोजेक्ट पर प्रतिक्रिया दे सकते हैं। ये पाबंदियाँ सीखने का सुरक्षित माहौल देने के लिए हैं।"
    manageButton: "अपने बच्चे का खाता संभालो"
