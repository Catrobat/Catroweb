  text1: "तुम्हें हमारी सेवाओं और संबंधित खाते के सभी लाभ प्रदान करने के लिए, तुम्हारे द्वारा कुछ डेटा एकत्र करना आवश्यक है।"
  text2: "अपनी सेवाओं (ऐप्स और वेबसाइटों) को बनाए रखने और सुधारने के लिए और आईसीटी और एसटीईएम / स्टैम शिक्षा पर वैज्ञानिक शोध करने के लिए, हम Google Analytics (क्रैश) और फायरबेस का उपयोग करते हैं, सभी Google LLC (यूएसए) द्वारा, साथ ही डायनाट्रेस LLC द्वारा डायनाट्रेस यूएसए) हमारी सेवाओं के उपयोग के बारे में मेटाडेटा प्राप्त करने के लिए, उदाहरण के लिए, क्रैश जानकारी, टाइमस्टैम्प, विज़िट किए गए पृष्ठ / स्क्रीन, हमारे एप्लिकेशन और सेवाओं का उपयोग, ऑपरेटिंग सिस्टम का उपयोग, और नेटवर्क प्रदाता के बारे में जानकारी। यह विश्लेषण और एकत्र किया गया डेटा तुम्हारे प्रोफ़ाइल से लिंक नहीं है और इसमें कोई भी व्यक्तिगत जानकारी नहीं है (आईपी पते के अंतिम बिट अनाम हो जाते हैं)। हालांकि, एकत्रित डेटा सेवा-प्रदाताओं (Google LLC, USA और डायनाट्रेस LLC, USA) को हस्तांतरित हो जाएगा। डेटा प्रोसेसिंग Google LLC और डायनाट्रेस LLC के साथ समझौतों पर आधारित है। सेवा प्रदाताओं के लिए यह संबंध यूरोपीय संघ के सामान्य डेटा संरक्षण विनियमन (EU GDPR) और EU-USA \"गोपनीयता शील्ड\" समझौते के अनुरूप है।"
  text3: "हमारे सिस्टम में एक खाता बनाने और उपयोग करने के लिए, और तुम्हें प्रति ई-मेल के बारे में आवश्यक परिवर्तनों के बारे में सूचित करने के लिए, उदाहरण के लिए, हमारी उपयोग की शर्तों और सेवा, हमारे समुदाय के नियमों या हमारी नीतियों के अपडेट या उल्लंघन, हम तुम्हारे स्टोर करेंगे उपयोगकर्ता नाम और, यदि तुम्हारे द्वारा प्रदान किया गया है, तो तुम्हारा ई-मेल पता। यदि तुमने गूगल प्लस या फेसबुक के माध्यम से अपना खाता कनेक्ट किया है, तो हम इन सेवाओं पर तुम्हारे खाते से जुड़े एक पहचान कुंजी को अतिरिक्त रूप से स्टोर करते हैं। हम इस डेटा का उपयोग किसी अन्य (उदाहरण के लिए, मार्केटिंग) उद्देश्यों के लिए नहीं करेंगे, जब तक कि तुमने हमें ऐसा करने की अनुमति नहीं दी।"
  text4: "एक स्वैच्छिक आधार पर, तुम हमें साझा साइट पर अपने खाता पृष्ठ के माध्यम से अपने निवास का देश दे सकते हो । यह तुम्हारे सार्वजनिक प्रोफ़ाइल पर प्रदर्शित हो जाएगा और केवल हमारे द्वारा सांख्यिकीय और अनुसंधान प्रयोजनों के लिए इस्तेमाल किया जाएगा । यह तुम्हारी प्रोफ़ाइल सेटिंग में किसी भी समय निकाला जा सकता है ।"
  text5: "तुम https://share.catrob.at/पर अपने प्रोफ़ाइल पृष्ठ के माध्यम से अपने खाते को हटा कर किसी भी समय अपने खाते से संबंधित व्यक्तिगत डेटा का उपयोग वापस ले सकते हो । अपने खाते को हटाने के बाद तुम अभी भी प्रदान की गई सेवाओं का उपयोग कर सकोगे, लेकिन सहयोग करने के लिए नहीं, जैसे, अपलोड कार्यक्रमों के माध्यम से, टिप्पणी, या पसंद. साथ ही, तुम्हारे खाते से लिंक की गई सभी सामग्री, जैसे, अपलोड किए गए प्रोग्राम, टिप्पणियाँ आदि, को हटा दिया जाएगा."
  text6: हमारी सेवाओं के दुरुपयोग से बचने के लिए, उदाहरण के लिए, उपयोगकर्ता के माध्यम से अपलोड या अवैध प्रयोजनों के लिए टिप्पणी योगदान, सभी उपयोगकर्ता सार्वजनिक डेटा उत्पंन (अपलोड, टिप्पणियां) एक डेटाबेस में आंतरिक रूप से संग्रहीत किया जाएगा, एक साथ एक टाइमस्टैंप और इस्तेमाल इंटरनेट पते के साथ । इस डेटा का उपयोग किसी भी संस्थान द्वारा या अग्रेषित नहीं किया जाएगा, जब तक कि पर्याप्त गैरकानूनी कार्रवाइयां यथोचित रूप से संदिग्ध न हों और आधिकारिक रूप से कानूनी संस्थाएं इसे लागू कानून के आधार पर अनुरोध करती हैं । प्रत्येक मामले को अच्छी तरह से हमारे द्वारा पहली बार एक व्यक्तिगत आधार पर जांच की जाएगी ।
  text7: "तुम स्वेच्छा से Catrobat ंयूज़लेटर के लिए सदस्यता ले सकते हो, https://catrob.at/newsletter पर MailChimp सेवा के माध्यम से हमारे द्वारा प्रदान की (रॉकेट विज्ञान समूह LLC डी/ इसके बाद तुम्हें Catrobat प्रोजेक्ट और उसकी सेवाओं पर तुम्हारे द्वारा प्रदत्त ई-मेल पता पर अद्यतन प्राप्त होंगे । तुम हर ंयूजलेटर के पाद लेख में \"सदस्यता समाप्त\" लिंक का उपयोग करके किसी भी समय ंयूजलेटर वापस ले सकते हो । इस ंयूजलेटर MailChimp द्वारा प्रदान की है जिनके साथ हम एक डेटा प्रसंस्करण समझौते है और जो यूरोपीय संघ के जनरल डाटा Prodection विनियमन और यूरोपीय संघ के लिए प्रतिबद्ध संयुक्त राज्य अमेरिका \"गोपनीयता शील्ड\" । MailChimp पर अधिक जानकारी के लिए कृपया यह भी MailChimp की गोपनीयता नीति और उपयोग की शर्तों को देखो ।"
  text8: सभी सेवाएं अंतर्राष्ट्रीय Catrobat संघ की छतरी के नीचे मुक्त खुला स्रोत Catrobat परियोजना द्वारा प्रदान की जाती है – Verein zur Förderung freier सॉफ्टवेयर, एक गैर लाभ चरने, ऑस्ट्रिया (यूरोपीय संघ) में शामिल एनजीओ । हमारी नीतियां यूरोपीय संघ और ऑस्ट्रिया के डेटा संरक्षण कानून (GDPR) को संमान देते हैं । हमारे साथ संपर्क में पाने के लिए, कृपया एक ई मेल भेजने के लिए contact@catrobat.org या हमें catrobat, सी/ओ सॉफ्टवेयर प्रौद्योगिकी के संस्थान, चराई प्रौद्योगिकी विश्वविद्यालय, Inffeldgasse 16b, ए-८०१० चराई, ऑस्ट्रिया (यूरोपीय संघ) ।
  text9: "यदि तुम्हारी आयु 14 वर्ष से कम है, तो यह पॉलिसी कानूनी अभिभावक (आमतौर पर माता-पिता) द्वारा स्वीकार की जानी चाहिए।"
  text10: Catrobat की आधिकारिक अंग्रेजी भाषा की गोपनीयता नीति %privacy_policy% के तहत वेब पर उपलब्ध है।
  disagree-text: अनुमोदन के बिना, हम एक खाता नहीं बना सकते हैं लेकिन मूल विशेषताएं अभी भी उपलब्ध हैं।
