    title: "माता-पिता की सहमति ज़रूरी है"
    greeting: "नमस्ते,"
    message: "तुम्हारे बच्चे %username% ने Catrobat पर खाता बनाया है और अपना ईमेल पता सत्यापित कर लिया है।"
    explanation: "Catrobat एक मुफ़्त शैक्षिक प्लेटफ़ॉर्म है, जहाँ युवा ऐप, गेम और एनिमेशन बनाकर कोडिंग सीखते हैं। EU के बाल संरक्षण नियमों के तहत, तुम्हारा बच्चा समुदाय में पूरी तरह हिस्सा ले सके, इससे पहले हमें तुम्हारी सहमति चाहिए। सहमति देने के लिए कृपया नीचे दिए बटन पर क्लिक करो।"
    button: "माता-पिता की सहमति दो"
    ignore: "अगर तुम्हें इस ईमेल की उम्मीद नहीं थी, तो तुम इसे बेझिझक अनदेखा कर सकते हो। सहमति के बिना खाते की सुविधाएँ सीमित रहेंगी।"
    whatIsCatrobat: "Catrobat एक मुफ़्त, गैर-लाभकारी शैक्षिक प्रोग्रामिंग प्लेटफ़ॉर्म है। catrobat.org पर और जानो।"
