passwordRecovery:
  subject: Your Catrobat Password Recovery
  message: "ᎣᏏᏲ %username%.\n%appplication_url% ᎾᎿᎢ ᏣᏤᎵ ᎤᏕᎵᏛ ᎧᏁᎢᏍᏗ ᎢᏤ ᏂᎬᏁᏗ ᏣᏔᏲᏒ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ ᏣᏓᏅᏛᎮᎸ.\nᎢᏳᏃ ᎯᎠ ᎥᏝ ᏱᏣᏔᏲᏎ, ᎯᏁᎢ. 24 ᏧᏒᎯᏛ ᎢᏳᏟᎶᏛ ᎤᏍᏆᏗᏍᏗ.\nᎤᏕᎵᏛ ᎧᏁᎢᏍᏗ ᎢᏤ ᏣᏙᏢᏍᏗ, ᎯᎠ ᎪᏪᎵ ᏫᎷᎩ: %confirmationUrl%\nᏂᎪᎯᎸ ᏕᏣᏙᎥ ᎠᎴ ᎤᏕᎵᏛ ᎧᏁᎢᏍᏗ ᏰᎵ ᎬᏗ %appplication_url% ᎦᏚᎲ ᏣᏴᏍᏗ.\nᎯᎠ ᎪᏪᎵ ᏫᎷᎩ: %loginPage%\nᏕᏣᏙᎥ ᏗᎪᏪᎵ ᏣᏁᏟᏴᏍᏗ, ᎯᎠ ᎪᏪᎵ ᏫᎷᎩ: %profilePage%\nᏩᏙ,\nCatrobat ᏗᎦᎸᏫᏍᏓᏁᎯ.\n"
  messageHtml: "<p>\nᎣᏏᏲ %username%.<br>\n<br>\n<a href=\"%appplication_url%\">Pocket Code</a> ᎾᎿᎢ ᏣᏤᎵ ᎤᏕᎵᏛ ᎧᏁᎢᏍᏗ ᎢᏤ ᏂᎬᏁᏗ ᏣᏔᏲᏒ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ ᏣᏓᏅᏛᎮᎸ.\nᎢᏳᏃ ᎯᎠ ᎥᏝ ᏱᏣᏔᏲᏎ, ᎯᏁᎢ. 24 ᏧᏒᎯᏛ ᎢᏳᏟᎶᏛ ᎤᏍᏆᏗᏍᏗ.<br>\n<br>\nᎤᏕᎵᏛ ᎧᏁᎢᏍᏗ ᎢᏤ ᏣᏙᏢᏍᏗ, <a href=\"%confirmationUrl%\">ᎠᏂ</a> ᎯᏯᏁᏍᏛᏂ.<br>\n<br>\nᏂᎪᎯᎸ ᏕᏣᏙᎥ ᎠᎴ ᎤᏕᎵᏛ ᎧᏁᎢᏍᏗ ᏰᎵ ᎬᏗ <a href=\"%appplication_url%\">Pocket Code</a> ᎦᏚᎲ ᏣᏴᏍᏗ.<br>\nᎯᎠ ᎪᏪᎵ ᏫᎷᎩ: <a href=\"%loginPage%\">ᏫᏴᎭ ᎪᏪᎵ</a><br>\nᏕᏣᏙᎥ ᏗᎪᏪᎵ ᏣᏁᏟᏴᏍᏗ, ᎯᎠ <a href=\"%profilePage%\">ᎪᏪᎵ</a> ᏫᎷᎩ.<br>\n<br>\nᏩᏙ,<br>\nCatrobat ᏗᎦᎸᏫᏍᏓᏁᎯ.\n</p>\n"
