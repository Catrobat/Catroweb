  info:
    title: 'ᎤᏂᏙᏓ ᎠᎴ ᎠᏂᎦᏘᏯ ᎤᏂᏤᎵ ᎧᏃᎮᏛ'
    intro: 'Catrobat ᎤᏙᎯᏳ ᏓᏍᏆᏂᎪᏗᏍᎪ ᏗᏂᏲᎵ ᎠᎴ ᎤᏂᏤᎵ ᎤᏕᎵᏛ. ᎯᎠ ᎪᏪᎵ ᎦᏃᎮᏍᎪ ᎢᏳᏍᏗ ᏙᏍᏆᏂᎪᏗᏍᎬ ᏣᏤᎵ ᎠᏲᎵ ᎠᎴ ᎦᏙ ᏗᎧᎿᏩᏛᏍᏗ ᏣᎭ.'
    whatIsCatrobat:
      title: 'ᎦᏙ Catrobat?'
      text: 'Catrobat ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ, ᎥᏝ ᎠᏕᎳ ᏱᎦᏲᎮ ᏗᏕᎶᏆᏍᏗᏱ, ᎾᎿ ᏗᏂᏲᎵ ᏓᏕᎶᏆᎮ ᏗᎾᎦᎾᏌᎢᏍᏗ ᏗᎪᏪᎵ ᎤᏅᏒ apps, ᏗᏁᏍᎨᏍᏗ, ᎠᎴ ᏗᏟᎶᏍᏔᏅ ᏓᏃᏢᏍᎬ. ᏂᎬᎾᏛ ᎡᎶᎯ ᏰᎭ ᎠᎴ ᏗᏕᎶᏆᏍᏗᏱ ᎠᏂᏁᎰ.'
    dataCollected:
      title: 'ᎦᏙ ᎧᏃᎮᏛ ᏙᏥᏟᏏᏍᎪ?'
      text: 'ᎤᏍᏗ ᎤᏩᏒ ᎧᏃᎮᏛ ᏙᏥᏟᏏᏍᎪ: ᏚᏙᎥ, email, ᎢᎪᎯᏛ ᎤᏕᏅ, ᎠᎴ ᏚᎸᏫᏍᏓᏁᎸᎯ ᏣᏤᎵ ᎠᏲᎵ ᏧᏃᏢᏅ ᎠᎴ ᏧᏅᏍᏔᏅ. 14 ᎢᏴ ᎢᏯᏂᏛᎾ ᏴᏫ, ᎾᏍᏉ ᎤᏂᏙᏓ/ᎠᏂᎦᏘᏯ email ᏗᏍᏆᏂᎪᏗᏍᎪ ᎤᎵᏍᎨᏓ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ. ᎥᏝ ᎧᏃᎮᏛ ᏱᏙᏥᎾᏗᏅᏍᎪ ᎠᎴ ᎥᏝ ᏅᏩᏓᎴ ᏱᏓᏥᏁᎰ.'
    yourRights:
      title: 'ᏣᏤᎵ ᏗᎧᎿᏩᏛᏍᏗ ᏣᏙᏓ ᎠᎴᏱᎩ ᏣᎦᏘᏯ ᎨᏒ'
      text: 'EU ᏗᏂᏲᎵ ᏗᏍᏆᏂᎪᏗ ᏗᎧᎿᏩᏛᏍᏗ (GDPR) ᎠᎴ COPPA ᏅᏗᎦᎵᏍᏙᏗᏍᎬ, ᏰᎵ: ᏣᎪᏩᏛᏗ ᎧᏃᎮᏛ ᏣᏤᎵ ᎠᏲᎵ ᎤᏤᎵ, ᎾᏍᎩ ᎤᏠᏱ ᏣᏔᏲᎯᏍᏗ, ᏂᎪᎯᎸ ᏣᎵᏍᎨᏓ ᏣᏲᏍᏙᏗ (ᎾᏍᎩ ᏚᏙᎥ ᎤᏍᏗ ᏂᏓᏛᏁᎰ), ᎠᎴ ᏣᏔᏲᎯᏍᏗ ᏂᎪᎯᎸ ᎦᏛᏗ ᏣᏤᎵ ᎠᏲᎵ ᏚᏙᎥ ᎠᎴ ᏂᎦᏛ ᎤᏤᎵ ᎧᏃᎮᏛ.'
    minorRestrictions:
      title: 'ᎦᏙ ᏗᎧᎿᏩᏛᏍᏗ ᏗᏂᏲᎵ ᏕᎤᏂᏙᎥ ᎤᏂᏤᎵ?'
      text: '16 ᎢᏴ ᎢᏯᏂᏛᎾ ᏴᏫ ᎥᏝ ᏰᎵ ᎧᏃᎮᏛ ᏱᏓᏃᏪᎳᏁ ᎠᎴᏱᎩ ᏱᏓᏃᎮᎵᏍᎨ, ᏅᏩᏓᎴ ᏴᏫ ᏱᏓᏂᏍᏓᏩᏗᏙᎮ, ᎠᎴᏱᎩ ᏗᏂᏲᎵ ᎥᏝ ᎣᏏᏳ ᏱᏓᏂᎪᏩᏘᏍᎨ. ᎠᏏᏉ ᏰᎵ ᏚᎸᏫᏍᏓᏁᎸᎯ ᏓᏃᏢᏍᎨᏍᏗ ᎠᎴ ᏓᏅᏍᏗᏍᎨᏍᏗ, ᏂᎦᏛ ᎤᏂᎪᏩᏛᏗ ᏚᎸᏫᏍᏓᏁᎸᎯ ᏓᏂᎪᏩᏘᏍᎨᏍᏗ, ᎠᎴ ᏄᏛᏁᎸ ᏓᏁᎨᏍᏗ. ᎯᎠ ᏗᎧᎿᏩᏛᏍᏗ ᏓᏍᏆᏂᎪᏗᏍᎪ ᏗᏕᎶᏆᏍᏗᏱ.'
