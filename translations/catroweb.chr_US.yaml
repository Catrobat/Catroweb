  messageHtml: "<p>\nᎣᏏᏲ %username%.<br>\n<br>\nᏕᏣᏙᎥ ᏣᎵᏍᏆᏗᏍᏗ - <a href=\"%confirmationUrl%\">ᎠᏂ</a> ᎯᏯᏁᏍᏛᏂ.<br>\nᎯᎠ ᎤᏯᏅᏗ ᏑᏓᎴᎩ ᎤᏩᏒ ᏰᎵ ᎬᏗ.<br>\n<br>\nᏩᏙ,<br>\nCatrobat ᏗᎦᎸᏫᏍᏓᏁᎯ.\n</p>\n"
