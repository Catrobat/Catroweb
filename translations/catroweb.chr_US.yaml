    greeting: 'ᎣᏏᏲ,'
    message: 'ᏣᏤᎵ ᎠᏲᎵ %username% Catrobat ᎾᎿᎢ ᏚᏙᎥ ᎤᏁᏅ ᎠᎴ ᎤᏤᎵ email ᎤᏙᎯᏳ ᏄᏩᏁᎸ.'
    explanation: 'Catrobat ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ ᏗᏕᎶᏆᏍᏗᏱ, ᎾᎿ ᏗᏂᏲᎵ ᏓᏕᎶᏆᎮ ᏗᎾᎦᎾᏌᎢᏍᏗ ᏗᎪᏪᎵ ᏓᏃᏢᏍᎬ apps, ᏗᏁᏍᎨᏍᏗ, ᎠᎴ ᏗᏟᎶᏍᏔᏅ ᏓᏅᏃᏍᎩ. EU ᏗᏂᏲᎵ ᏗᏍᏆᏂᎪᏗ ᏗᎧᎿᏩᏛᏍᏗ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ, ᏣᎵᏍᎨᏓ ᎣᎦᏚᎵ ᎠᏏᏉ ᏣᏤᎵ ᎠᏲᎵ ᏂᎦᎥ ᏳᏂᏴᏍᏗ ᎦᏚᎲ. ᎡᎳᏗ ᎦᏁᏍᏛᏗ ᎯᏯᏁᏍᏛᏂ ᏣᎵᏍᎨᏓ ᏣᏁᏗ.'
    button: 'ᎤᏂᏙᏓ ᎤᎵᏍᎨᏓ ᎯᏁᎥ'
    ignore: 'ᎢᏳᏃ ᎯᎠ email ᎥᏝ ᏱᏣᏚᎵᏍᎨ, ᎯᏁᎢ. ᎤᎵᏍᎨᏓ ᏂᎨᏒᎾ, ᏚᏙᎥ ᎤᏍᏗ ᏂᏓᏛᏁᎰ.'
    whatIsCatrobat: 'Catrobat ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ, ᎥᏝ ᎠᏕᎳ ᏱᎦᏲᎮ ᏗᏕᎶᏆᏍᏗᏱ ᏗᎾᎦᎾᏌᎢᏍᏗ ᏗᎪᏪᎵ ᎪᏪᎵᏍᏗ. ᎤᏟ ᎯᎦᏔ catrobat.org.'
    manageLink: 'ᏂᎪᎯᎸ ᏰᎵ ᏣᎦᏌᏯᏍᏗ ᏣᏤᎵ ᎠᏲᎵ ᏚᏙᎥ <a href="%portalUrl%" style="color: #00acc1;">ᎤᏂᏙᏓ ᎤᏂᏤᎵ ᎦᎶᎯᏍᏗ</a> ᎬᏗ. ᎤᏟ ᎯᎦᏔ <a href="%infoUrl%" style="color: #00acc1;">ᏣᏤᎵ ᏗᎧᎿᏩᏛᏍᏗ ᏣᏙᏓ ᎨᏒ</a>.'
