  verifyAccountText: 'Email ᎤᏯᏅᏗ ᎦᏁᎭ ᏓᏨᏯᏅᏍᏔᏂ ᏕᏣᏙᎥ ᎤᏙᎯᏳ ᏂᎬᏁᏗ. ᎤᏯᏅᏗ ᎯᏯᏁᏍᏛᏂ ᏑᏟᎶᏛ ᎢᏳᏟᎶᏛ ᎠᏰᎵ; ᏑᏓᎴᎩ ᎢᎦ ᏑᏓᎴᎩ email ᎤᏩᏒ ᏰᎵ ᏣᏔᏲᎯᏍᏗ.'
