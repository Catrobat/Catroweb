consent:
  email:
    subject: 'ᏣᏤᎵ ᎠᏲᎵ Catrobat ᏚᏙᎥ ᎤᏂᏙᏓ ᎤᎵᏍᎨᏓ ᎤᏚᎵ'
    title: 'ᎤᏂᏙᏓ ᎤᎵᏍᎨᏓ ᎤᏚᎵ'
    greeting: 'ᎣᏏᏲ,'
    message: 'ᏣᏤᎵ ᎠᏲᎵ %username% Catrobat ᎾᎿᎢ ᏚᏙᎥ ᎤᏁᏅ ᎠᎴ ᎤᏤᎵ email ᎤᏙᎯᏳ ᏄᏩᏁᎸ.'
    explanation: 'Catrobat ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ ᏗᏕᎶᏆᏍᏗᏱ, ᎾᎿ ᏗᏂᏲᎵ ᏓᏕᎶᏆᎮ ᏗᎾᎦᎾᏌᎢᏍᏗ ᏗᎪᏪᎵ ᏓᏃᏢᏍᎬ apps, ᏗᏁᏍᎨᏍᏗ, ᎠᎴ ᏗᏟᎶᏍᏔᏅ ᏓᏅᏃᏍᎩ. EU ᏗᏂᏲᎵ ᏗᏍᏆᏂᎪᏗ ᏗᎧᎿᏩᏛᏍᏗ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ, ᏣᎵᏍᎨᏓ ᎣᎦᏚᎵ ᎠᏏᏉ ᏣᏤᎵ ᎠᏲᎵ ᏂᎦᎥ ᏳᏂᏴᏍᏗ ᎦᏚᎲ. ᎡᎳᏗ ᎦᏁᏍᏛᏗ ᎯᏯᏁᏍᏛᏂ ᏣᎵᏍᎨᏓ ᏣᏁᏗ.'
