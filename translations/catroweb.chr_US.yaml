privacy-policy:
  header: Privacy Policy
  version: 'ᎢᏳᏓᎴᎩ 2.2, 17 ᏚᏂᏅᏗ 2019'
  text1: 'ᏂᎦᏛ ᎣᏍᏓ ᏗᏍᏕᎸᏗ ᎠᎴ ᏕᏣᏙᎥ ᏗᏨᏁᏗ, ᎩᎶ ᎧᏃᎮᏛ ᏗᏨᏔᏲᏎᏗ ᎤᏚᎵ.'
  text2: 'ᎣᎦᏤᎵ ᏗᏍᏕᎸᏗ (apps ᎠᎴ websites) ᎣᏍᏓ ᏗᏍᏆᏂᎪᏙᏗ ᎠᎴ ICT ᎠᎴ STEM/STEAM ᏗᏕᎶᏆᏍᏗ ᏗᏓᏲᏍᏗ, Google Analytics, Crashlytics, ᎠᎴ Firebase (Google LLC, USA), ᎠᎴ Dynatrace (Dynatrace LLC, USA) ᏗᏗᏂᎰ ᎢᏳᏍᏗ ᎠᏂᏁᎲ ᎣᎦᏤᎵ ᏗᏍᏕᎸᏗ ᎦᏙᎥᎯᏍᏗ, ᎾᏍᎩᏯ ᎤᏲ ᏄᎵᏍᏔᏅ, ᎢᎪᎯᏛ, ᏗᎪᏪᎵ ᎤᏂᎪᎲ, ᎠᎾᏌᎢᏍᏗ ᏄᏍᏛ, ᎠᎴ network ᎧᏃᎮᏛ. ᎯᎠ ᎧᏃᎮᏛ ᎥᏝ ᏕᏣᏙᎥ ᏱᏚᏓᏠᎯᏍᏛ ᎠᎴ ᎥᏝ ᏣᏤᎵ ᎤᏕᎵᏛ ᎧᏃᎮᏛ ᏱᎦᏁᎭ (IP ᎤᎵᏍᏆᎸᏗ ᎦᏍᎦᎳ). ᎠᏎᏃ ᎧᏃᎮᏛ ᏓᎦᏅᏍᏔᏂ (Google LLC, USA ᎠᎴ Dynatrace LLC, USA). ᎯᎠ EU GDPR ᎠᎴ EU-USA "Privacy Shield" ᏗᎧᎿᏩᏛᏍᏗ ᎾᏍᎩᏯ.'
  text3: 'ᏕᏣᏙᎥ ᏣᏁᏗ ᎠᎴ email ᎬᏗ ᎧᏃᎮᏛ ᏗᏨᏃᏁᏗ ᏕᏣᏙᎥ ᏚᏓᏠᎯᏍᏛ (ᎾᏍᎩᏯ ᎢᏤ ᏂᎬᏁᎸ ᎠᎴᏱᎩ ᎬᏗ ᏗᎧᎿᏩᏛᏍᏗ ᎦᏲᏍᏔᏅ), ᏕᏣᏙᎥ ᎠᎴ, ᎢᏳᏃ ᏍᎩᏁᎸ, ᏣᏤᎵ email ᏙᏥᏍᏆᏂᎪᏗᏍᎪ. ᎢᏳᏃ Google Plus ᎠᎴᏱᎩ Facebook ᎬᏗ ᏫᏴᎯᏍᎨᏍᏗ, ᎾᏍᏉ ᎪᎱᏍᏗ ᏗᏟᎶᏍᏔᏅ ᏙᏥᏍᏆᏂᎪᏗᏍᎪ. ᎥᏝ ᏅᏩᏓᎴ ᎢᏳᏍᏗ ᏱᏙᏥᏁᎰ, ᎬᏂ ᏍᎩᏁᎸ.'
  text4: 'ᏣᏚᎵᏍᎨᏍᏗ, ᎦᏙᎯ ᏤᎲ ᏰᎵ ᏍᎩᏃᎲᏏ ᏕᏣᏙᎥ ᎪᏪᎵ ᎬᏗ. ᎯᎠ ᏕᏣᏙᎥ ᏗᎪᏪᎵ ᎾᎿᎢ ᏓᎦᎾᏄᎪᏥ ᎠᎴ ᏗᏎᏍᏗ ᎠᎴ ᏗᏓᏲᏍᏗ ᎤᏩᏒ ᎢᏳᏍᏗ ᏙᏥᏁᎵ. ᏂᎪᎯᎸ ᏰᎵ ᎯᏍᏆᏓᏗ ᏕᏣᏙᎥ ᏄᏍᏛ ᎾᎿᎢ.'
  text5: 'ᏂᎪᎯᎸ ᏰᎵ ᏣᏤᎵ ᎧᏃᎮᏛ ᎬᏗ ᎯᏲᏍᏙᏗ ᏕᏣᏙᎥ ᎯᏍᏆᏓᏍᎬ ᏕᏣᏙᎥ ᏗᎪᏪᎵ ᎾᎿᎢ https://share.catrob.at/. ᏕᏣᏙᎥ ᎦᏛᏅ ᎣᏂ, ᎠᏏᏉ ᏰᎵ ᏗᏍᏕᎸᏗ ᏣᏁᏗ, ᎠᏎᏃ ᎥᏝ ᏰᎵ ᏚᎸᏫᏍᏓᏁᎸᎯ ᏱᏣᏅᏍᏗ, ᎧᏃᎮᏛ ᏱᏣᏬᏪᎳᏁᏗ, ᎠᎴᏱᎩ ᏄᏛᏁᎸ ᏱᏣᏁᏗ. ᎾᏍᏉ ᏂᎦᏛ ᏕᏣᏙᎥ ᏚᏓᏠᎯᏍᏛ, ᎾᏍᎩᏯ ᏚᏅᏍᏔᏅ ᏚᎸᏫᏍᏓᏁᎸᎯ ᎠᎴ ᎧᏃᎮᏛ, ᏓᎦᏛᏔᏂ.'
  text6: 'ᎣᎦᏤᎵ ᏗᏍᏕᎸᏗ ᎤᏲ ᎬᏗ ᏂᎨᏒᎾ ᎢᏳᏍᏗ, ᏂᎦᏛ ᏴᏫ ᏚᏅᏍᏔᏅ ᎠᎴ ᎧᏃᎮᏛ ᎤᏃᏪᎳᏅ ᏙᏥᏍᏆᏂᎪᏗᏍᎪ, ᎢᎪᎯᏛ ᎠᎴ internet ᎾᎿᎢ ᎤᎷᏨ ᎢᏧᎳᎭ. ᎯᎠ ᎧᏃᎮᏛ ᎥᏝ ᏅᏩᏓᎴ ᏱᏓᏥᏁᎰ, ᎬᏂ ᎤᏲ ᏄᏛᏁᎸ ᎤᏙᎯᏳ ᎤᏰᎸᏗ ᎨᏎᏍᏗ ᎠᎴ ᏗᎧᎿᏩᏛᏍᏗ ᏗᏂᎦᏘᏯ ᎤᏂᏔᏲᏎᎸ. ᎢᎬᏱ ᏂᎦᏛ ᎣᏍᏓ ᏙᏥᎦᏔᏂ.'
  text7: 'ᏣᏚᎵᏍᎨᏍᏗ, Catrobat ᎧᏃᎮᏛ ᎪᏪᎵ ᏰᎵ ᏣᏩᏛᏗ https://catrob.at/newsletter ᎾᎿᎢ, MailChimp ᎬᏗ (The Rocket Science Group LLC d/b/a MailChimp, USA). Catrobat ᎧᏃᎮᏛ ᏣᏤᎵ email ᏓᎦᏅᏍᏔᏂ. ᏂᎪᎯᎸ ᏰᎵ ᎯᏲᏍᏙᏗ "unsubscribe" ᎤᏯᏅᏗ ᎬᏗ ᏂᎦᏛ ᎧᏃᎮᏛ ᎪᏪᎵ ᎡᎳᏗ. MailChimp EU GDPR ᎠᎴ EU-USA "Privacy Shield" ᎾᏍᎩᏯ ᎢᏯᏛᏁᏗ ᎤᏁᏨ. MailChimp ᎤᏤᎵ ᏗᎧᎿᏩᏛᏍᏗ ᎾᏍᏉ ᎯᎦᏔ.'
  text8: 'ᏂᎦᏛ ᏗᏍᏕᎸᏗ Catrobat ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ open source ᏚᎸᏫᏍᏓᏁᎸ ᏓᏁᎰ, International Catrobat Association – Verein zur Förderung freier Software ᎡᎳᏗ, ᎥᏝ ᎠᏕᎳ ᏱᎦᏲᎮ NGO Graz, Austria (European Union) ᎾᎿᎢ. ᎣᎦᏤᎵ ᏗᎧᎿᏩᏛᏍᏗ EU ᎠᎴ Austria ᎧᏃᎮᏛ ᏗᏍᏆᏂᎪᏗ ᏗᎧᎿᏩᏛᏍᏗ (GDPR) ᎾᏍᎩᏯ. ᏍᎩᏬᏁᏓ, contact@catrobat.org email ᎯᏅᏍᏓ ᎠᎴᏱᎩ ᎪᏪᎵ ᎯᏅᏍᏓ Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'ᎢᏳᏃ 14 ᎢᏴ ᎢᏣᏛᎾ ᎢᎨᏎᏍᏗ, ᏣᎦᏘᏯ (ᏣᏙᏓ) ᎯᎠ ᏗᎧᎿᏩᏛᏍᏗ ᎣᏏᏳ ᎤᏰᎸᏗ ᎨᏎᏍᏗ.'
  text10: 'Catrobat ᏲᏁᎦ ᎤᏙᎯᏳ ᎤᏕᎵᏛ ᏗᏍᏆᏂᎪᏗ ᏗᎧᎿᏩᏛᏍᏗ %privacy_policy% ᎾᎿᎢ ᏰᎭ.'
  disagree-text: 'ᎣᏏᏳ ᏣᏰᎸᏅᎾ, ᎥᏝ ᏰᎵ ᏕᏣᏙᎥ ᏲᏨᏯᏁᏗ ᎠᏎᏃ ᎤᏣᏘ ᎦᎸᏉᏗᏳ ᎪᎱᏍᏗ ᎠᏏᏉ ᏰᎵ ᏣᏁᏗ.'
