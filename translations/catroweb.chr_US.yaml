licenseToPlay:
  link: 'ᎦᏁᏍᎨᏍᏗ ᎤᏁᎳᏅᎯ'
  title: 'ᎦᏁᏍᎨᏍᏗ ᎤᏁᎳᏅᎯ - ᏩᏙ ᎯᏪᏍᏗ ᎠᎴ ᏕᎯᏁᎳ'
  text1: 'ᎯᏰᎵᏎᎦ ᏂᎦᏛ Catrobat ᏚᎸᏫᏍᏓᏁᎸᎯ ᎦᏚ ᎤᎦᎾᏍᏓ, ᎤᏓᏁᏟᏴᏛ ᎦᏚ ᎤᏁᏓ ᎢᏳᏍᏗ ᏂᎦᏛᏁᏗ ᎪᏪᎸ (ᏗᎾᎦᎾᏌᎢᏍᏗ ᏗᎪᏪᎵ ᏗᎦᎫᏍᏛᏗ). ᏂᎦᏛ Catrobat ᎦᏚᎲ ᎠᏁᎯ ᏓᏁᎳ ᎤᏂᏤᎵ ᎦᏚ ᎠᎴ ᎤᏂᏤᎵ ᎪᏪᎸ. ᎾᏍᎩ ᎢᏳᏍᏗ ᏰᎵ ᎦᏚ ᏣᎵᎮᎵᏍᏗ ᎠᎴ ᏣᏕᎶᏆᏍᏗ ᎢᏳᏍᏗ ᏨᏒ ᏂᏣᏛᏁᏗ!'
  text2: 'ᎥᏝ ᎤᏕᎵᏛ ᎪᏪᎸ ᏱᎩ: ᎢᏳᏍᏗ ᎦᏚ ᏂᎦᏛᏁᏗ ᏂᎦᏛ ᏴᏫ ᏰᎵ ᎬᏗ, ᏔᎵᏁ ᎬᏗ, ᎤᏁᏟᏴᏍᏗ, ᎠᎴ ᎢᏤ ᎤᎾᏓᏅᏖᏗ ᎤᏂᏍᏕᎸᏗ... ᎦᏚ ᏥᏁᎦ.'
  text3: 'ᏰᎵ ᎦᏚ ᏣᎵᏍᏓᏴᏗ ᎠᎴ ᏅᏩᏓᎴ ᏴᏫ ᎤᏂᏤᎵ ᎪᏪᎸ ᏰᎵ ᎯᏯᏅᏗ ᏨᏒ ᏣᏤᎵ ᏣᏙᏢᏍᏗ, ᎤᏓᎴᏗ ᏧᏓᎴᏅᏓ ᎬᏗ. ᎯᎠ ᏂᏓᎬᏩᎶᏛ ᏔᎵ ᏗᎧᎿᏩᏛᏍᏗ ᎦᏁᎭ:'
  text4: 'Catrobat ᎦᏚᎲ ᎣᏤᏅ, ᎯᎠ ᎢᏳᏍᏗ ᎣᎦᏑᏰᏒ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ ᎣᎦᏓᏅᏖᏍᎬ ᏗᏕᎶᏆᏍᏗ ᎠᎴ ᎢᏤ ᎤᎾᏓᏅᏖᏗ ᏓᏍᏕᎵᏍᎪ ᎦᏚᎲ. ᎪᏪᎸ ᎠᎴ ᏧᏓᎴᏅᏓ (ᏗᎪᏪᎵ ᎠᎴ ᏗᏟᎶᏍᏔᏅ) ᏓᏁᎳᏗᏍᎬ, ᏴᏫ ᏰᎵ ᏚᏂᏍᏕᎸᏗ ᎤᎾᏓᏅᏖᏗ ᎠᎴ ᏂᎦᏛ ᎣᏍᏓ ᏓᎾᎵᏍᏓᏁᎵ.'
  text5: 'Catrobat website ᎣᏤᏅ, ᏴᏫ ᏚᏂᏁᎳᏗᏍᏗ ᎠᎴ ᏩᏙ ᎤᏂᏪᏍᏗ ᏅᏩᏓᎴ ᏴᏫ ᎢᏳᏍᏗ ᎣᏤᏅ. ᏂᎦᏛ ᏚᎸᏫᏍᏓᏁᎸ ᎪᏪᎵ ᎾᎿᎢ, ᏂᎪᎯᎸ ᏰᎵ ᎢᎬᏱᏱ ᏗᎪᏪᎵ ᎯᏯᏅᏗ. ᎢᏳᏃ ᏚᎸᏫᏍᏓᏁᎸ ᎢᏤ ᏂᎬᏁᎸᎭ (ᏗᎪᏪᎵ ᎠᎴᏱᎩ ᏗᏟᎶᏍᏔᏅ ᏣᏁᏟᏴᏒ ᎠᎴ ᏕᎯᏁᎳᏅ), ᏚᎸᏫᏍᏓᏁᎸ ᏗᎪᏪᎸ ᎾᎿᎢ ᏩᏙ ᏫᎾᏕᏥᏪᏏ ᏴᏫ ᎠᎴ ᏚᎸᏫᏍᏓᏁᎸ ᏣᏍᏕᎸᎯ.'
  text6: 'Catrobat ᎦᏚᎲ ᏗᎧᎿᏩᏛᏍᏗ ᎤᏟ ᎯᎦᏔ %link-termsOfUse% ᎾᎿᎢ.'
  list1:
    item1: 'ᏣᏤᎵ ᎦᏚ ᎠᎴ ᎪᏪᎸ ᏕᎯᏁᎳ'
    item2: 'ᏩᏙ ᏫᎾᏕᏥᏪᏏ ᏣᏍᏕᎸᎯ'
  version: 'ᎢᏳᏓᎴᎩ 1.1, 2 ᎧᏬᏂ 2013'
termsOfUse:
  title: 'ᎬᏗ ᏗᎧᎿᏩᏛᏍᏗ'
  headline: Welcome to the Catrobat Community!
  text1: 'Catrobat ᎦᏚᎲ ᏣᏁᎯ ᎨᏒ, ᏚᎸᏫᏍᏓᏁᎸᎯ ᎠᎴ ᎤᎾᏓᏅᏖᏗ ᏕᎯᏁᎳ ᏴᏫ:'
  text2: 'ᏍᎩᏍᏕᎸᏗ ᎣᎦᏚᎵ ᎯᎠ ᎦᏚᎲ ᎣᏍᏓ ᎤᏍᏕᎸᏗ ᏂᎦᏛ ᎠᏁᎯ. ᎯᎠ ᎢᏳᏍᏗ ᏰᎵ ᏣᏍᏕᎸᏗ:'
  text3: 'Catrobat ᏚᎸᏫᏍᏓᏁᎸ ᎬᏗ ᏗᏂᏍᏕᎵᏍᎩ ᎢᏳᎾᏛᏁᏗ ᎣᎦᏚᎵ ᎠᎴ ᏂᎦᏛ ᏴᏫ ᎤᎾᏓᏅᏖᏗ ᏧᏓᏟᏌᏗ ᏂᎦᏛ ᏴᏫ ᎤᏂᏍᏕᎸᏗ. ᎾᏍᏉ ᏰᎵ ᏣᏁᎯ Catrobat ᎦᏚᎲ ᏱᎩ ᏕᏣᎸᏫᏍᏓᏁᎸᎯ ᎦᏚᎲ ᏕᏣᏁᎲ ᎠᏓᏁᏗ ᎢᏯᏛᏁᏗ, ᏅᏩᏓᎴ ᎠᏁᎯ ᏚᏂᏤᎵ ᏚᎸᏫᏍᏓᏁᎸᎯ ᏕᏣᏁᎲ ᎾᏍᎩᏯ:'
  text4: 'ᎣᎦᏤᎵ ᎠᏓᏁᏗ ᏂᎯ ᏣᏤᎵ:'
  text5: 'ᎣᎦᏤᎵ ᎬᏗ ᏗᎧᎿᏩᏛᏍᏗ:'
  list1:
    item1: 'ᎤᏣᏘ ᏧᏓᎴᏅᏛ ᏓᎶᏂᎨ ᎠᎴ ᎢᏳᎾᏍᏗ'
    item2: 'ᏂᎦᏛ ᎢᏳᎾᏕᏘᏴᏛ (ᏗᏂᏲᎵ ᎢᏳᏓᎴᏅᏛ ᎤᏂᏛᎦᏴ ᎢᏯᏍᏗ)'
    item3: 'ᏂᎦᏛ ᎢᏳᎾᎦᏙᎥᏒ'
  list2:
    item1: 'ᎣᏍᏛ ᏕᎭᏓᏅᏓᏗᏍᏗᏍᎨᏍᏗ. ᏚᎸᏫᏍᏓᏁᎸᎯ ᏕᎯᏁᎳᏗᏍᎬ, ᎯᏰᎵᏎᎮᏍᏗ ᎤᏣᏘ ᏧᏓᎴᏅᏛ ᎢᏳᎾᏕᏘᏴᏛ ᏴᏫ ᏓᏂᎪᏩᏘᏍᎨᏍᏗ ᏂᏣᏛᏁᎸ.'
    item2: 'ᏩᏙ ᎯᏪᏍᎨᏍᏗ. ᏰᎵ ᏅᏩᏓᎴ ᏴᏫ ᏚᏂᎸᏫᏍᏓᏁᎸ ᏣᏁᏟᏴᏍᏗ - ᎠᏎᏃ ᏩᏙ ᏫᎾᏕᏥᏪᏏ. ᏚᎸᏫᏍᏓᏁᎸ ᏗᎪᏪᎸ ᎠᎴ ᏩᏙ ᎾᎿᎢ ᏰᎵ ᏩᏙ ᎯᏪᏍᏗ. ᎡᎳᏗ ᎪᏪᎸ ᎯᎦᏔ ᏅᏩᏓᎴ ᏴᏫ ᏚᏂᎸᏫᏍᏓᏁᎸ ᎦᏁᏟᏴᏍᏗ ᎧᏃᎮᏛ.'
    item3: 'ᎤᏙᎯᏳ ᎯᏬᏂᏍᎨᏍᏗ. ᏞᏍᏗ ᏅᏩᏓᎴ ᏴᏫ ᏂᏣᎵᏍᏗᏍᎨᏍᏗ ᎠᎴ ᏞᏍᏗ ᎦᏚᎲ ᏱᏙᎯᎶᏄᎮᎮᏍᏗ.'
    item4: 'ᏣᏤᎵ ᎧᏃᎮᏛ ᎤᏕᎵᏛ ᎨᏎᏍᏗ. ᏞᏍᏗ ᏣᏤᎵ email, ᏗᏯᏂᏍᏗ ᏗᏎᏍᏗ, ᎠᎴᏱᎩ ᏅᏩᏓᎴ ᏣᏤᎵ ᎧᏃᎮᏛ ᏱᏕᎯᏁᎳᏗᏍᎨᏍᏗ.'
    item5: "ᎯᎠ ᎦᏚᎲ ᎣᏍᏓ ᏗᏍᏆᏂᎪᏙᏗ ᎯᏍᏕᎸ. ᎢᏳᏃ ᏣᏓᏅᏖᏍᎨᏍᏗ ᏚᎸᏫᏍᏓᏁᎸ ᎠᎴᏱᎩ ᎧᏃᎮᏛ ᎤᏲ, ᎤᏂᏐᏢᏗ, ᎤᏣᏘ ᎤᏍᎦᏎᏗ, ᎠᎴᏱᎩ ᎥᏝ ᎣᏏᏳ ᏱᎩ, 'ᎥᏝ ᎣᏏᏳ ᎯᏃᎲᏏ' ᎦᏁᏍᏛᏗ ᎯᏯᏁᏍᏛᏂ ᎠᎴ ᎤᏍᏗ ᎧᏃᎮᏛ ᎪᏪᎳ. Catrobat ᏗᎦᎸᏫᏍᏓᏁᎯ ᏓᏂᎦᏔᏂ ᏣᏃᎲᏎᎸ ᎠᎴ ᏰᎵ ᏚᏂᏛᏔᏗ ᏚᎸᏫᏍᏓᏁᎸ, ᎧᏃᎮᏛ, ᎠᎴᏱᎩ ᎪᏪᎸ."
  list3:
    item1: "ᏚᎸᏫᏍᏓᏁᎸ ᏦᎦᏤᎵ websites ᏣᏅᏍᏔᏅ, ᎣᏏᏳ ᏣᏰᎸᏗ ᎯᎠ ᏚᎸᏫᏍᏓᏁᎸ ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ ᏗᎧᎿᏩᏛᏍᏗ ᎡᎳᏗ ᎨᏒᎢ. Catrobat ᏂᏓᎬᏩᎶᏛ ᏣᎩᏍᏗ ᎾᏍᎩᏯ, ᎯᎠ ᏗᎧᎿᏩᏛᏍᏗ ᏂᎦᏛ ᏴᏫ ᏰᎵ ᏓᏕᎶᏆᎮᏍᏗ ᏅᏩᏓᎴ ᏚᎸᏫᏍᏓᏁᎸᎯ ᎠᎴ ᎢᏤ ᏂᏓᏅᏁᎮᏍᏗ ᎤᏅᏒ ᏗᏁᏍᎨᏍᏗ, ᏗᏟᎶᏍᏔᏅ ᏓᏅᏃᏍᎩ, ᎠᎴ ᏅᏩᏓᎴ ᏚᎸᏫᏍᏓᏁᎸᎯ ᏧᏃᏢᏍᏗ. ᎾᏍᎩ ᎢᏳᏍᏗ ᏂᎦᏛ ᏴᏫ 'ᏚᏂᏍᏕᎸᏗ ᎤᎾᎵᎪᎯ', ᏂᎯ ᎾᏍᏉ! ᏕᏣᎸᏫᏍᏓᏁᎸ ᏂᎬᎾᏛ ᎡᎶᎯ ᏓᏍᏕᎵᏍᎨᏍᏗ ᎠᎴ ᏂᎦᏛ ᏴᏫ ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ ᎬᏗ ᎨᏎᏍᏗ, Wikipedia ᎾᏍᎩᏯ. ᎠᏓᏁᏗ ᏴᏫ ᏣᏁᎲ ᎢᏯᏛᏁᏗ ᎯᏰᎵᏎᎮᏍᏗ: ᏂᎦᏛ ᏕᎯᏁᎰ, ᎠᎴ ᏂᎦᏛ ᏅᏩᏓᎴ ᏦᎦᏤᎵ websites ᏓᏅᏍᏗᏍᎩ ᏕᏣᏁᎰ. ᏚᏅᏍᏔᏅ ᏚᎸᏫᏍᏓᏁᎸ ᎤᏣᏘ ᎦᎸᏉᏗᏳ ᎠᏓᏁᏗ, ᎤᏤᎵ ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ ᏣᏁᎰ, ᎦᏚᎲ ᎾᏍᎩᏯ ᏗᎧᎿᏩᏛᏍᏗ ᏣᏁᏴᏍᏗ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ."
    item2: 'ᎥᏝ ᎠᏓᏁᏗ ᏯᏚᎵ ᏣᏓᏂᎸᏍᏗ; ᎢᏳᏃ ᏣᏓᏂᎸᏍᎨᏍᏗ, ᎩᎶ ᏗᎧᎿᏩᏛᏍᏗ ᎦᏁᎭ. ᎯᎠ ᏗᎧᎿᏩᏛᏍᏗ ᎣᏍᏓ ᏂᎦᎵᏍᏗᏍᎪ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ ᏰᎵ ᏣᏕᎶᏆᏍᏗ ᎠᎴ ᎤᏟ ᎣᏍᏓ ᏣᏙᏢᏍᏗ, ᎾᏍᎩ ᏔᎵᏁ ᏦᎦᏤᎵ websites ᏣᏤᎵ ᎢᏯᏛᏁᏗ ᏰᎵ ᎯᏅᏍᏗ. ᎾᏍᏉ ᎯᎠ ᏗᎧᎿᏩᏛᏍᏗ ᏓᏍᏆᏂᎪᏗᏍᎪ ᎥᏝ ᏰᎵ ᏣᏍᎦᏅᏨ ᏱᎦᎬᏁᏗ ᎢᏳᏃ ᏅᏩᏓᎴ ᏴᏫ ᏚᎸᏫᏍᏓᏁᎸ ᎬᏗᏍᎬ ᎤᏲ ᏳᎵᏍᏓᏁᎴᏍᏗ.'
    item3: 'ᎤᏣᏘ ᎦᎸᏉᏗᏳ ᏗᎧᎿᏩᏛᏍᏗ: ᎤᏙᎯᏳ ᏚᏙᎥ ᎪᏪᎳ ᏴᏫ ᏚᏂᎸᏫᏍᏓᏁᎸ ᏣᏍᏕᎸᎯ. ᎾᏍᏉ ᎣᏍᏓ ᏙᏓᏲᎦᎸᏫᏍᏓᏁᎵ ᏅᏩᏓᎴ ᏴᏫ ᎤᏂᎦᏙᎥᎯᏍᏗ ᏂᎯ ᏣᏙᏢᏅ, ᏕᏣᏙᎥ Catrobat ᎦᏚᎲ ᏣᏑᏰᏒ ᎪᏪᎸ ᎨᏒ, ᎠᎴ ᏅᏩᏓᎴ ᏴᏫ ᏰᎵ ᏩᏙ ᏫᏂᏣᏪᏏ ᏂᎦᏛ ᏴᏫ ᏕᏣᏁᎸ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ.'
    item4: 'ᎤᏙᎯᏳ ᏗᎧᎿᏩᏛᏍᏗ %link-licenseUploaded% ᎯᎦᏔ.'
  list4:
    item1: 'ᏂᎦᏛ ᎣᎦᏤᎵ software ᎠᎴ Internet ᎪᎱᏍᏗ Catrobat ᏚᏓᏠᎯᏍᏛ, Catrobat ᏗᎦᎸᏫᏍᏓᏁᎯ ᎤᏃᏪᎳᏅ software, ᎣᎦᏤᎵ websites, ᎣᎦᏤᎵ ᏗᎾᎦᎾᏌᎢᏍᏗ ᏗᎪᏪᎵ, ᎠᎴ ᏂᎦᏛ ᏅᏩᏓᎴ ᏧᏓᎴᏅᏓ ᏗᏟᎶᏍᏔᏅ, ᏗᎧᏁᎬ, ᎠᎴ ᏗᎪᏪᎵ ᎾᏍᎩᏯ, ᎪᎯ ᎠᎴ ᎤᎵᏍᏆᎸᏗ ᏕᏨᏁᎰ Catrobat ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ ᏗᎧᎿᏩᏛᏍᏗ ᎬᏗ.'
    item2: 'ᎯᎠ ᏗᎧᎿᏩᏛᏍᏗ ᏂᎦᏛ Catrobat ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ ᏂᏓᏛᏁᎰ ᎠᎴ ᏰᎵ ᏂᎦᎥ ᏣᏚᎵᏍᎬ ᎬᏗ, ᎤᏍᏗ ᏗᎧᎿᏩᏛᏍᏗ ᎤᏩᏒ ᏓᏍᏆᏂᎪᏗᏍᎪ Catrobat ᏂᎪᎯᎸ ᎪᎱᏍᏗ ᏂᏓᎬᏩᎶᏛ ᎠᎴ ᎣᏏᏳ ᎬᏗ ᎨᏒ ᏂᎦᏛ ᏴᏫ.'
    item3: 'ᎤᏙᎯᏳ ᏗᎧᎿᏩᏛᏍᏗ %link-licenseToPlay% ᎯᎦᏔ. Catrobat ᏗᎾᎦᎾᏌᎢᏍᏗ ᏗᎪᏪᎵ ᎠᎴ ᎤᏣᏘ ᏅᏩᏓᎴ ᏗᎪᏪᎵ %link-developer% ᎾᎿᎢ ᏓᏁᎭ.'
  list5:
    item1: 'ᎢᏳᏃ ᏂᎯ, ᎠᎴᏱᎩ 13 ᎢᏴ ᎢᏣᏛᎾ ᎢᎨᏎᏍᏗ, ᏣᏙᏓ ᎠᎴᏱᎩ ᏣᎦᏘᏯ, ᏧᏓᏠᎯᏍᏛ ᎨᏎᏍᏗ ᏗᎾᏓᏡᏩᏗᏍᎩ ᎤᏂᏣᏘ ᏴᏫ ᎤᏕᎵᏛ ᏓᏂᎦᏂᏯᏍᎬ ᎠᎴᏱᎩ ᏓᏂᎦᏂᏯᏍᎬ, ᎥᏝ ᏰᎵ ᏦᎦᏤᎵ software ᎠᎴ ᏗᏍᏕᎸᏗ ᏱᏣᏁᏗ. ᎤᏙᎯᏳ ᎯᎠ ᏗᎧᎿᏩᏛᏍᏗ 4.a ᎠᎴ 4.b ᎾᎿᎢ %link-termsOfUse% ᎪᏪᎸ.'
    item2: 'ᎢᏳᏃ 13 ᎢᏴ ᎢᏣᏛᎾ ᎢᎨᏎᏍᏗ, ᏣᏙᏓ ᎠᎴᏱᎩ ᏣᎦᏘᏯ ᎯᏯᏛᏛᏂ ᏰᎵ Catrobat ᏣᏁᏗ.'
    item3: 'ᏂᎪᎯᎸ ᏰᎵ ᏙᏥᏲᏍᏙᏗ, ᏙᏥᏛᏔᏗ, ᎠᎴᏱᎩ ᏙᏥᏍᎦᎳᏗ ᏚᎸᏫᏍᏓᏁᎸᎯ, ᏕᎦᏙᎥ, ᎠᎴ ᏂᎦᏛ Catrobat websites ᏚᏅᏍᏔᏅ, ᎢᏳᏃ ᏚᎸᏫᏍᏓᏁᎸ ᎥᏝ ᎣᏏᏳ ᏱᎦᏁᎭ ᎠᎴᏱᎩ ᏴᏫ ᏅᏩᏓᎴ ᏴᏫ ᎤᏂᏤᎵ ᏗᎧᎿᏩᏛᏍᏗ ᏱᎤᏲᏍᏔᏁᎭ.'
    item4: 'ᏂᎦᏛ Catrobat software ᎠᎴ Internet ᎪᎱᏍᏗ ᏕᏨᏁᎰ ᎣᏏᏳ ᎬᏗ ᎨᏒ ᎣᎦᏚᎵᏍᎬ, ᎠᏎᏃ ᎥᏝ ᏳᏙᎯᏳᎯ.'
    item5: 'ᎤᏙᎯᏳ ᏗᎧᎿᏩᏛᏍᏗ ᎠᎴ ᏅᏩᏓᎴ ᏗᎧᎿᏩᏛᏍᏗ %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service ᎯᎦᏔ.'
  bottom1: 'ᏂᎪᎯᎸ ᎠᏂ ᎯᎦᏔ, ᏂᎪᎯᎸ ᎤᏟ ᎣᏍᏓ ᏙᎦᏁᏟᏴᏍᎪ ᎣᎦᏤᎵ ᎬᏗ ᏗᎧᎿᏩᏛᏍᏗ.'
  bottom2: 'ᎯᎠ ᎬᏗ ᏗᎧᎿᏩᏛᏍᏗ ᏣᏓᏅᏖᏍᎬ %email-webmaster% ᎯᏅᏍᏓ.'
