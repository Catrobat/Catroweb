passwordRecovery:
  subject: Recuperació de la teva contrasenya de Catrobat
  message: |
    Hola, %username%.
    Has demanat restablir la teva contrasenya a %appplication_url% perquè l'has oblidada.
    Si no ho has demanat tu, ignora aquest missatge. Caducarà i deixarà de funcionar d'aquí a 24 hores.
    Per restablir la contrasenya i crear-ne una de nova, visita la pàgina següent: %confirmationUrl%
    Pots fer servir el teu nom d'usuari i la teva contrasenya en qualsevol moment per accedir a la comunitat %appplication_url%.
    Per fer-ho, només cal que visitis la pàgina següent: %loginPage%
    Per editar les dades del teu perfil, ves a aquesta pàgina: %profilePage%
    Salutacions cordials,
    L'equip de Catrobat.
  messageHtml: |
    <p>
    Hola, %username%.<br>
    <br>
    Has demanat restablir la teva contrasenya a <a href="%appplication_url%">Pocket Code</a> perquè l'has oblidada.
    Si no ho has demanat tu, ignora aquest missatge. Caducarà i deixarà de funcionar d'aquí a 24 hores.<br>
    <br>
    Per restablir la contrasenya i crear-ne una de nova, fes clic <a href="%confirmationUrl%">aquí.</a><br>
    <br>
    Pots fer servir el teu nom d'usuari i la teva contrasenya en qualsevol moment per accedir a la comunitat <a href="%appplication_url%">Pocket Code</a>.<br>
    Per fer-ho, només cal que visitis la pàgina següent: <a href="%loginPage%">Pàgina d'inici de sessió</a><br>
    Per editar les dades del teu perfil, ves a aquesta <a href="%profilePage%">pàgina</a>.<br>
    <br>
    Salutacions cordials,<br>
    L'equip de Catrobat.
    </p>
