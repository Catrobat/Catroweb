licenseToPlay:
  link: 'Llicència per jugar'
  title: 'Llicència per jugar - Dona crèdit i comparteix'
  text1: Imagina que cada projecte de Catrobat és un pastís, un pastís molt especial que ve amb la seva recepta (blocs de programació). Tots els membres de la comunitat Catrobat comparteixen els seus pastissos juntament amb les receptes. Això vol dir que pots gaudir dels pastissos i aprendre a fer-los tu mateix!
  text2: 'No hi ha receptes secretes: les instruccions per fer aquests pastissos estan obertes perquè qualsevol les faci servir, les reutilitzi, les modifiqui i les prengui com a inspiració per a noves idees... vull dir, pastissos.'
  text3: "Pots menjar-te els pastissos i també copiar les receptes d'altres persones per fer-ne els teus, potser amb ingredients diferents. Aquesta llibertat ve amb dos requisits senzills:"
  text4: "En crear la comunitat Catrobat, vam decidir adoptar aquest enfocament perquè creiem que afavoreix l'aprenentatge i la creativitat dins la comunitat. Compartint receptes i ingredients (scripts i dibuixos), les persones poden construir a partir de les idees dels altres i tothom en surt guanyant."
  text5: En dissenyar el lloc web de Catrobat, hi vam incloure funcions per animar la gent a compartir i a donar crèdit als altres. A la pàgina de cada projecte sempre pots descarregar-ne els scripts originals. Si fas un remix d'un projecte (modificant-ne els scripts o els dibuixos i compartint-ne el resultat), et recomanem que donis crèdit a les notes del projecte, esmentant les persones i el projecte que t'han inspirat.
  text6: 'Més informació sobre les condicions d''ús de la comunitat en línia de Catrobat a %link-termsOfUse%.'
  list1:
    item1: comparteix els teus pastissos juntament amb la recepta
    item2: dona crèdit a qui t'ha inspirat
  version: Versió 1.1, 2 d'abril de 2013
termsOfUse:
  title: Condicions d'ús
  headline: Benvingut a la comunitat Catrobat!
  text1: 'Com a part de la comunitat Catrobat, comparteixes projectes i idees amb persones:'
  text2: "Necessitem la teva ajuda perquè aquesta comunitat sigui un lloc acollidor per a tots els membres. Així és com pots ajudar:"
  text3: "Amb el projecte Catrobat volem fomentar la cooperació i permetre que la creativitat de tothom es combini en benefici de tota la humanitat. Tu també pots ser un membre actiu de la comunitat Catrobat retornant els teus projectes a la comunitat com a regal, de la mateixa manera que altres membres actius et regalen els seus projectes:"
  text4: 'El nostre regal per a tu:'
  text5: 'Les nostres condicions d''ús i de servei:'
  list1:
    item1: de molts països i cultures diferents
    item2: de totes les edats (des d'infants petits fins a adolescents i avis)
    item3: amb tots els nivells d'experiència
  list2:
    item1: Sigues respectuós. Quan comparteixis projectes, recorda que persones de moltes edats i procedències diferents veuran les teves aportacions.
    item2: "Dona crèdit. Pots fer versions modificades dels projectes d'altres persones, però assegura't de donar-los crèdit. Un lloc per fer-ho és la secció de notes i crèdits del teu projecte. Consulta el paràgraf de sota d'aquesta llista per a més detalls sobre com modificar projectes d'altres usuaris."
    item3: "Sigues honest. No facis veure que ets algú que no ets ni intentis enganyar la comunitat."
    item4: "Mantén la teva informació personal en privat. No comparteixis la teva adreça de correu electrònic, el número de telèfon ni cap altra dada de contacte personal."
    item5: "Ajuda a mantenir el lloc agradable. Si creus que altres persones trobarien un projecte o un comentari desagradable, ofensiu, massa violent o inadequat d'alguna altra manera, fes clic al botó 'denuncia com a inadequat' i deixa una breu explicació. L'equip de Catrobat revisarà la teva denúncia i pot eliminar qualsevol projecte, comentari o publicació."
  list3:
    item1: "En pujar un projecte als nostres llocs web, acceptes posar aquesta obra sota determinades llicències lliures dels projectes de Catrobat pujats. De manera semblant a les llicències lliures amb què tens a la teva disposició el mateix sistema Catrobat, aquestes llicències lliures dels projectes pujats donen a tothom el dret d'aprendre de les obres que altres han pujat abans i d'adaptar-les i fer-ne remixos per construir els seus propis jocs, animacions i altres projectes nous i fascinants. Això permet a tothom 'pujar a les espatlles dels companys', i un d'ells ets tu! Així la teva obra beneficiarà tot el món i continuarà sent lliure perquè tothom la faci servir, una mica com els textos i les imatges que voluntaris de tot el món aporten lliurement a la Viquipèdia. Pensa-ho com el teu regal a la humanitat: tu dones a tothom, i tots els altres que pugen les seves obres als nostres llocs web et donen a tu. Per tant, un projecte pujat és un regal de gran valor que el seu propietari et fa gratuïtament, amb la condició que participis en la comunitat amb les mateixes condicions."
    item2: No estàs obligat a acceptar el regal; si l'acceptes, s'apliquen certes regles. L'avantatge d'aquestes regles és que pots aprendre de l'obra i construir-hi a sobre per fer coses encara més xules tu mateix, que després pots, per exemple, tornar a pujar als nostres llocs web com a pròpies. Un altre avantatge és que aquestes llicències garanteixen que no se't pugui fer responsable de cap problema que tinguin altres persones per l'ús del teu projecte.
    item3: "Una condició addicional important és que reconeguis clarament l'autoria de les persones en les obres de les quals t'has basat. Al mateix temps, ens esforçarem perquè els altres reconeguin clarament que la teva obra l'has aportat tu, atribuint-la al nom únic que has triat lliurement per representar-te a la comunitat Catrobat, i donant als altres l'oportunitat d'expressar-te públicament el seu agraïment per haver regalat la teva obra a tothom i, en particular, a ells."
    item4: 'Consulta %link-licenseUploaded% per conèixer els termes i condicions legals exactes.'
  list4:
    item1: "Et oferim tot el nostre programari i recursos d'Internet relacionats amb el sistema Catrobat, per exemple el programari escrit per l'equip de Catrobat, els nostres llocs web i recursos d'Internet, el nostre codi font relacionat amb el sistema Catrobat i tots els materials addicionals inclosos, com ara imatges, sons i textos, ara i en el futur, sota les llicències lliures de Catrobat."
    item2: Aquestes llicències fan que totes les parts de Catrobat siguin gratuïtes per a tu i també lliures, en el sentit que et donen la llibertat de fer-les servir com vulguis, amb només unes poques restriccions que garanteixen, entre altres coses, que el sistema Catrobat continuï sent per sempre lliure i útil per a tothom.
    item3: 'Consulta %link-licenseToPlay% per conèixer els termes i condicions legals exactes. El codi font del sistema Catrobat i molts altres documents i recursos estan disponibles a %link-developer%.'
  list5:
    item1: 'Si tu o, si tens menys de 13 anys, els teus pares o tutors legals esteu vinculats a una organització implicada o responsable de violacions de la privacitat de tipus massiu i/o de vigilància massiva, no tens permís per fer servir les nostres aplicacions ni per accedir als nostres serveis. Els detalls exactes d''aquesta restricció i algunes excepcions es descriuen a les seccions 4.a i 4.b de les nostres %link-termsOfUse%.'
    item2: Si tens menys de 13 anys, has de preguntar als teus pares o tutors legals si et deixen fer servir les aplicacions i els serveis de Catrobat.
    item3: "Ens reservem el dret de rebutjar, eliminar o amagar projectes, comptes d'usuari i qualsevol material digital pujat als llocs web de Catrobat en qualsevol moment i segons el nostre criteri, per exemple si veiem que un projecte conté material inadequat o que un usuari vulnera els drets d'altres persones."
    item4: "Tot el programari i els recursos d'Internet de Catrobat s'ofereixen amb l'esperança que siguin útils, però sense cap garantia."
    item5: 'Consulta les nostres %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service per a la formulació exacta dels punts anteriors i alguns termes i condicions legals addicionals.'
  bottom1: Torna a mirar aquesta pàgina de tant en tant, perquè sempre intentem millorar les nostres condicions d'ús.
  bottom2: 'Envia qualsevol suggeriment sobre aquestes condicions d''ús a %email-webmaster%.'
