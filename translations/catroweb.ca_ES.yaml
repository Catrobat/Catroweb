privacy-policy:
  header: Política de privacitat
  version: Versió 2.2, 17 d'octubre de 2019
  text1: Per oferir-te tots els avantatges dels nostres serveis i del compte associat, cal recollir algunes dades teves.
  text2: Per mantenir i millorar els nostres serveis (aplicacions i llocs web) i per fer recerca científica sobre l'educació en TIC i STEM/STEAM, fem servir Google Analytics, Crashlytics i Firebase, tots de Google LLC (EUA), així com Dynatrace de Dynatrace LLC (EUA), per obtenir metadades sobre l'ús dels nostres serveis, per exemple informació sobre errors, marques de temps, pàgines/pantalles visitades, ús de les nostres aplicacions i serveis, sistema operatiu utilitzat i informació sobre el proveïdor de xarxa. Aquesta anàlisi i les dades recollides no estan vinculades al teu perfil i no contenen cap informació personal (els últims bits de l'adreça IP s'anonimitzen). Tanmateix, les dades recollides es transfereixen als proveïdors del servei (Google LLC, EUA i Dynatrace LLC, EUA). El tractament de les dades es basa en acords amb Google LLC i Dynatrace LLC. Aquesta relació amb els proveïdors del servei compleix el Reglament general de protecció de dades de la Unió Europea (RGPD) i l'acord UE-EUA "Privacy Shield".
  text3: Per crear i fer servir un compte als nostres sistemes, i per informar-te per correu electrònic de canvis necessaris sobre el teu compte, per exemple actualitzacions o infraccions de les nostres condicions d'ús i de servei, de les normes de la comunitat o de les nostres polítiques, desarem el teu nom d'usuari i, si ens la dones, la teva adreça de correu electrònic. Si has connectat el teu compte amb Google Plus o Facebook, també desem una clau d'identificació vinculada al teu compte en aquests serveis. No farem servir aquestes dades per a cap altra finalitat (per exemple, de màrqueting), tret que ens ho hagis permès explícitament.
  text4: De manera voluntària, ens pots indicar el teu país de residència a la pàgina del teu compte al lloc web per compartir projectes. Es mostrarà al teu perfil públic i només el farem servir amb finalitats estadístiques i de recerca. El pots treure en qualsevol moment a la configuració del perfil.
  text5: Pots retirar l'ús de les dades personals del teu compte en qualsevol moment eliminant el compte des de la teva pàgina de perfil a https://share.catrob.at/. Després d'eliminar el compte, podràs continuar fent servir els serveis oferts, però no col·laborar, per exemple pujant programes, comentant o fent m'agrada. A més, s'eliminarà tot el contingut vinculat al teu compte, per exemple programes pujats, comentaris, etc.
  text6: Per evitar l'ús indegut dels nostres serveis, per exemple mitjançant pujades o comentaris d'usuaris amb finalitats il·legals, totes les dades públiques generades pels usuaris (pujades, comentaris) es desaran internament en una base de dades, juntament amb una marca de temps i l'adreça d'Internet utilitzada. Aquestes dades no les farà servir ni es passaran a cap institució, tret que hi hagi sospites raonables d'accions prou il·legals i institucions legals oficialment autoritzades les sol·licitin d'acord amb la llei aplicable. Primer revisarem a fons cada cas de manera individual.
  text7: Pots subscriure't voluntàriament al butlletí de Catrobat a https://catrob.at/newsletter, que oferim mitjançant el servei MailChimp (The Rocket Science Group LLC d/b/a MailChimp, EUA). Aleshores rebràs novetats sobre el projecte Catrobat i els seus serveis a l'adreça de correu electrònic que hagis indicat. Pots donar-te de baixa del butlletí en qualsevol moment amb l'enllaç "unsubscribe" del peu de cada butlletí. Aquest butlletí l'ofereix MailChimp, amb qui tenim un acord de tractament de dades i que s'ha compromès amb el Reglament general de protecció de dades de la UE i el "Privacy Shield" UE-EUA. Per a més detalls sobre MailChimp, consulta també la política de privacitat i les condicions d'ús de MailChimp.
  text8: Tots els serveis els ofereix el projecte lliure i de codi obert Catrobat sota el paraigua de la International Catrobat Association – Verein zur Förderung freier Software, una ONG sense ànim de lucre constituïda a Graz, Àustria (Unió Europea). Les nostres polítiques respecten la legislació de protecció de dades de la UE i d'Àustria (RGPD). Per contactar amb nosaltres, envia un correu electrònic a contact@catrobat.org o escriu-nos a Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Àustria (Unió Europea).
  text9: Si tens menys de 14 anys, aquesta política l'ha d'acceptar un tutor legal (normalment el pare o la mare).
  text10: La política de privacitat oficial de Catrobat en anglès està disponible al web a %privacy_policy%.
  disagree-text: Sense la teva aprovació no podem crear un compte, però les funcions principals continuen disponibles.
