consent:
  email:
    subject: "Cal el consentiment parental per al compte de Catrobat del teu fill o filla"
    title: "Cal el consentiment parental"
    greeting: "Hola,"
    message: "El teu fill o filla %username% ha creat un compte a Catrobat i ha verificat la seva adreça de correu electrònic."
    explanation: "Catrobat és una plataforma educativa gratuïta on els joves aprenen a programar creant aplicacions, jocs i animacions. D'acord amb la normativa de la UE de protecció de menors, necessitem el teu consentiment perquè el teu fill o filla pugui participar plenament a la comunitat. Fes clic al botó de sota per donar el teu consentiment."
    button: "Dona el consentiment parental"
    ignore: "Si no esperaves aquest correu, pots ignorar-lo sense problemes. Sense consentiment, el compte tindrà funcions limitades."
    whatIsCatrobat: "Catrobat és una plataforma educativa de programació gratuïta i sense ànim de lucre. Més informació a catrobat.org."
    manageLink: 'Pots gestionar el compte del teu fill o filla en qualsevol moment des del nostre <a href="%portalUrl%" style="color: #00acc1;">Portal per a famílies</a>. Més informació sobre <a href="%infoUrl%" style="color: #00acc1;">els teus drets com a pare, mare o tutor</a>.'
  confirmed:
    title: "Consentiment donat"
    message: "Gràcies! El compte de %username% ja està totalment activat."
    continueButton: "Descobreix projectes"
parent:
  footer:
    link: "Famílies i tutors"
  info:
    title: "Informació per a famílies i tutors"
    intro: "Catrobat es pren seriosament la seguretat i la privacitat dels usuaris joves. Aquesta pàgina explica com protegim el teu fill o filla i quins drets tens."
    whatIsCatrobat:
      title: "Què és Catrobat?"
      text: "Catrobat és una plataforma educativa gratuïta i sense ànim de lucre on els joves aprenen a programar creant les seves pròpies aplicacions, jocs i animacions. La plataforma està disponible a tot el món i s'utilitza en entorns educatius."
    dataCollected:
      title: "Quines dades recollim?"
      text: "Recollim les dades mínimes necessàries per fer funcionar la plataforma: nom d'usuari, adreça de correu electrònic, data de naixement i els projectes que el teu fill o filla creï i pugi. Per als usuaris de menys de 14 anys, també desem l'adreça de correu d'un pare, mare o tutor per al consentiment. No venem ni compartim dades personals amb tercers."
    yourRights:
      title: "Els teus drets com a pare, mare o tutor"
      text: "D'acord amb la normativa de la UE de protecció de menors (RGPD) i la COPPA, tens dret a: revisar les dades que tenim del teu fill o filla, demanar-ne una còpia, retirar el teu consentiment en qualsevol moment (cosa que restringeix el compte) i demanar l'eliminació definitiva del compte del teu fill o filla i de totes les dades associades."
    minorRestrictions:
      title: "Quines restriccions tenen els comptes de menors?"
      text: "Els usuaris de menys de 16 anys no poden publicar ni llegir comentaris, seguir altres usuaris ni veure contingut marcat com a no adequat per a infants. Sí que poden crear i pujar projectes, explorar projectes públics i reaccionar-hi amb m'agrades. Aquestes restriccions existeixen per oferir un entorn d'aprenentatge segur."
    manageButton: "Gestiona el compte del teu fill o filla"
  portal:
    title: "Portal per a famílies"
    description: "Escriu la teva adreça de correu electrònic per rebre un enllaç segur per gestionar el compte de Catrobat del teu fill o filla. L'enllaç s'enviarà a l'adreça de correu que es va indicar durant el registre."
    emailLabel: "La teva adreça de correu electrònic"
    submitButton: "Envia l'enllaç de gestió"
    infoLink: "Més informació"
    success:
      title: "Revisa la safata d'entrada"
      message: "Si hi ha algun compte associat a aquest correu, t'hem enviat un enllaç de gestió. Revisa la safata d'entrada i segueix l'enllaç per gestionar el compte del teu fill o filla."
