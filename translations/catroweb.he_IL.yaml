licenseToPlay:
  link: 'רשיון לשחק'
  title: 'רשיון לשחק - תן קרדיט ושיתוף'
  text1: "דמיין שכל פרויקט Catrobat הוא עוגה, עוגה מיוחדת מאוד שמגיעה עם המתכון שלה (אבני התכנות). כל חברי קהילת Catrobat משתפים את העוגות שלהם יחד עם המתכונים. זה אומר שאתה יכול ליהנות מהעוגות וללמוד איך להכין אותן בעצמך!"
  text2: 'אין מתכונים סודיים: ההוראות איך להכין את העוגות האלה פתוחות לכולם כדי להשתמש, להשתמש-מחדש, לשנות, ולשרת כהשראה לרעיונות חדשים... אני מתכוון עוגות.'
  text3: "אתה יכול לאכול את העוגות וכמו כן להעתיק מתכונים של אנשים כדי להכין עוגה משלך, אולי עם מרכיבים שונים. החופש הזה בא עם שני תנאים פשוטים:"
  text4: "כשהקמנו את קהילת Catrobat, החלטנו לאמץ את הגישה הזו כי אנחנו מאמינים שהיא תומכת בלמידה וביצירתיות בקהילה. כשמשתפים מתכונים ומרכיבים (תסריטים ויצירות), אנשים יכולים לבנות על הרעיונות של אחרים וכולם מרוויחים."
  text5: "כשעיצבנו את אתר Catrobat, כללנו תכונות שמעודדות אנשים לשתף ולתת קרדיט לאחרים. בכל דף פרויקט אפשר תמיד להוריד את התסריטים המקוריים של הפרויקט. אם אתה עושה רמיקס לפרויקט (משנה את התסריטים או היצירות ומשתף את התוצאה), אנחנו מעודדים אותך לתת קרדיט בהערות הפרויקט ולציין את האנשים והפרויקט שהיוו לך השראה."
  text6: 'למד עוד אודות תנאי השימוש של הקהילה המקוונת Catrobat על %link-termsOfUse%.'
  list1:
    item1: חלוק את העוגות שלך יחד עם המתכון
    item2: תן קרדיט לאלו שגרמו לך להשראה
  version: "גרסה 1.1, 2 באפריל 2013"
termsOfUse:
  title: תנאי שימוש
  headline: ברוכים הבאים לקהילת Catrobat!
  text1: "כחלק מקהילת Catrobat, אתה משתף פרויקטים ורעיונות עם אנשים:"
  text2: "אנחנו צריכים את העזרה שלך כדי להפוך את הקהילה הזאת למקום תומך עבור כל חבר. קרא איך אתה יכול לעזור:"
  text3: "דרך פרויקט Catrobat אנחנו רוצים לעודד שיתוף פעולה ולאפשר ליצירתיות של כולם להתחבר לטובת האנושות כולה. גם אתה יכול להפוך לחבר פעיל בקהילת Catrobat על ידי כך שתחזיר את הפרויקטים שלך לקהילה כמתנה, בדיוק כמו שחברים פעילים אחרים נותנים לך את הפרויקטים שלהם:"
  text4: 'המתנה שלנו בשבילך:'
  text5: 'שלנו תנאי שימוש ושירות:'
  list1:
    item1: במדינות שונות ותרבויות שונות
    item2: "בכל הגילים (מילדים צעירים ועד בני נוער וסבים וסבתות)"
    item3: עם כל רמות ניסיון
  list2:
    item1: "היה מכבד. כשאתה משתף פרויקטים, זכור שאנשים בגילים ומרקעים שונים רבים יראו את מה שתרמת."
    item2: "תן קרדיט. אתה מוזמן ליצור גרסאות משונות של פרויקטים של אנשים אחרים - רק הקפד לתת להם קרדיט. מקום אחד לתת קרדיט הוא אזור ההערות והקרדיטים של הפרויקט שלך. עיין בפסקה שמתחת לרשימה הזו לפרטים על שינוי פרויקטים של משתמשים אחרים."
    item3: "תהיה כנים. אל תתחזו ותנסו להערים ולרמות את הקהילה."
    item4: "שמור את המידע האישי שלך. אל תשתף את כתובת הדוא\"ל שלך, מספר הטלפון או פרטים ליצירת קשר אישי אחרים."
    item5: "עזור לשמור על האתר ידידותי. אם אתה מרגיש שאחרים ימצאו פרויקט או תגובה מרושעים, מעליבים, אלימים מדי או לא הולמים בדרך אחרת, פשוט לחץ על הכפתור 'דווח כלא הולם' והשאר הסבר קצר. צוות Catrobat יבדוק את הדיווח שלך ועשוי להסיר כל פרויקט, תגובה או פוסט."
  list3:
    item1: "בהעלאת פרויקט לאתרים שלנו, אתה מקבל ומסכים להעמיד את היצירה הזו תחת רישיונות חופשיים מסוימים של פרויקטי Catrobat שהועלו. בדומה לרישיונות החופשיים שבהם מערכת Catrobat עצמה זמינה לך, הרישיונות החופשיים האלה של פרויקטי Catrobat שהועלו נותנים לכולם את הזכות ללמוד מיצירות שאחרים העלו קודם, ולהתאים ולעשות רמיקס ליצירות אלה כדי לבנות משחקים, אנימציות ופרויקטים חדשים ומרתקים משלהם. כך כל אחד יכול 'לעמוד על כתפי חבריו', ואחד מהם הוא אתה! היצירה שלך תועיל כך לכל העולם ותישאר חופשית לשימוש של כולם, קצת כמו טקסטים ותמונות שמתנדבים מכל העולם תורמים בחופשיות לוויקיפדיה. חשוב על זה כמתנה שלך לאנושות: אתה נותן לכולם, וכל האחרים שמעלים את היצירות שלהם לאתרים שלנו נותנים לך. לכן פרויקט שהועלה הוא מתנה בעלת ערך רב שבעליו נותן לך בחינם, בתנאי שתשתתף בקהילה באותם תנאים."
    item2: "אתה לא חייב לקבל את המתנה; אם תקבל אותה, חלים כללים מסוימים. היתרון של הכללים האלה הוא שאתה יכול ללמוד מהיצירה ולבנות עליה כדי ליצור בעצמך דברים מגניבים עוד יותר, שאותם תוכל אחר כך, למשל, להעלות שוב לאתרים שלנו כיצירה שלך. יתרון נוסף הוא שהרישיונות האלה מבטיחים שלא תישא באחריות לבעיות שנגרמות לאחרים מהשימוש שלהם בפרויקט שלך."
    item3: "תנאי נוסף וחשוב הוא שתציין בבירור את היוצרים שעל יצירותיהם ביססת את היצירה שלך. באותו זמן, נעשה כמיטב יכולתנו כדי שאחרים יכירו בבירור בכך שהיצירה שלך נתרמה על ידך, באמצעות ציון השם הייחודי שבחרת בחופשיות כדי לייצג אותך בקהילת Catrobat, ובאמצעות מתן הזדמנות לאחרים להביע לך את תודתם בפומבי על כך שנתת את היצירה שלך לכולם, ובמיוחד להם."
    item4: "עיין ב-%link-licenseUploaded% לתנאים המשפטיים המדויקים."
  list4:
    item1: "אנחנו מציעים לך את כל התוכנה ומשאבי האינטרנט שלנו הקשורים למערכת Catrobat, למשל התוכנה שנכתבה על ידי צוות Catrobat, האתרים ומשאבי האינטרנט שלנו, קוד המקור שלנו הקשור למערכת Catrobat וכל החומרים הנוספים הכלולים, כמו תמונות, צלילים וטקסטים, עכשיו ובעתיד, תחת הרישיונות החופשיים של Catrobat."
    item2: "הרישיונות האלה הופכים את כל חלקי Catrobat גם לחינמיים עבורך וגם לחופשיים, במובן שהם נותנים לך את החופש להשתמש בהם כרצונך, עם הגבלות מעטות בלבד שמבטיחות, בין השאר, שמערכת Catrobat תישאר לנצח חופשית ושימושית לכולם."
    item3: "עיין ב-%link-licenseToPlay% לתנאים המשפטיים המדויקים. קוד המקור של מערכת Catrobat וכן מסמכים ומשאבים רבים אחרים זמינים דרך %link-developer%."
  list5:
    item1: "אם אתה, או, אם אתה מתחת לגיל 13, ההורים או האפוטרופוסים החוקיים שלך, קשורים לארגון המעורב או האחראי להפרות פרטיות מסוג רשת גורפת ו/או למעקב המוני, אינך רשאי להשתמש באפליקציות התוכנה שלנו ולגשת לשירותים שלנו. הפרטים המדויקים של הגבלה זו וחריגים מסוימים לה מפורטים בסעיפים 4.a ו-4.b ב-%link-termsOfUse% שלנו."
    item2: אם הנך מתחת לגיל 13, אז עליך לבקש מהוריך או מהממונים עליך לאפשר לך להשתמש בתוכנות והשירותים של Catrobat.
    item3: "אנחנו שומרים לעצמנו את הזכות לדחות, למחוק או להסתיר פרויקטים, חשבונות משתמש וכל חומר דיגיטלי שהועלה לאתרי Catrobat בכל עת לפי שיקול דעתנו הבלעדי, למשל אם נמצא שפרויקט מכיל חומר לא הולם או שמשתמש פוגע בזכויות של אנשים אחרים."
    item4: "כל התוכנה ומשאבי האינטרנט של Catrobat מוצעים בתקווה שיהיו שימושיים, אך ללא כל אחריות."
    item5: "עיין ב-%link-termsOfUse% שלנו developer.catrobat.org/terms_of_use_and_service לניסוחים המדויקים של הנקודות שלמעלה ולתנאים משפטיים נוספים."
  bottom1: "חזור לבדוק כאן מדי פעם, כי אנחנו תמיד מנסים לשפר את תנאי השימוש שלנו."
  bottom2: "שלח הצעות בנוגע לתנאי השימוש האלה בדוא\"ל אל %email-webmaster%."
  version: "גרסה 1.3, 4 במרץ 2014"
