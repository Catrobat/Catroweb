parent:
  footer:
    link: "הורים ואפוטרופוסים"
  info:
    title: "מידע להורים ולאפוטרופוסים"
    intro: "Catrobat מתייחסת ברצינות לבטיחות ולפרטיות של משתמשים צעירים. דף זה מסביר איך אנחנו מגנים על ילדך ואילו זכויות יש לך."
    whatIsCatrobat:
      title: "מה זה Catrobat?"
      text: "Catrobat היא פלטפורמה חינוכית חינמית ללא מטרות רווח שבה צעירים לומדים תכנות על ידי יצירת אפליקציות, משחקים ואנימציות משלהם. הפלטפורמה זמינה בכל העולם ומשמשת במסגרות חינוכיות."
    dataCollected:
      title: "אילו נתונים אנחנו אוספים?"
      text: "אנחנו אוספים את המינימום הנדרש להפעלת הפלטפורמה: שם משתמש, כתובת דוא\"ל, תאריך לידה וכל פרויקט שילדך יוצר ומעלה. עבור משתמשים מתחת לגיל 14 אנחנו שומרים גם כתובת דוא\"ל של הורה/אפוטרופוס לצורכי הסכמה. אנחנו לא מוכרים ולא משתפים מידע אישי עם צדדים שלישיים."
    yourRights:
      title: "הזכויות שלך כהורה או כאפוטרופוס"
      text: "לפי תקנות הגנת הילד של האיחוד האירופי (GDPR) ו-COPPA, יש לך זכות: לעיין בנתונים שאנחנו מחזיקים על ילדך, לבקש עותק של נתונים אלה, לבטל את הסכמתך בכל עת (מה שמגביל את החשבון), ולבקש מחיקה לצמיתות של החשבון של ילדך ושל כל הנתונים הקשורים אליו."
    minorRestrictions:
      title: "אילו הגבלות חלות על חשבונות של קטינים?"
      text: "משתמשים מתחת לגיל 16 לא יכולים לפרסם או לקרוא תגובות, לעקוב אחרי משתמשים אחרים או לצפות בתוכן שסומן כלא מתאים לילדים. הם עדיין יכולים ליצור ולהעלות פרויקטים, לעיין בפרויקטים ציבוריים ולהגיב לפרויקטים עם לייקים. ההגבלות האלה נועדו לספק סביבת למידה בטוחה."
    manageButton: "נהל את החשבון של ילדך"
