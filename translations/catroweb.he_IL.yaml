privacy-policy:
  header: "מדיניות פרטיות"
  version: "גרסה 2.2, 17 באוקטובר 2019"
  text1: "כדי להציע לך את כל היתרונות של השירותים שלנו ושל החשבון הקשור אליהם, יש צורך לאסוף ממך נתונים מסוימים."
  text2: "כדי לתחזק ולשפר את השירותים שלנו (אפליקציות ואתרים) ולבצע מחקר מדעי בנושא חינוך ICT ו-STEM/STEAM, אנחנו משתמשים ב-Google Analytics, ב-Crashlytics וב-Firebase, כולם של Google LLC (ארה\"ב), וכן ב-Dynatrace של Dynatrace LLC (ארה\"ב), כדי לקבל מטא-נתונים על השימוש בשירותים שלנו, למשל מידע על קריסות, חותמות זמן, דפים/מסכים שנצפו, שימוש באפליקציות ובשירותים שלנו, מערכת ההפעלה שבשימוש ומידע על ספק הרשת. ניתוח זה והנתונים שנאספים אינם מקושרים לפרופיל שלך ואינם מכילים מידע אישי (הספרות האחרונות של כתובת ה-IP עוברות אנונימיזציה). עם זאת, הנתונים שנאספים יועברו לספקי השירות (Google LLC, ארה\"ב ו-Dynatrace LLC, ארה\"ב). עיבוד הנתונים מבוסס על הסכמים עם Google LLC ועם Dynatrace LLC. היחסים עם ספקי השירות תואמים את התקנה הכללית להגנת מידע של האיחוד האירופי (EU GDPR) ואת הסכם \"Privacy Shield\" בין האיחוד האירופי לארה\"ב."
  text3: "כדי ליצור חשבון במערכות שלנו ולהשתמש בו, וכדי ליידע אותך בדוא\"ל על שינויים נחוצים בחשבון שלך, למשל עדכונים או הפרות של תנאי השימוש והשירות, כללי הקהילה או המדיניות שלנו, נשמור את שם המשתמש שלך ואת כתובת הדוא\"ל שלך, אם מסרת אותה. אם חיברת את החשבון שלך דרך Google Plus או Facebook, נשמור בנוסף מפתח זיהוי המקושר לחשבון שלך בשירותים אלה. לא נשתמש בנתונים אלה לשום מטרה אחרת (למשל שיווק), אלא אם התרת לנו זאת במפורש."
  text4: "על בסיס התנדבותי, אתה יכול למסור לנו את מדינת המגורים שלך דרך דף החשבון שלך באתר השיתוף. היא תוצג בפרופיל הציבורי שלך ותשמש אותנו רק למטרות סטטיסטיקה ומחקר. אפשר להסיר אותה בכל עת בהגדרות הפרופיל שלך."
  text5: "אתה יכול לבטל את השימוש בנתונים האישיים השייכים לחשבון שלך בכל עת על ידי מחיקת החשבון דרך דף הפרופיל שלך ב-https://share.catrob.at/. לאחר מחיקת החשבון עדיין תוכל להשתמש בשירותים המסופקים, אבל לא לשתף פעולה, למשל באמצעות העלאת תוכניות, תגובות או לייקים. בנוסף, כל התוכן שסיפקת ומקושר לחשבון שלך, למשל תוכניות שהועלו, תגובות וכו', יימחק."
  text6: "כדי למנוע שימוש לרעה בשירותים שלנו, למשל באמצעות העלאות או תגובות של משתמשים למטרות לא חוקיות, כל הנתונים הציבוריים שמשתמשים יוצרים (העלאות, תגובות) יישמרו באופן פנימי במסד נתונים, יחד עם חותמת זמן וכתובת האינטרנט שבשימוש. נתונים אלה לא ישמשו מוסדות כלשהם ולא יועברו אליהם, אלא אם קיים חשד סביר לפעולות בלתי חוקיות במידה מספקת ומוסדות משפטיים מוסמכים רשמית מבקשים אותם על בסיס החוק החל. כל מקרה ייבדק קודם על ידינו ביסודיות באופן פרטני."
  text7: "אתה יכול להירשם מרצון לניוזלטר של Catrobat בכתובת https://catrob.at/newsletter, שאנחנו מספקים דרך שירות MailChimp (The Rocket Science Group LLC d/b/a MailChimp, ארה\"ב). לאחר מכן תקבל עדכונים על פרויקט Catrobat ועל השירותים שלו לכתובת הדוא\"ל שמסרת. אפשר לבטל את הניוזלטר בכל עת באמצעות הקישור \"unsubscribe\" בתחתית כל ניוזלטר. הניוזלטר מסופק על ידי MailChimp, שאיתה יש לנו הסכם עיבוד נתונים ושהתחייבה לתקנה הכללית להגנת מידע של האיחוד האירופי ול-\"Privacy Shield\" בין האיחוד האירופי לארה\"ב. לפרטים נוספים על MailChimp, עיין גם במדיניות הפרטיות ובתנאי השימוש של MailChimp."
  text8: "כל השירותים מסופקים על ידי פרויקט הקוד הפתוח והחופשי Catrobat, תחת המטרייה של International Catrobat Association – Verein zur Förderung freier Software, ארגון ללא מטרות רווח הרשום בגראץ, אוסטריה (האיחוד האירופי). המדיניות שלנו מכבדת את דיני הגנת המידע של האיחוד האירופי ושל אוסטריה (GDPR). כדי ליצור איתנו קשר, שלח דוא\"ל אל contact@catrobat.org או מכתב אל Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union)."
  text9: "אם אתה מתחת לגיל 14, מדיניות זו חייבת להתקבל על ידי אפוטרופוס חוקי (בדרך כלל הורה)."
  text10: "מדיניות הפרטיות הרשמית של Catrobat בשפה האנגלית זמינה ברשת בכתובת %privacy_policy%."
  disagree-text: "ללא אישור לא נוכל ליצור חשבון, אבל התכונות העיקריות עדיין זמינות."
