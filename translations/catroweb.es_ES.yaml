consent:
  email:
    subject: 'Se necesita el consentimiento parental para la cuenta de Catrobat de tu hijo'
    title: 'Se requiere consentimiento parental'
    greeting: 'Hola:'
    message: 'Tu hijo %username% ha creado una cuenta en Catrobat y ha verificado su dirección de correo electrónico.'
    explanation: 'Catrobat es una plataforma educativa gratuita donde los jóvenes aprenden a programar creando apps, juegos y animaciones. Según la normativa de la UE sobre protección de menores, necesitamos tu consentimiento antes de que tu hijo pueda participar plenamente en la comunidad. Haz clic en el botón de abajo para dar tu consentimiento.'
    button: 'Dar consentimiento parental'
    ignore: 'Si no esperabas este correo, puedes ignorarlo sin problema. Sin consentimiento, la cuenta tendrá funciones limitadas.'
    whatIsCatrobat: 'Catrobat es una plataforma educativa de programación gratuita y sin ánimo de lucro. Más información en catrobat.org.'
    manageLink: 'Puedes gestionar la cuenta de tu hijo en cualquier momento a través de nuestro <a href="%portalUrl%" style="color: #00acc1;">Portal para padres</a>. Más información sobre <a href="%infoUrl%" style="color: #00acc1;">tus derechos como padre o madre</a>.'
  confirmed:
    title: 'Consentimiento otorgado'
    message: '¡Gracias! La cuenta de %username% ya está totalmente activada.'
    continueButton: 'Descubrir proyectos'
parent:
  footer:
    link: 'Padres y tutores'
  info:
    title: 'Información para padres y tutores'
    intro: 'Catrobat se toma muy en serio la seguridad y la privacidad de los usuarios jóvenes. Esta página explica cómo protegemos a tu hijo y qué derechos tienes.'
    whatIsCatrobat:
      title: '¿Qué es Catrobat?'
      text: 'Catrobat es una plataforma educativa gratuita y sin ánimo de lucro donde los jóvenes aprenden a programar creando sus propias apps, juegos y animaciones. La plataforma está disponible en todo el mundo y se usa en entornos educativos.'
    dataCollected:
      title: '¿Qué datos recopilamos?'
      text: 'Recopilamos los datos mínimos necesarios para el funcionamiento de la plataforma: nombre de usuario, dirección de correo electrónico, fecha de nacimiento y los proyectos que tu hijo crea y sube. Para los usuarios menores de 14 años, también guardamos la dirección de correo electrónico de un padre, madre o tutor a efectos del consentimiento. No vendemos ni compartimos datos personales con terceros.'
    yourRights:
      title: 'Tus derechos como padre, madre o tutor'
      text: 'Según la normativa de la UE sobre protección de menores (RGPD) y la COPPA, tienes derecho a: revisar los datos que tenemos sobre tu hijo, solicitar una copia de esos datos, revocar tu consentimiento en cualquier momento (lo que restringe la cuenta) y solicitar la eliminación definitiva de la cuenta de tu hijo y de todos los datos asociados.'
    minorRestrictions:
      title: '¿Qué restricciones se aplican a las cuentas de menores?'
      text: 'Los usuarios menores de 16 años no pueden publicar ni leer comentarios, seguir a otros usuarios ni ver contenido marcado como no apto para niños. Sí pueden crear y subir proyectos, explorar proyectos públicos y reaccionar a proyectos con «me gusta». Estas restricciones existen para ofrecer un entorno de aprendizaje seguro.'
    manageButton: 'Gestionar la cuenta de tu hijo'
  portal:
    title: 'Portal para padres'
    description: 'Introduce tu dirección de correo electrónico para recibir un enlace seguro con el que gestionar la cuenta de Catrobat de tu hijo. El enlace se enviará a la dirección de correo electrónico que indicaste durante el registro.'
    emailLabel: 'Tu dirección de correo electrónico'
    submitButton: 'Enviar enlace de gestión'
    infoLink: 'Más información'
    success:
      title: 'Revisa tu bandeja de entrada'
      message: 'Si hay una cuenta asociada a este correo electrónico, te hemos enviado un enlace de gestión. Revisa tu bandeja de entrada y sigue el enlace para gestionar la cuenta de tu hijo.'
  manage:
    title: 'Gestionar cuentas de hijos'
    description: 'Estás gestionando las cuentas asociadas a %email%.'
    consentStatus: 'Estado del consentimiento'
    accountCreated: 'Cuenta creada'
    email: 'Correo electrónico del hijo'
    status:
      granted: 'Otorgado'
      pending: 'Pendiente'
      revoked: 'Revocado'
    grantButton: 'Otorgar consentimiento'
    revokeButton: 'Revocar consentimiento'
    revokeConfirm: '¿Seguro que quieres revocar el consentimiento? La cuenta tendrá funciones limitadas.'
    exportButton: 'Exportar datos'
    deleteButton: 'Eliminar cuenta'
    deleteConfirm: '¿Seguro que quieres eliminar esta cuenta para siempre? Esta acción no se puede deshacer.'
  management:
    email:
      subject: 'Gestiona la cuenta de Catrobat de tu hijo'
      title: 'Gestión de la cuenta'
      greeting: 'Hola:'
      message: 'Has solicitado un enlace para gestionar la cuenta de Catrobat de tu hijo (%usernames%). Haz clic en el botón de abajo para ver y gestionar la cuenta.'
