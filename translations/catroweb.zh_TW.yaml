  email:
    subject: "你孩子的 Catrobat 帳號需要家長同意"
    title: "需要家長同意"
    greeting: "你好，"
    message: "你的孩子 %username% 已在 Catrobat 建立帳號，並已驗證電子郵件地址。"
    explanation: "Catrobat 是一個免費的教育平台，年輕人可以透過製作應用程式、遊戲和動畫來學習程式設計。根據歐盟兒童保護法規，在你的孩子能完整參與社群之前，我們需要你的同意。請點擊下方按鈕表示同意。"
    button: "給予家長同意"
    ignore: "如果你沒有預期收到這封郵件，可以放心忽略。沒有同意的話，帳號的功能將受到限制。"
    whatIsCatrobat: "Catrobat 是一個免費、非營利的程式設計教育平台。到 catrobat.org 了解更多。"
    manageLink: "你可以隨時透過我們的<a href=\"%portalUrl%\" style=\"color: #00acc1;\">家長專區</a>管理孩子的帳號。進一步了解<a href=\"%infoUrl%\" style=\"color: #00acc1;\">你身為家長的權利</a>。"
  confirmed:
    title: "已給予同意"
    message: "謝謝你！%username% 的帳號現在已完全啟用。"
    continueButton: "探索專案"
parent:
  footer:
    link: "家長與監護人"
  info:
    title: "給家長與監護人的資訊"
    intro: "Catrobat 非常重視年輕使用者的安全與隱私。本頁說明我們如何保護你的孩子，以及你擁有哪些權利。"
    whatIsCatrobat:
      title: "什麼是 Catrobat？"
      text: "Catrobat 是一個免費、非營利的教育平台，年輕人可以透過製作自己的應用程式、遊戲和動畫來學習程式設計。這個平台在全球都能使用，也被用於教學場合。"
    dataCollected:
      title: "我們會蒐集哪些資料？"
      text: "我們只蒐集營運平台所需的最少資料：使用者名稱、電子郵件地址、出生日期，以及你的孩子建立和上傳的專案。對於未滿 14 歲的使用者，我們也會儲存家長或監護人的電子郵件地址，用於取得同意。我們不會將個人資料出售或分享給第三方。"
    yourRights:
      title: "你身為家長或監護人的權利"
      text: "根據歐盟兒童保護法規（GDPR）和 COPPA，你有權：查看我們所持有關於你孩子的資料、索取這些資料的副本、隨時撤回你的同意（帳號功能將因此受限），以及要求永久刪除你孩子的帳號和所有相關資料。"
    minorRestrictions:
      title: "未成年帳號有哪些限制？"
      text: "未滿 16 歲的使用者無法發表或閱讀留言、追蹤其他使用者，也無法查看被標記為不適合兒童的內容。他們仍然可以建立和上傳專案、瀏覽公開專案，並對專案按讚。這些限制是為了提供安全的學習環境。"
    manageButton: "管理你孩子的帳號"
  portal:
    title: "家長專區"
    description: "輸入你的電子郵件地址，以收到一個用於管理孩子 Catrobat 帳號的安全連結。連結會寄到你在註冊時提供的電子郵件地址。"
