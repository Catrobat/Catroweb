licenseToPlay:
  link: '玩牌'
  title: '授權撥放或執行-同意授權並分享'
  text1: 想像一下，每個 Catrobat 專案都是一個蛋糕，一個非常特別的蛋糕，帶有它的配方（編程塊）。 Catrobat 社群的所有成員都會分享他們的蛋糕和食譜。這意味著你可以享用蛋糕並學習如何自己製作！
  text2: '沒有秘方：關於如何製作這些蛋糕的說明對任何人都是開放的，可以使用、重複使用、修改並作為新想法的靈感……我的意思是蛋糕。'
  text3: "你可以吃蛋糕，也可以復制別人的食譜來製作你自己的蛋糕，也許用不同的配料。這種自由有兩個簡單的要求："
  text4: "在建立 Catrobat 社群時，我們決定採用這種方法，因為我們相信它支持社群內的學習和創造力。通過分享食譜和配料（腳本和藝術品），人們可以建立彼此的想法，每個人都會受益。"
  text5: In designing the Catrobat website, we included features to encourage people to share and to give credit to others. On each project page, you can always download the original scripts for the project. If you remix a project (modifying the scripts or artwork, and sharing the result), we encourage you to give credit in the Project Notes, mentioning the people and project that inspired you.
  text6: '在 %link-termsOfUse% 上了解有關 Catrobat 線上社群使用條款的更多資訊。'
  list1:
    item1: 分享你的軟體和程式
    item2: 讚揚那些激勵你的人
  version: 1.1 版，2013 年 4 月 2 日
termsOfUse:
  title: 使用條款
  headline: Welcome to the Catrobat Community!
  text1: '作為 Catrobat 社群的一員，你正在與人們分享專案和想法：'
  text2: "我們需要你的協助,建構一個提供社群所有成員支援的地方。下列是你可以幫忙的事項:"
  text3: "通過Catrobat 專案，我們希望促進合作，讓每個人的創造力結合起來，造福全人類。你還可以通過將你的專案作為禮物回饋社群來成為 Catrobat 社群的活躍成員，就像其他活躍成員向你提供他們的專案一樣："
  text4: '我們給你的禮物：'
  text5: '我們的使用和服務條款：'
  list1:
    item1: 來自許多不同國家和文化
    item2: 適用所有年齡(從幼童到青少年及祖父母)
    item3: 與所有層級的經驗
  list2:
    item1: 尊重。在分享專案時，請記住，許多不同年齡和背景的人都會看到你的貢獻。
    item2: "Give credit. Feel free to make modified versions of other people's projects - just make sure to give them credit. One place to give credit is in your project's credits section. Please see the paragraph below this dotted list for details about modifying projects of other users."
    item3: "說實話。不要假裝自己不是別人，也不要試圖欺騙社群。"
    item4: "將個人資訊保密。不要分享你的電子郵件地址、電話號碼或其他個人聯絡資訊。"
    item5: "幫助保持網站友好。如果你覺得其他人會發現某個專案或留言刻薄、侮辱、過於暴力或其他不適當的，只需點擊“報告不當”按鈕並留下簡短的解釋。 Catrobat 團隊將審核你的報告，並可能刪除任何專案、留言或貼文。"
  list3:
    item1: "將專案上傳到我們的網站，即表示你接受並同意將此作品置於上傳的 Catrobat 專案的某些免費許可之下。與你可以使用 Catrobat 系統本身的免費許可證類似，這些上傳的 Catrobat 專案的免費許可證使每個人都有權從其他人之前上傳的作品中學習，並改編和重新混合這些作品以構建自己的新迷人遊戲，動畫和其他專案。這讓每個人都能“站在同齡人的肩膀上”，其中之一就是你！因此，你的作品將造福整個世界，並且每個人都可以免費使用，有點類似於世界各地的志願者免費提供給維基百科的文字和圖片。把它想像成你送給人類的禮物：你送給每一個人，所有將他們的作品上傳到我們網站的人都會送給你。因此，上傳的專案是一份非常有價值的禮物，其所有者免費贈送給你，條件是你以相同的條件參與社群。"
    item2: 你不必接受禮物；如果這樣做，則適用某些規則。這些規則的好處是你可以從工作中學習並在此基礎上自己製作更酷的東西，然後你可以例如再次將其作為你自己的上傳到我們的網站。另一個好處是這些許可證確保你不對他人使用你的專案而引起的任何問題負責。
    item3: "一個重要的附加條件是，你清楚地將署名歸因於你基於自己作品的作品的作者。同時，我們將努力工作，讓其他人清楚地感謝你所做的貢獻，通過賦予你在 Catrobat 社群中自由選擇的唯一名稱來代表你的名稱，並為其他人提供機會以公開的方式表達對你的感謝，感謝你將你的作品提供給每個人，尤其是他們。"
    item4: '請查閱 %link-licenseUploaded% 以了解準確的法律條款和條件。'
  list4:
    item1: "我們提供與 Catrobat 系統相關的所有我們自己的軟體和 Internet 資源，例如由 Catrobat 團隊編寫的軟體、我們的網站和 Internet 資源、我們自己的與 Catrobat 系統相關的原始碼以及所有其他包含的材料，例如、圖片、聲音和文字，現在和將來在 Catrobat 的免費許可下為你提供。"
    item2: 這些許可證使 Catrobat 的所有部分都對你免費並且免費，讓你可以隨心所欲地自由使用它們，只有少數限制確保 Catrobat 系統永遠免費對每個人都有用。
    item3: '請諮詢 %link-licenseToPlay% 以了解準確的法律條款和條件。 Catrobat 系統的原始碼以及許多其他文件和資源可通過 %link-developer% 獲得。'
  list5:
    item1: '如果你，或者，如果你未滿 13 歲，你的父母或法定監護人與參與或負責侵犯拉網式隱私和/或批量或大規模監視的組織有關聯，那麼你不得使用我們的軟體應用程式和訪問我們的服務。此限制的確切細節及其某些例外情況在我們的 %link-termsOfUse% 的第 4.a 和 4.b 節中進行了描述。'
    item2: 如果你未滿 13 歲，則必須詢問你的父母或法定監護人他們是否允許你使用 Catrobat 的軟體應用程式和服務。
    item3: "我們保留隨時自行決定拒絕、刪除或隱藏上傳到 Catrobat 網站的專案、使用者帳號和任何數字材料的權利，例如，如果我們發現某個專案包含不適當的材料或使用者侵犯了其他人的權利。"
    item4: "提供所有 Catrobat 軟體和 Internet 資源，希望它們有用，但不提供任何保證。"
    item5: '請查閱我們的 %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service 以獲取上述要點的精確表述以及一些其他法律條款和條件。'
  bottom1: 請不時返回此處查看，因為我們一直在努力改進我們的使用條款。
  bottom2: '請將有關這些使用條款的任何建議郵寄給 %email-webmaster%。'
  version: 1.3 版，2014 年 3 月 4 日
