privacy-policy:
  header: 隱私權政策
  version: 2.2 版，2019 年 10 月 17 日
  text1: 為了向你提供我們服務和相關帳號的所有好處，有必要從你那裡收集某些資料。
  text2: 為了維護和改進我們的服務（應用程式和網站）以及對 ICT 和 STEM/STEAM 教育進行科學研究，我們使用了 Google LLC（美國）的 Google Analytics、Crashlytics 和 Firebase，以及 Dynatrace LLC 的 Dynatrace（美國）獲取有關我們服務使用情況的後設資料，例如崩潰資訊、時間戳、訪問的頁面/螢幕、我們的應用程式和服務的使用情況、使用的作業系統以及有關網路提供商的資訊。此分析和收集的資料未連結到你的個人資料，也不包含任何個人資訊（IP 地址的最後一位被匿名化）。但是，收集的資料將傳輸給服務提供商（Google LLC，美國和 Dynatrace LLC，美國）。資料處理基於與 Google LLC 和 Dynatrace LLC 的協議。與服務提供商的這種關係符合歐盟的通用資料保護條例 (EU GDPR) 和歐盟-美國的“隱私保護”協議。
  text3: 為了在我們的系統中建立和使用帳號，並通過電子郵件通知你帳號的必要更改，例如更新或違反我們的使用和服務條款、我們的社群規則或我們的政策，我們將儲存你的使用者名稱，以及你的電子郵件地址（如果由你提供）。如果你已通過 Google Plus 或 Facebook 連接你的帳號，我們還會在這些服務上儲存與你的帳號相關聯的識別密鑰。我們不會將這些資料用於任何其他（例如行銷）目的，除非你明確允許我們這樣做。
  text4: 在自願的基礎上，你可以通過共享網站上的帳號頁面向我們提供你的居住國家/地區。這將顯示在你的公開資料中，並且僅供我們用於統計和研究目的。它可以隨時在你的個人資料設定中刪除。
  text5: 你可以隨時通過 https://share.catrob.at/ 上的個人資料頁面刪除你的帳號來撤銷對屬於你帳號的個人資料的使用。刪除你的帳號後，你仍然可以使用提供的服務，但不能進行協作，例如通過上傳程式、留言或按讚。此外，所有提供的與你的帳號相關聯的內容，例如上傳的節目、留言等，都將被刪除。
  text6: 為避免濫用我們的服務，例如，通過使用者貢獻的上傳或出於非法目的的留言，所有使用者生成的公共資料（上傳、留言）將與時間戳和使用的網際網路地址一起儲存在內部資料庫中。這些資料不會被任何機構使用或轉發給任何機構，除非有足夠的非法行為被合理懷疑並且正式授權的合法機構根據適用法律要求提供。我們首先會根據個人情況對每個案例進行徹底檢查。
  text7: 你可以在我們通過 MailChimp 服務（The Rocket Science Group LLC d/b/a MailChimp，美國）提供的 https://catrob.at/newsletter 上自願訂閱 Catrobat 時事通訊。然後，你將通過你提供的電子郵件地址收到有關 Catrobat 專案及其服務的更新。你可以隨時使用每個時事通訊頁尾中的“取消訂閱”連結撤回時事通訊。本時事通訊由 MailChimp 提供，我們與其簽訂了資料處理協議，並承諾遵守歐盟通用資料生產法規和歐盟-美國“隱私保護”。有關 MailChimp 的更多詳細資料，請同時查看 MailChimp 的隱私政策和使用條款。
  text8: 所有服務均由國際 Catrobat 協會 – Verein zur Förderung freier Software 旗下的免費開源 Catrobat 專案提供，該協會是一家在奧地利格拉茨（歐盟）註冊成立的非營利性非政府組織。我們的政策尊重歐盟和奧地利資料保護法 (GDPR)。要與我們取得聯絡，請發送電子郵件至 contact@catrobat.org 或將我們郵寄至 Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria（歐盟）。
  text9: 如果你未滿 14 歲，則此政策必須得到法定監護人（通常是父母）的接受。
  text10: Catrobat 的官方英語隱私政策可在網路上的 %privacy_policy% 下找到。
  disagree-text: 未經批准，我們無法建立帳號，但仍可訪問核心功能。
