    <br>
    నీ ఖాతా యాక్టివేషన్ పూర్తి చేయడానికి - దయచేసి <a href="%confirmationUrl%">ఇక్కడ</a> క్లిక్ చేయి.<br>
    నీ ఖాతాను ధృవీకరించడానికి ఈ లింక్‌ను ఒక్కసారి మాత్రమే ఉపయోగించవచ్చు.<br>
    <br>
    శుభాకాంక్షలతో,<br>
    నీ Catrobat బృందం.
    </p>

newAccountConfirmation:
  subject: "నీ ఇమెయిల్ చిరునామాను ధృవీకరించు"
  welcome: "Catrobatకి స్వాగతం!"
  greeting: "సైన్ అప్ చేసినందుకు ధన్యవాదాలు! మొదలుపెట్టడానికి దయచేసి నీ ఇమెయిల్ చిరునామాను ధృవీకరించు."
  message: "నీ ఇమెయిల్‌ను నిర్ధారించడానికి కింది బటన్‌ను క్లిక్ చేయి. ఈ లింక్ %time% వరకు చెల్లుతుంది, ఒక్కసారి మాత్రమే ఉపయోగించవచ్చు."
  button: "ఇమెయిల్ చిరునామాను ధృవీకరించు"
  ignore: "నువ్వు Catrobat ఖాతాను సృష్టించకపోతే, ఈ ఇమెయిల్‌ను నిశ్చింతగా పట్టించుకోకు."
  autoDelete: "ధృవీకరించని ఖాతాలు 30 రోజుల తర్వాత ఆటోమేటిక్‌గా తొలగించబడతాయి."
consent:
  email:
    subject: "నీ పిల్లల Catrobat ఖాతాకు తల్లిదండ్రుల సమ్మతి అవసరం"
    title: "తల్లిదండ్రుల సమ్మతి అవసరం"
    greeting: "నమస్తే,"
    message: "నీ పిల్లలు %username% Catrobatలో ఒక ఖాతాను సృష్టించి, వారి ఇమెయిల్ చిరునామాను ధృవీకరించారు."
    explanation: "Catrobat ఒక ఉచిత విద్యా వేదిక, ఇక్కడ యువత యాప్‌లు, గేమ్‌లు, యానిమేషన్‌లు సృష్టిస్తూ కోడింగ్ నేర్చుకుంటారు. EU బాలల రక్షణ నిబంధనల ప్రకారం, నీ పిల్లలు కమ్యూనిటీలో పూర్తిగా పాల్గొనే ముందు మాకు నీ సమ్మతి అవసరం. సమ్మతి ఇవ్వడానికి దయచేసి కింది బటన్‌ను క్లిక్ చేయి."
    button: "తల్లిదండ్రుల సమ్మతి ఇవ్వు"
    ignore: "నువ్వు ఈ ఇమెయిల్‌ను ఊహించకపోతే, దీన్ని నిశ్చింతగా పట్టించుకోకు. సమ్మతి లేకుండా ఖాతాకు పరిమిత సౌకర్యాలు మాత్రమే ఉంటాయి."
    whatIsCatrobat: "Catrobat ఒక ఉచిత, లాభాపేక్ష లేని విద్యా ప్రోగ్రామింగ్ వేదిక. catrobat.orgలో మరింత తెలుసుకో."
    manageLink: 'నువ్వు ఎప్పుడైనా మా <a href="%portalUrl%" style="color: #00acc1;">తల్లిదండ్రుల పోర్టల్</a> ద్వారా నీ పిల్లల ఖాతాను నిర్వహించవచ్చు. <a href="%infoUrl%" style="color: #00acc1;">తల్లిదండ్రిగా నీ హక్కుల</a> గురించి మరింత తెలుసుకో.' #00acc1;">Parent Portal</a>. Learn more about <a href="%infoUrl%" style="color: #00acc1;">your rights as a parent</a>.'
  confirmed:
    title: "సమ్మతి ఇవ్వబడింది"
    message: "ధన్యవాదాలు! %username% ఖాతా ఇప్పుడు పూర్తిగా యాక్టివేట్ అయింది."
    continueButton: "ప్రాజెక్ట్‌లను కనుగొను"
parent:
  footer:
    link: "తల్లిదండ్రులు & సంరక్షకులు"
  info:
    title: "తల్లిదండ్రులు & సంరక్షకుల కోసం సమాచారం"
    intro: "Catrobat చిన్న వినియోగదారుల భద్రత, గోప్యతను తీవ్రంగా పరిగణిస్తుంది. మేము నీ పిల్లలను ఎలా రక్షిస్తామో, నీకు ఏ హక్కులు ఉన్నాయో ఈ పేజీ వివరిస్తుంది."
    whatIsCatrobat:
      title: "Catrobat అంటే ఏమిటి?"
      text: "Catrobat ఒక ఉచిత, లాభాపేక్ష లేని విద్యా వేదిక, ఇక్కడ యువత తమ సొంత యాప్‌లు, గేమ్‌లు, యానిమేషన్‌లు సృష్టిస్తూ ప్రోగ్రామింగ్ నేర్చుకుంటారు. ఈ వేదిక ప్రపంచవ్యాప్తంగా అందుబాటులో ఉంది, విద్యా సంస్థలలో ఉపయోగించబడుతుంది."
    dataCollected:
      title: "మేము ఏ డేటాను సేకరిస్తాము?"
      text: "వేదికను నడపడానికి అవసరమైన కనీస డేటాను మాత్రమే మేము సేకరిస్తాము: వినియోగదారు పేరు, ఇమెయిల్ చిరునామా, పుట్టిన తేదీ, నీ పిల్లలు సృష్టించి అప్‌లోడ్ చేసే ప్రాజెక్ట్‌లు. 14 ఏళ్ల లోపు వినియోగదారుల కోసం, సమ్మతి కోసం తల్లిదండ్రులు/సంరక్షకుల ఇమెయిల్ చిరునామాను కూడా నిల్వ చేస్తాము. మేము వ్యక్తిగత డేటాను మూడవ పక్షాలకు అమ్మము లేదా షేర్ చేయము."
    yourRights:
      title: "తల్లిదండ్రిగా లేదా సంరక్షకుడిగా నీ హక్కులు"
      text: "EU బాలల రక్షణ నిబంధనలు (GDPR) మరియు COPPA ప్రకారం, నీకు ఈ హక్కులు ఉన్నాయి: నీ పిల్లల గురించి మా వద్ద ఉన్న డేటాను చూడటం, ఆ డేటా కాపీని అడగటం, ఎప్పుడైనా నీ సమ్మతిని ఉపసంహరించుకోవడం (దీనితో ఖాతా పరిమితం అవుతుంది), నీ పిల్లల ఖాతాను, దానికి సంబంధించిన మొత్తం డేటాను శాశ్వతంగా తొలగించమని అడగటం."
    minorRestrictions:
      title: "మైనర్ ఖాతాలకు ఏ పరిమితులు వర్తిస్తాయి?"
      text: "16 ఏళ్ల లోపు వినియోగదారులు వ్యాఖ్యలు పోస్ట్ చేయలేరు లేదా చదవలేరు, ఇతర వినియోగదారులను ఫాలో చేయలేరు, పిల్లలకు తగినది కాదని గుర్తించిన కంటెంట్‌ను చూడలేరు. అయినా వారు ప్రాజెక్ట్‌లను సృష్టించి అప్‌లోడ్ చేయవచ్చు, పబ్లిక్ ప్రాజెక్ట్‌లను చూడవచ్చు, లైక్‌లతో ప్రతిస్పందించవచ్చు. సురక్షితమైన అభ్యాస వాతావరణం కోసం ఈ పరిమితులు ఉన్నాయి."
    manageButton: "నీ పిల్లల ఖాతాను నిర్వహించు"
  portal:
    title: "తల్లిదండ్రుల పోర్టల్"
    description: "నీ పిల్లల Catrobat ఖాతాను నిర్వహించడానికి సురక్షితమైన లింక్ పొందడానికి నీ ఇమెయిల్ చిరునామాను నమోదు చేయి. రిజిస్ట్రేషన్ సమయంలో నువ్వు ఇచ్చిన ఇమెయిల్ చిరునామాకు లింక్ పంపబడుతుంది."
