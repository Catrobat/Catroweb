  version: వెర్షన్ 2.2, 17 అక్టోబర్ 2019
  text1: మా సేవలు, దానికి సంబంధించిన ఖాతా అందించే అన్ని ప్రయోజనాలను నీకు అందించడానికి, నీ నుండి కొంత డేటాను సేకరించడం అవసరం.
  text2: 'మా సేవలను (యాప్‌లు, వెబ్‌సైట్‌లు) నిర్వహించడానికి, మెరుగుపరచడానికి, ICT మరియు STEM/STEAM విద్యపై శాస్త్రీయ పరిశోధన చేయడానికి, మా సేవల వినియోగం గురించి మెటాడేటా పొందేందుకు మేము Google LLC (USA) అందించే Google Analytics, Crashlytics, Firebase, అలాగే Dynatrace LLC (USA) అందించే Dynatrace ఉపయోగిస్తాము, ఉదాహరణకు క్రాష్ సమాచారం, టైమ్‌స్టాంప్‌లు, సందర్శించిన పేజీలు/స్క్రీన్‌లు, మా యాప్‌లు మరియు సేవల వినియోగం, ఉపయోగించిన ఆపరేటింగ్ సిస్టమ్, నెట్‌వర్క్ ప్రొవైడర్ గురించిన సమాచారం. ఈ విశ్లేషణ, సేకరించిన డేటా నీ ప్రొఫైల్‌కు లింక్ చేయబడవు, వాటిలో ఎలాంటి వ్యక్తిగత సమాచారం ఉండదు (IP చిరునామా చివరి బిట్‌లు అనామకం చేయబడతాయి). అయితే, సేకరించిన డేటా సేవా ప్రొవైడర్లకు (Google LLC, USA మరియు Dynatrace LLC, USA) బదిలీ చేయబడుతుంది. డేటా ప్రాసెసింగ్ Google LLC, Dynatrace LLCతో ఒప్పందాలపై ఆధారపడి ఉంటుంది. సేవా ప్రొవైడర్లతో ఈ సంబంధం యూరోపియన్ యూనియన్ జనరల్ డేటా ప్రొటెక్షన్ రెగ్యులేషన్ (EU GDPR), EU-USA "Privacy Shield" ఒప్పందానికి అనుగుణంగా ఉంటుంది.'
  text3: మా సిస్టమ్‌లలో ఖాతాను సృష్టించి ఉపయోగించడానికి, నీ ఖాతాకు సంబంధించిన అవసరమైన మార్పుల గురించి, ఉదాహరణకు అప్‌డేట్‌లు లేదా మా ఉపయోగ మరియు సేవా నిబంధనలు, కమ్యూనిటీ నియమాలు, విధానాల ఉల్లంఘనల గురించి ఇ-మెయిల్ ద్వారా నీకు తెలియజేయడానికి, మేము నీ వినియోగదారు పేరును, నువ్వు ఇచ్చి ఉంటే నీ ఇ-మెయిల్ చిరునామాను నిల్వ చేస్తాము. నువ్వు నీ ఖాతాను Google Plus లేదా Facebook ద్వారా కనెక్ట్ చేసి ఉంటే, ఈ సేవల్లోని నీ ఖాతాకు కనెక్ట్ అయిన గుర్తింపు కీని కూడా నిల్వ చేస్తాము. నువ్వు స్పష్టంగా అనుమతిస్తే తప్ప, మేము ఈ డేటాను ఇతర (ఉదా. మార్కెటింగ్) ప్రయోజనాల కోసం ఉపయోగించము.
  text4: నువ్వు ఇష్టపడితే, షేరింగ్ సైట్‌లోని నీ ఖాతా పేజీ ద్వారా నీ నివాస దేశాన్ని మాకు ఇవ్వవచ్చు. ఇది నీ పబ్లిక్ ప్రొఫైల్‌లో చూపబడుతుంది, మేము దీన్ని గణాంక, పరిశోధన ప్రయోజనాల కోసం మాత్రమే ఉపయోగిస్తాము. నీ ప్రొఫైల్ సెట్టింగ్‌లలో దీన్ని ఎప్పుడైనా తీసివేయవచ్చు.
  text5: https://share.catrob.at/లోని నీ ప్రొఫైల్ పేజీ ద్వారా నీ ఖాతాను తొలగించి, నీ ఖాతాకు చెందిన వ్యక్తిగత డేటా వినియోగాన్ని ఎప్పుడైనా ఉపసంహరించుకోవచ్చు. నీ ఖాతాను తొలగించిన తర్వాత కూడా నువ్వు అందించిన సేవలను ఉపయోగించగలవు, కానీ సహకరించలేవు, ఉదాహరణకు ప్రోగ్రామ్‌లను అప్‌లోడ్ చేయడం, వ్యాఖ్యానించడం లేదా లైక్ చేయడం. అలాగే, నీ ఖాతాకు లింక్ అయిన మొత్తం కంటెంట్, ఉదాహరణకు అప్‌లోడ్ చేసిన ప్రోగ్రామ్‌లు, వ్యాఖ్యలు మొదలైనవి తొలగించబడతాయి.
  text6: మా సేవల దుర్వినియోగాన్ని నివారించడానికి, ఉదాహరణకు చట్టవిరుద్ధ ప్రయోజనాల కోసం వినియోగదారులు చేసే అప్‌లోడ్‌లు లేదా వ్యాఖ్యల ద్వారా, వినియోగదారులు సృష్టించిన పబ్లిక్ డేటా అంతా (అప్‌లోడ్‌లు, వ్యాఖ్యలు) టైమ్‌స్టాంప్, ఉపయోగించిన ఇంటర్నెట్ చిరునామాతో పాటు ఒక డేటాబేస్‌లో అంతర్గతంగా నిల్వ చేయబడుతుంది. తగినంత చట్టవిరుద్ధమైన చర్యలు జరిగాయని సహేతుకంగా అనుమానించబడి, అధికారికంగా అర్హత ఉన్న చట్టపరమైన సంస్థలు వర్తించే చట్టం ఆధారంగా అభ్యర్థిస్తే తప్ప, ఈ డేటాను ఏ సంస్థలూ ఉపయోగించవు, వాటికి పంపబడదు. ప్రతి కేసును మేము ముందుగా వ్యక్తిగతంగా క్షుణ్ణంగా తనిఖీ చేస్తాము.
  text7: MailChimp సేవ (The Rocket Science Group LLC d/b/a MailChimp, USA) ద్వారా మేము అందించే https://catrob.at/newsletterలో నువ్వు ఇష్టపడితే Catrobat న్యూస్‌లెటర్‌కు సబ్‌స్క్రైబ్ చేయవచ్చు. అప్పుడు నువ్వు ఇచ్చిన ఇ-మెయిల్ చిరునామాకు Catrobat ప్రాజెక్ట్, దాని సేవల గురించి అప్‌డేట్‌లు అందుకుంటావు. ప్రతి న్యూస్‌లెటర్ ఫుటర్‌లోని "unsubscribe" లింక్ ఉపయోగించి ఎప్పుడైనా న్యూస్‌లెటర్‌ను ఆపివేయవచ్చు. ఈ న్యూస్‌లెటర్‌ను MailChimp అందిస్తుంది, వారితో మాకు డేటా ప్రాసెసింగ్ ఒప్పందం ఉంది, వారు EU జనరల్ డేటా ప్రొటెక్షన్ రెగ్యులేషన్, EU-USA "Privacy Shield"కి కట్టుబడి ఉన్నారు. MailChimp గురించి మరిన్ని వివరాల కోసం దయచేసి MailChimp గోప్యతా విధానం, ఉపయోగ నిబంధనలను కూడా చూడు.
  text8: అన్ని సేవలు International Catrobat Association – Verein zur Förderung freier Software ఆధ్వర్యంలోని ఉచిత ఓపెన్ సోర్స్ Catrobat ప్రాజెక్ట్ ద్వారా అందించబడతాయి, ఇది గ్రాజ్, ఆస్ట్రియా (యూరోపియన్ యూనియన్)లో నమోదైన లాభాపేక్ష లేని NGO. మా విధానాలు EU, ఆస్ట్రియన్ డేటా రక్షణ చట్టాన్ని (GDPR) గౌరవిస్తాయి. మమ్మల్ని సంప్రదించడానికి, దయచేసి contact@catrobat.orgకి ఇ-మెయిల్ పంపు లేదా Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union)కి ఉత్తరం పంపు.
  text9: నీ వయసు 14 ఏళ్ల కంటే తక్కువైతే, ఈ విధానాన్ని చట్టపరమైన సంరక్షకులు (సాధారణంగా తల్లిదండ్రులు) అంగీకరించాలి.
  text10: Catrobat అధికారిక ఆంగ్ల గోప్యతా విధానం వెబ్‌లో %privacy_policy% వద్ద అందుబాటులో ఉంది.
  disagree-text: ఆమోదం లేకుండా మేము ఖాతాను సృష్టించలేము, కానీ ప్రధాన ఫీచర్లు అప్పటికీ అందుబాటులో ఉంటాయి.
