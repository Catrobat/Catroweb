passwordRecovery:
  subject: నీ Catrobat పాస్‌వర్డ్ రికవరీ
  message: |
    ప్రియమైన %username%.
    నువ్వు నీ పాస్‌వర్డ్ మర్చిపోయినందున %appplication_url%లో పాస్‌వర్డ్ రీసెట్ చేయమని అడిగావు.
    నువ్వు దీన్ని అడగకపోతే, దయచేసి పట్టించుకోకు. ఇది 24 గంటల్లో గడువు ముగిసి పనికిరాకుండా పోతుంది.
    నీ పాస్‌వర్డ్ రీసెట్ చేసి కొత్తది సృష్టించడానికి, దయచేసి ఈ పేజీని సందర్శించు: %confirmationUrl%
    %appplication_url% కమ్యూనిటీని యాక్సెస్ చేయడానికి నువ్వు ఎప్పుడైనా నీ వినియోగదారు పేరు, పాస్‌వర్డ్ ఉపయోగించవచ్చు.
    అందుకోసం ఈ పేజీని సందర్శించు: %loginPage%
    నీ ప్రొఫైల్ వివరాలను సవరించడానికి, ఈ పేజీకి వెళ్ళు: %profilePage%
    శుభాకాంక్షలతో,
    నీ Catrobat బృందం.
  messageHtml: |
    <p>
    ప్రియమైన %username%.<br>
    <br>
    నువ్వు నీ పాస్‌వర్డ్ మర్చిపోయినందున <a href="%appplication_url%">Pocket Code</a>లో పాస్‌వర్డ్ రీసెట్ చేయమని అడిగావు.
    నువ్వు దీన్ని అడగకపోతే, దయచేసి పట్టించుకోకు. ఇది 24 గంటల్లో గడువు ముగిసి పనికిరాకుండా పోతుంది.<br>
    <br>
    నీ పాస్‌వర్డ్ రీసెట్ చేసి కొత్తది సృష్టించడానికి, దయచేసి <a href="%confirmationUrl%">ఇక్కడ</a> క్లిక్ చేయి.<br>
    <br>
    <a href="%appplication_url%">Pocket Code</a> కమ్యూనిటీని యాక్సెస్ చేయడానికి నువ్వు ఎప్పుడైనా నీ వినియోగదారు పేరు, పాస్‌వర్డ్ ఉపయోగించవచ్చు.<br>
    అందుకోసం ఈ పేజీని సందర్శించు: <a href="%loginPage%">లాగిన్ పేజీ</a><br>
    నీ ప్రొఫైల్ వివరాలను సవరించడానికి, ఈ <a href="%profilePage%">పేజీకి</a> వెళ్ళు.<br>
    <br>
    శుభాకాంక్షలతో,<br>
    నీ Catrobat బృందం.
    </p>
