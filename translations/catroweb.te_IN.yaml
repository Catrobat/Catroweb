licenseToPlay:
  link: 'ఆడటానికి లైసెన్స్'
  title: 'ఆడటానికి లైసెన్స్ - క్రెడిట్ ఇవ్వు, షేర్ చేయి'
  text1: ప్రతి Catrobat ప్రాజెక్ట్ ఒక కేక్ అని ఊహించుకో, దాని రెసిపీతో (ప్రోగ్రామింగ్ బ్లాక్‌లు) వచ్చే చాలా ప్రత్యేకమైన కేక్. Catrobat కమ్యూనిటీ సభ్యులందరూ తమ కేక్‌లను వాటి రెసిపీలతో సహా షేర్ చేస్తారు. అంటే నువ్వు కేక్‌లను ఆస్వాదించవచ్చు, వాటిని నువ్వే ఎలా తయారు చేయాలో నేర్చుకోవచ్చు!
  text2: 'రహస్య రెసిపీలు ఏవీ లేవు: ఈ కేక్‌లను ఎలా తయారు చేయాలో సూచనలు ఎవరైనా ఉపయోగించడానికి, మళ్ళీ ఉపయోగించడానికి, మార్చడానికి, కొత్త ఆలోచనలకు ప్రేరణగా తీసుకోవడానికి తెరిచి ఉంటాయి... అంటే కేక్‌లు.'
  text3: "నువ్వు కేక్‌లను తినవచ్చు, అలాగే నీ సొంతది తయారు చేయడానికి ఇతరుల రెసిపీలను కాపీ చేయవచ్చు, బహుశా వేరే పదార్థాలతో. ఈ స్వేచ్ఛతో పాటు రెండు సాధారణ షరతులు ఉన్నాయి:"
  text4: "Catrobat కమ్యూనిటీని ఏర్పాటు చేసేటప్పుడు, ఈ విధానం కమ్యూనిటీలో నేర్చుకోవడానికి, సృజనాత్మకతకు తోడ్పడుతుందని నమ్మి మేము దీన్ని అనుసరించాలని నిర్ణయించుకున్నాము. రెసిపీలు, పదార్థాలు (స్క్రిప్ట్‌లు, కళాకృతులు) షేర్ చేయడం ద్వారా, అందరూ ఒకరి ఆలోచనలపై మరొకరు నిర్మించవచ్చు, అందరికీ ప్రయోజనం కలుగుతుంది."
  text5: Catrobat వెబ్‌సైట్‌ను రూపొందించేటప్పుడు, షేర్ చేయడానికి, ఇతరులకు క్రెడిట్ ఇవ్వడానికి ప్రోత్సహించే ఫీచర్లను మేము చేర్చాము. ప్రతి ప్రాజెక్ట్ పేజీలో, నువ్వు ఎప్పుడైనా ఆ ప్రాజెక్ట్ అసలు స్క్రిప్ట్‌లను డౌన్‌లోడ్ చేసుకోవచ్చు. నువ్వు ఒక ప్రాజెక్ట్‌ను రీమిక్స్ చేస్తే (స్క్రిప్ట్‌లు లేదా కళాకృతులను మార్చి, ఫలితాన్ని షేర్ చేస్తే), నీకు ప్రేరణ ఇచ్చిన వ్యక్తులను, ప్రాజెక్ట్‌ను పేర్కొంటూ ప్రాజెక్ట్ గమనికలలో క్రెడిట్ ఇవ్వమని మేము నిన్ను ప్రోత్సహిస్తాము.
  text6: 'Catrobat ఆన్‌లైన్ కమ్యూనిటీ ఉపయోగ నిబంధనల గురించి %link-termsOfUse%లో మరింత తెలుసుకో.'
  list1:
    item1: నీ కేక్‌లను రెసిపీతో సహా షేర్ చేయి
    item2: నీకు ప్రేరణ ఇచ్చినవారికి క్రెడిట్ ఇవ్వు
  version: వెర్షన్ 1.1, 2 ఏప్రిల్ 2013
termsOfUse:
  title: ఉపయోగ నిబంధనలు
  headline: Catrobat కమ్యూనిటీకి స్వాగతం!
  text1: 'Catrobat కమ్యూనిటీలో భాగంగా, నువ్వు ఈ వ్యక్తులతో ప్రాజెక్ట్‌లు, ఆలోచనలు షేర్ చేస్తున్నావు:'
  text2: "ఈ కమ్యూనిటీని ప్రతి సభ్యుడికీ తోడ్పాటునిచ్చే ప్రదేశంగా చేయడానికి మాకు నీ సహాయం కావాలి. నువ్వు ఇలా సహాయం చేయవచ్చు:"
  text3: "Catrobat ప్రాజెక్ట్ ద్వారా మేము సహకారాన్ని పెంపొందించాలని, మొత్తం మానవాళి ప్రయోజనం కోసం అందరి సృజనాత్మకత కలవాలని కోరుకుంటున్నాము. ఇతర క్రియాశీల సభ్యులు తమ ప్రాజెక్ట్‌లను నీకు ఇచ్చినట్లే, నీ ప్రాజెక్ట్‌లను కమ్యూనిటీకి బహుమతిగా తిరిగి ఇవ్వడం ద్వారా నువ్వు కూడా Catrobat కమ్యూనిటీలో క్రియాశీల సభ్యుడివి కావచ్చు:"
  text4: 'నీకు మా బహుమతి:'
  text5: 'మా ఉపయోగ మరియు సేవా నిబంధనలు:'
  list1:
    item1: అనేక దేశాలు, సంస్కృతుల నుండి
    item2: అన్ని వయసుల వారు (చిన్న పిల్లల నుండి టీనేజర్లు, తాతయ్యలు, అమ్మమ్మల వరకు)
    item3: అన్ని స్థాయిల అనుభవం ఉన్నవారు
  list2:
    item1: గౌరవంగా ఉండు. ప్రాజెక్ట్‌లను షేర్ చేసేటప్పుడు, వివిధ వయసులు, నేపథ్యాల వ్యక్తులు నీ రచనలను చూస్తారని దయచేసి గుర్తుంచుకో.
    item2: "క్రెడిట్ ఇవ్వు. ఇతరుల ప్రాజెక్ట్‌లను మార్చి నీ సొంత వెర్షన్‌లు తయారు చేసుకోవచ్చు - వారికి క్రెడిట్ ఇవ్వడం మాత్రం మర్చిపోకు. క్రెడిట్ ఇవ్వడానికి ఒక చోటు నీ ప్రాజెక్ట్ గమనికలు మరియు క్రెడిట్స్ విభాగం. ఇతర వినియోగదారుల ప్రాజెక్ట్‌లను మార్చడం గురించిన వివరాల కోసం దయచేసి ఈ జాబితా కింది పేరాను చూడు."
    item3: "నిజాయితీగా ఉండు. నువ్వు కానివారిలా నటించకు, కమ్యూనిటీని మోసం చేయడానికి ప్రయత్నించకు."
    item4: "వ్యక్తిగత సమాచారాన్ని గోప్యంగా ఉంచు. నీ ఇమెయిల్ చిరునామా, ఫోన్ నంబర్ లేదా ఇతర వ్యక్తిగత సంప్రదింపు సమాచారాన్ని షేర్ చేయకు."
    item5: "సైట్‌ను స్నేహపూర్వకంగా ఉంచడంలో సహాయం చేయి. ఒక ప్రాజెక్ట్ లేదా వ్యాఖ్య ఇతరులకు దురుసుగా, అవమానకరంగా, అతి హింసాత్మకంగా లేదా మరేదైనా విధంగా అనుచితంగా అనిపిస్తుందని నీకు అనిపిస్తే, 'అనుచితమైనదిగా రిపోర్ట్ చేయి' బటన్‌ను క్లిక్ చేసి చిన్న వివరణ రాయి. Catrobat బృందం నీ రిపోర్ట్‌ను పరిశీలించి, ఏదైనా ప్రాజెక్ట్, వ్యాఖ్య లేదా పోస్ట్‌ను తీసివేయవచ్చు."
  list3:
    item1: "మా వెబ్‌సైట్‌లకు ఒక ప్రాజెక్ట్‌ను అప్‌లోడ్ చేయడం ద్వారా, ఆ పనిని అప్‌లోడ్ చేసిన Catrobat ప్రాజెక్ట్‌ల కొన్ని ఉచిత లైసెన్స్‌ల కింద ఉంచడానికి నువ్వు అంగీకరిస్తున్నావు. Catrobat సిస్టమ్ నీకు అందుబాటులో ఉన్న ఉచిత లైసెన్స్‌ల లాగానే, అప్‌లోడ్ చేసిన Catrobat ప్రాజెక్ట్‌ల ఈ ఉచిత లైసెన్స్‌లు ఇతరులు ఇంతకు ముందు అప్‌లోడ్ చేసిన పని నుండి నేర్చుకునే హక్కును, ఆ పనిని మార్చి రీమిక్స్ చేసి తమ సొంత కొత్త ఆసక్తికరమైన గేమ్‌లు, యానిమేషన్‌లు, ఇతర ప్రాజెక్ట్‌లు నిర్మించుకునే హక్కును అందరికీ ఇస్తాయి. దీనివల్ల ప్రతి ఒక్కరూ 'తోటివారి భుజాలపై నిలబడగలరు', వారిలో ఒకరు నువ్వే! నీ పని ఈ విధంగా మొత్తం ప్రపంచానికి ఉపయోగపడుతుంది, అందరూ ఉచితంగా ఉపయోగించుకునేలా ఉంటుంది, ప్రపంచవ్యాప్తంగా వాలంటీర్లు వికీపీడియాకు ఉచితంగా అందించే పాఠ్యం, చిత్రాల లాగా. దీన్ని మానవాళికి నీ బహుమతిగా భావించు: నువ్వు అందరికీ ఇస్తావు, మా వెబ్‌సైట్‌లకు తమ పనిని అప్‌లోడ్ చేసే ఇతరులందరూ నీకు ఇస్తారు. కాబట్టి అప్‌లోడ్ చేసిన ప్రాజెక్ట్ గొప్ప విలువైన బహుమతి, దాని యజమాని దాన్ని నీకు ఉచితంగా ఇస్తున్నారు, నువ్వు కూడా అదే నిబంధనలతో కమ్యూనిటీలో పాల్గొనాలనే షరతుతో."
    item2: నువ్వు ఆ బహుమతిని స్వీకరించాల్సిన అవసరం లేదు; స్వీకరిస్తే, కొన్ని నియమాలు వర్తిస్తాయి. ఈ నియమాల ప్రయోజనం ఏమిటంటే, నువ్వు ఆ పని నుండి నేర్చుకుని, దానిపై నిర్మించి ఇంకా అద్భుతమైనవి నువ్వే తయారు చేయవచ్చు, వాటిని ఉదాహరణకు మళ్ళీ నీ సొంత పనిగా మా వెబ్‌సైట్‌లకు అప్‌లోడ్ చేయవచ్చు. మరో ప్రయోజనం ఏమిటంటే, నీ ప్రాజెక్ట్‌ను ఇతరులు ఉపయోగించడం వల్ల వారికి కలిగే ఏ సమస్యలకూ నిన్ను బాధ్యుడిని చేయలేరని ఈ లైసెన్స్‌లు నిర్ధారిస్తాయి.
    item3: "ఒక ముఖ్యమైన అదనపు షరతు ఏమిటంటే, నువ్వు ఎవరి పనుల ఆధారంగా నీ పనిని చేశావో ఆ రచయితలకు స్పష్టంగా క్రెడిట్ ఇవ్వాలి. అదే సమయంలో, Catrobat కమ్యూనిటీలో నిన్ను సూచించడానికి నువ్వు స్వేచ్ఛగా ఎంచుకున్న ప్రత్యేక పేరుకు క్రెడిట్ ఇవ్వడం ద్వారా, నీ పనిని అందరికీ, ముఖ్యంగా వారికి ఇచ్చినందుకు నీకు బహిరంగంగా కృతజ్ఞతలు తెలిపే అవకాశం ఇతరులకు ఇవ్వడం ద్వారా, నీ పని నువ్వే అందించావని ఇతరులు స్పష్టంగా గుర్తించేలా మేము కృషి చేస్తాము."
    item4: 'ఖచ్చితమైన చట్టపరమైన నిబంధనలు, షరతుల కోసం దయచేసి %link-licenseUploaded% చూడు.'
  list4:
    item1: "Catrobat సిస్టమ్‌కు సంబంధించిన మా సొంత సాఫ్ట్‌వేర్, ఇంటర్నెట్ వనరులన్నింటినీ, ఉదాహరణకు Catrobat బృందం రాసిన సాఫ్ట్‌వేర్, మా వెబ్‌సైట్‌లు, ఇంటర్నెట్ వనరులు, Catrobat సిస్టమ్‌కు సంబంధించిన మా సొంత సోర్స్ కోడ్, అలాగే చిత్రాలు, శబ్దాలు, పాఠ్యాలు వంటి అదనపు సామగ్రిని, ఇప్పుడు మరియు భవిష్యత్తులో Catrobat ఉచిత లైసెన్స్‌ల కింద నీకు అందిస్తాము."
    item2: ఈ లైసెన్స్‌లు Catrobat అన్ని భాగాలను నీకు ఉచితంగా అందిస్తాయి, అంతేకాకుండా వాటిని నీకు నచ్చినట్లు ఉపయోగించుకునే స్వేచ్ఛనూ ఇస్తాయి. కొన్ని పరిమితులు మాత్రమే ఉంటాయి, ఇవి ఇతర విషయాలతో పాటు Catrobat సిస్టమ్ ఎప్పటికీ ఉచితంగా, అందరికీ ఉపయోగకరంగా ఉండేలా చూస్తాయి.
    item3: 'ఖచ్చితమైన చట్టపరమైన నిబంధనలు, షరతుల కోసం దయచేసి %link-licenseToPlay% చూడు. Catrobat సిస్టమ్ సోర్స్ కోడ్‌తో పాటు అనేక ఇతర పత్రాలు, వనరులు %link-developer% ద్వారా అందుబాటులో ఉన్నాయి.'
  list5:
    item1: 'నువ్వు, లేదా నీ వయసు 13 ఏళ్ల కంటే తక్కువైతే నీ తల్లిదండ్రులు లేదా చట్టపరమైన సంరక్షకులు, డ్రాగ్‌నెట్ తరహా గోప్యతా ఉల్లంఘనలు మరియు/లేదా భారీ లేదా సామూహిక నిఘాలో పాల్గొనే లేదా దానికి బాధ్యత వహించే సంస్థతో సంబంధం కలిగి ఉంటే, నువ్వు మా సాఫ్ట్‌వేర్ అప్లికేషన్‌లను ఉపయోగించడానికి, మా సేవలను యాక్సెస్ చేయడానికి అనుమతి లేదు. ఈ పరిమితి ఖచ్చితమైన వివరాలు, దానికి కొన్ని మినహాయింపులు మా %link-termsOfUse%లోని సెక్షన్లు 4.a మరియు 4.bలో వివరించబడ్డాయి.'
    item2: నీ వయసు 13 ఏళ్ల కంటే తక్కువైతే, Catrobat సాఫ్ట్‌వేర్ అప్లికేషన్‌లు, సేవలను ఉపయోగించడానికి వారు అనుమతిస్తారా అని నువ్వు నీ తల్లిదండ్రులను లేదా చట్టపరమైన సంరక్షకులను అడగాలి.
    item3: "Catrobat వెబ్‌సైట్‌లకు అప్‌లోడ్ చేసిన ప్రాజెక్ట్‌లు, వినియోగదారు ఖాతాలు, ఏదైనా డిజిటల్ సామగ్రిని ఎప్పుడైనా మా సొంత విచక్షణతో తిరస్కరించే, తొలగించే లేదా దాచే హక్కులు మాకు ఉన్నాయి, ఉదాహరణకు ఒక ప్రాజెక్ట్‌లో అనుచితమైన సామగ్రి ఉందని లేదా ఒక వినియోగదారు ఇతరుల హక్కులను ఉల్లంఘిస్తున్నారని మేము గుర్తిస్తే."
    item4: "Catrobat సాఫ్ట్‌వేర్, ఇంటర్నెట్ వనరులన్నీ ఉపయోగకరంగా ఉంటాయనే ఆశతో అందించబడతాయి, కానీ ఎలాంటి వారంటీ లేకుండా."
    item5: 'పై అంశాల ఖచ్చితమైన వివరణలు, కొన్ని అదనపు చట్టపరమైన నిబంధనలు, షరతుల కోసం దయచేసి మా %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service చూడు.'
  bottom1: మా ఉపయోగ నిబంధనలను మెరుగుపరచడానికి మేము ఎప్పుడూ ప్రయత్నిస్తుంటాము కాబట్టి, అప్పుడప్పుడు ఇక్కడ మళ్ళీ చూస్తూ ఉండు.
  bottom2: 'ఈ ఉపయోగ నిబంధనల గురించి ఏవైనా సూచనలు ఉంటే దయచేసి %email-webmaster%కి పంపు.'
