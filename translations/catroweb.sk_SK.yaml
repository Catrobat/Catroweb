  email:
    subject: "Pre účet Catrobat tvojho dieťaťa je potrebný súhlas rodiča"
    title: "Je potrebný súhlas rodiča"
    greeting: "Ahoj,"
    message: "Tvoje dieťa %username% si vytvorilo účet na Catrobate a overilo svoju e-mailovú adresu."
    explanation: "Catrobat je bezplatná vzdelávacia platforma, kde sa mladí ľudia učia programovať tvorbou aplikácií, hier a animácií. Podľa predpisov EÚ o ochrane detí potrebujeme tvoj súhlas, aby sa tvoje dieťa mohlo plne zapojiť do komunity. Klikni na tlačidlo nižšie a udeľ súhlas."
    button: "Udeliť súhlas rodiča"
