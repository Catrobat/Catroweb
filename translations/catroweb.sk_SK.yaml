parent:
  footer:
    link: "Rodičia a zákonní zástupcovia"
  info:
    title: "Informácie pre rodičov a zákonných zástupcov"
    intro: "Catrobat berie bezpečnosť a súkromie mladých používateľov vážne. Na tejto stránke sa dozvieš, ako chránime tvoje dieťa a aké máš práva."
    whatIsCatrobat:
      title: "Čo je Catrobat?"
      text: "Catrobat je bezplatná nezisková vzdelávacia platforma, kde sa mladí ľudia učia programovať tvorbou vlastných aplikácií, hier a animácií. Platforma je dostupná na celom svete a používa sa vo vzdelávaní."
    dataCollected:
      title: "Aké údaje zbierame?"
      text: "Zbierame len minimum údajov potrebných na prevádzku platformy: používateľské meno, e-mailovú adresu, dátum narodenia a projekty, ktoré tvoje dieťa vytvorí a nahrá. Pri používateľoch mladších ako 14 rokov uchovávame aj e-mailovú adresu rodiča/zákonného zástupcu kvôli súhlasu. Osobné údaje nepredávame ani nezdieľame s tretími stranami."
    yourRights:
      title: "Tvoje práva ako rodiča alebo zákonného zástupcu"
      text: "Podľa predpisov EÚ o ochrane detí (GDPR) a COPPA máš právo: nahliadnuť do údajov, ktoré o tvojom dieťati uchovávame, požiadať o ich kópiu, kedykoľvek odvolať svoj súhlas (čím sa účet obmedzí) a požiadať o trvalé vymazanie účtu tvojho dieťaťa a všetkých súvisiacich údajov."
    minorRestrictions:
      title: "Aké obmedzenia platia pre účty maloletých?"
      text: "Používatelia mladší ako 16 rokov nemôžu písať ani čítať komentáre, sledovať iných používateľov ani zobrazovať obsah označený ako nevhodný pre deti. Stále môžu vytvárať a nahrávať projekty, prehliadať verejné projekty a reagovať na projekty lajkami. Tieto obmedzenia vytvárajú bezpečné prostredie na učenie."
    manageButton: "Spravovať účet tvojho dieťaťa"
