licenseToPlay:
  link: 'Licencia na hranie'
  title: 'Licencia na hranie – uveď autorov a zdieľaj'
  text1: Predstav si, že každý projekt Catrobat je koláč, veľmi zvláštny koláč, ku ktorému patrí aj recept (programovacie bloky). Všetci členovia komunity Catrobat zdieľajú svoje koláče spolu s receptami. To znamená, že si koláče môžeš vychutnať a naučiť sa ich piecť sám!
  text2: 'Neexistujú tajné recepty: návod, ako tieto koláče upiecť, môže ktokoľvek použiť, znova použiť, upraviť a nechať sa ním inšpirovať k novým nápadom... teda koláčom.'
  text3: "Koláče môžeš jesť a recepty iných ľudí môžeš kopírovať a piecť z nich vlastné, možno s inými prísadami. Táto sloboda má dve jednoduché podmienky:"
  text4: "Keď sme zakladali komunitu Catrobat, rozhodli sme sa pre tento prístup, pretože veríme, že podporuje učenie a kreativitu v komunite. Zdieľaním receptov a prísad (skriptov a grafiky) môžu ľudia stavať na nápadoch iných a úžitok z toho majú všetci."
  text5: Pri navrhovaní webovej stránky Catrobat sme pridali funkcie, ktoré ľudí povzbudzujú zdieľať a uvádzať autorov. Na stránke každého projektu si môžeš vždy stiahnuť pôvodné skripty projektu. Ak projekt remixuješ (upravíš skripty alebo grafiku a výsledok zdieľaš), odporúčame ti uviesť v poznámkach k projektu ľudí a projekt, ktorí ťa inšpirovali.
  text6: 'Viac o podmienkach používania online komunity Catrobat sa dozvieš na %link-termsOfUse%.'
  list1:
    item1: zdieľaj svoje koláče spolu s receptom
    item2: uveď tých, ktorí ťa inšpirovali
  version: Verzia 1.1, 2. apríla 2013
termsOfUse:
  title: Podmienky používania
  headline: Vitaj v komunite Catrobat!
  text1: 'Ako súčasť komunity Catrobat zdieľaš projekty a nápady s ľuďmi:'
  text2: "Potrebujeme tvoju pomoc, aby bola táto komunita podporujúcim miestom pre každého člena. Takto môžeš pomôcť:"
  text3: "Projektom Catrobat chceme podporovať spoluprácu a umožniť, aby sa kreativita všetkých spájala v prospech celého ľudstva. Aj ty sa môžeš stať aktívnym členom komunity Catrobat tým, že svoje projekty daruješ komunite, rovnako ako ti ostatní aktívni členovia darujú tie svoje:"
  text4: 'Náš dar pre teba:'
  text5: 'Naše podmienky používania a služieb:'
  list1:
    item1: z mnohých rôznych krajín a kultúr
    item2: všetkých vekových skupín (od malých detí cez tínedžerov až po starých rodičov)
    item3: so všetkými úrovňami skúseností
  list2:
    item1: Buď slušný. Keď zdieľaš projekty, pamätaj, že tvoje príspevky uvidia ľudia rôzneho veku a pôvodu.
    item2: "Uvádzaj autorov. Pokojne vytváraj upravené verzie projektov iných ľudí – len nezabudni uviesť ich ako autorov. Jedno miesto, kde to môžeš urobiť, je sekcia poďakovaní v tvojom projekte. Podrobnosti o úpravách projektov iných používateľov nájdeš v odseku pod týmto bodovým zoznamom."
    item3: "Buď úprimný. Nepredstieraj, že si niekto iný, a nesnaž sa komunitu oklamať."
    item4: "Chráň svoje osobné údaje. Nezdieľaj svoju e-mailovú adresu, telefónne číslo ani iné osobné kontaktné údaje."
    item5: "Pomôž udržať stránku priateľskú. Ak si myslíš, že by ostatní považovali nejaký projekt alebo komentár za zlý, urážlivý, príliš násilný alebo inak nevhodný, klikni na tlačidlo „nahlásiť ako nevhodné“ a pridaj krátke vysvetlenie. Tím Catrobat tvoje nahlásenie posúdi a môže projekt, komentár alebo príspevok odstrániť."
  list3:
    item1: "Nahraním projektu na naše webové stránky súhlasíš s tým, že toto dielo bude dostupné pod určitými slobodnými licenciami pre nahrané projekty Catrobat. Podobne ako slobodné licencie, pod ktorými máš k dispozícii samotný systém Catrobat, dávajú tieto licencie každému právo učiť sa z diel, ktoré predtým nahrali iní, a upravovať a remixovať ich pri tvorbe vlastných nových úžasných hier, animácií a iných projektov. Vďaka tomu môže každý „stáť na pleciach svojich rovesníkov“ – a jedným z nich si aj ty! Tvoje dielo tak poslúži celému svetu a zostane voľne dostupné pre všetkých, podobne ako texty a obrázky, ktoré do Wikipédie dobrovoľne prispievajú ľudia z celého sveta. Ber to ako svoj dar ľudstvu: ty dávaš všetkým a všetci ostatní, ktorí nahrávajú svoje diela na naše stránky, dávajú tebe. Nahraný projekt je teda veľmi hodnotný dar, ktorý ti jeho vlastník dáva zadarmo, pod podmienkou, že sa do komunity zapojíš za rovnakých podmienok."
    item2: Dar nemusíš prijať; ak ho prijmeš, platia určité pravidlá. Výhodou týchto pravidiel je, že sa z diela môžeš učiť a stavať na ňom, aby si sám vytvoril ešte lepšie veci, ktoré potom môžeš napríklad znova nahrať na naše stránky ako svoje vlastné. Ďalšou výhodou je, že tieto licencie zaručujú, že nemôžeš niesť zodpovednosť za problémy, ktoré vzniknú iným pri používaní tvojho projektu.
    item3: "Dôležitou doplňujúcou podmienkou je, že jasne uvedieš autorov, na ktorých dielach si svoje dielo postavil. Zároveň sa budeme veľmi snažiť, aby ostatní jasne videli, že tvoje dielo pochádza od teba – uvedením jedinečného mena, ktoré si si slobodne zvolil v komunite Catrobat, a tým, že ostatným dáme možnosť verejne ti poďakovať za to, že si svoje dielo daroval všetkým, a najmä im."
    item4: 'Presné právne podmienky nájdeš na %link-licenseUploaded%.'
  list4:
    item1: "Všetok náš vlastný softvér a internetové zdroje súvisiace so systémom Catrobat, napr. softvér napísaný tímom Catrobat, naše webové stránky a internetové zdroje, náš vlastný zdrojový kód súvisiaci so systémom Catrobat a všetky ďalšie priložené materiály, ako sú obrázky, zvuky a texty, ti teraz aj v budúcnosti ponúkame pod slobodnými licenciami Catrobat."
    item2: Vďaka týmto licenciám sú všetky časti Catrobatu pre teba bezplatné a zároveň slobodné v tom zmysle, že ich môžeš používať, ako chceš, len s niekoľkými obmedzeniami, ktoré okrem iného zaručujú, že systém Catrobat navždy zostane slobodný a užitočný pre všetkých.
    item3: 'Presné právne podmienky nájdeš na %link-licenseToPlay%. Zdrojový kód systému Catrobat aj mnoho ďalších dokumentov a zdrojov sú dostupné cez %link-developer%.'
  list5:
    item1: 'Ak si ty, alebo ak máš menej ako 13 rokov, tvoji rodičia či zákonní zástupcovia, spojený s organizáciou, ktorá sa podieľa na plošnom porušovaní súkromia a/alebo hromadnom či masovom sledovaní alebo je zaň zodpovedná, nesmieš používať naše softvérové aplikácie ani pristupovať k našim službám. Presné podrobnosti tohto obmedzenia a niektoré výnimky z neho sú opísané v oddieloch 4.a a 4.b na stránke %link-termsOfUse%.'
    item2: Ak máš menej ako 13 rokov, musíš sa opýtať rodičov alebo zákonných zástupcov, či ti dovolia používať softvérové aplikácie a služby Catrobat.
    item3: "Vyhradzujeme si právo kedykoľvek podľa vlastného uváženia odmietnuť, vymazať alebo skryť projekty, používateľské účty a akékoľvek digitálne materiály nahrané na webové stránky Catrobat, napríklad ak zistíme, že projekt obsahuje nevhodný materiál alebo že používateľ porušuje práva iných osôb."
    item4: "Všetok softvér a internetové zdroje Catrobat sú ponúkané v nádeji, že budú užitočné, ale bez akejkoľvek záruky."
    item5: 'Presné znenie vyššie uvedených bodov a niektoré ďalšie právne podmienky nájdeš na %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service.'
  bottom1: Z času na čas sa sem vráť, pretože naše podmienky používania neustále vylepšujeme.
  bottom2: 'Návrhy k týmto podmienkam používania posielaj na %email-webmaster%.'
  version: Verzia 1.3, 4. marca 2014
