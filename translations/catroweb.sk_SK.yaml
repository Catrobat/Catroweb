privacy-policy:
  header: Zásady ochrany osobných údajov
  version: Verzia 2.2, 17. októbra 2019
  text1: Aby sme ti mohli ponúknuť všetky výhody našich služieb a súvisiaceho účtu, musíme od teba zbierať určité údaje.
  text2: Na údržbu a zlepšovanie našich služieb (aplikácií a webových stránok) a na vedecký výskum v oblasti vzdelávania IKT a STEM/STEAM používame Google Analytics, Crashlytics a Firebase od spoločnosti Google LLC (USA), ako aj Dynatrace od spoločnosti Dynatrace LLC (USA), aby sme získali metadáta o používaní našich služieb, napr. informácie o pádoch, časové značky, navštívené stránky/obrazovky, používanie našich aplikácií a služieb, použitý operačný systém a informácie o poskytovateľovi siete. Táto analýza a zozbierané údaje nie sú prepojené s tvojím profilom a neobsahujú žiadne osobné údaje (posledné bity IP adresy sa anonymizujú). Zozbierané údaje sa však prenášajú poskytovateľom služieb (Google LLC, USA a Dynatrace LLC, USA). Spracúvanie údajov je založené na zmluvách so spoločnosťami Google LLC a Dynatrace LLC. Tento vzťah s poskytovateľmi služieb je v súlade so všeobecným nariadením Európskej únie o ochrane údajov (GDPR) a dohodou EÚ – USA „Privacy Shield“.
  text3: Aby si si mohol vytvoriť a používať účet v našich systémoch a aby sme ťa mohli e-mailom informovať o potrebných zmenách týkajúcich sa tvojho účtu, napr. o aktualizáciách alebo porušeniach našich podmienok používania a služieb, pravidiel komunity či zásad, uchovávame tvoje používateľské meno a, ak si ju uviedol, tvoju e-mailovú adresu. Ak si svoj účet prepojil cez Google Plus alebo Facebook, uchovávame navyše identifikačný kľúč spojený s tvojím účtom v týchto službách. Tieto údaje nepoužijeme na žiadne iné (napr. marketingové) účely, pokiaľ nám to výslovne nepovolíš.
  text4: Dobrovoľne nám môžeš na stránke svojho účtu na zdieľacej stránke uviesť krajinu, v ktorej žiješ. Zobrazí sa na tvojom verejnom profile a používame ju iba na štatistické a výskumné účely. V nastaveniach profilu ju môžeš kedykoľvek odstrániť.
  text5: Používanie osobných údajov patriacich k tvojmu účtu môžeš kedykoľvek ukončiť vymazaním účtu na svojej profilovej stránke na https://share.catrob.at/. Po vymazaní účtu budeš môcť poskytované služby naďalej používať, ale nie spolupracovať, napr. nahrávať programy, komentovať alebo dávať lajky. Vymaže sa aj všetok obsah prepojený s tvojím účtom, napr. nahrané programy, komentáre atď.
  text6: Aby sme zabránili zneužívaniu našich služieb, napr. nahrávaním alebo komentármi na nezákonné účely, všetky verejné údaje vytvorené používateľmi (nahrávky, komentáre) sa interne ukladajú do databázy spolu s časovou značkou a použitou internetovou adresou. Tieto údaje nebudú používané žiadnymi inštitúciami ani im postúpené, pokiaľ neexistuje dôvodné podozrenie z dostatočne nezákonného konania a oficiálne oprávnené právne inštitúcie o ne nepožiadajú na základe platného práva. Každý prípad najprv dôkladne individuálne preveríme.
  text7: Dobrovoľne sa môžeš prihlásiť na odber newslettera Catrobat na https://catrob.at/newsletter, ktorý poskytujeme prostredníctvom služby MailChimp (The Rocket Science Group LLC d/b/a MailChimp, USA). Potom budeš na zadanú e-mailovú adresu dostávať novinky o projekte Catrobat a jeho službách. Odber newslettera môžeš kedykoľvek zrušiť pomocou odkazu „unsubscribe“ v päte každého newslettera. Tento newsletter poskytuje MailChimp, s ktorým máme zmluvu o spracúvaní údajov a ktorý sa zaviazal dodržiavať všeobecné nariadenie EÚ o ochrane údajov a dohodu EÚ – USA „Privacy Shield“. Ďalšie podrobnosti o MailChimpe nájdeš v jeho zásadách ochrany osobných údajov a podmienkach používania.
  text8: Všetky služby poskytuje slobodný open source projekt Catrobat pod záštitou International Catrobat Association – Verein zur Förderung freier Software, neziskovej mimovládnej organizácie so sídlom v Grazi v Rakúsku (Európska únia). Naše zásady rešpektujú právo EÚ a Rakúska v oblasti ochrany údajov (GDPR). Ak nás chceš kontaktovať, pošli e-mail na contact@catrobat.org alebo list na adresu Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Rakúsko (Európska únia).
  text9: Ak máš menej ako 14 rokov, musí tieto zásady prijať zákonný zástupca (zvyčajne rodič).
  text10: Oficiálne anglické znenie zásad ochrany osobných údajov Catrobat nájdeš na webe na adrese %privacy_policy%.
  disagree-text: Bez súhlasu ti nemôžeme vytvoriť účet, ale základné funkcie sú stále dostupné.
