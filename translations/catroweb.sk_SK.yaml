    manageLink: 'Účet svojho dieťaťa môžeš kedykoľvek spravovať cez náš <a href="%portalUrl%" style="color: #00acc1;">Rodičovský portál</a>. Viac sa dozvieš o <a href="%infoUrl%" style="color: #00acc1;">tvojich právach ako rodiča</a>.'
