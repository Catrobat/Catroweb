parent:
  footer:
    link: 'Tėvams ir globėjams'
  info:
    title: 'Informacija tėvams ir globėjams'
    intro: 'Catrobat rimtai rūpinasi jaunųjų naudotojų saugumu ir privatumu. Šiame puslapyje paaiškinama, kaip saugome tavo vaiką ir kokias teises turi tu.'
    whatIsCatrobat:
      title: 'Kas yra Catrobat?'
      text: 'Catrobat – tai nemokama, ne pelno siekianti švietimo platforma, kurioje jaunuoliai mokosi programuoti kurdami savo programėles, žaidimus ir animacijas. Platforma prieinama visame pasaulyje ir naudojama švietimo įstaigose.'
    dataCollected:
      title: 'Kokius duomenis renkame?'
      text: 'Renkame tik tiek duomenų, kiek būtina platformai veikti: naudotojo vardą, el. pašto adresą, gimimo datą ir projektus, kuriuos tavo vaikas sukuria ir įkelia. Jaunesnių nei 14 metų naudotojų atveju taip pat saugome tėvų ar globėjų el. pašto adresą sutikimui gauti. Asmens duomenų neparduodame ir neperduodame trečiosioms šalims.'
    yourRights:
      title: 'Tavo, kaip tėvų ar globėjo, teisės'
      text: 'Pagal ES vaikų apsaugos taisykles (BDAR) ir COPPA turi teisę: peržiūrėti duomenis, kuriuos turime apie tavo vaiką, gauti tų duomenų kopiją, bet kada atšaukti savo sutikimą (tai apriboja paskyrą) ir paprašyti visam laikui ištrinti tavo vaiko paskyrą bei visus susijusius duomenis.'
    minorRestrictions:
      title: 'Kokie apribojimai taikomi nepilnamečių paskyroms?'
      text: 'Jaunesni nei 16 metų naudotojai negali rašyti ar skaityti komentarų, sekti kitų naudotojų ar matyti turinio, pažymėto kaip netinkamas vaikams. Jie vis tiek gali kurti ir įkelti projektus, naršyti viešus projektus ir reaguoti į projektus. Šie apribojimai taikomi siekiant užtikrinti saugią mokymosi aplinką.'
    manageButton: 'Tvarkyti vaiko paskyrą'
  portal:
