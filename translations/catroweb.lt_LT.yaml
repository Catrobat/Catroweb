privacy-policy:
  header: Privatumo taisyklės
  version: 'Versija 2.2, 2019 m. spalio 17 d.'
  text1: 'Kad galėtume tau pasiūlyti visus mūsų paslaugų ir susijusios paskyros privalumus, būtina rinkti tam tikrus tavo duomenis.'
  text2: 'Siekdami prižiūrėti ir tobulinti savo paslaugas (programėles ir svetaines) bei vykdyti mokslinius IRT ir STEM/STEAM švietimo tyrimus, naudojame Google Analytics, Crashlytics ir Firebase (visos priklauso Google LLC, JAV), taip pat Dynatrace (Dynatrace LLC, JAV), kad gautume metaduomenis apie naudojimąsi mūsų paslaugomis, pvz., informaciją apie gedimus, laiko žymas, aplankytus puslapius ar ekranus, naudojimąsi mūsų programėlėmis ir paslaugomis, naudojamą operacinę sistemą ir informaciją apie tinklo teikėją. Ši analizė ir surinkti duomenys nesiejami su tavo profiliu ir neapima jokios asmeninės informacijos (paskutiniai IP adreso bitai anonimizuojami). Tačiau surinkti duomenys perduodami paslaugų teikėjams (Google LLC, JAV ir Dynatrace LLC, JAV). Duomenų tvarkymas grindžiamas sutartimis su Google LLC ir Dynatrace LLC. Šie santykiai su paslaugų teikėjais atitinka Europos Sąjungos Bendrąjį duomenų apsaugos reglamentą (ES BDAR) ir ES ir JAV „Privatumo skydo“ susitarimą.'
  text3: 'Kad galėtum susikurti ir naudoti paskyrą mūsų sistemose, o mes galėtume el. paštu informuoti tave apie būtinus su paskyra susijusius pakeitimus, pvz., atnaujinimus ar mūsų naudojimo ir paslaugų teikimo sąlygų, bendruomenės taisyklių ar politikos pažeidimus, saugosime tavo naudotojo vardą ir, jei jį pateikei, el. pašto adresą. Jei savo paskyrą susiejai per Google Plus ar Facebook, papildomai saugome identifikavimo raktą, susietą su tavo paskyra tose paslaugose. Šių duomenų nenaudosime jokiais kitais (pvz., rinkodaros) tikslais, nebent tu tai aiškiai leidai.'
  text4: 'Savanoriškai gali nurodyti savo gyvenamąją šalį savo paskyros puslapyje dalijimosi svetainėje. Ji bus rodoma tavo viešame profilyje ir mes ją naudosime tik statistikos ir tyrimų tikslais. Ją bet kada gali pašalinti savo profilio nustatymuose.'
  text5: 'Savo paskyros asmens duomenų naudojimą gali bet kada nutraukti ištrindamas paskyrą savo profilio puslapyje https://share.catrob.at/. Ištrynęs paskyrą vis tiek galėsi naudotis teikiamomis paslaugomis, bet nebegalėsi bendradarbiauti, pvz., įkelti programų, komentuoti ar reaguoti. Be to, bus ištrintas visas su tavo paskyra susietas turinys, pvz., įkeltos programos, komentarai ir kt.'
  text6: 'Siekiant išvengti piktnaudžiavimo mūsų paslaugomis, pvz., naudotojų įkeliamu turiniu ar komentarais neteisėtais tikslais, visi naudotojų sukurti vieši duomenys (įkėlimai, komentarai) saugomi vidinėje duomenų bazėje kartu su laiko žyma ir naudotu interneto adresu. Šių duomenų nenaudos ir jie nebus perduoti jokioms institucijoms, nebent pagrįstai įtariama pakankamai neteisėtų veiksmų ir oficialiai įgaliotos teisinės institucijos jų paprašo pagal galiojančius įstatymus. Kiekvieną atvejį pirmiausia individualiai ir kruopščiai patikrinsime patys.'
  text7: 'Savanoriškai gali užsiprenumeruoti Catrobat naujienlaiškį adresu https://catrob.at/newsletter, kurį teikiame per MailChimp paslaugą (The Rocket Science Group LLC d/b/a MailChimp, JAV). Tada savo nurodytu el. pašto adresu gausi naujienas apie Catrobat projektą ir jo paslaugas. Naujienlaiškio prenumeratą gali bet kada atšaukti paspaudęs nuorodą „unsubscribe“ kiekvieno naujienlaiškio apačioje. Šį naujienlaiškį teikia MailChimp, su kuria turime duomenų tvarkymo sutartį ir kuri įsipareigojo laikytis ES Bendrojo duomenų apsaugos reglamento ir ES ir JAV „Privatumo skydo“. Daugiau informacijos apie MailChimp rasi MailChimp privatumo politikoje ir naudojimo sąlygose.'
  text8: 'Visas paslaugas teikia laisvas atvirojo kodo Catrobat projektas, veikiantis International Catrobat Association – Verein zur Förderung freier Software, ne pelno siekiančios NVO, įregistruotos Grace, Austrijoje (Europos Sąjunga), globoje. Mūsų politika atsižvelgia į ES ir Austrijos duomenų apsaugos teisę (BDAR). Norėdamas su mumis susisiekti, rašyk el. paštu contact@catrobat.org arba paštu adresu Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'Jei esi jaunesnis nei 14 metų, šias taisykles turi priimti teisėtas globėjas (paprastai vienas iš tėvų).'
  text10: 'Oficiali Catrobat privatumo politika anglų kalba internete pasiekiama adresu %privacy_policy%.'
  disagree-text: 'Be sutikimo negalime sukurti paskyros, tačiau pagrindinės funkcijos vis tiek prieinamos.'
