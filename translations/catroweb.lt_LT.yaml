licenseToPlay:
  link: 'Licencija žaisti'
  title: 'Licencija žaisti – nurodyk autorius ir dalinkis'
  text1: 'Įsivaizduok, kad kiekvienas Catrobat projektas yra pyragas – labai ypatingas pyragas, kuris pateikiamas kartu su receptu (programavimo blokais). Visi Catrobat bendruomenės nariai dalijasi savo pyragais kartu su receptais. Tai reiškia, kad gali mėgautis pyragais ir išmokti juos iškepti pats!'
  text2: 'Slaptų receptų nėra: instrukcijas, kaip iškepti šiuos pyragus, gali naudoti, naudoti pakartotinai, keisti kiekvienas, o jos gali įkvėpti naujų idėjų... tai yra, pyragų.'
  text3: 'Gali valgyti pyragus ir kopijuoti kitų žmonių receptus, kad iškeptum savo, galbūt su kitokiais ingredientais. Ši laisvė turi du paprastus reikalavimus:'
  text4: 'Kurdami Catrobat bendruomenę, nusprendėme laikytis šio požiūrio, nes tikime, kad jis skatina mokymąsi ir kūrybiškumą bendruomenėje. Dalindamiesi receptais ir ingredientais (scenarijais ir piešiniais), žmonės gali remtis vieni kitų idėjomis, ir iš to laimi visi.'
  text5: 'Kurdami Catrobat svetainę, įdiegėme funkcijas, skatinančias žmones dalintis ir nurodyti kitų autorystę. Kiekvieno projekto puslapyje visada gali atsisiųsti originalius projekto scenarijus. Jei remiksuoji projektą (pakeiti scenarijus ar piešinius ir pasidalini rezultatu), raginame projekto pastabose padėkoti žmonėms ir projektui, kurie tave įkvėpė.'
  text6: 'Daugiau apie Catrobat internetinės bendruomenės naudojimo sąlygas sužinok %link-termsOfUse%.'
  list1:
    item1: 'dalinkis savo pyragais kartu su receptu'
    item2: 'padėkok tiems, kurie tave įkvėpė'
  version: 'Versija 1.1, 2013 m. balandžio 2 d.'
termsOfUse:
  title: Naudojimo taisyklės
  headline: Sveiki atvykę į Catrobat bendruomenę!
  text1: 'Būdamas Catrobat bendruomenės dalimi, dalijiesi projektais ir idėjomis su žmonėmis:'
  text2: 'Mums reikia tavo pagalbos, kad ši bendruomenė būtų palaikanti vieta kiekvienam nariui. Štai kaip gali padėti:'
  text3: 'Per Catrobat projektą norime skatinti bendradarbiavimą ir leisti visų kūrybiškumui susijungti visos žmonijos labui. Ir tu gali tapti aktyviu Catrobat bendruomenės nariu, dovanodamas savo projektus bendruomenei taip pat, kaip kiti aktyvūs nariai dovanoja savo projektus tau:'
  text4: 'Dovanojame tau:'
  text5: 'Mūsų naudojimo ir paslaugų teikimo sąlygos:'
  list1:
    item1: 'iš daugelio skirtingų šalių ir kultūrų'
    item2: 'įvairaus amžiaus (nuo mažų vaikų iki paauglių ir senelių)'
    item3: 'turinčiais įvairios patirties'
  list2:
    item1: 'Būk pagarbus. Dalindamasis projektais, atmink, kad tavo darbus matys įvairaus amžiaus ir skirtingos kilmės žmonės.'
    item2: 'Nurodyk autorius. Drąsiai kurk pakeistas kitų žmonių projektų versijas – tik būtinai nurodyk jų autorius. Tai galima padaryti, pavyzdžiui, savo projekto padėkų skiltyje. Daugiau apie kitų naudotojų projektų keitimą rasi pastraipoje po šiuo sąrašu.'
    item3: 'Būk sąžiningas. Neapsimetinėk kuo nors kitu ir nebandyk apgauti bendruomenės.'
    item4: 'Saugok asmeninę informaciją. Nesidalink savo el. pašto adresu, telefono numeriu ar kita asmenine kontaktine informacija.'
    item5: 'Padėk išlaikyti svetainę draugišką. Jei manai, kad kiti projektą ar komentarą palaikytų piktu, įžeidžiančiu, per daug smurtiniu ar kitaip netinkamu, tiesiog spustelėk mygtuką „pranešti kaip netinkamą“ ir trumpai paaiškink. Catrobat komanda peržiūrės tavo pranešimą ir gali pašalinti bet kokį projektą, komentarą ar įrašą.'
  list3:
    item1: 'Įkeldamas projektą į mūsų svetaines, sutinki, kad šis darbas būtų platinamas pagal tam tikras laisvąsias įkeltų Catrobat projektų licencijas. Panašiai kaip laisvosios licencijos, pagal kurias tau prieinama pati Catrobat sistema, šios laisvosios įkeltų Catrobat projektų licencijos suteikia kiekvienam teisę mokytis iš kitų anksčiau įkeltų darbų, juos pritaikyti ir remiksuoti, kad sukurtų savo naujus įdomius žaidimus, animacijas ir kitus projektus. Tai leidžia kiekvienam „stovėti ant bendraamžių pečių“, ir vienas iš jų esi tu! Taip tavo darbas bus naudingas visam pasauliui ir liks laisvai prieinamas visiems, panašiai kaip tekstai ir paveikslėliai, kuriuos savanoriai iš viso pasaulio laisvai įneša į Vikipediją. Laikyk tai savo dovana žmonijai: tu dovanoji visiems, o visi kiti, įkeliantys savo darbus į mūsų svetaines, dovanoja tau. Taigi įkeltas projektas yra labai vertinga dovana, kurią jo savininkas tau dovanoja nemokamai su sąlyga, kad bendruomenėje dalyvausi tomis pačiomis sąlygomis.'
    item2: 'Neprivalai priimti dovanos; jei ją priimi, taikomos tam tikros taisyklės. Šių taisyklių nauda ta, kad gali mokytis iš darbo ir juo remdamasis pats sukurti dar šaunesnių dalykų, kuriuos vėliau gali, pavyzdžiui, vėl įkelti į mūsų svetaines kaip savo. Kita nauda – šios licencijos užtikrina, kad negalėsi būti laikomas atsakingu už jokias problemas, kylančias kitiems naudojantis tavo projektu.'
    item3: 'Viena svarbi papildoma sąlyga – aiškiai nurodyti autorius, kurių darbais rėmeisi kurdamas savo darbą. Tuo pačiu stengsimės, kad kiti aiškiai matytų, jog darbą sukūrei tu, nurodydami unikalų vardą, kurį laisvai pasirinkai Catrobat bendruomenėje, ir suteikdami kitiems galimybę viešai išreikšti tau padėką už tai, kad savo darbą padovanojai visiems, o ypač jiems.'
    item4: 'Tikslias teisines sąlygas rasi %link-licenseUploaded%.'
  list4:
    item1: 'Visą savo programinę įrangą ir interneto išteklius, susijusius su Catrobat sistema, pvz., Catrobat komandos parašytą programinę įrangą, mūsų svetaines ir interneto išteklius, mūsų pačių su Catrobat sistema susijusį išeities kodą ir visą papildomą medžiagą, pvz., paveikslėlius, garsus ir tekstus, dabar ir ateityje tau siūlome pagal laisvąsias Catrobat licencijas.'
    item2: 'Šios licencijos visas Catrobat dalis tau padaro ir nemokamas, ir laisvas – suteikia laisvę jas naudoti kaip tik nori, taikant tik kelis apribojimus, kurie, be kita ko, užtikrina, kad Catrobat sistema visada išliktų laisva ir naudinga visiems.'
    item3: 'Tikslias teisines sąlygas rasi %link-licenseToPlay%. Catrobat sistemos išeities kodas ir daugelis kitų dokumentų bei išteklių pasiekiami per %link-developer%.'
  list5:
    item1: 'Jei tu arba, jei esi jaunesnis nei 13 metų, tavo tėvai ar teisėti globėjai esate susiję su organizacija, dalyvaujančia ar atsakinga už masinius privatumo pažeidimus ir (arba) masinį sekimą, tau neleidžiama naudotis mūsų programinėmis programomis ir paslaugomis. Tikslios šio apribojimo detalės ir tam tikros jo išimtys aprašytos mūsų %link-termsOfUse% 4.a ir 4.b skirsniuose.'
    item2: 'Jei esi jaunesnis nei 13 metų, turi paklausti savo tėvų ar teisėtų globėjų, ar jie leidžia tau naudotis Catrobat programomis ir paslaugomis.'
    item3: 'Pasiliekame teisę bet kada savo nuožiūra atmesti, ištrinti ar paslėpti projektus, naudotojų paskyras ir bet kokią į Catrobat svetaines įkeltą skaitmeninę medžiagą, pavyzdžiui, jei nustatome, kad projekte yra netinkamos medžiagos arba kad naudotojas pažeidžia kitų asmenų teises.'
    item4: 'Visa Catrobat programinė įranga ir interneto ištekliai siūlomi tikintis, kad bus naudingi, tačiau be jokios garantijos.'
    item5: 'Tikslias pirmiau nurodytų punktų formuluotes ir kai kurias papildomas teisines sąlygas rasi mūsų %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service.'
  bottom1: 'Retkarčiais užsuk čia, nes nuolat stengiamės tobulinti savo naudojimo sąlygas.'
  bottom2: 'Pasiūlymus dėl šių naudojimo sąlygų siųsk el. paštu %email-webmaster%.'
  version: 'Versija 1.3, 2014 m. kovo 4 d.'
