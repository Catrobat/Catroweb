    title: 'Reikalingas tėvų sutikimas'
    greeting: 'Sveiki,'
    message: 'Tavo vaikas %username% susikūrė Catrobat paskyrą ir patvirtino savo el. pašto adresą.'
    explanation: 'Catrobat – tai nemokama švietimo platforma, kurioje jaunuoliai mokosi programuoti kurdami programėles, žaidimus ir animacijas. Pagal ES vaikų apsaugos taisykles mums reikia tavo sutikimo, kad tavo vaikas galėtų visavertiškai dalyvauti bendruomenėje. Spustelėk žemiau esantį mygtuką ir duok sutikimą.'
    button: 'Duoti tėvų sutikimą'
