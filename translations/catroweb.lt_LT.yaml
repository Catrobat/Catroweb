    whatIsCatrobat: 'Catrobat – tai nemokama, ne pelno siekianti švietimo ir programavimo platforma. Daugiau sužinok catrobat.org.'
    manageLink: 'Savo vaiko paskyrą bet kada gali tvarkyti mūsų <a href="%portalUrl%" style="color: #00acc1;">Tėvų portale</a>. Sužinok daugiau apie <a href="%infoUrl%" style="color: #00acc1;">savo, kaip tėvų, teises</a>.'
