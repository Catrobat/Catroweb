parent:
  footer:
    link: "أولياء الأمور والأوصياء"
  info:
    title: "معلومات لأولياء الأمور والأوصياء"
    intro: "تأخذ Catrobat سلامة وخصوصية المستخدمين الصغار على محمل الجد. تشرح هذه الصفحة كيف نحمي طفلك وما هي الحقوق التي تملكها."
    whatIsCatrobat:
      title: "ما هي Catrobat؟"
      text: "Catrobat منصة تعليمية مجانية وغير ربحية يتعلم فيها الشباب البرمجة من خلال إنشاء تطبيقاتهم وألعابهم ورسومهم المتحركة الخاصة. المنصة متاحة في جميع أنحاء العالم وتُستخدم في البيئات التعليمية."
    dataCollected:
      title: "ما البيانات التي نجمعها؟"
      text: "نجمع الحد الأدنى من البيانات اللازمة لتشغيل المنصة: اسم المستخدم وعنوان البريد الإلكتروني وتاريخ الميلاد وأي مشاريع ينشئها طفلك ويرفعها. بالنسبة للمستخدمين الذين تقل أعمارهم عن 14 عامًا، نحفظ أيضًا عنوان البريد الإلكتروني لولي الأمر أو الوصي لأغراض الموافقة. لا نبيع البيانات الشخصية ولا نشاركها مع أطراف ثالثة."
    yourRights:
      title: "حقوقك كولي أمر أو وصي"
      text: "بموجب لوائح حماية الطفل في الاتحاد الأوروبي (GDPR) وقانون COPPA، يحق لك: مراجعة البيانات التي نحتفظ بها عن طفلك، وطلب نسخة من تلك البيانات، وسحب موافقتك في أي وقت (مما يقيّد الحساب)، وطلب الحذف النهائي لحساب طفلك وجميع البيانات المرتبطة به."
    minorRestrictions:
      title: "ما القيود التي تنطبق على حسابات القاصرين؟"
      text: "لا يمكن للمستخدمين الذين تقل أعمارهم عن 16 عامًا نشر التعليقات أو قراءتها، أو متابعة مستخدمين آخرين، أو مشاهدة المحتوى المصنّف بأنه غير مناسب للأطفال. لا يزال بإمكانهم إنشاء المشاريع ورفعها، وتصفّح المشاريع العامة، والتفاعل مع المشاريع بالإعجابات. هذه القيود موجودة لتوفير بيئة تعلّم آمنة."
