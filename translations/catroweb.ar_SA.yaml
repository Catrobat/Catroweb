    message: "أنشأ طفلك %username% حسابًا في Catrobat وأكّد عنوان بريده الإلكتروني."
    explanation: "Catrobat منصة تعليمية مجانية يتعلم فيها الشباب البرمجة من خلال إنشاء التطبيقات والألعاب والرسوم المتحركة. بموجب لوائح حماية الطفل في الاتحاد الأوروبي، نحتاج إلى موافقتك قبل أن يتمكن طفلك من المشاركة الكاملة في المجتمع. يرجى النقر على الزر أدناه لإعطاء الموافقة."
