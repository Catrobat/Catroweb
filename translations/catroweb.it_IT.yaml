    title: 'Informazioni per genitori e tutori'
    intro: 'Catrobat prende sul serio la sicurezza e la privacy dei giovani utenti. Questa pagina spiega come proteggiamo tuo figlio e quali diritti hai.'
    whatIsCatrobat:
      title: 'Che cos''è Catrobat?'
      text: 'Catrobat è una piattaforma educativa gratuita e senza scopo di lucro dove i giovani imparano a programmare creando le proprie app, giochi e animazioni. La piattaforma è disponibile in tutto il mondo e viene usata in ambito educativo.'
    dataCollected:
      title: 'Quali dati raccogliamo?'
      text: 'Raccogliamo i dati minimi necessari per il funzionamento della piattaforma: nome utente, indirizzo email, data di nascita e i progetti che tuo figlio crea e carica. Per gli utenti sotto i 14 anni conserviamo anche l''indirizzo email di un genitore o tutore ai fini del consenso. Non vendiamo né condividiamo dati personali con terze parti.'
    yourRights:
      title: 'I tuoi diritti come genitore o tutore'
      text: 'In base alle norme UE sulla tutela dei minori (GDPR) e alla COPPA, hai il diritto di: consultare i dati che conserviamo su tuo figlio, richiederne una copia, revocare il tuo consenso in qualsiasi momento (il che limita l''account) e richiedere la cancellazione definitiva dell''account di tuo figlio e di tutti i dati associati.'
    minorRestrictions:
      title: 'Quali restrizioni si applicano agli account dei minori?'
      text: 'Gli utenti sotto i 16 anni non possono pubblicare o leggere commenti, seguire altri utenti né vedere contenuti contrassegnati come non adatti ai bambini. Possono comunque creare e caricare progetti, sfogliare i progetti pubblici e reagire ai progetti con i "Mi piace". Queste restrizioni servono a offrire un ambiente di apprendimento sicuro.'
