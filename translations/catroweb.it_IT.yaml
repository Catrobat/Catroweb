newAccountConfirmation:
  subject: 'Verifica il tuo indirizzo email'
  welcome: 'Benvenuto su Catrobat!'
  greeting: 'Grazie per esserti registrato! Verifica il tuo indirizzo email per iniziare.'
  message: 'Clicca sul pulsante qui sotto per confermare la tua email. Questo link è valido fino a %time% e può essere usato una sola volta.'
  button: "CONFERMA E-MAIL"
  ignore: 'Se non hai creato un account Catrobat, puoi tranquillamente ignorare questa email.'
  autoDelete: 'Gli account non verificati vengono eliminati automaticamente dopo 30 giorni.'
consent:
  email:
    subject: 'È necessario il consenso dei genitori per l''account Catrobat di tuo figlio'
    title: 'Consenso dei genitori richiesto'
    greeting: 'Ciao,'
    message: 'Tuo figlio %username% ha creato un account su Catrobat e ha verificato il suo indirizzo email.'
    explanation: 'Catrobat è una piattaforma educativa gratuita dove i giovani imparano a programmare creando app, giochi e animazioni. In base alle norme UE sulla tutela dei minori, abbiamo bisogno del tuo consenso prima che tuo figlio possa partecipare pienamente alla community. Clicca sul pulsante qui sotto per dare il consenso.'
    button: 'Dai il consenso dei genitori'
    ignore: 'Se non ti aspettavi questa email, puoi tranquillamente ignorarla. Senza consenso, l''account avrà funzionalità limitate.'
    whatIsCatrobat: 'Catrobat è una piattaforma educativa di programmazione gratuita e senza scopo di lucro. Scopri di più su catrobat.org.'
    manageLink: 'Puoi gestire l''account di tuo figlio in qualsiasi momento tramite il nostro <a href="%portalUrl%" style="color: #00acc1;">Portale per i genitori</a>. Scopri di più sui <a href="%infoUrl%" style="color: #00acc1;">tuoi diritti come genitore</a>.'
  confirmed:
    title: 'Consenso concesso'
    message: 'Grazie! L''account di %username% è ora completamente attivato.'
    continueButton: 'Scopri i progetti'
parent:
  footer:
    link: 'Genitori e tutori'
  info:
    title: 'Informazioni per genitori e tutori'
    intro: 'Catrobat prende sul serio la sicurezza e la privacy dei giovani utenti. Questa pagina spiega come proteggiamo tuo figlio e quali diritti hai.'
    whatIsCatrobat:
      title: 'Che cos''è Catrobat?'
      text: 'Catrobat è una piattaforma educativa gratuita e senza scopo di lucro dove i giovani imparano a programmare creando le proprie app, giochi e animazioni. La piattaforma è disponibile in tutto il mondo e viene usata in ambito educativo.'
    dataCollected:
      title: 'Quali dati raccogliamo?'
      text: 'Raccogliamo i dati minimi necessari per il funzionamento della piattaforma: nome utente, indirizzo email, data di nascita e i progetti che tuo figlio crea e carica. Per gli utenti sotto i 14 anni conserviamo anche l''indirizzo email di un genitore o tutore ai fini del consenso. Non vendiamo né condividiamo dati personali con terze parti.'
    yourRights:
      title: 'I tuoi diritti come genitore o tutore'
      text: 'In base alle norme UE sulla tutela dei minori (GDPR) e alla COPPA, hai il diritto di: consultare i dati che conserviamo su tuo figlio, richiederne una copia, revocare il tuo consenso in qualsiasi momento (il che limita l''account) e richiedere la cancellazione definitiva dell''account di tuo figlio e di tutti i dati associati.'
    minorRestrictions:
      title: 'Quali restrizioni si applicano agli account dei minori?'
      text: 'Gli utenti sotto i 16 anni non possono pubblicare o leggere commenti, seguire altri utenti né vedere contenuti contrassegnati come non adatti ai bambini. Possono comunque creare e caricare progetti, sfogliare i progetti pubblici e reagire ai progetti con i "Mi piace". Queste restrizioni servono a offrire un ambiente di apprendimento sicuro.'
    manageButton: 'Gestisci l''account di tuo figlio'
  portal:
    title: 'Portale per i genitori'
    description: 'Inserisci il tuo indirizzo email per ricevere un link sicuro per gestire l''account Catrobat di tuo figlio. Il link verrà inviato all''indirizzo email che hai indicato durante la registrazione.'
    emailLabel: 'Il tuo indirizzo email'
    submitButton: 'Invia link di gestione'
    infoLink: 'Scopri di più'
    success:
      title: 'Controlla la tua casella di posta'
      message: 'Se a questa email è associato un account, ti abbiamo inviato un link di gestione. Controlla la tua casella di posta e segui il link per gestire l''account di tuo figlio.'
  manage:
    title: 'Gestisci gli account dei figli'
    description: 'Stai gestendo gli account associati a %email%.'
    consentStatus: 'Stato del consenso'
    accountCreated: 'Account creato'
    email: 'Email del figlio'
    status:
      granted: 'Concesso'
      pending: 'In attesa'
      revoked: 'Revocato'
    grantButton: 'Concedi il consenso'
    revokeButton: 'Revoca il consenso'
    revokeConfirm: 'Sei sicuro di voler revocare il consenso? L''account avrà funzionalità limitate.'
    exportButton: 'Esporta dati'
    deleteButton: 'Elimina account'
    deleteConfirm: 'Sei sicuro di voler eliminare definitivamente questo account? L''operazione non può essere annullata.'
  management:
    email:
      subject: 'Gestisci l''account Catrobat di tuo figlio'
      title: 'Gestione dell''account'
      greeting: 'Ciao,'
      message: 'Hai richiesto un link per gestire l''account Catrobat di tuo figlio (%usernames%). Clicca sul pulsante qui sotto per visualizzare e gestire l''account.'
      button: 'Gestisci account'
      ignore: 'Se non l''hai richiesto tu, puoi tranquillamente ignorare questa email.'
passwordRecovery:
  subject: Recupero della Password Catrobat
  message: |
    Gentile %username%.

    Hai richiesto di reimpostare la tua password su %appplication_url% perché dimenticata. Se non l'hai richiesto tu, ignora questo messaggio. La richiesta diventerà obsoleta in 24 ore.
    Se invece la vuoi reimpostare, vai alla seguente pagina: %confirmationUrl%

    Puoi usare il tuo nome utente e la password per accedere alla comunità %appplication_url%.
    Per farlo vai alla seguente pagina: %loginPage%
    Per modificare il tuo profilo vai alla pagina: %profilePage%

    Cordiali saluti,
    Il Team di Catrobat.
  messageHtml: |
    <p>
    Gentile %username%.<br>
    <br>
    Hai chiesto un reset della tua password su <a href="%appplication_url%">Pocket Code</a> perché l'hai dimenticata.
    Se non sei stato tu a richiederlo, ignora questo messaggio: diventerà obsoleto in 24 ore.<br>
    <br>
    Per reimpostare la tua password a crearne una nuova, fai clic <a href="%confirmationUrl%">qui.</a><br>
    <br>
    Puoi sempre utilizzare il tuo nome utente e la tua password per accedere alla community di <a href="%appplication_url%">Pocket Code</a>.<br>
    Puoi entrare nella tua <a href="%loginPage%">pagina di login</a><br>
    Per modificare i dettagli del tuo profilo va a <a href="%profilePage%">questa pagina</a>.<br>
    <br>
    Cordiali saluti,<br>
    Il Team di Catrobat.
    </p>
