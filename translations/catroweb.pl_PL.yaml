    <br>
    Aby zresetować hasło i stworzyć nowe, kliknij <a href="%confirmationUrl%">tutaj.</a><br>
    <br>
    W każdej chwili możesz użyć swojej nazwy użytkownika i hasła, aby uzyskać dostęp do społeczności <a href="%appplication_url%">Pocket Code</a>.<br>
    Aby to zrobić, odwiedź następującą stronę: <a href="%loginPage%">Strona logowania</a><br>
    Aby edytować swój profil, przejdź do tej <a href="%profilePage%">strony</a>.<br>
    <br>
    Pozdrawiamy,<br>
    Twój zespół Catrobat.
    </p>
