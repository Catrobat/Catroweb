consent:
  email:
    subject: "Potrzebna zgoda rodzica na konto Catrobat Twojego dziecka"
    title: "Wymagana zgoda rodzica"
    greeting: "Dzień dobry,"
    message: "Twoje dziecko %username% założyło konto w Catrobat i zweryfikowało swój adres e-mail."
    explanation: "Catrobat to darmowa platforma edukacyjna, na której młodzi ludzie uczą się programowania, tworząc aplikacje, gry i animacje. Zgodnie z unijnymi przepisami o ochronie dzieci potrzebujemy Twojej zgody, zanim Twoje dziecko będzie mogło w pełni uczestniczyć w społeczności. Kliknij przycisk poniżej, aby wyrazić zgodę."
    button: "Wyraź zgodę rodzica"
    ignore: "Jeśli nie spodziewałeś się tej wiadomości, możesz ją zignorować. Bez zgody konto będzie miało ograniczone funkcje."
    whatIsCatrobat: "Catrobat to darmowa, non-profit platforma edukacyjna do nauki programowania. Więcej informacji na catrobat.org."
    manageLink: 'W każdej chwili możesz zarządzać kontem swojego dziecka w naszym <a href="%portalUrl%" style="color: #00acc1;">Portalu dla rodziców</a>. Dowiedz się więcej o <a href="%infoUrl%" style="color: #00acc1;">swoich prawach jako rodzica</a>.'
  confirmed:
    title: "Zgoda udzielona"
    message: "Dziękujemy! Konto użytkownika %username% jest teraz w pełni aktywne."
    continueButton: "Odkrywaj projekty"
parent:
  footer:
    link: "Rodzice i opiekunowie"
  info:
    title: "Informacje dla rodziców i opiekunów"
    intro: "Catrobat poważnie traktuje bezpieczeństwo i prywatność młodych użytkowników. Na tej stronie wyjaśniamy, jak chronimy Twoje dziecko i jakie prawa Ci przysługują."
    whatIsCatrobat:
      title: "Czym jest Catrobat?"
      text: "Catrobat to darmowa platforma edukacyjna non-profit, na której młodzi ludzie uczą się programowania, tworząc własne aplikacje, gry i animacje. Platforma jest dostępna na całym świecie i wykorzystywana w edukacji."
    dataCollected:
      title: "Jakie dane zbieramy?"
      text: "Zbieramy tylko dane niezbędne do działania platformy: nazwę użytkownika, adres e-mail, datę urodzenia oraz projekty, które Twoje dziecko tworzy i przesyła. W przypadku użytkowników poniżej 14 lat przechowujemy również adres e-mail rodzica/opiekuna w celu uzyskania zgody. Nie sprzedajemy danych osobowych ani nie udostępniamy ich osobom trzecim."
    yourRights:
      title: "Twoje prawa jako rodzica lub opiekuna"
      text: "Zgodnie z unijnymi przepisami o ochronie dzieci (RODO) oraz COPPA masz prawo: wglądu w dane, które przechowujemy o Twoim dziecku, otrzymania kopii tych danych, wycofania zgody w dowolnym momencie (co ogranicza konto) oraz żądania trwałego usunięcia konta Twojego dziecka i wszystkich powiązanych danych."
    minorRestrictions:
      title: "Jakie ograniczenia dotyczą kont osób niepełnoletnich?"
      text: "Użytkownicy poniżej 16 lat nie mogą pisać ani czytać komentarzy, obserwować innych użytkowników ani oglądać treści oznaczonych jako nieodpowiednie dla dzieci. Nadal mogą tworzyć i przesyłać projekty, przeglądać publiczne projekty i reagować na projekty polubieniami. Te ograniczenia mają zapewnić bezpieczne środowisko nauki."
    manageButton: "Zarządzaj kontem dziecka"
  portal:
    title: "Portal dla rodziców"
    description: "Podaj swój adres e-mail, aby otrzymać bezpieczny link do zarządzania kontem Catrobat Twojego dziecka. Link zostanie wysłany na adres e-mail podany podczas rejestracji."
