  verifyAccountMailFailed: 'તું દિવસમાં ફક્ત એક જ ઇમેઇલ માંગી શકે છે'
licenseToPlay:
  link: 'રમવા માટે નું લાયસન્સ'
  title: 'રમવા માટેનું લાયસન્સ - ક્રેડિટ આપ અને શેર કર'
  text1: 'કલ્પના કર કે દરેક Catrobat પ્રોજેક્ટ એક કેક છે, એક ખૂબ જ ખાસ કેક જે તેની રેસીપી (પ્રોગ્રામિંગ બ્લૉક્સ) સાથે આવે છે. Catrobat કમ્યુનિટીના બધા સભ્યો તેમની કેક તેમની રેસીપી સાથે શેર કરે છે. એટલે કે તું કેકનો આનંદ માણી શકે છે અને તેને જાતે બનાવતા પણ શીખી શકે છે!'
  text2: 'કોઈ ગુપ્ત રેસીપી નથી: આ કેક બનાવવાની સૂચનાઓ દરેક માટે ખુલ્લી છે, જેથી કોઈ પણ તેનો ઉપયોગ, ફરી ઉપયોગ, ફેરફાર કરી શકે અને નવા વિચારો માટે પ્રેરણા મેળવી શકે... મતલબ કે નવી કેક માટે.'
  text3: 'તું કેક ખાઈ પણ શકે છે અને બીજા લોકોની રેસીપી કૉપિ કરીને તારી પોતાની બનાવી પણ શકે છે, કદાચ અલગ સામગ્રી સાથે. આ સ્વતંત્રતા સાથે બે સરળ શરતો આવે છે:'
  text4: 'Catrobat કમ્યુનિટી બનાવતી વખતે અમે આ અભિગમ અપનાવવાનું નક્કી કર્યું કારણ કે અમે માનીએ છીએ કે તે કમ્યુનિટીમાં શીખવા અને સર્જનાત્મકતાને ટેકો આપે છે. રેસીપી અને સામગ્રી (સ્ક્રિપ્ટ્સ અને ચિત્રો) શેર કરીને લોકો એકબીજાના વિચારો પર આગળ વધી શકે છે અને બધાને ફાયદો થાય છે.'
  text5: 'Catrobat વેબસાઇટ બનાવતી વખતે, અમે એવી સુવિધાઓ ઉમેરી જે લોકોને શેર કરવા અને બીજાને ક્રેડિટ આપવા પ્રોત્સાહિત કરે. દરેક પ્રોજેક્ટ પેજ પર તું હંમેશા પ્રોજેક્ટની મૂળ સ્ક્રિપ્ટ્સ ડાઉનલોડ કરી શકે છે. જો તું કોઈ પ્રોજેક્ટ રીમિક્સ કરે (સ્ક્રિપ્ટ્સ કે ચિત્રોમાં ફેરફાર કરીને પરિણામ શેર કરે), તો અમે તને પ્રોજેક્ટની નોંધોમાં ક્રેડિટ આપવા પ્રોત્સાહિત કરીએ છીએ, જેમાં તને પ્રેરણા આપનાર લોકો અને પ્રોજેક્ટનો ઉલ્લેખ હોય.'
  text6: 'Catrobat ઑનલાઇન કમ્યુનિટીની ઉપયોગની શરતો વિશે %link-termsOfUse% પર વધુ જાણ.'
  list1:
    item1: 'તારી કેક તેની રેસીપી સાથે શેર કર'
    item2: 'તને પ્રેરણા આપનારાઓને ક્રેડિટ આપ'
  version: 'વર્ઝન 1.1, 2 એપ્રિલ 2013'
termsOfUse:
  title: 'ઉપયોગની શરતો'
  headline: 'Catrobat કમ્યુનિટીમાં તારું સ્વાગત છે!'
  text1: 'Catrobat કમ્યુનિટીના ભાગ રૂપે, તું આવા લોકો સાથે પ્રોજેક્ટ્સ અને વિચારો શેર કરે છે:'
  text2: 'આ કમ્યુનિટીને દરેક સભ્ય માટે સહાયક જગ્યા બનાવવા અમને તારી મદદની જરૂર છે. તું આ રીતે મદદ કરી શકે છે:'
  text3: 'Catrobat પ્રોજેક્ટ દ્વારા અમે સહકારને પ્રોત્સાહન આપવા અને દરેકની સર્જનાત્મકતાને સમગ્ર માનવતાના લાભ માટે જોડવા માંગીએ છીએ. તું પણ તારા પ્રોજેક્ટ્સ કમ્યુનિટીને ભેટ તરીકે પાછા આપીને Catrobat કમ્યુનિટીનો સક્રિય સભ્ય બની શકે છે, જે રીતે બીજા સક્રિય સભ્યો તેમના પ્રોજેક્ટ્સ તને આપે છે:'
  text4: 'તારા માટે અમારી ભેટ:'
  text5: 'અમારી ઉપયોગ અને સેવાની શરતો:'
  list1:
    item1: 'ઘણા જુદા જુદા દેશો અને સંસ્કૃતિઓના'
    item2: 'દરેક ઉંમરના (નાના બાળકોથી લઈને કિશોરો અને દાદા-દાદી સુધી)'
    item3: 'દરેક સ્તરના અનુભવવાળા'
  list2:
    item1: 'આદર રાખ. પ્રોજેક્ટ્સ શેર કરતી વખતે, કૃપા કરીને યાદ રાખ કે જુદી જુદી ઉંમર અને પૃષ્ઠભૂમિના લોકો તારું યોગદાન જોશે.'
    item2: 'ક્રેડિટ આપ. બીજા લોકોના પ્રોજેક્ટ્સના ફેરફાર કરેલા વર્ઝન બનાવવા માટે તું સ્વતંત્ર છે - બસ તેમને ક્રેડિટ આપવાનું ધ્યાન રાખ. ક્રેડિટ આપવાની એક જગ્યા તારા પ્રોજેક્ટનો નોંધો અને ક્રેડિટ્સ વિભાગ છે. બીજા યુઝર્સના પ્રોજેક્ટ્સમાં ફેરફાર કરવા વિશેની વિગતો માટે કૃપા કરીને આ યાદી નીચેનો ફકરો જો.'
    item3: 'પ્રામાણિક રહે. તું જે છે તેના સિવાય બીજું કોઈ હોવાનો ઢોંગ ન કર અને કમ્યુનિટીને છેતરવાનો પ્રયત્ન ન કર.'
    item4: 'વ્યક્તિગત માહિતી ખાનગી રાખ. તારું ઇમેઇલ ઍડ્રેસ, ફોન નંબર કે બીજી વ્યક્તિગત સંપર્ક માહિતી શેર ન કર.'
    item5: 'સાઇટને મૈત્રીપૂર્ણ રાખવામાં મદદ કર. જો તને લાગે કે બીજાને કોઈ પ્રોજેક્ટ કે ટિપ્પણી ખરાબ, અપમાનજનક, ખૂબ હિંસક કે બીજી રીતે અયોગ્ય લાગશે, તો બસ ''અયોગ્ય તરીકે રિપોર્ટ કર'' બટન પર ક્લિક કર અને ટૂંકી સમજૂતી લખ. Catrobat ટીમ તારો રિપોર્ટ તપાસશે અને કોઈ પણ પ્રોજેક્ટ, ટિપ્પણી કે પોસ્ટ દૂર કરી શકે છે.'
  list3:
    item1: 'અમારી વેબસાઇટ્સ પર પ્રોજેક્ટ અપલોડ કરીને, તું આ કાર્યને અપલોડ કરેલા Catrobat પ્રોજેક્ટ્સના અમુક મુક્ત લાયસન્સ હેઠળ મૂકવા સ્વીકારે છે અને સંમત થાય છે. જે મુક્ત લાયસન્સ હેઠળ Catrobat સિસ્ટમ પોતે તને ઉપલબ્ધ છે તેની જેમ જ, અપલોડ કરેલા Catrobat પ્રોજેક્ટ્સના આ મુક્ત લાયસન્સ દરેકને બીજાએ અગાઉ અપલોડ કરેલા કાર્યમાંથી શીખવાનો અને તે કાર્યને બદલીને તથા રીમિક્સ કરીને પોતાની નવી રસપ્રદ ગેમ્સ, એનિમેશન અને બીજા પ્રોજેક્ટ્સ બનાવવાનો અધિકાર આપે છે. આનાથી દરેક જણ ''પોતાના સાથીઓના ખભા પર ઊભા રહી'' શકે છે, અને તેમાંનો એક તું પણ છે! આમ તારું કાર્ય આખી દુનિયાને લાભ આપશે અને દરેકના ઉપયોગ માટે મુક્ત રહેશે, થોડુંક એવું જ જેમ દુનિયાભરના સ્વયંસેવકો Wikipedia ને મુક્તપણે લખાણ અને ચિત્રો આપે છે. તેને માનવતા માટેની તારી ભેટ તરીકે વિચાર: તું દરેકને આપે છે, અને અમારી વેબસાઇટ્સ પર પોતાનું કાર્ય અપલોડ કરનારા બીજા બધા તને આપે છે. આમ અપલોડ કરેલો પ્રોજેક્ટ ખૂબ મૂલ્યવાન ભેટ છે જે તેનો માલિક તને મફતમાં આપે છે, એ શરતે કે તું પણ કમ્યુનિટીમાં સમાન શરતો પર ભાગ લે.'
    item2: 'તારે ભેટ સ્વીકારવી ફરજિયાત નથી; જો તું સ્વીકારે, તો અમુક નિયમો લાગુ પડે છે. આ નિયમોનો ફાયદો એ છે કે તું કાર્યમાંથી શીખી શકે છે અને તેના પર આગળ વધીને જાતે વધુ શાનદાર વસ્તુઓ બનાવી શકે છે, જેને તું પછી, ઉદાહરણ તરીકે, ફરીથી તારી પોતાની તરીકે અમારી વેબસાઇટ્સ પર અપલોડ કરી શકે છે. બીજો ફાયદો એ છે કે આ લાયસન્સ ખાતરી કરે છે કે બીજા લોકો તારા પ્રોજેક્ટનો ઉપયોગ કરે ત્યારે તેમને થતી કોઈ પણ સમસ્યા માટે તને જવાબદાર ઠેરવી શકાય નહીં.'
    item3: 'એક મહત્વની વધારાની શરત એ છે કે જે લેખકોના કાર્ય પર તેં તારું કાર્ય આધારિત કર્યું છે તેમને તું સ્પષ્ટ રીતે શ્રેય આપે. સાથે જ, અમે પૂરો પ્રયત્ન કરીશું કે બીજા લોકો સ્પષ્ટ રીતે ઓળખે કે તારું કાર્ય તેં આપ્યું છે, Catrobat કમ્યુનિટીમાં તારી ઓળખ માટે તેં જાતે પસંદ કરેલા અનોખા નામ દ્વારા શ્રેય આપીને, અને તારું કાર્ય દરેકને અને ખાસ કરીને તેમને આપવા બદલ બીજાને જાહેરમાં તારો આભાર વ્યક્ત કરવાની તક આપીને.'
    item4: 'ચોક્કસ કાનૂની નિયમો અને શરતો માટે કૃપા કરીને %link-licenseUploaded% જો.'
  list4:
    item1: 'અમે Catrobat સિસ્ટમ સંબંધિત અમારા બધા પોતાના સૉફ્ટવેર અને ઇન્ટરનેટ સંસાધનો, ઉદાહરણ તરીકે Catrobat ટીમે લખેલું સૉફ્ટવેર, અમારી વેબસાઇટ્સ અને ઇન્ટરનેટ સંસાધનો, Catrobat સિસ્ટમ સંબંધિત અમારો પોતાનો સોર્સ કોડ, અને બધી વધારાની સામગ્રી જેમ કે ચિત્રો, અવાજો અને લખાણો, હાલમાં અને ભવિષ્યમાં તને Catrobat ના મુક્ત લાયસન્સ હેઠળ આપીએ છીએ.'
    item2: 'આ લાયસન્સ Catrobat ના બધા ભાગોને તારા માટે મફત પણ બનાવે છે અને મુક્ત પણ, એટલે કે તું તેનો ઉપયોગ તને ગમે તે રીતે કરી શકે છે, ફક્ત થોડા પ્રતિબંધો સાથે જે બીજી બાબતો ઉપરાંત એ ખાતરી કરે છે કે Catrobat સિસ્ટમ હંમેશા દરેક માટે મુક્ત અને ઉપયોગી રહે.'
    item3: 'ચોક્કસ કાનૂની નિયમો અને શરતો માટે કૃપા કરીને %link-licenseToPlay% જો. Catrobat સિસ્ટમનો સોર્સ કોડ તેમજ બીજા ઘણા દસ્તાવેજો અને સંસાધનો %link-developer% દ્વારા ઉપલબ્ધ છે.'
  list5:
    item1: 'જો તું, અથવા જો તારી ઉંમર 13 વર્ષથી ઓછી હોય તો તારાં માતા-પિતા કે કાનૂની વાલીઓ, એવી કોઈ સંસ્થા સાથે જોડાયેલા હોય જે મોટા પાયે ગોપનીયતા ભંગ અને/અથવા સામૂહિક દેખરેખમાં સામેલ કે જવાબદાર હોય, તો તને અમારી સૉફ્ટવેર ઍપ્લિકેશન્સ વાપરવાની અને અમારી સેવાઓ ઍક્સેસ કરવાની પરવાનગી નથી. આ પ્રતિબંધની ચોક્કસ વિગતો અને તેના અમુક અપવાદો અમારી %link-termsOfUse% ના વિભાગ 4.a અને 4.b માં આપેલા છે.'
    item2: 'જો તારી ઉંમર 13 વર્ષથી ઓછી હોય, તો તારે તારાં માતા-પિતા કે કાનૂની વાલીઓને પૂછવું પડશે કે શું તેઓ તને Catrobat ની સૉફ્ટવેર ઍપ્લિકેશન્સ અને સેવાઓ વાપરવાની પરવાનગી આપે છે.'
    item3: 'અમે કોઈ પણ સમયે અમારા સંપૂર્ણ વિવેકબુદ્ધિથી Catrobat ની વેબસાઇટ્સ પર અપલોડ કરેલા પ્રોજેક્ટ્સ, યુઝર એકાઉન્ટ્સ અને કોઈ પણ ડિજિટલ સામગ્રીને નકારવાનો, ડિલીટ કરવાનો કે છુપાવવાનો અધિકાર અનામત રાખીએ છીએ, ઉદાહરણ તરીકે જો અમને જણાય કે કોઈ પ્રોજેક્ટમાં અયોગ્ય સામગ્રી છે અથવા કોઈ યુઝર બીજા લોકોના અધિકારોનું ઉલ્લંઘન કરે છે.'
    item4: 'Catrobat ના બધા સૉફ્ટવેર અને ઇન્ટરનેટ સંસાધનો ઉપયોગી થશે એવી આશાએ આપવામાં આવે છે, પરંતુ કોઈ પણ વૉરંટી વિના.'
    item5: 'ઉપરના મુદ્દાઓની ચોક્કસ રજૂઆત અને અમુક વધારાના કાનૂની નિયમો અને શરતો માટે કૃપા કરીને અમારી %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service જો.'
  bottom1: 'સમયાંતરે અહીં ફરી તપાસ કરજે, કારણ કે અમે હંમેશા અમારી ઉપયોગની શરતો સુધારવાનો પ્રયત્ન કરીએ છીએ.'
  bottom2: 'આ ઉપયોગની શરતો વિશેના કોઈ પણ સૂચનો કૃપા કરીને %email-webmaster% પર મેઇલ કર.'
