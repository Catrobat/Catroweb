footer:
  title: '%user_count% થી વધુ સર્જનાત્મક લોકો સાથે જોડા!'
  text: '%project_count% અદ્ભુત પ્રોજેક્ટ્સ પહેલેથી શેર થયા છે, હવે પછીનો તારો હોઈ શકે છે. અમારી ઍપ ડાઉનલોડ કર અને આજે જ બનાવવાનું શરૂ કર'
privacy-policy:
  header: 'ગોપનીયતા નીતિ'
  version: 'વર્ઝન 2.2, 17 ઑક્ટોબર 2019'
  text1: 'તને અમારી સેવાઓ અને તેની સાથે જોડાયેલા એકાઉન્ટના બધા લાભો આપવા માટે, તારી પાસેથી અમુક ડેટા એકત્ર કરવો જરૂરી છે.'
  text2: 'અમારી સેવાઓ (ઍપ્સ અને વેબસાઇટ્સ) જાળવવા અને સુધારવા માટે, તેમજ ICT અને STEM/STEAM શિક્ષણ પર વૈજ્ઞાનિક સંશોધન કરવા માટે, અમે Google LLC (USA) ના Google Analytics, Crashlytics અને Firebase, તેમજ Dynatrace LLC (USA) ના Dynatrace નો ઉપયોગ કરીએ છીએ, જેથી અમારી સેવાઓના ઉપયોગ વિશે મેટાડેટા મળે, ઉદાહરણ તરીકે ક્રેશની માહિતી, સમય, જોયેલાં પેજ/સ્ક્રીન, અમારી ઍપ્સ અને સેવાઓનો ઉપયોગ, વપરાયેલી ઑપરેટિંગ સિસ્ટમ અને નેટવર્ક પ્રદાતા વિશેની માહિતી. આ વિશ્લેષણ અને એકત્ર કરેલો ડેટા તારી પ્રોફાઇલ સાથે જોડાયેલો નથી અને તેમાં કોઈ વ્યક્તિગત માહિતી નથી (IP ઍડ્રેસના છેલ્લા ભાગને અનામી બનાવવામાં આવે છે). જોકે, એકત્ર કરેલો ડેટા સેવા પ્રદાતાઓ (Google LLC, USA અને Dynatrace LLC, USA) ને મોકલવામાં આવશે. ડેટા પ્રોસેસિંગ Google LLC અને Dynatrace LLC સાથેના કરારો પર આધારિત છે. સેવા પ્રદાતાઓ સાથેનો આ સંબંધ યુરોપિયન યુનિયનના જનરલ ડેટા પ્રોટેક્શન રેગ્યુલેશન (EU GDPR) અને EU-USA "Privacy Shield" કરારને અનુરૂપ છે.'
  text3: 'અમારી સિસ્ટમમાં એકાઉન્ટ બનાવવા અને વાપરવા, અને તારા એકાઉન્ટ વિશેના જરૂરી ફેરફારો, જેમ કે અપડેટ્સ અથવા અમારી ઉપયોગ અને સેવાની શરતો, કમ્યુનિટીના નિયમો કે નીતિઓના ઉલ્લંઘન વિશે તને ઇમેઇલ દ્વારા જાણ કરવા માટે, અમે તારું યુઝરનેમ અને, જો તેં આપ્યું હોય તો, તારું ઇમેઇલ ઍડ્રેસ સાચવીશું. જો તેં તારું એકાઉન્ટ Google Plus કે Facebook દ્વારા જોડ્યું હોય, તો અમે આ સેવાઓ પરના તારા એકાઉન્ટ સાથે જોડાયેલી ઓળખ કી પણ સાચવીએ છીએ. જ્યાં સુધી તેં અમને સ્પષ્ટ રીતે પરવાનગી ન આપી હોય, ત્યાં સુધી અમે આ ડેટાનો ઉપયોગ બીજા કોઈ (જેમ કે માર્કેટિંગ) હેતુ માટે કરીશું નહીં.'
  text4: 'સ્વૈચ્છિક રીતે, તું શેરિંગ સાઇટ પરના તારા એકાઉન્ટ પેજ દ્વારા અમને તારો રહેઠાણનો દેશ જણાવી શકે છે. તે તારી જાહેર પ્રોફાઇલ પર દેખાશે અને અમે તેનો ઉપયોગ ફક્ત આંકડાકીય અને સંશોધનના હેતુ માટે કરીશું. તેને તારી પ્રોફાઇલ સેટિંગ્સમાં કોઈ પણ સમયે દૂર કરી શકાય છે.'
  text5: 'તું https://share.catrob.at/ પર તારા પ્રોફાઇલ પેજ દ્વારા તારું એકાઉન્ટ ડિલીટ કરીને કોઈ પણ સમયે તારા એકાઉન્ટના વ્યક્તિગત ડેટાનો ઉપયોગ પાછો ખેંચી શકે છે. એકાઉન્ટ ડિલીટ કર્યા પછી પણ તું આપેલી સેવાઓનો ઉપયોગ કરી શકીશ, પરંતુ સહયોગ નહીં કરી શકીશ, જેમ કે પ્રોગ્રામ્સ અપલોડ કરવા, ટિપ્પણી કરવી કે લાઇક કરવું. ઉપરાંત, તારા એકાઉન્ટ સાથે જોડાયેલી બધી સામગ્રી, જેમ કે અપલોડ કરેલા પ્રોગ્રામ્સ, ટિપ્પણીઓ વગેરે, ડિલીટ થઈ જશે.'
  text6: 'અમારી સેવાઓનો દુરુપયોગ અટકાવવા માટે, ઉદાહરણ તરીકે ગેરકાયદેસર હેતુઓ માટે યુઝર્સના અપલોડ કે ટિપ્પણીઓ દ્વારા, યુઝર્સે બનાવેલો બધો જાહેર ડેટા (અપલોડ્સ, ટિપ્પણીઓ) સમય અને વપરાયેલા ઇન્ટરનેટ ઍડ્રેસ સાથે આંતરિક ડેટાબેઝમાં સાચવવામાં આવશે. જ્યાં સુધી પૂરતી ગેરકાયદેસર ક્રિયાઓની વાજબી શંકા ન હોય અને અધિકૃત કાનૂની સંસ્થાઓ લાગુ કાયદાના આધારે તેની માંગ ન કરે, ત્યાં સુધી આ ડેટાનો ઉપયોગ કોઈ સંસ્થા દ્વારા કરવામાં આવશે નહીં કે તેને મોકલવામાં આવશે નહીં. દરેક કેસની પહેલાં અમારા દ્વારા વ્યક્તિગત રીતે સંપૂર્ણ તપાસ કરવામાં આવશે.'
  text7: 'તું MailChimp સેવા (The Rocket Science Group LLC d/b/a MailChimp, USA) દ્વારા અમે https://catrob.at/newsletter પર આપતા Catrobat ન્યૂઝલેટરને સ્વૈચ્છિક રીતે સબ્સ્ક્રાઇબ કરી શકે છે. પછી તને તેં આપેલા ઇમેઇલ ઍડ્રેસ પર Catrobat પ્રોજેક્ટ અને તેની સેવાઓ વિશેના અપડેટ્સ મળશે. દરેક ન્યૂઝલેટરના ફૂટરમાં આપેલી "unsubscribe" લિંક દ્વારા તું કોઈ પણ સમયે ન્યૂઝલેટર બંધ કરી શકે છે. આ ન્યૂઝલેટર MailChimp દ્વારા આપવામાં આવે છે, જેની સાથે અમારો ડેટા-પ્રોસેસિંગ કરાર છે અને જેણે EU જનરલ ડેટા પ્રોટેક્શન રેગ્યુલેશન અને EU-USA "Privacy Shield" નું પાલન કરવાની પ્રતિબદ્ધતા લીધી છે. MailChimp વિશે વધુ વિગતો માટે કૃપા કરીને MailChimp ની ગોપનીયતા નીતિ અને ઉપયોગની શરતો પણ જો.'
  text8: 'બધી સેવાઓ મફત ઓપન સોર્સ Catrobat પ્રોજેક્ટ દ્વારા International Catrobat Association – Verein zur Förderung freier Software ના નેજા હેઠળ આપવામાં આવે છે, જે ગ્રાઝ, ઑસ્ટ્રિયા (યુરોપિયન યુનિયન) માં નોંધાયેલી બિન-નફાકારક NGO છે. અમારી નીતિઓ EU અને ઑસ્ટ્રિયાના ડેટા સુરક્ષા કાયદા (GDPR) નું સન્માન કરે છે. અમારો સંપર્ક કરવા માટે, કૃપા કરીને contact@catrobat.org પર ઇમેઇલ મોકલ અથવા અમને આ સરનામે પત્ર મોકલ: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'જો તારી ઉંમર 14 વર્ષથી ઓછી હોય, તો આ નીતિ કાનૂની વાલી (સામાન્ય રીતે માતા-પિતા) દ્વારા સ્વીકારવી જરૂરી છે.'
  text10: 'Catrobat ની સત્તાવાર અંગ્રેજી ભાષાની ગોપનીયતા નીતિ વેબ પર %privacy_policy% હેઠળ ઉપલબ્ધ છે.'
  disagree-text: 'મંજૂરી વિના અમે એકાઉન્ટ બનાવી શકતા નથી, પરંતુ મુખ્ય સુવિધાઓ હજી પણ ઉપલબ્ધ છે.'
