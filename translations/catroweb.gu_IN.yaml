passwordRecovery:
  subject: 'તારો Catrobat પાસવર્ડ રિકવરી'
  message: |
    પ્રિય %username%,
    તેં %appplication_url% પર તારો પાસવર્ડ રીસેટ કરવાની વિનંતી કરી છે કારણ કે તારો પાસવર્ડ યાદ નથી.
    જો તેં આ વિનંતી કરી નથી, તો કૃપા કરીને તેને અવગણ. તે 24 કલાકમાં સમાપ્ત થઈ જશે અને નકામી બની જશે.
    તારો પાસવર્ડ રીસેટ કરીને નવો બનાવવા માટે, કૃપા કરીને આ પેજની મુલાકાત લે: %confirmationUrl%
    %appplication_url% કમ્યુનિટીમાં પ્રવેશવા માટે તું કોઈપણ સમયે તારા યુઝરનેમ અને પાસવર્ડનો ઉપયોગ કરી શકે છે.
    તે માટે, ફક્ત આ પેજની મુલાકાત લે: %loginPage%
    તારી પ્રોફાઇલની વિગતોમાં ફેરફાર કરવા, આ પેજ પર જા: %profilePage%
    શુભેચ્છાઓ,
    તારી Catrobat ટીમ.
  messageHtml: |
    <p>
    પ્રિય %username%,<br>
    <br>
    તેં <a href="%appplication_url%">Pocket Code</a> પર તારો પાસવર્ડ રીસેટ કરવાની વિનંતી કરી છે કારણ કે તારો પાસવર્ડ યાદ નથી.
    જો તેં આ વિનંતી કરી નથી, તો કૃપા કરીને તેને અવગણ. તે 24 કલાકમાં સમાપ્ત થઈ જશે અને નકામી બની જશે.<br>
    <br>
    તારો પાસવર્ડ રીસેટ કરીને નવો બનાવવા માટે, કૃપા કરીને <a href="%confirmationUrl%">અહીં ક્લિક કર.</a><br>
    <br>
    <a href="%appplication_url%">Pocket Code</a> કમ્યુનિટીમાં પ્રવેશવા માટે તું કોઈપણ સમયે તારા યુઝરનેમ અને પાસવર્ડનો ઉપયોગ કરી શકે છે.<br>
    તે માટે, ફક્ત આ પેજની મુલાકાત લે: <a href="%loginPage%">લૉગ ઇન પેજ</a><br>
    તારી પ્રોફાઇલની વિગતોમાં ફેરફાર કરવા, આ <a href="%profilePage%">પેજ</a> પર જા.<br>
    <br>
    શુભેચ્છાઓ,<br>
    તારી Catrobat ટીમ.
    </p>
