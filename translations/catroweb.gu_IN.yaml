  unspecifiedError: 'તારી પ્રોફાઇલ બદલતી વખતે કંઈક કામ ન કર્યું. કૃપા કરીને ફરી પ્રયત્ન કર અથવા જો આવું વારંવાર થાય તો અમને જણાવ!'
  verifyAccountText: 'તારું એકાઉન્ટ ચકાસવા માટે અમે તને લિંક સાથે એક ઇમેઇલ મોકલીશું. આગામી એક કલાકમાં લિંક પર ક્લિક કરવાની ખાતરી કર; તું દિવસમાં ફક્ત એક જ ઇમેઇલ માંગી શકે છે.'
