parent:
  footer:
    link: 'માતા-પિતા અને વાલીઓ'
  info:
    title: 'માતા-પિતા અને વાલીઓ માટે માહિતી'
    intro: 'Catrobat યુવા યુઝર્સની સુરક્ષા અને ગોપનીયતાને ગંભીરતાથી લે છે. આ પેજ સમજાવે છે કે અમે તારા બાળકનું રક્ષણ કેવી રીતે કરીએ છીએ અને તારા કયા અધિકારો છે.'
    whatIsCatrobat:
      title: 'Catrobat શું છે?'
      text: 'Catrobat એક મફત, બિન-નફાકારક શૈક્ષણિક પ્લેટફોર્મ છે જ્યાં યુવાનો પોતાની ઍપ્સ, ગેમ્સ અને એનિમેશન બનાવીને પ્રોગ્રામિંગ શીખે છે. આ પ્લેટફોર્મ વિશ્વભરમાં ઉપલબ્ધ છે અને શૈક્ષણિક સંસ્થાઓમાં વપરાય છે.'
    dataCollected:
      title: 'અમે કયો ડેટા એકત્ર કરીએ છીએ?'
      text: 'પ્લેટફોર્મ ચલાવવા માટે જરૂરી ઓછામાં ઓછો ડેટા અમે એકત્ર કરીએ છીએ: યુઝરનેમ, ઇમેઇલ ઍડ્રેસ, જન્મ તારીખ, અને તારું બાળક બનાવે અને અપલોડ કરે તે પ્રોજેક્ટ્સ. 14 વર્ષથી નાના યુઝર્સ માટે, સંમતિના હેતુથી અમે માતા-પિતા/વાલીનું ઇમેઇલ ઍડ્રેસ પણ સાચવીએ છીએ. અમે વ્યક્તિગત ડેટા ત્રીજા પક્ષોને વેચતા કે શેર કરતા નથી.'
    yourRights:
      title: 'માતા-પિતા અથવા વાલી તરીકે તારા અધિકારો'
      text: 'EU ના બાળ સુરક્ષા નિયમો (GDPR) અને COPPA હેઠળ, તને આ અધિકારો છે: અમારી પાસે તારા બાળક વિશે જે ડેટા છે તે જોવાનો, તે ડેટાની નકલ માંગવાનો, કોઈપણ સમયે તારી સંમતિ પાછી ખેંચવાનો (જેનાથી એકાઉન્ટ મર્યાદિત થાય છે), અને તારા બાળકનું એકાઉન્ટ તથા તેની સાથે જોડાયેલો બધો ડેટા કાયમ માટે ડિલીટ કરાવવાનો.'
    minorRestrictions:
      title: 'સગીરોના એકાઉન્ટ્સ પર કયા પ્રતિબંધો લાગુ પડે છે?'
      text: '16 વર્ષથી નાના યુઝર્સ ટિપ્પણીઓ લખી કે વાંચી શકતા નથી, બીજા યુઝર્સને ફોલો કરી શકતા નથી, અને બાળકો માટે યોગ્ય નથી તરીકે ચિહ્નિત સામગ્રી જોઈ શકતા નથી. તેઓ હજી પણ પ્રોજેક્ટ્સ બનાવી અને અપલોડ કરી શકે છે, જાહેર પ્રોજેક્ટ્સ જોઈ શકે છે, અને લાઇક્સ દ્વારા પ્રોજેક્ટ્સ પર પ્રતિક્રિયા આપી શકે છે. આ પ્રતિબંધો શીખવા માટે સુરક્ષિત વાતાવરણ પૂરું પાડવા માટે છે.'
    manageButton: 'તારા બાળકનું એકાઉન્ટ સંભાળ'
