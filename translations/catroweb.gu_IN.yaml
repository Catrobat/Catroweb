    title: 'માતા-પિતાની સંમતિ જરૂરી'
    greeting: 'નમસ્તે,'
    message: 'તારા બાળક %username% એ Catrobat પર એકાઉન્ટ બનાવ્યું છે અને પોતાનું ઇમેઇલ ઍડ્રેસ ચકાસ્યું છે.'
    explanation: 'Catrobat એક મફત શૈક્ષણિક પ્લેટફોર્મ છે જ્યાં યુવાનો ઍપ્સ, ગેમ્સ અને એનિમેશન બનાવીને કોડિંગ શીખે છે. EU ના બાળ સુરક્ષા નિયમો હેઠળ, તારું બાળક કમ્યુનિટીમાં પૂરેપૂરું ભાગ લઈ શકે તે પહેલાં અમને તારી સંમતિની જરૂર છે. સંમતિ આપવા કૃપા કરીને નીચેના બટન પર ક્લિક કર.'
    button: 'માતા-પિતાની સંમતિ આપ'
    ignore: 'જો તને આ ઇમેઇલની અપેક્ષા ન હતી, તો તું તેને નિશ્ચિંત થઈને અવગણી શકે છે. સંમતિ વિના એકાઉન્ટની સુવિધાઓ મર્યાદિત રહેશે.'
    whatIsCatrobat: 'Catrobat એક મફત, બિન-નફાકારક શૈક્ષણિક પ્રોગ્રામિંગ પ્લેટફોર્મ છે. catrobat.org પર વધુ જાણ.'
    manageLink: 'તું અમારા <a href="%portalUrl%" style="color: #00acc1;">પેરેન્ટ પોર્ટલ</a> દ્વારા કોઈપણ સમયે તારા બાળકનું એકાઉન્ટ સંભાળી શકે છે. <a href="%infoUrl%" style="color: #00acc1;">માતા-પિતા તરીકે તારા અધિકારો</a> વિશે વધુ જાણ.'
