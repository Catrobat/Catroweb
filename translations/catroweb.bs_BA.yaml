privacy-policy:
  header: Pravila o privatnosti
  version: Verzija 2.2, 17. oktobar 2019.
  text1: Da bismo ti ponudili sve prednosti naših usluga i povezanog računa, potrebno je prikupiti određene podatke od tebe.
  text2: Za održavanje i poboljšanje naših usluga (aplikacija i web stranica) i za naučna istraživanja o IKT i STEM/STEAM obrazovanju koristimo Google Analytics, Crashlytics i Firebase, sve od kompanije Google LLC (SAD), kao i Dynatrace od kompanije Dynatrace LLC (SAD), kako bismo dobili metapodatke o korištenju naših usluga, npr. informacije o rušenjima, vremenske oznake, posjećene stranice/ekrane, korištenje naših aplikacija i usluga, korišteni operativni sistem i informacije o mrežnom provajderu. Ova analiza i prikupljeni podaci nisu povezani s tvojim profilom i ne sadrže lične podatke (posljednji dijelovi IP adrese se anonimiziraju). Međutim, prikupljeni podaci se prenose pružaocima usluga (Google LLC, SAD i Dynatrace LLC, SAD). Obrada podataka zasniva se na ugovorima s Google LLC i Dynatrace LLC. Ovaj odnos s pružaocima usluga u skladu je s Općom uredbom o zaštiti podataka Evropske unije (EU GDPR) i sporazumom EU-SAD "Privacy Shield".
  text3: Da bismo kreirali i omogućili korištenje računa u našim sistemima i obavještavali te e-mailom o potrebnim promjenama na tvom računu, npr. o ažuriranjima ili kršenjima naših uslova korištenja i usluge, pravila zajednice ili naših smjernica, čuvat ćemo tvoje korisničko ime i, ako si je naveo/la, tvoju e-mail adresu. Ako si svoj račun povezao/la putem Google Plusa ili Facebooka, dodatno čuvamo identifikacijski ključ povezan s tvojim računom na tim uslugama. Ove podatke nećemo koristiti ni u koje druge svrhe (npr. marketinške), osim ako nam to izričito ne dozvoliš.
  text4: Dobrovoljno nam možeš navesti svoju državu prebivališta putem stranice svog računa na stranici za dijeljenje. Ona će se prikazivati na tvom javnom profilu i koristit ćemo je samo u statističke i istraživačke svrhe. Možeš je ukloniti u bilo kojem trenutku u postavkama profila.
  text5: Korištenje ličnih podataka vezanih za tvoj račun možeš povući u bilo kojem trenutku brisanjem računa putem stranice svog profila na https://share.catrob.at/. Nakon brisanja računa i dalje ćeš moći koristiti ponuđene usluge, ali ne i sarađivati, npr. otpremanjem programa, komentarisanjem ili lajkanjem. Također će biti izbrisan sav sadržaj povezan s tvojim računom, npr. otpremljeni programi, komentari itd.
  text6: Kako bismo spriječili zloupotrebu naših usluga, npr. putem korisničkih otpremanja ili komentara u nezakonite svrhe, svi javni podaci koje generišu korisnici (otpremanja, komentari) čuvaju se interno u bazi podataka, zajedno s vremenskom oznakom i korištenom internet adresom. Ovi podaci se neće koristiti niti prosljeđivati nikakvim institucijama, osim ako postoji opravdana sumnja na dovoljno nezakonite radnje i službeno ovlaštene pravne institucije to zatraže na osnovu važećeg zakona. Svaki slučaj ćemo prvo temeljito pojedinačno provjeriti.
  text7: Dobrovoljno se možeš prijaviti na Catrobat newsletter na https://catrob.at/newsletter, koji pružamo putem usluge MailChimp (The Rocket Science Group LLC d/b/a MailChimp, SAD). Tada ćeš na navedenu e-mail adresu dobijati novosti o projektu Catrobat i njegovim uslugama. Od newslettera se možeš odjaviti u bilo kojem trenutku putem linka "unsubscribe" u podnožju svakog newslettera. Ovaj newsletter pruža MailChimp, s kojim imamo ugovor o obradi podataka i koji se obavezao na poštivanje Opće uredbe EU o zaštiti podataka i sporazuma EU-SAD "Privacy Shield". Za više detalja o MailChimpu pogledaj i MailChimpova pravila o privatnosti i uslove korištenja.
  text8: Sve usluge pruža besplatni projekat otvorenog koda Catrobat pod okriljem udruženja International Catrobat Association – Verein zur Förderung freier Software, neprofitne nevladine organizacije registrovane u Grazu, Austrija (Evropska unija). Naša pravila poštuju zakone EU i Austrije o zaštiti podataka (GDPR). Da nas kontaktiraš, pošalji e-mail na contact@catrobat.org ili nam piši na Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austrija (Evropska unija).
  text9: Ako imaš manje od 14 godina, ova pravila mora prihvatiti zakonski staratelj (obično roditelj).
  text10: Catrobatova službena pravila o privatnosti na engleskom jeziku dostupna su na webu pod %privacy_policy%.
  disagree-text: Bez saglasnosti ne možemo kreirati račun, ali osnovne funkcije su i dalje dostupne.
