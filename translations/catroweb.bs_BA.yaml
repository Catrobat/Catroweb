parent:
  footer:
    link: Roditelji i staratelji
  info:
    title: Informacije za roditelje i staratelje
    intro: Catrobat ozbiljno shvata sigurnost i privatnost mladih korisnika. Ova stranica objašnjava kako štitimo tvoje dijete i koja prava imaš.
    whatIsCatrobat:
      title: Šta je Catrobat?
      text: Catrobat je besplatna, neprofitna obrazovna platforma na kojoj mladi uče programiranje praveći vlastite aplikacije, igre i animacije. Platforma je dostupna širom svijeta i koristi se u obrazovanju.
    dataCollected:
      title: Koje podatke prikupljamo?
      text: 'Prikupljamo samo minimum podataka potrebnih za rad platforme: korisničko ime, e-mail adresu, datum rođenja i projekte koje tvoje dijete napravi i otpremi. Za korisnike mlađe od 14 godina čuvamo i e-mail adresu roditelja/staratelja radi saglasnosti. Lične podatke ne prodajemo niti dijelimo s trećim stranama.'
    yourRights:
      title: Tvoja prava kao roditelja ili staratelja
      text: 'Prema propisima EU o zaštiti djece (GDPR) i COPPA-i imaš pravo da: pregledaš podatke koje čuvamo o tvom djetetu, zatražiš kopiju tih podataka, povučeš saglasnost u bilo kojem trenutku (što ograničava račun) i zatražiš trajno brisanje računa tvog djeteta i svih povezanih podataka.'
    minorRestrictions:
      title: Koja ograničenja važe za račune maloljetnika?
      text: Korisnici mlađi od 16 godina ne mogu pisati ni čitati komentare, pratiti druge korisnike niti gledati sadržaj označen kao neprikladan za djecu. I dalje mogu praviti i otpremati projekte, pregledati javne projekte i reagovati na projekte lajkovima. Ova ograničenja postoje kako bi se osiguralo sigurno okruženje za učenje.
    manageButton: Upravljaj računom svog djeteta
