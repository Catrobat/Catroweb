licenseToPlay:
  link: Licenca za igranje
  title: Licenca za igranje - Preporuči i podijeli
  text1: Zamisli da je svaki Catrobat projekat torta, posebna torta koja dolazi sa svojim receptom (programskim blokovima). Svi članovi Catrobat zajednice dijele svoje torte zajedno s receptima. To znači da možeš uživati u tortama i naučiti kako da ih sam/a napraviš!
  text2: 'Nema tajnih recepata: upute za pravljenje ovih torti su otvorene svima da ih koriste, ponovo koriste, mijenjaju i da posluže kao inspiracija za nove ideje... mislim, torte.'
  text3: 'Možeš jesti torte, ali i kopirati tuđe recepte da napraviš svoje, možda s drugačijim sastojcima. Ova sloboda dolazi s dva jednostavna uslova:'
  text4: Pri osnivanju Catrobat zajednice odlučili smo usvojiti ovaj pristup jer vjerujemo da podržava učenje i kreativnost u zajednici. Dijeljenjem recepata i sastojaka (skripti i slika) ljudi mogu nadograđivati ideje jedni drugih i svi imaju koristi.
  text5: Pri dizajniranju Catrobat web stranice uključili smo funkcije koje podstiču ljude da dijele i odaju priznanje drugima. Na stranici svakog projekta uvijek možeš preuzeti originalne skripte projekta. Ako remiksuješ projekat (promijeniš skripte ili slike i podijeliš rezultat), podstičemo te da odaš priznanje u bilješkama projekta i spomeneš ljude i projekat koji su te inspirisali.
  text6: Saznaj više o uslovima korištenja Catrobat online zajednice na %link-termsOfUse%.
  list1:
    item1: dijeli svoje torte zajedno s receptom
    item2: preporuči one koji su te inspirisali
  version: Verzija 1.1, 2. april 2013.
termsOfUse:
  title: Uslovi korištenja
  headline: Dobro došao/la u Catrobat zajednicu!
  text1: 'Kao dio Catrobat zajednice dijeliš projekte i ideje s ljudima:'
  text2: 'Potrebna nam je tvoja pomoć da ova zajednica bude mjesto podrške za svakog člana. Evo kako možeš pomoći:'
  text3: 'Kroz projekat Catrobat želimo podsticati saradnju i omogućiti da se kreativnost svih spoji na dobrobit cijelog čovječanstva. I ti možeš postati aktivan član Catrobat zajednice tako što ćeš svoje projekte vratiti zajednici kao poklon, na isti način na koji ti drugi aktivni članovi poklanjaju svoje projekte:'
  text4: 'Naš poklon tebi:'
  text5: 'Naši uslovi korištenja i usluge:'
  list1:
    item1: iz mnogo različitih zemalja i kultura
    item2: svih uzrasta (od male djece do tinejdžera i baka i djedova)
    item3: sa svim nivoima iskustva
  list2:
    item1: Budi pun/a poštovanja. Kada dijeliš projekte, sjeti se da će tvoje doprinose vidjeti ljudi različitih uzrasta i porijekla.
    item2: Navedi zasluge. Slobodno pravi izmijenjene verzije tuđih projekata – samo se pobrini da navedeš njihove autore. Jedno mjesto za to je odjeljak sa zaslugama u tvom projektu. Za detalje o mijenjanju projekata drugih korisnika pogledaj paragraf ispod ove liste.
    item3: Budi iskren/a. Nemoj se pretvarati da si neko drugi niti pokušavati prevariti zajednicu.
    item4: Čuvaj lične podatke privatnim. Nemoj dijeliti svoju e-mail adresu, broj telefona ili druge lične kontakt podatke.
    item5: Pomozi da stranica ostane prijateljska. Ako misliš da bi drugi neki projekat ili komentar smatrali zlobnim, uvredljivim, previše nasilnim ili na neki drugi način neprikladnim, samo klikni na dugme 'prijavi kao neprikladno' i ostavi kratko objašnjenje. Catrobat tim će pregledati tvoju prijavu i može ukloniti bilo koji projekat, komentar ili objavu.
  list3:
    item1: 'Otpremanjem projekta na naše web stranice prihvataš i pristaješ da to djelo staviš pod određene slobodne licence za otpremljene Catrobat projekte. Slično slobodnim licencama pod kojima ti je dostupan i sam Catrobat sistem, ove slobodne licence otpremljenih Catrobat projekata daju svima pravo da uče iz djela koja su drugi ranije otpremili te da ih prilagođavaju i remiksuju kako bi napravili vlastite nove fascinantne igre, animacije i druge projekte. To svima omogućava da ''stoje na ramenima svojih vršnjaka'', a jedan od njih si i ti! Tvoje djelo će tako koristiti cijelom svijetu i ostati slobodno za korištenje svima, pomalo slično tekstovima i slikama koje volonteri iz cijelog svijeta slobodno doprinose Wikipediji. Zamisli to kao svoj poklon čovječanstvu: ti daješ svima, a svi ostali koji otpremaju svoja djela na naše stranice daju tebi. Tako je otpremljeni projekat poklon velike vrijednosti koji ti njegov vlasnik daje besplatno, pod uslovom da i ti učestvuješ u zajednici pod istim uslovima.'
    item2: Ne moraš prihvatiti poklon; ako ga prihvatiš, važe određena pravila. Prednost tih pravila je što možeš učiti iz djela i nadograđivati ga da sam/a napraviš još bolje stvari, koje onda možeš npr. ponovo otpremiti na naše stranice kao svoje. Još jedna prednost je što ove licence osiguravaju da ne možeš biti odgovoran/na za probleme koji drugima nastanu korištenjem tvog projekta.
    item3: Važan dodatni uslov je da jasno navedeš autore na čijim djelima si zasnovao/la svoje djelo. Istovremeno ćemo se potruditi da drugi jasno prepoznaju tvoje djelo kao tvoj doprinos, navodeći jedinstveno ime koje si slobodno odabrao/la da te predstavlja u Catrobat zajednici, i dajući drugima priliku da ti javno izraze zahvalnost što si svoje djelo dao/la svima, a posebno njima.
    item4: Za tačne pravne odredbe i uslove pogledaj %link-licenseUploaded%.
  list4:
    item1: Sav naš vlastiti softver i internetske resurse vezane za Catrobat sistem, npr. softver koji je napisao Catrobat tim, naše web stranice i internetske resurse, naš vlastiti izvorni kod vezan za Catrobat sistem i sve dodatne uključene materijale kao što su npr. slike, zvukovi i tekstovi, sada i u budućnosti nudimo ti pod Catrobatovim slobodnim licencama.
    item2: Ove licence čine sve dijelove Catrobata besplatnim za tebe, ali i slobodnim u smislu da ti daju slobodu da ih koristiš kako god želiš, uz samo nekoliko ograničenja koja, između ostalog, osiguravaju da Catrobat sistem zauvijek ostane slobodan i koristan za sve.
    item3: Za tačne pravne odredbe i uslove pogledaj %link-licenseToPlay%. Izvorni kod Catrobat sistema, kao i mnogi drugi dokumenti i resursi, dostupni su putem %link-developer%.
  list5:
    item1: Ako si ti, ili, ako imaš manje od 13 godina, tvoji roditelji ili zakonski staratelji, povezan/a s organizacijom koja učestvuje u ili je odgovorna za masovno kršenje privatnosti i/ili masovni nadzor, onda ne smiješ koristiti naše softverske aplikacije niti pristupati našim uslugama. Tačni detalji ovog ograničenja i određeni izuzeci od njega opisani su u odjeljcima 4.a i 4.b na našoj stranici %link-termsOfUse%.
    item2: Ako imaš manje od 13 godina, moraš pitati svoje roditelje ili zakonske staratelje da li ti dozvoljavaju korištenje Catrobatovih softverskih aplikacija i usluga.
    item3: Zadržavamo pravo da u bilo kojem trenutku, po vlastitom nahođenju, odbijemo, izbrišemo ili sakrijemo projekte, korisničke račune i bilo koje digitalne materijale otpremljene na Catrobatove web stranice, na primjer ako utvrdimo da projekat sadrži neprikladan materijal ili da korisnik krši prava drugih osoba.
    item4: Sav Catrobatov softver i internetski resursi nude se u nadi da će biti korisni, ali bez ikakve garancije.
    item5: Za tačne formulacije gore navedenih tačaka i neke dodatne pravne odredbe i uslove pogledaj naše %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service.
  bottom1: Navrati ovdje s vremena na vrijeme, jer uvijek pokušavamo poboljšati naše uslove korištenja.
  bottom2: Prijedloge u vezi s ovim uslovima korištenja pošalji na %email-webmaster%.
  version: Verzija 1.3, 4. mart 2014.
