    Ako ovo nisi zatražio/la, zanemari ovu poruku. Zahtjev ističe i postaje nevažeći za 24 sata.
    Da poništiš lozinku i kreiraš novu, posjeti sljedeću stranicu: %confirmationUrl%
    Svojim korisničkim imenom i lozinkom možeš u bilo kojem trenutku pristupiti zajednici %appplication_url%.
    Za to samo posjeti sljedeću stranicu: %loginPage%
    Da urediš podatke svog profila, idi na ovu stranicu: %profilePage%
    Srdačan pozdrav,
    Tvoj Catrobat tim.
