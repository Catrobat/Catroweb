licenseToPlay:
  link: 'Ойынға лицензия'
  title: 'Ойынға лицензия - авторларды белгілеп, бөліс'
  text1: Әрбір Catrobat жобасы - бұл торт, оның рецептімен (бағдарламалау блоктары) келетін өте ерекше торт екенін елестетіп көр. Catrobat қауымдастығының барлық мүшелері рецепттерімен бірге торттарын бөліседі. Бұл торттардан ләззат алуға және оларды өзің жасауды үйренуге болатынын білдіреді!
  text2: 'Ешқандай құпия рецепттер жоқ: бұл бәліштерді жасау туралы нұсқаулар кез келген адам үшін ашық, қолдануға, қайта пайдалануға, өзгертуге және жаңа идеяларға шабыт ретінде қызмет етеді... Бәліштерді айтамын.'
  text3: "Бәліштерді жеуге болады, сондай-ақ басқа адамдардың рецепттерін көшіріп, өзің дайындауға болады, мүмкін әртүрлі ингредиенттермен. Бұл еркіндік екі қарапайым нәрсе талап етеді:"
  text4: "Catrobat қауымдастығын құру кезінде біз бұл әдісті қолдануды шештік, өйткені ол қауымдастықтағы оқу мен шығармашылықты қолдайды деп есептейміз. Рецепттер мен ингредиенттерді (скрипттер мен өнер туындылары) бөлісу арқылы адамдар бір-бірінің идеяларына сүйене алады және барлығына пайда көреді."
  text5: "Catrobat веб-сайтын жасағанда біз адамдарды бөлісуге және басқалардың авторлығын көрсетуге ынталандыратын мүмкіндіктерді қостық. Әр жоба бетінде жобаның түпнұсқа скрипттерін әрқашан жүктеп ала аласың. Егер жобаны ремикстесең (скрипттерді немесе суреттерді өзгертіп, нәтижесімен бөліссең), жоба жазбаларында сені шабыттандырған адамдар мен жобаны атап, олардың авторлығын көрсетуге шақырамыз."
  text6: '%link-termsOfUse% сайтында Catrobat желілік қауымдастығының пайдалану шарттары туралы көбірек біл.'
  list1:
    item1: бәлішіңнің рецептімен бірге бөліс
    item2: сені шабыттандырған адамды белгіле
  version: Версия 1.1, 2 Сәуір 2013
termsOfUse:
  title: Қолдану ережелері
  headline: Catrobat қауымдастығына қош келдің!
  text1: 'Catrobat қауымдастығында сен жобаларың мен идеяларыңды адамдармен бөлісесің'
  text2: "Бұл қауымдастықты әрбір мүшеге қолдау көрсететін орынға айналдыру үшін бізге сенің көмегің қажет. Бізге былай көмектесе аласың:"
  text3: "Catrobat жобасы арқылы біз ынтымақтастықты дамытып, бүкіл адамзаттың игілігі үшін әркімнің шығармашылығын біріктіргіміз келеді. Сен де басқа белсенді мүшелер өз жобаларын саған бергендей, өз жобаларыңды қауымдастыққа сыйлық ретінде қайтара отырып, Catrobat қауымдастығының белсенді мүшесі бола аласың:"
  text4: 'Саған сыйлығымыз:'
  text5: 'Біздің пайдалану және қызмет көрсету шарттары:'
  list1:
    item1: көптеген елдер мен мәдениеттерден
    item2: барлық жастағы (жас балалардан жасөспірімдерге және ата-әжелер)
    item3: барлық деңгейдегі тәжірибемен
  list2:
    item1: Құрметті бол. Жобалармен бөліскен кезде, оларды әр жастағы және әртүрлі ортадан шыққан адамдар көретінін есте сақта.
    item2: "Авторын көрсет. Басқа адамдардың жобаларының өзгертілген нұсқаларын еркін жасай бер – тек олардың авторлығын көрсетуді ұмытпа. Авторлықты жобаңның «Жазбалар мен алғыстар» бөлімінде көрсетуге болады. Басқа пайдаланушылардың жобаларын өзгерту туралы толығырақ осы тізімнің астындағы абзацтан оқы."
    item3: "Адал бол. Өзіңді басқа біреу етіп көрсетпе және қауымдастықты алдауға тырыспа."
    item4: "Жеке ақпаратты құпия сақта. Эл. пошта мекенжайыңды, телефон нөміріңді немесе басқа жеке байланыс ақпаратыңды бөліспе."
    item5: "Сайттың ыңғайлы болуына көмектес. Басқалар жобаны немесе түсініктемені қорлайтын, тым зорлық-зомбылық немесе басқаша орынсыз деп тапсаң, жай ғана «орынсыз деп хабарлау» түймесін басып, қысқаша түсініктеме қалдыр. Catrobat командасы сенің хабарламаңды қарап шығады және кез келген жобаны, түсініктемені немесе жазбаны жоюы мүмкін."
  list3:
    item1: "Жобаны біздің веб-сайттарымызға жүктеп салу арқылы сен бұл жұмысты жүктеп салынған Catrobat жобаларының белгілі бір тегін лицензиялары бойынша беруге келісесің. Catrobat жүйесінің өзі қол жетімді болатын тегін лицензиялар сияқты, жүктеп салынған Catrobat жобаларының осы тегін лицензиялары барлығына бұрын басқалар жүктеп салған жұмыстан үйренуге және осы жұмысты өздерінің жаңа қызықты ойындарын құруға бейімдеу және ремикстеу құқығын береді, анимациялар және басқа жобалар. Бұл әркімге «өз құрдастарының иығында тұруға» мүмкіндік береді, солардың бірі – сенсің! Осылайша, сенің жұмысың бүкіл әлемге пайда әкеледі және әркім үшін тегін болып қалады. Оны адамзатқа сый ретінде қарастыр: сен бәріне бересің, ал өз жұмысын біздің веб-сайттарымызға жүктегендердің барлығы саған береді. Осылайша, жүктеп салынған жоба - оның иесі саған бірдей шарттармен қауымдастыққа қатысу шартымен тегін беретін үлкен құнды сыйлық."
    item2: 'Сыйлықты қабылдаудың қажеті жоқ; қабылдасаң, белгілі бір ережелер қолданылады. Бұл ережелердің артықшылығы мынада: сен жұмыстан үйреніп, соған сүйене отырып, одан да жақсырақ нәрселерді өзің жасай аласың, содан кейін оны, мысалы, біздің веб-сайттарға қайтадан жүктей аласың. Тағы бір артықшылығы - бұл лицензиялар сенің жобаңды пайдалану арқылы басқалардың алдында туындайтын кез келген мәселелер үшін жауапты болмайтыныңа көз жеткізеді.'
    item3: "Маңызды қосымша шарт – өз жұмысыңа негіз болған туындылардың авторларын анық көрсету. Сонымен бірге біз сенің жұмысыңның сенікі екенін басқалар анық бағалауы үшін күш саламыз: Catrobat қауымдастығында өзіңді білдіру үшін еркін таңдаған бірегей атыңды көрсетеміз және басқаларға жұмысыңды барлығына, әсіресе соларға бергенің үшін саған көпшілік алдында алғыс айтуға мүмкіндік береміз."
    item4: "Нақты заңды шарттар үшін %link-licenseUploaded% қара."
  list4:
    item1: "Біз Catrobat жүйесіне қатысты өз бағдарламалық жасақтамамыз бен интернет ресурстарымыздың барлығын, мысалы, Catrobat командасы жазған бағдарламаларды, веб-сайттарымыз бен интернет ресурстарымызды, Catrobat жүйесіне қатысты өз бастапқы кодымызды және суреттер, дыбыстар, мәтіндер сияқты барлық қосымша материалдарды қазір де, болашақта да саған Catrobat-тың тегін лицензиялары бойынша ұсынамыз."
    item2: "Бұл лицензиялар Catrobat-тың барлық бөліктерін саған тегін етеді және оларды қалағаныңша пайдалану еркіндігін береді; бірнеше шектеу ғана бар, олар басқа нәрселермен қатар Catrobat жүйесінің әрқашан тегін және барлығына пайдалы болып қалуын қамтамасыз етеді."
    item3: "Нақты заңды шарттар үшін %link-licenseToPlay% қара. Catrobat жүйесінің бастапқы коды, сондай-ақ көптеген басқа құжаттар мен ресурстар %link-developer% арқылы қолжетімді."
  list5:
    item1: "Егер сен немесе, 13 жасқа толмаған болсаң, сенің ата-анаң не заңды қамқоршыларың жаппай бақылау немесе құпиялылықты жаппай бұзуға қатысатын не соған жауапты ұйыммен байланысты болса, біздің бағдарламалық қолданбаларымызды пайдалануға және қызметтерімізге кіруге рұқсат етілмейді. Бұл шектеудің нақты мәліметтері мен кейбір ерекшеліктері біздің %link-termsOfUse% құжатымыздың 4.a және 4.b бөлімдерінде сипатталған."
    item2: "Егер саған 13 жас толмаған болса, Catrobat бағдарламалық қолданбалары мен қызметтерін пайдалануға рұқсат бере ме, деп ата-анаңнан немесе заңды қамқоршыларыңнан сұрауың керек."
    item3: "Біз Catrobat веб-сайттарына жүктелген жобаларды, пайдаланушы аккаунттарын және кез келген цифрлық материалдарды кез келген уақытта өз қалауымызбен қабылдамауға, жоюға немесе жасыруға құқылымыз, мысалы, жобада орынсыз материал бар екенін немесе пайдаланушы басқа адамдардың құқықтарын бұзатынын анықтасақ."
    item4: "Catrobat-тың барлық бағдарламалық жасақтамасы мен интернет ресурстары пайдалы болады деген үмітпен, бірақ ешқандай кепілдіксіз ұсынылады."
    item5: "Жоғарыдағы тармақтардың нақты тұжырымдары мен кейбір қосымша заңды шарттар үшін біздің %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service бетін қара."
  bottom1: "Мұнда анда-санда қайта кіріп тұр, өйткені біз Пайдалану шарттарымызды үнемі жақсартуға тырысамыз."
  bottom2: "Осы Пайдалану шарттарына қатысты кез келген ұсынысыңды %email-webmaster% мекенжайына жібер."
