privacy-policy:
  header: "Құпиялылық саясаты"
  version: "2.2 нұсқасы, 2019 жылғы 17 қазан"
  text1: Саған қызметтеріміздің және онымен байланысты аккаунттың барлық артықшылықтарын ұсыну үшін сенен белгілі бір деректерді жинауымыз қажет.
  text2: Қызметтерімізді (қолданбалар мен веб-сайттар) қолдау және жақсарту, сондай-ақ АКТ және STEM/STEAM білімі бойынша ғылыми зерттеулер жүргізу үшін Google LLC (АҚШ), сонымен қатар Dynatrace by Dynatrace LLC (АҚШ) ұсынған Google Analytics, Crashlytics және Firebase қолданбаларын пайдаланамыз. АҚШ) қызметтерімізді пайдалану туралы метадеректерді алу үшін, мысалы, бұзылу туралы ақпарат, уақыт белгілері, кірген беттер/экрандар, қолданбалар мен қызметтерді пайдалану, пайдаланылған операциялық жүйе және желі провайдері туралы ақпарат. Бұл талдау және жиналған деректер сенің профиліңе байланысты емес және ешқандай жеке ақпаратты қамтымайды (IP мекенжайының соңғы биттері анонимді болады). Дегенмен, жиналған деректер қызмет провайдерлеріне (Google LLC, АҚШ және Dynatrace LLC, АҚШ) жіберіледі. Деректерді өңдеу Google LLC және Dynatrace LLC келісімдеріне негізделген. Бұл қызмет жеткізушілерімен қарым-қатынас Еуропалық Одақтың Деректерді қорғаудың жалпы ережесіне (ЕО GDPR) және ЕО-АҚШ «Құпиялылық қалқаны» келісіміне сәйкес келеді.
  text3: "Біздің жүйелерде аккаунт ашу және пайдалану үшін, сондай-ақ аккаунтыңа қатысты қажетті өзгерістер туралы, мысалы, жаңартулар немесе Пайдалану шарттарымызды, қауымдастық ережелерімізді не саясаттарымызды бұзу туралы саған эл. пошта арқылы хабарлау үшін біз сенің пайдаланушы атыңды және, егер көрсетсең, эл. пошта мекенжайыңды сақтаймыз. Егер аккаунтыңды Google Plus немесе Facebook арқылы байланыстырған болсаң, осы қызметтердегі аккаунтыңа байланған сәйкестендіру кілтін де сақтаймыз. Біз бұл деректерді сен анық рұқсат бермейінше басқа ешқандай (мысалы, маркетингтік) мақсаттарға пайдаланбаймыз."
  text4: "Өз еркіңмен бөлісу сайтындағы аккаунт бетің арқылы тұратын еліңді көрсете аласың. Ол жалпыға ашық профиліңде көрсетіледі және біз оны тек статистикалық және ғылыми мақсаттарда пайдаланамыз. Оны профиль баптауларынан кез келген уақытта өшіре аласың."
  text5: "Аккаунтыңа тиесілі жеке деректерді пайдалануға берген келісіміңді кез келген уақытта https://share.catrob.at/ сайтындағы профиль бетің арқылы аккаунтыңды жою арқылы қайтарып ала аласың. Аккаунтыңды жойғаннан кейін ұсынылған қызметтерді пайдалана беруге болады, бірақ бағдарламаларды жүктеу, пікір жазу немесе лайк басу сияқты бірлескен әрекеттер қолжетімсіз болады. Сондай-ақ аккаунтыңа байланған барлық мазмұн, мысалы, жүктелген бағдарламалар, пікірлер және т.б. жойылады."
  text6: "Қызметтерімізді теріс пайдаланудың, мысалы, пайдаланушылар жүктеген материалдарды немесе пікірлерді заңсыз мақсаттарда пайдаланудың алдын алу үшін пайдаланушылар жасаған барлық жалпыға ашық деректер (жүктеулер, пікірлер) уақыт белгісімен және пайдаланылған интернет мекенжайымен бірге ішкі дерекқорда сақталады. Бұл деректер жеткілікті негізде заңсыз әрекеттерге күдік туындап, ресми уәкілетті құқықтық органдар қолданыстағы заңға сүйеніп оларды сұрамайынша, ешқандай мекемеге берілмейді және пайдаланылмайды. Әр жағдайды алдымен біз жеке-жеке мұқият тексереміз."
  text7: "Сен https://catrob.at/newsletter сайтында MailChimp қызметі (The Rocket Science Group LLC d/b/a MailChimp, АҚШ) арқылы ұсынылатын Catrobat жаңалықтар таратылымына өз еркіңмен жазыла аласың. Сонда сен көрсеткен эл. пошта мекенжайыңа Catrobat жобасы мен оның қызметтері туралы жаңалықтар келіп тұрады. Әр хаттың төменгі жағындағы «unsubscribe» сілтемесі арқылы таратылымнан кез келген уақытта бас тарта аласың. Бұл таратылымды бізбен деректерді өңдеу туралы келісімі бар және ЕО-ның Деректерді қорғаудың жалпы ережесі мен ЕО-АҚШ «Privacy Shield» келісімін сақтауға міндеттенген MailChimp ұсынады. MailChimp туралы толығырақ MailChimp-тің Құпиялылық саясаты мен Пайдалану шарттарынан қара."
  text8: "Барлық қызметтерді International Catrobat Association – Verein zur Förderung freier Software (Грац, Австрия, Еуропалық Одақ қаласында тіркелген коммерциялық емес ҮЕҰ) аясындағы тегін ашық бастапқы кодты Catrobat жобасы ұсынады. Біздің саясаттарымыз ЕО мен Австрияның деректерді қорғау туралы заңдарын (GDPR) сақтайды. Бізбен байланысу үшін contact@catrobat.org мекенжайына эл. хат жібер немесе мына мекенжайға хат жаз: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union)."
  text9: "Егер саған 14 жас толмаған болса, бұл саясатты заңды қамқоршың (әдетте ата-анаң) қабылдауы керек."
  text10: "Catrobat-тың ресми ағылшын тіліндегі құпиялылық саясаты интернетте %privacy_policy% мекенжайында қолжетімді."
  disagree-text: Мақұлдаусыз біз аккаунтты жасай алмаймыз, бірақ негізгі мүмкіндіктер әлі де қолжетімді.
