privacy-policy:
  header: 'Patakaran sa privacy'
  version: 'Bersyon 2.2, 17 Oktubre 2019'
  text1: 'Para maibigay sa iyo ang lahat ng benepisyo ng aming mga serbisyo at ng kaugnay na account, kailangan naming mangolekta ng ilang datos mula sa iyo.'
  text2: 'Para mapanatili at mapabuti ang aming mga serbisyo (mga app at website) at para magsagawa ng siyentipikong pananaliksik sa edukasyon sa ICT at STEM/STEAM, ginagamit namin ang Google Analytics, Crashlytics, at Firebase, lahat ng Google LLC (USA), pati na ang Dynatrace ng Dynatrace LLC (USA) para makakuha ng metadata tungkol sa paggamit ng aming mga serbisyo, hal., impormasyon sa pag-crash, mga timestamp, mga binisitang pahina/screen, paggamit ng aming mga app at serbisyo, ginamit na operating system, at impormasyon tungkol sa network provider. Ang pagsusuring ito at ang nakolektang datos ay hindi nakakonekta sa iyong profile at walang anumang personal na impormasyon (ina-anonymize ang huling bahagi ng IP address). Gayunpaman, ililipat ang nakolektang datos sa mga service provider (Google LLC, USA at Dynatrace LLC, USA). Nakabatay ang pagproseso ng datos sa mga kasunduan sa Google LLC at Dynatrace LLC. Sumusunod ang ugnayang ito sa mga service provider sa General Data Protection Regulation ng European Union (EU GDPR) at sa kasunduang EU-USA "Privacy Shield".'
  text3: 'Para makagawa at magamit ang isang account sa aming mga sistema, at para ipaalam sa iyo sa e-mail ang mga kinakailangang pagbabago tungkol sa iyong account, hal., mga update o paglabag sa aming Mga Tuntunin ng Paggamit at Serbisyo, mga patakaran ng komunidad, o mga patakaran namin, iimbakin namin ang iyong username at, kung ibinigay mo, ang iyong e-mail address. Kung ikinonekta mo ang iyong account sa Google Plus o Facebook, nag-iimbak din kami ng identification key na nakakonekta sa iyong account sa mga serbisyong iyon. Hindi namin gagamitin ang datos na ito para sa anumang ibang layunin (hal., marketing), maliban kung tahasan mo kaming pinahintulutan.'
  text4: 'Kung gusto mo, maaari mong ibigay sa amin ang iyong bansang tinitirhan sa pahina ng iyong account sa sharing site. Ipapakita ito sa iyong pampublikong profile at gagamitin lang namin para sa estadistika at pananaliksik. Maaari itong alisin anumang oras sa mga setting ng iyong profile.'
  text5: 'Maaari mong bawiin ang paggamit ng personal na datos ng iyong account anumang oras sa pagbura ng iyong account sa iyong profile page sa https://share.catrob.at/. Pagkatapos burahin ang iyong account, magagamit mo pa rin ang mga ibinibigay na serbisyo, pero hindi ka na makakapag-collaborate, hal., sa pag-upload ng mga programa, pagkomento, o pag-like. Bukod dito, mabubura ang lahat ng nilalamang nakakonekta sa iyong account, hal., mga na-upload na programa, komento, atbp.'
  text6: 'Para maiwasan ang maling paggamit ng aming mga serbisyo, hal., sa mga upload o komento ng user para sa ilegal na layunin, iniimbak sa loob ng isang database ang lahat ng pampublikong datos na ginawa ng user (mga upload, komento), kasama ang timestamp at ang ginamit na internet address. Hindi gagamitin o ipapasa ang datos na ito sa anumang institusyon, maliban kung may makatwirang hinala ng sapat na ilegal na gawain at hilingin ito ng mga opisyal na awtorisadong legal na institusyon batay sa naaangkop na batas. Masusing susuriin muna namin ang bawat kaso nang isa-isa.'
  text7: 'Maaari kang kusang mag-subscribe sa Catrobat Newsletter sa https://catrob.at/newsletter na ibinibigay namin sa pamamagitan ng serbisyong MailChimp (The Rocket Science Group LLC d/b/a MailChimp, USA). Makakatanggap ka ng mga update tungkol sa proyektong Catrobat at mga serbisyo nito sa e-mail address na ibinigay mo. Maaari mong ihinto ang newsletter anumang oras gamit ang link na "unsubscribe" sa footer ng bawat newsletter. Ibinibigay ang newsletter na ito ng MailChimp, na may kasunduan kami sa pagproseso ng datos at nangako na susunod sa EU General Data Protection Regulation at sa EU-USA "Privacy Shield". Para sa higit pang detalye tungkol sa MailChimp, tingnan din ang Patakaran sa Privacy at Mga Tuntunin ng Paggamit ng MailChimp.'
  text8: 'Ang lahat ng Serbisyo ay ibinibigay ng libre at open source na proyektong Catrobat sa ilalim ng International Catrobat Association – Verein zur Förderung freier Software, isang non-profit na NGO na nakarehistro sa Graz, Austria (European Union). Iginagalang ng aming mga patakaran ang batas ng EU at Austria sa proteksyon ng datos (GDPR). Para makipag-ugnayan sa amin, magpadala ng e-mail sa contact@catrobat.org o sumulat sa Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'Kung wala ka pang 14 taong gulang, dapat tanggapin ng isang legal na tagapag-alaga (karaniwan ay magulang) ang patakarang ito.'
  text10: 'Ang opisyal na patakaran sa privacy ng Catrobat sa wikang Ingles ay available sa web sa %privacy_policy%.'
  disagree-text: 'Kung walang pahintulot, hindi kami makakagawa ng account pero magagamit pa rin ang mga pangunahing feature.'
