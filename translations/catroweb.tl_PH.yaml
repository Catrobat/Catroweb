  email:
    subject: 'Kailangan ang pahintulot ng magulang para sa Catrobat account ng iyong anak'
    title: 'Kailangan ang pahintulot ng magulang'
    greeting: 'Kumusta,'
    message: 'Gumawa ng account sa Catrobat ang iyong anak na si %username% at na-verify na niya ang kanyang email address.'
    explanation: 'Ang Catrobat ay isang libreng pang-edukasyong plataporma kung saan natututo ang mga kabataan na mag-code sa paggawa ng mga app, laro, at animation. Ayon sa mga regulasyon ng EU para sa proteksyon ng mga bata, kailangan namin ang iyong pahintulot bago ganap na makasali ang iyong anak sa komunidad. I-click ang button sa ibaba para magbigay ng pahintulot.'
