parent:
  footer:
    link: 'Mga magulang at tagapag-alaga'
  info:
    title: 'Impormasyon para sa mga magulang at tagapag-alaga'
    intro: 'Seryoso ang Catrobat sa kaligtasan at privacy ng mga batang user. Ipinapaliwanag ng pahinang ito kung paano namin pinoprotektahan ang iyong anak at kung ano ang iyong mga karapatan.'
    whatIsCatrobat:
      title: 'Ano ang Catrobat?'
      text: 'Ang Catrobat ay isang libre at non-profit na pang-edukasyong plataporma kung saan natututo ang mga kabataan ng programming sa paggawa ng sarili nilang mga app, laro, at animation. Available ang plataporma sa buong mundo at ginagamit sa mga paaralan.'
    dataCollected:
      title: 'Anong datos ang kinokolekta namin?'
      text: 'Kinokolekta lang namin ang pinakakaunting datos na kailangan para mapatakbo ang plataporma: username, email address, petsa ng kapanganakan, at anumang proyektong ginagawa at ina-upload ng iyong anak. Para sa mga user na wala pang 14 taong gulang, nag-iimbak din kami ng email address ng magulang/tagapag-alaga para sa pahintulot. Hindi namin ibinebenta o ibinabahagi ang personal na datos sa ibang partido.'
    yourRights:
      title: 'Ang iyong mga karapatan bilang magulang o tagapag-alaga'
      text: 'Ayon sa mga regulasyon ng EU para sa proteksyon ng mga bata (GDPR) at COPPA, may karapatan kang: suriin ang datos na hawak namin tungkol sa iyong anak, humingi ng kopya ng datos na iyon, bawiin ang iyong pahintulot anumang oras (na maglilimita sa account), at hilingin ang permanenteng pagbura ng account ng iyong anak at lahat ng kaugnay na datos.'
    minorRestrictions:
      title: 'Anong mga limitasyon ang nalalapat sa account ng menor de edad?'
      text: 'Ang mga user na wala pang 16 taong gulang ay hindi maaaring mag-post o magbasa ng mga komento, sumunod sa ibang user, o tumingin ng nilalamang minarkahang hindi angkop para sa mga bata. Maaari pa rin silang gumawa at mag-upload ng mga proyekto, mag-browse ng mga pampublikong proyekto, at mag-react sa mga proyekto gamit ang likes. Nandito ang mga limitasyong ito para magbigay ng ligtas na kapaligiran sa pag-aaral.'
