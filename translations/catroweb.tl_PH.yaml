licenseToPlay:
  link: 'Lisensyang maglaro'
  title: 'Lisensyang maglaro - Magbigay ng kredito at magbahagi'
  text1: 'Isipin mo na ang bawat proyekto ng Catrobat ay isang cake, isang napakaespesyal na cake na may kasamang recipe (mga programming block). Ibinabahagi ng lahat ng miyembro ng komunidad ng Catrobat ang kanilang mga cake kasama ang kanilang mga recipe. Ibig sabihin, masisiyahan ka sa mga cake at matututo kang gawin ang mga ito nang mag-isa!'
  text2: 'Walang lihim na recipe: bukas sa lahat ang mga instruksyon kung paano gawin ang mga cake na ito para gamitin, gamitin muli, baguhin, at maging inspirasyon para sa mga bagong ideya... ang ibig kong sabihin, mga cake.'
  text3: 'Maaari mong kainin ang mga cake at kopyahin din ang mga recipe ng ibang tao para gumawa ng sarili mo, marahil gamit ang ibang sangkap. May kasamang dalawang simpleng kondisyon ang kalayaang ito:'
  text4: 'Sa pagbuo ng komunidad ng Catrobat, pinili naming gamitin ang ganitong paraan dahil naniniwala kaming sinusuportahan nito ang pagkatuto at pagkamalikhain sa loob ng komunidad. Sa pagbabahagi ng mga recipe at sangkap (mga script at artwork), makakapagpatuloy ang mga tao sa mga ideya ng isa''t isa at makikinabang ang lahat.'
  text5: 'Sa pagdisenyo ng website ng Catrobat, nagsama kami ng mga feature para hikayatin ang mga tao na magbahagi at magbigay ng kredito sa iba. Sa bawat pahina ng proyekto, palagi mong mada-download ang orihinal na mga script ng proyekto. Kung magre-remix ka ng proyekto (binabago ang mga script o artwork, at ibinabahagi ang resulta), hinihikayat ka naming magbigay ng kredito sa mga tala ng proyekto, binabanggit ang mga tao at proyektong nagbigay sa iyo ng inspirasyon.'
  text6: 'Alamin ang higit pa tungkol sa mga tuntunin ng paggamit ng online na komunidad ng Catrobat sa %link-termsOfUse%.'
  list1:
    item1: 'ibahagi ang iyong mga cake kasama ang recipe'
    item2: 'magbigay ng kredito sa mga nagbigay sa iyo ng inspirasyon'
  version: 'Bersyon 1.1, 2 Abril 2013'
termsOfUse:
  title: 'Mga Tuntunin ng Paggamit'
  headline: 'Maligayang pagdating sa komunidad ng Catrobat!'
  text1: 'Bilang bahagi ng komunidad ng Catrobat, nagbabahagi ka ng mga proyekto at ideya sa mga tao:'
  text2: 'Kailangan namin ang tulong mo para gawing suportadong lugar ang komunidad na ito para sa bawat miyembro. Ganito ka makakatulong:'
  text3: 'Sa pamamagitan ng proyektong Catrobat, gusto naming itaguyod ang pagtutulungan at hayaang magsama-sama ang pagkamalikhain ng lahat para sa kapakanan ng buong sangkatauhan. Maaari ka ring maging aktibong miyembro ng komunidad ng Catrobat sa pagbibigay ng iyong mga proyekto pabalik sa komunidad bilang regalo, tulad ng pagbibigay ng ibang aktibong miyembro ng kanilang mga proyekto sa iyo:'
  text4: 'Ang aming regalo sa iyo:'
  text5: 'Ang aming mga Tuntunin ng Paggamit at Serbisyo:'
  list1:
    item1: 'mula sa maraming iba''t ibang bansa at kultura'
    item2: 'sa lahat ng edad (mula sa maliliit na bata hanggang sa mga teenager at lolo''t lola)'
    item3: 'sa lahat ng antas ng karanasan'
  list2:
    item1: 'Maging magalang. Kapag nagbabahagi ng mga proyekto, tandaan na makikita ng mga tao sa iba''t ibang edad at pinagmulan ang iyong mga kontribusyon.'
    item2: 'Magbigay ng kredito. Malaya kang gumawa ng binagong bersyon ng mga proyekto ng ibang tao - siguraduhin lang na bigyan mo sila ng kredito. Isang lugar para magbigay ng kredito ay ang seksyon ng mga tala at credits ng iyong proyekto. Tingnan ang talata sa ibaba ng listahang ito para sa mga detalye tungkol sa pagbabago ng mga proyekto ng ibang user.'
    item3: 'Maging tapat. Huwag magpanggap na ibang tao o subukang lokohin ang komunidad.'
    item4: 'Panatilihing pribado ang personal na impormasyon. Huwag ibahagi ang iyong email address, numero ng telepono, o iba pang personal na contact information.'
    item5: 'Tumulong na panatilihing palakaibigan ang site. Kung sa tingin mo ay makikita ng iba na masama, nakakainsulto, masyadong marahas, o hindi angkop ang isang proyekto o komento, i-click lang ang button na ''iulat bilang hindi angkop'' at mag-iwan ng maikling paliwanag. Susuriin ng Catrobat team ang iyong ulat at maaaring burahin ang anumang proyekto, komento, o post.'
  list3:
    item1: 'Sa pag-upload ng proyekto sa aming mga website, tinatanggap at sinasang-ayunan mong ilagay ang gawaing ito sa ilalim ng ilang libreng lisensya para sa mga na-upload na proyekto ng Catrobat. Katulad ng mga libreng lisensya kung saan available sa iyo ang Catrobat system mismo, binibigyan ng mga libreng lisensyang ito ang lahat ng karapatang matuto mula sa gawaing na-upload ng iba at iangkop at i-remix ang gawaing iyon para bumuo ng sarili nilang bago at kahanga-hangang mga laro, animation, at iba pang proyekto. Pinapayagan nito ang lahat na ''tumayo sa balikat ng kanilang mga kapwa'', at isa ka sa kanila! Kaya makikinabang ang buong mundo sa iyong gawa at mananatili itong libre para gamitin ng lahat, medyo katulad ng teksto at mga larawang malayang iniaambag sa Wikipedia ng mga boluntaryo mula sa buong mundo. Isipin mo ito bilang regalo mo sa sangkatauhan: nagbibigay ka sa lahat, at lahat ng iba pang nag-a-upload ng kanilang gawa sa aming mga website ay nagbibigay sa iyo. Kaya ang isang na-upload na proyekto ay isang napakahalagang regalo na libreng ibinibigay sa iyo ng may-ari nito, sa kondisyong makikilahok ka sa komunidad sa parehong mga tuntunin.'
    item2: 'Hindi mo kailangang tanggapin ang regalo; kung tatanggapin mo, may ilang patakarang nalalapat. Ang mga benepisyo ng mga patakarang ito ay matututo ka mula sa gawa at mapapagpatuloy mo ito para gumawa ng mas astig pang bagay, na maaari mo namang i-upload ulit sa aming mga website bilang sarili mo. Isa pang benepisyo ay tinitiyak ng mga lisensyang ito na hindi ka mapapanagot sa anumang problemang dulot sa iba ng kanilang paggamit ng iyong proyekto.'
    item3: 'Isang mahalagang karagdagang kondisyon ay malinaw mong kilalanin ang mga may-akda ng mga gawang pinagbatayan ng iyong sariling gawa. Kasabay nito, magsisikap kami para malinaw na makilala ng iba na ikaw ang nag-ambag ng iyong gawa, sa pagbibigay-kredito sa natatanging pangalang malaya mong pinili para kumatawan sa iyo sa komunidad ng Catrobat, at sa pagbibigay sa iba ng pagkakataong ipahayag sa publiko ang kanilang pasasalamat sa iyo sa pagbibigay ng iyong gawa sa lahat, at lalo na sa kanila.'
    item4: 'Tingnan ang %link-licenseUploaded% para sa eksaktong legal na mga tuntunin at kondisyon.'
  list4:
    item1: 'Iniaalok namin sa iyo ang lahat ng aming sariling software at mga Internet resource na kaugnay ng Catrobat system, hal., ang software na isinulat ng Catrobat team, ang aming mga website at Internet resource, ang aming sariling source code na kaugnay ng Catrobat system, at lahat ng karagdagang kasamang materyal tulad ng, hal., mga larawan, tunog, at teksto, ngayon at sa hinaharap sa ilalim ng mga libreng lisensya ng Catrobat.'
    item2: 'Ginagawa ng mga lisensyang ito na libre para sa iyo ang lahat ng bahagi ng Catrobat, at malaya rin sa diwang binibigyan ka ng kalayaang gamitin ang mga ito ayon sa gusto mo, na may ilang limitasyon lang na tumitiyak, bukod sa iba pa, na mananatiling libre at kapaki-pakinabang magpakailanman ang Catrobat system para sa lahat.'
    item3: 'Tingnan ang %link-licenseToPlay% para sa eksaktong legal na mga tuntunin at kondisyon. Ang source code ng Catrobat system at marami pang ibang dokumento at resource ay available sa %link-developer%.'
  list5:
    item1: 'Kung ikaw, o kung wala ka pang 13 taong gulang, ang iyong mga magulang o legal na tagapag-alaga, ay konektado sa isang organisasyong sangkot o responsable sa malawakang paglabag sa privacy at/o maramihan o malawakang pagmamanman, hindi ka pinapayagang gamitin ang aming mga software application at i-access ang aming mga serbisyo. Ang eksaktong detalye ng limitasyong ito at ilang eksepsyon dito ay nakasaad sa Seksyon 4.a at 4.b ng aming %link-termsOfUse%.'
    item2: 'Kung wala ka pang 13 taong gulang, kailangan mong tanungin ang iyong mga magulang o legal na tagapag-alaga kung pinapayagan ka nilang gamitin ang mga Software Application at Serbisyo ng Catrobat.'
    item3: 'May karapatan kaming tanggihan, burahin, o itago ang mga proyekto, user account, at anumang digital na materyal na na-upload sa mga website ng Catrobat anumang oras ayon sa aming sariling pagpapasya, halimbawa kung makita naming may hindi angkop na materyal ang isang proyekto o lumalabag ang isang user sa mga karapatan ng ibang tao.'
    item4: 'Ang lahat ng software at Internet resource ng Catrobat ay iniaalok sa pag-asang magiging kapaki-pakinabang ang mga ito, ngunit nang walang anumang garantiya.'
    item5: 'Tingnan ang aming %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service para sa eksaktong pagkakasulat ng mga puntong nasa itaas at ilang karagdagang legal na tuntunin at kondisyon.'
  bottom1: 'Bumalik dito paminsan-minsan, dahil palagi naming sinisikap na pagbutihin ang aming Mga Tuntunin ng Paggamit.'
  bottom2: 'Ipadala ang anumang mungkahi tungkol sa Mga Tuntunin ng Paggamit na ito sa %email-webmaster%.'
  version: 'Bersyon 1.3, 4 Marso 2014'
