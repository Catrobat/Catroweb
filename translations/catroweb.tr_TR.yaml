  email:
    subject: "Çocuğunuzun Catrobat hesabı için ebeveyn onayı gerekiyor"
    title: "Ebeveyn onayı gerekli"
    greeting: "Merhaba,"
    message: "Çocuğunuz %username% Catrobat'ta bir hesap oluşturdu ve e-posta adresini doğruladı."
    explanation: "Catrobat, gençlerin uygulamalar, oyunlar ve animasyonlar oluşturarak kodlamayı öğrendiği ücretsiz bir eğitim platformudur. AB çocuk koruma düzenlemeleri gereğince, çocuğunuzun topluluğa tam olarak katılabilmesi için onayınıza ihtiyacımız var. Onay vermek için lütfen aşağıdaki düğmeye tıklayın."
