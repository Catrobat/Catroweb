    title: "Onay verildi"
    message: "Teşekkürler! %username% kullanıcısının hesabı artık tamamen etkin."
    continueButton: "Projeleri keşfet"
parent:
  footer:
    link: "Ebeveynler ve veliler"
  info:
    title: "Ebeveynler ve veliler için bilgiler"
    intro: "Catrobat, genç kullanıcıların güvenliğini ve gizliliğini ciddiye alır. Bu sayfa çocuğunuzu nasıl koruduğumuzu ve hangi haklara sahip olduğunuzu açıklar."
    whatIsCatrobat:
      title: "Catrobat nedir?"
      text: "Catrobat, gençlerin kendi uygulamalarını, oyunlarını ve animasyonlarını oluşturarak programlamayı öğrendiği ücretsiz, kâr amacı gütmeyen bir eğitim platformudur. Platform dünya çapında kullanılabilir ve eğitim ortamlarında kullanılmaktadır."
    dataCollected:
      title: "Hangi verileri topluyoruz?"
      text: "Platformu işletmek için gereken en az veriyi topluyoruz: kullanıcı adı, e-posta adresi, doğum tarihi ve çocuğunuzun oluşturup yüklediği projeler. 14 yaşından küçük kullanıcılar için onay amacıyla bir ebeveyn/veli e-posta adresi de saklıyoruz. Kişisel verileri satmıyor veya üçüncü taraflarla paylaşmıyoruz."
    yourRights:
      title: "Ebeveyn veya veli olarak haklarınız"
      text: "AB çocuk koruma düzenlemeleri (GDPR) ve COPPA kapsamında şu haklara sahipsiniz: çocuğunuz hakkında tuttuğumuz verileri incelemek, bu verilerin bir kopyasını istemek, onayınızı istediğiniz zaman geri çekmek (bu hesabı kısıtlar) ve çocuğunuzun hesabının ve ilişkili tüm verilerin kalıcı olarak silinmesini istemek."
    minorRestrictions:
      title: "Reşit olmayanların hesaplarına hangi kısıtlamalar uygulanır?"
      text: "16 yaşından küçük kullanıcılar yorum yazamaz veya okuyamaz, diğer kullanıcıları takip edemez ve çocuklar için uygun değil olarak işaretlenmiş içerikleri göremez. Yine de proje oluşturup yükleyebilir, herkese açık projelere göz atabilir ve projelere beğeniyle tepki verebilirler. Bu kısıtlamalar güvenli bir öğrenme ortamı sağlamak içindir."
    manageButton: "Çocuğunuzun hesabını yönetin"
