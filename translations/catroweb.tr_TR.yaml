    whatIsCatrobat: "Catrobat ücretsiz, kâr amacı gütmeyen bir eğitsel programlama platformudur. Daha fazla bilgi için: catrobat.org."
    manageLink: 'Çocuğunuzun hesabını istediğiniz zaman <a href="%portalUrl%" style="color: #00acc1;">Ebeveyn Portalı</a> üzerinden yönetebilirsiniz. <a href="%infoUrl%" style="color: #00acc1;">Ebeveyn olarak haklarınız</a> hakkında daha fazla bilgi edinin.'
