privacy-policy:
  header: Privacy Policy
  version: "Siga 2.2, 17 ga Oktoba 2019"
  text1: "Don ba ka duk amfanin ayyukanmu da asusun da ke tare da su, ya zama dole mu tattara wasu bayanai daga gare ka."
  text2: "Don kula da inganta ayyukanmu (manhajoji da shafukan yanar gizo) da yin bincike na kimiyya kan ilimin ICT da STEM/STEAM, muna amfani da Google Analytics, Crashlytics, da Firebase, duk na Google LLC (Amurka), da kuma Dynatrace na Dynatrace LLC (Amurka) don samun bayanai game da amfani da ayyukanmu, misali, bayanan faɗuwa, lokuta, shafuka/allunan da aka ziyarta, amfani da manhajojinmu da ayyukanmu, tsarin aiki da aka yi amfani da shi, da bayani game da mai ba da hanyar sadarwa. Wannan bincike da bayanan da aka tattara ba su da alaƙa da bayananka kuma ba su ƙunshi wani bayanin sirri ba (ana ɓoye ƙarshen adireshin IP). Duk da haka, za a tura bayanan da aka tattara zuwa masu ba da sabis (Google LLC, Amurka da Dynatrace LLC, Amurka). Sarrafa bayanai ya dogara ne da yarjejeniyoyi da Google LLC da Dynatrace LLC. Wannan dangantaka da masu ba da sabis ta yi daidai da Dokar Kare Bayanai ta Tarayyar Turai (EU GDPR) da yarjejeniyar EU-USA \"Privacy Shield\"."
  text3: "Don ƙirƙira da amfani da asusu a tsarinmu, da sanar da kai game da canje-canje masu muhimmanci game da asusunka ta imel, misali, sabuntawa ko keta Sharuɗɗanmu na Amfani da Sabis, dokokin al'ummarmu, ko manufofinmu, za mu adana sunan mai amfaninka kuma, idan ka bayar, adireshin imel ɗinka. Idan ka haɗa asusunka ta Google Plus ko Facebook, muna kuma adana maɓallin ganewa da ke da alaƙa da asusunka a waɗannan ayyuka. Ba za mu yi amfani da waɗannan bayanai don wani dalili (misali, tallace-tallace) ba, sai dai idan ka ba mu izini a fili."
  text4: "Bisa son rai, za ka iya ba mu ƙasar da kake zaune ta shafin asusunka a shafin rabawa. Za a nuna wannan a bayananka na jama'a kuma za mu yi amfani da shi kawai don dalilan ƙididdiga da bincike. Za a iya cire shi a kowane lokaci a saitunan bayananka."
  text5: "Za ka iya janye amfani da bayanan sirri na asusunka a kowane lokaci ta hanyar goge asusunka ta shafin bayananka a https://share.catrob.at/. Bayan goge asusunka har yanzu za ka iya amfani da ayyukan da aka bayar, amma ba za ka iya haɗa kai ba, misali, ta ɗora shirye-shirye, yin sharhi, ko so. Haka kuma, za a goge duk abubuwan da aka bayar masu alaƙa da asusunka, misali, shirye-shiryen da aka ɗora, sharhi, da sauransu."
  text6: "Don guje wa amfani da ayyukanmu ba daidai ba, misali, ta abubuwan da masu amfani suka ɗora ko sharhi don dalilai na haram, za a adana duk bayanan jama'a da masu amfani suka samar (ɗorawa, sharhi) a cikin rumbun bayanai, tare da lokaci da adireshin intanet da aka yi amfani da shi. Ba za a yi amfani da waɗannan bayanai ko tura su ga wata cibiya ba, sai dai idan ana zargin ayyukan haram sosai kuma cibiyoyin doka masu izini a hukumance suka nema bisa dokar da ta dace. Za mu fara bincika kowace shari'a sosai daban-daban."
  text7: "Za ka iya yin rajista bisa son rai ga Wasiƙar Labarai ta Catrobat, a https://catrob.at/newsletter da muke bayarwa ta sabis ɗin MailChimp (The Rocket Science Group LLC d/b/a MailChimp, Amurka). Daga nan za ka karɓi sabuntawa game da aikin Catrobat da ayyukansa zuwa adireshin imel da ka bayar. Za ka iya janye wasiƙar labarai a kowane lokaci ta amfani da hanyar haɗin \"unsubscribe\" a ƙasan kowace wasiƙar labarai. MailChimp ne ke bayar da wannan wasiƙar labarai, wanda muke da yarjejeniyar sarrafa bayanai da shi kuma ya yi alƙawarin bin Dokar Kare Bayanai ta EU da EU-USA \"Privacy Shield\". Don ƙarin bayani game da MailChimp don Allah duba Manufar Sirri da Sharuɗɗan Amfani na MailChimp."
  text8: "Aikin Catrobat na buɗaɗɗen tushe kyauta ne ke bayar da duk Ayyukan ƙarƙashin laimar International Catrobat Association – Verein zur Förderung freier Software, ƙungiya mara riba mai zaman kanta da aka kafa a Graz, Austria (Tarayyar Turai). Manufofinmu suna girmama dokar kare bayanai ta EU da Austria (GDPR). Don tuntuɓar mu, don Allah aika imel zuwa contact@catrobat.org ko aika mana wasiƙa zuwa Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Tarayyar Turai)."
  text9: "Idan shekarunka ƙasa da 14, dole ne mai kula da kai na doka (yawanci iyaye) ya amince da wannan manufar."
  text10: "Manufar sirri ta hukuma ta Catrobat a harshen Turanci tana samuwa a yanar gizo a %privacy_policy%."
  disagree-text: "Ba tare da amincewa ba, ba za mu iya ƙirƙirar asusu ba amma ainihin fasalolin har yanzu suna samuwa."
