  message: "Masoyi %username%.\nKa nemi sake saita kalmar sirrinka a %appplication_url% saboda ka manta kalmar sirrinka.\nIdan ba kai ka nema ba, don Allah ka yi watsi da shi. Zai ƙare kuma ya zama mara amfani cikin awanni 24.\nDon sake saita kalmar sirrinka da ƙirƙirar sabuwa, don Allah ziyarci shafi mai zuwa: %confirmationUrl%\nZa ka iya amfani da sunan mai amfani da kalmar sirrinka a kowane lokaci don shiga al'ummar %appplication_url%.\nDon yin haka, kawai ziyarci shafi mai zuwa: %loginPage%\nDon gyara bayanan bayananka, je wannan shafi: %profilePage%\nGaisuwa mafi kyau,\nƘungiyar Catrobat.\n"
  messageHtml: "<p>\nMasoyi %username%.<br>\n<br>\nKa nemi sake saita kalmar sirrinka a <a href=\"%appplication_url%\">Pocket Code</a> saboda ka manta kalmar sirrinka.\nIdan ba kai ka nema ba, don Allah ka yi watsi da shi. Zai ƙare kuma ya zama mara amfani cikin awanni 24.<br>\n<br>\nDon sake saita kalmar sirrinka da ƙirƙirar sabuwa, don Allah danna <a href=\"%confirmationUrl%\">nan.</a><br>\n<br>\nZa ka iya amfani da sunan mai amfani da kalmar sirrinka a kowane lokaci don shiga al'ummar <a href=\"%appplication_url%\">Pocket Code</a>.<br>\nDon yin haka, kawai ziyarci shafi mai zuwa: <a href=\"%loginPage%\">Shafin Shiga</a><br>\nDon gyara bayanan bayananka, je wannan <a href=\"%profilePage%\">shafi</a>.<br>\n<br>\nGaisuwa mafi kyau,<br>\nƘungiyar Catrobat.\n</p>\n"
