accountConfirmation:
  subject: Your Catrobat Account Confirmation
  message: "Masoyi %username%.\nDon kammala kunna asusunka - don Allah ziyarci %confirmationUrl%\nZa a iya amfani da wannan hanyar haɗi sau ɗaya kawai don tabbatar da asusunka.\nGaisuwa mafi kyau,\nƘungiyar Catrobat.\n"
  messageHtml: "<p>\nMasoyi %username%.<br>\n<br>\nDon kammala kunna asusunka - don Allah danna <a href=\"%confirmationUrl%\">nan.</a><br>\nZa a iya amfani da wannan hanyar haɗi sau ɗaya kawai don tabbatar da asusunka.<br>\n<br>\nGaisuwa mafi kyau,<br>\nƘungiyar Catrobat.\n</p>\n"
newAccountConfirmation:
  subject: "Tabbatar da adireshin imel ɗinka"
  welcome: "Barka da zuwa Catrobat!"
  greeting: "Na gode da yin rajista! Don Allah tabbatar da adireshin imel ɗinka don farawa."
  message: "Danna maɓallin da ke ƙasa don tabbatar da imel ɗinka. Wannan hanyar haɗi tana aiki har zuwa %time% kuma za a iya amfani da ita sau ɗaya kawai."
  button: "Tabbatar da Adireshin Imel"
  ignore: "Idan ba kai ka ƙirƙiri asusun Catrobat ba, za ka iya watsi da wannan imel."
  autoDelete: "Ana goge asusun da ba a tabbatar ba ta atomatik bayan kwanaki 30."
consent:
  email:
    subject: "Ana buƙatar izinin iyaye don asusun Catrobat na ɗanka"
    title: "Ana Buƙatar Izinin Iyaye"
    greeting: "Sannu,"
    message: "Ɗanka %username% ya ƙirƙiri asusu a Catrobat kuma ya tabbatar da adireshin imel ɗinsa."
    explanation: "Catrobat dandali ne na ilimi kyauta inda matasa ke koyon shirye-shirye ta hanyar ƙirƙirar manhajoji, wasanni da zane-zane masu motsi. Ƙarƙashin dokokin kare yara na EU, muna buƙatar izininka kafin ɗanka ya iya shiga cikin al'umma gaba ɗaya. Don Allah danna maɓallin da ke ƙasa don ba da izini."
    button: "Ba da Izinin Iyaye"
    ignore: "Idan ba ka yi tsammanin wannan imel ba, za ka iya watsi da shi. Ba tare da izini ba, asusun zai sami iyakantaccen aiki."
    whatIsCatrobat: "Catrobat dandali ne na koyon shirye-shirye kyauta, mara riba. Ƙara koyo a catrobat.org."
    manageLink: "Za ka iya sarrafa asusun ɗanka a kowane lokaci ta <a href=\"%portalUrl%\" style=\"color: #00acc1;\">Shafin Iyaye</a>. Ƙara koyo game da <a href=\"%infoUrl%\" style=\"color: #00acc1;\">haƙƙoƙinka a matsayin iyaye</a>."
  confirmed:
    title: "An Ba da Izini"
    message: "Na gode! An kunna asusun %username% gaba ɗaya yanzu."
    continueButton: "Gano ayyuka"
parent:
  footer:
    link: "Iyaye & Masu Kula"
  info:
    title: "Bayani ga Iyaye & Masu Kula"
    intro: "Catrobat tana ɗaukar tsaro da sirrin matasa masu amfani da muhimmanci. Wannan shafi yana bayyana yadda muke kare ɗanka da haƙƙoƙin da kake da su."
    whatIsCatrobat:
      title: "Menene Catrobat?"
      text: "Catrobat dandali ne na ilimi kyauta, mara riba inda matasa ke koyon shirye-shirye ta hanyar ƙirƙirar nasu manhajoji, wasanni da zane-zane masu motsi. Dandalin yana samuwa a duk duniya kuma ana amfani da shi a wuraren ilimi."
    dataCollected:
      title: "Waɗanne bayanai muke tattarawa?"
      text: "Muna tattara mafi ƙarancin bayanan da ake buƙata don gudanar da dandalin: sunan mai amfani, adireshin imel, ranar haihuwa, da duk ayyukan da ɗanka ya ƙirƙira ya ɗora. Ga masu amfani ƙasa da shekara 14, muna kuma adana adireshin imel na iyaye/mai kula don dalilan izini. Ba ma sayar ko raba bayanan sirri da wasu."
    yourRights:
      title: "Haƙƙoƙinka a matsayin iyaye ko mai kula"
      text: "Ƙarƙashin dokokin kare yara na EU (GDPR) da COPPA, kana da haƙƙin: duba bayanan da muke riƙe game da ɗanka, neman kwafin waɗannan bayanai, janye izininka a kowane lokaci (wanda zai takaita asusun), da neman goge asusun ɗanka da duk bayanan da ke da alaƙa har abada."
    minorRestrictions:
      title: "Waɗanne iyakoki ne ke aiki ga asusun ƙananan yara?"
      text: "Masu amfani ƙasa da shekara 16 ba za su iya rubuta ko karanta sharhi ba, bin wasu masu amfani, ko duba abubuwan da aka yiwa alamar ba su dace da yara ba. Har yanzu za su iya ƙirƙira da ɗora ayyuka, bincika ayyukan jama'a, da yin martani ga ayyuka. Waɗannan iyakoki suna nan don samar da yanayin koyo mai aminci."
    manageButton: "Sarrafa Asusun Ɗanka"
  portal:
    title: "Shafin Iyaye"
    description: "Shigar da adireshin imel ɗinka don karɓar amintacciyar hanyar haɗi don sarrafa asusun Catrobat na ɗanka. Za a aika hanyar haɗin zuwa adireshin imel da ka bayar yayin rajista."
    emailLabel: "Adireshin imel ɗinka"
    submitButton: "Aika Hanyar Haɗin Sarrafawa"
    infoLink: "Ƙara Koyo"
    success:
