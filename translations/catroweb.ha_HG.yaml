licenseToPlay:
  link: "Lasisin yin wasa"
  title: "Lasisin yin wasa - Ba da yabo kuma raba"
  text1: "Ka yi tunanin kowane aikin Catrobat wainar biki ne, waina ta musamman da ta zo da girke-girkenta (tubalan shirye-shirye). Duk membobin al'ummar Catrobat suna raba wainarsu tare da girke-girkensu. Wannan yana nufin za ka iya jin daɗin wainar kuma ka koyi yadda za ka yi su da kanka!"
  text2: "Babu girke-girke na sirri: umarnin yadda ake yin waɗannan waina a buɗe suke ga kowa ya yi amfani da su, sake amfani, gyara, kuma su zama abin ƙarfafa sabbin ra'ayoyi... wato waina."
  text3: "Za ka iya cin wainar kuma ka kwafi girke-girken wasu don yin naka, wataƙila da sinadarai daban. Wannan 'yanci ya zo da buƙatu biyu masu sauƙi:"
  text4: "Wajen kafa al'ummar Catrobat, mun yanke shawarar ɗaukar wannan hanya saboda mun yi imani tana tallafa wa koyo da kirkira a cikin al'umma. Ta hanyar raba girke-girke da sinadarai (rubuce-rubuce da zane-zane), mutane za su iya gina kan ra'ayoyin juna kuma kowa zai amfana."
  text5: In designing the Catrobat website, we included features to encourage people to share and to give credit to others. On each project page, you can always download the original scripts for the project. If you remix a project (modifying the scripts or artwork, and sharing the result), we encourage you to give credit in the Project Notes, mentioning the people and project that inspired you.
  text6: "Ƙara koyo game da sharuɗɗan amfani na al'ummar Catrobat ta yanar gizo a %link-termsOfUse%."
  list1:
    item1: "raba wainarka tare da girke-girken"
    item2: "ba da yabo ga waɗanda suka ƙarfafa ka"
  version: "Siga 1.1, 2 ga Afrilu 2013"
termsOfUse:
  title: "Sharuɗɗan Amfani"
  headline: Welcome to the Catrobat Community!
  text1: "A matsayin ɓangare na al'ummar Catrobat, kana raba ayyuka da ra'ayoyi da mutane:"
  text2: "Muna buƙatar taimakonka don sanya wannan al'umma wuri mai tallafi ga kowane memba. Ga yadda za ka taimaka:"
  text3: "Ta hanyar aikin Catrobat muna son haɓaka haɗin kai da ba da damar kirkirar kowa ta haɗu don amfanin dukan bil'adama. Kai ma za ka iya zama memba mai himma na al'ummar Catrobat ta hanyar mayar da ayyukanka ga al'umma a matsayin kyauta, kamar yadda sauran membobi masu himma ke ba ka ayyukansu:"
  text4: "Kyautarmu gare ka:"
  text5: "Sharuɗɗanmu na Amfani da Sabis:"
  list1:
    item1: "daga ƙasashe da al'adu daban-daban"
    item2: "na kowane shekaru (daga ƙananan yara zuwa matasa da kakanni)"
    item3: "da kowane matakin ƙwarewa"
  list2:
    item1: "Ka kasance mai girmamawa. Yayin raba ayyuka, don Allah ka tuna cewa mutane masu shekaru da asali daban-daban za su ga gudummawarka."
    item2: "Give credit. Feel free to make modified versions of other people's projects - just make sure to give them credit. One place to give credit is in your project's credits section. Please see the paragraph below this dotted list for details about modifying projects of other users."
    item3: "Ka kasance mai gaskiya. Kada ka yi kamar wani ne ba kai ba ko ka yi ƙoƙarin yaudarar al'umma."
    item4: "Ka kiyaye bayananka na sirri. Kada ka raba adireshin imel ɗinka, lambar wayarka ko wasu bayanan tuntuɓar sirri."
    item5: "Taimaka wajen kiyaye shafin abokantaka. Idan kana jin wasu za su ɗauki wani aiki ko sharhi a matsayin mugunta, zagi, tashin hankali da yawa, ko bai dace ba ta wata hanya, kawai danna maɓallin 'kai rahoto a matsayin bai dace ba' kuma bar ɗan gajeren bayani. Ƙungiyar Catrobat za ta duba rahotonka kuma za ta iya cire kowane aiki, sharhi ko rubutu."
  list3:
    item1: "Ta hanyar ɗora aiki zuwa shafukanmu, ka yarda kuma ka amince da sanya wannan aiki ƙarƙashin wasu lasisoshi kyauta na ayyukan Catrobat da aka ɗora. Kamar lasisoshin kyauta da tsarin Catrobat kansa ke samuwa gare ka, waɗannan lasisoshin kyauta suna ba kowa haƙƙin koyo daga aikin da wasu suka ɗora a baya da daidaita da yin remix na wannan aiki don gina nasu sabbin wasanni masu ban sha'awa, zane-zane masu motsi, da sauran ayyuka. Wannan yana ba kowa damar 'tsayawa a kan kafaɗun takwarorinsa', ɗaya daga cikinsu kai ne! Aikinka zai amfani dukan duniya kuma ya kasance kyauta ga kowa ya yi amfani da shi, ɗan kama da rubutu da hotuna da masu sa kai daga ko'ina cikin duniya ke ba da gudummawa kyauta ga Wikipedia. Ka ɗauke shi a matsayin kyautarka ga bil'adama: kana ba kowa, kuma duk sauran da ke ɗora aikinsu zuwa shafukanmu suna ba ka. Don haka aikin da aka ɗora kyauta ce mai daraja da mai shi ke ba ka kyauta, da sharaɗin ka shiga cikin al'umma bisa sharuɗɗa iri ɗaya."
    item2: "Ba dole ne ka karɓi kyautar ba; idan ka karɓa, wasu dokoki suna aiki. Amfanin waɗannan dokoki shine za ka iya koyo daga aikin kuma ka gina a kai don yin abubuwa masu kyau fiye da haka da kanka, waɗanda za ka iya, misali, sake ɗorawa zuwa shafukanmu a matsayin naka. Wani amfani kuma shine waɗannan lasisoshi suna tabbatar da cewa ba za a ɗora maka alhakin duk wata matsala da ta taso ga wasu ta hanyar amfani da aikinka ba."
    item3: "Wani muhimmin ƙarin sharaɗi shine ka ba da yabo a fili ga marubutan da ka gina aikinka a kan ayyukansu. A lokaci guda, za mu yi aiki tuƙuru don wasu su gane a fili cewa kai ne ka ba da gudummawar aikinka, ta hanyar ba da yabo ga sunan musamman da ka zaɓa da kanka don wakiltar ka a al'ummar Catrobat, da kuma ba wasu damar nuna godiyarsu gare ka a bainar jama'a saboda ba da aikinka ga kowa, musamman gare su."
    item4: "Don Allah duba %link-licenseUploaded% don ainihin sharuɗɗan doka."
  list4:
    item1: "Muna ba ka duk namu manhajoji da albarkatun Intanet masu alaƙa da tsarin Catrobat, misali, manhajojin da ƙungiyar Catrobat ta rubuta, shafukanmu da albarkatun Intanet, namu lambar tushe mai alaƙa da tsarin Catrobat, da duk ƙarin kayan da aka haɗa kamar, misali, hotuna, sautuka da rubutu, yanzu da nan gaba ƙarƙashin lasisoshin kyauta na Catrobat."
    item2: "Waɗannan lasisoshi suna sanya duk sassan Catrobat kyauta gare ka da kuma 'yanci ta ma'anar ba ka 'yancin amfani da su yadda kake so, tare da 'yan iyakoki kaɗan da ke tabbatar, a tsakanin wasu, cewa tsarin Catrobat zai kasance kyauta kuma mai amfani ga kowa har abada."
    item3: "Don Allah duba %link-licenseToPlay% don ainihin sharuɗɗan doka. Lambar tushe ta tsarin Catrobat da sauran takardu da albarkatu da yawa suna samuwa ta %link-developer%."
  list5:
    item1: "Idan kai, ko, idan shekarunka ƙasa da 13, iyayenka ko masu kula da kai na doka, kuna da alaƙa da wata ƙungiya da ke da hannu ko alhakin keta sirri irin na taru da/ko sa ido na gama-gari, to ba a ba ka damar amfani da manhajojinmu da samun damar ayyukanmu ba. Ainihin cikakkun bayanai na wannan iyaka da wasu keɓancewa an bayyana su a Sashe 4.a da 4.b a %link-termsOfUse%."
    item2: "Idan shekarunka ƙasa da 13, to dole ne ka tambayi iyayenka ko masu kula da kai na doka ko sun ba ka damar amfani da Manhajoji da Ayyukan Catrobat."
    item3: "Muna da haƙƙin ƙin karɓa, goge, ko ɓoye ayyuka, asusun masu amfani, da duk wani kayan dijital da aka ɗora zuwa shafukan Catrobat a kowane lokaci bisa ra'ayinmu kaɗai, misali idan muka gano cewa aiki ya ƙunshi abubuwan da ba su dace ba ko mai amfani yana keta haƙƙoƙin wasu mutane."
    item4: "Ana ba da duk manhajoji da albarkatun Intanet na Catrobat da fatan za su zama masu amfani, amma ba tare da wani garanti ba."
    item5: "Don Allah duba %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service don ainihin bayanin abubuwan da ke sama da wasu ƙarin sharuɗɗan doka."
  bottom1: "Ka dawo nan lokaci zuwa lokaci, saboda koyaushe muna ƙoƙarin inganta Sharuɗɗanmu na Amfani."
  bottom2: "Don Allah aika duk wata shawara game da waɗannan Sharuɗɗan Amfani zuwa %email-webmaster%."
  version: "Siga 1.3, 4 ga Maris 2014"
