passwordRecovery:
  subject: Recuperação da Sua Palavra-Passe do Catrobat
  message: |
    Olá %username%.
    Pediste para repor a tua palavra-passe em %appplication_url% porque te esqueceste dela.
    Se não fizeste este pedido, ignora esta mensagem. O pedido expira e deixa de ser válido dentro de 24 horas.
    Para repores a tua palavra-passe e criares uma nova, visita a seguinte página: %confirmationUrl%
    Podes usar o teu nome de utilizador e a tua palavra-passe a qualquer momento para aceder à comunidade %appplication_url%.
    Para isso, visita a seguinte página: %loginPage%
    Para editares os dados do teu perfil, vai a esta página: %profilePage%
    Cumprimentos,
    A tua equipa Catrobat.
  messageHtml: |
    <p>
    Olá %username%.<br>
    <br>
    Pediste para repor a tua palavra-passe em <a href="%appplication_url%">Pocket Code</a> porque te esqueceste dela.
    Se não fizeste este pedido, ignora esta mensagem. O pedido expira e deixa de ser válido dentro de 24 horas.<br>
    <br>
    Para repores a tua palavra-passe e criares uma nova, clica <a href="%confirmationUrl%">aqui.</a><br>
    <br>
    Podes usar o teu nome de utilizador e a tua palavra-passe a qualquer momento para aceder à comunidade <a href="%appplication_url%">Pocket Code</a>.<br>
    Para isso, visita a seguinte página: <a href="%loginPage%">Página de início de sessão</a><br>
    Para editares os dados do teu perfil, vai a esta <a href="%profilePage%">página</a>.<br>
    <br>
    Cumprimentos,<br>
    A tua equipa Catrobat.
    </p>
