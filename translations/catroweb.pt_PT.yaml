consent:
  email:
    subject: 'É necessário o consentimento parental para a conta Catrobat do teu filho'
    title: 'Consentimento parental necessário'
    greeting: 'Olá,'
    message: 'O teu filho %username% criou uma conta no Catrobat e verificou o seu endereço de email.'
    explanation: 'O Catrobat é uma plataforma educativa gratuita onde os jovens aprendem a programar criando aplicações, jogos e animações. Segundo as regras da UE de proteção de crianças, precisamos do teu consentimento antes de o teu filho poder participar plenamente na comunidade. Clica no botão abaixo para dares o consentimento.'
    button: 'Dar consentimento parental'
    ignore: 'Se não esperavas este email, podes ignorá-lo com segurança. Sem consentimento, a conta terá funcionalidades limitadas.'
    whatIsCatrobat: 'O Catrobat é uma plataforma educativa de programação gratuita e sem fins lucrativos. Sabe mais em catrobat.org.'
    manageLink: 'Podes gerir a conta do teu filho a qualquer momento através do nosso <a href="%portalUrl%" style="color: #00acc1;">Portal para Pais</a>. Sabe mais sobre <a href="%infoUrl%" style="color: #00acc1;">os teus direitos enquanto pai ou mãe</a>.'
  confirmed:
    title: 'Consentimento concedido'
    message: 'Obrigado! A conta de %username% está agora totalmente ativada.'
    continueButton: 'Descobrir projetos'
parent:
  footer:
    link: 'Pais e encarregados de educação'
  info:
    title: 'Informação para pais e encarregados de educação'
    intro: 'O Catrobat leva a sério a segurança e a privacidade dos utilizadores jovens. Esta página explica como protegemos o teu filho e que direitos tens.'
    whatIsCatrobat:
      title: 'O que é o Catrobat?'
      text: 'O Catrobat é uma plataforma educativa gratuita e sem fins lucrativos onde os jovens aprendem programação criando as suas próprias aplicações, jogos e animações. A plataforma está disponível em todo o mundo e é usada em contextos educativos.'
    dataCollected:
      title: 'Que dados recolhemos?'
      text: 'Recolhemos apenas os dados mínimos necessários para operar a plataforma: nome de utilizador, endereço de email, data de nascimento e os projetos que o teu filho cria e carrega. Para utilizadores com menos de 14 anos, guardamos também o endereço de email de um pai ou encarregado de educação para efeitos de consentimento. Não vendemos nem partilhamos dados pessoais com terceiros.'
    yourRights:
      title: 'Os teus direitos enquanto pai, mãe ou encarregado de educação'
      text: 'Segundo as regras da UE de proteção de crianças (RGPD) e a COPPA, tens o direito de: consultar os dados que temos sobre o teu filho, pedir uma cópia desses dados, revogar o teu consentimento a qualquer momento (o que restringe a conta) e pedir a eliminação permanente da conta do teu filho e de todos os dados associados.'
    minorRestrictions:
      title: 'Que restrições se aplicam às contas de menores?'
      text: 'Os utilizadores com menos de 16 anos não podem publicar nem ler comentários, seguir outros utilizadores ou ver conteúdos marcados como não adequados para crianças. Podem continuar a criar e carregar projetos, explorar projetos públicos e reagir a projetos com gostos. Estas restrições existem para proporcionar um ambiente de aprendizagem seguro.'
    manageButton: 'Gerir a conta do teu filho'
  portal:
    title: 'Portal para Pais'
    description: 'Introduz o teu endereço de email para receberes uma ligação segura para gerir a conta Catrobat do teu filho. A ligação será enviada para o endereço de email que indicaste no registo.'
    emailLabel: 'O teu endereço de email'
    submitButton: 'Enviar ligação de gestão'
    infoLink: 'Saber mais'
    success:
      title: 'Verifica a tua caixa de entrada'
      message: 'Se existir uma conta associada a este email, enviámos uma ligação de gestão. Verifica a tua caixa de entrada e segue a ligação para gerires a conta do teu filho.'
  manage:
