privacy-policy:
  header: 'Política de privacidade'
  version: 'Versão 2.2, 17 de outubro de 2019'
  text1: 'Para te oferecermos todas as vantagens dos nossos serviços e da conta associada, é necessário recolher alguns dados teus.'
  text2: 'Para manter e melhorar os nossos serviços (aplicações e sites) e para fazer investigação científica sobre educação em TIC e STEM/STEAM, usamos o Google Analytics, o Crashlytics e o Firebase, todos da Google LLC (EUA), bem como o Dynatrace da Dynatrace LLC (EUA), para obter metadados sobre a utilização dos nossos serviços, por exemplo, informações sobre falhas, marcas temporais, páginas/ecrãs visitados, utilização das nossas aplicações e serviços, sistema operativo usado e informações sobre o fornecedor de rede. Esta análise e os dados recolhidos não estão ligados ao teu perfil e não contêm informações pessoais (os últimos bits do endereço IP são anonimizados). No entanto, os dados recolhidos são transferidos para os prestadores de serviços (Google LLC, EUA, e Dynatrace LLC, EUA). O tratamento de dados baseia-se em acordos com a Google LLC e a Dynatrace LLC. Esta relação com os prestadores de serviços está em conformidade com o Regulamento Geral sobre a Proteção de Dados da União Europeia (RGPD) e com o acordo UE-EUA "Privacy Shield".'
  text3: 'Para criares e usares uma conta nos nossos sistemas, e para te informarmos por email sobre alterações necessárias relativas à tua conta, por exemplo, atualizações ou violações dos nossos Termos de Utilização e Serviço, das regras da comunidade ou das nossas políticas, guardamos o teu nome de utilizador e, se o indicares, o teu endereço de email. Se ligaste a tua conta através do Google Plus ou do Facebook, guardamos também uma chave de identificação associada à tua conta nesses serviços. Não usaremos estes dados para quaisquer outros fins (por exemplo, marketing), a não ser que nos autorizes explicitamente.'
  text4: 'De forma voluntária, podes indicar-nos o teu país de residência através da página da tua conta no site de partilha. Esta informação será mostrada no teu perfil público e só será usada por nós para fins estatísticos e de investigação. Podes removê-la a qualquer momento nas definições do teu perfil.'
  text5: 'Podes retirar a utilização dos dados pessoais associados à tua conta a qualquer momento eliminando a tua conta através da tua página de perfil em https://share.catrob.at/. Depois de eliminares a tua conta, continuarás a poder usar os serviços disponibilizados, mas não a colaborar, por exemplo, carregando programas, comentando ou dando gostos. Além disso, todo o conteúdo associado à tua conta, por exemplo, programas carregados, comentários, etc., será eliminado.'
  text6: 'Para evitar a utilização abusiva dos nossos serviços, por exemplo, através de carregamentos ou comentários de utilizadores para fins ilegais, todos os dados públicos gerados pelos utilizadores (carregamentos, comentários) são guardados internamente numa base de dados, juntamente com uma marca temporal e o endereço de internet usado. Estes dados não serão usados por nem encaminhados para quaisquer instituições, a não ser que existam suspeitas razoáveis de ações suficientemente ilegais e que instituições jurídicas oficialmente autorizadas os peçam com base na legislação aplicável. Cada caso será primeiro analisado cuidadosamente por nós de forma individual.'
  text7: 'Podes subscrever voluntariamente a Newsletter do Catrobat em https://catrob.at/newsletter, disponibilizada por nós através do serviço MailChimp (The Rocket Science Group LLC d/b/a MailChimp, EUA). Passarás então a receber novidades sobre o projeto Catrobat e os seus serviços no endereço de email que indicaste. Podes cancelar a newsletter a qualquer momento através da ligação "cancelar subscrição" no rodapé de cada newsletter. Esta newsletter é disponibilizada pela MailChimp, com quem temos um acordo de tratamento de dados e que se comprometeu com o Regulamento Geral sobre a Proteção de Dados da UE e com o "Privacy Shield" UE-EUA. Para mais detalhes sobre a MailChimp, consulta também a Política de Privacidade e os Termos de Utilização da MailChimp.'
  text8: 'Todos os serviços são disponibilizados pelo projeto livre e de código aberto Catrobat, sob a alçada da International Catrobat Association – Verein zur Förderung freier Software, uma ONG sem fins lucrativos constituída em Graz, Áustria (União Europeia). As nossas políticas respeitam a legislação de proteção de dados da UE e da Áustria (RGPD). Para nos contactares, envia um email para contact@catrobat.org ou escreve-nos para Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Áustria (União Europeia).'
  text9: 'Se tiveres menos de 14 anos, esta política tem de ser aceite por um representante legal (normalmente um dos pais).'
  text10: 'A política de privacidade oficial do Catrobat em inglês está disponível na web em %privacy_policy%.'
  disagree-text: 'Sem aprovação, não podemos criar uma conta, mas as funcionalidades principais continuam acessíveis.'
