licenseToPlay:
  link: 'Jolasteko lizentzia'
  title: 'Jolasteko lizentzia - Aitortu egilea eta partekatu'
  text1: 'Imajinatu Catrobat proiektu bakoitza tarta bat dela, tarta oso berezi bat, bere errezetarekin (programazio-blokeak) datorrena. Catrobat komunitateko kide guztiek beren tartak partekatzen dituzte errezetekin batera. Horrek esan nahi du tartaz goza dezakezula eta zuk zeuk nola egiten diren ikas dezakezula!'
  text2: 'Ez dago errezeta sekreturik: tarta hauek egiteko argibideak edonork erabil, berrerabil eta alda ditzake, eta ideia berrietarako inspirazio izan daitezke... tarta berrietarako, nahi dut esan.'
  text3: 'Tartak jan ditzakezu, baita besteen errezetak kopiatu ere zureak egiteko, agian beste osagai batzuekin. Askatasun horrek bi baldintza sinple ditu:'
  text4: 'Catrobat komunitatea sortzean, ikuspegi hau hartzea erabaki genuen, komunitatean ikaskuntza eta sormena sustatzen dituela uste dugulako. Errezetak eta osagaiak (scriptak eta artelanak) partekatuz, jendeak besteen ideiak oinarritzat har ditzake eta denek irabazten dute.'
  text5: 'Catrobat webgunea diseinatzean, jendea partekatzera eta besteei aitorpena ematera bultzatzeko eginbideak sartu genituen. Proiektu bakoitzaren orrian, beti deskarga ditzakezu proiektuaren jatorrizko scriptak. Proiektu bat remixatzen baduzu (scriptak edo artelanak aldatu eta emaitza partekatu), proiektuaren oharretan aitorpena ematera animatzen zaitugu, inspiratu zaituzten pertsonak eta proiektua aipatuz.'
  text6: 'Jakin gehiago Catrobat lineako komunitatearen erabilera-baldintzei buruz hemen: %link-termsOfUse%.'
  list1:
    item1: 'partekatu zure tartak errezetarekin batera'
    item2: 'eman aitorpena inspiratu zaituztenei'
  version: '1.1 bertsioa, 2013ko apirilaren 2a'
termsOfUse:
  title: 'Erabilera-baldintzak'
  headline: 'Ongi etorri Catrobat komunitatera!'
  text1: 'Catrobat komunitateko kide zaren aldetik, proiektuak eta ideiak partekatzen ari zara pertsona hauekin:'
  text2: 'Zure laguntza behar dugu komunitate hau kide guztientzat leku babeslea izan dadin. Hona hemen nola lagun dezakezun:'
  text3: 'Catrobat proiektuaren bidez lankidetza sustatu nahi dugu eta guztion sormena batzea gizateria osoaren onurarako. Zu ere Catrobat komunitateko kide aktibo bihur zaitezke zure proiektuak komunitateari opari gisa itzuliz, beste kide aktibo batzuek beren proiektuak zuri ematen dizkizuten modu berean:'
  text4: 'Gure oparia zuri:'
  text5: 'Gure erabilera- eta zerbitzu-baldintzak:'
  list1:
    item1: 'herrialde eta kultura askotakoak'
    item2: 'adin guztietakoak (haur txikietatik nerabe eta aitona-amonetaraino)'
    item3: 'esperientzia-maila guztietakoak'
  list2:
    item1: 'Izan errespetuzkoa. Proiektuak partekatzean, gogoratu adin eta jatorri askotako pertsonek ikusiko dituztela zure ekarpenak.'
    item2: 'Eman aitorpena. Egin lasai beste pertsonen proiektuen bertsio aldatuak, baina ziurtatu aitorpena ematen diezula. Aitorpena emateko leku bat zure proiektuaren oharren eta kredituen atala da. Ikusi zerrenda honen azpiko paragrafoa beste erabiltzaileen proiektuak aldatzeari buruzko xehetasunetarako.'
    item3: 'Izan zintzoa. Ez egin beste norbait zarenik eta ez saiatu komunitatea engainatzen.'
    item4: 'Gorde informazio pertsonala pribatuan. Ez partekatu zure helbide elektronikoa, telefono-zenbakia edo beste harremanetarako datu pertsonalik.'
    item5: 'Lagundu gunea atsegina izaten. Uste baduzu beste batzuek proiektu edo iruzkin bat gaiztoa, iraingarria, bortitzegia edo bestela desegokia irudituko zaiela, egin klik ''salatu desegoki gisa'' botoian eta utzi azalpen labur bat. Catrobat taldeak zure salaketa aztertuko du eta edozein proiektu, iruzkin edo argitalpen ken dezake.'
  list3:
    item1: 'Proiektu bat gure webguneetara igotzean, onartzen duzu lan hori igotako Catrobat proiektuen lizentzia libre jakin batzuen pean jartzea. Catrobat sistema bera zuretzat eskuragarri dagoen lizentzia libreen antzera, igotako Catrobat proiektuen lizentzia libre hauek denei ematen diete besteek aurretik igotako lanetatik ikasteko eta lan hori egokitu eta remixatzeko eskubidea, beren joko, animazio eta beste proiektu liluragarri berriak sortzeko. Horri esker, denek ''kideen sorbalden gainean jarrita'' egon daitezke, eta horietako bat zu zara! Horrela, zure lanak mundu osoari egingo dio mesede eta libre jarraituko du denek erabiltzeko, mundu osoko boluntarioek Wikipediari libreki emandako testu eta irudien antzera. Pentsa ezazu gizateriari egindako opari bat dela: zuk denei ematen diezu, eta beren lana gure webguneetara igotzen duten beste guztiek zuri ematen dizute. Beraz, igotako proiektu bat balio handiko oparia da, bere jabeak doan ematen dizuna, komunitatean baldintza berberetan parte hartzeko baldintzarekin.'
    item2: 'Ez duzu oparia onartu beharrik; onartzen baduzu, arau jakin batzuk aplikatzen dira. Arau hauen abantailak dira lanetik ikas dezakezula eta haren gainean eraiki zuk zeuk gauza are politagoak egiteko, gero, adibidez, berriro gure webguneetara zure lan gisa igo ditzakezunak. Beste abantaila bat da lizentzia hauek bermatzen dutela ezin zaizula erantzukizunik eskatu besteei zure proiektua erabiltzeagatik sor dakizkiekeen arazoengatik.'
    item3: 'Baldintza gehigarri garrantzitsu bat da argi eta garbi aitortu behar dituzula zure lanaren oinarri izan diren lanen egileak. Aldi berean, gogor lan egingo dugu besteek argi ikus dezaten zure lana zuk egindako ekarpena dela, Catrobaten komunitatean zu ordezkatzeko libreki aukeratu duzun izen bakarra aitortuz, eta besteei aukera emanez zure lana denei, eta bereziki haiei, emateagatik esker ona publikoki adierazteko.'
    item4: 'Xehetasun legalei eta baldintzei buruz argibide gehiago %link-licenseUploaded%-en aurkituko dituzu.'
  list4:
    item1: 'Catrobat sistemarekin lotutako gure software eta Interneteko baliabide guztiak eskaintzen dizkizugu, orain eta etorkizunean, Catrobaten lizentzia libreen pean; adibidez, Catrobat taldeak idatzitako softwarea, gure webguneak eta Interneteko baliabideak, Catrobat sistemarekin lotutako gure iturburu-kodea eta barne hartutako material gehigarri guztiak, hala nola irudiak, soinuak eta testuak.'
    item2: 'Lizentzia hauei esker, Catrobaten zati guztiak doakoak dira zuretzat, eta libreak ere bai, nahi duzun moduan erabiltzeko askatasuna ematen dizutelako, murrizketa gutxi batzuekin, besteak beste, Catrobat sistema betiko libre eta denentzat erabilgarri izango dela bermatzeko.'
    item3: 'Kontsultatu %link-licenseToPlay% lege-baldintza zehatzetarako. Catrobat sistemaren iturburu-kodea eta beste dokumentu eta baliabide asko %link-developer% bidez daude eskuragarri.'
  list5:
    item1: 'Zu, edo 13 urtetik beherakoa bazara zure gurasoak edo legezko tutoreak, pribatutasunaren urraketa masiboetan eta/edo zelatatze masiboan inplikatutako edo horien erantzule den erakunde batekin lotuta bazaudete, ez duzu gure software-aplikazioak erabiltzeko eta gure zerbitzuetara sartzeko baimenik. Murrizketa honen xehetasun zehatzak eta salbuespen batzuk gure %link-termsOfUse% orriko 4.a eta 4.b ataletan azaltzen dira.'
    item2: '13 urtetik beherakoa bazara, zure gurasoei edo legezko tutoreei galdetu behar diezu ea Catrobaten software-aplikazioak eta zerbitzuak erabiltzen uzten dizuten.'
    item3: 'Eskubidea gordetzen dugu Catrobaten webguneetara igotako proiektuak, erabiltzaile-kontuak eta edozein material digital edozein unetan baztertu, ezabatu edo ezkutatzeko, gure irizpidearen arabera soilik; adibidez, proiektu batek material desegokia duela edo erabiltzaile batek beste pertsonen eskubideak urratzen dituela ikusten badugu.'
    item4: 'Catrobaten software eta Interneteko baliabide guztiak erabilgarriak izango direlakoan eskaintzen dira, baina inolako bermerik gabe.'
    item5: 'Kontsultatu gure %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service goiko puntuen formulazio zehatzetarako eta lege-baldintza gehigarri batzuetarako.'
  bottom1: 'Itzuli hona noizean behin, beti saiatzen ari garelako gure erabilera-baldintzak hobetzen.'
  bottom2: 'Bidali erabilera-baldintza hauei buruzko iradokizunak %email-webmaster% helbidera.'
  version: '1.3 bertsioa, 2014ko martxoaren 4a'
