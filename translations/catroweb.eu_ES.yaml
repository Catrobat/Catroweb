  text: '%project_count% proiektu harrigarri partekatu dira dagoeneko, eta hurrengoa zurea izan daiteke. Deskargatu gure aplikazioa eta hasi gaur bertan sortzen'
privacy-policy:
  header: 'Pribatutasun-politika'
  version: '2.2 bertsioa, 2019ko urriaren 17a'
  text1: 'Gure zerbitzuen eta lotutako kontuaren abantaila guztiak eskaintzeko, beharrezkoa da zuri buruzko datu batzuk biltzea.'
  text2: 'Gure zerbitzuak (aplikazioak eta webguneak) mantendu eta hobetzeko eta IKTei eta STEM/STEAM hezkuntzari buruzko ikerketa zientifikoa egiteko, Google Analytics, Crashlytics eta Firebase erabiltzen ditugu, guztiak Google LLC enpresarenak (AEB), baita Dynatrace ere, Dynatrace LLC enpresarena (AEB), gure zerbitzuen erabilerari buruzko metadatuak lortzeko; adibidez, hutsegiteen informazioa, denbora-zigiluak, bisitatutako orriak/pantailak, gure aplikazio eta zerbitzuen erabilera, erabilitako sistema eragilea eta sare-hornitzaileari buruzko informazioa. Analisi hau eta bildutako datuak ez daude zure profilarekin lotuta eta ez dute informazio pertsonalik (IP helbidearen azken bitak anonimizatu egiten dira). Hala ere, bildutako datuak zerbitzu-hornitzaileei transferituko zaizkie (Google LLC, AEB eta Dynatrace LLC, AEB). Datuen tratamendua Google LLC eta Dynatrace LLC enpresekin egindako akordioetan oinarritzen da. Zerbitzu-hornitzaileekiko harreman hau Europar Batasuneko Datuak Babesteko Erregelamendu Orokorrarekin (EB DBEO) eta EB-AEB "Privacy Shield" akordioarekin bat dator.'
  text3: 'Gure sistemetan kontu bat sortu eta erabiltzeko, eta zure kontuari buruzko beharrezko aldaketen berri posta elektronikoz emateko (adibidez, eguneraketak edo gure erabilera- eta zerbitzu-baldintzen, komunitate-arauen edo politiken urraketak), zure erabiltzaile-izena eta, ematen baduzu, zure helbide elektronikoa gordeko ditugu. Zure kontua Google Plus edo Facebook bidez konektatu baduzu, zerbitzu horietako zure kontuari lotutako identifikazio-gako bat ere gordetzen dugu. Ez ditugu datu hauek beste helburu batzuetarako (adibidez, marketinerako) erabiliko, berariaz baimentzen ez badiguzu.'
  text4: 'Borondatez, zure bizileku-herrialdea eman diezaguke partekatze-guneko zure kontuaren orriaren bidez. Zure profil publikoan bistaratuko da eta guk helburu estatistiko eta ikerketakoetarako soilik erabiliko dugu. Edozein unetan ken dezakezu zure profilaren ezarpenetan.'
  text5: 'Zure kontuari dagozkion datu pertsonalen erabilera edozein unetan ezezta dezakezu zure kontua ezabatuz https://share.catrob.at/ guneko zure profilaren orriaren bidez. Zure kontua ezabatu ondoren, emandako zerbitzuak erabiltzen jarraitu ahal izango duzu, baina ez lankidetzan aritu, adibidez, programak igoz, iruzkinak eginez edo atsegiteak emanez. Gainera, zure kontuari lotutako eduki guztia (adibidez, igotako programak, iruzkinak, etab.) ezabatu egingo da.'
  text6: 'Gure zerbitzuen erabilera okerra saihesteko (adibidez, erabiltzaileek legez kanpoko helburuetarako egindako igoerak edo iruzkinak), erabiltzaileek sortutako datu publiko guztiak (igoerak, iruzkinak) barneko datu-base batean gordeko dira, denbora-zigilu batekin eta erabilitako Interneteko helbidearekin batera. Datu hauek ez dira inolako erakundek erabiliko edo inolako erakunderi bidaliko, legez kanpoko ekintzen susmo nahikoa ez badago eta legez horretarako eskumena duten erakundeek aplikatu beharreko legean oinarrituta eskatzen ez badituzte. Kasu bakoitza guk aztertuko dugu lehenik, banan-banan eta sakon.'
  text7: 'Borondatez, Catrobat buletinera harpidetu zaitezke https://catrob.at/newsletter helbidean; guk MailChimp zerbitzuaren bidez eskaintzen dugu (The Rocket Science Group LLC d/b/a MailChimp, AEB). Orduan, Catrobat proiektuari eta haren zerbitzuei buruzko berriak jasoko dituzu emandako helbide elektronikoan. Buletinari edozein unetan uko egin diezaiokezu buletin bakoitzaren oinean dagoen "harpidetza kendu" estekaren bidez. Buletin hau MailChimp-ek eskaintzen du; harekin datuen tratamendurako akordioa dugu eta EBko Datuak Babesteko Erregelamendu Orokorra eta EB-AEB "Privacy Shield" betetzeko konpromisoa hartu du. MailChimp-i buruzko xehetasun gehiagorako, kontsultatu MailChimp-en pribatutasun-politika eta erabilera-baldintzak.'
  text8: 'Zerbitzu guztiak Catrobat kode irekiko proiektu libreak eskaintzen ditu, International Catrobat Association – Verein zur Förderung freier Software elkartearen babespean, Grazen (Austria, Europar Batasuna) eratutako irabazi-asmorik gabeko GKE bat. Gure politikek EBko eta Austriako datuak babesteko legea (DBEO) errespetatzen dute. Gurekin harremanetan jartzeko, bidali mezu elektroniko bat contact@catrobat.org helbidera edo idatzi helbide honetara: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Europar Batasuna).'
  text9: '14 urtetik beherakoa bazara, legezko tutore batek (normalean guraso batek) onartu behar du politika hau.'
  text10: 'Catrobaten ingelesezko pribatutasun-politika ofiziala sarean dago eskuragarri hemen: %privacy_policy%.'
  disagree-text: 'Onarpenik gabe ezin dugu konturik sortu, baina oinarrizko eginbideak erabilgarri daude oraindik.'
