consent:
  email:
    subject: 'Gurasoen baimena behar da zure seme-alabaren Catrobat konturako'
    title: 'Gurasoen baimena behar da'
    greeting: 'Kaixo:'
    message: 'Zure seme-alabak, %username%-(e)k, Catrobaten kontu bat sortu du eta bere helbide elektronikoa egiaztatu du.'
    explanation: 'Catrobat plataforma hezitzaile doakoa da, non gazteek programatzen ikasten duten aplikazioak, jokoak eta animazioak sortuz. EBko haurren babeserako araudiaren arabera, zure baimena behar dugu zure seme-alabak komunitatean guztiz parte hartu ahal izan dezan. Egin klik beheko botoian baimena emateko.'
    button: 'Eman gurasoen baimena'
    ignore: 'Mezu hau espero ez bazenuen, alde batera utz dezakezu. Baimenik gabe, kontuak funtzionalitate mugatua izango du.'
    whatIsCatrobat: 'Catrobat irabazi-asmorik gabeko programazio-plataforma hezitzaile doakoa da. Informazio gehiago catrobat.org-en.'
    manageLink: 'Zure seme-alabaren kontua edozein unetan kudea dezakezu gure <a href="%portalUrl%" style="color: #00acc1;">Gurasoen atariaren</a> bidez. Jakin gehiago <a href="%infoUrl%" style="color: #00acc1;">guraso gisa dituzun eskubideei</a> buruz.'
  confirmed:
    title: 'Baimena emanda'
    message: 'Eskerrik asko! %username%-(r)en kontua guztiz aktibatuta dago orain.'
    continueButton: 'Aurkitu proiektuak'
parent:
  footer:
    link: 'Gurasoak eta tutoreak'
  info:
    title: 'Gurasoentzako eta tutoreentzako informazioa'
    intro: 'Catrobatek serio hartzen ditu erabiltzaile gazteen segurtasuna eta pribatutasuna. Orri honetan azaltzen da nola babesten dugun zure seme-alaba eta zer eskubide dituzun.'
    whatIsCatrobat:
      title: 'Zer da Catrobat?'
      text: 'Catrobat irabazi-asmorik gabeko plataforma hezitzaile doakoa da, non gazteek programatzen ikasten duten beren aplikazioak, jokoak eta animazioak sortuz. Plataforma mundu osoan dago eskuragarri eta hezkuntza-inguruneetan erabiltzen da.'
    dataCollected:
      title: 'Zer datu biltzen ditugu?'
      text: 'Plataforma funtzionarazteko behar diren gutxieneko datuak biltzen ditugu: erabiltzaile-izena, helbide elektronikoa, jaiotze-data eta zure seme-alabak sortu eta igotzen dituen proiektuak. 14 urtetik beherako erabiltzaileen kasuan, guraso edo tutore baten helbide elektronikoa ere gordetzen dugu baimena kudeatzeko. Ez ditugu datu pertsonalak saltzen ezta hirugarrenekin partekatzen ere.'
    yourRights:
      title: 'Guraso edo tutore gisa dituzun eskubideak'
      text: 'EBko haurren babeserako araudiaren (DBEO) eta COPPAren arabera, eskubide hauek dituzu: zure seme-alabari buruz ditugun datuak berrikustea, datu horien kopia bat eskatzea, zure baimena edozein unetan ezeztatzea (horrek kontua mugatzen du) eta zure seme-alabaren kontua eta lotutako datu guztiak betiko ezabatzeko eskatzea.'
    minorRestrictions:
      title: 'Zer murrizketa aplikatzen zaizkie adingabeen kontuei?'
      text: '16 urtetik beherako erabiltzaileek ezin dute iruzkinik argitaratu edo irakurri, beste erabiltzaileak jarraitu, ezta haurrentzat egokia ez den gisa markatutako edukia ikusi ere. Hala ere, proiektuak sortu eta igo ditzakete, proiektu publikoak arakatu eta proiektuei atsegite bidez erreakzionatu. Murrizketa hauen helburua ikasteko ingurune segurua eskaintzea da.'
    manageButton: 'Kudeatu zure seme-alabaren kontua'
  portal:
    title: 'Gurasoen ataria'
    description: 'Idatzi zure helbide elektronikoa zure seme-alabaren Catrobat kontua kudeatzeko esteka seguru bat jasotzeko. Esteka erregistroan emandako helbide elektronikora bidaliko da.'
    emailLabel: 'Zure helbide elektronikoa'
    submitButton: 'Bidali kudeaketa-esteka'
    infoLink: 'Jakin gehiago'
    success:
