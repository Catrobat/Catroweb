passwordRecovery:
  subject: Zure Catrobateko pasahitzaren berreskurapena.
  message: |
    %username% maitea.
    Zure pasahitza aldatzeko eskatu duzu %appplication_url%-(e)n, dirudienez ahaztu egin duzulako.
    Eskaera ez baduzu zuk egin, ez egin kasu. 24 ordutan balio gabe geratuko da eskaera.
    Pasahitza ezabatu eta berri bat sortzeko, joan honako orrialde honetara: %confirmationUrl%
    Zure erabiltzaile izena eta pasahitza erabiltzen jarritu dezakezu %appplication_url% komunitatean parte hartzeko.
    Hori lortzeko, bisitatu honako orrialde hau: %loginPage%
    Zure profileko zehetasunak aldatzeko, joan orrialde honetara: %profilePage%
    Ongi izan,
    Cstrobaten taldea.
  messageHtml: |
    <p>
    %username% maitea.<br>
    <br>
    Zure pasahitza ahaztu duzulako, <a href="%appplication_url%">Pocket Code</a>-n pasahitza berrezartzeko eskatu duzu.
    Zuk eskatu ez baduzu, ez egin kasurik. 24 orduren buruan iraungi egingo da eta ez du balioko.<br>
    <br>
    Zure pasahitza berrezarri eta berri bat sortzeko, egin klik <a href="%confirmationUrl%">hemen.</a><br>
    <br>
    Zure erabiltzaile-izena eta pasahitza edozein unetan erabil ditzakezu <a href="%appplication_url%">Pocket Code</a> komunitatean sartzeko.<br>
    Horretarako, joan orri honetara: <a href="%loginPage%">Saio-hasierako orria</a><br>
    Zure profilaren xehetasunak editatzeko, joan <a href="%profilePage%">orri honetara</a>.<br>
    <br>
    Ongi izan,<br>
    Catrobat taldea.
    </p>
