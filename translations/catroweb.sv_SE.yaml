privacy-policy:
  header: Integritetspolicy
  version: Version 2.2, 17 oktober 2019
  text1: 'För att kunna erbjuda dig alla fördelar med våra tjänster och det tillhörande kontot behöver vi samla in vissa uppgifter om dig.'
  text2: 'För att underhålla och förbättra våra tjänster (appar och webbplatser) och för att bedriva vetenskaplig forskning om IKT- och STEM/STEAM-utbildning använder vi Google Analytics, Crashlytics och Firebase, alla från Google LLC (USA), samt Dynatrace från Dynatrace LLC (USA) för att få metadata om hur våra tjänster används, t.ex. kraschinformation, tidsstämplar, besökta sidor/skärmar, användning av våra appar och tjänster, använt operativsystem och information om nätverksleverantören. Analysen och de insamlade uppgifterna är inte kopplade till din profil och innehåller inga personuppgifter (de sista delarna av IP-adressen anonymiseras). De insamlade uppgifterna överförs dock till tjänsteleverantörerna (Google LLC, USA och Dynatrace LLC, USA). Databehandlingen bygger på avtal med Google LLC och Dynatrace LLC. Förhållandet till tjänsteleverantörerna följer EU:s allmänna dataskyddsförordning (EU GDPR) och avtalet "Privacy Shield" mellan EU och USA.'
  text3: 'För att skapa och använda ett konto i våra system och för att informera dig via e-post om nödvändiga ändringar som rör ditt konto, t.ex. uppdateringar eller överträdelser av våra användarvillkor, våra communityregler eller våra policyer, sparar vi ditt användarnamn och, om du har angett den, din e-postadress. Om du har kopplat ditt konto via Google Plus eller Facebook sparar vi dessutom en identifieringsnyckel som är kopplad till ditt konto på dessa tjänster. Vi använder inte dessa uppgifter för några andra ändamål (t.ex. marknadsföring) om du inte uttryckligen har gett oss tillåtelse till det.'
  text4: 'Du kan frivilligt ange ditt bosättningsland via din kontosida på delningssidan. Det visas då på din offentliga profil och används av oss endast för statistik och forskning. Du kan när som helst ta bort det i dina profilinställningar.'
  text5: 'Du kan när som helst återkalla användningen av personuppgifterna som hör till ditt konto genom att ta bort ditt konto via din profilsida på https://share.catrob.at/. När du har tagit bort ditt konto kan du fortfarande använda tjänsterna, men inte samarbeta, t.ex. genom att ladda upp program, kommentera eller gilla. Allt innehåll som är kopplat till ditt konto, t.ex. uppladdade program, kommentarer osv., tas också bort.'
  text6: 'För att förhindra missbruk av våra tjänster, t.ex. genom uppladdningar eller kommentarer från användare i olagliga syften, sparas all offentlig data som användare skapar (uppladdningar, kommentarer) internt i en databas tillsammans med en tidsstämpel och den använda internetadressen. Dessa uppgifter används inte av och lämnas inte vidare till några institutioner, såvida det inte finns rimlig misstanke om tillräckligt allvarliga olagliga handlingar och officiellt behöriga rättsliga instanser begär dem med stöd av gällande lag. Varje fall granskas först noggrant och individuellt av oss.'
  text7: 'Du kan frivilligt prenumerera på Catrobats nyhetsbrev på https://catrob.at/newsletter, som vi tillhandahåller via tjänsten MailChimp (The Rocket Science Group LLC d/b/a MailChimp, USA). Du får då uppdateringar om Catrobat-projektet och dess tjänster till den e-postadress du har angett. Du kan när som helst avsluta nyhetsbrevet via länken "unsubscribe" längst ner i varje nyhetsbrev. Nyhetsbrevet tillhandahålls av MailChimp, som vi har ett personuppgiftsbiträdesavtal med och som har förbundit sig att följa EU:s allmänna dataskyddsförordning och "Privacy Shield" mellan EU och USA. Mer information om MailChimp finns i MailChimps integritetspolicy och användarvillkor.'
  text8: 'Alla tjänster tillhandahålls av det fria Catrobat-projektet med öppen källkod under paraplyet International Catrobat Association – Verein zur Förderung freier Software, en ideell organisation registrerad i Graz, Österrike (Europeiska unionen). Våra policyer följer EU:s och Österrikes dataskyddslagstiftning (GDPR). Kontakta oss genom att mejla contact@catrobat.org eller skicka post till Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Europeiska unionen).'
  text9: 'Om du är under 14 år måste den här policyn godkännas av en vårdnadshavare (oftast en förälder).'
  text10: 'Catrobats officiella integritetspolicy på engelska finns på webben under %privacy_policy%.'
  disagree-text: 'Utan godkännande kan vi inte skapa något konto, men de grundläggande funktionerna är fortfarande tillgängliga.'
