passwordRecovery:
  subject: 'Återställning av ditt Catrobat-lösenord'
  message: |
    Hej %username%!
    Du har begärt att återställa ditt lösenord på %appplication_url% eftersom du har glömt det.
    Om du inte har begärt detta kan du ignorera det. Begäran upphör att gälla efter 24 timmar.
    För att återställa ditt lösenord och skapa ett nytt, besök följande sida: %confirmationUrl%
    Du kan när som helst använda ditt användarnamn och lösenord för att komma åt %appplication_url%-communityn.
    Besök i så fall följande sida: %loginPage%
    För att redigera dina profiluppgifter, gå till den här sidan: %profilePage%
    Vänliga hälsningar,
    Catrobat-teamet.
  messageHtml: |
    <p>
    Hej %username%!<br>
    <br>
    Du har begärt att återställa ditt lösenord på <a href="%appplication_url%">Pocket Code</a> eftersom du har glömt det.
    Om du inte har begärt detta kan du ignorera det. Begäran upphör att gälla efter 24 timmar.<br>
    <br>
    För att återställa ditt lösenord och skapa ett nytt, klicka <a href="%confirmationUrl%">här.</a><br>
    <br>
    Du kan när som helst använda ditt användarnamn och lösenord för att komma åt <a href="%appplication_url%">Pocket Code</a>-communityn.<br>
    Besök i så fall följande sida: <a href="%loginPage%">Inloggningssida</a><br>
    För att redigera dina profiluppgifter, gå till den här <a href="%profilePage%">sidan</a>.<br>
    <br>
    Vänliga hälsningar,<br>
    Catrobat-teamet.
    </p>
