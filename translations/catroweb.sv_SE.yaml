consent:
  email:
    subject: 'Föräldrars samtycke behövs för ditt barns Catrobat-konto'
    title: 'Föräldrars samtycke krävs'
    greeting: 'Hej,'
    message: 'Ditt barn %username% har skapat ett konto på Catrobat och verifierat sin e-postadress.'
    explanation: 'Catrobat är en kostnadsfri utbildningsplattform där unga lär sig programmera genom att skapa appar, spel och animationer. Enligt EU:s regler om skydd av barn behöver vi ditt samtycke innan ditt barn kan delta fullt ut i communityn. Klicka på knappen nedan för att ge ditt samtycke.'
    button: 'Ge föräldrasamtycke'
    ignore: 'Om du inte väntade dig det här mejlet kan du lugnt ignorera det. Utan samtycke har kontot begränsade funktioner.'
    whatIsCatrobat: 'Catrobat är en kostnadsfri, ideell plattform för programmeringsutbildning. Läs mer på catrobat.org.'
    manageLink: 'Du kan när som helst hantera ditt barns konto via vår <a href="%portalUrl%" style="color: #00acc1;">föräldraportal</a>. Läs mer om <a href="%infoUrl%" style="color: #00acc1;">dina rättigheter som förälder</a>.'
  confirmed:
    title: 'Samtycke givet'
    message: 'Tack! %username%s konto är nu helt aktiverat.'
    continueButton: 'Upptäck projekt'
parent:
  footer:
    link: 'Föräldrar och vårdnadshavare'
  info:
    title: 'Information för föräldrar och vårdnadshavare'
    intro: 'Catrobat tar unga användares säkerhet och integritet på allvar. Den här sidan förklarar hur vi skyddar ditt barn och vilka rättigheter du har.'
    whatIsCatrobat:
      title: 'Vad är Catrobat?'
      text: 'Catrobat är en kostnadsfri, ideell utbildningsplattform där unga lär sig programmera genom att skapa egna appar, spel och animationer. Plattformen finns tillgänglig i hela världen och används i undervisning.'
    dataCollected:
      title: 'Vilka uppgifter samlar vi in?'
      text: 'Vi samlar bara in de uppgifter som behövs för att driva plattformen: användarnamn, e-postadress, födelsedatum och de projekt ditt barn skapar och laddar upp. För användare under 14 år sparar vi även en e-postadress till en förälder/vårdnadshavare för samtycket. Vi säljer inte och delar inte personuppgifter med tredje part.'
    yourRights:
      title: 'Dina rättigheter som förälder eller vårdnadshavare'
      text: 'Enligt EU:s regler om skydd av barn (GDPR) och COPPA har du rätt att: granska de uppgifter vi har om ditt barn, begära en kopia av uppgifterna, när som helst återkalla ditt samtycke (vilket begränsar kontot) och begära att ditt barns konto och alla tillhörande uppgifter tas bort permanent.'
    minorRestrictions:
      title: 'Vilka begränsningar gäller för minderårigas konton?'
      text: 'Användare under 16 år kan inte skriva eller läsa kommentarer, följa andra användare eller se innehåll som markerats som olämpligt för barn. De kan fortfarande skapa och ladda upp projekt, bläddra bland offentliga projekt och reagera på projekt med gillningar. Begränsningarna finns för att ge en trygg lärmiljö.'
    manageButton: 'Hantera ditt barns konto'
  portal:
    title: 'Föräldraportal'
    description: 'Ange din e-postadress för att få en säker länk där du kan hantera ditt barns Catrobat-konto. Länken skickas till den e-postadress som angavs vid registreringen.'
    emailLabel: 'Din e-postadress'
    submitButton: 'Skicka hanteringslänk'
    infoLink: 'Läs mer'
    success:
      title: 'Kolla din inkorg'
      message: 'Om ett konto är kopplat till den här e-postadressen har vi skickat en hanteringslänk. Kolla din inkorg och följ länken för att hantera ditt barns konto.'
  manage:
    title: 'Hantera barnkonton'
    description: 'Du hanterar konton som är kopplade till %email%.'
    consentStatus: 'Samtyckesstatus'
    accountCreated: 'Konto skapat'
    email: 'Barnets e-postadress'
    status:
      granted: 'Givet'
      pending: 'Väntar'
      revoked: 'Återkallat'
    grantButton: 'Ge samtycke'
    revokeButton: 'Återkalla samtycke'
    revokeConfirm: 'Är du säker på att du vill återkalla samtycket? Kontot kommer att ha begränsade funktioner.'
    exportButton: 'Exportera data'
    deleteButton: 'Ta bort konto'
    deleteConfirm: 'Är du säker på att du vill ta bort det här kontot permanent? Det går inte att ångra.'
