footer:
  title: 'Ka nnipa %user_count% a wɔwɔ nsaanodwuma adwene ho!'
  text: 'Wɔakyɛ nnwuma a ɛyɛ nwonwa %project_count% dada, na deɛ ɛdi hɔ no bɛtumi ayɛ wo deɛ. Twe yɛn app no na fi ase yɛ biribi ɛnnɛ'
privacy-policy:
  header: Privacy Policy
  version: 'Nsesaeɛ 2.2, Ahinime 17, 2019'
  text1: 'Sɛnea yɛbɛma wo yɛn som ne akawnt a ɛka ho mfasoɔ nyinaa no, ɛho hia sɛ yɛboaboa wo ho nsɛm bi ano.'
  text2: 'Sɛnea yɛbɛhwɛ yɛn som (apps ne websites) so na yɛama ayɛ yie, na yɛayɛ ICT ne STEM/STEAM nwomasua ho nhwehwɛmu no, yɛde Google Analytics, Crashlytics ne Firebase, a ɛyɛ Google LLC (USA) deɛ, ne Dynatrace a ɛyɛ Dynatrace LLC (USA) deɛ di dwuma de nya metadata fa sɛnea wɔde yɛn som di dwuma ho, te sɛ crash nsɛm, berɛ, nkrataafa a wɔakɔ so, sɛnea wɔde yɛn apps di dwuma, operating system, ne network provider ho nsɛm. Saa nhwehwɛmu ne nsɛm yi mfa wo profaele ho na ɛnkura wo ankasa nsɛm biara (IP address no awieeɛ fa no yɛ kokoam). Nanso, wɔde nsɛm a wɔaboaboa ano no bɛkɔ som no wuranom (Google LLC, USA ne Dynatrace LLC, USA) hɔ. Nsɛm no ho dwumadie gyina apam a yɛne Google LLC ne Dynatrace LLC ayɛ so. Saa abusuabɔ yi di European Union General Data Protection Regulation (EU GDPR) ne EU-USA "Privacy Shield" apam no so.'
  text3: 'Sɛnea wobɛtumi abue na de akawnt adi dwuma wɔ yɛn sistem mu, na yɛabɔ wo amaneɛ wɔ e-mail so fa nsesaeɛ a ɛho hia ho, te sɛ nsesaeɛ anaa yɛn Dwumadie mmara, mpɔtamfoɔ mmara anaa yɛn nhyehyɛeɛ so a wɔabu no, yɛbɛkora wo din ne, sɛ wode ma a, wo e-mail address. Sɛ wode Google Plus anaa Facebook na ɛkaa wo akawnt bom a, yɛkora identification key a ɛfa wo akawnt ho wɔ saa som yi so nso. Yɛremfa saa nsɛm yi nyɛ biribi foforɔ (te sɛ aguadie), gye sɛ wo ankasa ama yɛn kwan pefee.'
  text4: 'Sɛ wopɛ a, wobɛtumi de ɔman a wote mu ama yɛn wɔ wo akawnt kratafa so. Ɛbɛda adi wɔ wo badwam profaele so na yɛde bɛyɛ akontaabuo ne nhwehwɛmu nko ara. Wobɛtumi ayi afi hɔ berɛ biara wɔ wo profaele nhyehyɛeɛ mu.'
  text5: 'Wobɛtumi agyae wo ankasa nsɛm a ɛfa wo akawnt ho no dwumadie berɛ biara denam wo akawnt a wobɛyi afi hɔ wɔ wo profaele kratafa so wɔ https://share.catrob.at/. Sɛ woyi wo akawnt fi hɔ a, wobɛtumi akɔ so de som no adi dwuma, nanso worentumi mfa wo ho nhyɛ mu, te sɛ nnwuma a wode bɛto so, adwenkyerɛ anaa likes. Afei, nneɛma nyinaa a ɛfa wo akawnt ho, te sɛ nnwuma a wode ato so ne adwenkyerɛ, bɛyi afi hɔ.'
  text6: 'Sɛnea yɛbɛsiw yɛn som ho dwumadie bɔne kwan, te sɛ nneɛma anaa adwenkyerɛ a wɔde to so ma mmara so bu, yɛkora odwumanifoɔ badwam nsɛm nyinaa (nneɛma a wɔde to so, adwenkyerɛ) wɔ database mu, ne berɛ ne internet address a wɔde dii dwuma. Yɛremfa saa nsɛm yi mma ahyehyɛdeɛ biara, gye sɛ yɛsusu sɛ wɔabu mmara so kɛseɛ na mmara ahyehyɛdeɛ a wɔwɔ tumi bisa sɛnea mmara kyerɛ. Yɛbɛhwɛ asɛm biara mu yie ankasa ansa.'
  text7: 'Sɛ wopɛ a, wobɛtumi akyerɛw wo din ama Catrobat Newsletter wɔ https://catrob.at/newsletter a yɛde ma denam MailChimp som (The Rocket Science Group LLC d/b/a MailChimp, USA) so. Afei wobɛnya Catrobat adwuma ne ne som ho nsɛm foforɔ wɔ e-mail address a wode mae no so. Wobɛtumi agyae newsletter no berɛ biara denam "unsubscribe" link a ɛwɔ newsletter biara aseɛ no so. MailChimp na ɔde newsletter yi ma, na yɛne no ayɛ nsɛm dwumadie apam na wapene EU General Data Protection Regulation ne EU-USA "Privacy Shield" so. Sɛ wopɛ MailChimp ho nsɛm pii a, hwɛ MailChimp Privacy Policy ne Terms of Use.'
  text8: 'Catrobat adwuma a ɛyɛ free open source na ɛde som nyinaa ma wɔ International Catrobat Association – Verein zur Förderung freier Software, NGO a ɛnhwehwɛ mfasoɔ a wɔahyehyɛ wɔ Graz, Austria (European Union) ase. Yɛn nhyehyɛeɛ di EU ne Austria nsɛm bammɔ mmara (GDPR) so. Sɛ wopɛ sɛ wo ne yɛn kasa a, mesrɛ wo, kyerɛw e-mail kɔ contact@catrobat.org anaa kyerɛw krataa kɔ Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'Sɛ wonnii mfeɛ 14 a, ɛsɛ sɛ wo ɔhwɛfoɔ (taa yɛ ɔwofoɔ) pene nhyehyɛeɛ yi so.'
  text10: 'Catrobat kokoamsɛm nhyehyɛeɛ a ɛyɛ Borɔfo kasa mu deɛ wɔ web so wɔ %privacy_policy%.'
  disagree-text: 'Sɛ wompene so a, yɛrentumi mmue akawnt, nanso wobɛtumi de nneɛma titiriw no adi dwuma.'
