licenseToPlay:
  link: 'Kwan a wode bɛdi agorɔ'
  title: 'Kwan a wode bɛdi agorɔ - Da wɔn ase na kyɛ'
  text1: 'Fa no sɛ Catrobat adwuma biara yɛ keeki, keeki soronko bi a ne nyiyimu (kɔdɔ blɔks) ka ho. Catrobat mpɔtamfoɔ nyinaa kyɛ wɔn keeki ne ne nyiyimu. Ɛkyerɛ sɛ wobɛtumi adi keeki no na woasua sɛnea wobɛyɛ bi ankasa!'
  text2: 'Nyiyimu biara nni hɔ a ɛyɛ kokoam: akwankyerɛ a ɛfa sɛnea wɔyɛ keeki yi ho no abue ama obiara sɛ ɔde bedi dwuma, ɔbɛsan de adi dwuma, ɔbɛsesa, na ɛbɛkanyan adwene foforɔ... keeki foforɔ, mepɛ sɛ meka saa.'
  text3: 'Wobɛtumi adi keeki no na woasuasua afoforɔ nyiyimu de ayɛ wo deɛ, ebia nneɛma foforɔ ka ho. Saa ahofadie yi wɔ ahwehwɛdeɛ mmienu a ɛyɛ mmerɛ:'
  text4: 'Berɛ a yɛhyehyɛɛ Catrobat mpɔtamfoɔ no, yɛsii gyinaeɛ sɛ yɛbɛfa saa kwan yi so ɛfiri sɛ yɛgye di sɛ ɛboa adesua ne nsaanodwuma wɔ mpɔtamfoɔ no mu. Sɛ yɛkyɛ nyiyimu ne nneɛma (scripts ne mfonini) a, nnipa bɛtumi asi wɔn ho wɔn ho adwene so na obiara anya mfasoɔ.'
  text5: In designing the Catrobat website, we included features to encourage people to share and to give credit to others. On each project page, you can always download the original scripts for the project. If you remix a project (modifying the scripts or artwork, and sharing the result), we encourage you to give credit in the Project Notes, mentioning the people and project that inspired you.
  text6: 'Hu pii fa Catrobat intanɛt mpɔtamfoɔ no dwumadie mmara ho wɔ %link-termsOfUse%.'
  list1:
    item1: 'kyɛ wo keeki ne ne nyiyimu'
    item2: 'da wɔn a wɔkanyan wo no ase'
  version: 'Nsesaeɛ 1.1, Oforisuo 2, 2013'
termsOfUse:
  title: 'Dwumadie mmara'
  headline: Welcome to the Catrobat Community!
  text1: 'Sɛ Catrobat mpɔtamfoɔ no mu baako no, wo ne nnipa kyɛ nnwuma ne adwene:'
  text2: 'Yɛhia wo mmoa na yɛama mpɔtamfoɔ yi ayɛ beaeɛ a ɛboa obiara. Sɛnea wobɛtumi aboa ni:'
  text3: 'Catrobat adwuma no so no, yɛpɛ sɛ yɛhyɛ nkabom den na yɛma obiara nsaanodwuma bom ma adasamma nyinaa nya mfasoɔ. Wo nso wobɛtumi ayɛ Catrobat mpɔtamfoɔ no mu baako a ɔyɛ adwuma denam wo nnwuma a wode bɛma mpɔtamfoɔ no sɛ akyɛdeɛ so, sɛnea afoforɔ de wɔn nnwuma ma wo no:'
  text4: 'Yɛn akyɛdeɛ ma wo:'
  text5: 'Yɛn dwumadie ne som mmara:'
  list1:
    item1: 'a wɔfiri aman ne amammerɛ ahodoɔ pii mu'
    item2: 'a wɔyɛ mfeɛ ahodoɔ nyinaa (mmofra nkumaa kɔsi mmerantɛ ne nananom)'
    item3: 'a wɔwɔ osuahu ahodoɔ nyinaa'
  list2:
    item1: 'Bu nipa. Sɛ wokyɛ nnwuma a, kae sɛ nnipa a wɔyɛ mfeɛ ne afiri baabi ahodoɔ pii bɛhu deɛ wode ama.'
    item2: "Give credit. Feel free to make modified versions of other people's projects - just make sure to give them credit. One place to give credit is in your project's credits section. Please see the paragraph below this dotted list for details about modifying projects of other users."
    item3: 'Di nokware. Nyɛ wo ho sɛ obi foforɔ na nnaadaa mpɔtamfoɔ no.'
    item4: 'Fa wo ankasa nsɛm sie. Mfa wo e-mail address, telefon nɔma anaa wo ankasa nsɛm foforɔ nkyɛ.'
    item5: "Boa ma beaeɛ no nyɛ adɔeɛ. Sɛ wohu sɛ adwuma anaa adwenkyerɛ bi yɛ bɔne, ɛsopa, ɛyɛ basabasa dodo anaa ɛnfata a, mia 'bɔ amaneɛ sɛ ɛnfata' button no na kyerɛw nkyerɛmu tiawa. Catrobat kuo no bɛhwɛ w'amaneɛbɔ no na wɔbɛtumi ayi adwuma, adwenkyerɛ anaa post biara afi hɔ."
  list3:
    item1: "Sɛ wode adwuma bi to yɛn websites so a, wopene so sɛ wode saa adwuma no bɛhyɛ Catrobat nnwuma a wɔde to so no tumi krataa a ɛde ahofadie ma ase. Sɛnea Catrobat sistem no ankasa wɔ hɔ ma wo wɔ tumi krataa a ɛde ahofadie ma ase no, saa tumi krataa yi ma obiara hokwan sɛ ɔbɛsua afi afoforɔ nnwuma mu na ɔde ayɛ ne remix de ayɛ agodie, mfoniniyɛ ne nnwuma foforɔ a ɛyɛ anika. Ɛma obiara tumi 'gyina ne yɔnkonom mmati so', na wo nso woka ho! Wo adwuma bɛboa wiase nyinaa na ɛbɛkɔ so ayɛ ahofadie ma obiara, sɛnea nsɛm ne mfonini a nnipa de ma Wikipedia kwa no te. Fa no sɛ wo akyɛdeɛ ma adasamma: wode ma obiara, na afoforɔ a wɔde wɔn adwuma to yɛn websites so nso de ma wo. Ɛno nti adwuma a wɔde ato so yɛ akyɛdeɛ a ne bo yɛ den a ne wura de ma wo kwa, sɛ wobɛka mpɔtamfoɔ no ho wɔ mmara korɔ no ara so."
    item2: 'Ɛnhia sɛ wogye akyɛdeɛ no; sɛ wogye a, mmara bi wɔ hɔ. Saa mmara yi mfasoɔ ne sɛ wobɛtumi asua afi adwuma no mu na woasi so de ayɛ nneɛma a ɛyɛ fɛ kɛse, na wobɛtumi asan de ato yɛn websites so sɛ wo deɛ. Mfasoɔ foforɔ ne sɛ saa tumi krataa yi hwɛ sɛ wɔrenkyerɛ wo sɛ wo na wodi ɔhaw biara a ɛbɛto afoforɔ wɔ wo adwuma a wɔde di dwuma no ho asɛm.'
    item3: 'Ahwehwɛdeɛ foforɔ a ɛho hia ne sɛ ɛsɛ sɛ woda nkyerɛwfoɔ a wode wɔn adwuma yɛɛ wo deɛ no ase pefee. Saa berɛ no ara, yɛbɛyɛ adwuma den sɛnea afoforɔ bɛhu pefee sɛ wo na wode wo adwuma maeɛ, denam din soronko a woapaw ama wo ho wɔ Catrobat mpɔtamfoɔ mu no so, na yɛbɛma afoforɔ kwan ma wɔada wo ase wɔ badwam sɛ wode wo adwuma ama obiara, ne titiriw no wɔn.'
    item4: 'Mesrɛ wo, hwɛ %link-licenseUploaded% ma mmara ne ahwehwɛdeɛ pɔtee.'
  list4:
    item1: 'Yɛde yɛn ankasa software ne intanɛt nneɛma nyinaa a ɛfa Catrobat sistem ho, sɛ software a Catrobat kuo no akyerɛw, yɛn websites ne intanɛt nneɛma, yɛn source code a ɛfa Catrobat sistem ho, ne nneɛma foforɔ a ɛka ho te sɛ mfonini, nnyegyeɛ ne nsɛm, ma wo seesei ne daakye wɔ Catrobat tumi krataa a ɛde ahofadie ma ase.'
    item2: 'Saa tumi krataa yi ma Catrobat afã nyinaa yɛ kwa ma wo na ɛma wo ahofadie sɛ wode bɛdi dwuma sɛnea wopɛ, anohyeto kakraa bi pɛ na ɛwɔ hɔ a ɛhwɛ sɛ Catrobat sistem no bɛkɔ so ayɛ ahofadie na ayɛ mfasoɔ ama obiara daa.'
    item3: 'Mesrɛ wo, hwɛ %link-licenseToPlay% ma mmara ne ahwehwɛdeɛ pɔtee. Catrobat sistem no source code ne nkrataa ne nneɛma foforɔ pii wɔ %link-developer%.'
  list5:
    item1: "Sɛ wo, anaa sɛ wonnii mfeɛ 13 a, w'awofoɔ anaa wo ahwɛfoɔ, ka kuo bi a ɔyɛ anaa ɔde ne ho hyɛ kokoamsɛm a wɔbu so kɛseɛ ne nnipa pii a wɔhwɛ wɔn so kokoam mu ho a, wonni kwan sɛ wode yɛn software bɛdi dwuma anaa wobɛfa yɛn som. Saa anohyeto yi ho nsɛm pɔtee ne ne ho nkyiyie wɔ Ɔfa 4.a ne 4.b wɔ yɛn %link-termsOfUse% mu."
    item2: "Sɛ wonnii mfeɛ 13 a, ɛsɛ sɛ wobisa w'awofoɔ anaa wo ahwɛfoɔ sɛ wɔma wo kwan sɛ wode Catrobat Software ne Som bɛdi dwuma anaa."
    item3: 'Yɛwɔ hokwan sɛ yɛpo, yɛyi anaa yɛde nnwuma, akawnt ne digital nneɛma biara a wɔde to Catrobat websites so sie berɛ biara sɛnea yɛpɛ, sɛ yɛhu sɛ adwuma bi kura nneɛma a ɛnfata anaa odwumanifoɔ bi bu afoforɔ hokwan so a.'
    item4: 'Yɛde Catrobat software ne intanɛt nneɛma nyinaa ma wɔ anidasoɔ sɛ ɛbɛyɛ mfasoɔ, nanso bɔhyɛ biara nni hɔ.'
    item5: 'Mesrɛ wo, hwɛ yɛn %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service ma nsɛm a ɛwɔ atifi hɔ no nkyerɛkyerɛmu pɔtee ne mmara foforɔ bi.'
  bottom1: 'San bra ha berɛ ano berɛ ano, ɛfiri sɛ yɛbɔ mmɔden daa sɛ yɛbɛma yɛn Dwumadie mmara ayɛ yie.'
  bottom2: 'Mesrɛ wo, fa nyansahyɛ biara a ɛfa Dwumadie mmara yi ho mena %email-webmaster%.'
  version: 'Nsesaeɛ 1.3, Ɔbɛnem 4, 2014'
