licenseToPlay:
  link: 'Oynamaq üçün lisenziya'
  title: 'Oynamaq üçün lisenziya - Kredit ver və paylaş'
  text1: 'Təsəvvür et ki, hər Catrobat layihəsi bir tortdur, öz resepti (proqramlaşdırma blokları) ilə gələn çox xüsusi bir tort. Catrobat cəmiyyətinin bütün üzvləri tortlarını reseptləri ilə birlikdə paylaşırlar. Bu o deməkdir ki, sən həm tortlardan zövq ala, həm də onları özün necə bişirməyi öyrənə bilərsən!'
  text2: 'Gizli reseptlər yoxdur: bu tortların necə bişirildiyinə dair təlimatlar hər kəsin istifadə etməsi, yenidən istifadə etməsi, dəyişdirməsi və yeni ideyalar üçün ilham mənbəyi olması üçün açıqdır... yəni yeni tortlar üçün.'
  text3: 'Tortları yeyə və başqalarının reseptlərini köçürüb, bəlkə də fərqli inqrediyentlərlə öz tortunu bişirə bilərsən. Bu azadlıq iki sadə şərtlə gəlir:'
  text4: 'Catrobat cəmiyyətini qurarkən bu yanaşmanı seçdik, çünki inanırıq ki, o, cəmiyyətdə öyrənməyə və yaradıcılığa dəstək olur. Reseptləri və inqrediyentləri (skriptləri və rəsmləri) paylaşaraq insanlar bir-birinin ideyaları üzərində qura bilər və hər kəs bundan faydalanır.'
  text5: 'Catrobat saytını hazırlayarkən insanları paylaşmağa və başqalarını qeyd etməyə həvəsləndirən funksiyalar əlavə etdik. Hər layihə səhifəsində layihənin orijinal skriptlərini həmişə endirə bilərsən. Bir layihəni remiks etsən (skriptləri və ya rəsmləri dəyişib nəticəni paylaşsan), layihə qeydlərində sənə ilham verən insanları və layihəni qeyd etməyini tövsiyə edirik.'
  text6: 'Catrobat onlayn cəmiyyətinin istifadə şərtləri haqqında ətraflı: %link-termsOfUse%.'
  list1:
    item1: 'tortlarını reseptləri ilə birlikdə paylaş'
    item2: 'sənə ilham verənlərə təşəkkür et (onları qeyd et)'
  version: 'Versiya 1.1, 2 aprel 2013'
termsOfUse:
  title: İstifadə Şərtləri
  headline: 'Catrobat Cəmiyyətinə xoş gəldin!'
  text1: 'Catrobat cəmiyyətinin bir hissəsi kimi layihələrini və ideyalarını bu insanlarla paylaşırsan:'
  text2: 'Bu cəmiyyəti hər üzv üçün dəstəkləyici bir yerə çevirmək üçün sənin köməyin lazımdır. Bax belə kömək edə bilərsən:'
  text3: 'Catrobat layihəsi ilə əməkdaşlığı təşviq etmək və hər kəsin yaradıcılığını bütün bəşəriyyətin xeyrinə birləşdirmək istəyirik. Sən də digər fəal üzvlərin öz layihələrini sənə verdiyi kimi, layihələrini cəmiyyətə hədiyyə kimi geri verərək Catrobat cəmiyyətinin fəal üzvü ola bilərsən:'
  text4: 'Sənə hədiyyəmiz:'
  text5: 'İstifadə və Xidmət Şərtlərimiz:'
  list1:
    item1: 'bir çox fərqli ölkələrdən və mədəniyyətlərdən'
    item2: 'hər yaşdan (kiçik uşaqlardan yeniyetmələrə və nənə-babalara qədər)'
    item3: 'hər təcrübə səviyyəsindən'
  list2:
    item1: 'Hörmətli ol. Layihələri paylaşarkən unutma ki, töhfələrini çox müxtəlif yaşlarda və mühitlərdən olan insanlar görəcək.'
    item2: 'Müəllifləri qeyd et. Başqalarının layihələrinin dəyişdirilmiş versiyalarını rahatca hazırlaya bilərsən - sadəcə onları qeyd etməyi unutma. Bunun üçün yerlərdən biri layihənin qeydlər və töhfə verənlər bölməsidir. Başqa istifadəçilərin layihələrini dəyişdirməklə bağlı təfərrüatlar üçün bu siyahının altındakı abzasa bax.'
    item3: 'Dürüst ol. Özünü başqası kimi göstərmə və cəmiyyəti aldatmağa çalışma.'
    item4: 'Şəxsi məlumatlarını gizli saxla. E-poçt ünvanını, telefon nömrəni və ya digər şəxsi əlaqə məlumatlarını paylaşma.'
    item5: 'Saytın dostcasına qalmasına kömək et. Əgər bir layihənin və ya rəyin başqaları üçün kobud, təhqiramiz, həddindən artıq zorakı və ya başqa cür uyğunsuz olacağını düşünürsənsə, sadəcə "uyğunsuz kimi şikayət et" düyməsinə klik et və qısa izahat yaz. Catrobat komandası şikayətinə baxacaq və istənilən layihəni, rəyi və ya paylaşımı silə bilər.'
  list3:
    item1: 'Saytlarımıza layihə yükləməklə bu işi yüklənmiş Catrobat layihələrinin müəyyən pulsuz lisenziyaları altında yerləşdirməyi qəbul edir və razılaşırsan. Catrobat sisteminin özünün sənə təqdim olunduğu pulsuz lisenziyalar kimi, yüklənmiş Catrobat layihələrinin bu pulsuz lisenziyaları da hər kəsə başqalarının əvvəllər yüklədiyi işlərdən öyrənmək, həmin işi uyğunlaşdırmaq və remiks edərək öz yeni maraqlı oyunlarını, animasiyalarını və digər layihələrini yaratmaq hüququ verir. Bu, hər kəsə "həmyaşıdlarının çiyinlərində dayanmaq" imkanı verir və onlardan biri də sənsən! Beləliklə, sənin işin bütün dünyaya fayda verəcək və hər kəsin istifadəsi üçün pulsuz qalacaq, bir az dünyanın hər yerindən könüllülərin Vikipediyaya sərbəst şəkildə töhfə verdiyi mətnlər və şəkillər kimi. Bunu bəşəriyyətə hədiyyən kimi düşün: sən hər kəsə verirsən, öz işini saytlarımıza yükləyən bütün digərləri də sənə verir. Beləliklə, yüklənmiş layihə dəyərli bir hədiyyədir və sahibi onu sənə pulsuz verir, bir şərtlə ki, sən də cəmiyyətdə eyni şərtlərlə iştirak edəsən.'
    item2: 'Hədiyyəni qəbul etmək məcburiyyətində deyilsən; qəbul etsən, müəyyən qaydalar tətbiq olunur. Bu qaydaların faydası odur ki, işdən öyrənə və onun üzərində qurub özün daha da maraqlı şeylər yarada bilərsən, sonra isə onları, məsələn, yenidən öz işin kimi saytlarımıza yükləyə bilərsən. Digər fayda isə budur ki, bu lisenziyalar başqalarının sənin layihəndən istifadəsi nəticəsində yaranan problemlərə görə sənin məsuliyyət daşımamağını təmin edir.'
    item3: 'Vacib əlavə şərtlərdən biri budur ki, öz işini əsaslandırdığın işlərin müəlliflərini aydın şəkildə qeyd etməlisən. Eyni zamanda biz də çox çalışacağıq ki, sənin işinin sənin tərəfindən töhfə verildiyi başqaları tərəfindən aydın şəkildə qiymətləndirilsin: Catrobat cəmiyyətində səni təmsil etmək üçün sərbəst seçdiyin unikal adı qeyd etməklə və başqalarına işini hər kəsə, xüsusilə də onlara verdiyin üçün sənə açıq şəkildə minnətdarlıqlarını bildirmək imkanı yaratmaqla.'
    item4: 'Dəqiq hüquqi şərtlər üçün %link-licenseUploaded% səhifəsinə bax.'
  list4:
    item1: 'Catrobat sistemi ilə bağlı bütün öz proqram təminatımızı və internet resurslarımızı, məsələn, Catrobat komandası tərəfindən yazılmış proqram təminatını, saytlarımızı və internet resurslarımızı, Catrobat sistemi ilə bağlı öz mənbə kodumuzu və bütün əlavə materialları, məsələn, şəkilləri, səsləri və mətnləri indi və gələcəkdə sənə Catrobat-ın pulsuz lisenziyaları altında təqdim edirik.'
    item2: 'Bu lisenziyalar Catrobat-ın bütün hissələrini sənin üçün həm pulsuz, həm də azad edir, yəni onlardan istədiyin kimi istifadə etmək azadlığı verir; yalnız bir neçə məhdudiyyət, digərləri ilə yanaşı, Catrobat sisteminin həmişə hər kəs üçün azad və faydalı qalmasını təmin edir.'
    item3: 'Dəqiq hüquqi şərtlər üçün %link-licenseToPlay% səhifəsinə bax. Catrobat sisteminin mənbə kodu, eləcə də bir çox digər sənədlər və resurslar %link-developer% vasitəsilə əlçatandır.'
  list5:
    item1: 'Əgər sən, və ya 13 yaşdan kiçiksənsə, valideynlərin və ya qanuni qəyyumların, kütləvi məxfilik pozuntuları və/və ya kütləvi izləmə ilə məşğul olan və ya buna cavabdeh olan bir təşkilatla əlaqəlidirsə, proqram təminatımızdan istifadə etməyə və xidmətlərimizə daxil olmağa icazən yoxdur. Bu məhdudiyyətin dəqiq təfərrüatları və ondan bəzi istisnalar %link-termsOfUse% səhifəmizdə 4.a və 4.b bölmələrində izah olunub.'
    item2: 'Əgər 13 yaşdan kiçiksənsə, Catrobat-ın proqram təminatından və xidmətlərindən istifadə etməyə icazə verib-vermədiklərini valideynlərindən və ya qanuni qəyyumlarından soruşmalısan.'
    item3: 'Catrobat saytlarına yüklənmiş layihələri, istifadəçi hesablarını və istənilən rəqəmsal materialları istənilən vaxt öz mülahizəmizlə rədd etmək, silmək və ya gizlətmək hüququnu özümüzdə saxlayırıq, məsələn, layihədə uyğunsuz material olduğunu və ya istifadəçinin başqa şəxslərin hüquqlarını pozduğunu aşkar etsək.'
    item4: 'Catrobat-ın bütün proqram təminatı və internet resursları faydalı olacağı ümidi ilə, lakin heç bir zəmanət olmadan təqdim olunur.'
    item5: 'Yuxarıdakı bəndlərin dəqiq ifadələri və bəzi əlavə hüquqi şərtlər üçün %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service səhifəmizə bax.'
  bottom1: 'Vaxtaşırı bura nəzər sal, çünki İstifadə Şərtlərimizi daim təkmilləşdirməyə çalışırıq.'
  bottom2: 'Bu İstifadə Şərtləri ilə bağlı təkliflərini %email-webmaster% ünvanına göndər.'
  version: 'Versiya 1.3, 4 mart 2014'
