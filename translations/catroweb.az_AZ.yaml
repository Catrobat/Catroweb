  text2: 'Xidmətlərimizi (tətbiqləri və saytları) saxlamaq və təkmilləşdirmək, həmçinin İKT və STEM/STEAM təhsili üzrə elmi tədqiqatlar aparmaq üçün xidmətlərimizin istifadəsi haqqında metaməlumat, məsələn, çökmə məlumatları, vaxt damğaları, ziyarət edilmiş səhifələr/ekranlar, tətbiqlərimizin və xidmətlərimizin istifadəsi, istifadə olunan əməliyyat sistemi və şəbəkə provayderi haqqında məlumat əldə etmək üçün Google LLC (ABŞ) şirkətinin Google Analytics, Crashlytics və Firebase xidmətlərindən, həmçinin Dynatrace LLC (ABŞ) şirkətinin Dynatrace xidmətindən istifadə edirik. Bu analiz və toplanmış məlumatlar sənin profilinlə əlaqələndirilmir və heç bir şəxsi məlumat ehtiva etmir (IP ünvanının son bitləri anonimləşdirilir). Lakin toplanmış məlumatlar xidmət təminatçılarına (Google LLC, ABŞ və Dynatrace LLC, ABŞ) ötürülür. Məlumatların emalı Google LLC və Dynatrace LLC ilə bağlanmış müqavilələrə əsaslanır. Xidmət təminatçıları ilə bu münasibət Avropa İttifaqının Ümumi Məlumatların Qorunması Qaydasına (EU GDPR) və Aİ-ABŞ "Privacy Shield" razılaşmasına uyğundur.'
  text3: 'Sistemlərimizdə hesab yaratmaq və ondan istifadə etmək, həmçinin hesabınla bağlı zəruri dəyişikliklər, məsələn, yeniləmələr və ya İstifadə və Xidmət Şərtlərimizin, cəmiyyət qaydalarımızın və ya siyasətlərimizin pozulması barədə səni e-poçtla məlumatlandırmaq üçün istifadəçi adını və, əgər təqdim etmisənsə, e-poçt ünvanını saxlayacağıq. Hesabını Google Plus və ya Facebook vasitəsilə qoşmusansa, əlavə olaraq həmin xidmətlərdəki hesabınla əlaqəli identifikasiya açarını da saxlayırıq. Sən bizə açıq şəkildə icazə verməsən, bu məlumatlardan heç bir başqa (məsələn, marketinq) məqsədlə istifadə etməyəcəyik.'
  text4: 'Könüllü olaraq paylaşma saytındakı hesab səhifən vasitəsilə yaşadığın ölkəni bizə bildirə bilərsən. Bu, açıq profilində göstəriləcək və bizim tərəfimizdən yalnız statistik və tədqiqat məqsədləri üçün istifadə olunacaq. Onu istənilən vaxt profil ayarlarında silə bilərsən.'
  text5: 'Hesabına aid şəxsi məlumatların istifadəsindən istənilən vaxt https://share.catrob.at/ saytındakı profil səhifən vasitəsilə hesabını silməklə imtina edə bilərsən. Hesabını sildikdən sonra təqdim olunan xidmətlərdən yenə də istifadə edə biləcəksən, lakin əməkdaşlıq edə, məsələn, proqram yükləyə, rəy yaza və ya bəyənə bilməyəcəksən. Həmçinin hesabınla əlaqəli bütün məzmun, məsələn, yüklənmiş proqramlar, rəylər və s. silinəcək.'
  text6: 'Xidmətlərimizdən sui-istifadənin, məsələn, istifadəçilərin qanunsuz məqsədlərlə yüklədikləri materialların və ya yazdıqları rəylərin qarşısını almaq üçün istifadəçilərin yaratdığı bütün açıq məlumatlar (yükləmələr, rəylər) vaxt damğası və istifadə olunan internet ünvanı ilə birlikdə daxili verilənlər bazasında saxlanılır. Bu məlumatlar, kifayət qədər qanunsuz hərəkətlərdən əsaslı şübhə yaranmadıqca və rəsmi səlahiyyətli hüquq orqanları qüvvədə olan qanunlara əsasən tələb etmədikcə, heç bir qurum tərəfindən istifadə olunmayacaq və onlara ötürülməyəcək. Hər hal əvvəlcə bizim tərəfimizdən fərdi qaydada diqqətlə yoxlanılacaq.'
  text7: 'Könüllü olaraq https://catrob.at/newsletter ünvanında MailChimp xidməti (The Rocket Science Group LLC d/b/a MailChimp, ABŞ) vasitəsilə təqdim etdiyimiz Catrobat bülleteninə abunə ola bilərsən. Bundan sonra göstərdiyin e-poçt ünvanına Catrobat layihəsi və onun xidmətləri haqqında yeniliklər alacaqsan. Bülletendən istənilən vaxt hər bülletenin aşağı hissəsindəki "abunəlikdən çıx" linki ilə imtina edə bilərsən. Bu bülleten bizimlə məlumat emalı müqaviləsi olan və Aİ Ümumi Məlumatların Qorunması Qaydasına və Aİ-ABŞ "Privacy Shield" razılaşmasına əməl etməyi öhdəsinə götürmüş MailChimp tərəfindən təqdim olunur. MailChimp haqqında ətraflı məlumat üçün MailChimp-in Məxfilik Siyasətinə və İstifadə Şərtlərinə də bax.'
  text8: 'Bütün xidmətlər pulsuz açıq mənbəli Catrobat layihəsi tərəfindən International Catrobat Association – Verein zur Förderung freier Software adlı, Qrats şəhərində (Avstriya, Avropa İttifaqı) qeydiyyatdan keçmiş qeyri-kommersiya QHT-nin himayəsi altında təqdim olunur. Siyasətlərimiz Aİ və Avstriyanın məlumatların qorunması qanunlarına (GDPR) hörmət edir. Bizimlə əlaqə saxlamaq üçün contact@catrobat.org ünvanına e-poçt göndər və ya bu ünvana məktub yaz: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'Əgər 14 yaşdan kiçiksənsə, bu siyasət qanuni qəyyum (adətən valideyn) tərəfindən qəbul edilməlidir.'
  text10: 'Catrobat-ın rəsmi ingilisdilli məxfilik siyasəti internetdə %privacy_policy% ünvanında mövcuddur.'
  disagree-text: 'Razılıq olmadan hesab yarada bilmərik, lakin əsas funksiyalar yenə də əlçatandır.'
