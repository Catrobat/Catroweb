licenseToPlay:
  link: 'Lisens til å spille'
  title: 'Lisens til å spille - gi anerkjennelse og del'
  text1: Forestill deg det at hvert Catrobat prosjekt er en kake, en veldig spesiell kake som kommer med sin egen  oppskrift (programmering blokker). Alle medlemmer av Catrobat samfunnet deler kaker sammen med deres oppskrifter. Det betyr at du kan nyte kakene og lære hvordan du gjør dem deg selv!
  text2: 'Det er ingen hemmelige oppskrifter: instruksjoner om hvordan man baker kakene er tilgjengelig for alle å bruke, endre og fungerer som inspirasjon til nye ideer... Jeg mener kaker.'
  text3: "Du kan spise kakene og kopiere andres oppskrifter for å lage din egen, kanskje med forskjellige ingredienser. Denne friheten kommer med to enkle krav:"
  text4: "Når vi startet Catrobat samfunnet, bestemte vi oss for denne tilnærmingen fordi vi tror på at den fremmer læring og kreativitet i samfunnet. Ved å dele oppskrifter og ingredienser (skript og kunstverk), kan folk bygge og dra nytte av hverandres ideer."
  text5: I utformingen av Catrobat nettstedet inkluderte vi funksjoner for å oppmuntre folk til å dele med og gi kreditt til andre. På hver prosjektside kan du alltid laste ned originale skript til prosjektet. Hvis du remikser et prosjekt (endre skript eller kunstverk og dele resultatet), vi oppmuntrer deg til å gi kreditt i prosjektnotatene, og nevner folket og prosjekt som inspirerte deg.
  text6: 'Lær mer om vilkårene for bruk av Catrobat online-samfunnet på %link-termsOfUse%.'
  list1:
    item1: del dine kaker sammen med oppskrifter
    item2: gi anerkjennelse til dem som inspirerte deg
  version: Versjon 1.1, 2 April 2013
termsOfUse:
  title: Vilkår for bruk
  headline: Velkommen til Catrobat samfunnet!
  text1: 'Som en del av Catrobat samfunnet deler du prosjekter og ideer med folk:'
  text2: "Vi trenger din hjelp for at fellesskapet skal kunne støtte alle medlemmer. Her er hvordan du kan hjelpe:"
  text3: 'Gjennom Catrobat-prosjektet vil vi fremme samarbeid og la alles kreativitet kombineres til beste for hele menneskeheten. Du kan også bli et aktivt medlem av Catrobat-fellesskapet ved å gi prosjektene dine tilbake til fellesskapet som en gave, på samme måte som andre aktive medlemmer gir prosjektene sine til deg:'
  text4: 'Vår gave til deg:'
  text5: 'Våre vilkår for bruk og Service:'
  list1:
    item1: fra mange forskjellige land og kulturer
    item2: i alle aldre (fra små barn til tenåringer og besteforeldre)
    item3: med alle nivåer av erfaring
  list2:
    item1: Vær respektfull. Når du deler prosjekter, må du huske at folk i mange forskjellige aldre og bakgrunner vil se dine bidrag.
    item2: "Give credit. Feel free to make modified versions of other people's projects - just make sure to give them credit. One place to give credit is in your project's credits section. Please see the paragraph below this dotted list for details about modifying projects of other users."
    item3: "Vær ærlig. Ikke lat som du er noen andre enn den du er eller prøv å lure samfunnet."
    item4: "Hold personlig informasjon privat. Ikke del din e-postadresse, telefonnummer eller annen personlig kontaktinformasjon."
    item5: 'Hjelp til med å holde nettstedet vennlig. Hvis du tror andre vil oppfatte et prosjekt eller en kommentar som slem, fornærmende, for voldelig eller på annen måte upassende, klikker du bare på knappen «rapporter som upassende» og skriver en kort forklaring. Catrobat-teamet vil se på rapporten din og kan fjerne ethvert prosjekt, enhver kommentar eller ethvert innlegg.'
  list3:
    item1: 'Ved å laste opp et prosjekt til nettstedene våre godtar du å legge dette arbeidet under bestemte frie lisenser for opplastede Catrobat-prosjekter. I likhet med de frie lisensene som selve Catrobat-systemet er tilgjengelig for deg under, gir disse frie lisensene alle rett til å lære av arbeid som andre tidligere har lastet opp, og til å tilpasse og remikse dette arbeidet for å lage sine egne nye, fascinerende spill, animasjoner og andre prosjekter. Dette lar alle «stå på skuldrene til andre», og en av dem er deg! Arbeidet ditt kommer dermed hele verden til gode og forblir fritt for alle å bruke, litt som tekst og bilder som frivillige fra hele verden fritt bidrar med til Wikipedia. Tenk på det som din gave til menneskeheten: du gir til alle, og alle andre som laster opp arbeidet sitt til nettstedene våre, gir til deg. Et opplastet prosjekt er altså en gave av stor verdi som eieren gir deg gratis, på betingelse av at du deltar i fellesskapet på de samme vilkårene.'
    item2: 'Du trenger ikke å ta imot gaven; hvis du gjør det, gjelder visse regler. Fordelen med disse reglene er at du kan lære av arbeidet og bygge videre på det for å lage enda kulere ting selv, som du så for eksempel kan laste opp til nettstedene våre igjen som ditt eget. En annen fordel er at disse lisensene sørger for at du ikke kan holdes ansvarlig for problemer som oppstår for andre når de bruker prosjektet ditt.'
    item3: 'En viktig tilleggsbetingelse er at du tydelig krediterer forfatterne hvis arbeid du har bygget ditt eget arbeid på. Samtidig vil vi jobbe hardt for at andre tydelig skal se at arbeidet ditt er ditt bidrag, ved å kreditere det unike navnet du fritt har valgt for å representere deg i Catrobat-fellesskapet, og ved å gi andre muligheten til å vise deg takknemlighet offentlig for at du har gitt arbeidet ditt til alle, og særlig til dem.'
    item4: 'Vennligst se %link-licenseUploaded% for de presise juridiske vilkårene og betingelsene.'
  list4:
    item1: 'Vi tilbyr all vår egen programvare og alle internettressurser knyttet til Catrobat-systemet, f.eks. programvaren skrevet av Catrobat-teamet, nettstedene og internettressursene våre, vår egen kildekode knyttet til Catrobat-systemet og alt tilleggsmateriale som f.eks. bilder, lyder og tekster, nå og i fremtiden, til deg under Catrobats frie lisenser.'
    item2: 'Disse lisensene gjør alle deler av Catrobat både gratis for deg og fri i den forstand at du har frihet til å bruke dem slik du vil, med bare noen få begrensninger som blant annet sikrer at Catrobat-systemet for alltid forblir fritt og nyttig for alle.'
    item3: 'Vennligst se %link-licenseToPlay% for de presise juridiske vilkårene og betingelsene. Kildekoden til Catrobat systemet samt mange andre dokumenter og ressurser er tilgjengelig via %link-developer%.'
  list5:
    item1: 'Hvis du, eller dine foreldre eller foresatte hvis du er under 13 år, er tilknyttet en organisasjon som er involvert i eller ansvarlig for brudd på personvernet i form av masseovervåking eller storstilt overvåking, har du ikke lov til å bruke programvaren vår eller tjenestene våre. De nøyaktige detaljene for denne begrensningen og visse unntak fra den er beskrevet i avsnitt 4.a og 4.b i vår %link-termsOfUse%.'
    item2: Hvis du er under 13 år så må du spørre dine foreldre eller formynder om de tillater deg å bruke Catrobats programvare og tjenester.
    item3: 'Vi forbeholder oss retten til når som helst og etter eget skjønn å avvise, slette eller skjule prosjekter, brukerkontoer og alt digitalt materiale som lastes opp til Catrobats nettsteder, for eksempel hvis vi finner at et prosjekt inneholder upassende materiale eller at en bruker krenker andres rettigheter.'
    item4: "All Catrobats programvare og Internett-ressurser tilbys i håp om at de kan være nyttige, men uten garanti."
    item5: 'Se vår %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service for nøyaktige formuleringer av punktene ovenfor og noen ytterligere juridiske vilkår og betingelser.'
  bottom1: Sjekk her tilbake fra tid til annen, fordi vi alltid prøver å forbedre våre brukervilkår.
  bottom2: 'Vennligst send forslag om disse vilkårene for bruk til %email-webmaster%.'
  version: Versjon 1.3, 4. mars 2014
