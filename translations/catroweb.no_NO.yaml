privacy-policy:
  header: Personvernregler
  version: Versjon 2.2, 17. oktober 2019
  text1: For å tilby deg alle fordelene ved tjenestene våre og den tilknyttede kontoen er det nødvendig å samle inn visse data fra deg.
  text2: 'For å vedlikeholde og forbedre tjenestene våre (apper og nettsteder) og for å drive vitenskapelig forskning på IKT- og STEM/STEAM-undervisning bruker vi Google Analytics, Crashlytics og Firebase, alle fra Google LLC (USA), samt Dynatrace fra Dynatrace LLC (USA), for å få metadata om bruken av tjenestene våre, f.eks. krasjinformasjon, tidsstempler, besøkte sider/skjermer, bruk av appene og tjenestene våre, operativsystemet som brukes og informasjon om nettverksleverandøren. Denne analysen og de innsamlede dataene er ikke knyttet til profilen din og inneholder ingen personopplysninger (de siste delene av IP-adressen anonymiseres). De innsamlede dataene blir likevel overført til tjenesteleverandørene (Google LLC, USA og Dynatrace LLC, USA). Databehandlingen bygger på avtaler med Google LLC og Dynatrace LLC. Dette forholdet til tjenesteleverandørene er i samsvar med EUs personvernforordning (EU GDPR) og avtalen "Privacy Shield" mellom EU og USA.'
  text3: 'For å opprette og bruke en konto i systemene våre, og for å informere deg på e-post om nødvendige endringer i kontoen din, f.eks. oppdateringer eller brudd på bruks- og tjenestevilkårene, fellesskapsreglene eller retningslinjene våre, lagrer vi brukernavnet ditt og, hvis du har oppgitt den, e-postadressen din. Hvis du har koblet kontoen din via Google Plus eller Facebook, lagrer vi i tillegg en identifikasjonsnøkkel knyttet til kontoen din på disse tjenestene. Vi bruker ikke disse dataene til andre formål (f.eks. markedsføring) med mindre du uttrykkelig har gitt oss lov til det.'
  text4: 'Du kan frivillig oppgi bostedslandet ditt via kontosiden din på delingsnettstedet. Det vises på den offentlige profilen din og brukes av oss bare til statistikk og forskning. Du kan fjerne det når som helst i profilinnstillingene.'
  text5: 'Du kan når som helst trekke tilbake bruken av personopplysningene som hører til kontoen din, ved å slette kontoen via profilsiden din på https://share.catrob.at/. Etter at du har slettet kontoen, kan du fortsatt bruke tjenestene, men ikke samarbeide, f.eks. ved å laste opp programmer, kommentere eller like. Alt innhold knyttet til kontoen din, f.eks. opplastede programmer, kommentarer osv., blir også slettet.'
  text6: 'For å unngå misbruk av tjenestene våre, f.eks. gjennom opplastinger eller kommentarer fra brukere til ulovlige formål, lagres alle offentlige data som brukerne lager (opplastinger, kommentarer) internt i en database, sammen med et tidsstempel og internettadressen som ble brukt. Disse dataene brukes ikke av eller videresendes til noen institusjoner, med mindre det er rimelig mistanke om tilstrekkelig ulovlige handlinger og offentlig autoriserte rettsinstanser ber om dem med hjemmel i gjeldende lov. Hvert tilfelle blir først grundig kontrollert individuelt av oss.'
  text7: 'Du kan frivillig abonnere på Catrobat-nyhetsbrevet på https://catrob.at/newsletter, som vi leverer via tjenesten MailChimp (The Rocket Science Group LLC d/b/a MailChimp, USA). Du får da oppdateringer om Catrobat-prosjektet og tjenestene dets til e-postadressen du har oppgitt. Du kan når som helst melde deg av nyhetsbrevet med lenken "unsubscribe" nederst i hvert nyhetsbrev. Nyhetsbrevet leveres av MailChimp, som vi har en databehandleravtale med, og som har forpliktet seg til EUs personvernforordning og "Privacy Shield" mellom EU og USA. For mer informasjon om MailChimp, se også MailChimps personvernerklæring og bruksvilkår.'
  text8: 'Alle tjenester leveres av det frie open source-prosjektet Catrobat under paraplyen til International Catrobat Association – Verein zur Förderung freier Software, en ideell organisasjon registrert i Graz, Østerrike (EU). Retningslinjene våre respekterer EUs og Østerrikes personvernlovgivning (GDPR). For å kontakte oss, send en e-post til contact@catrobat.org eller skriv til Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Østerrike (EU).'
  text9: Hvis du er under 14 år,  denne policyen må aksepteres av en formynder (vanligvis en forelder).
  text10: Catrobats offisielle engelskspråklige personvernregler er tilgjengelig på nettet under %privacy_policy%.
  disagree-text: Uten godkjenning kan vi ikke opprette en konto, men kjernefunksjonene er fortsatt tilgjengelige.
