consent:
  email:
    subject: 'Foreldresamtykke trengs for barnets Catrobat-konto'
    title: 'Foreldresamtykke kreves'
    greeting: 'Hei,'
    message: 'Barnet ditt %username% har opprettet en konto på Catrobat og bekreftet e-postadressen sin.'
    explanation: 'Catrobat er en gratis læringsplattform der unge lærer å programmere ved å lage apper, spill og animasjoner. Etter EUs regler for beskyttelse av barn trenger vi ditt samtykke før barnet ditt kan delta fullt ut i fellesskapet. Klikk på knappen nedenfor for å gi samtykke.'
    button: 'Gi foreldresamtykke'
    ignore: 'Hvis du ikke ventet denne e-posten, kan du trygt se bort fra den. Uten samtykke vil kontoen ha begrenset funksjonalitet.'
    whatIsCatrobat: 'Catrobat er en gratis, ideell læringsplattform for programmering. Les mer på catrobat.org.'
    manageLink: 'Du kan når som helst administrere barnets konto via vår <a href="%portalUrl%" style="color: #00acc1;">foreldreportal</a>. Les mer om <a href="%infoUrl%" style="color: #00acc1;">dine rettigheter som forelder</a>.'
  confirmed:
    title: 'Samtykke gitt'
    message: 'Takk! Kontoen til %username% er nå fullt aktivert.'
    continueButton: 'Oppdag prosjekter'
parent:
  footer:
    link: 'Foreldre og foresatte'
  info:
    title: 'Informasjon for foreldre og foresatte'
    intro: 'Catrobat tar sikkerheten og personvernet til unge brukere på alvor. Denne siden forklarer hvordan vi beskytter barnet ditt og hvilke rettigheter du har.'
    whatIsCatrobat:
      title: 'Hva er Catrobat?'
      text: 'Catrobat er en gratis, ideell læringsplattform der unge lærer programmering ved å lage egne apper, spill og animasjoner. Plattformen er tilgjengelig over hele verden og brukes i undervisning.'
    dataCollected:
      title: 'Hvilke data samler vi inn?'
      text: 'Vi samler inn minst mulig data for å drive plattformen: brukernavn, e-postadresse, fødselsdato og prosjektene barnet ditt lager og laster opp. For brukere under 14 år lagrer vi også e-postadressen til en forelder/foresatt for samtykke. Vi selger eller deler ikke personopplysninger med tredjeparter.'
    yourRights:
      title: 'Dine rettigheter som forelder eller foresatt'
      text: 'Etter EUs regler for beskyttelse av barn (GDPR) og COPPA har du rett til å: se dataene vi har om barnet ditt, be om en kopi av disse dataene, trekke tilbake samtykket ditt når som helst (som begrenser kontoen), og be om permanent sletting av barnets konto og alle tilknyttede data.'
    minorRestrictions:
      title: 'Hvilke begrensninger gjelder for kontoer til mindreårige?'
      text: 'Brukere under 16 år kan ikke skrive eller lese kommentarer, følge andre brukere eller se innhold merket som ikke egnet for barn. De kan fortsatt lage og laste opp prosjekter, bla gjennom offentlige prosjekter og reagere på prosjekter med likerklikk. Disse begrensningene finnes for å gi et trygt læringsmiljø.'
    manageButton: 'Administrer barnets konto'
  portal:
    title: 'Foreldreportal'
    description: 'Skriv inn e-postadressen din for å få en sikker lenke til å administrere barnets Catrobat-konto. Lenken sendes til e-postadressen som ble oppgitt ved registreringen.'
    emailLabel: 'E-postadressen din'
    submitButton: 'Send administrasjonslenke'
    infoLink: 'Les mer'
    success:
      title: 'Sjekk innboksen din'
      message: 'Hvis en konto er knyttet til denne e-postadressen, har vi sendt en administrasjonslenke. Sjekk innboksen din og følg lenken for å administrere barnets konto.'
  manage:
    title: 'Administrer barnekontoer'
    description: 'Du administrerer kontoer knyttet til %email%.'
    consentStatus: 'Samtykkestatus'
    accountCreated: 'Konto opprettet'
    email: 'Barnets e-post'
    status:
      granted: 'Gitt'
      pending: 'Venter'
      revoked: 'Trukket tilbake'
    grantButton: 'Gi samtykke'
    revokeButton: 'Trekk tilbake samtykke'
    revokeConfirm: 'Er du sikker på at du vil trekke tilbake samtykket? Kontoen vil få begrenset funksjonalitet.'
    exportButton: 'Eksporter data'
    deleteButton: 'Slett konto'
    deleteConfirm: 'Er du sikker på at du vil slette denne kontoen permanent? Dette kan ikke angres.'
