passwordRecovery:
  subject: Din Catrobat passordgjenoppretting
  message: |
    Kjære %username%.
    Du har bedt om å tilbakestille passordet på %appplication_url% fordi du har glemt passordet ditt.
    Hvis du ikke har bedt om dette, kan du ignorere den. Det utløper og blir ubrukelig i løpet av 24 timer.
    For å tilbakestille passordet ditt og opprette et ny, besøk følgende side: %confirmationUrl%
    Du kan bruke ditt brukernavn og passord når som helst for å få tilgang til %appplication_url% -samfunnet.
    Å gjøre slik bare besøk følgende side: %loginPage%
    For å redigere profildetaljene dine, gå til denne siden: %profilePage%
    Vennlig hilsen,
    Ditt Catrobat lag.
  messageHtml: |
    <p>
    Kjære %username%.<br>
    <br>
    Du har bedt om å tilbakestille passordet på <a href="%appplication_url%">Pocket Code</a> fordi du har glemt passordet ditt.
    Hvis du ikke har bedt om dette, kan du ignorer det. Det utløper og blir ubrukelig i løpet av 24 timer.<br>
    <br>
    For å tilbakestille passordet ditt og opprette et nytt, vennligst klikk  <a href="%confirmationUrl%">her.</a><br>
    <br>
    Du kan bruke ditt brukernavn og passord når som helst for å få tilgang til <a href="%appplication_url%">Pocket Code</a> samfunnet.
    <br>
    Å gjøre slik bare besøk følgende side:  <a href="%loginPage%">Påloggingsside</a><br>
    For å redigere profildetaljene dine, gå til denne <a href="%profilePage%">siden</a>.<br>
    <br>
    Vennlig hilsen,<br>
    Ditt Catrobat lag.
    </p>
