parent:
  footer:
    link: "ผู้ปกครอง"
  info:
    title: "ข้อมูลสำหรับผู้ปกครอง"
    intro: "Catrobat ให้ความสำคัญกับความปลอดภัยและความเป็นส่วนตัวของผู้ใช้อายุน้อย หน้านี้อธิบายว่าเราปกป้องบุตรหลานของคุณอย่างไร และคุณมีสิทธิ์อะไรบ้าง"
    whatIsCatrobat:
      title: "Catrobat คืออะไร?"
      text: "Catrobat เป็นแพลตฟอร์มการศึกษาฟรีที่ไม่แสวงหากำไร ซึ่งเด็กและเยาวชนได้เรียนเขียนโปรแกรมผ่านการสร้างแอป เกม และแอนิเมชันของตัวเอง แพลตฟอร์มนี้ใช้ได้ทั่วโลกและใช้ในสถานศึกษา"
    dataCollected:
      title: "เราเก็บข้อมูลอะไรบ้าง?"
      text: "เราเก็บข้อมูลเท่าที่จำเป็นในการให้บริการแพลตฟอร์ม ได้แก่ ชื่อผู้ใช้ ที่อยู่อีเมล วันเกิด และโปรเจกต์ที่บุตรหลานของคุณสร้างและอัปโหลด สำหรับผู้ใช้อายุต่ำกว่า 14 ปี เรายังเก็บที่อยู่อีเมลของผู้ปกครองเพื่อขอความยินยอม เราไม่ขายหรือแบ่งปันข้อมูลส่วนบุคคลกับบุคคลที่สาม"
    yourRights:
      title: "สิทธิ์ของคุณในฐานะผู้ปกครอง"
      text: "ตามกฎหมายคุ้มครองเด็กของสหภาพยุโรป (GDPR) และ COPPA คุณมีสิทธิ์ที่จะ: ตรวจสอบข้อมูลที่เรามีเกี่ยวกับบุตรหลานของคุณ ขอสำเนาข้อมูลนั้น เพิกถอนความยินยอมได้ทุกเมื่อ (ซึ่งจะจำกัดการใช้งานบัญชี) และขอให้ลบบัญชีของบุตรหลานและข้อมูลที่เกี่ยวข้องทั้งหมดอย่างถาวร"
    minorRestrictions:
      title: "บัญชีของผู้เยาว์มีข้อจำกัดอะไรบ้าง?"
      text: "ผู้ใช้อายุต่ำกว่า 16 ปีไม่สามารถโพสต์หรืออ่านความคิดเห็น ติดตามผู้ใช้อื่น หรือดูเนื้อหาที่ถูกทำเครื่องหมายว่าไม่เหมาะสำหรับเด็ก แต่ยังสามารถสร้างและอัปโหลดโปรเจกต์ เลือกดูโปรเจกต์สาธารณะ และกดถูกใจโปรเจกต์ได้ ข้อจำกัดเหล่านี้มีไว้เพื่อให้เป็นพื้นที่การเรียนรู้ที่ปลอดภัย"
