    explanation: "Catrobat เป็นแพลตฟอร์มการศึกษาฟรีที่เด็กและเยาวชนได้เรียนเขียนโค้ดผ่านการสร้างแอป เกม และแอนิเมชัน ตามกฎหมายคุ้มครองเด็กของสหภาพยุโรป เราต้องได้รับความยินยอมจากคุณก่อนที่บุตรหลานของคุณจะเข้าร่วมชุมชนได้อย่างเต็มที่ คลิกปุ่มด้านล่างเพื่อให้ความยินยอม"
