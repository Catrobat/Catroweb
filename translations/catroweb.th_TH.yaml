  message: "กรุณาตรวจสอบอีเมล์-แอดเดรสของคุณ\nยินดีต้อนรับสู่ชุมชน Catrobat\nเพียงคลิกปุ่มด้านล่างเพียงครั้งเดียว\nคุณสามารถตรวจสอบการลงทะเบียนของคุณได้ที่ Catrobat\nลิงก์นี้ใช้ได้จนถึง %time% และสามารถเป็นได้\nใช้เพียงครั้งเดียวเพื่อยืนยันที่อยู่อีเมลของคุณ"
  button: "ยืนยันอีเมล์"
  ignore: "ถ้าคุณไม่ได้สร้างบัญชี Catrobat ก็ไม่ต้องสนใจอีเมลนี้ได้เลย"
  autoDelete: "บัญชีที่ไม่ได้ยืนยันจะถูกลบโดยอัตโนมัติหลังจาก 30 วัน"
