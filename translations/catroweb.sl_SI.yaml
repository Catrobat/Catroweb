  email:
    subject: 'Za račun Catrobat tvojega otroka je potrebno soglasje staršev'
    title: 'Potrebno je soglasje staršev'
    greeting: 'Pozdravljen/a,'
    message: 'Tvoj otrok %username% je ustvaril račun na Catrobatu in potrdil svoj e-poštni naslov.'
    explanation: 'Catrobat je brezplačna izobraževalna platforma, kjer se mladi učijo programiranja z ustvarjanjem aplikacij, iger in animacij. V skladu s predpisi EU o zaščiti otrok potrebujemo tvoje soglasje, preden lahko tvoj otrok v celoti sodeluje v skupnosti. Za soglasje klikni spodnji gumb.'
    button: 'Daj soglasje staršev'
    ignore: 'Če te e-pošte nisi pričakoval/a, jo lahko mirno prezreš. Brez soglasja bo imel račun omejeno delovanje.'
    whatIsCatrobat: 'Catrobat je brezplačna, neprofitna izobraževalna platforma za programiranje. Več na catrobat.org.'
    manageLink: 'Račun svojega otroka lahko kadar koli upravljaš prek našega <a href="%portalUrl%" style="color: #00acc1;">portala za starše</a>. Preberi več o <a href="%infoUrl%" style="color: #00acc1;">svojih pravicah kot starš</a>.'
