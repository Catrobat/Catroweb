    continueButton: 'Odkrij projekte'
parent:
  footer:
    link: 'Starši in skrbniki'
  info:
    title: 'Informacije za starše in skrbnike'
    intro: 'Catrobat jemlje varnost in zasebnost mladih uporabnikov resno. Ta stran pojasnjuje, kako ščitimo tvojega otroka in kakšne pravice imaš.'
    whatIsCatrobat:
      title: 'Kaj je Catrobat?'
      text: 'Catrobat je brezplačna, neprofitna izobraževalna platforma, kjer se mladi učijo programiranja z ustvarjanjem lastnih aplikacij, iger in animacij. Platforma je na voljo po vsem svetu in se uporablja v izobraževanju.'
    dataCollected:
      title: 'Katere podatke zbiramo?'
      text: 'Zbiramo le najnujnejše podatke za delovanje platforme: uporabniško ime, e-poštni naslov, datum rojstva ter projekte, ki jih tvoj otrok ustvari in naloži. Za uporabnike, mlajše od 14 let, hranimo tudi e-poštni naslov starša/skrbnika zaradi soglasja. Osebnih podatkov ne prodajamo in jih ne delimo s tretjimi osebami.'
    yourRights:
      title: 'Tvoje pravice kot starš ali skrbnik'
      text: 'V skladu s predpisi EU o zaščiti otrok (GDPR) in COPPA imaš pravico: pregledati podatke, ki jih hranimo o tvojem otroku, zahtevati kopijo teh podatkov, kadar koli preklicati soglasje (s čimer se račun omeji) ter zahtevati trajni izbris otrokovega računa in vseh povezanih podatkov.'
    minorRestrictions:
      title: 'Katere omejitve veljajo za račune mladoletnih?'
      text: 'Uporabniki, mlajši od 16 let, ne morejo objavljati ali brati komentarjev, slediti drugim uporabnikom ali si ogledovati vsebin, označenih kot neprimerne za otroke. Še vedno lahko ustvarjajo in nalagajo projekte, brskajo po javnih projektih in se na projekte odzivajo z všečki. Te omejitve zagotavljajo varno učno okolje.'
    manageButton: 'Upravljaj račun svojega otroka'
  portal:
