licenseToPlay:
  link: 'Licenca za predvajanje'
  title: 'Dovoljenje za igro – komu se zahvaliti in kako deliti'
  text1: 'Predstavljaj si, da je vsak projekt Catrobat torta, prav posebna torta, ki ima zraven tudi recept (programske bloke). Vsi člani skupnosti Catrobat delijo svoje torte skupaj z recepti. To pomeni, da lahko torte uživaš in se naučiš, kako jih narediti sam/a!'
  text2: 'Ni nobenih skrivnih receptov: navodila o tem, kako narediti torte so na voljo vsakomur za uporabo, spreminjanje in navdih za nove ideje... hočem reči - torte.'
  text3: 'Recepte drugih lahko kopiraš in narediš svoje, morda z drugačnimi sestavinami. Ta svoboda temelji na dveh preprostih pogojih:'
  text4: 'Pri vzpostavljanju skupnosti Catrobat smo se odločili za ta pristop, saj smo prepričani, da podpira učenje in ustvarjalnost v skupnosti. Z deljenjem receptov in sestavin (skript in slik) lahko ljudje nadgrajujejo ideje drug drugega in vsi pridobijo.'
  text5: 'Pri oblikovanju spletne strani Catrobat smo vključili funkcije, ki ljudi spodbujajo k deljenju in zahvaljevanju drugim. Na strani vsakega projekta lahko vedno preneseš izvirne skripte projekta. Če projekt predelaš (spremeniš skripte ali grafiko in deliš rezultat), te spodbujamo, da se v opombah projekta zahvališ ljudem in projektu, ki so te navdihnili.'
  text6: 'Več o pogojih uporabe spletne skupnosti Catrobat na %link-termsOfUse%.'
  list1:
    item1: 'deli svoje pecivo skupaj z receptom'
    item2: 'zahvali se ljudem, pri katerih si našel/a ideje'
  version: Različica 1.1, 2 aprila 2013
termsOfUse:
  title: Pogoji uporabe
  headline: 'Dobrodošel/a v skupnosti Catrobat!'
  text1: 'Kot del skupnosti Catrobat deliš projekte in ideje z ljudmi:'
  text2: 'Potrebujemo tvojo pomoč, da bo ta skupnost prijazen kraj za vsakega člana. Tako lahko pomagaš:'
  text3: 'S projektom Catrobat želimo spodbujati sodelovanje in omogočiti, da se ustvarjalnost vseh združi v korist vsega človeštva. Tudi ti lahko postaneš aktiven član skupnosti Catrobat, tako da svoje projekte podariš skupnosti, tako kot ti drugi aktivni člani podarjajo svoje projekte:'
  text4: 'Naše darilo zate:'
  text5: 'Naše pogoje uporabe in storitev:'
  list1:
    item1: iz številnih različnih držav in kultur
    item2: vse starosti (od majhnih otrok, najstnikov do starih staršev)
    item3: vseh ravni izkušenj
  list2:
    item1: 'Bodi spoštljiv/a. Ko deliš projekte, ne pozabi, da bodo tvoje prispevke videli ljudje različnih starosti in ozadij.'
    item2: 'Navedi zasluge. Lahko delaš spremenjene različice projektov drugih ljudi – le poskrbi, da jim izraziš zahvalo. To lahko narediš na primer v razdelku opomb in zahval svojega projekta. Podrobnosti o spreminjanju projektov drugih uporabnikov so v odstavku pod tem seznamom.'
    item3: 'Bodi iskren/a. Ne izdajaj se za nekoga drugega. Ne zavajaj skupnosti.'
    item4: 'Ne izdajaj osebnih podatkov. Ne objavljaj e-poštnega naslova, telefonske številke ali drugih osebnih podatkov.'
    item5: 'Pomagaj ohranjati stran prijazno. Če meniš, da bi se drugim zdel projekt ali komentar zloben, žaljiv, preveč nasilen ali kako drugače neprimeren, preprosto klikni gumb »prijavi kot neprimerno« in dodaj kratko pojasnilo. Ekipa Catrobat bo pregledala tvojo prijavo in lahko odstrani katerikoli projekt, komentar ali objavo.'
  list3:
    item1: 'Z nalaganjem projekta na naše spletne strani sprejemaš in se strinjaš, da to delo daš pod določene proste licence za naložene projekte Catrobat. Podobno kot proste licence, pod katerimi ti je na voljo sam sistem Catrobat, te proste licence naloženih projektov Catrobat dajejo vsem pravico, da se učijo iz del, ki so jih prej naložili drugi, ter jih prilagajajo in predelujejo v lastne nove čudovite igre, animacije in druge projekte. Tako lahko vsak »stoji na ramenih svojih vrstnikov«, in eden izmed njih si ti! Tvoje delo bo tako koristilo vsemu svetu in ostalo prosto za uporabo vsem, nekoliko podobno kot besedila in slike, ki jih prostovoljci z vsega sveta prosto prispevajo Wikipediji. Predstavljaj si to kot svoje darilo človeštvu: ti daješ vsem, vsi drugi, ki nalagajo svoja dela na naše spletne strani, pa dajejo tebi. Naložen projekt je torej dragoceno darilo, ki ti ga lastnik podarja brezplačno, pod pogojem, da v skupnosti sodeluješ pod enakimi pogoji.'
    item2: 'Darila ti ni treba sprejeti; če ga sprejmeš, veljajo določena pravila. Prednost teh pravil je, da se lahko iz dela učiš in ga nadgradiš ter sam/a narediš še bolj kul stvari, ki jih lahko potem npr. spet naložiš na naše spletne strani kot svoje. Druga prednost je, da te licence zagotavljajo, da ne moreš biti odgovoren/odgovorna za težave, ki bi jih imeli drugi zaradi uporabe tvojega projekta.'
    item3: 'Pomemben dodatni pogoj je, da jasno navedeš vse avtorje, na katerih delu temelji tvoje delo. Tako bodo tudi drugi cenili tvoje delo.'
    item4: 'Za natančne pravne pogoje si oglej %link-licenseUploaded%.'
  list4:
    item1: "V uporabo ponujamo programsko opremo in vire povezane s sistemom Catrobat, npr., našo izvorno kodo, povezano z Catrobatom in vse dodatne materiale, kot so npr., slike, zvoki in besedila, zdaj in v prihodnosti pod prostim dovoljem."
    item2: 'Te licence zagotavljajo, da je Catrobat brezplačen in tudi prost v smislu, da ga lahko prosto uporabljaš, vendar z nekaj omejitvami, ki med drugim zagotavljajo, da bo sistem Catrobat za vedno ostal prost za vsakogar.'
    item3: 'Za natančne pravne pogoje si oglej %link-licenseToPlay%. Izvorna koda sistema Catrobat ter mnogi drugi dokumenti in viri so na voljo prek %link-developer%.'
  list5:
    item1: 'Če si ti – ali, če si mlajši/a od 13 let, tvoji starši ali zakoniti skrbniki – povezan/a z organizacijo, ki je vpletena v množične kršitve zasebnosti in/ali množični nadzor ali zanje odgovorna, ne smeš uporabljati naših programskih aplikacij in dostopati do naših storitev. Natančne podrobnosti te omejitve in nekatere izjeme so opisane v razdelkih 4.a in 4.b na naših %link-termsOfUse%.'
    item2: 'Če si mlajši/a od 13 let, moraš imeti za uporabo aplikacij in storitev Catrobat dovoljenje staršev ali zakonitih skrbnikov.'
    item3: 'Pridržujemo si pravico, da kadar koli po lastni presoji zavrnemo, izbrišemo ali skrijemo projekte, uporabniške račune in katerakoli digitalna gradiva, naložena na spletne strani Catrobat, na primer če ugotovimo, da projekt vsebuje neprimerno gradivo ali da uporabnik krši pravice drugih oseb.'
    item4: "Vsa programska oprema in Internetni viri so na voljo v upanju, da bodo uporabni, vendar brez garancije."
    item5: 'Za natančno besedilo zgornjih točk ter nekaj dodatnih pravnih pravil in pogojev si oglej naše %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service.'
  bottom1: 'Občasno preveri to stran, saj si vedno prizadevamo izboljšati naše pogoje uporabe.'
  bottom2: 'Za dodatne informacije o pogojih uporabe se obrni na %email-webmaster%.'
  version: Različici 1.3, 4 marec 2014
