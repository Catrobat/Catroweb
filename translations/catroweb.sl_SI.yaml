passwordRecovery:
  subject: 'Tvoje geslo za Catrobat'
  message: |
    Živjo, %username%!
    Zahteval/a si ponastavitev gesla na %appplication_url%, ker si pozabil/a geslo.
    Če tega nisi zahteval/a, to sporočilo prezri. Zahteva bo čez 24 ur potekla in postala neuporabna.
    Za ponastavitev gesla in ustvarjanje novega obišči naslednjo stran: %confirmationUrl%
    S svojim uporabniškim imenom in geslom lahko kadar koli dostopaš do skupnosti %appplication_url%.
