privacy-policy:
  header: Pravilnik o zasebnosti
  version: Različica 2.2, 17. oktober 2019
  text1: 'Da ti lahko ponudimo vse prednosti naših storitev in pripadajočega računa, moramo o tebi zbrati določene podatke.'
  text2: 'Za vzdrževanje in izboljšanje naših storitev (aplikacij in spletnih strani) ter za znanstveno raziskovanje na področju izobraževanja IKT in STEM/STEAM uporabljamo Google Analytics, Crashlytics in Firebase, vse od Google LLC (ZDA), ter Dynatrace od Dynatrace LLC (ZDA), da pridobimo metapodatke o uporabi naših storitev, npr. podatke o zrušitvah, časovne žige, obiskane strani/zaslone, uporabo naših aplikacij in storitev, uporabljeni operacijski sistem in podatke o ponudniku omrežja. Ta analiza in zbrani podatki niso povezani s tvojim profilom in ne vsebujejo osebnih podatkov (zadnji biti naslova IP so anonimizirani). Zbrani podatki pa se prenesejo ponudnikom storitev (Google LLC, ZDA, in Dynatrace LLC, ZDA). Obdelava podatkov temelji na pogodbah z Google LLC in Dynatrace LLC. To razmerje s ponudniki storitev je skladno s Splošno uredbo Evropske unije o varstvu podatkov (EU GDPR) in sporazumom EU-ZDA "Privacy Shield".'
  text3: 'Za ustvarjanje in uporabo računa v naših sistemih ter za obveščanje o potrebnih spremembah tvojega računa po e-pošti, npr. o posodobitvah ali kršitvah naših pogojev uporabe in storitev, pravil skupnosti ali pravilnikov, hranimo tvoje uporabniško ime in, če ga navedeš, tvoj e-poštni naslov. Če si svoj račun povezal/a prek Google Plus ali Facebooka, dodatno hranimo identifikacijski ključ, povezan s tvojim računom pri teh storitvah. Teh podatkov ne bomo uporabili za druge namene (npr. trženje), razen če nam to izrecno dovoliš.'
  text4: 'Prostovoljno nam lahko na strani svojega računa na spletni strani za deljenje navedeš državo bivanja. Prikazana bo na tvojem javnem profilu, mi pa jo bomo uporabljali samo za statistične in raziskovalne namene. V nastavitvah profila jo lahko kadar koli odstraniš.'
  text5: 'Uporabo osebnih podatkov, povezanih s tvojim računom, lahko kadar koli prekličeš tako, da izbrišeš svoj račun na strani profila na https://share.catrob.at/. Po izbrisu računa boš ponujene storitve še vedno lahko uporabljal/a, ne boš pa mogel/mogla sodelovati, npr. z nalaganjem programov, komentiranjem ali všečkanjem. Izbrisana bo tudi vsa vsebina, povezana s tvojim računom, npr. naloženi programi, komentarji itd.'
  text6: 'Da preprečimo zlorabo naših storitev, npr. z nalaganjem ali komentarji uporabnikov v nezakonite namene, se vsi javni podatki, ki jih ustvarijo uporabniki (nalaganja, komentarji), interno shranijo v podatkovno bazo skupaj s časovnim žigom in uporabljenim internetnim naslovom. Teh podatkov ne bomo uporabili ali posredovali nobeni ustanovi, razen če obstaja utemeljen sum dovolj nezakonitih dejanj in jih uradno pooblaščene pravne ustanove zahtevajo na podlagi veljavne zakonodaje. Vsak primer bomo najprej temeljito posamično preverili.'
  text7: 'Prostovoljno se lahko naročiš na novice Catrobat na https://catrob.at/newsletter, ki jih zagotavljamo prek storitve MailChimp (The Rocket Science Group LLC d/b/a MailChimp, ZDA). Nato boš na navedeni e-poštni naslov prejemal/a novosti o projektu Catrobat in njegovih storitvah. Od novic se lahko kadar koli odjaviš s povezavo "odjava" v nogi vsakega obvestila. Novice zagotavlja MailChimp, s katerim imamo pogodbo o obdelavi podatkov in ki se je zavezal k Splošni uredbi EU o varstvu podatkov in sporazumu EU-ZDA "Privacy Shield". Za podrobnosti o MailChimpu si oglej tudi njegov pravilnik o zasebnosti in pogoje uporabe.'
  text8: 'Vse storitve zagotavlja brezplačni odprtokodni projekt Catrobat pod okriljem International Catrobat Association – Verein zur Förderung freier Software, neprofitne nevladne organizacije s sedežem v Gradcu v Avstriji (Evropska unija). Naši pravilniki spoštujejo zakonodajo EU in Avstrije o varstvu podatkov (GDPR). Za stik z nami pošlji e-pošto na contact@catrobat.org ali pismo na naslov Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'Če si mlajši/a od 14 let, mora ta pravilnik sprejeti zakoniti skrbnik (običajno starš).'
  text10: 'Uradni pravilnik o zasebnosti Catrobat v angleščini je na voljo na spletu na %privacy_policy%.'
  disagree-text: 'Brez soglasja ne moremo ustvariti računa, osnovne funkcije pa so še vedno dostopne.'
