    link: "家长与监护人"
  info:
    title: "家长与监护人须知"
    intro: "Catrobat 非常重视年轻用户的安全和隐私。本页面说明我们如何保护您的孩子，以及您享有哪些权利。"
    whatIsCatrobat:
      title: "什么是 Catrobat？"
      text: "Catrobat 是一个免费的非营利教育平台，年轻人可以通过制作自己的应用、游戏和动画来学习编程。该平台面向全球开放，并被用于教育场景。"
    dataCollected:
      title: "我们收集哪些数据？"
      text: "我们只收集运营平台所需的最少数据：用户名、电子邮箱地址、出生日期，以及您的孩子创建和上传的项目。对于 14 岁以下的用户，我们还会存储家长/监护人的电子邮箱地址，用于征求同意。我们不会出售个人数据，也不会与第三方共享。"
    yourRights:
      title: "您作为家长或监护人的权利"
      text: "根据欧盟儿童保护法规（GDPR）和 COPPA，您有权：查看我们持有的关于您孩子的数据、索取这些数据的副本、随时撤回您的同意（这会限制该帐户），以及要求永久删除您孩子的帐户和所有相关数据。"
    minorRestrictions:
      title: "未成年人帐户有哪些限制？"
      text: "16 岁以下的用户不能发表或阅读评论、关注其他用户，也不能查看被标记为不适合儿童的内容。他们仍然可以创建和上传项目、浏览公开项目，并通过点赞对项目做出反应。这些限制是为了提供一个安全的学习环境。"
