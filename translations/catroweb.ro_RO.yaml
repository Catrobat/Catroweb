passwordRecovery:
  subject: Recuperare parolă Catrobat
  message: "Dragă %username%,\nAi cerut resetarea parolei pe %appplication_url% pentru că ți-ai uitat parola.\nDacă nu ai cerut asta, ignoră acest mesaj. Cererea va expira și nu va mai fi valabilă peste 24 de ore.\nPentru a-ți reseta parola și a crea una nouă, vizitează pagina următoare: %confirmationUrl%\nPoți folosi oricând numele de utilizator și parola pentru a accesa comunitatea %appplication_url%.\nPentru asta, vizitează pagina următoare: %loginPage%\nPentru a-ți edita detaliile profilului, mergi la această pagină: %profilePage%\nCu drag,\nEchipa ta Catrobat.\n"
  messageHtml: "<p>\nDragă %username%,<br>\n<br>\nAi cerut resetarea parolei pe <a href=\"%appplication_url%\">Pocket Code</a> pentru că ți-ai uitat parola.\nDacă nu ai cerut asta, ignoră acest mesaj. Cererea va expira și nu va mai fi valabilă peste 24 de ore.<br>\n<br>\nPentru a-ți reseta parola și a crea una nouă, apasă <a href=\"%confirmationUrl%\">aici.</a><br>\n<br>\nPoți folosi oricând numele de utilizator și parola pentru a accesa comunitatea <a href=\"%appplication_url%\">Pocket Code</a>.<br>\nPentru asta, vizitează pagina următoare: <a href=\"%loginPage%\">Pagina de conectare</a><br>\nPentru a-ți edita detaliile profilului, mergi la această <a href=\"%profilePage%\">pagină</a>.<br>\n<br>\nCu drag,<br>\nEchipa ta Catrobat.\n</p>\n"
