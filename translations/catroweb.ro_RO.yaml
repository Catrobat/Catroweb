  email:
    subject: "Este nevoie de acordul tău parental pentru contul Catrobat al copilului tău"
    title: "Acord parental necesar"
    greeting: "Salut,"
    message: "Copilul tău %username% și-a creat un cont pe Catrobat și și-a verificat adresa de e-mail."
    explanation: "Catrobat este o platformă educațională gratuită unde tinerii învață să programeze creând aplicații, jocuri și animații. Conform reglementărilor UE privind protecția copiilor, avem nevoie de acordul tău înainte ca copilul tău să poată participa pe deplin în comunitate. Apasă butonul de mai jos pentru a-ți da acordul."
    button: "Dă-ți acordul parental"
    ignore: "Dacă nu te așteptai la acest e-mail, îl poți ignora liniștit. Fără acord, contul va avea funcții limitate."
    whatIsCatrobat: "Catrobat este o platformă educațională de programare gratuită și non-profit. Află mai multe pe catrobat.org."
    manageLink: "Poți gestiona oricând contul copilului tău prin <a href=\"%portalUrl%\" style=\"color: #00acc1;\">Portalul pentru părinți</a>. Află mai multe despre <a href=\"%infoUrl%\" style=\"color: #00acc1;\">drepturile tale ca părinte</a>."
  confirmed:
    title: "Acord acordat"
    message: "Mulțumim! Contul lui %username% este acum complet activat."
    continueButton: "Descoperă proiecte"
parent:
  footer:
    link: "Părinți și tutori"
  info:
    title: "Informații pentru părinți și tutori"
    intro: "Catrobat ia în serios siguranța și confidențialitatea tinerilor utilizatori. Această pagină îți explică cum îți protejăm copilul și ce drepturi ai."
    whatIsCatrobat:
      title: "Ce este Catrobat?"
      text: "Catrobat este o platformă educațională gratuită și non-profit unde tinerii învață programare creându-și propriile aplicații, jocuri și animații. Platforma este disponibilă în toată lumea și este folosită în educație."
    dataCollected:
      title: "Ce date colectăm?"
      text: "Colectăm doar datele minime necesare pentru funcționarea platformei: nume de utilizator, adresă de e-mail, data nașterii și proiectele pe care copilul tău le creează și le încarcă. Pentru utilizatorii sub 14 ani stocăm și adresa de e-mail a unui părinte/tutore în scopul acordului. Nu vindem și nu împărtășim date personale cu terți."
    yourRights:
      title: "Drepturile tale ca părinte sau tutore"
      text: "Conform reglementărilor UE privind protecția copiilor (GDPR) și COPPA, ai dreptul să: vezi datele pe care le deținem despre copilul tău, ceri o copie a acestor date, îți retragi oricând acordul (ceea ce restricționează contul) și ceri ștergerea definitivă a contului copilului tău și a tuturor datelor asociate."
    minorRestrictions:
      title: "Ce restricții se aplică conturilor minorilor?"
      text: "Utilizatorii sub 16 ani nu pot posta sau citi comentarii, nu pot urmări alți utilizatori și nu pot vedea conținut marcat ca nepotrivit pentru copii. Pot totuși să creeze și să încarce proiecte, să răsfoiască proiecte publice și să reacționeze la proiecte cu aprecieri. Aceste restricții există pentru a oferi un mediu de învățare sigur."
    manageButton: "Gestionează contul copilului tău"
  portal:
    title: "Portalul pentru părinți"
    description: "Introdu adresa ta de e-mail pentru a primi un link securizat pentru gestionarea contului Catrobat al copilului tău. Linkul va fi trimis la adresa de e-mail pe care ai indicat-o la înregistrare."
