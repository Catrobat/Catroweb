privacy-policy:
  header: "Politica de confidențialitate"
  version: "Versiunea 2.2, 17 octombrie 2019"
  text1: "Pentru a-ți oferi toate avantajele serviciilor noastre și ale contului asociat, este necesar să colectăm anumite date de la tine."
  text2: "Pentru a ne menține și îmbunătăți serviciile (aplicații și site-uri web) și pentru a face cercetare științifică în educația TIC și STEM/STEAM, folosim Google Analytics, Crashlytics și Firebase, toate de la Google LLC (SUA), precum și Dynatrace de la Dynatrace LLC (SUA), pentru a obține metadate despre utilizarea serviciilor noastre, de exemplu informații despre blocări, marcaje temporale, pagini/ecrane vizitate, utilizarea aplicațiilor și serviciilor noastre, sistemul de operare folosit și informații despre furnizorul de rețea. Această analiză și datele colectate nu sunt legate de profilul tău și nu conțin informații personale (ultimii biți ai adresei IP sunt anonimizați). Totuși, datele colectate vor fi transferate furnizorilor de servicii (Google LLC, SUA și Dynatrace LLC, SUA). Prelucrarea datelor se bazează pe acorduri cu Google LLC și Dynatrace LLC. Această relație cu furnizorii de servicii respectă Regulamentul general privind protecția datelor al Uniunii Europene (GDPR) și acordul UE-SUA „Privacy Shield”."
  text3: "Pentru a crea și folosi un cont în sistemele noastre și pentru a te informa prin e-mail despre schimbări necesare legate de contul tău, de exemplu actualizări sau încălcări ale Termenilor de utilizare și servicii, ale regulilor comunității sau ale politicilor noastre, vom stoca numele tău de utilizator și, dacă ni-l furnizezi, adresa ta de e-mail. Dacă ți-ai conectat contul prin Google Plus sau Facebook, stocăm în plus o cheie de identificare legată de contul tău de pe aceste servicii. Nu vom folosi aceste date în niciun alt scop (de exemplu marketing), decât dacă ne-ai permis explicit acest lucru."
  text4: "În mod voluntar, ne poți indica țara de reședință prin pagina contului tău de pe site-ul de distribuire. Aceasta va fi afișată pe profilul tău public și va fi folosită de noi doar în scopuri statistice și de cercetare. O poți elimina oricând din setările profilului."
  text5: "Poți retrage oricând utilizarea datelor personale aparținând contului tău, ștergându-ți contul din pagina de profil de pe https://share.catrob.at/. După ștergerea contului vei putea folosi în continuare serviciile oferite, dar nu vei mai putea colabora, de exemplu prin încărcarea de programe, comentarii sau aprecieri. De asemenea, tot conținutul legat de contul tău, de exemplu programele încărcate, comentariile etc., va fi șters."
  text6: "Pentru a evita folosirea abuzivă a serviciilor noastre, de exemplu prin încărcări sau comentarii ale utilizatorilor în scopuri ilegale, toate datele publice generate de utilizatori (încărcări, comentarii) vor fi stocate intern într-o bază de date, împreună cu un marcaj temporal și adresa de internet folosită. Aceste date nu vor fi folosite de nicio instituție și nici transmise vreuneia, decât dacă există o suspiciune rezonabilă de acțiuni suficient de ilegale și instituții juridice abilitate oficial le solicită pe baza legii aplicabile. Fiecare caz va fi mai întâi verificat temeinic, individual, de către noi."
  text7: "Te poți abona voluntar la newsletterul Catrobat pe https://catrob.at/newsletter, oferit de noi prin serviciul MailChimp (The Rocket Science Group LLC d/b/a MailChimp, SUA). Vei primi apoi noutăți despre proiectul Catrobat și serviciile sale la adresa de e-mail indicată. Te poți dezabona oricând folosind linkul „unsubscribe” din subsolul fiecărui newsletter. Acest newsletter este oferit de MailChimp, cu care avem un acord de prelucrare a datelor și care s-a angajat să respecte Regulamentul general privind protecția datelor al UE și acordul UE-SUA „Privacy Shield”. Pentru mai multe detalii despre MailChimp, consultă și Politica de confidențialitate și Termenii de utilizare ai MailChimp."
  text8: "Toate serviciile sunt oferite de proiectul liber și open source Catrobat, sub umbrela International Catrobat Association – Verein zur Förderung freier Software, un ONG non-profit înregistrat în Graz, Austria (Uniunea Europeană). Politicile noastre respectă legislația UE și austriacă privind protecția datelor (GDPR). Pentru a ne contacta, trimite un e-mail la contact@catrobat.org sau scrie-ne la Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Uniunea Europeană)."
  text9: "Dacă ai sub 14 ani, această politică trebuie acceptată de un tutore legal (de obicei un părinte)."
  text10: "Politica de confidențialitate oficială a Catrobat în limba engleză este disponibilă pe web la %privacy_policy%."
  disagree-text: "Fără acordul tău nu putem crea un cont, dar funcțiile de bază rămân accesibile."
