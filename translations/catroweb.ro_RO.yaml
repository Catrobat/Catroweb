licenseToPlay:
  link: 'Licenţă pentru a juca'
  title: "Licența pentru joacă - Menționează autorii și împarte"
  text1: "Imaginează-ți că fiecare proiect Catrobat este un tort, un tort foarte special care vine cu rețeta lui (blocurile de programare). Toți membrii comunității Catrobat își împart torturile împreună cu rețetele. Asta înseamnă că te poți bucura de torturi și poți învăța să le faci singur!"
  text2: 'Nu există rețete ascunse: instrucțiunile privind modul de a face aceste prăjituri sunt deschise pentru toată lumea să utilizeze, reutilizeze, modifice și să servească ca inspirație pentru noi idei... adică torturi.'
  text3: "Îți poți mânca torturile și poți copia rețetele altor persoane ca să-ți faci propriul tort, poate cu alte ingrediente. Această libertate vine cu două cerințe simple:"
  text4: "La infiintarea comunitatii Catrobat, noi am decis sa adoptam aceasta abordare, inca de atunci, noi am crezut in ajutor si ca in cadrul comunitatii vei fi ajutat sa inveti si sa fii creativ.  Prin distribuirea \"retetei si ingredientelor\" (script si artwork), oamenii se pot ajuta intre ei cu idei si toata lumea va beneficia."
  text5: "Când am conceput site-ul Catrobat, am inclus funcții care îi încurajează pe oameni să împartă și să-i menționeze pe ceilalți. Pe pagina fiecărui proiect poți descărca oricând scripturile originale ale proiectului. Dacă remixezi un proiect (modifici scripturile sau grafica și distribui rezultatul), te încurajăm să menționezi în notele proiectului persoanele și proiectul care te-au inspirat."
  text6: "Află mai multe despre termenii de utilizare ai comunității online Catrobat pe %link-termsOfUse%."
  list1:
    item1: Imparte-ti "prajiturile" impreuna cu "reteta"
    item2: Ofera credite celor care te-au inspirat
  version: Versiunea 1.1, 2 Aprilie 2013
termsOfUse:
  title: Termeni de utilizare
  headline: Bine ai venit in comunitatea Catrobat!
  text1: "Ca parte a comunității Catrobat, împarți proiecte și idei cu oameni:"
  text2: "Avem nevoie de ajutorul tău pentru a face această comunitate un loc mai suportiv pentru fiecare membru. Iată cum poți să ne ajuți:"
  text3: "Prin proiectul Catrobat vrem să încurajăm cooperarea și să permitem ca creativitatea tuturor să se combine în beneficiul întregii omeniri. Și tu poți deveni un membru activ al comunității Catrobat oferindu-ți proiectele comunității drept cadou, la fel cum alți membri activi îți oferă proiectele lor:"
  text4: 'Cadoul nostru pentru tine:'
  text5: 'Termenii de utilizare și serviciile:'
  list1:
    item1: 'cu toate nivelele de experien&#x21B;&#x103;'
    item2: de toate vârstele (de la copii tineri până la adolescenți și bunici)
    item3: cu toate nivelele de experiență
  list2:
    item1: "Fii respectuos. Când distribui proiecte, amintește-ți că oameni de vârste și origini foarte diferite îți vor vedea contribuțiile."
    item2: "Menționează autorii. Poți face oricând versiuni modificate ale proiectelor altora - doar asigură-te că îi menționezi. Un loc pentru asta este secțiunea de mențiuni a proiectului tău. Citește paragraful de sub această listă pentru detalii despre modificarea proiectelor altor utilizatori."
    item3: "Fii cinstit. Nu pretinde a fi alt cineva decât cine ești sau să încerci să păcălești comunitatea."
    item4: "Păstrează datele personale private. Nu împărtăși adresa ta de e-mail, numărul de telefon sau alte informații personale de contact."
    item5: "Ajută la păstrarea unui site prietenos. Dacă simți că alții ar putea găsi un proiect sau un comentariu răutăcios, jignitor, prea violent sau nepotrivit în alt fel, apasă butonul „raportează ca nepotrivit” și lasă o scurtă explicație. Echipa Catrobat îți va verifica raportul și poate elimina orice proiect, comentariu sau postare."
  list3:
    item1: "Încărcând un proiect pe site-urile noastre, accepți și ești de acord să pui această lucrare sub anumite licențe libere pentru proiectele Catrobat încărcate. Asemenea licențelor libere sub care îți este disponibil sistemul Catrobat însuși, aceste licențe libere ale proiectelor Catrobat încărcate le dau tuturor dreptul să învețe din lucrările încărcate anterior de alții și să adapteze și să remixeze acele lucrări pentru a-și construi propriile jocuri, animații și alte proiecte noi și fascinante. Astfel, toată lumea poate „sta pe umerii celorlalți”, iar unul dintre ei ești tu! Lucrarea ta va aduce astfel beneficii întregii lumi și va rămâne liberă pentru folosirea de către oricine, cam la fel ca textele și imaginile contribuite liber pe Wikipedia de voluntari din toată lumea. Gândește-te la ea ca la cadoul tău pentru omenire: tu le dai tuturor, iar toți ceilalți care își încarcă lucrările pe site-urile noastre îți dau ție. Astfel, un proiect încărcat este un cadou de mare valoare pe care proprietarul lui ți-l oferă gratuit, cu condiția să participi în comunitate în aceleași condiții."
    item2: "Nu ești obligat să accepți cadoul; dacă îl accepți, se aplică anumite reguli. Avantajele acestor reguli sunt că poți învăța din lucrare și poți construi pe baza ei lucruri și mai tari, pe care apoi le poți, de exemplu, încărca din nou pe site-urile noastre ca fiind ale tale. Un alt avantaj este că aceste licențe garantează că nu poți fi tras la răspundere pentru problemele apărute altora prin folosirea proiectului tău."
    item3: "O condiție suplimentară importantă este să menționezi clar autorii pe ale căror lucrări ți-ai bazat propria lucrare. În același timp, ne vom strădui ca alții să recunoască clar că lucrarea ta a fost contribuită de tine, menționând numele unic pe care ți l-ai ales liber pentru a te reprezenta în comunitatea Catrobat și oferindu-le altora ocazia să-ți arate public recunoștința pentru că ți-ai dăruit lucrarea tuturor, și în special lor."
    item4: "Consultă %link-licenseUploaded% pentru termenii și condițiile legale exacte."
  list4:
    item1: "Îți oferim tot software-ul nostru și resursele de internet legate de sistemul Catrobat, de exemplu software-ul scris de echipa Catrobat, site-urile și resursele noastre de internet, propriul nostru cod sursă legat de sistemul Catrobat și toate materialele suplimentare incluse, cum ar fi imagini, sunete și texte, acum și în viitor, sub licențele libere ale Catrobat."
    item2: "Aceste licențe fac ca toate părțile Catrobat să fie atât gratuite pentru tine, cât și libere, în sensul că îți dau libertatea de a le folosi cum vrei, cu doar câteva restricții care garantează, printre altele, că sistemul Catrobat va rămâne pentru totdeauna liber și util pentru toată lumea."
    item3: "Consultă %link-licenseToPlay% pentru termenii și condițiile legale exacte. Codul sursă al sistemului Catrobat, precum și multe alte documente și resurse sunt disponibile prin %link-developer%."
  list5:
    item1: "Dacă tu sau, dacă ai sub 13 ani, părinții sau tutorii tăi legali sunteți asociați cu o organizație implicată în sau responsabilă pentru încălcări ale vieții private de tip „plasă de pescuit” și/sau supraveghere în masă, atunci nu ai voie să folosești aplicațiile noastre software și să accesezi serviciile noastre. Detaliile exacte ale acestei restricții și anumite excepții de la ea sunt descrise în secțiunile 4.a și 4.b din %link-termsOfUse%."
    item2: "Dacă ai sub 13 ani, trebuie să-ți întrebi părinții sau tutorii legali dacă îți permit să folosești aplicațiile software și serviciile Catrobat."
    item3: "Ne rezervăm dreptul de a respinge, șterge sau ascunde oricând, la libera noastră apreciere, proiecte, conturi de utilizator și orice materiale digitale încărcate pe site-urile Catrobat, de exemplu dacă constatăm că un proiect conține material nepotrivit sau că un utilizator încalcă drepturile altor persoane."
    item4: "Tot software-ul și toate resursele de internet ale Catrobat sunt oferite în speranța că vor fi utile, dar fără nicio garanție."
    item5: "Consultă %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service pentru formulările exacte ale punctelor de mai sus și câțiva termeni și condiții legale suplimentare."
  bottom1: "Revino aici din când în când, pentru că încercăm mereu să ne îmbunătățim Termenii de utilizare."
  bottom2: "Trimite orice sugestii privind acești Termeni de utilizare la %email-webmaster%."
  version: Versiunea 1.3, 4 martie 2014
