  text: 'Веќе се споделени %project_count% неверојатни проекти, а следниот може да биде твојот. Преземи ја нашата апликација и почни да создаваш уште денес'
privacy-policy:
  header: 'Политика за приватност'
  version: 'Верзија 2.2, 17 октомври 2019'
  text1: 'За да ти ги понудиме сите предности на нашите услуги и поврзаната сметка, потребно е да собереме одредени податоци од тебе.'
  text2: 'За одржување и подобрување на нашите услуги (апликации и веб-страници) и за научно истражување во областа на ИКТ и STEM/STEAM образованието, користиме Google Analytics, Crashlytics и Firebase, сите од Google LLC (САД), како и Dynatrace од Dynatrace LLC (САД), за да добиеме метаподатоци за користењето на нашите услуги, на пр. информации за падови, временски ознаки, посетени страници/екрани, користење на нашите апликации и услуги, користен оперативен систем и информации за мрежниот оператор. Оваа анализа и собраните податоци не се поврзани со твојот профил и не содржат лични информации (последните битови од IP-адресата се анонимизираат). Сепак, собраните податоци се пренесуваат до давателите на услуги (Google LLC, САД и Dynatrace LLC, САД). Обработката на податоците се заснова на договори со Google LLC и Dynatrace LLC. Овој однос со давателите на услуги е во согласност со Општата регулатива за заштита на податоците на Европската Унија (EU GDPR) и договорот ЕУ-САД „Privacy Shield“.'
  text3: 'За да создадеш и користиш сметка во нашите системи и за да те информираме по е-пошта за потребни промени во врска со твојата сметка, на пр. ажурирања или прекршувања на нашите Услови за користење и услуга, правилата на заедницата или нашите политики, ќе го чуваме твоето корисничко име и, ако ја внесеш, твојата адреса на е-пошта. Ако си ја поврзал сметката преку Google Plus или Facebook, дополнително чуваме идентификациски клуч поврзан со твојата сметка на тие услуги. Овие податоци нема да ги користиме за други цели (на пр. маркетинг), освен ако изречно не ни дозволиш.'
  text4: 'Доброволно можеш да ни ја кажеш државата во која живееш преку страницата на твојата сметка на сајтот за споделување. Таа ќе биде прикажана на твојот јавен профил и ќе ја користиме само за статистички и истражувачки цели. Можеш да ја отстраниш во секое време во поставките на профилот.'
  text5: 'Користењето на личните податоци поврзани со твојата сметка можеш да го повлечеш во секое време со бришење на сметката преку страницата на профилот на https://share.catrob.at/. По бришењето на сметката сè уште ќе можеш да ги користиш понудените услуги, но не и да соработуваш, на пр. со прикачување програми, коментирање или допаѓања. Исто така, целата содржина поврзана со твојата сметка, на пр. прикачени програми, коментари итн., ќе биде избришана.'
  text6: 'За да спречиме злоупотреба на нашите услуги, на пр. преку прикачувања или коментари од корисници за незаконски цели, сите јавни податоци создадени од корисниците (прикачувања, коментари) се чуваат интерно во база на податоци, заедно со временска ознака и користената интернет-адреса. Овие податоци нема да бидат користени од или проследени до какви било институции, освен ако постои оправдано сомнение за доволно незаконски дејства и официјално овластени правни институции ги побараат врз основа на важечкиот закон. Секој случај прво ќе го провериме темелно поединечно.'
  text7: 'Доброволно можеш да се претплатиш на Catrobat билтенот на https://catrob.at/newsletter, кој го нудиме преку услугата MailChimp (The Rocket Science Group LLC d/b/a MailChimp, САД). Потоа ќе добиваш новости за проектот Catrobat и неговите услуги на адресата на е-пошта што ја внесе. Од билтенот можеш да се откажеш во секое време преку линкот „unsubscribe“ во подножјето на секој билтен. Билтенот го обезбедува MailChimp, со кој имаме договор за обработка на податоци и кој се обврзал на Општата регулатива за заштита на податоците на ЕУ и „Privacy Shield“ ЕУ-САД. За повеќе детали за MailChimp, погледни ги и Политиката за приватност и Условите за користење на MailChimp.'
  text8: 'Сите услуги ги обезбедува слободниот проект со отворен код Catrobat под покровителство на International Catrobat Association – Verein zur Förderung freier Software, непрофитна невладина организација регистрирана во Грац, Австрија (Европска Унија). Нашите политики ги почитуваат законите на ЕУ и Австрија за заштита на податоците (GDPR). За да стапиш во контакт со нас, испрати е-пошта на contact@catrobat.org или пиши ни на Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'Ако си помлад од 14 години, оваа политика мора да ја прифати законски старател (обично родител).'
  text10: 'Официјалната политика за приватност на Catrobat на англиски јазик е достапна на интернет на %privacy_policy%.'
  disagree-text: 'Без одобрение не можеме да создадеме сметка, но основните функции се сè уште достапни.'
