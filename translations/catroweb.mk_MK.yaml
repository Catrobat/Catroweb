passwordRecovery:
  subject: 'Враќање на твојата Catrobat лозинка'
  message: "Здраво %username%.\nПобара ресетирање на лозинката на %appplication_url% затоа што ја заборави.\nАко не го побара ова, игнорирај ја пораката. Барањето ќе истече и ќе стане неважечко за 24 часа.\nЗа да ја ресетираш лозинката и да создадеш нова, посети ја следнава страница: %confirmationUrl%\nСо твоето корисничко име и лозинка можеш во секое време да пристапиш до заедницата %appplication_url%.\nЗа тоа, само посети ја следнава страница: %loginPage%\nЗа да ги уредиш деталите на профилот, оди на оваа страница: %profilePage%\nПоздрав,\nТвојот Catrobat тим.\n"
  messageHtml: "<p>\nЗдраво %username%.<br>\n<br>\nПобара ресетирање на лозинката на <a href=\"%appplication_url%\">Pocket Code</a> затоа што ја заборави.\nАко не го побара ова, игнорирај ја пораката. Барањето ќе истече и ќе стане неважечко за 24 часа.<br>\n<br>\nЗа да ја ресетираш лозинката и да создадеш нова, кликни <a href=\"%confirmationUrl%\">овде.</a><br>\n<br>\nСо твоето корисничко име и лозинка можеш во секое време да пристапиш до заедницата <a href=\"%appplication_url%\">Pocket Code</a>.<br>\nЗа тоа, само посети ја следнава страница: <a href=\"%loginPage%\">Страница за најава</a><br>\nЗа да ги уредиш деталите на профилот, оди на оваа <a href=\"%profilePage%\">страница</a>.<br>\n<br>\nПоздрав,<br>\nТвојот Catrobat тим.\n</p>\n"
