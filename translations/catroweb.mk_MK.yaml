licenseToPlay:
  link: 'Лиценца за играње'
  title: 'Лиценца за играње - Наведи заслуги и споделувај'
  text1: 'Замисли дека секој Catrobat проект е торта, многу посебна торта што доаѓа со својот рецепт (програмски блокови). Сите членови на Catrobat заедницата ги споделуваат своите торти заедно со рецептите. Тоа значи дека можеш да уживаш во тортите и да научиш сам да ги правиш!'
  text2: 'Нема тајни рецепти: упатствата како се прават овие торти се отворени за секого да ги користи, повторно користи, менува и да служат како инспирација за нови идеи... мислам, торти.'
  text3: 'Можеш да ги јадеш тортите, но и да ги копираш рецептите на другите за да направиш свои, можеби со различни состојки. Оваа слобода доаѓа со две едноставни барања:'
  text4: 'При создавањето на Catrobat заедницата, решивме да го прифатиме овој пристап бидејќи веруваме дека го поддржува учењето и креативноста во заедницата. Со споделување рецепти и состојки (скрипти и слики), луѓето можат да градат врз идеите едни на други и сите имаат корист.'
  text5: 'При дизајнирањето на веб-страницата на Catrobat, вклучивме функции што ги охрабруваат луѓето да споделуваат и да им даваат заслуги на другите. На секоја страница на проект секогаш можеш да ги преземеш оригиналните скрипти на проектот. Ако ремиксираш проект (ги менуваш скриптите или сликите и го споделуваш резултатот), те охрабруваме да наведеш заслуги во белешките на проектот, спомнувајќи ги луѓето и проектот што те инспирирале.'
  text6: 'Дознај повеќе за условите за користење на онлајн заедницата Catrobat на %link-termsOfUse%.'
  list1:
    item1: 'споделувај ги своите торти заедно со рецептот'
    item2: 'наведи заслуги за оние што те инспирирале'
  version: 'Верзија 1.1, 2 април 2013'
termsOfUse:
  title: 'Услови за користење'
  headline: 'Добредојде во Catrobat заедницата!'
  text1: 'Како дел од Catrobat заедницата, споделуваш проекти и идеи со луѓе:'
  text2: 'Ни треба твоја помош за оваа заедница да биде место со поддршка за секој член. Еве како можеш да помогнеш:'
  text3: 'Преку проектот Catrobat сакаме да ја поттикнеме соработката и да овозможиме креативноста на сите да се спои во корист на целото човештво. И ти можеш да станеш активен член на Catrobat заедницата така што ќе ги подариш своите проекти на заедницата, на ист начин како што другите активни членови ти ги даваат своите проекти тебе:'
  text4: 'Нашиот подарок за тебе:'
  text5: 'Нашите услови за користење и услуга:'
  list1:
    item1: 'од многу различни земји и култури'
    item2: 'од сите возрасти (од мали деца до тинејџери и баби и дедовци)'
    item3: 'со секакво ниво на искуство'
  list2:
    item1: 'Биди почитувачки. Кога споделуваш проекти, запомни дека луѓе од многу различни возрасти и средини ќе ги видат твоите придонеси.'
    item2: 'Наведи заслуги. Слободно прави изменети верзии на проектите на другите - само погрижи се да им дадеш заслуги. Едно место каде можеш да наведеш заслуги е делот за заслуги на твојот проект. Погледни го пасусот под оваа листа за детали за менување проекти на други корисници.'
    item3: 'Биди искрен. Не преправај се дека си некој друг и не обидувај се да ја измамиш заедницата.'
    item4: 'Чувај ги личните информации приватни. Не споделувај ја својата адреса на е-пошта, телефонски број или други лични контакт информации.'
    item5: 'Помогни страницата да остане пријателска. Ако сметаш дека другите би нашле некој проект или коментар за злобен, навредлив, преку мерка насилен или на друг начин несоодветен, само кликни на копчето „пријави како несоодветно“ и остави кратко објаснување. Тимот на Catrobat ќе ја прегледа твојата пријава и може да отстрани кој било проект, коментар или објава.'
  list3:
    item1: 'Со прикачување проект на нашите веб-страници, прифаќаш и се согласуваш ова дело да го ставиш под одредени слободни лиценци за прикачени Catrobat проекти. Слично на слободните лиценци под кои ти е достапен самиот систем Catrobat, овие слободни лиценци за прикачени Catrobat проекти му даваат на секого право да учи од делата што претходно ги прикачиле други и да ги прилагодува и ремиксира тие дела за да создаде свои нови фасцинантни игри, анимации и други проекти. Тоа му овозможува на секого да „стои на рамењата на своите врсници“, а еден од нив си и ти! Така твоето дело ќе му користи на целиот свет и ќе остане слободно за секого да го користи, слично на текстовите и сликите што доброволци од целиот свет слободно ги придонесуваат на Википедија. Сфати го тоа како твој подарок за човештвото: ти им даваш на сите, а сите други што ги прикачуваат своите дела на нашите веб-страници ти даваат тебе. Така прикачениот проект е подарок со голема вредност што неговиот сопственик ти го дава бесплатно, под услов и ти да учествуваш во заедницата под истите услови.'
    item2: 'Не мора да го прифатиш подарокот; ако го прифатиш, важат одредени правила. Предностите на овие правила се што можеш да учиш од делото и да градиш врз него за сам да направиш уште поинтересни работи, кои потоа можеш, на пример, повторно да ги прикачиш на нашите веб-страници како свои. Друга предност е што овие лиценци гарантираат дека нема да бидеш одговорен за какви било проблеми што би настанале кај други поради нивното користење на твојот проект.'
    item3: 'Еден важен дополнителен услов е јасно да ги наведеш авторите врз чии дела го заснова своето дело. Во исто време, ќе се трудиме другите јасно да препознаат дека твоето дело го придонесе ти, така што ќе го наведуваме уникатното име што слободно си го избрал за да те претставува во заедницата на Catrobat, и така што ќе им даваме на другите можност јавно да ти изразат благодарност што си го дал своето дело на сите, а особено на нив.'
    item4: 'Погледни %link-licenseUploaded% за точните правни услови и одредби.'
  list4:
    item1: 'Сиот наш софтвер и интернет-ресурси поврзани со системот Catrobat, на пр. софтверот напишан од тимот на Catrobat, нашите веб-страници и интернет-ресурси, нашиот изворен код поврзан со системот Catrobat и сите дополнителни вклучени материјали како, на пр., слики, звуци и текстови, ти ги нудиме сега и во иднина под слободните лиценци на Catrobat.'
    item2: 'Овие лиценци ги прават сите делови на Catrobat бесплатни за тебе, но и слободни во смисла дека ти даваат слобода да ги користиш како сакаш, со само неколку ограничувања што, меѓу другото, обезбедуваат системот Catrobat засекогаш да остане слободен и корисен за сите.'
    item3: 'Погледни %link-licenseToPlay% за точните правни услови и одредби. Изворниот код на системот Catrobat, како и многу други документи и ресурси, се достапни преку %link-developer%.'
  list5:
    item1: 'Ако ти или, ако си помлад од 13 години, твоите родители или законски старатели сте поврзани со организација вклучена во или одговорна за масовни повреди на приватноста и/или масовен надзор, тогаш не смееш да ги користиш нашите софтверски апликации и да пристапуваш до нашите услуги. Точните детали за ова ограничување и одредени исклучоци од него се опишани во деловите 4.a и 4.b во нашите %link-termsOfUse%.'
    item2: 'Ако си помлад од 13 години, мора да ги прашаш родителите или законските старатели дали ти дозволуваат да ги користиш софтверските апликации и услуги на Catrobat.'
    item3: 'Го задржуваме правото во секое време, по наша дискреција, да одбиеме, избришеме или скриеме проекти, кориснички сметки и какви било дигитални материјали прикачени на веб-страниците на Catrobat, на пример ако утврдиме дека некој проект содржи несоодветен материјал или дека некој корисник ги повредува правата на други лица.'
    item4: 'Целиот софтвер и интернет-ресурси на Catrobat се нудат со надеж дека ќе бидат корисни, но без никаква гаранција.'
    item5: 'Погледни ги нашите %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service за точните формулации на горните точки и некои дополнителни правни услови и одредби.'
  bottom1: 'Навраќај тука од време на време, бидејќи постојано се трудиме да ги подобриме нашите Услови за користење.'
  bottom2: 'Сите предлози во врска со овие Услови за користење испрати ги на %email-webmaster%.'
  version: 'Верзија 1.3, 4 март 2014'
