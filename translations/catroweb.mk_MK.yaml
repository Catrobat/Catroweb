  info:
    title: 'Информации за родители и старатели'
    intro: 'Catrobat сериозно се грижи за безбедноста и приватноста на младите корисници. Оваа страница објаснува како го штитиме твоето дете и какви права имаш.'
    whatIsCatrobat:
      title: 'Што е Catrobat?'
      text: 'Catrobat е бесплатна, непрофитна образовна платформа каде младите учат програмирање со создавање свои апликации, игри и анимации. Платформата е достапна ширум светот и се користи во образованието.'
    dataCollected:
      title: 'Кои податоци ги собираме?'
      text: 'Собираме само минимум податоци потребни за работа на платформата: корисничко име, адреса на е-пошта, датум на раѓање и проектите што твоето дете ги создава и прикачува. За корисници под 14 години чуваме и адреса на е-пошта на родител/старател заради согласност. Не продаваме и не споделуваме лични податоци со трети страни.'
    yourRights:
      title: 'Твоите права како родител или старател'
      text: 'Според прописите на ЕУ за заштита на децата (GDPR) и COPPA, имаш право да: ги прегледаш податоците што ги чуваме за твоето дете, побараш копија од тие податоци, ја повлечеш согласноста во секое време (со што сметката се ограничува) и побараш трајно бришење на сметката на твоето дете и сите поврзани податоци.'
    minorRestrictions:
      title: 'Какви ограничувања важат за сметките на малолетници?'
      text: 'Корисниците под 16 години не можат да објавуваат или читаат коментари, да следат други корисници или да гледаат содржини означени како несоодветни за деца. Сепак, можат да создаваат и прикачуваат проекти, да прелистуваат јавни проекти и да реагираат на проекти со допаѓања. Овие ограничувања постојат за да обезбедат безбедна средина за учење.'
    manageButton: 'Управувај со сметката на твоето дете'
  portal:
    title: 'Родителски портал'
    description: 'Внеси ја својата адреса на е-пошта за да добиеш безбеден линк за управување со Catrobat сметката на твоето дете. Линкот ќе биде испратен на адресата на е-пошта што ја внесе при регистрацијата.'
    emailLabel: 'Твојата адреса на е-пошта'
    submitButton: 'Испрати линк за управување'
    infoLink: 'Дознај повеќе'
    success:
      title: 'Провери го сандачето'
      message: 'Ако има сметка поврзана со оваа е-пошта, ти испративме линк за управување. Провери го сандачето и следи го линкот за да управуваш со сметката на твоето дете.'
  manage:
    title: 'Управувај со сметките на децата'
    description: 'Управуваш со сметки поврзани со %email%.'
    consentStatus: 'Статус на согласност'
    accountCreated: 'Сметката е создадена'
    email: 'Е-пошта на детето'
    status:
      granted: 'Дадена'
      pending: 'Во тек'
      revoked: 'Повлечена'
    grantButton: 'Дај согласност'
    revokeButton: 'Повлечи согласност'
    revokeConfirm: 'Дали си сигурен дека сакаш да ја повлечеш согласноста? Сметката ќе има ограничени функции.'
    exportButton: 'Извези податоци'
