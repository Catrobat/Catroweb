    manageLink: 'Можеш да управляваш акаунта на детето си по всяко време чрез нашия <a href="%portalUrl%" style="color: #00acc1;">Портал за родители</a>. Научи повече за <a href="%infoUrl%" style="color: #00acc1;">правата си като родител</a>.'
