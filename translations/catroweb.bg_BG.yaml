parent:
  footer:
    link: "Родители и настойници"
  info:
    title: "Информация за родители и настойници"
    intro: "Catrobat се отнася сериозно към безопасността и поверителността на младите потребители. Тази страница обяснява как защитаваме детето ти и какви права имаш."
    whatIsCatrobat:
      title: "Какво е Catrobat?"
      text: "Catrobat е безплатна образователна платформа с нестопанска цел, в която младите хора се учат да програмират, като създават собствени приложения, игри и анимации. Платформата е достъпна по целия свят и се използва в образованието."
    dataCollected:
      title: "Какви данни събираме?"
      text: "Събираме минимума данни, необходими за работата на платформата: потребителско име, имейл адрес, дата на раждане и проектите, които детето ти създава и качва. За потребители под 14 години съхраняваме и имейл адрес на родител/настойник с цел даване на съгласие. Не продаваме и не споделяме лични данни с трети страни."
