    title: "Необходимо е родителско съгласие"
    greeting: "Здравей,"
    message: "Детето ти %username% създаде акаунт в Catrobat и потвърди имейл адреса си."
    explanation: "Catrobat е безплатна образователна платформа, в която младите хора се учат да програмират, като създават приложения, игри и анимации. Съгласно правилата на ЕС за закрила на децата ни е нужно твоето съгласие, преди детето ти да може да участва пълноценно в общността. Щракни бутона по-долу, за да дадеш съгласие."
