licenseToPlay:
  link: 'Лиценз за игра'
  title: 'Лиценз за игра – признавай авторството и споделяй'
  text1: Представи си, че всеки проект в Catrobat е торта – много специална торта, която идва със своята рецепта (програмните блокове). Всички членове на общността на Catrobat споделят тортите си заедно с рецептите. Това означава, че можеш да се наслаждаваш на тортите и да се научиш сам да ги правиш!
  text2: 'Няма тайни рецепти: инструкциите как се правят тези торти са отворени за всеки – да ги използва, преизползва, променя и да черпи от тях вдъхновение за нови идеи... искам да кажа торти.'
  text3: "Можеш да ядеш тортите и да копираш рецептите на други хора, за да направиш свои, може би с различни съставки. Тази свобода идва с две прости изисквания:"
  text4: "Когато създавахме общността на Catrobat, решихме да възприемем този подход, защото вярваме, че той подкрепя ученето и творчеството в общността. Като споделят рецепти и съставки (скриптове и графики), хората могат да надграждат идеите си един на друг и всички печелят."
  text5: Когато проектирахме уебсайта на Catrobat, включихме функции, които насърчават хората да споделят и да признават приноса на другите. На страницата на всеки проект винаги можеш да изтеглиш оригиналните скриптове на проекта. Ако ремиксираш проект (като промениш скриптовете или графиките и споделиш резултата), те насърчаваме да посочиш в бележките към проекта хората и проекта, които са те вдъхновили.
  text6: 'Научи повече за условията за ползване на онлайн общността на Catrobat на %link-termsOfUse%.'
  list1:
    item1: споделяй тортите си заедно с рецептата
    item2: посочвай тези, които са те вдъхновили
  version: Версия 1.1, 2 април 2013 г.
termsOfUse:
  title: Условия за ползване
  headline: Добре дошъл в общността на Catrobat!
  text1: 'Като част от общността на Catrobat споделяш проекти и идеи с хора:'
  text2: "Нуждаем се от твоята помощ, за да превърнем тази общност в подкрепящо място за всеки член. Ето как можеш да помогнеш:"
  text3: "Чрез проекта Catrobat искаме да насърчаваме сътрудничеството и да позволим творчеството на всеки да се обедини в полза на цялото човечество. Ти също можеш да станеш активен член на общността на Catrobat, като даряваш проектите си на общността, по същия начин, по който другите активни членове даряват своите проекти на теб:"
  text4: 'Нашият подарък за теб:'
  text5: 'Нашите условия за ползване и услуги:'
  list1:
    item1: от много различни държави и култури
    item2: на всякаква възраст (от малки деца до тийнейджъри и баби и дядовци)
    item3: с всякакво ниво на опит
  list2:
    item1: Бъди уважителен. Когато споделяш проекти, помни, че хора на много различна възраст и с различен произход ще видят приноса ти.
    item2: "Признавай авторството. Спокойно прави променени версии на проекти на други хора – просто не забравяй да ги посочиш. Едно място за това е разделът „Бележки и благодарности“ на проекта ти. Виж абзаца под този списък за подробности относно промяната на проекти на други потребители."
    item3: "Бъди честен. Не се преструвай, че си някой друг, и не се опитвай да заблуждаваш общността."
    item4: "Пази личната си информация. Не споделяй имейл адреса си, телефонния си номер или други лични данни за контакт."
    item5: "Помогни сайтът да остане дружелюбен. Ако смяташ, че други биха намерили даден проект или коментар за злобен, обиден, твърде жесток или по друг начин неподходящ, просто щракни бутона „докладвай като неподходящ“ и остави кратко обяснение. Екипът на Catrobat ще прегледа сигнала ти и може да премахне всеки проект, коментар или публикация."
  list3:
    item1: "Като качваш проект на нашите уебсайтове, приемаш и се съгласяваш тази творба да бъде предоставена под определени свободни лицензи за качени проекти на Catrobat. Подобно на свободните лицензи, под които самата система Catrobat ти е достъпна, тези свободни лицензи за качени проекти дават на всеки правото да се учи от творби, качени преди това от други, и да ги адаптира и ремиксира, за да създава свои нови вълнуващи игри, анимации и други проекти. Така всеки може „да стъпи на раменете на връстниците си“ – и един от тях си ти! Така творбата ти ще е от полза за целия свят и ще остане свободна за използване от всички, малко подобно на текстовете и снимките, които доброволци от целия свят свободно добавят в Уикипедия. Приеми го като твой подарък за човечеството: ти даваш на всички, а всички останали, които качват творбите си на нашите уебсайтове, дават на теб. Затова каченият проект е подарък с голяма стойност, който собственикът му ти дава безплатно, при условие че участваш в общността при същите условия."
    item2: Не си длъжен да приемеш подаръка; ако го приемеш, важат определени правила. Ползата от тези правила е, че можеш да се учиш от творбата и да надграждаш върху нея, за да направиш нещо още по-яко, което после можеш например отново да качиш на нашите уебсайтове като свое. Друга полза е, че тези лицензи гарантират, че не можеш да бъдеш държан отговорен за проблеми, възникнали за други при използването на твоя проект.
    item3: "Едно важно допълнително условие е ясно да посочваш авторите, върху чиито творби си базирал своята. Същевременно ще положим всички усилия другите ясно да знаят, че творбата е твой принос – като посочваме уникалното име, което свободно си избрал, за да те представя в общността на Catrobat, и като даваме на другите възможност публично да ти изразят благодарността си, че си дал творбата си на всички и в частност на тях."
    item4: 'Прегледай %link-licenseUploaded% за точните правни условия.'
  list4:
    item1: "Предлагаме ти целия наш собствен софтуер и интернет ресурси, свързани със системата Catrobat – например софтуера, написан от екипа на Catrobat, нашите уебсайтове и интернет ресурси, нашия изходен код, свързан със системата Catrobat, и всички допълнително включени материали, като например изображения, звуци и текстове – сега и в бъдеще, под свободните лицензи на Catrobat."
    item2: Тези лицензи правят всички части на Catrobat както безплатни за теб, така и свободни в смисъл, че ти дават свободата да ги използваш както искаш, само с няколко ограничения, които наред с другото гарантират, че системата Catrobat завинаги ще остане свободна и полезна за всички.
    item3: 'Прегледай %link-licenseToPlay% за точните правни условия. Изходният код на системата Catrobat, както и много други документи и ресурси, са достъпни чрез %link-developer%.'
  list5:
    item1: 'Ако ти или, ако си под 13 години, твоите родители или законни настойници сте свързани с организация, замесена или отговорна за масови нарушения на поверителността и/или масово наблюдение, нямаш право да използваш нашите софтуерни приложения и да ползваш нашите услуги. Точните подробности за това ограничение и някои изключения от него са описани в раздели 4.a и 4.b на нашите %link-termsOfUse%.'
    item2: Ако си под 13 години, трябва да попиташ родителите или законните си настойници дали ти позволяват да използваш софтуерните приложения и услугите на Catrobat.
    item3: "Запазваме си правото по всяко време и по наша преценка да отхвърляме, изтриваме или скриваме проекти, потребителски акаунти и всякакви дигитални материали, качени на уебсайтовете на Catrobat, например ако установим, че даден проект съдържа неподходящ материал или че потребител нарушава правата на други хора."
    item4: "Целият софтуер и интернет ресурси на Catrobat се предлагат с надеждата, че ще бъдат полезни, но без каквато и да е гаранция."
    item5: 'Прегледай нашите %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service за точните формулировки на горните точки и някои допълнителни правни условия.'
  bottom1: Проверявай тук от време на време, защото непрекъснато се опитваме да подобряваме нашите условия за ползване.
  bottom2: 'Изпращай предложения относно тези условия за ползване на %email-webmaster%.'
  version: Версия 1.3, 4 март 2014 г.
