privacy-policy:
  header: Правила за поверителност
  version: Версия 2.2, 17 октомври 2019 г.
  text1: За да ти предложим всички предимства на нашите услуги и свързания с тях акаунт, е необходимо да събираме определени данни от теб.
  text2: За да поддържаме и подобряваме нашите услуги (приложения и уебсайтове) и да провеждаме научни изследвания в областта на ИКТ и STEM/STEAM образованието, използваме Google Analytics, Crashlytics и Firebase, всички на Google LLC (САЩ), както и Dynatrace на Dynatrace LLC (САЩ), за да получаваме метаданни за използването на нашите услуги, например информация за сривове, времеви отпечатъци, посетени страници/екрани, използване на нашите приложения и услуги, използвана операционна система и информация за мрежовия доставчик. Този анализ и събраните данни не са свързани с профила ти и не съдържат лична информация (последните битове от IP адреса се анонимизират). Събраните данни обаче се предават на доставчиците на услуги (Google LLC, САЩ и Dynatrace LLC, САЩ). Обработката на данните се основава на споразумения с Google LLC и Dynatrace LLC. Тази връзка с доставчиците на услуги съответства на Общия регламент относно защитата на данните на Европейския съюз (GDPR на ЕС) и споразумението ЕС–САЩ „Privacy Shield“.
  text3: За да създадеш и използваш акаунт в нашите системи и за да те информираме по имейл за необходими промени, свързани с акаунта ти, например обновления или нарушения на нашите условия за ползване и услуги, правилата на общността или нашите политики, ще съхраняваме потребителското ти име и, ако си го предоставил, имейл адреса ти. Ако си свързал акаунта си чрез Google Plus или Facebook, допълнително съхраняваме идентификационен ключ, свързан с акаунта ти в тези услуги. Няма да използваме тези данни за други цели (например маркетинг), освен ако изрично не ни позволиш.
  text4: Доброволно можеш да ни посочиш държавата, в която живееш, чрез страницата на акаунта си в сайта за споделяне. Тя ще се показва в публичния ти профил и ще се използва от нас само за статистически и изследователски цели. Можеш да я премахнеш по всяко време в настройките на профила си.
  text5: Можеш по всяко време да оттеглиш използването на личните данни, свързани с акаунта ти, като изтриеш акаунта си от страницата на профила си на https://share.catrob.at/. След изтриване на акаунта ще можеш да продължиш да използваш предоставяните услуги, но не и да участваш, например чрез качване на програми, коментиране или харесване. Също така цялото предоставено съдържание, свързано с акаунта ти, например качени програми, коментари и т.н., ще бъде изтрито.
  text6: За да предотвратим злоупотреба с нашите услуги, например чрез качвания или коментари на потребители с незаконни цели, всички публични данни, създадени от потребители (качвания, коментари), се съхраняват вътрешно в база данни заедно с времеви отпечатък и използвания интернет адрес. Тези данни няма да бъдат използвани от или предавани на никакви институции, освен ако няма основателно подозрение за достатъчно сериозни незаконни действия и официално оправомощени институции не ги поискат въз основа на приложимото право. Всеки случай първо ще бъде щателно проверен индивидуално от нас.
  text7: Можеш доброволно да се абонираш за бюлетина на Catrobat на https://catrob.at/newsletter, който предоставяме чрез услугата MailChimp (The Rocket Science Group LLC d/b/a MailChimp, САЩ). Тогава ще получаваш новини за проекта Catrobat и неговите услуги на посочения от теб имейл адрес. Можеш да се отпишеш от бюлетина по всяко време чрез линка „unsubscribe“ в долната част на всеки бюлетин. Този бюлетин се предоставя от MailChimp, с които имаме споразумение за обработка на данни и които са се ангажирали с Общия регламент относно защитата на данните на ЕС и „Privacy Shield“ ЕС–САЩ. За повече подробности относно MailChimp виж и Политиката за поверителност и Условията за ползване на MailChimp.
  text8: Всички услуги се предоставят от безплатния проект с отворен код Catrobat под шапката на International Catrobat Association – Verein zur Förderung freier Software, неправителствена организация с нестопанска цел, регистрирана в Грац, Австрия (Европейски съюз). Нашите политики спазват законодателството на ЕС и Австрия за защита на данните (GDPR). За да се свържеш с нас, изпрати имейл на contact@catrobat.org или ни пиши на адрес Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Европейски съюз).
  text9: Ако си под 14 години, тази политика трябва да бъде приета от законен настойник (обикновено родител).
  text10: Официалната политика за поверителност на Catrobat на английски език е достъпна в интернет на %privacy_policy%.
  disagree-text: Без съгласие не можем да създадем акаунт, но основните функции остават достъпни.
