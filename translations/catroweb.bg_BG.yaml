passwordRecovery:
  subject: Възстановяване на паролата ти в Catrobat
  message: |
    Здравей, %username%.
    Поиска нулиране на паролата си в %appplication_url%, защото си я забравил.
    Ако не си поискал това, просто го игнорирай. Заявката ще изтече и ще стане невалидна след 24 часа.
    За да нулираш паролата си и да създадеш нова, посети следната страница: %confirmationUrl%
    Можеш по всяко време да използваш потребителското си име и паролата си, за да влезеш в общността на %appplication_url%.
    За целта просто посети следната страница: %loginPage%
    За да редактираш данните в профила си, отиди на тази страница: %profilePage%
    Поздрави,
    Екипът на Catrobat.
  messageHtml: |
    <p>
    Здравей, %username%.<br>
    <br>
    Поиска нулиране на паролата си в <a href="%appplication_url%">Pocket Code</a>, защото си я забравил.
    Ако не си поискал това, просто го игнорирай. Заявката ще изтече и ще стане невалидна след 24 часа.<br>
    <br>
    За да нулираш паролата си и да създадеш нова, щракни <a href="%confirmationUrl%">тук.</a><br>
    <br>
    Можеш по всяко време да използваш потребителското си име и паролата си, за да влезеш в общността на <a href="%appplication_url%">Pocket Code</a>.<br>
    За целта просто посети следната страница: <a href="%loginPage%">Страница за вход</a><br>
    За да редактираш данните в профила си, отиди на тази <a href="%profilePage%">страница</a>.<br>
    <br>
    Поздрави,<br>
    Екипът на Catrobat.
    </p>
