passwordRecovery:
  subject: তোমার ক্যাট্রোব্যাট পাসওয়ার্ড পুনরুদ্ধার
  message: |
    প্রিয় %username%,
    তুমি পাসওয়ার্ড ভুলে গেছ বলে %appplication_url%-এ তোমার পাসওয়ার্ড রিসেট করার অনুরোধ করেছ।
    তুমি যদি এই অনুরোধ না করে থাকো, তাহলে এটি উপেক্ষা করো। ২৪ ঘণ্টা পর এটির মেয়াদ শেষ হয়ে অকেজো হয়ে যাবে।
    তোমার পাসওয়ার্ড রিসেট করে নতুন একটি তৈরি করতে এই পেজে যাও: %confirmationUrl%
    %appplication_url% কমিউনিটিতে ঢুকতে তুমি যেকোনো সময় তোমার ব্যবহারকারীর নাম ও পাসওয়ার্ড ব্যবহার করতে পারো।
    এর জন্য শুধু এই পেজে যাও: %loginPage%
    তোমার প্রোফাইলের তথ্য সম্পাদনা করতে এই পেজে যাও: %profilePage%
    শুভেচ্ছান্তে,
    তোমার ক্যাট্রোব্যাট টিম।
  messageHtml: |
    <p>
    প্রিয় %username%,<br>
    <br>
    তুমি পাসওয়ার্ড ভুলে গেছ বলে <a href="%appplication_url%">Pocket Code</a>-এ তোমার পাসওয়ার্ড রিসেট করার অনুরোধ করেছ।
    তুমি যদি এই অনুরোধ না করে থাকো, তাহলে এটি উপেক্ষা করো। ২৪ ঘণ্টা পর এটির মেয়াদ শেষ হয়ে অকেজো হয়ে যাবে।<br>
    <br>
    তোমার পাসওয়ার্ড রিসেট করে নতুন একটি তৈরি করতে <a href="%confirmationUrl%">এখানে ক্লিক করো।</a><br>
    <br>
    <a href="%appplication_url%">Pocket Code</a> কমিউনিটিতে ঢুকতে তুমি যেকোনো সময় তোমার ব্যবহারকারীর নাম ও পাসওয়ার্ড ব্যবহার করতে পারো।<br>
    এর জন্য শুধু এই পেজে যাও: <a href="%loginPage%">লগইন পেজ</a><br>
    তোমার প্রোফাইলের তথ্য সম্পাদনা করতে এই <a href="%profilePage%">পেজে</a> যাও।<br>
    <br>
    শুভেচ্ছান্তে,<br>
    তোমার ক্যাট্রোব্যাট টিম।
    </p>
