    whatIsCatrobat:
      title: "ক্যাট্রোব্যাট কী?"
      text: "ক্যাট্রোব্যাট একটি বিনামূল্যের, অলাভজনক শিক্ষামূলক প্ল্যাটফর্ম, যেখানে তরুণরা নিজেদের অ্যাপ, গেম আর অ্যানিমেশন তৈরি করে প্রোগ্রামিং শেখে। প্ল্যাটফর্মটি সারা বিশ্বে পাওয়া যায় এবং শিক্ষাক্ষেত্রে ব্যবহৃত হয়।"
    dataCollected:
      title: "আমরা কোন তথ্য সংগ্রহ করি?"
      text: "প্ল্যাটফর্ম চালাতে যতটুকু তথ্য দরকার, আমরা শুধু ততটুকুই সংগ্রহ করি: ব্যবহারকারীর নাম, ইমেইল ঠিকানা, জন্মতারিখ এবং তোমার সন্তান যে প্রকল্প তৈরি ও আপলোড করে। ১৪ বছরের কম বয়সী ব্যবহারকারীদের জন্য আমরা সম্মতির উদ্দেশ্যে একজন অভিভাবকের ইমেইল ঠিকানাও সংরক্ষণ করি। আমরা ব্যক্তিগত তথ্য তৃতীয় পক্ষের কাছে বিক্রি বা শেয়ার করি না।"
    yourRights:
      title: "অভিভাবক বা তত্ত্বাবধায়ক হিসেবে তোমার অধিকার"
      text: "ইইউ-র শিশু সুরক্ষা বিধি (GDPR) এবং COPPA অনুযায়ী তোমার অধিকার আছে: তোমার সন্তান সম্পর্কে আমাদের কাছে থাকা তথ্য দেখার, সেই তথ্যের একটি কপি চাওয়ার, যেকোনো সময় তোমার সম্মতি প্রত্যাহার করার (এতে অ্যাকাউন্টটি সীমিত হয়ে যায়), এবং তোমার সন্তানের অ্যাকাউন্ট ও তার সঙ্গে যুক্ত সব তথ্য স্থায়ীভাবে মুছে ফেলার অনুরোধ করার।"
    minorRestrictions:
      title: "অপ্রাপ্তবয়স্কদের অ্যাকাউন্টে কী কী সীমাবদ্ধতা আছে?"
      text: "১৬ বছরের কম বয়সী ব্যবহারকারীরা মন্তব্য লিখতে বা পড়তে, অন্য ব্যবহারকারীদের অনুসরণ করতে, অথবা শিশুদের জন্য উপযুক্ত নয় বলে চিহ্নিত কনটেন্ট দেখতে পারে না। তারা তবুও প্রকল্প তৈরি ও আপলোড করতে, সর্বজনীন প্রকল্প দেখতে এবং লাইক দিয়ে প্রকল্পে প্রতিক্রিয়া জানাতে পারে। নিরাপদ শেখার পরিবেশ দিতেই এই সীমাবদ্ধতাগুলো রাখা হয়েছে।"
    manageButton: "তোমার সন্তানের অ্যাকাউন্ট পরিচালনা করো"
