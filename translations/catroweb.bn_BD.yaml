  unspecifiedError: তোমার প্রোফাইল বদলানোর সময় কিছু একটা কাজ করেনি। আবার চেষ্টা করো, আর বারবার এমন হলে আমাদের জানাও!
  verifyAccountText: তোমার অ্যাকাউন্ট যাচাই করার জন্য আমরা তোমাকে একটি লিংকসহ ইমেইল পাঠাব। পরের এক ঘণ্টার মধ্যে লিংকে ক্লিক করতে ভুলো না, তুমি দিনে শুধু একটি ইমেইল চাইতে পারো।
  verifyAccountButton: ইমেইল পাঠাও
  verifyAccountMailSent: ইমেইল সফলভাবে পাঠানো হয়েছে। তোমার ইনবক্স দেখো
  verifyAccountMailFailed: তুমি দিনে শুধু একটি ইমেইল চাইতে পারো
licenseToPlay:
  link: 'খেলার জন্য লাইসেন্স'
  title: 'খেলার জন্য লাইসেন্স - কৃতিত্ব দাও আর শেয়ার করো'
  text1: কল্পনা করো, প্রতিটি ক্যাট্রোব্যাট প্রকল্প একটি কেক, খুব বিশেষ একটি কেক যার সাথে তার রেসিপিও (প্রোগ্রামিং ব্লক) আসে। ক্যাট্রোব্যাট কমিউনিটির সব সদস্য তাদের কেক রেসিপিসহ শেয়ার করে। এর মানে তুমি কেকগুলো উপভোগ করতে পারো আর নিজেও সেগুলো বানাতে শিখতে পারো!
  text2: 'কোনো গোপন রেসিপি নেই: এই কেকগুলো কীভাবে বানাতে হয় তার নির্দেশনা সবার জন্য খোলা — যে কেউ ব্যবহার করতে, আবার ব্যবহার করতে, বদলাতে আর নতুন ধারণার অনুপ্রেরণা হিসেবে নিতে পারে... মানে, নতুন কেকের।'
  text3: "তুমি কেক খেতেও পারো, আবার অন্যদের রেসিপি কপি করে নিজের কেকও বানাতে পারো, হয়তো ভিন্ন উপকরণ দিয়ে। এই স্বাধীনতার সাথে দুটি সহজ শর্ত আছে:"
  text4: "ক্যাট্রোব্যাট কমিউনিটি গড়ার সময় আমরা এই পদ্ধতি বেছে নিয়েছি, কারণ আমরা বিশ্বাস করি এটি কমিউনিটিতে শেখা আর সৃজনশীলতাকে সাহায্য করে। রেসিপি আর উপকরণ (স্ক্রিপ্ট আর ছবি) শেয়ার করে মানুষ একে অপরের ধারণার উপর কাজ করতে পারে, আর এতে সবারই লাভ হয়।"
  text5: ক্যাট্রোব্যাট ওয়েবসাইট তৈরির সময় আমরা এমন ফিচার রেখেছি যা মানুষকে শেয়ার করতে আর অন্যদের কৃতিত্ব দিতে উৎসাহ দেয়। প্রতিটি প্রকল্পের পেজে তুমি সবসময় প্রকল্পের মূল স্ক্রিপ্ট ডাউনলোড করতে পারো। তুমি যদি কোনো প্রকল্প রিমিক্স করো (স্ক্রিপ্ট বা ছবি বদলে ফলাফল শেয়ার করো), তাহলে প্রকল্পের নোটে কৃতিত্ব দাও — যে মানুষ আর প্রকল্প তোমাকে অনুপ্রাণিত করেছে তাদের নাম উল্লেখ করো।
  text6: 'ক্যাট্রোব্যাট অনলাইন কমিউনিটির ব্যবহারের শর্তাবলী সম্পর্কে আরও জানো %link-termsOfUse%-এ।'
  list1:
    item1: তোমার কেক রেসিপিসহ শেয়ার করো
    item2: যারা তোমাকে অনুপ্রাণিত করেছে তাদের কৃতিত্ব দাও
  version: সংস্করণ ১.১, ২ এপ্রিল ২০১৩
termsOfUse:
  title: ব্যবহারের শর্তাবলী
  headline: ক্যাট্রোব্যাট কমিউনিটিতে তোমাকে স্বাগতম!
  text1: 'ক্যাট্রোব্যাট কমিউনিটির অংশ হিসেবে তুমি প্রকল্প আর ধারণা শেয়ার করছ এমন মানুষদের সাথে, যারা:'
  text2: "এই কমিউনিটিকে প্রত্যেক সদস্যের জন্য একটি সহায়ক জায়গা বানাতে আমাদের তোমার সাহায্য দরকার। তুমি এভাবে সাহায্য করতে পারো:"
  text3: "ক্যাট্রোব্যাট প্রকল্পের মাধ্যমে আমরা সহযোগিতা বাড়াতে চাই এবং সবার সৃজনশীলতাকে একসাথে করে পুরো মানবজাতির উপকারে লাগাতে চাই। অন্য সক্রিয় সদস্যরা যেমন তাদের প্রকল্প তোমাকে দিচ্ছে, তেমনি তুমিও তোমার প্রকল্প উপহার হিসেবে কমিউনিটিকে ফিরিয়ে দিয়ে ক্যাট্রোব্যাট কমিউনিটির একজন সক্রিয় সদস্য হতে পারো:"
  text4: 'তোমার জন্য আমাদের উপহার:'
  text5: 'আমাদের ব্যবহার এবং সেবার শর্তাদি:'
  list1:
    item1: বিভিন্ন দেশ এবং সংস্কৃতি থেকে
    item2: সমস্ত বয়সের (ছোট বাচ্চা থেকে শুরু করে কিশোর এবং দাদা-দাদি)
    item3: সমস্ত স্তরের অভিজ্ঞতার সাথে
  list2:
    item1: সম্মান দেখাও। প্রকল্প শেয়ার করার সময় মনে রেখো, নানা বয়স আর পটভূমির মানুষ তোমার অবদান দেখবে।
    item2: "কৃতিত্ব দাও। অন্যদের প্রকল্পের বদলানো সংস্করণ বানাতে দ্বিধা কোরো না — শুধু তাদের কৃতিত্ব দিতে ভুলো না। কৃতিত্ব দেওয়ার একটি জায়গা হলো তোমার প্রকল্পের নোট ও কৃতজ্ঞতা অংশ। অন্য ব্যবহারকারীদের প্রকল্প বদলানোর বিষয়ে বিস্তারিত জানতে এই তালিকার নিচের অনুচ্ছেদটি দেখো।"
    item3: "সৎ থাকো। নিজেকে অন্য কেউ বলে ভান কোরো না বা কমিউনিটিকে ঠকানোর চেষ্টা কোরো না।"
    item4: "ব্যক্তিগত তথ্য গোপন রাখো। তোমার ইমেইল ঠিকানা, ফোন নম্বর বা অন্য কোনো ব্যক্তিগত যোগাযোগের তথ্য শেয়ার কোরো না।"
    item5: "সাইটটিকে বন্ধুত্বপূর্ণ রাখতে সাহায্য করো। তোমার যদি মনে হয় কোনো প্রকল্প বা মন্তব্য অন্যদের কাছে খারাপ, অপমানজনক, খুব হিংস্র বা অন্যভাবে অনুপযুক্ত লাগবে, তাহলে শুধু 'অনুপযুক্ত হিসেবে রিপোর্ট করো' বোতামে ক্লিক করো আর একটি ছোট ব্যাখ্যা লিখে দাও। ক্যাট্রোব্যাট টিম তোমার রিপোর্ট পর্যালোচনা করবে এবং যেকোনো প্রকল্প, মন্তব্য বা পোস্ট সরিয়ে দিতে পারে।"
  list3:
    item1: "আমাদের ওয়েবসাইটে কোনো প্রকল্প আপলোড করে তুমি মেনে নিচ্ছ এবং রাজি হচ্ছ যে এই কাজটি আপলোড করা ক্যাট্রোব্যাট প্রকল্পের নির্দিষ্ট মুক্ত লাইসেন্সের আওতায় থাকবে। যে মুক্ত লাইসেন্সে ক্যাট্রোব্যাট সিস্টেম নিজেই তোমার জন্য পাওয়া যায়, তার মতোই আপলোড করা ক্যাট্রোব্যাট প্রকল্পের এই মুক্ত লাইসেন্সগুলো সবাইকে অধিকার দেয় অন্যদের আগে আপলোড করা কাজ থেকে শেখার, আর সেই কাজকে বদলে ও রিমিক্স করে নিজেদের নতুন দারুণ গেম, অ্যানিমেশন ও অন্যান্য প্রকল্প বানানোর। এভাবে সবাই 'নিজের সঙ্গীদের কাঁধে দাঁড়াতে' পারে, আর তাদের একজন তুমিও! এভাবে তোমার কাজ পুরো বিশ্বের উপকারে আসবে এবং সবার ব্যবহারের জন্য মুক্ত থাকবে, অনেকটা সারা বিশ্বের স্বেচ্ছাসেবকদের উইকিপিডিয়ায় বিনামূল্যে দেওয়া লেখা আর ছবির মতো। এটাকে মানবজাতির জন্য তোমার উপহার ভাবো: তুমি সবাইকে দিচ্ছ, আর যারা আমাদের ওয়েবসাইটে তাদের কাজ আপলোড করে তারা সবাই তোমাকে দিচ্ছে। তাই একটি আপলোড করা প্রকল্প একটি অনেক মূল্যবান উপহার, যা তার মালিক তোমাকে বিনামূল্যে দিচ্ছে, এই শর্তে যে তুমিও একই শর্তে কমিউনিটিতে অংশ নেবে।"
    item2: তোমাকে উপহারটি নিতেই হবে এমন নয়; নিলে কিছু নিয়ম মানতে হবে। এই নিয়মগুলোর সুবিধা হলো তুমি কাজটি থেকে শিখতে পারো আর তার উপর ভিত্তি করে নিজে আরও দারুণ কিছু বানাতে পারো, যা তুমি তারপর, যেমন, আবার নিজের কাজ হিসেবে আমাদের ওয়েবসাইটে আপলোড করতে পারো। আরেকটি সুবিধা হলো, এই লাইসেন্সগুলো নিশ্চিত করে যে অন্যরা তোমার প্রকল্প ব্যবহার করে কোনো সমস্যায় পড়লে তার জন্য তোমাকে দায়ী করা যাবে না।
    item3: "একটি গুরুত্বপূর্ণ অতিরিক্ত শর্ত হলো, যাদের কাজের উপর ভিত্তি করে তুমি নিজের কাজ বানিয়েছ, সেই লেখকদের তুমি স্পষ্টভাবে কৃতিত্ব দেবে। একই সাথে আমরা চেষ্টা করব যাতে অন্যরা স্পষ্টভাবে বুঝতে পারে যে কাজটি তোমার অবদান — ক্যাট্রোব্যাট কমিউনিটিতে তোমাকে বোঝাতে তুমি যে অনন্য নাম নিজে বেছে নিয়েছ তার নামে কৃতিত্ব দিয়ে, এবং অন্যদের সুযোগ দিয়ে যাতে তারা সবার জন্য, বিশেষ করে তাদের জন্য, তোমার কাজ দেওয়ার জন্য প্রকাশ্যে তোমাকে কৃতজ্ঞতা জানাতে পারে।"
    item4: 'সুনির্দিষ্ট আইনি শর্তাবলীর জন্য %link-licenseUploaded% দেখো।'
  list4:
    item1: "ক্যাট্রোব্যাট সিস্টেম সম্পর্কিত আমাদের নিজস্ব সব সফটওয়্যার ও ইন্টারনেট রিসোর্স — যেমন ক্যাট্রোব্যাট টিমের লেখা সফটওয়্যার, আমাদের ওয়েবসাইট ও ইন্টারনেট রিসোর্স, ক্যাট্রোব্যাট সিস্টেম সম্পর্কিত আমাদের নিজস্ব সোর্স কোড, এবং এর সাথে থাকা সব অতিরিক্ত উপকরণ যেমন ছবি, সাউন্ড ও লেখা — আমরা এখন এবং ভবিষ্যতে ক্যাট্রোব্যাটের মুক্ত লাইসেন্সের আওতায় তোমাকে দিচ্ছি।"
    item2: এই লাইসেন্সগুলোর ফলে ক্যাট্রোব্যাটের সব অংশ তোমার জন্য বিনামূল্যে, আবার মুক্তও — মানে তুমি যেভাবে খুশি সেগুলো ব্যবহার করতে পারো, শুধু কয়েকটি সীমাবদ্ধতা আছে যেগুলো অন্যান্য বিষয়ের পাশাপাশি নিশ্চিত করে যে ক্যাট্রোব্যাট সিস্টেম চিরকাল সবার জন্য মুক্ত ও কাজে লাগার মতো থাকবে।
    item3: 'সুনির্দিষ্ট আইনি শর্তাবলীর জন্য %link-licenseToPlay% দেখো। ক্যাট্রোব্যাট সিস্টেমের সোর্স কোড এবং আরও অনেক নথি ও রিসোর্স %link-developer%-এ পাওয়া যায়।'
  list5:
    item1: 'তুমি, অথবা তোমার বয়স ১৩ বছরের কম হলে তোমার বাবা-মা বা আইনি অভিভাবক, যদি এমন কোনো সংস্থার সাথে যুক্ত থাকো যা ঢালাও গোপনীয়তা লঙ্ঘন এবং/অথবা ব্যাপক বা গণ নজরদারিতে জড়িত বা তার জন্য দায়ী, তাহলে তুমি আমাদের সফটওয়্যার অ্যাপ্লিকেশন ব্যবহার করতে এবং আমাদের সেবায় প্রবেশ করতে পারবে না। এই সীমাবদ্ধতার সুনির্দিষ্ট বিবরণ এবং এর কিছু ব্যতিক্রম আমাদের %link-termsOfUse%-এর ৪.a ও ৪.b অংশে বর্ণনা করা আছে।'
    item2: তোমার বয়স ১৩ বছরের কম হলে তোমাকে তোমার বাবা-মা বা আইনি অভিভাবককে জিজ্ঞেস করতে হবে, তারা তোমাকে ক্যাট্রোব্যাটের সফটওয়্যার অ্যাপ্লিকেশন ও সেবা ব্যবহার করতে দেবেন কি না।
    item3: "আমরা আমাদের নিজস্ব বিবেচনায় যেকোনো সময় ক্যাট্রোব্যাটের ওয়েবসাইটে আপলোড করা প্রকল্প, ব্যবহারকারী অ্যাকাউন্ট এবং যেকোনো ডিজিটাল উপকরণ প্রত্যাখ্যান, মুছে ফেলা বা লুকিয়ে রাখার অধিকার রাখি, যেমন যদি আমরা দেখি কোনো প্রকল্পে অনুপযুক্ত উপকরণ আছে বা কোনো ব্যবহারকারী অন্যের অধিকার লঙ্ঘন করছে।"
    item4: "ক্যাট্রোব্যাটের সব সফটওয়্যার ও ইন্টারনেট রিসোর্স এই আশায় দেওয়া হয় যে সেগুলো কাজে লাগবে, তবে কোনো ওয়ারেন্টি ছাড়া।"
    item5: 'উপরের বিষয়গুলোর সুনির্দিষ্ট ভাষা এবং আরও কিছু আইনি শর্তাবলীর জন্য আমাদের %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service দেখো।'
  bottom1: মাঝে মাঝে এখানে এসে দেখে যেও, কারণ আমরা সবসময় আমাদের ব্যবহারের শর্তাবলী উন্নত করার চেষ্টা করছি।
  bottom2: 'এই ব্যবহারের শর্তাবলী নিয়ে তোমার কোনো পরামর্শ থাকলে %email-webmaster%-এ মেইল করো।'
