privacy-policy:
  header: গোপনীয়তার নীতি
  version: সংস্করণ ২.২, ১৭ অক্টোবর ২০১৯
  text1: তোমাকে আমাদের সেবা ও এর সাথে যুক্ত অ্যাকাউন্টের সব সুবিধা দিতে তোমার কাছ থেকে কিছু নির্দিষ্ট তথ্য সংগ্রহ করা দরকার।
  text2: আমাদের সেবা (অ্যাপ ও ওয়েবসাইট) চালু রাখতে ও উন্নত করতে এবং ICT ও STEM/STEAM শিক্ষা নিয়ে বৈজ্ঞানিক গবেষণা করতে আমরা Google LLC (USA)-এর Google Analytics, Crashlytics ও Firebase এবং Dynatrace LLC (USA)-এর Dynatrace ব্যবহার করি। এগুলো দিয়ে আমরা আমাদের সেবার ব্যবহার সম্পর্কে মেটাডেটা পাই, যেমন ক্র্যাশের তথ্য, সময়, দেখা পেজ/স্ক্রিন, আমাদের অ্যাপ ও সেবার ব্যবহার, ব্যবহৃত অপারেটিং সিস্টেম এবং নেটওয়ার্ক প্রদানকারীর তথ্য। এই বিশ্লেষণ ও সংগৃহীত তথ্য তোমার প্রোফাইলের সাথে যুক্ত নয় এবং এতে কোনো ব্যক্তিগত তথ্য নেই (IP ঠিকানার শেষ অংশ বেনামি করা হয়)। তবে সংগৃহীত তথ্য সেবা প্রদানকারীদের (Google LLC, USA এবং Dynatrace LLC, USA) কাছে পাঠানো হবে। তথ্য প্রক্রিয়াকরণ Google LLC ও Dynatrace LLC-এর সাথে চুক্তির ভিত্তিতে হয়। সেবা প্রদানকারীদের সাথে এই সম্পর্ক ইউরোপীয় ইউনিয়নের সাধারণ তথ্য সুরক্ষা বিধি (EU GDPR) এবং EU-USA "Privacy Shield" চুক্তি মেনে চলে।
  text3: আমাদের সিস্টেমে একটি অ্যাকাউন্ট তৈরি ও ব্যবহার করতে, এবং তোমার অ্যাকাউন্টের দরকারি পরিবর্তন সম্পর্কে ইমেইলে তোমাকে জানাতে — যেমন আমাদের ব্যবহারের শর্তাবলী, কমিউনিটির নিয়ম বা নীতিমালার আপডেট বা লঙ্ঘন — আমরা তোমার ব্যবহারকারীর নাম এবং, তুমি দিয়ে থাকলে, তোমার ইমেইল ঠিকানা সংরক্ষণ করব। তুমি যদি Google Plus বা Facebook-এর মাধ্যমে তোমার অ্যাকাউন্ট যুক্ত করে থাকো, তাহলে আমরা এই সেবাগুলোতে তোমার অ্যাকাউন্টের সাথে যুক্ত একটি শনাক্তকরণ কী-ও সংরক্ষণ করি। তুমি স্পষ্টভাবে অনুমতি না দিলে আমরা এই তথ্য অন্য কোনো (যেমন বিপণনের) উদ্দেশ্যে ব্যবহার করব না।
  text4: তুমি চাইলে শেয়ারিং সাইটে তোমার অ্যাকাউন্ট পেজ থেকে তুমি কোন দেশে থাকো তা আমাদের জানাতে পারো। এটি তোমার সর্বজনীন প্রোফাইলে দেখানো হবে এবং আমরা শুধু পরিসংখ্যান ও গবেষণার কাজে এটি ব্যবহার করব। তুমি যেকোনো সময় তোমার প্রোফাইল সেটিংস থেকে এটি সরিয়ে দিতে পারো।
  text5: https://share.catrob.at/-এ তোমার প্রোফাইল পেজ থেকে অ্যাকাউন্ট মুছে ফেলে তুমি যেকোনো সময় তোমার অ্যাকাউন্টের ব্যক্তিগত তথ্যের ব্যবহার প্রত্যাহার করতে পারো। অ্যাকাউন্ট মুছে ফেলার পরও তুমি দেওয়া সেবাগুলো ব্যবহার করতে পারবে, তবে অংশ নিতে পারবে না, যেমন প্রোগ্রাম আপলোড, মন্তব্য বা লাইক করা। এছাড়া তোমার অ্যাকাউন্টের সাথে যুক্ত সব কনটেন্ট, যেমন আপলোড করা প্রোগ্রাম, মন্তব্য ইত্যাদি মুছে ফেলা হবে।
  text6: আমাদের সেবার অপব্যবহার ঠেকাতে, যেমন বেআইনি উদ্দেশ্যে ব্যবহারকারীদের আপলোড বা মন্তব্য, ব্যবহারকারীদের তৈরি সব সর্বজনীন তথ্য (আপলোড, মন্তব্য) সময় ও ব্যবহৃত ইন্টারনেট ঠিকানাসহ একটি ডাটাবেসে অভ্যন্তরীণভাবে সংরক্ষণ করা হবে। যথেষ্ট বেআইনি কাজের যুক্তিসঙ্গত সন্দেহ না থাকলে এবং সরকারিভাবে অধিকারপ্রাপ্ত আইনি প্রতিষ্ঠান প্রযোজ্য আইনের ভিত্তিতে না চাইলে এই তথ্য কোনো প্রতিষ্ঠান ব্যবহার করবে না বা তাদের কাছে পাঠানো হবে না। প্রতিটি ঘটনা আমরা প্রথমে আলাদাভাবে ভালো করে যাচাই করব।
  text7: তুমি চাইলে https://catrob.at/newsletter-এ ক্যাট্রোব্যাট নিউজলেটার সাবস্ক্রাইব করতে পারো, যা আমরা MailChimp সেবার (The Rocket Science Group LLC d/b/a MailChimp, USA) মাধ্যমে দিই। তারপর তুমি তোমার দেওয়া ইমেইল ঠিকানায় ক্যাট্রোব্যাট প্রকল্প ও এর সেবার আপডেট পাবে। প্রতিটি নিউজলেটারের নিচে থাকা "unsubscribe" লিংক ব্যবহার করে তুমি যেকোনো সময় নিউজলেটার বন্ধ করতে পারো। এই নিউজলেটার দেয় MailChimp, যার সাথে আমাদের তথ্য প্রক্রিয়াকরণ চুক্তি আছে এবং যারা EU-র সাধারণ তথ্য সুরক্ষা বিধি ও EU-USA "Privacy Shield" মেনে চলার অঙ্গীকার করেছে। MailChimp সম্পর্কে আরও জানতে MailChimp-এর গোপনীয়তা নীতি ও ব্যবহারের শর্তাবলীও দেখো।
  text8: 'সব সেবা দেয় মুক্ত ওপেন সোর্স ক্যাট্রোব্যাট প্রকল্প, যা International Catrobat Association – Verein zur Förderung freier Software-এর অধীনে চলে; এটি গ্রাৎস, অস্ট্রিয়ায় (ইউরোপীয় ইউনিয়ন) নিবন্ধিত একটি অলাভজনক এনজিও। আমাদের নীতিমালা EU ও অস্ট্রিয়ার তথ্য সুরক্ষা আইন (GDPR) মেনে চলে। আমাদের সাথে যোগাযোগ করতে contact@catrobat.org-এ ইমেইল পাঠাও অথবা এই ঠিকানায় চিঠি পাঠাও: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union)।'
  text9: তোমার বয়স ১৪ বছরের কম হলে এই নীতি একজন আইনি অভিভাবককে (সাধারণত বাবা বা মা) মেনে নিতে হবে।
  text10: ক্যাট্রোব্যাটের অফিসিয়াল ইংরেজি গোপনীয়তা নীতি ওয়েবে %privacy_policy%-এ পাওয়া যায়।
  disagree-text: অনুমোদন ছাড়া আমরা অ্যাকাউন্ট তৈরি করতে পারি না, তবে মূল ফিচারগুলো তবুও ব্যবহার করা যাবে।
