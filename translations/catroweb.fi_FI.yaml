consent:
  email:
    subject: "Lapsesi Catrobat-tili tarvitsee huoltajan suostumuksen"
    title: "Huoltajan suostumus tarvitaan"
    greeting: "Hei,"
    message: "Lapsesi %username% on luonut tilin Catrobatiin ja vahvistanut sähköpostiosoitteensa."
    explanation: "Catrobat on ilmainen opetusalusta, jolla nuoret oppivat ohjelmoimaan luomalla sovelluksia, pelejä ja animaatioita. EU:n lastensuojelusäännösten mukaan tarvitsemme suostumuksesi, ennen kuin lapsesi voi osallistua yhteisöön täysipainoisesti. Anna suostumuksesi napsauttamalla alla olevaa painiketta."
    button: "Anna huoltajan suostumus"
    ignore: "Jos et odottanut tätä sähköpostia, voit jättää sen huomiotta. Ilman suostumusta tilin toiminnot ovat rajoitettuja."
    whatIsCatrobat: "Catrobat on ilmainen, voittoa tavoittelematon ohjelmoinnin opetusalusta. Lue lisää osoitteessa catrobat.org."
    manageLink: 'Voit hallita lapsesi tiliä milloin tahansa <a href="%portalUrl%" style="color: #00acc1;">huoltajaportaalissamme</a>. Lue lisää <a href="%infoUrl%" style="color: #00acc1;">oikeuksistasi huoltajana</a>.'
  confirmed:
    title: "Suostumus annettu"
    message: "Kiitos! Käyttäjän %username% tili on nyt täysin aktivoitu."
    continueButton: "Löydä projekteja"
parent:
  footer:
    link: "Vanhemmat ja huoltajat"
  info:
    title: "Tietoa vanhemmille ja huoltajille"
    intro: "Catrobat suhtautuu nuorten käyttäjien turvallisuuteen ja yksityisyyteen vakavasti. Tällä sivulla kerrotaan, miten suojaamme lastasi ja mitä oikeuksia sinulla on."
    whatIsCatrobat:
      title: "Mikä Catrobat on?"
      text: "Catrobat on ilmainen, voittoa tavoittelematon opetusalusta, jolla nuoret oppivat ohjelmointia luomalla omia sovelluksia, pelejä ja animaatioita. Alusta on saatavilla maailmanlaajuisesti, ja sitä käytetään opetuksessa."
    dataCollected:
      title: "Mitä tietoja keräämme?"
      text: "Keräämme vain alustan toiminnan kannalta välttämättömät tiedot: käyttäjänimen, sähköpostiosoitteen, syntymäajan sekä lapsesi luomat ja lähettämät projektit. Alle 14-vuotiaiden käyttäjien osalta tallennamme myös vanhemman tai huoltajan sähköpostiosoitteen suostumusta varten. Emme myy emmekä jaa henkilötietoja kolmansille osapuolille."
    yourRights:
      title: "Oikeutesi vanhempana tai huoltajana"
      text: "EU:n lastensuojelusäännösten (GDPR) ja COPPA:n mukaan sinulla on oikeus: tarkastella lapsestasi säilyttämiämme tietoja, pyytää niistä kopio, peruuttaa suostumuksesi milloin tahansa (mikä rajoittaa tiliä) sekä pyytää lapsesi tilin ja kaikkien siihen liittyvien tietojen pysyvää poistamista."
    minorRestrictions:
      title: "Mitä rajoituksia alaikäisten tileillä on?"
      text: "Alle 16-vuotiaat käyttäjät eivät voi kirjoittaa tai lukea kommentteja, seurata muita käyttäjiä eivätkä nähdä lapsille sopimattomaksi merkittyä sisältöä. He voivat silti luoda ja lähettää projekteja, selata julkisia projekteja ja reagoida projekteihin tykkäyksillä. Rajoitusten tarkoitus on tarjota turvallinen oppimisympäristö."
    manageButton: "Hallitse lapsesi tiliä"
  portal:
