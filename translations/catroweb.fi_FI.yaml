licenseToPlay:
  link: 'Lupa leikkiä'
  title: 'Lupa leikkiä – mainitse tekijät ja jaa'
  text1: Kuvittele, että jokainen Catrobat-projekti on kakku, hyvin erityinen kakku, jonka mukana tulee resepti (ohjelmointipalikat). Kaikki Catrobat-yhteisön jäsenet jakavat kakkunsa resepteineen. Se tarkoittaa, että voit nauttia kakuista ja oppia tekemään niitä itse!
  text2: 'Salaisia reseptejä ei ole: ohjeet näiden kakkujen tekemiseen ovat kaikkien vapaasti käytettävissä, uudelleenkäytettävissä ja muokattavissa, ja ne toimivat inspiraationa uusille ideoille... tarkoitan kakuille.'
  text3: "Voit syödä kakkuja ja myös kopioida muiden reseptejä tehdäksesi omasi, ehkä eri aineksilla. Tähän vapauteen liittyy kaksi yksinkertaista ehtoa:"
  text4: "Catrobat-yhteisöä perustaessamme päätimme valita tämän lähestymistavan, koska uskomme sen tukevan oppimista ja luovuutta yhteisössä. Jakamalla reseptejä ja aineksia (skriptejä ja grafiikkaa) ihmiset voivat rakentaa toistensa ideoiden päälle, ja kaikki hyötyvät."
  text5: Catrobat-verkkosivustoa suunnitellessamme lisäsimme ominaisuuksia, jotka kannustavat jakamaan ja mainitsemaan muiden panoksen. Jokaisella projektisivulla voit aina ladata projektin alkuperäiset skriptit. Jos remiksaat projektin (muokkaat skriptejä tai grafiikkaa ja jaat tuloksen), kannustamme sinua mainitsemaan projektin muistiinpanoissa ihmiset ja projektin, jotka inspiroivat sinua.
  text6: 'Lue lisää Catrobat-verkkoyhteisön käyttöehdoista sivulta %link-termsOfUse%.'
  list1:
    item1: jaa kakkusi reseptin kanssa
    item2: mainitse ne, jotka inspiroivat sinua
  version: Versio 1.1, 2. huhtikuuta 2013
termsOfUse:
  title: Käyttöehdot
  headline: Tervetuloa Catrobat-yhteisöön!
  text1: 'Osana Catrobat-yhteisöä jaat projekteja ja ideoita ihmisten kanssa:'
  text2: "Tarvitsemme apuasi, jotta tästä yhteisöstä tulee kannustava paikka jokaiselle jäsenelle. Näin voit auttaa:"
  text3: "Catrobat-projektin kautta haluamme edistää yhteistyötä ja antaa kaikkien luovuuden yhdistyä koko ihmiskunnan hyväksi. Voit myös ryhtyä Catrobat-yhteisön aktiiviseksi jäseneksi antamalla projektisi lahjaksi yhteisölle samalla tavalla kuin muut aktiiviset jäsenet antavat projektejaan sinulle:"
  text4: 'Lahjamme sinulle:'
  text5: 'Käyttö- ja palveluehtomme:'
  list1:
    item1: monista eri maista ja kulttuureista
    item2: kaikenikäisten (pienistä lapsista nuoriin ja isovanhempiin)
    item3: kaikilla kokemustasoilla
  list2:
    item1: Ole kunnioittava. Kun jaat projekteja, muista, että monenikäiset ja -taustaiset ihmiset näkevät tuotoksesi.
    item2: "Mainitse tekijät. Voit vapaasti tehdä muokattuja versioita muiden projekteista – muista vain mainita alkuperäiset tekijät. Yksi paikka tähän on projektisi tekijätiedot-osio. Katso tämän luettelon alla olevasta kappaleesta lisätietoja muiden käyttäjien projektien muokkaamisesta."
    item3: "Ole rehellinen. Älä esitä olevasi joku muu kuin olet äläkä yritä huijata yhteisöä."
    item4: "Pidä henkilötietosi yksityisinä. Älä jaa sähköpostiosoitettasi, puhelinnumeroasi tai muita henkilökohtaisia yhteystietojasi."
    item5: "Auta pitämään sivusto ystävällisenä. Jos uskot muiden pitävän jotain projektia tai kommenttia ilkeänä, loukkaavana, liian väkivaltaisena tai muuten sopimattomana, napsauta 'ilmoita sopimattomaksi' -painiketta ja kirjoita lyhyt selitys. Catrobat-tiimi tarkistaa ilmoituksesi ja voi poistaa minkä tahansa projektin, kommentin tai viestin."
  list3:
    item1: "Lähettämällä projektin verkkosivuillemme hyväksyt, että teoksesi julkaistaan tiettyjen lähetettyjä Catrobat-projekteja koskevien vapaiden lisenssien alaisena. Samoin kuin vapaat lisenssit, joilla Catrobat-järjestelmä itse on saatavillasi, nämä lähetettyjen Catrobat-projektien vapaat lisenssit antavat kaikille oikeuden oppia muiden aiemmin lähettämistä töistä sekä muokata ja remiksata niitä rakentaakseen omia uusia, kiehtovia pelejä, animaatioita ja muita projekteja. Näin jokainen voi 'seistä vertaistensa harteilla', ja yksi heistä olet sinä! Työsi hyödyttää siis koko maailmaa ja pysyy kaikkien vapaasti käytettävissä, vähän kuin tekstit ja kuvat, joita vapaaehtoiset ympäri maailmaa lahjoittavat Wikipediaan. Ajattele sitä lahjanasi ihmiskunnalle: sinä annat kaikille, ja kaikki muut, jotka lähettävät töitään verkkosivuillemme, antavat sinulle. Lähetetty projekti on siis arvokas lahja, jonka sen omistaja antaa sinulle ilmaiseksi sillä ehdolla, että osallistut yhteisöön samoin ehdoin."
    item2: Sinun ei tarvitse ottaa lahjaa vastaan; jos otat, tietyt säännöt ovat voimassa. Näiden sääntöjen etuna on, että voit oppia työstä ja rakentaa sen päälle jotain vielä siistimpää itse, minkä voit sitten esim. taas lähettää verkkosivuillemme omanasi. Toinen etu on, että nämä lisenssit varmistavat, ettei sinua voida pitää vastuussa ongelmista, joita muille syntyy heidän käyttäessään projektiasi.
    item3: "Yksi tärkeä lisäehto on, että mainitset selvästi niiden töiden tekijät, joihin oma työsi perustuu. Samalla teemme parhaamme, jotta muut tunnistavat selvästi työsi sinun tekemäksesi: mainitsemme yksilöllisen nimen, jonka olet vapaasti valinnut edustamaan itseäsi Catrobatin yhteisössä, ja annamme muille mahdollisuuden ilmaista julkisesti kiitollisuutensa siitä, että annoit työsi kaikkien ja erityisesti heidän käyttöönsä."
    item4: 'Tarkat oikeudelliset ehdot löydät täältä: %link-licenseUploaded%.'
  list4:
    item1: "Tarjoamme sinulle kaikki omat Catrobat-järjestelmään liittyvät ohjelmistomme ja internetresurssimme, esim. Catrobat-tiimin kirjoittamat ohjelmistot, verkkosivumme ja internetresurssimme, oman Catrobat-järjestelmään liittyvän lähdekoodimme sekä kaiken muun mukana olevan materiaalin, kuten kuvat, äänet ja tekstit, nyt ja tulevaisuudessa Catrobatin vapaiden lisenssien alaisina."
    item2: Nämä lisenssit tekevät Catrobatin kaikista osista sinulle sekä maksuttomia että vapaita siinä mielessä, että saat käyttää niitä haluamallasi tavalla vain muutamin rajoituksin, jotka varmistavat muun muassa, että Catrobat-järjestelmä pysyy ikuisesti vapaana ja hyödyllisenä kaikille.
    item3: 'Tarkat oikeudelliset ehdot löydät täältä: %link-licenseToPlay%. Catrobat-järjestelmän lähdekoodi sekä monet muut asiakirjat ja resurssit ovat saatavilla osoitteessa %link-developer%.'
  list5:
    item1: 'Jos sinä tai, jos olet alle 13-vuotias, vanhempasi tai huoltajasi olette yhteydessä organisaatioon, joka osallistuu laajamittaisiin yksityisyyden loukkauksiin ja/tai massavalvontaan tai on niistä vastuussa, et saa käyttää ohjelmistosovelluksiamme etkä palveluitamme. Tämän rajoituksen tarkat yksityiskohdat ja tietyt poikkeukset siihen on määritelty kohdissa 4.a ja 4.b sivullamme %link-termsOfUse%.'
    item2: Jos olet alle 13-vuotias, sinun täytyy kysyä vanhemmiltasi tai huoltajiltasi, saatko käyttää Catrobatin ohjelmistosovelluksia ja palveluita.
    item3: "Pidätämme oikeuden hylätä, poistaa tai piilottaa projekteja, käyttäjätilejä ja mitä tahansa Catrobatin verkkosivuille lähetettyä digitaalista materiaalia milloin tahansa oman harkintamme mukaan, esimerkiksi jos huomaamme projektin sisältävän sopimatonta materiaalia tai käyttäjän loukkaavan muiden ihmisten oikeuksia."
    item4: "Kaikki Catrobatin ohjelmistot ja internetresurssit tarjotaan siinä toivossa, että niistä on hyötyä, mutta ilman minkäänlaista takuuta."
    item5: 'Yllä olevien kohtien tarkat muotoilut ja muita oikeudellisia ehtoja löydät sivultamme %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service.'
  bottom1: Käy täällä aika ajoin, sillä yritämme jatkuvasti parantaa käyttöehtojamme.
  bottom2: 'Lähetä näitä käyttöehtoja koskevat ehdotukset osoitteeseen %email-webmaster%.'
  version: Versio 1.3, 4. maaliskuuta 2014
