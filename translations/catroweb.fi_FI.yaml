passwordRecovery:
  subject: Catrobat-salasanasi palautus
  message: |
    Hei %username%.
    Pyysit salasanasi nollaamista sivustolla %appplication_url%, koska olet unohtanut salasanasi.
    Jos et pyytänyt tätä, jätä viesti huomiotta. Pyyntö vanhenee ja muuttuu käyttökelvottomaksi 24 tunnin kuluttua.
    Nollaa salasanasi ja luo uusi käymällä seuraavalla sivulla: %confirmationUrl%
    Voit käyttää käyttäjänimeäsi ja salasanaasi milloin tahansa päästäksesi %appplication_url% -yhteisöön.
    Käy sitä varten seuraavalla sivulla: %loginPage%
    Voit muokata profiilisi tietoja tällä sivulla: %profilePage%
    Terveisin
    Catrobat-tiimisi
  messageHtml: |
    <p>
    Hei %username%.<br>
    <br>
    Pyysit salasanasi nollaamista sivustolla <a href="%appplication_url%">Pocket Code</a>, koska olet unohtanut salasanasi.
    Jos et pyytänyt tätä, jätä viesti huomiotta. Pyyntö vanhenee ja muuttuu käyttökelvottomaksi 24 tunnin kuluttua.<br>
    <br>
    Nollaa salasanasi ja luo uusi napsauttamalla <a href="%confirmationUrl%">tästä.</a><br>
    <br>
