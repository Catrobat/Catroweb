privacy-policy:
  header: Tietosuojakäytäntö
  version: Versio 2.2, 17. lokakuuta 2019
  text1: Jotta voimme tarjota sinulle kaikki palveluidemme ja niihin liittyvän tilin edut, meidän on kerättävä sinusta tiettyjä tietoja.
  text2: Palveluidemme (sovellusten ja verkkosivujen) ylläpitämiseksi ja parantamiseksi sekä tieto- ja viestintätekniikan ja STEM/STEAM-opetuksen tieteellistä tutkimusta varten käytämme Google Analyticsia, Crashlyticsia ja Firebasea (kaikki Google LLC, USA) sekä Dynatracea (Dynatrace LLC, USA) saadaksemme metatietoja palveluidemme käytöstä, esim. kaatumistietoja, aikaleimoja, vierailtuja sivuja/näkymiä, sovellustemme ja palveluidemme käyttöä, käytettyä käyttöjärjestelmää ja tietoja verkko-operaattorista. Tätä analyysiä ja kerättyjä tietoja ei yhdistetä profiiliisi, eivätkä ne sisällä henkilötietoja (IP-osoitteen viimeiset bitit anonymisoidaan). Kerätyt tiedot siirretään kuitenkin palveluntarjoajille (Google LLC, USA ja Dynatrace LLC, USA). Tietojenkäsittely perustuu sopimuksiin Google LLC:n ja Dynatrace LLC:n kanssa. Suhde palveluntarjoajiin on Euroopan unionin yleisen tietosuoja-asetuksen (EU GDPR) ja EU:n ja Yhdysvaltojen välisen "Privacy Shield" -sopimuksen mukainen.
  text3: Jotta voit luoda tilin järjestelmiimme ja käyttää sitä ja jotta voimme ilmoittaa sinulle sähköpostitse tiliäsi koskevista tarpeellisista muutoksista, esim. päivityksistä tai käyttö- ja palveluehtojemme, yhteisösääntöjemme tai käytäntöjemme rikkomuksista, tallennamme käyttäjänimesi ja, jos annat sen, sähköpostiosoitteesi. Jos olet yhdistänyt tilisi Google Plusin tai Facebookin kautta, tallennamme lisäksi tunnisteavaimen, joka liittyy tiliisi näissä palveluissa. Emme käytä näitä tietoja mihinkään muuhun (esim. markkinointi)tarkoitukseen, ellet ole nimenomaisesti antanut siihen lupaa.
  text4: Voit vapaaehtoisesti kertoa meille asuinmaasi jakosivuston tilisivulla. Se näytetään julkisessa profiilissasi, ja käytämme sitä vain tilasto- ja tutkimustarkoituksiin. Voit poistaa sen milloin tahansa profiilisi asetuksista.
  text5: Voit milloin tahansa peruuttaa tiliisi kuuluvien henkilötietojen käytön poistamalla tilisi profiilisivultasi osoitteessa https://share.catrob.at/. Tilin poistamisen jälkeen voit edelleen käyttää tarjottuja palveluita, mutta et voi osallistua yhteistyöhön esim. lähettämällä ohjelmia, kommentoimalla tai tykkäämällä. Lisäksi kaikki tiliisi liittyvä sisältö, esim. lähetetyt ohjelmat ja kommentit, poistetaan.
  text6: Palveluidemme väärinkäytön estämiseksi, esim. käyttäjien lähettämien tiedostojen tai kommenttien käyttämisen laittomiin tarkoituksiin, kaikki käyttäjien luoma julkinen sisältö (lähetykset, kommentit) tallennetaan sisäisesti tietokantaan yhdessä aikaleiman ja käytetyn internetosoitteen kanssa. Näitä tietoja ei käytetä eikä luovuteta millekään taholle, ellei ole perusteltua epäillä riittävän vakavaa laitonta toimintaa ja virallisesti valtuutetut oikeusviranomaiset pyydä niitä sovellettavan lain nojalla. Tarkistamme jokaisen tapauksen ensin perusteellisesti yksilöllisesti.
  text7: Voit vapaaehtoisesti tilata Catrobat-uutiskirjeen osoitteessa https://catrob.at/newsletter. Tarjoamme sen MailChimp-palvelun (The Rocket Science Group LLC d/b/a MailChimp, USA) kautta. Saat silloin päivityksiä Catrobat-projektista ja sen palveluista antamaasi sähköpostiosoitteeseen. Voit perua uutiskirjeen milloin tahansa jokaisen uutiskirjeen alatunnisteessa olevalla "unsubscribe"-linkillä. Uutiskirjeen tarjoaa MailChimp, jonka kanssa meillä on tietojenkäsittelysopimus ja joka on sitoutunut EU:n yleiseen tietosuoja-asetukseen ja EU:n ja Yhdysvaltojen väliseen "Privacy Shield" -sopimukseen. Lisätietoja MailChimpistä löydät myös MailChimpin tietosuojakäytännöstä ja käyttöehdoista.
  text8: Kaikki palvelut tarjoaa vapaa avoimen lähdekoodin Catrobat-projekti International Catrobat Associationin – Verein zur Förderung freier Software – alaisuudessa. Se on Grazissa, Itävallassa (Euroopan unioni) rekisteröity voittoa tavoittelematon kansalaisjärjestö. Käytäntömme noudattavat EU:n ja Itävallan tietosuojalainsäädäntöä (GDPR). Ota meihin yhteyttä sähköpostitse osoitteeseen contact@catrobat.org tai postitse osoitteeseen Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).
  text9: Jos olet alle 14-vuotias, laillisen huoltajan (yleensä vanhemman) on hyväksyttävä tämä käytäntö.
  text10: Catrobatin virallinen englanninkielinen tietosuojakäytäntö on saatavilla verkossa osoitteessa %privacy_policy%.
  disagree-text: Ilman hyväksyntää emme voi luoda tiliä, mutta keskeiset toiminnot ovat silti käytettävissä.
