  welcome: "Tervetuloa Catrobatiin!"
  greeting: "Kiitos rekisteröitymisestä! Vahvista sähköpostiosoitteesi päästäksesi alkuun."
  message: "Vahvista sähköpostiosoitteesi napsauttamalla alla olevaa painiketta. Linkki on voimassa %time% asti, ja sitä voi käyttää vain kerran."
