  headline: Catrobat ප්‍රජාවට සාදරයෙන් පිළිගන්නවා!
  text1: 'Catrobat ප්‍රජාවේ කොටසක් විදිහට, ඔයා ව්‍යාපෘති සහ අදහස් බෙදාගන්නේ මේ වගේ අය එක්ක:'
  text2: 'මේ ප්‍රජාව හැම සාමාජිකයෙකුටම සහාය දෙන තැනක් කරන්න අපිට ඔයාගේ උදව් ඕන. ඔයාට උදව් කරන්න පුළුවන් විදිහ මෙන්න:'
  text3: 'Catrobat ව්‍යාපෘතිය හරහා අපිට ඕන සහයෝගීතාව දිරිමත් කරලා, මුළු මනුෂ්‍ය වර්ගයාගේම යහපත වෙනුවෙන් හැමෝගේම නිර්මාණශීලීත්වය එකතු වෙන්න ඉඩ දෙන්න. වෙන ක්‍රියාශීලී සාමාජිකයන් ඔවුන්ගේ ව්‍යාපෘති ඔයාට දෙනවා වගේම, ඔයාගේ ව්‍යාපෘති තෑග්ගක් විදිහට ප්‍රජාවට ආපහු දීලා ඔයාටත් Catrobat ප්‍රජාවේ ක්‍රියාශීලී සාමාජිකයෙක් වෙන්න පුළුවන්:'
  text4: 'අපෙන් ඔයාට තෑග්ග:'
  text5: 'අපේ භාවිත සහ සේවා නියම:'
  list1:
    item1: ගොඩක් වෙනස් රටවල් සහ සංස්කෘතිවලින්
    item2: හැම වයසකම (පොඩි ළමයින්ගේ ඉඳන් යෞවනයන් සහ ආච්චි සීයලා දක්වා)
    item3: හැම මට්ටමකම අත්දැකීම් තියෙන
  list2:
    item1: ගෞරවයෙන් ඉන්න. ව්‍යාපෘති බෙදාගද්දී, ගොඩක් වෙනස් වයස්වල සහ පසුබිම්වල අය ඔයාගේ දායකත්වය දකිනවා කියලා මතක තියාගන්න.
    item2: ගෞරවය දෙන්න. වෙන අයගේ ව්‍යාපෘතිවල වෙනස් කළ අනුවාද හදන්න නිදහසේ පුළුවන් - ඔවුන්ට ගෞරවය දෙන්න විතරක් අමතක කරන්න එපා. ගෞරවය දෙන්න පුළුවන් එක තැනක් තමයි ඔයාගේ ව්‍යාපෘතියේ සටහන් සහ ස්තූතිය කොටස. වෙන පරිශීලකයන්ගේ ව්‍යාපෘති වෙනස් කිරීම ගැන විස්තර සඳහා කරුණාකර මේ ලැයිස්තුවට පහළින් තියෙන ඡේදය බලන්න.
    item3: අවංක වෙන්න. ඔයා නොවන කෙනෙක් වගේ පෙන්නන්න හෝ ප්‍රජාව රවට්ටන්න එපා.
    item4: පෞද්ගලික තොරතුරු පෞද්ගලිකව තියාගන්න. ඔයාගේ විද්‍යුත් තැපැල් ලිපිනය, දුරකථන අංකය හෝ වෙනත් පෞද්ගලික සම්බන්ධතා තොරතුරු බෙදාගන්න එපා.
    item5: අඩවිය මිත්‍රශීලීව තියාගන්න උදව් කරන්න. ව්‍යාපෘතියක් හෝ අදහසක් නපුරු, අපහාසාත්මක, ප්‍රචණ්ඩ වැඩි, හෝ වෙනත් විදිහකින් නුසුදුසුයි කියලා වෙන අයට හිතෙයි කියලා ඔයාට දැනෙනවා නම්, 'නුසුදුසු ලෙස වාර්තා කරන්න' බොත්තම ක්ලික් කරලා කෙටි පැහැදිලි කිරීමක් ලියන්න. Catrobat කණ්ඩායම ඔයාගේ වාර්තාව සමාලෝචනය කරලා ඕනම ව්‍යාපෘතියක්, අදහසක් හෝ පළ කිරීමක් ඉවත් කරන්න පුළුවන්.
  list3:
    item1: 'අපේ වෙබ් අඩවිවලට ව්‍යාපෘතියක් උඩුගත කිරීමෙන්, උඩුගත කළ Catrobat ව්‍යාපෘති සඳහා වන යම් නිදහස් බලපත්‍ර යටතේ මේ නිර්මාණය තියන්න ඔයා පිළිගන්නවා සහ එකඟ වෙනවා. Catrobat පද්ධතියම ඔයාට ලැබෙන නිදහස් බලපත්‍ර වගේම, උඩුගත කළ Catrobat ව්‍යාපෘතිවල මේ නිදහස් බලපත්‍ර හැමෝටම අයිතියක් දෙනවා වෙන අය කලින් උඩුගත කළ නිර්මාණවලින් ඉගෙනගන්න සහ ඒ නිර්මාණ අනුවර්තනය කරලා රීමික්ස් කරලා තමන්ගේම අලුත් පුදුම ක්‍රීඩා, සජීවිකරණ සහ වෙනත් ව්‍යාපෘති හදන්න. මේකෙන් හැමෝටම ''තමන්ගේ සගයන්ගේ උරහිස් මත නැගී සිටින්න'' පුළුවන්, ඔවුන්ගෙන් කෙනෙක් ඔයා! ඒ නිසා ඔයාගේ නිර්මාණය මුළු ලෝකයටම වාසියක් වෙනවා, හැමෝටම පාවිච්චි කරන්න නිදහසේ තියෙනවා, ලොව පුරා ස්වේච්ඡා සේවකයන් Wikipedia එකට නිදහසේ දායක කරන පෙළ සහ පින්තූර වගේ. ඒක මනුෂ්‍ය වර්ගයාට ඔයාගේ තෑග්ගක් කියලා හිතන්න: ඔයා හැමෝටම දෙනවා, අපේ වෙබ් අඩවිවලට තමන්ගේ නිර්මාණ උඩුගත කරන අනිත් හැමෝම ඔයාට දෙනවා. ඉතින් උඩුගත කළ ව්‍යාපෘතියක් කියන්නේ ඒකේ අයිතිකරු ඔයාට නොමිලේ දෙන ගොඩක් වටිනා තෑග්ගක්, ඔයාත් ඒ නියමයන් යටතේම ප්‍රජාවට සහභාගී වෙනවා කියන කොන්දේසිය එක්ක.'
    item2: ඔයාට තෑග්ග පිළිගන්න ඕන නැහැ; පිළිගත්තොත්, යම් නීති අදාළ වෙනවා. මේ නීතිවල වාසිය තමයි ඔයාට නිර්මාණයෙන් ඉගෙනගෙන ඒ මත ගොඩනගලා ඔයාම තවත් නියම දේවල් හදන්න පුළුවන් වීම, ඒවා ඔයාට උදාහරණයක් විදිහට ආයෙත් ඔයාගේම නිර්මාණ ලෙස අපේ වෙබ් අඩවිවලට උඩුගත කරන්න පුළුවන්. තවත් වාසියක් තමයි වෙන අය ඔයාගේ ව්‍යාපෘතිය පාවිච්චි කිරීමෙන් ඔවුන්ට ඇතිවෙන කිසිම ප්‍රශ්නයකට ඔයාව වගකිවයුතු කරන්න බැරි බව මේ බලපත්‍ර සහතික කිරීම.
    item3: එක වැදගත් අමතර කොන්දේසියක් තමයි ඔයාගේ නිර්මාණයට පදනම් කරගත් නිර්මාණවල කතුවරුන්ට ඔයා පැහැදිලිව ගෞරවය දෙන්න ඕන කියන එක. ඒ එක්කම, Catrobat ප්‍රජාවේ ඔයාව නියෝජනය කරන්න ඔයා නිදහසේ තෝරාගත් අනන්‍ය නමට ගෞරවය දීමෙන්, සහ ඔයාගේ නිර්මාණය හැමෝටම, විශේෂයෙන්ම ඔවුන්ට, දීම ගැන ඔයාට ප්‍රසිද්ධියේ කෘතඥතාව පළ කරන්න වෙන අයට අවස්ථාව දීමෙන්, ඔයාගේ නිර්මාණය ඔයාගේ දායකත්වයක් කියලා වෙන අය පැහැදිලිව අගය කරන විදිහට අපි මහන්සි වෙලා වැඩ කරනවා.
    item4: නිවැරදි නීතිමය නියම සහ කොන්දේසි සඳහා කරුණාකර %link-licenseUploaded% බලන්න.
  list4:
    item1: Catrobat පද්ධතියට අදාළ අපේම මෘදුකාංග සහ අන්තර්ජාල සම්පත් ඔක්කොම, උදාහරණයක් විදිහට Catrobat කණ්ඩායම ලියපු මෘදුකාංග, අපේ වෙබ් අඩවි සහ අන්තර්ජාල සම්පත්, Catrobat පද්ධතියට අදාළ අපේම මූලාශ්‍ර කේතය, සහ පින්තූර, ශබ්ද සහ පෙළ වගේ ඇතුළත් අමතර ද්‍රව්‍ය ඔක්කොම, දැනුත් අනාගතයේදීත් Catrobat හි නිදහස් බලපත්‍ර යටතේ අපි ඔයාට දෙනවා.
    item2: මේ බලපත්‍ර නිසා Catrobat හි හැම කොටසක්ම ඔයාට නොමිලේ ලැබෙනවා වගේම, ඔයාට කැමති විදිහට පාවිච්චි කරන්න නිදහසත් දෙනවා, Catrobat පද්ධතිය හැමදාම හැමෝටම නිදහස් සහ ප්‍රයෝජනවත් වෙලා තියෙන්න සහතික කරන සීමා කිහිපයක් විතරක් එක්ක.
    item3: නිවැරදි නීතිමය නියම සහ කොන්දේසි සඳහා කරුණාකර %link-licenseToPlay% බලන්න. Catrobat පද්ධතියේ මූලාශ්‍ර කේතය සහ තවත් ගොඩක් ලේඛන සහ සම්පත් %link-developer% හරහා ලබාගන්න පුළුවන්.
  list5:
    item1: ඔයා, හෝ ඔයා අවුරුදු 13ට අඩු නම් ඔයාගේ දෙමාපියන් හෝ නීත්‍යානුකූල භාරකරුවන්, දැල් දමන ආකාරයේ රහස්‍යතා උල්ලංඝනයන්ට සහ/හෝ තොග හෝ මහා පරිමාණ නිරීක්ෂණයට සම්බන්ධ හෝ වගකිව යුතු සංවිධානයක් එක්ක සම්බන්ධ නම්, ඔයාට අපේ මෘදුකාංග යෙදුම් පාවිච්චි කරන්න සහ අපේ සේවාවලට පිවිසෙන්න අවසර නැහැ. මේ සීමාවේ නිවැරදි විස්තර සහ ඒකට යම් ව්‍යතිරේක අපේ %link-termsOfUse% හි 4.a සහ 4.b කොටස්වල දක්වලා තියෙනවා.
    item2: ඔයා අවුරුදු 13ට අඩු නම්, Catrobat හි මෘදුකාංග යෙදුම් සහ සේවා පාවිච්චි කරන්න ඔවුන් ඉඩ දෙනවද කියලා ඔයාගේ දෙමාපියන්ගෙන් හෝ නීත්‍යානුකූල භාරකරුවන්ගෙන් අහන්න ඕන.
    item3: අපේ තනි අභිමතය පරිදි ඕනම වෙලාවක, උදාහරණයක් විදිහට ව්‍යාපෘතියක නුසුදුසු දේවල් තියෙනවා කියලා හෝ පරිශීලකයෙක් වෙන අයගේ අයිතිවාසිකම් උල්ලංඝනය කරනවා කියලා අපිට පෙනුණොත්, Catrobat හි වෙබ් අඩවිවලට උඩුගත කළ ව්‍යාපෘති, පරිශීලක ගිණුම් සහ ඕනම ඩිජිටල් ද්‍රව්‍යයක් ප්‍රතික්ෂේප කරන්න, මකන්න හෝ සඟවන්න අපිට අයිතිය තියෙනවා.
    item4: Catrobat හි මෘදුකාංග සහ අන්තර්ජාල සම්පත් ඔක්කොම දෙන්නේ ඒවා ප්‍රයෝජනවත් වෙයි කියන බලාපොරොත්තුවෙන්, ඒත් කිසිම වගකීමක් නැතිව.
    item5: ඉහත කරුණුවල නිවැරදි සූත්‍රගත කිරීම් සහ තවත් නීතිමය නියම සහ කොන්දේසි සඳහා කරුණාකර අපේ %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service බලන්න.
