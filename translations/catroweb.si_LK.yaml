  info:
    title: දෙමාපියන් සහ භාරකරුවන් සඳහා තොරතුරු
    intro: Catrobat තරුණ පරිශීලකයන්ගේ ආරක්ෂාව සහ රහස්‍යතාව බැරෑරුම් ලෙස සලකනවා. අපි ඔයාගේ දරුවා ආරක්ෂා කරන්නේ කොහොමද, ඔයාට තියෙන අයිතිවාසිකම් මොනවද කියලා මේ පිටුවෙන් පැහැදිලි කරනවා.
    whatIsCatrobat:
      title: Catrobat කියන්නේ මොකක්ද?
      text: Catrobat කියන්නේ තරුණ අය තමන්ගේම යෙදුම්, ක්‍රීඩා සහ සජීවිකරණ හදමින් ක්‍රමලේඛනය ඉගෙනගන්න නොමිලේ, ලාභ නොලබන අධ්‍යාපනික වේදිකාවක්. මේ වේදිකාව ලොව පුරා තියෙනවා, අධ්‍යාපන පරිසරවලත් පාවිච්චි කරනවා.
    dataCollected:
      title: අපි මොන දත්තද එකතු කරන්නේ?
      text: 'අපි වේදිකාව ක්‍රියාත්මක කරන්න අවශ්‍ය අවම දත්ත විතරයි එකතු කරන්නේ: පරිශීලක නාමය, විද්‍යුත් තැපැල් ලිපිනය, උපන් දිනය, සහ ඔයාගේ දරුවා හදලා උඩුගත කරන ව්‍යාපෘති. වයස අවුරුදු 14ට අඩු පරිශීලකයන් සඳහා, කැමැත්ත ලබාගන්න දෙමාපිය/භාරකරු විද්‍යුත් තැපැල් ලිපිනයකුත් අපි ගබඩා කරනවා. අපි පෞද්ගලික දත්ත තෙවන පාර්ශවයන්ට විකුණන්නේ හෝ බෙදාගන්නේ නැහැ.'
    yourRights:
      title: දෙමාපියෙක් හෝ භාරකරුවෙක් ලෙස ඔයාගේ අයිතිවාසිකම්
      text: 'EU ළමා ආරක්ෂණ රෙගුලාසි (GDPR) සහ COPPA යටතේ ඔයාට මේ අයිතිවාසිකම් තියෙනවා: ඔයාගේ දරුවා ගැන අපි ළඟ තියෙන දත්ත බලන්න, ඒ දත්තවල පිටපතක් ඉල්ලන්න, ඕනම වෙලාවක ඔයාගේ කැමැත්ත අවලංගු කරන්න (එතකොට ගිණුම සීමා වෙනවා), සහ ඔයාගේ දරුවාගේ ගිණුම සහ ඒකට අදාළ හැම දත්තයක්ම සදහටම මකන්න ඉල්ලන්න.'
    minorRestrictions:
      title: බාල වයස්කරුවන්ගේ ගිණුම්වලට මොන සීමාද තියෙන්නේ?
      text: අවුරුදු 16ට අඩු පරිශීලකයන්ට අදහස් පළ කරන්න හෝ කියවන්න, වෙන පරිශීලකයන් අනුගමනය කරන්න, හෝ ළමයින්ට සුදුසු නැහැ කියලා ලකුණු කළ අන්තර්ගතය බලන්න බැහැ. ඒත් ඔවුන්ට ව්‍යාපෘති හදලා උඩුගත කරන්න, පොදු ව්‍යාපෘති බලන්න, සහ කැමැත්තෙන් ව්‍යාපෘතිවලට ප්‍රතිචාර දක්වන්න පුළුවන්. ආරක්ෂිත ඉගෙනුම් පරිසරයක් දෙන්න තමයි මේ සීමා තියෙන්නේ.
    manageButton: ඔයාගේ දරුවාගේ ගිණුම කළමනාකරණය කරන්න
