  subject: ඔයාගේ Catrobat මුරපද ප්‍රතිසාධනය
  message: |
    ආදරණීය %username%,
    ඔයාට මුරපදය අමතක වුණු නිසා %appplication_url% හි ඔයාගේ මුරපදය යළි සකසන්න ඔයා ඉල්ලුවා.
    ඔයා මේක ඉල්ලුවේ නැත්නම්, කරුණාකර නොසලකා හරින්න. ඒක පැය 24කින් කල් ඉකුත් වෙලා නිෂ්ඵල වෙනවා.
    ඔයාගේ මුරපදය යළි සකසලා අලුත් එකක් හදන්න, කරුණාකර මේ පිටුවට යන්න: %confirmationUrl%
    %appplication_url% ප්‍රජාවට පිවිසෙන්න ඔයාට ඕනම වෙලාවක ඔයාගේ පරිශීලක නාමය සහ මුරපදය පාවිච්චි කරන්න පුළුවන්.
    ඒකට, මේ පිටුවට යන්න: %loginPage%
    ඔයාගේ පැතිකඩ විස්තර සංස්කරණය කරන්න, මේ පිටුවට යන්න: %profilePage%
    සුබ පැතුම්,
    ඔයාගේ Catrobat කණ්ඩායම.
  messageHtml: |
    <p>
    ආදරණීය %username%,<br>
    <br>
    ඔයාට මුරපදය අමතක වුණු නිසා <a href="%appplication_url%">Pocket Code</a> හි ඔයාගේ මුරපදය යළි සකසන්න ඔයා ඉල්ලුවා.
    ඔයා මේක ඉල්ලුවේ නැත්නම්, කරුණාකර නොසලකා හරින්න. ඒක පැය 24කින් කල් ඉකුත් වෙලා නිෂ්ඵල වෙනවා.<br>
    <br>
    ඔයාගේ මුරපදය යළි සකසලා අලුත් එකක් හදන්න, කරුණාකර <a href="%confirmationUrl%">මෙතන</a> ක්ලික් කරන්න.<br>
    <br>
    <a href="%appplication_url%">Pocket Code</a> ප්‍රජාවට පිවිසෙන්න ඔයාට ඕනම වෙලාවක ඔයාගේ පරිශීලක නාමය සහ මුරපදය පාවිච්චි කරන්න පුළුවන්.<br>
    ඒකට, මේ පිටුවට යන්න: <a href="%loginPage%">පුරනය වීමේ පිටුව</a><br>
    ඔයාගේ පැතිකඩ විස්තර සංස්කරණය කරන්න, මේ <a href="%profilePage%">පිටුවට</a> යන්න.<br>
    <br>
    සුබ පැතුම්,<br>
    ඔයාගේ Catrobat කණ්ඩායම.
    </p>
