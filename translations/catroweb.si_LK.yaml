    explanation: Catrobat කියන්නේ තරුණ අය යෙදුම්, ක්‍රීඩා සහ සජීවිකරණ හදමින් කේතනය ඉගෙනගන්න නොමිලේ අධ්‍යාපනික වේදිකාවක්. EU ළමා ආරක්ෂණ රෙගුලාසි යටතේ, ඔයාගේ දරුවාට ප්‍රජාවට සම්පූර්ණයෙන් සහභාගී වෙන්න කලින් අපිට ඔයාගේ කැමැත්ත ඕන. කැමැත්ත දෙන්න කරුණාකර පහළ බොත්තම ක්ලික් කරන්න.
