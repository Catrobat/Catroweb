  title: සෙල්ලම් කිරීමේ බලපත්‍රය - ගෞරවය දීලා බෙදාගන්න
  text1: හැම Catrobat ව්‍යාපෘතියක්ම කේක් එකක් කියලා හිතන්න, ඒකේ වට්ටෝරුවත් (ක්‍රමලේඛන කැට) එක්කම එන හරිම විශේෂ කේක් එකක්. Catrobat ප්‍රජාවේ හැම සාමාජිකයෙක්ම තමන්ගේ කේක් වට්ටෝරු එක්කම බෙදාගන්නවා. ඒ කියන්නේ ඔයාට කේක් රස විඳින්නත්, ඒවා ඔයාම හදන්න ඉගෙනගන්නත් පුළුවන්!
  text2: 'රහස් වට්ටෝරු නැහැ: මේ කේක් හදන උපදෙස් ඕනම කෙනෙකුට පාවිච්චි කරන්න, නැවත පාවිච්චි කරන්න, වෙනස් කරන්න සහ අලුත් අදහස්වලට... මම කියන්නේ කේක්වලට... ආශ්වාදයක් විදිහට ගන්න විවෘතයි.'
  text3: 'ඔයාට කේක් කන්නත් පුළුවන්, වෙන අයගේ වට්ටෝරු පිටපත් කරලා ඔයාගේම ඒවා හදන්නත් පුළුවන්, සමහරවිට වෙනස් අමුද්‍රව්‍ය එක්ක. මේ නිදහසට සරල කොන්දේසි දෙකක් තියෙනවා:'
  text4: Catrobat ප්‍රජාව හදද්දී, ප්‍රජාව ඇතුළේ ඉගෙනීමට සහ නිර්මාණශීලීත්වයට ඒක උදව් වෙනවා කියලා අපි විශ්වාස කරන නිසා අපි මේ ක්‍රමය තෝරාගත්තා. වට්ටෝරු සහ අමුද්‍රව්‍ය (ස්ක්‍රිප්ට් සහ චිත්‍ර) බෙදාගැනීමෙන්, අයට එකිනෙකාගේ අදහස් මත ගොඩනගන්න පුළුවන්, හැමෝටම ඒකෙන් වාසියක් වෙනවා.
  text5: Catrobat වෙබ් අඩවිය හදද්දී, අය බෙදාගන්න සහ වෙන අයට ගෞරවය දෙන්න දිරිමත් කරන විශේෂාංග අපි එකතු කළා. හැම ව්‍යාපෘති පිටුවකින්ම ඔයාට ඒ ව්‍යාපෘතියේ මුල් ස්ක්‍රිප්ට් ඕනම වෙලාවක බාගන්න පුළුවන්. ඔයා ව්‍යාපෘතියක් රීමික්ස් කරනවා නම් (ස්ක්‍රිප්ට් හෝ චිත්‍ර වෙනස් කරලා, ප්‍රතිඵලය බෙදාගන්නවා නම්), ඔයාට ආශ්වාදයක් දුන්න අය සහ ව්‍යාපෘතිය සඳහන් කරලා ව්‍යාපෘති සටහන්වල ගෞරවය දෙන්න අපි ඔයාව දිරිමත් කරනවා.
  text6: Catrobat මාර්ගගත ප්‍රජාවේ භාවිත නියම ගැන වැඩිදුර %link-termsOfUse% හි දැනගන්න.
