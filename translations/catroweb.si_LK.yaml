privacy-policy:
  header: රහස්‍යතා ප්‍රතිපත්තිය
  version: අනුවාදය 2.2, 2019 ඔක්තෝබර් 17
  text1: අපේ සේවාවල සහ ඒකට අදාළ ගිණුමේ හැම වාසියක්ම ඔයාට දෙන්න, ඔයාගෙන් යම් දත්ත එකතු කරන්න අවශ්‍යයි.
  text2: අපේ සේවා (යෙදුම් සහ වෙබ් අඩවි) නඩත්තු කරන්න සහ දියුණු කරන්න, සහ ICT සහ STEM/STEAM අධ්‍යාපනය ගැන විද්‍යාත්මක පර්යේෂණ කරන්න, අපේ සේවා පාවිච්චිය ගැන පාරදත්ත ලබාගන්න අපි Google LLC (USA) හි Google Analytics, Crashlytics සහ Firebase, සහ Dynatrace LLC (USA) හි Dynatrace පාවිච්චි කරනවා, උදාහරණයක් විදිහට බිඳවැටීම් තොරතුරු, කාල මුද්‍රා, බැලූ පිටු/තිර, අපේ යෙදුම් සහ සේවා පාවිච්චිය, පාවිච්චි කළ මෙහෙයුම් පද්ධතිය, සහ ජාල සපයන්නා ගැන තොරතුරු. මේ විශ්ලේෂණය සහ එකතු කළ දත්ත ඔයාගේ පැතිකඩට සම්බන්ධ නැහැ, කිසිම පෞද්ගලික තොරතුරක් ඇතුළත් නැහැ (IP ලිපිනයේ අවසාන බිටු නිර්නාමික කරනවා). කෙසේ වෙතත්, එකතු කළ දත්ත සේවා සපයන්නන්ට (Google LLC, USA සහ Dynatrace LLC, USA) මාරු කරනවා. දත්ත සැකසීම Google LLC සහ Dynatrace LLC එක්ක ඇති ගිවිසුම් මත පදනම් වෙලා තියෙනවා. සේවා සපයන්නන් එක්ක ඇති මේ සම්බන්ධතාව යුරෝපා සංගමයේ සාමාන්‍ය දත්ත ආරක්ෂණ රෙගුලාසියට (EU GDPR) සහ EU-USA "Privacy Shield" ගිවිසුමට අනුකූලයි.
  text3: 'අපේ පද්ධතිවල ගිණුමක් හදලා පාවිච්චි කරන්න, සහ ඔයාගේ ගිණුම ගැන අවශ්‍ය වෙනස්කම් ගැන, උදාහරණයක් විදිහට යාවත්කාලීන කිරීම් හෝ අපේ භාවිත සහ සේවා නියම, ප්‍රජා නීති හෝ ප්‍රතිපත්ති උල්ලංඝනය කිරීම් ගැන, ඔයාට විද්‍යුත් තැපෑලෙන් දැනුම් දෙන්න, අපි ඔයාගේ පරිශීලක නාමය සහ, ඔයා දුන්නොත්, ඔයාගේ විද්‍යුත් තැපැල් ලිපිනය ගබඩා කරනවා. ඔයා Google Plus හෝ Facebook හරහා ඔයාගේ ගිණුම සම්බන්ධ කරලා නම්, ඒ සේවාවල ඔයාගේ ගිණුමට සම්බන්ධ හඳුනාගැනීමේ යතුරකුත් අපි ගබඩා කරනවා. ඔයා පැහැදිලිවම අවසර දුන්නේ නැත්නම්, අපි මේ දත්ත වෙනත් කිසිම (උදා: අලෙවිකරණ) අරමුණකට පාවිච්චි කරන්නේ නැහැ.'
  text4: ස්වේච්ඡාවෙන්, බෙදාගැනීමේ අඩවියේ ඔයාගේ ගිණුම් පිටුව හරහා ඔයා ජීවත් වෙන රට අපිට දෙන්න පුළුවන්. ඒක ඔයාගේ පොදු පැතිකඩේ පෙන්වනවා, අපි ඒක පාවිච්චි කරන්නේ සංඛ්‍යාලේඛන සහ පර්යේෂණ අරමුණු සඳහා විතරයි. ඔයාගේ පැතිකඩ සැකසුම්වලින් ඕනම වෙලාවක ඒක ඉවත් කරන්න පුළුවන්.
  text5: https://share.catrob.at/ හි ඔයාගේ පැතිකඩ පිටුව හරහා ඔයාගේ ගිණුම මකලා, ඔයාගේ ගිණුමට අයත් පෞද්ගලික දත්ත පාවිච්චිය ඕනම වෙලාවක ඉල්ලා අස්කරගන්න පුළුවන්. ඔයාගේ ගිණුම මැකුවට පස්සෙත් ඔයාට සපයන සේවා පාවිච්චි කරන්න පුළුවන්, ඒත් සහයෝගයෙන් වැඩ කරන්න බැහැ, උදාහරණයක් විදිහට වැඩසටහන් උඩුගත කරන්න, අදහස් දක්වන්න හෝ කැමැත්ත පළ කරන්න. ඒ වගේම, ඔයාගේ ගිණුමට සම්බන්ධ සපයපු හැම අන්තර්ගතයක්ම, උදාහරණයක් විදිහට උඩුගත කළ වැඩසටහන්, අදහස් ආදිය මැකෙනවා.
  text6: අපේ සේවා අනිසි ලෙස පාවිච්චි කිරීම වළක්වන්න, උදාහරණයක් විදිහට නීති විරෝධී අරමුණු සඳහා පරිශීලකයන් දායක කරන උඩුගත කිරීම් හෝ අදහස් හරහා, පරිශීලකයන් හදන හැම පොදු දත්තයක්ම (උඩුගත කිරීම්, අදහස්) කාල මුද්‍රාවක් සහ පාවිච්චි කළ අන්තර්ජාල ලිපිනය එක්ක දත්ත ගබඩාවක අභ්‍යන්තරව ගබඩා කරනවා. ප්‍රමාණවත් නීති විරෝධී ක්‍රියා ගැන සාධාරණ සැකයක් තියෙන්නේ නැත්නම් සහ නිල වශයෙන් බලය ලත් නීතිමය ආයතන අදාළ නීතිය මත එය ඉල්ලන්නේ නැත්නම්, මේ දත්ත කිසිම ආයතනයක් පාවිච්චි කරන්නේ හෝ ඔවුන්ට යවන්නේ නැහැ. හැම අවස්ථාවක්ම මුලින්ම අපි තනි තනිව හොඳින් පරීක්ෂා කරනවා.
  text7: ඔයාට ස්වේච්ඡාවෙන් https://catrob.at/newsletter හි Catrobat පුවත් ලිපියට දායක වෙන්න පුළුවන්, අපි ඒක MailChimp සේවාව (The Rocket Science Group LLC d/b/a MailChimp, USA) හරහා සපයනවා. එතකොට ඔයා දුන්න විද්‍යුත් තැපැල් ලිපිනයට Catrobat ව්‍යාපෘතිය සහ ඒකේ සේවා ගැන යාවත්කාලීන ලැබෙනවා. හැම පුවත් ලිපියකම පාදකයේ තියෙන "unsubscribe" සබැඳිය පාවිච්චි කරලා ඕනම වෙලාවක පුවත් ලිපියෙන් ඉවත් වෙන්න පුළුවන්. මේ පුවත් ලිපිය සපයන්නේ MailChimp, ඔවුන් එක්ක අපිට දත්ත සැකසීමේ ගිවිසුමක් තියෙනවා, ඔවුන් EU සාමාන්‍ය දත්ත ආරක්ෂණ රෙගුලාසියට සහ EU-USA "Privacy Shield" එකට කැපවෙලා ඉන්නවා. MailChimp ගැන වැඩි විස්තර සඳහා කරුණාකර MailChimp හි රහස්‍යතා ප්‍රතිපත්තිය සහ භාවිත නියමත් බලන්න.
  text8: හැම සේවාවක්ම සපයන්නේ නොමිලේ විවෘත මූලාශ්‍ර Catrobat ව්‍යාපෘතිය, International Catrobat Association – Verein zur Förderung freier Software යටතේ, ඒක ඔස්ට්‍රියාවේ (යුරෝපා සංගමය) ග්‍රාස් හි සංස්ථාගත ලාභ නොලබන රාජ්‍ය නොවන සංවිධානයක්. අපේ ප්‍රතිපත්ති EU සහ ඔස්ට්‍රියානු දත්ත ආරක්ෂණ නීතියට (GDPR) ගරු කරනවා. අපිව සම්බන්ධ කරගන්න, කරුණාකර contact@catrobat.org වෙත විද්‍යුත් තැපෑලක් එවන්න හෝ Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union) වෙත ලිපියක් එවන්න.
  text9: ඔයා අවුරුදු 14ට අඩු නම්, මේ ප්‍රතිපත්තිය නීත්‍යානුකූල භාරකරුවෙක් (සාමාන්‍යයෙන් දෙමාපියෙක්) පිළිගන්න ඕන.
  text10: Catrobat හි නිල ඉංග්‍රීසි භාෂා රහස්‍යතා ප්‍රතිපත්තිය වෙබ් එකේ %privacy_policy% යටතේ තියෙනවා.
  disagree-text: අනුමැතිය නැතිව අපිට ගිණුමක් හදන්න බැහැ, ඒත් ප්‍රධාන විශේෂාංග තවමත් පාවිච්චි කරන්න පුළුවන්.
