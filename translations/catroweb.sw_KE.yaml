privacy-policy:
  header: Sera ya Faragha
  version: "Toleo 2.2, 17 Oktoba 2019"
  text1: "Ili kukupa faida zote za huduma zetu na akaunti inayohusiana, ni lazima tukusanye data fulani kutoka kwako."
  text2: "Ili kudumisha na kuboresha huduma zetu (programu na tovuti) na kufanya utafiti wa kisayansi kuhusu elimu ya TEHAMA na STEM/STEAM, tunatumia Google Analytics, Crashlytics na Firebase, zote za Google LLC (Marekani), pamoja na Dynatrace ya Dynatrace LLC (Marekani) kupata metadata kuhusu matumizi ya huduma zetu, k.m. taarifa za kuanguka kwa programu, muda, kurasa/skrini ulizotembelea, matumizi ya programu na huduma zetu, mfumo wa uendeshaji uliotumika, na taarifa kuhusu mtoa huduma wa mtandao. Uchambuzi huu na data iliyokusanywa haihusishwi na wasifu wako na haina taarifa yoyote binafsi (tarakimu za mwisho za anwani ya IP hufichwa). Hata hivyo, data iliyokusanywa itahamishiwa kwa watoa huduma (Google LLC, Marekani na Dynatrace LLC, Marekani). Uchakataji wa data unategemea makubaliano na Google LLC na Dynatrace LLC. Uhusiano huu na watoa huduma unafuata Kanuni ya Jumla ya Ulinzi wa Data ya Umoja wa Ulaya (EU GDPR) na makubaliano ya EU-Marekani \"Privacy Shield\"."
  text3: "Ili kufungua na kutumia akaunti katika mifumo yetu, na kukujulisha kwa barua pepe kuhusu mabadiliko muhimu ya akaunti yako, k.m. masasisho au ukiukaji wa Masharti yetu ya Matumizi na Huduma, sheria za jumuiya yetu, au sera zetu, tutahifadhi jina lako la mtumiaji na, ukitupatia, anwani yako ya barua pepe. Ikiwa umeunganisha akaunti yako kupitia Google Plus au Facebook, pia tunahifadhi ufunguo wa utambulisho unaohusiana na akaunti yako kwenye huduma hizo. Hatutatumia data hii kwa madhumuni mengine yoyote (k.m. matangazo), isipokuwa umetuuruhusu waziwazi."
  text4: "Kwa hiari, unaweza kutupa nchi unayoishi kupitia ukurasa wa akaunti yako kwenye tovuti ya kushiriki. Hii itaonyeshwa kwenye wasifu wako wa umma na itatumiwa nasi kwa madhumuni ya takwimu na utafiti tu. Unaweza kuiondoa wakati wowote katika mipangilio ya wasifu wako."
  text5: "Unaweza kusitisha matumizi ya data binafsi ya akaunti yako wakati wowote kwa kufuta akaunti yako kupitia ukurasa wa wasifu wako kwenye https://share.catrob.at/. Baada ya kufuta akaunti yako bado utaweza kutumia huduma zinazotolewa, lakini hutaweza kushirikiana, k.m. kwa kupakia programu, kutoa maoni au kupenda. Pia, maudhui yote yanayohusiana na akaunti yako, k.m. programu zilizopakiwa, maoni, n.k., yatafutwa."
  text6: "Ili kuzuia matumizi mabaya ya huduma zetu, k.m. kupitia upakiaji au maoni ya watumiaji kwa madhumuni haramu, data yote ya umma inayotolewa na watumiaji (upakiaji, maoni) itahifadhiwa ndani ya hifadhidata, pamoja na muda na anwani ya mtandao iliyotumika. Data hii haitatumiwa na wala kupelekwa kwa taasisi yoyote, isipokuwa kuna mashaka ya kutosha ya vitendo haramu na taasisi za kisheria zenye mamlaka rasmi ziiombe kwa mujibu wa sheria. Kila kesi itachunguzwa kwanza kwa makini na sisi mmoja mmoja."
  text7: "Unaweza kujiandikisha kwa hiari kupokea Jarida la Catrobat kwenye https://catrob.at/newsletter linalotolewa nasi kupitia huduma ya MailChimp (The Rocket Science Group LLC d/b/a MailChimp, Marekani). Kisha utapokea habari kuhusu mradi wa Catrobat na huduma zake kwenye anwani ya barua pepe uliyotoa. Unaweza kujiondoa kwenye jarida wakati wowote kwa kutumia kiungo cha \"unsubscribe\" chini ya kila jarida. Jarida hili linatolewa na MailChimp ambao tuna makubaliano nao ya uchakataji wa data na ambao wamejitolea kufuata Kanuni ya Jumla ya Ulinzi wa Data ya EU na \"Privacy Shield\" ya EU-Marekani. Kwa maelezo zaidi kuhusu MailChimp tafadhali angalia pia Sera ya Faragha na Masharti ya Matumizi ya MailChimp."
  text8: "Huduma zote zinatolewa na mradi huria wa bure wa Catrobat chini ya mwavuli wa International Catrobat Association – Verein zur Förderung freier Software, shirika lisilo la kiserikali na lisilo la faida lililosajiliwa Graz, Austria (Umoja wa Ulaya). Sera zetu zinaheshimu sheria za ulinzi wa data za EU na Austria (GDPR). Ili kuwasiliana nasi, tafadhali tuma barua pepe kwa contact@catrobat.org au utuandikie kwa Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Umoja wa Ulaya)."
  text9: "Ikiwa una umri wa chini ya miaka 14, sera hii lazima ikubaliwe na mlezi wa kisheria (kwa kawaida mzazi)."
  text10: "Sera rasmi ya faragha ya Catrobat kwa lugha ya Kiingereza inapatikana mtandaoni kwenye %privacy_policy%."
  disagree-text: "Bila idhini, hatuwezi kufungua akaunti lakini vipengele vikuu bado vinapatikana."
