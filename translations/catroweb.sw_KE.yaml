accountConfirmation:
  subject: Your Catrobat Account Confirmation
  message: "Mpendwa %username%.\nIli kumaliza kuwezesha akaunti yako, tafadhali tembelea %confirmationUrl%\nKiungo hiki kinaweza kutumika mara moja tu kuthibitisha akaunti yako.\nSalamu za dhati,\nTimu yako ya Catrobat.\n"
  messageHtml: "<p>\nMpendwa %username%.<br>\n<br>\nIli kumaliza kuwezesha akaunti yako, tafadhali bofya <a href=\"%confirmationUrl%\">hapa.</a><br>\nKiungo hiki kinaweza kutumika mara moja tu kuthibitisha akaunti yako.<br>\n<br>\nSalamu za dhati,<br>\nTimu yako ya Catrobat.\n</p>\n"
newAccountConfirmation:
  subject: "Thibitisha anwani yako ya barua pepe"
  welcome: "Karibu Catrobat!"
  greeting: "Asante kwa kujisajili! Tafadhali thibitisha anwani yako ya barua pepe ili kuanza."
  message: "Bofya kitufe hapa chini kuthibitisha barua pepe yako. Kiungo hiki ni halali hadi %time% na kinaweza kutumika mara moja tu."
  button: "Thibitisha Barua Pepe"
  ignore: "Kama hukufungua akaunti ya Catrobat, unaweza kupuuza barua pepe hii bila wasiwasi."
  autoDelete: "Akaunti ambazo hazijathibitishwa hufutwa kiotomatiki baada ya siku 30."
consent:
  email:
    subject: "Idhini ya mzazi inahitajika kwa akaunti ya Catrobat ya mtoto wako"
    title: "Idhini ya Mzazi Inahitajika"
    greeting: "Habari,"
    message: "Mtoto wako %username% amefungua akaunti kwenye Catrobat na amethibitisha anwani yake ya barua pepe."
    explanation: "Catrobat ni jukwaa la elimu la bure ambapo vijana hujifunza kuandika programu kwa kuunda programu, michezo na uhuishaji. Chini ya kanuni za EU za ulinzi wa watoto, tunahitaji idhini yako kabla mtoto wako hajashiriki kikamilifu katika jumuiya. Tafadhali bofya kitufe hapa chini kutoa idhini."
    button: "Toa Idhini ya Mzazi"
    ignore: "Kama hukutarajia barua pepe hii, unaweza kuipuuza bila wasiwasi. Bila idhini, akaunti itakuwa na vipengele vichache."
    whatIsCatrobat: "Catrobat ni jukwaa la bure la elimu ya programu lisilo la kibiashara. Jifunze zaidi kwenye catrobat.org."
    manageLink: "Unaweza kusimamia akaunti ya mtoto wako wakati wowote kupitia <a href=\"%portalUrl%\" style=\"color: #00acc1;\">Lango la Wazazi</a>. Jifunze zaidi kuhusu <a href=\"%infoUrl%\" style=\"color: #00acc1;\">haki zako kama mzazi</a>."
  confirmed:
    title: "Idhini Imetolewa"
    message: "Asante! Akaunti ya %username% sasa imewezeshwa kikamilifu."
    continueButton: "Gundua miradi"
parent:
  footer:
    link: "Wazazi na Walezi"
  info:
    title: "Taarifa kwa Wazazi na Walezi"
    intro: "Catrobat inachukulia kwa uzito usalama na faragha ya watumiaji wachanga. Ukurasa huu unaeleza jinsi tunavyomlinda mtoto wako na haki ulizo nazo."
    whatIsCatrobat:
      title: "Catrobat ni nini?"
      text: "Catrobat ni jukwaa la elimu la bure lisilo la kibiashara ambapo vijana hujifunza programu kwa kuunda programu, michezo na uhuishaji wao wenyewe. Jukwaa linapatikana duniani kote na linatumika katika mazingira ya elimu."
    dataCollected:
      title: "Tunakusanya data gani?"
      text: "Tunakusanya data ya chini kabisa inayohitajika kuendesha jukwaa: jina la mtumiaji, anwani ya barua pepe, tarehe ya kuzaliwa, na miradi yoyote ambayo mtoto wako anaunda na kupakia. Kwa watumiaji walio chini ya miaka 14, tunahifadhi pia anwani ya barua pepe ya mzazi/mlezi kwa madhumuni ya idhini. Hatuuzi wala kushiriki data binafsi na wahusika wengine."
    yourRights:
      title: "Haki zako kama mzazi au mlezi"
      text: "Chini ya kanuni za EU za ulinzi wa watoto (GDPR) na COPPA, una haki ya: kukagua data tuliyo nayo kuhusu mtoto wako, kuomba nakala ya data hiyo, kubatilisha idhini yako wakati wowote (jambo linalozuia akaunti), na kuomba kufutwa kwa kudumu kwa akaunti ya mtoto wako na data zote zinazohusiana."
    minorRestrictions:
      title: "Ni vikwazo gani vinavyotumika kwa akaunti za watoto?"
      text: "Watumiaji walio chini ya miaka 16 hawawezi kuandika au kusoma maoni, kufuata watumiaji wengine, au kuona maudhui yaliyowekwa alama kuwa hayafai kwa watoto. Bado wanaweza kuunda na kupakia miradi, kuvinjari miradi ya umma, na kuitikia miradi kwa kupenda. Vikwazo hivi vipo ili kutoa mazingira salama ya kujifunza."
    manageButton: "Simamia Akaunti ya Mtoto Wako"
  portal:
    title: "Lango la Wazazi"
    description: "Weka anwani yako ya barua pepe ili kupokea kiungo salama cha kusimamia akaunti ya Catrobat ya mtoto wako. Kiungo kitatumwa kwa anwani ya barua pepe uliyotoa wakati wa usajili."
    emailLabel: "Anwani yako ya barua pepe"
    submitButton: "Tuma Kiungo cha Usimamizi"
    infoLink: "Jifunze Zaidi"
    success:
      title: "Angalia kikasha chako"
      message: "Kama kuna akaunti inayohusishwa na barua pepe hii, tumetuma kiungo cha usimamizi. Tafadhali angalia kikasha chako na ufuate kiungo kusimamia akaunti ya mtoto wako."
