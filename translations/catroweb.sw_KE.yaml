licenseToPlay:
  link: 'Leseni ya kuchezesha'
  title: "Leseni ya kucheza - Toa sifa na ushiriki"
  text1: "Fikiria kwamba kila mradi wa Catrobat ni keki, keki maalum sana inayokuja na mapishi yake (vitalu vya programu). Wanachama wote wa jumuiya ya Catrobat hushiriki keki zao pamoja na mapishi yao. Hii inamaanisha unaweza kufurahia keki na kujifunza jinsi ya kuzitengeneza mwenyewe!"
  text2: "Hakuna mapishi ya siri: maelekezo ya jinsi ya kutengeneza keki hizi yako wazi kwa mtu yeyote kutumia, kutumia tena, kubadilisha, na kutumika kama msukumo wa mawazo mapya... yaani keki."
  text3: "Unaweza kula keki na pia kunakili mapishi ya watu wengine kutengeneza yako mwenyewe, labda kwa viungo tofauti. Uhuru huu unakuja na masharti mawili rahisi:"
  text4: "Tulipoanzisha jumuiya ya Catrobat, tuliamua kutumia mtazamo huu kwa sababu tunaamini unasaidia kujifunza na ubunifu ndani ya jumuiya. Kwa kushiriki mapishi na viungo (hati na kazi za sanaa), watu wanaweza kujenga juu ya mawazo ya wengine na kila mtu atanufaika."
  text5: In designing the Catrobat website, we included features to encourage people to share and to give credit to others. On each project page, you can always download the original scripts for the project. If you remix a project (modifying the scripts or artwork, and sharing the result), we encourage you to give credit in the Project Notes, mentioning the people and project that inspired you.
  text6: "Jifunze zaidi kuhusu masharti ya matumizi ya jumuiya ya mtandaoni ya Catrobat kwenye %link-termsOfUse%."
  list1:
    item1: "shiriki keki zako pamoja na mapishi"
    item2: "toa sifa kwa waliokuhamasisha"
  version: Toleo 1.1, 2 Aprili 2013
termsOfUse:
  title: Masharti ya matumizi
  headline: Welcome to the Catrobat Community!
  text1: "Kama sehemu ya jumuiya ya Catrobat, unashiriki miradi na mawazo na watu:"
  text2: "Tunahitaji msaada wako kufanya jumuiya hii kuwa mahali pa kusaidiana kwa kila mwanachama. Hivi ndivyo unavyoweza kusaidia:"
  text3: "Kupitia mradi wa Catrobat tunataka kukuza ushirikiano na kuruhusu ubunifu wa kila mtu kuungana kwa manufaa ya binadamu wote. Wewe pia unaweza kuwa mwanachama hai wa jumuiya ya Catrobat kwa kurudisha miradi yako kwa jumuiya kama zawadi, kama wanachama wengine hai wanavyokupa miradi yao:"
  text4: 'Zawadi yetu kwako:'
  text5: 'Masharti ya matumizi na Huduma:'
  list1:
    item1: "kutoka nchi na tamaduni nyingi tofauti"
    item2: "wa umri wote (kuanzia watoto wadogo hadi vijana na babu na bibi)"
    item3: "wenye viwango vyote vya uzoefu"
  list2:
    item1: "Kuwa na heshima. Unaposhiriki miradi, tafadhali kumbuka kwamba watu wa umri na asili nyingi tofauti wataona michango yako."
    item2: "Give credit. Feel free to make modified versions of other people's projects - just make sure to give them credit. One place to give credit is in your project's credits section. Please see the paragraph below this dotted list for details about modifying projects of other users."
    item3: "Kuwa mkweli. Usijifanye kuwa mtu mwingine au kujaribu kudanganya jumuiya."
    item4: "Weka taarifa binafsi kuwa siri. Usishiriki anwani yako ya barua pepe, nambari ya simu, au taarifa nyingine binafsi za mawasiliano."
    item5: "Saidia kuweka tovuti kuwa ya kirafiki. Kama unahisi wengine wangeona mradi au maoni kuwa mabaya, ya matusi, yenye vurugu nyingi, au yasiyofaa kwa njia nyingine, bofya tu kitufe cha 'ripoti kuwa haifai' na uache maelezo mafupi. Timu ya Catrobat itakagua ripoti yako na inaweza kuondoa mradi, maoni au chapisho lolote."
  list3:
    item1: "Kwa kupakia mradi kwenye tovuti zetu, unakubali kuweka kazi hii chini ya leseni fulani huru za miradi ya Catrobat iliyopakiwa. Kama leseni huru ambazo mfumo wa Catrobat wenyewe unapatikana kwako, leseni hizi huru za miradi iliyopakiwa humpa kila mtu haki ya kujifunza kutokana na kazi iliyopakiwa awali na wengine na kuirekebisha na kuichanganya upya ili kujenga michezo mipya ya kuvutia, uhuishaji na miradi mingine. Hii inamruhusu kila mtu 'kusimama juu ya mabega ya wenzake', mmoja wao akiwa wewe! Kazi yako itanufaisha dunia nzima na kubaki huru kwa kila mtu kutumia, kidogo kama maandishi na picha zinazochangiwa bure kwenye Wikipedia na watu wa kujitolea kutoka kote duniani. Ifikirie kama zawadi yako kwa binadamu: unampa kila mtu, na wengine wote wanaopakia kazi zao kwenye tovuti zetu wanakupa wewe. Hivyo mradi uliopakiwa ni zawadi ya thamani kubwa ambayo mmiliki wake anakupa bure, kwa sharti kwamba ushiriki katika jumuiya kwa masharti hayo hayo."
    item2: "Huna lazima ya kukubali zawadi; ukikubali, sheria fulani zinatumika. Faida za sheria hizi ni kwamba unaweza kujifunza kutokana na kazi na kujenga juu yake kutengeneza vitu vizuri zaidi mwenyewe, ambavyo unaweza, kwa mfano, kupakia tena kwenye tovuti zetu kama vyako. Faida nyingine ni kwamba leseni hizi zinahakikisha huwezi kuwajibishwa kwa matatizo yoyote yanayowapata wengine kupitia matumizi yao ya mradi wako."
    item3: "Sharti moja muhimu la ziada ni kwamba utoe sifa wazi kwa waandishi ambao kazi zao ulizitumia kama msingi wa kazi yako. Wakati huo huo, tutafanya kazi kwa bidii ili kazi yako itambuliwe wazi na wengine kuwa ni mchango wako, kwa kutoa sifa kwa jina la kipekee ulilochagua kwa hiari kukuwakilisha katika jumuiya ya Catrobat, na kwa kuwapa wengine nafasi ya kukushukuru hadharani kwa kutoa kazi yako kwa kila mtu, na hasa kwao."
    item4: "Tafadhali angalia %link-licenseUploaded% kwa masharti kamili ya kisheria."
  list4:
    item1: "Tunakupa programu zetu zote na rasilimali za mtandao zinazohusiana na mfumo wa Catrobat, kwa mfano, programu zilizoandikwa na timu ya Catrobat, tovuti zetu na rasilimali za mtandao, msimbo wetu wa chanzo unaohusiana na mfumo wa Catrobat, na nyenzo zote za ziada kama, kwa mfano, picha, sauti na maandishi, sasa na siku zijazo chini ya leseni huru za Catrobat."
    item2: "Leseni hizi hufanya sehemu zote za Catrobat kuwa bure kwako na pia huru kwa maana ya kukupa uhuru wa kuzitumia upendavyo, kwa vikwazo vichache tu vinavyohakikisha, miongoni mwa mengine, kwamba mfumo wa Catrobat utabaki huru na wenye manufaa kwa kila mtu milele."
    item3: "Tafadhali angalia %link-licenseToPlay% kwa masharti kamili ya kisheria. Msimbo wa chanzo wa mfumo wa Catrobat pamoja na nyaraka na rasilimali nyingine nyingi zinapatikana kupitia %link-developer%."
  list5:
    item1: "Kama wewe, au, kama uko chini ya miaka 13, wazazi au walezi wako wa kisheria, mnahusishwa na shirika linalohusika au kuwajibika kwa ukiukaji wa faragha wa aina ya upekuzi mpana na/au ufuatiliaji wa watu wengi, basi huruhusiwi kutumia programu zetu na kufikia huduma zetu. Maelezo kamili ya kizuizi hiki na baadhi ya vighairi vyake yameelezwa katika Vifungu 4.a na 4.b kwenye %link-termsOfUse% yetu."
    item2: "Kama uko chini ya miaka 13, basi lazima uwaulize wazazi au walezi wako wa kisheria kama wanakuruhusu kutumia Programu na Huduma za Catrobat."
    item3: "Tunahifadhi haki ya kukataa, kufuta au kuficha miradi, akaunti za watumiaji, na nyenzo zozote za kidijitali zilizopakiwa kwenye tovuti za Catrobat wakati wowote kwa uamuzi wetu pekee, kwa mfano kama tutagundua kuwa mradi una maudhui yasiyofaa au mtumiaji anakiuka haki za watu wengine."
    item4: "Programu zote na rasilimali za mtandao za Catrobat zinatolewa kwa matumaini kwamba zitakuwa na manufaa, lakini bila dhamana yoyote."
    item5: "Tafadhali angalia %link-termsOfUse% yetu developer.catrobat.org/terms_of_use_and_service kwa maelezo kamili ya hoja zilizo hapo juu na baadhi ya masharti ya ziada ya kisheria."
  bottom1: "Rudi hapa mara kwa mara, kwa sababu tunajaribu kila wakati kuboresha Masharti yetu ya Matumizi."
  bottom2: "Tafadhali tuma mapendekezo yoyote kuhusu Masharti haya ya Matumizi kwa %email-webmaster%."
  version: Toleo 1.1, 2 Aprili 2013
