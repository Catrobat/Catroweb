  message: "Mpendwa %username%.\nUmeomba kuweka upya nenosiri lako kwenye %appplication_url% kwa sababu umesahau nenosiri lako.\nKama hukuomba hili, tafadhali lipuuze. Litaisha muda na kukosa matumizi baada ya saa 24.\nIli kuweka upya nenosiri lako na kuunda jipya, tafadhali tembelea ukurasa ufuatao: %confirmationUrl%\nUnaweza kutumia jina lako la mtumiaji na nenosiri lako wakati wowote kufikia jumuiya ya %appplication_url%.\nIli kufanya hivyo, tembelea ukurasa ufuatao: %loginPage%\nIli kuhariri maelezo ya wasifu wako, nenda kwenye ukurasa huu: %profilePage%\nSalamu za dhati,\nTimu yako ya Catrobat.\n"
  messageHtml: "<p>\nMpendwa %username%.<br>\n<br>\nUmeomba kuweka upya nenosiri lako kwenye <a href=\"%appplication_url%\">Pocket Code</a> kwa sababu umesahau nenosiri lako.\nKama hukuomba hili, tafadhali lipuuze. Litaisha muda na kukosa matumizi baada ya saa 24.<br>\n<br>\nIli kuweka upya nenosiri lako na kuunda jipya, tafadhali bofya <a href=\"%confirmationUrl%\">hapa.</a><br>\n<br>\nUnaweza kutumia jina lako la mtumiaji na nenosiri lako wakati wowote kufikia jumuiya ya <a href=\"%appplication_url%\">Pocket Code</a>.<br>\nIli kufanya hivyo, tembelea ukurasa ufuatao: <a href=\"%loginPage%\">Ukurasa wa Kuingia</a><br>\nIli kuhariri maelezo ya wasifu wako, nenda kwenye <a href=\"%profilePage%\">ukurasa</a> huu.<br>\n<br>\nSalamu za dhati,<br>\nTimu yako ya Catrobat.\n</p>\n"
