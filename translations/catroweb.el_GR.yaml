    explanation: 'Το Catrobat είναι μια δωρεάν εκπαιδευτική πλατφόρμα όπου οι νέοι μαθαίνουν προγραμματισμό δημιουργώντας εφαρμογές, παιχνίδια και κινούμενα σχέδια. Σύμφωνα με τους κανονισμούς της ΕΕ για την προστασία των παιδιών, χρειαζόμαστε τη συγκατάθεσή σου για να μπορεί το παιδί σου να συμμετέχει πλήρως στην κοινότητα. Κάνε κλικ στο παρακάτω κουμπί για να δώσεις τη συγκατάθεσή σου.'
