privacy-policy:
  header: Πολιτική απορρήτου
  version: 'Έκδοση 2.2, 17 Οκτωβρίου 2019'
  text1: 'Για να σου προσφέρουμε όλα τα οφέλη των υπηρεσιών μας και του σχετικού λογαριασμού, είναι απαραίτητο να συλλέξουμε ορισμένα δεδομένα από σένα.'
  text2: 'Για τη διατήρηση και βελτίωση των υπηρεσιών μας (εφαρμογές και ιστότοποι) και για επιστημονική έρευνα στην εκπαίδευση ΤΠΕ και STEM/STEAM, χρησιμοποιούμε τα Google Analytics, Crashlytics και Firebase, όλα της Google LLC (ΗΠΑ), καθώς και το Dynatrace της Dynatrace LLC (ΗΠΑ), για να λαμβάνουμε μεταδεδομένα σχετικά με τη χρήση των υπηρεσιών μας, π.χ. πληροφορίες σφαλμάτων, χρονοσφραγίδες, σελίδες/οθόνες που επισκέφθηκες, χρήση των εφαρμογών και υπηρεσιών μας, το λειτουργικό σύστημα που χρησιμοποιείς και πληροφορίες για τον πάροχο δικτύου. Αυτή η ανάλυση και τα δεδομένα που συλλέγονται δεν συνδέονται με το προφίλ σου και δεν περιέχουν προσωπικές πληροφορίες (τα τελευταία ψηφία της διεύθυνσης IP ανωνυμοποιούνται). Ωστόσο, τα δεδομένα που συλλέγονται διαβιβάζονται στους παρόχους υπηρεσιών (Google LLC, ΗΠΑ και Dynatrace LLC, ΗΠΑ). Η επεξεργασία δεδομένων βασίζεται σε συμφωνίες με την Google LLC και την Dynatrace LLC. Αυτή η σχέση με τους παρόχους υπηρεσιών συμμορφώνεται με τον Γενικό Κανονισμό για την Προστασία Δεδομένων της Ευρωπαϊκής Ένωσης (GDPR) και τη συμφωνία ΕΕ-ΗΠΑ «Privacy Shield».'
  text3: 'Για να δημιουργήσεις και να χρησιμοποιήσεις λογαριασμό στα συστήματά μας, και για να σε ενημερώνουμε μέσω email για απαραίτητες αλλαγές στον λογαριασμό σου, π.χ. ενημερώσεις ή παραβιάσεις των Όρων Χρήσης και Υπηρεσιών μας, των κανόνων της κοινότητάς μας ή των πολιτικών μας, αποθηκεύουμε το όνομα χρήστη σου και, αν το έχεις δώσει, τη διεύθυνση email σου. Αν έχεις συνδέσει τον λογαριασμό σου μέσω Google Plus ή Facebook, αποθηκεύουμε επιπλέον ένα κλειδί αναγνώρισης που συνδέεται με τον λογαριασμό σου σε αυτές τις υπηρεσίες. Δεν θα χρησιμοποιήσουμε αυτά τα δεδομένα για κανέναν άλλο σκοπό (π.χ. μάρκετινγκ), εκτός αν μας το έχεις επιτρέψει ρητά.'
  text4: 'Προαιρετικά, μπορείς να μας δηλώσεις τη χώρα διαμονής σου από τη σελίδα του λογαριασμού σου στον ιστότοπο κοινοποίησης. Αυτή θα εμφανίζεται στο δημόσιο προφίλ σου και θα χρησιμοποιείται από εμάς μόνο για στατιστικούς και ερευνητικούς σκοπούς. Μπορείς να την αφαιρέσεις ανά πάσα στιγμή από τις ρυθμίσεις του προφίλ σου.'
  text5: 'Μπορείς να ανακαλέσεις τη χρήση των προσωπικών δεδομένων του λογαριασμού σου ανά πάσα στιγμή, διαγράφοντας τον λογαριασμό σου από τη σελίδα του προφίλ σου στο https://share.catrob.at/. Μετά τη διαγραφή του λογαριασμού σου θα μπορείς να χρησιμοποιείς ακόμα τις παρεχόμενες υπηρεσίες, αλλά όχι να συνεργάζεσαι, π.χ. ανεβάζοντας προγράμματα, σχολιάζοντας ή δίνοντας «μου αρέσει». Επίσης, όλο το περιεχόμενο που συνδέεται με τον λογαριασμό σου, π.χ. ανεβασμένα προγράμματα, σχόλια κ.λπ., θα διαγραφεί.'
  text6: 'Για να αποτρέψουμε την κατάχρηση των υπηρεσιών μας, π.χ. μέσω ανεβασμάτων ή σχολίων χρηστών για παράνομους σκοπούς, όλα τα δημόσια δεδομένα που δημιουργούν οι χρήστες (ανεβάσματα, σχόλια) αποθηκεύονται εσωτερικά σε βάση δεδομένων, μαζί με χρονοσφραγίδα και τη διεύθυνση διαδικτύου που χρησιμοποιήθηκε. Αυτά τα δεδομένα δεν θα χρησιμοποιηθούν από κανέναν φορέα ούτε θα διαβιβαστούν σε αυτόν, εκτός αν υπάρχει εύλογη υποψία επαρκώς παράνομων ενεργειών και επίσημα αρμόδιες νομικές αρχές τα ζητήσουν βάσει του ισχύοντος δικαίου. Κάθε περίπτωση θα ελέγχεται πρώτα διεξοδικά από εμάς σε ατομική βάση.'
  text7: 'Μπορείς προαιρετικά να εγγραφείς στο Newsletter του Catrobat στο https://catrob.at/newsletter, το οποίο παρέχουμε μέσω της υπηρεσίας MailChimp (The Rocket Science Group LLC d/b/a MailChimp, ΗΠΑ). Θα λαμβάνεις τότε ενημερώσεις για το έργο Catrobat και τις υπηρεσίες του στη διεύθυνση email που έδωσες. Μπορείς να διακόψεις τη συνδρομή στο newsletter ανά πάσα στιγμή μέσω του συνδέσμου «unsubscribe» στο κάτω μέρος κάθε newsletter. Αυτό το newsletter παρέχεται από τη MailChimp, με την οποία έχουμε συμφωνία επεξεργασίας δεδομένων και η οποία έχει δεσμευτεί στον Γενικό Κανονισμό για την Προστασία Δεδομένων της ΕΕ και στο «Privacy Shield» ΕΕ-ΗΠΑ. Για περισσότερες λεπτομέρειες σχετικά με τη MailChimp, δες επίσης την Πολιτική Απορρήτου και τους Όρους Χρήσης της MailChimp.'
  text8: 'Όλες οι υπηρεσίες παρέχονται από το ελεύθερο έργο ανοιχτού κώδικα Catrobat υπό την αιγίδα της International Catrobat Association – Verein zur Förderung freier Software, μιας μη κερδοσκοπικής ΜΚΟ με έδρα στο Γκρατς της Αυστρίας (Ευρωπαϊκή Ένωση). Οι πολιτικές μας σέβονται το δίκαιο προστασίας δεδομένων της ΕΕ και της Αυστρίας (GDPR). Για να επικοινωνήσεις μαζί μας, στείλε email στο contact@catrobat.org ή γράψε μας στη διεύθυνση Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Ευρωπαϊκή Ένωση).'
  text9: 'Αν είσαι κάτω των 14 ετών, αυτή η πολιτική πρέπει να γίνει αποδεκτή από νόμιμο κηδεμόνα (συνήθως γονέα).'
  text10: 'Η επίσημη αγγλική πολιτική απορρήτου του Catrobat είναι διαθέσιμη στο διαδίκτυο στο %privacy_policy%.'
  disagree-text: 'Χωρίς την έγκρισή σου δεν μπορούμε να δημιουργήσουμε λογαριασμό, αλλά οι βασικές λειτουργίες παραμένουν διαθέσιμες.'
