licenseToPlay:
  link: 'Άδεια για παιχνίδι'
  title: 'Άδεια για παιχνίδι - Αναγνώρισε τους δημιουργούς και μοιράσου'
  text1: 'Φαντάσου ότι κάθε έργο Catrobat είναι ένα κέικ, ένα πολύ ξεχωριστό κέικ που έρχεται μαζί με τη συνταγή του (τα τουβλάκια προγραμματισμού). Όλα τα μέλη της κοινότητας Catrobat μοιράζονται τα κέικ τους μαζί με τις συνταγές τους. Αυτό σημαίνει ότι μπορείς να απολαύσεις τα κέικ και να μάθεις να τα φτιάχνεις κι εσύ!'
  text2: 'Δεν υπάρχουν μυστικές συνταγές: οι οδηγίες για το πώς φτιάχνονται αυτά τα κέικ είναι ανοιχτές σε όλους για να τις χρησιμοποιούν, να τις ξαναχρησιμοποιούν, να τις τροποποιούν και να εμπνέονται για νέες ιδέες... εννοώ κέικ.'
  text3: 'Μπορείς να φας τα κέικ, αλλά και να αντιγράψεις τις συνταγές άλλων για να φτιάξεις τα δικά σου, ίσως με διαφορετικά υλικά. Αυτή η ελευθερία συνοδεύεται από δύο απλές προϋποθέσεις:'
  text4: 'Όταν στήσαμε την κοινότητα Catrobat, αποφασίσαμε να υιοθετήσουμε αυτή την προσέγγιση γιατί πιστεύουμε ότι στηρίζει τη μάθηση και τη δημιουργικότητα μέσα στην κοινότητα. Μοιράζοντας συνταγές και υλικά (σενάρια και γραφικά), οι άνθρωποι μπορούν να χτίζουν πάνω στις ιδέες των άλλων και όλοι κερδίζουν.'
  text5: 'Σχεδιάζοντας τον ιστότοπο του Catrobat, προσθέσαμε λειτουργίες που ενθαρρύνουν τους ανθρώπους να μοιράζονται και να αναγνωρίζουν τους άλλους. Σε κάθε σελίδα έργου μπορείς πάντα να κατεβάσεις τα αρχικά σενάρια του έργου. Αν ανακατασκευάσεις ένα έργο (τροποποιώντας τα σενάρια ή τα γραφικά και μοιράζοντας το αποτέλεσμα), σε ενθαρρύνουμε να αναφέρεις στις σημειώσεις του έργου τους ανθρώπους και το έργο που σε ενέπνευσαν.'
  text6: 'Μάθε περισσότερα για τους όρους χρήσης της διαδικτυακής κοινότητας Catrobat στο %link-termsOfUse%.'
  list1:
    item1: 'μοιράσου τα κέικ σου μαζί με τη συνταγή'
    item2: 'αναγνώρισε όσους σε ενέπνευσαν'
  version: 'Έκδοση 1.1, 2 Απριλίου 2013'
termsOfUse:
  title: Όροι χρήσης
  headline: 'Καλώς ήρθες στην κοινότητα του Catrobat!'
  text1: 'Ως μέλος της κοινότητας Catrobat, μοιράζεσαι έργα και ιδέες με ανθρώπους:'
  text2: 'Χρειαζόμαστε τη βοήθειά σου για να κάνουμε αυτή την κοινότητα ένα υποστηρικτικό μέρος για κάθε μέλος. Να πώς μπορείς να βοηθήσεις:'
  text3: 'Μέσα από το έργο Catrobat θέλουμε να καλλιεργήσουμε τη συνεργασία και να επιτρέψουμε στη δημιουργικότητα όλων να ενωθεί προς όφελος όλης της ανθρωπότητας. Μπορείς κι εσύ να γίνεις ενεργό μέλος της κοινότητας Catrobat χαρίζοντας τα έργα σου πίσω στην κοινότητα, με τον ίδιο τρόπο που άλλα ενεργά μέλη χαρίζουν τα δικά τους έργα σε σένα:'
  text4: 'Το δώρο μας προς εσένα:'
  text5: 'Οι όροι χρήσης και υπηρεσιών μας:'
  list1:
    item1: από πολλές διαφορετικές χώρες και πολιτισμούς
    item2: 'όλων των ηλικιών (από μικρά παιδιά μέχρι εφήβους και παππούδες)'
    item3: με όλα τα επίπεδα εμπειρίας
  list2:
    item1: 'Να σέβεσαι τους άλλους. Όταν μοιράζεσαι έργα, θυμήσου ότι θα δουν τη συνεισφορά σου άνθρωποι πολλών διαφορετικών ηλικιών και καταβολών.'
    item2: 'Να αναφέρεις τους δημιουργούς. Μπορείς ελεύθερα να φτιάχνεις τροποποιημένες εκδοχές έργων άλλων - απλώς φρόντισε να τους αναφέρεις. Ένα σημείο για να το κάνεις είναι η ενότητα ευχαριστιών του έργου σου. Δες την παράγραφο κάτω από αυτή τη λίστα για λεπτομέρειες σχετικά με την τροποποίηση έργων άλλων χρηστών.'
    item3: 'Να είσαι ειλικρινής. Μην προσποιείσαι ότι είσαι κάποιος άλλος και μην προσπαθείς να ξεγελάσεις την κοινότητα.'
    item4: 'Κράτα τις προσωπικές πληροφορίες ιδιωτικές. Μη μοιράζεσαι τη διεύθυνση email σου, τον αριθμό τηλεφώνου σου ή άλλα προσωπικά στοιχεία επικοινωνίας.'
    item5: 'Βοήθησε να μείνει ο ιστότοπος φιλικός. Αν πιστεύεις ότι άλλοι θα έβρισκαν ένα έργο ή σχόλιο κακό, προσβλητικό, υπερβολικά βίαιο ή γενικά ακατάλληλο, απλώς κάνε κλικ στο κουμπί «αναφορά ως ακατάλληλο» και γράψε μια σύντομη εξήγηση. Η ομάδα του Catrobat θα εξετάσει την αναφορά σου και μπορεί να αφαιρέσει οποιοδήποτε έργο, σχόλιο ή ανάρτηση.'
  list3:
    item1: 'Ανεβάζοντας ένα έργο στους ιστότοπούς μας, αποδέχεσαι και συμφωνείς να διαθέσεις αυτή τη δουλειά υπό ορισμένες ελεύθερες άδειες για ανεβασμένα έργα Catrobat. Όπως και οι ελεύθερες άδειες με τις οποίες σου διατίθεται το ίδιο το σύστημα Catrobat, αυτές οι ελεύθερες άδειες δίνουν σε όλους το δικαίωμα να μαθαίνουν από δουλειές που έχουν ανεβάσει άλλοι και να τις προσαρμόζουν και να τις ανακατασκευάζουν για να φτιάξουν τα δικά τους νέα, συναρπαστικά παιχνίδια, κινούμενα σχέδια και άλλα έργα. Έτσι ο καθένας μπορεί να «πατάει στους ώμους των συνομηλίκων του», και ένας από αυτούς είσαι εσύ! Η δουλειά σου θα ωφελήσει έτσι όλο τον κόσμο και θα παραμείνει ελεύθερη για όλους, κάπως όπως τα κείμενα και οι εικόνες που προσφέρουν ελεύθερα στη Wikipedia εθελοντές από όλο τον κόσμο. Σκέψου το σαν δώρο σου προς την ανθρωπότητα: εσύ δίνεις σε όλους, και όλοι οι άλλοι που ανεβάζουν τη δουλειά τους στους ιστότοπούς μας δίνουν σε σένα. Ένα ανεβασμένο έργο είναι λοιπόν ένα πολύτιμο δώρο που ο δημιουργός του σου δίνει δωρεάν, με την προϋπόθεση να συμμετέχεις κι εσύ στην κοινότητα με τους ίδιους όρους.'
    item2: 'Δεν είσαι υποχρεωμένος/η να δεχτείς το δώρο· αν το δεχτείς, ισχύουν ορισμένοι κανόνες. Το όφελος αυτών των κανόνων είναι ότι μπορείς να μάθεις από τη δουλειά και να χτίσεις πάνω της για να φτιάξεις κάτι ακόμα πιο εντυπωσιακό, το οποίο μπορείς μετά, π.χ., να ανεβάσεις ξανά στους ιστότοπούς μας ως δικό σου. Ένα ακόμα όφελος είναι ότι αυτές οι άδειες εξασφαλίζουν ότι δεν μπορείς να θεωρηθείς υπεύθυνος/η για προβλήματα που προκύπτουν σε άλλους από τη χρήση του έργου σου.'
    item3: 'Μια σημαντική πρόσθετη προϋπόθεση είναι να αναφέρεις με σαφήνεια τους δημιουργούς στα έργα των οποίων βάσισες τη δική σου δουλειά. Παράλληλα, θα κάνουμε ό,τι μπορούμε ώστε οι άλλοι να αναγνωρίζουν ξεκάθαρα ότι η δουλειά σου προέρχεται από σένα, αναφέροντας το μοναδικό όνομα που επέλεξες ελεύθερα για να σε εκπροσωπεί στην κοινότητα του Catrobat, και δίνοντας στους άλλους την ευκαιρία να σου εκφράσουν δημόσια την ευγνωμοσύνη τους που χάρισες τη δουλειά σου σε όλους, και ειδικά σε αυτούς.'
    item4: 'Δες το %link-licenseUploaded% για τους ακριβείς νομικούς όρους και προϋποθέσεις.'
  list4:
    item1: 'Σου προσφέρουμε, τώρα και στο μέλλον, όλο το δικό μας λογισμικό και τους διαδικτυακούς πόρους που σχετίζονται με το σύστημα Catrobat, π.χ. το λογισμικό που έχει γράψει η ομάδα του Catrobat, τους ιστότοπους και τους διαδικτυακούς μας πόρους, τον δικό μας πηγαίο κώδικα που σχετίζεται με το σύστημα Catrobat και όλο το πρόσθετο υλικό που περιλαμβάνεται, όπως π.χ. εικόνες, ήχους και κείμενα, υπό τις ελεύθερες άδειες του Catrobat.'
    item2: 'Αυτές οι άδειες κάνουν όλα τα μέρη του Catrobat δωρεάν για σένα, αλλά και ελεύθερα με την έννοια ότι σου δίνουν την ελευθερία να τα χρησιμοποιείς όπως θέλεις, με λίγους μόνο περιορισμούς που εξασφαλίζουν, μεταξύ άλλων, ότι το σύστημα Catrobat θα μείνει για πάντα ελεύθερο και χρήσιμο για όλους.'
    item3: 'Δες το %link-licenseToPlay% για τους ακριβείς νομικούς όρους και προϋποθέσεις. Ο πηγαίος κώδικας του συστήματος Catrobat, καθώς και πολλά άλλα έγγραφα και πόροι, είναι διαθέσιμα μέσω του %link-developer%.'
  list5:
    item1: 'Αν εσύ ή, αν είσαι κάτω των 13 ετών, οι γονείς ή οι νόμιμοι κηδεμόνες σου συνδέεστε με οργανισμό που εμπλέκεται σε ή είναι υπεύθυνος για παραβιάσεις του απορρήτου τύπου «δίχτυ» ή/και μαζική παρακολούθηση, τότε δεν επιτρέπεται να χρησιμοποιείς τις εφαρμογές λογισμικού μας και να έχεις πρόσβαση στις υπηρεσίες μας. Οι ακριβείς λεπτομέρειες αυτού του περιορισμού και ορισμένες εξαιρέσεις του περιγράφονται στις ενότητες 4.a και 4.b των %link-termsOfUse%.'
    item2: 'Αν είσαι κάτω των 13 ετών, πρέπει να ρωτήσεις τους γονείς ή τους κηδεμόνες σου αν σου επιτρέπουν να χρησιμοποιείς τις εφαρμογές και τις υπηρεσίες του Catrobat.'
    item3: 'Διατηρούμε το δικαίωμα να απορρίπτουμε, να διαγράφουμε ή να αποκρύπτουμε έργα, λογαριασμούς χρηστών και οποιοδήποτε ψηφιακό υλικό ανεβαίνει στους ιστότοπους του Catrobat ανά πάσα στιγμή και κατά την απόλυτη κρίση μας, για παράδειγμα αν διαπιστώσουμε ότι ένα έργο περιέχει ακατάλληλο υλικό ή ότι ένας χρήστης παραβιάζει τα δικαιώματα άλλων.'
    item4: 'Όλο το λογισμικό και οι διαδικτυακοί πόροι του Catrobat προσφέρονται με την ελπίδα ότι θα είναι χρήσιμοι, αλλά χωρίς καμία εγγύηση.'
    item5: 'Δες τους %link-termsOfUse% στο developer.catrobat.org/terms_of_use_and_service για την ακριβή διατύπωση των παραπάνω σημείων και ορισμένους πρόσθετους νομικούς όρους και προϋποθέσεις.'
  bottom1: 'Έλα ξανά εδώ κάθε τόσο, γιατί προσπαθούμε συνεχώς να βελτιώνουμε τους Όρους Χρήσης μας.'
  bottom2: 'Στείλε τις προτάσεις σου για αυτούς τους Όρους Χρήσης στο %email-webmaster%.'
  version: 'Έκδοση 1.3, 4 Μαρτίου 2014'
