passwordRecovery:
  subject: 'Ανάκτηση κωδικού πρόσβασης Catrobat'
  message: |
    Γεια σου %username%.
    Ζήτησες επαναφορά του κωδικού πρόσβασής σου στο %appplication_url% επειδή τον ξέχασες.
    Αν δεν το ζήτησες εσύ, αγνόησε αυτό το μήνυμα. Θα λήξει και θα πάψει να ισχύει σε 24 ώρες.
    Για να επαναφέρεις τον κωδικό πρόσβασής σου και να δημιουργήσεις νέο, επισκέψου την παρακάτω σελίδα: %confirmationUrl%
    Μπορείς να χρησιμοποιείς το όνομα χρήστη και τον κωδικό πρόσβασής σου ανά πάσα στιγμή για να μπεις στην κοινότητα %appplication_url%.
    Για να το κάνεις, απλώς επισκέψου την παρακάτω σελίδα: %loginPage%
    Για να επεξεργαστείς τα στοιχεία του προφίλ σου, πήγαινε σε αυτή τη σελίδα: %profilePage%
    Με φιλικούς χαιρετισμούς,
    Η ομάδα του Catrobat.
  messageHtml: |
    <p>
    Γεια σου %username%.<br>
    <br>
    Ζήτησες επαναφορά του κωδικού πρόσβασής σου στο <a href="%appplication_url%">Pocket Code</a> επειδή τον ξέχασες.
    Αν δεν το ζήτησες εσύ, αγνόησε αυτό το μήνυμα. Θα λήξει και θα πάψει να ισχύει σε 24 ώρες.<br>
    <br>
    Για να επαναφέρεις τον κωδικό πρόσβασής σου και να δημιουργήσεις νέο, κάνε κλικ <a href="%confirmationUrl%">εδώ.</a><br>
    <br>
    Μπορείς να χρησιμοποιείς το όνομα χρήστη και τον κωδικό πρόσβασής σου ανά πάσα στιγμή για να μπεις στην κοινότητα του <a href="%appplication_url%">Pocket Code</a>.<br>
    Για να το κάνεις, απλώς επισκέψου την παρακάτω σελίδα: <a href="%loginPage%">Σελίδα σύνδεσης</a><br>
    Για να επεξεργαστείς τα στοιχεία του προφίλ σου, πήγαινε σε αυτή τη <a href="%profilePage%">σελίδα</a>.<br>
    <br>
    Με φιλικούς χαιρετισμούς,<br>
    Η ομάδα του Catrobat.
    </p>
