    whatIsCatrobat: 'Το Catrobat είναι μια δωρεάν, μη κερδοσκοπική εκπαιδευτική πλατφόρμα προγραμματισμού. Μάθε περισσότερα στο catrobat.org.'
    manageLink: 'Μπορείς να διαχειριστείς τον λογαριασμό του παιδιού σου ανά πάσα στιγμή μέσω της <a href="%portalUrl%" style="color: #00acc1;">Πύλης γονέων</a>. Μάθε περισσότερα για <a href="%infoUrl%" style="color: #00acc1;">τα δικαιώματά σου ως γονέας</a>.' #00acc1;">Parent Portal</a>. Learn more about <a href="%infoUrl%" style="color: #00acc1;">your rights as a parent</a>.'
