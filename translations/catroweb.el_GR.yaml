parent:
  footer:
    link: 'Γονείς & κηδεμόνες'
  info:
    title: 'Πληροφορίες για γονείς & κηδεμόνες'
    intro: 'Το Catrobat παίρνει στα σοβαρά την ασφάλεια και το απόρρητο των νεαρών χρηστών. Αυτή η σελίδα εξηγεί πώς προστατεύουμε το παιδί σου και ποια δικαιώματα έχεις.'
    whatIsCatrobat:
      title: 'Τι είναι το Catrobat;'
      text: 'Το Catrobat είναι μια δωρεάν, μη κερδοσκοπική εκπαιδευτική πλατφόρμα όπου οι νέοι μαθαίνουν προγραμματισμό δημιουργώντας τις δικές τους εφαρμογές, παιχνίδια και κινούμενα σχέδια. Η πλατφόρμα είναι διαθέσιμη σε όλο τον κόσμο και χρησιμοποιείται στην εκπαίδευση.'
    dataCollected:
      title: 'Ποια δεδομένα συλλέγουμε;'
      text: 'Συλλέγουμε τα ελάχιστα δεδομένα που χρειάζονται για τη λειτουργία της πλατφόρμας: όνομα χρήστη, διεύθυνση email, ημερομηνία γέννησης και όσα έργα δημιουργεί και ανεβάζει το παιδί σου. Για χρήστες κάτω των 14 ετών αποθηκεύουμε επίσης μια διεύθυνση email γονέα/κηδεμόνα για σκοπούς συγκατάθεσης. Δεν πουλάμε ούτε μοιραζόμαστε προσωπικά δεδομένα με τρίτους.'
    yourRights:
      title: 'Τα δικαιώματά σου ως γονέας ή κηδεμόνας'
      text: 'Σύμφωνα με τους κανονισμούς της ΕΕ για την προστασία των παιδιών (GDPR) και το COPPA, έχεις το δικαίωμα: να δεις τα δεδομένα που διατηρούμε για το παιδί σου, να ζητήσεις αντίγραφο αυτών των δεδομένων, να ανακαλέσεις τη συγκατάθεσή σου ανά πάσα στιγμή (κάτι που περιορίζει τον λογαριασμό) και να ζητήσεις την οριστική διαγραφή του λογαριασμού του παιδιού σου και όλων των σχετικών δεδομένων.'
    minorRestrictions:
      title: 'Ποιοι περιορισμοί ισχύουν για λογαριασμούς ανηλίκων;'
      text: 'Οι χρήστες κάτω των 16 ετών δεν μπορούν να δημοσιεύουν ή να διαβάζουν σχόλια, να ακολουθούν άλλους χρήστες ή να βλέπουν περιεχόμενο που έχει σημειωθεί ως ακατάλληλο για παιδιά. Μπορούν όμως να δημιουργούν και να ανεβάζουν έργα, να περιηγούνται σε δημόσια έργα και να αντιδρούν σε έργα με «μου αρέσει». Αυτοί οι περιορισμοί υπάρχουν για να εξασφαλίζουν ένα ασφαλές περιβάλλον μάθησης.'
    manageButton: 'Διαχείριση του λογαριασμού του παιδιού σου'
  portal:
