privacy-policy:
  header: 'Privacybeleid'
  version: 'Versie 2.2, 17 oktober 2019'
  text1: 'Om je alle voordelen van onze diensten en het bijbehorende account te bieden, moeten we bepaalde gegevens van je verzamelen.'
  text2: 'Om onze diensten (apps en websites) te onderhouden en te verbeteren en om wetenschappelijk onderzoek te doen naar ICT- en STEM/STEAM-onderwijs, gebruiken we Google Analytics, Crashlytics en Firebase, allemaal van Google LLC (VS), en Dynatrace van Dynatrace LLC (VS) om metagegevens over het gebruik van onze diensten te verkrijgen, zoals crashinformatie, tijdstempels, bezochte pagina''s/schermen, het gebruik van onze apps en diensten, het gebruikte besturingssysteem en informatie over de netwerkprovider. Deze analyse en de verzamelde gegevens zijn niet aan je profiel gekoppeld en bevatten geen persoonsgegevens (de laatste bits van het IP-adres worden geanonimiseerd). De verzamelde gegevens worden wel doorgegeven aan de dienstverleners (Google LLC, VS en Dynatrace LLC, VS). De gegevensverwerking is gebaseerd op overeenkomsten met Google LLC en Dynatrace LLC. Deze relatie met de dienstverleners voldoet aan de Algemene Verordening Gegevensbescherming van de Europese Unie (AVG) en de EU-VS-overeenkomst "Privacy Shield".'
  text3: 'Om een account in onze systemen aan te maken en te gebruiken, en om je per e-mail te informeren over noodzakelijke wijzigingen aan je account, zoals updates of schendingen van onze gebruiks- en dienstvoorwaarden, onze communityregels of ons beleid, slaan we je gebruikersnaam en, als je dat hebt opgegeven, je e-mailadres op. Als je je account via Google Plus of Facebook hebt gekoppeld, slaan we daarnaast een identificatiesleutel op die aan je account bij deze diensten is gekoppeld. We gebruiken deze gegevens niet voor andere doeleinden (zoals marketing), tenzij je ons daar uitdrukkelijk toestemming voor hebt gegeven.'
  text4: 'Op vrijwillige basis kun je ons via je accountpagina op de deelsite je land van verblijf doorgeven. Dit wordt op je openbare profiel getoond en door ons alleen voor statistische en onderzoeksdoeleinden gebruikt. Je kunt het op elk moment verwijderen in je profielinstellingen.'
  text5: 'Je kunt het gebruik van de persoonsgegevens van je account op elk moment intrekken door je account te verwijderen via je profielpagina op https://share.catrob.at/. Na het verwijderen van je account kun je de aangeboden diensten nog steeds gebruiken, maar niet meer meewerken, bijvoorbeeld door programma''s te uploaden, te reageren of te liken. Ook wordt alle inhoud die aan je account is gekoppeld, zoals geüploade programma''s, reacties enz., verwijderd.'
  text6: 'Om misbruik van onze diensten te voorkomen, bijvoorbeeld door uploads of reacties van gebruikers voor illegale doeleinden, worden alle door gebruikers gegenereerde openbare gegevens (uploads, reacties) intern in een database opgeslagen, samen met een tijdstempel en het gebruikte internetadres. Deze gegevens worden niet gebruikt door of doorgegeven aan instellingen, tenzij er een redelijk vermoeden is van voldoende ernstige illegale handelingen en officieel bevoegde juridische instanties erom vragen op basis van de geldende wetgeving. Elk geval wordt eerst grondig en afzonderlijk door ons gecontroleerd.'
  text7: 'Je kunt je vrijwillig aanmelden voor de Catrobat-nieuwsbrief op https://catrob.at/newsletter, die we aanbieden via de dienst MailChimp (The Rocket Science Group LLC d/b/a MailChimp, VS). Je ontvangt dan updates over het Catrobat-project en de diensten ervan op het e-mailadres dat je hebt opgegeven. Je kunt je op elk moment afmelden via de link "unsubscribe" onderaan elke nieuwsbrief. Deze nieuwsbrief wordt verzorgd door MailChimp, met wie we een verwerkersovereenkomst hebben en die zich heeft verbonden aan de Algemene Verordening Gegevensbescherming van de EU en het EU-VS "Privacy Shield". Meer informatie over MailChimp vind je in het privacybeleid en de gebruiksvoorwaarden van MailChimp.'
  text8: 'Alle diensten worden aangeboden door het vrije opensourceproject Catrobat onder de paraplu van de International Catrobat Association – Verein zur Förderung freier Software, een ngo zonder winstoogmerk gevestigd in Graz, Oostenrijk (Europese Unie). Ons beleid respecteert de Europese en Oostenrijkse wetgeving inzake gegevensbescherming (AVG). Neem contact met ons op door een e-mail te sturen naar contact@catrobat.org of schrijf ons op Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Oostenrijk (Europese Unie).'
  text9: 'Als je jonger bent dan 14 jaar, moet dit beleid worden geaccepteerd door een wettelijke voogd (meestal een ouder).'
  text10: 'Het officiële Engelstalige privacybeleid van Catrobat is online beschikbaar op %privacy_policy%.'
  disagree-text: 'Zonder toestemming kunnen we geen account aanmaken, maar de basisfuncties blijven toegankelijk.'
