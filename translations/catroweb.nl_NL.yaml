passwordRecovery:
  subject: Uw Catrobat wachtwoord herstellen
  message: |
    Beste %username%,
    Je hebt gevraagd om je wachtwoord op %appplication_url% opnieuw in te stellen omdat je het bent vergeten.
    Als je dit niet hebt aangevraagd, negeer dit bericht dan. Het verloopt na 24 uur en is daarna onbruikbaar.
    Om je wachtwoord opnieuw in te stellen en een nieuw wachtwoord te maken, ga je naar de volgende pagina: %confirmationUrl%
    Je kunt je gebruikersnaam en wachtwoord altijd gebruiken om de %appplication_url%-community te bezoeken.
    Ga daarvoor naar de volgende pagina: %loginPage%
    Om je profielgegevens te bewerken, ga je naar deze pagina: %profilePage%
    Met vriendelijke groet,
    Je Catrobat-team
  messageHtml: |
    <p>
    Beste %username%,<br>
    <br>
    Je hebt gevraagd om je wachtwoord op <a href="%appplication_url%">Pocket Code</a> opnieuw in te stellen omdat je het bent vergeten.
    Als je dit niet hebt aangevraagd, negeer dit bericht dan. Het verloopt na 24 uur en is daarna onbruikbaar.<br>
    <br>
    Om je wachtwoord opnieuw in te stellen en een nieuw wachtwoord te maken, klik je <a href="%confirmationUrl%">hier.</a><br>
    <br>
    Je kunt je gebruikersnaam en wachtwoord altijd gebruiken om de <a href="%appplication_url%">Pocket Code</a>-community te bezoeken.<br>
    Ga daarvoor naar de volgende pagina: <a href="%loginPage%">Inlogpagina</a><br>
    Om je profielgegevens te bewerken, ga je naar deze <a href="%profilePage%">pagina</a>.<br>
    <br>
    Met vriendelijke groet,<br>
    Je Catrobat-team
    </p>
