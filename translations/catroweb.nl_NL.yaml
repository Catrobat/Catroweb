licenseToPlay:
  link: 'Licentie om af te spelen'
  title: 'Licentie om te spelen - Geef credit en deel'
  text1: 'Stel je voor dat elk Catrobat-project een taart is, een heel bijzondere taart met het recept erbij (de programmeerblokken). Alle leden van de Catrobat-community delen hun taarten samen met hun recepten. Zo kun je van de taarten genieten en leren hoe je ze zelf maakt!'
  text2: 'Er zijn geen geheime recepten: de instructies om deze taarten te maken mag iedereen gebruiken, hergebruiken, aanpassen en gebruiken als inspiratie voor nieuwe ideeën... ik bedoel taarten.'
  text3: 'Je mag de taarten opeten en de recepten van anderen kopiëren om je eigen taart te maken, misschien met andere ingrediënten. Aan deze vrijheid zijn twee eenvoudige voorwaarden verbonden:'
  text4: 'Bij het opzetten van de Catrobat-community hebben we voor deze aanpak gekozen, omdat we geloven dat die het leren en de creativiteit in de community ondersteunt. Door recepten en ingrediënten (scripts en tekeningen) te delen, kunnen mensen op elkaars ideeën voortbouwen en heeft iedereen er voordeel van.'
  text5: 'Bij het ontwerpen van de Catrobat-website hebben we functies toegevoegd die mensen aanmoedigen om te delen en anderen credit te geven. Op elke projectpagina kun je altijd de originele scripts van het project downloaden. Als je een project remixt (de scripts of tekeningen aanpast en het resultaat deelt), raden we je aan om in de projectnotities credit te geven aan de mensen en het project die je hebben geïnspireerd.'
  text6: 'Leer meer over de gebruiksvoorwaarden van Catrobats online gemeenschap op %link-termsOfUse%.'
  list1:
    item1: 'deel je taarten samen met het recept'
    item2: 'geef credit aan wie je heeft geïnspireerd'
  version: Versie 1.1, 2 April 2013
termsOfUse:
  title: Gebruiksvoorwaarden
  headline: Welkom bij de Catrobat gemeenschap!
  text1: 'Als deel van de Catrobat-community deel je projecten en ideeën met mensen:'
  text2: 'We hebben je hulp nodig om van deze community een fijne plek te maken voor iedereen. Zo kun je helpen:'
  text3: 'Met het Catrobat-project willen we samenwerking stimuleren en ieders creativiteit laten samenkomen ten bate van de hele mensheid. Ook jij kunt een actief lid van de Catrobat-community worden door je projecten als cadeau terug te geven aan de community, net zoals andere actieve leden hun projecten aan jou geven:'
  text4: 'Ons geschenk aan u:'
  text5: 'Onze algemene gebruiksvoorwaarden:'
  list1:
    item1: 'uit veel verschillende landen en culturen'
    item2: van alle leeftijden (van jonge kinderen tot tieners en grootouders)
    item3: met alle niveaus van ervaring
  list2:
    item1: 'Wees respectvol. Denk er bij het delen van projecten aan dat mensen van veel verschillende leeftijden en achtergronden je bijdragen zien.'
    item2: "Give credit. Feel free to make modified versions of other people's projects - just make sure to give them credit. One place to give credit is in your project's credits section. Please see the paragraph below this dotted list for details about modifying projects of other users."
    item3: "Wees eerlijk. Doe je niet voor als iemand anders en probeer de gemeenschap niet op andere manieren te bedriegen."
    item4: "Houd persoonlijke gegevens privaat. Maak je e-mailadres, telefoonnummer of andere contactgegevens niet bekend."
    item5: 'Help de site vriendelijk te houden. Als je denkt dat anderen een project of reactie gemeen, beledigend, te gewelddadig of op een andere manier ongepast zouden vinden, klik dan op de knop ''rapporteren als ongepast'' en geef een korte uitleg. Het Catrobat-team bekijkt je melding en kan elk project, elke reactie of elk bericht verwijderen.'
  list3:
    item1: 'Door een project naar onze websites te uploaden, accepteer je dat dit werk onder bepaalde vrije licenties voor geüploade Catrobat-projecten valt. Net als de vrije licenties waaronder het Catrobat-systeem zelf voor jou beschikbaar is, geven deze vrije licenties iedereen het recht om te leren van werk dat eerder door anderen is geüpload, en dat werk aan te passen en te remixen om hun eigen nieuwe, boeiende games, animaties en andere projecten te maken. Zo kan iedereen ''op de schouders van anderen staan'', en een van hen ben jij! Je werk komt zo de hele wereld ten goede en blijft vrij te gebruiken voor iedereen, een beetje zoals teksten en afbeeldingen die vrijwilligers van over de hele wereld vrij aan Wikipedia bijdragen. Zie het als jouw cadeau aan de mensheid: jij geeft aan iedereen, en alle anderen die hun werk naar onze websites uploaden, geven aan jou. Een geüpload project is dus een waardevol cadeau dat de eigenaar je gratis geeft, op voorwaarde dat je onder dezelfde voorwaarden aan de community deelneemt.'
    item2: 'Je hoeft het cadeau niet aan te nemen; doe je dat wel, dan gelden er bepaalde regels. Het voordeel van deze regels is dat je van het werk kunt leren en erop kunt voortbouwen om zelf nog coolere dingen te maken, die je dan bijvoorbeeld weer als je eigen werk naar onze websites kunt uploaden. Een ander voordeel is dat deze licenties ervoor zorgen dat je niet aansprakelijk kunt worden gesteld voor problemen die anderen krijgen door het gebruik van je project.'
    item3: 'Een belangrijke extra voorwaarde is dat je duidelijk de makers vermeldt op wier werk je je eigen werk hebt gebaseerd. Tegelijk doen we ons best om ervoor te zorgen dat anderen duidelijk zien dat jouw werk door jou is bijgedragen, door de unieke naam te vermelden die je zelf hebt gekozen om je in de Catrobat-community te vertegenwoordigen, en door anderen de kans te geven je publiekelijk te bedanken dat je je werk aan iedereen, en in het bijzonder aan hen, hebt gegeven.'
    item4: 'Bekijk %link-licenseUploaded% voor de precieze juridische voorwaarden.'
  list4:
    item1: 'We bieden al onze eigen software en internetbronnen rond het Catrobat-systeem, zoals de software die het Catrobat-team heeft geschreven, onze websites en internetbronnen, onze eigen broncode rond het Catrobat-systeem en alle extra materialen zoals afbeeldingen, geluiden en teksten, nu en in de toekomst aan je aan onder de vrije licenties van Catrobat.'
    item2: 'Deze licenties maken alle onderdelen van Catrobat zowel gratis voor je als vrij, in de zin dat je ze mag gebruiken zoals je wilt, met slechts een paar beperkingen die er onder andere voor zorgen dat het Catrobat-systeem voor altijd vrij en nuttig blijft voor iedereen.'
    item3: 'Bekijk %link-licenseToPlay% voor de precieze juridische voorwaarden. De broncode van het Catrobat-systeem en veel andere documenten en bronnen zijn beschikbaar via %link-developer%.'
  list5:
    item1: 'Als jij, of als je jonger bent dan 13 jaar je ouders of wettelijke voogden, verbonden bent aan een organisatie die betrokken is bij of verantwoordelijk is voor privacyschendingen op basis van sleepnetmethoden en/of bulk- of massasurveillance, dan mag je onze softwaretoepassingen niet gebruiken en onze diensten niet openen. De precieze details van deze beperking en bepaalde uitzonderingen daarop staan in de secties 4.a en 4.b van onze %link-termsOfUse%.'
    item2: 'Als je jonger bent dan 13 jaar, moet je je ouders of wettelijke voogden vragen of je de softwaretoepassingen en diensten van Catrobat mag gebruiken.'
    item3: 'We behouden ons het recht voor om projecten, gebruikersaccounts en alle digitale materialen die naar de websites van Catrobat zijn geüpload op elk moment naar eigen inzicht te weigeren, te verwijderen of te verbergen, bijvoorbeeld als we vinden dat een project ongepast materiaal bevat of dat een gebruiker inbreuk maakt op de rechten van anderen.'
    item4: 'Alle software en internetbronnen van Catrobat worden aangeboden in de hoop dat ze nuttig zijn, maar zonder enige garantie.'
    item5: 'Bekijk onze %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service voor de precieze formulering van bovenstaande punten en enkele aanvullende juridische voorwaarden.'
  bottom1: 'Kom hier af en toe terug, want we proberen onze gebruiksvoorwaarden steeds te verbeteren.'
  bottom2: 'Stuur suggesties over deze gebruiksvoorwaarden naar %email-webmaster%.'
  version: Versie 1.3, 4 Maart 2014
