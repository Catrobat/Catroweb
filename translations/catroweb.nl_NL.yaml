consent:
  email:
    subject: 'Toestemming van ouders nodig voor het Catrobat-account van je kind'
    title: 'Toestemming van ouders vereist'
    greeting: 'Hallo,'
    message: 'Je kind %username% heeft een account aangemaakt op Catrobat en het e-mailadres bevestigd.'
    explanation: 'Catrobat is een gratis educatief platform waarop jongeren leren programmeren door apps, games en animaties te maken. Volgens de EU-regels voor kinderbescherming hebben we jouw toestemming nodig voordat je kind volledig kan deelnemen aan de community. Klik op de knop hieronder om toestemming te geven.'
    button: 'Toestemming geven'
    ignore: 'Als je deze e-mail niet verwachtte, kun je hem gewoon negeren. Zonder toestemming heeft het account beperkte functies.'
    whatIsCatrobat: 'Catrobat is een gratis, educatief programmeerplatform zonder winstoogmerk. Meer informatie op catrobat.org.'
    manageLink: 'Je kunt het account van je kind op elk moment beheren via ons <a href="%portalUrl%" style="color: #00acc1;">ouderportaal</a>. Lees meer over <a href="%infoUrl%" style="color: #00acc1;">je rechten als ouder</a>.'
  confirmed:
    title: 'Toestemming gegeven'
    message: 'Bedankt! Het account van %username% is nu volledig geactiveerd.'
    continueButton: 'Projecten ontdekken'
parent:
  footer:
    link: 'Ouders en voogden'
  info:
    title: 'Informatie voor ouders en voogden'
    intro: 'Catrobat neemt de veiligheid en privacy van jonge gebruikers serieus. Op deze pagina lees je hoe we je kind beschermen en welke rechten je hebt.'
    whatIsCatrobat:
      title: 'Wat is Catrobat?'
      text: 'Catrobat is een gratis educatief platform zonder winstoogmerk waarop jongeren leren programmeren door hun eigen apps, games en animaties te maken. Het platform is wereldwijd beschikbaar en wordt in het onderwijs gebruikt.'
    dataCollected:
      title: 'Welke gegevens verzamelen we?'
      text: 'We verzamelen alleen de gegevens die nodig zijn om het platform te laten werken: gebruikersnaam, e-mailadres, geboortedatum en de projecten die je kind maakt en uploadt. Voor gebruikers jonger dan 14 bewaren we ook een e-mailadres van een ouder/voogd voor de toestemming. We verkopen of delen geen persoonsgegevens met derden.'
    yourRights:
      title: 'Je rechten als ouder of voogd'
      text: 'Volgens de EU-regels voor kinderbescherming (AVG/GDPR) en COPPA heb je het recht om: de gegevens die we over je kind hebben in te zien, een kopie van die gegevens aan te vragen, je toestemming op elk moment in te trekken (waardoor het account wordt beperkt) en het account van je kind en alle bijbehorende gegevens definitief te laten verwijderen.'
    minorRestrictions:
      title: 'Welke beperkingen gelden voor accounts van minderjarigen?'
      text: 'Gebruikers jonger dan 16 kunnen geen reacties plaatsen of lezen, geen andere gebruikers volgen en geen inhoud bekijken die als niet geschikt voor kinderen is gemarkeerd. Ze kunnen wel projecten maken en uploaden, openbare projecten bekijken en op projecten reageren met likes. Deze beperkingen zorgen voor een veilige leeromgeving.'
    manageButton: 'Account van je kind beheren'
  portal:
    title: 'Ouderportaal'
    description: 'Vul je e-mailadres in om een veilige link te ontvangen waarmee je het Catrobat-account van je kind kunt beheren. De link wordt verstuurd naar het e-mailadres dat bij de registratie is opgegeven.'
    emailLabel: 'Je e-mailadres'
    submitButton: 'Beheerlink versturen'
    infoLink: 'Meer informatie'
    success:
