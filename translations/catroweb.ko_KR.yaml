    greeting: "안녕하세요,"
    message: "자녀 %username%이(가) Catrobat에 계정을 만들고 이메일 주소를 인증했어요."
    explanation: "Catrobat은 어린이와 청소년이 앱, 게임, 애니메이션을 만들며 코딩을 배우는 무료 교육 플랫폼이에요. EU 아동 보호 규정에 따라 자녀가 커뮤니티에 완전히 참여하려면 보호자의 동의가 필요해요. 아래 버튼을 눌러 동의해 주세요."
