parent:
  footer:
    link: "부모님 및 보호자"
  info:
    title: "부모님 및 보호자를 위한 안내"
    intro: "Catrobat은 어린 사용자의 안전과 개인정보를 소중히 여겨요. 이 페이지에서는 자녀를 어떻게 보호하는지, 그리고 보호자에게 어떤 권리가 있는지 설명해요."
    whatIsCatrobat:
      title: "Catrobat이 뭐예요?"
      text: "Catrobat은 어린이와 청소년이 직접 앱, 게임, 애니메이션을 만들며 프로그래밍을 배우는 무료 비영리 교육 플랫폼이에요. 전 세계에서 이용할 수 있고 교육 현장에서도 쓰이고 있어요."
    dataCollected:
      title: "어떤 데이터를 수집하나요?"
      text: "플랫폼 운영에 꼭 필요한 최소한의 데이터만 수집해요: 사용자 이름, 이메일 주소, 생년월일, 그리고 자녀가 만들고 업로드한 프로젝트예요. 14세 미만 사용자의 경우 동의 확인을 위해 보호자 이메일 주소도 저장해요. 개인 데이터를 판매하거나 제3자와 공유하지 않아요."
    yourRights:
      title: "부모님 또는 보호자의 권리"
      text: "EU 아동 보호 규정(GDPR)과 COPPA에 따라 보호자는 다음 권리가 있어요: 자녀에 대해 보관 중인 데이터 열람, 그 데이터의 사본 요청, 언제든지 동의 철회(계정이 제한됨), 자녀의 계정과 관련된 모든 데이터의 영구 삭제 요청."
    minorRestrictions:
