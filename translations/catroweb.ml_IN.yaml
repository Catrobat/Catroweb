passwordRecovery:
  subject: നിന്റെ Catrobat പാസ്‌വേഡ് വീണ്ടെടുക്കൽ
  message: |
    പ്രിയ %username%,

    പാസ്‌വേഡ് മറന്നതിനാൽ %appplication_url%-ൽ നിന്റെ പാസ്‌വേഡ് പുനഃസജ്ജമാക്കാൻ നീ അഭ്യർത്ഥിച്ചു. നീ ഇത് അഭ്യർത്ഥിച്ചിട്ടില്ലെങ്കിൽ, ദയവായി അവഗണിക്കുക. 24 മണിക്കൂറിനുള്ളിൽ ഇത് കാലഹരണപ്പെടും.
    പാസ്‌വേഡ് പുനഃസജ്ജമാക്കി പുതിയത് സൃഷ്ടിക്കാൻ ഈ പേജ് സന്ദർശിക്കുക: %confirmationUrl%

    %appplication_url% കമ്മ്യൂണിറ്റിയിൽ പ്രവേശിക്കാൻ നിന്റെ ഉപയോക്തൃനാമവും പാസ്‌വേഡും എപ്പോൾ വേണമെങ്കിലും ഉപയോഗിക്കാം.
    അതിനായി ഈ പേജ് സന്ദർശിക്കുക: %loginPage%
    നിന്റെ പ്രൊഫൈൽ വിശദാംശങ്ങൾ എഡിറ്റ് ചെയ്യാൻ ഈ പേജിലേക്ക് പോകുക: %profilePage%

    ആശംസകളോടെ,
    നിന്റെ Catrobat ടീം.
  messageHtml: |
    <p>
    പ്രിയ %username%,<br>
    <br>
    പാസ്‌വേഡ് മറന്നതിനാൽ <a href="%appplication_url%">Pocket Code</a>-ൽ നിന്റെ പാസ്‌വേഡ് പുനഃസജ്ജമാക്കാൻ നീ അഭ്യർത്ഥിച്ചു.
    നീ ഇത് അഭ്യർത്ഥിച്ചിട്ടില്ലെങ്കിൽ, ദയവായി അവഗണിക്കുക. 24 മണിക്കൂറിനുള്ളിൽ ഇത് കാലഹരണപ്പെടും.<br>
    <br>
    പാസ്‌വേഡ് പുനഃസജ്ജമാക്കി പുതിയത് സൃഷ്ടിക്കാൻ <a href="%confirmationUrl%">ഇവിടെ ക്ലിക്ക് ചെയ്യുക.</a><br>
    <br>
    <a href="%appplication_url%">Pocket Code</a> കമ്മ്യൂണിറ്റിയിൽ പ്രവേശിക്കാൻ നിന്റെ ഉപയോക്തൃനാമവും പാസ്‌വേഡും എപ്പോൾ വേണമെങ്കിലും ഉപയോഗിക്കാം.<br>
    അതിനായി ഈ പേജ് സന്ദർശിക്കുക: <a href="%loginPage%">ലോഗിൻ പേജ്</a><br>
    നിന്റെ പ്രൊഫൈൽ വിശദാംശങ്ങൾ എഡിറ്റ് ചെയ്യാൻ ഈ <a href="%profilePage%">പേജിലേക്ക്</a> പോകുക.<br>
    <br>
    ആശംസകളോടെ,<br>
    നിന്റെ Catrobat ടീം.
    </p>
