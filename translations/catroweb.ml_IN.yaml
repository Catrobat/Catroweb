  text: "%project_count% അത്ഭുതകരമായ പ്രോജക്റ്റുകൾ ഇതിനകം പങ്കിട്ടുകഴിഞ്ഞു, അടുത്തത് നിന്റേതാകാം. ഞങ്ങളുടെ ആപ്പ് ഡൗൺലോഡ് ചെയ്ത് ഇന്നുതന്നെ സൃഷ്ടിക്കാൻ തുടങ്ങുക"
privacy-policy:
  header: സ്വകാര്യതാ നയം
  version: പതിപ്പ് 2.2, 17 ഒക്ടോബർ 2019
  text1: ഞങ്ങളുടെ സേവനങ്ങളുടെയും ബന്ധപ്പെട്ട അക്കൗണ്ടിന്റെയും എല്ലാ നേട്ടങ്ങളും നിനക്ക് നൽകാൻ, നിന്നിൽ നിന്ന് ചില ഡാറ്റ ശേഖരിക്കേണ്ടത് ആവശ്യമാണ്.
  text2: ഞങ്ങളുടെ സേവനങ്ങൾ (ആപ്പുകളും വെബ്സൈറ്റുകളും) പരിപാലിക്കാനും മെച്ചപ്പെടുത്താനും ICT, STEM/STEAM വിദ്യാഭ്യാസത്തെക്കുറിച്ച് ശാസ്ത്രീയ ഗവേഷണം നടത്താനും, ഞങ്ങളുടെ സേവനങ്ങളുടെ ഉപയോഗത്തെക്കുറിച്ചുള്ള മെറ്റാഡാറ്റ (ഉദാ. ക്രാഷ് വിവരങ്ങൾ, സമയമുദ്രകൾ, സന്ദർശിച്ച പേജുകൾ/സ്ക്രീനുകൾ, ആപ്പുകളുടെയും സേവനങ്ങളുടെയും ഉപയോഗം, ഉപയോഗിച്ച ഓപ്പറേറ്റിംഗ് സിസ്റ്റം, നെറ്റ്‌വർക്ക് ദാതാവിനെക്കുറിച്ചുള്ള വിവരങ്ങൾ) ലഭിക്കാൻ ഞങ്ങൾ Google LLC (USA)-യുടെ Google Analytics, Crashlytics, Firebase എന്നിവയും Dynatrace LLC (USA)-യുടെ Dynatrace-ഉം ഉപയോഗിക്കുന്നു. ഈ വിശകലനവും ശേഖരിച്ച ഡാറ്റയും നിന്റെ പ്രൊഫൈലുമായി ബന്ധിപ്പിച്ചിട്ടില്ല, വ്യക്തിഗത വിവരങ്ങളൊന്നും അതിലില്ല (IP വിലാസത്തിന്റെ അവസാന ഭാഗങ്ങൾ അജ്ഞാതമാക്കുന്നു). എന്നിരുന്നാലും, ശേഖരിച്ച ഡാറ്റ സേവന ദാതാക്കൾക്ക് (Google LLC, USA, Dynatrace LLC, USA) കൈമാറും. ഡാറ്റ പ്രോസസ്സിംഗ് Google LLC, Dynatrace LLC എന്നിവയുമായുള്ള കരാറുകളെ അടിസ്ഥാനമാക്കിയാണ്. സേവന ദാതാക്കളുമായുള്ള ഈ ബന്ധം യൂറോപ്യൻ യൂണിയന്റെ പൊതു ഡാറ്റ സംരക്ഷണ നിയന്ത്രണത്തിനും (EU GDPR) EU-USA "Privacy Shield" കരാറിനും അനുസൃതമാണ്.
  text3: ഞങ്ങളുടെ സിസ്റ്റങ്ങളിൽ ഒരു അക്കൗണ്ട് സൃഷ്ടിക്കാനും ഉപയോഗിക്കാനും, നിന്റെ അക്കൗണ്ടിനെക്കുറിച്ചുള്ള ആവശ്യമായ മാറ്റങ്ങൾ (ഉദാ. അപ്ഡേറ്റുകൾ അല്ലെങ്കിൽ ഞങ്ങളുടെ ഉപയോഗ, സേവന നിബന്ധനകളുടെയോ കമ്മ്യൂണിറ്റി നിയമങ്ങളുടെയോ നയങ്ങളുടെയോ ലംഘനങ്ങൾ) ഇമെയിൽ വഴി അറിയിക്കാനും, ഞങ്ങൾ നിന്റെ ഉപയോക്തൃനാമവും, നീ നൽകിയിട്ടുണ്ടെങ്കിൽ, ഇമെയിൽ വിലാസവും സൂക്ഷിക്കും. നിന്റെ അക്കൗണ്ട് Google Plus അല്ലെങ്കിൽ Facebook വഴി ബന്ധിപ്പിച്ചിട്ടുണ്ടെങ്കിൽ, ആ സേവനങ്ങളിലെ നിന്റെ അക്കൗണ്ടുമായി ബന്ധപ്പെട്ട ഒരു തിരിച്ചറിയൽ കീയും ഞങ്ങൾ സൂക്ഷിക്കുന്നു. നീ വ്യക്തമായി അനുവദിച്ചിട്ടില്ലെങ്കിൽ ഈ ഡാറ്റ മറ്റേതെങ്കിലും (ഉദാ. മാർക്കറ്റിംഗ്) ആവശ്യങ്ങൾക്ക് ഞങ്ങൾ ഉപയോഗിക്കില്ല.
  text4: സ്വമേധയാ, ഷെയറിംഗ് സൈറ്റിലെ നിന്റെ അക്കൗണ്ട് പേജ് വഴി നിന്റെ താമസ രാജ്യം ഞങ്ങൾക്ക് നൽകാം. ഇത് നിന്റെ പൊതു പ്രൊഫൈലിൽ പ്രദർശിപ്പിക്കും, സ്ഥിതിവിവര, ഗവേഷണ ആവശ്യങ്ങൾക്ക് മാത്രമേ ഞങ്ങൾ ഉപയോഗിക്കൂ. പ്രൊഫൈൽ ക്രമീകരണങ്ങളിൽ എപ്പോൾ വേണമെങ്കിലും ഇത് നീക്കം ചെയ്യാം.
  text5: https://share.catrob.at/-ലെ നിന്റെ പ്രൊഫൈൽ പേജ് വഴി അക്കൗണ്ട് ഇല്ലാതാക്കി, നിന്റെ അക്കൗണ്ടുമായി ബന്ധപ്പെട്ട വ്യക്തിഗത ഡാറ്റയുടെ ഉപയോഗം എപ്പോൾ വേണമെങ്കിലും പിൻവലിക്കാം. അക്കൗണ്ട് ഇല്ലാതാക്കിയതിനുശേഷവും നിനക്ക് നൽകിയിട്ടുള്ള സേവനങ്ങൾ ഉപയോഗിക്കാം, എന്നാൽ പ്രോഗ്രാമുകൾ അപ്‌ലോഡ് ചെയ്യൽ, കമന്റ് ചെയ്യൽ, ലൈക്ക് ചെയ്യൽ തുടങ്ങിയവയിലൂടെ സഹകരിക്കാൻ കഴിയില്ല. കൂടാതെ, നിന്റെ അക്കൗണ്ടുമായി ബന്ധപ്പെട്ട എല്ലാ ഉള്ളടക്കവും (ഉദാ. അപ്‌ലോഡ് ചെയ്ത പ്രോഗ്രാമുകൾ, കമന്റുകൾ മുതലായവ) ഇല്ലാതാക്കപ്പെടും.
  text6: ഞങ്ങളുടെ സേവനങ്ങളുടെ ദുരുപയോഗം (ഉദാ. നിയമവിരുദ്ധ ആവശ്യങ്ങൾക്കായുള്ള അപ്‌ലോഡുകളോ കമന്റുകളോ) ഒഴിവാക്കാൻ, ഉപയോക്താക്കൾ സൃഷ്ടിച്ച എല്ലാ പൊതു ഡാറ്റയും (അപ്‌ലോഡുകൾ, കമന്റുകൾ) ഒരു സമയമുദ്രയും ഉപയോഗിച്ച ഇന്റർനെറ്റ് വിലാസവും സഹിതം ഒരു ഡാറ്റാബേസിൽ ആന്തരികമായി സൂക്ഷിക്കും. നിയമവിരുദ്ധ പ്രവർത്തനങ്ങൾ ന്യായമായി സംശയിക്കപ്പെടുകയും ഔദ്യോഗികമായി അധികാരമുള്ള നിയമ സ്ഥാപനങ്ങൾ ബാധകമായ നിയമപ്രകാരം ആവശ്യപ്പെടുകയും ചെയ്യാത്തിടത്തോളം ഈ ഡാറ്റ ഒരു സ്ഥാപനവും ഉപയോഗിക്കുകയോ അവർക്ക് കൈമാറുകയോ ചെയ്യില്ല. ഓരോ കേസും ആദ്യം ഞങ്ങൾ വ്യക്തിഗതമായി സമഗ്രമായി പരിശോധിക്കും.
  text7: MailChimp സേവനം (The Rocket Science Group LLC d/b/a MailChimp, USA) വഴി ഞങ്ങൾ നൽകുന്ന Catrobat വാർത്താക്കുറിപ്പിന് https://catrob.at/newsletter-ൽ നിനക്ക് സ്വമേധയാ സബ്സ്ക്രൈബ് ചെയ്യാം. അപ്പോൾ Catrobat പ്രോജക്റ്റിനെയും അതിന്റെ സേവനങ്ങളെയും കുറിച്ചുള്ള അപ്ഡേറ്റുകൾ നീ നൽകിയ ഇമെയിൽ വിലാസത്തിൽ ലഭിക്കും. ഓരോ വാർത്താക്കുറിപ്പിന്റെയും അടിയിലുള്ള "unsubscribe" ലിങ്ക് ഉപയോഗിച്ച് എപ്പോൾ വേണമെങ്കിലും വാർത്താക്കുറിപ്പ് പിൻവലിക്കാം. ഞങ്ങൾക്ക് ഡാറ്റ പ്രോസസ്സിംഗ് കരാറുള്ളതും EU പൊതു ഡാറ്റ സംരക്ഷണ നിയന്ത്രണത്തിനും EU-USA "Privacy Shield"-നും പ്രതിജ്ഞാബദ്ധവുമായ MailChimp ആണ് ഈ വാർത്താക്കുറിപ്പ് നൽകുന്നത്. MailChimp-നെക്കുറിച്ചുള്ള കൂടുതൽ വിവരങ്ങൾക്ക് MailChimp-ന്റെ സ്വകാര്യതാ നയവും ഉപയോഗ നിബന്ധനകളും കാണുക.
  text8: എല്ലാ സേവനങ്ങളും നൽകുന്നത് International Catrobat Association – Verein zur Förderung freier Software എന്ന, ഗ്രാസ്, ഓസ്ട്രിയ (യൂറോപ്യൻ യൂണിയൻ)-യിൽ രജിസ്റ്റർ ചെയ്ത ലാഭേച്ഛയില്ലാത്ത NGO-യുടെ കീഴിലുള്ള സ്വതന്ത്ര ഓപ്പൺ സോഴ്സ് Catrobat പ്രോജക്റ്റാണ്. ഞങ്ങളുടെ നയങ്ങൾ EU, ഓസ്ട്രിയൻ ഡാറ്റ സംരക്ഷണ നിയമങ്ങൾ (GDPR) മാനിക്കുന്നു. ഞങ്ങളുമായി ബന്ധപ്പെടാൻ, contact@catrobat.org-ലേക്ക് ഇമെയിൽ അയയ്ക്കുക അല്ലെങ്കിൽ Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union) എന്ന വിലാസത്തിൽ കത്തയയ്ക്കുക.
  text9: നിനക്ക് 14 വയസ്സിൽ താഴെയാണെങ്കിൽ, ഈ നയം ഒരു നിയമപരമായ സംരക്ഷകൻ (സാധാരണയായി രക്ഷിതാവ്) അംഗീകരിക്കണം.
  text10: Catrobat-ന്റെ ഔദ്യോഗിക ഇംഗ്ലീഷ് സ്വകാര്യതാ നയം വെബിൽ %privacy_policy%-ൽ ലഭ്യമാണ്.
  disagree-text: അംഗീകാരമില്ലാതെ ഞങ്ങൾക്ക് അക്കൗണ്ട് സൃഷ്ടിക്കാൻ കഴിയില്ല, എന്നാൽ പ്രധാന ഫീച്ചറുകൾ ഇപ്പോഴും ലഭ്യമാണ്.
