licenseToPlay:
  link: 'കളിക്കാനുള്ള ലൈസൻസ്'
  title: 'കളിക്കാനുള്ള ലൈസൻസ് - കടപ്പാട് നൽകുക, പങ്കിടുക'
  text1: ഓരോ Catrobat പ്രോഗ്രാമും ഒരു കേക്ക് ആണെന്ന് സങ്കൽപ്പിക്കുക, അതിന്റെ പാചകക്കുറിപ്പും (പ്രോഗ്രാമിംഗ് ബ്ലോക്കുകൾ) കൂടെയുള്ള വളരെ സവിശേഷമായ ഒരു കേക്ക്. Catrobat കമ്മ്യൂണിറ്റിയിലെ എല്ലാ അംഗങ്ങളും അവരുടെ കേക്കുകൾ പാചകക്കുറിപ്പുകൾ സഹിതം പങ്കിടുന്നു. അതായത് നിനക്ക് കേക്കുകൾ ആസ്വദിക്കാനും അവ എങ്ങനെ ഉണ്ടാക്കാമെന്ന് സ്വയം പഠിക്കാനും കഴിയും!
  text2: 'രഹസ്യ പാചകക്കുറിപ്പുകളൊന്നുമില്ല: ഈ കേക്കുകൾ ഉണ്ടാക്കാനുള്ള നിർദ്ദേശങ്ങൾ ആർക്കും ഉപയോഗിക്കാനും വീണ്ടും ഉപയോഗിക്കാനും മാറ്റം വരുത്താനും പുതിയ ആശയങ്ങൾക്ക്... അതായത് കേക്കുകൾക്ക് പ്രചോദനമാക്കാനും തുറന്നിരിക്കുന്നു.'
  text3: "നിനക്ക് കേക്കുകൾ കഴിക്കാം, മറ്റുള്ളവരുടെ പാചകക്കുറിപ്പുകൾ പകർത്തി സ്വന്തമായി ഉണ്ടാക്കാം, ഒരുപക്ഷേ വ്യത്യസ്ത ചേരുവകൾ ഉപയോഗിച്ച്. ഈ സ്വാതന്ത്ര്യത്തിന് രണ്ട് ലളിതമായ നിബന്ധനകളുണ്ട്:"
  text4: "Catrobat കമ്മ്യൂണിറ്റി ആരംഭിച്ചപ്പോൾ, കമ്മ്യൂണിറ്റിയിലെ പഠനത്തെയും സർഗ്ഗാത്മകതയെയും ഇത് പിന്തുണയ്ക്കുമെന്ന് വിശ്വസിക്കുന്നതിനാൽ ഞങ്ങൾ ഈ സമീപനം സ്വീകരിക്കാൻ തീരുമാനിച്ചു. പാചകക്കുറിപ്പുകളും ചേരുവകളും (സ്ക്രിപ്റ്റുകളും ചിത്രങ്ങളും) പങ്കിടുന്നതിലൂടെ ആളുകൾക്ക് പരസ്പരം ആശയങ്ങളിൽ നിന്ന് മുന്നേറാം, അത് എല്ലാവർക്കും പ്രയോജനപ്പെടും."
  text5: Catrobat വെബ്സൈറ്റ് രൂപകൽപ്പന ചെയ്തപ്പോൾ, പങ്കിടാനും മറ്റുള്ളവർക്ക് കടപ്പാട് നൽകാനും ആളുകളെ പ്രോത്സാഹിപ്പിക്കുന്ന ഫീച്ചറുകൾ ഞങ്ങൾ ഉൾപ്പെടുത്തി. ഓരോ പ്രോഗ്രാം പേജിലും പ്രോഗ്രാമിന്റെ യഥാർത്ഥ സ്ക്രിപ്റ്റുകൾ എപ്പോഴും ഡൗൺലോഡ് ചെയ്യാം. നീ ഒരു പ്രോഗ്രാം റീമിക്സ് ചെയ്യുകയാണെങ്കിൽ (സ്ക്രിപ്റ്റുകളോ ചിത്രങ്ങളോ മാറ്റി ഫലം പങ്കിടുകയാണെങ്കിൽ), നിനക്ക് പ്രചോദനമായ ആളുകളെയും പ്രോഗ്രാമിനെയും പ്രോഗ്രാം കുറിപ്പുകളിൽ പരാമർശിച്ച് കടപ്പാട് നൽകാൻ ഞങ്ങൾ പ്രോത്സാഹിപ്പിക്കുന്നു.
  text6: 'Catrobat ഓൺലൈൻ കമ്മ്യൂണിറ്റിയുടെ ഉപയോഗ നിബന്ധനകളെക്കുറിച്ച് %link-termsOfUse%-ൽ കൂടുതലറിയുക.'
  list1:
    item1: നിന്റെ കേക്കുകൾ പാചകക്കുറിപ്പ് സഹിതം പങ്കിടുക
    item2: നിനക്ക് പ്രചോദനമായവർക്ക് കടപ്പാട് നൽകുക
  version: പതിപ്പ് 1.1, 2 ഏപ്രിൽ 2013
termsOfUse:
  title: ഉപയോഗ നിബന്ധനകൾ
  headline: Catrobat കമ്മ്യൂണിറ്റിയിലേക്ക് സ്വാഗതം!
  text1: 'Catrobat കമ്മ്യൂണിറ്റിയുടെ ഭാഗമെന്ന നിലയിൽ, നീ പ്രോഗ്രാമുകളും ആശയങ്ങളും പങ്കിടുന്നത് ഇത്തരം ആളുകളുമായാണ്:'
  text2: "ഈ കമ്മ്യൂണിറ്റിയെ എല്ലാ അംഗങ്ങൾക്കും പിന്തുണ നൽകുന്ന ഇടമാക്കാൻ ഞങ്ങൾക്ക് നിന്റെ സഹായം വേണം. നിനക്ക് എങ്ങനെ സഹായിക്കാമെന്ന് ഇതാ:"
  text3: "Catrobat പ്രോജക്റ്റിലൂടെ സഹകരണം വളർത്താനും എല്ലാവരുടെയും സർഗ്ഗാത്മകത മനുഷ്യരാശിയുടെ മുഴുവൻ നന്മയ്ക്കായി ഒന്നിക്കാനും ഞങ്ങൾ ആഗ്രഹിക്കുന്നു. മറ്റ് സജീവ അംഗങ്ങൾ അവരുടെ പ്രോഗ്രാമുകൾ നിനക്ക് നൽകുന്നതുപോലെ, നിന്റെ പ്രോഗ്രാമുകൾ സമ്മാനമായി കമ്മ്യൂണിറ്റിക്ക് തിരികെ നൽകി നിനക്കും Catrobat കമ്മ്യൂണിറ്റിയിലെ സജീവ അംഗമാകാം:"
  text4: 'നിനക്കുള്ള ഞങ്ങളുടെ സമ്മാനം:'
  text5: 'ഞങ്ങളുടെ ഉപയോഗ, സേവന നിബന്ധനകൾ:'
  list1:
    item1: പല രാജ്യങ്ങളിൽ നിന്നും സംസ്കാരങ്ങളിൽ നിന്നുമുള്ളവർ
    item2: എല്ലാ പ്രായക്കാരും (കൊച്ചുകുട്ടികൾ മുതൽ കൗമാരക്കാരും മുത്തശ്ശീമുത്തശ്ശന്മാരും വരെ)
    item3: എല്ലാ തലത്തിലുമുള്ള അനുഭവപരിചയമുള്ളവർ
  list2:
    item1: ബഹുമാനം കാണിക്കുക. പ്രോഗ്രാമുകൾ പങ്കിടുമ്പോൾ, പല പ്രായത്തിലും പശ്ചാത്തലത്തിലുമുള്ള ആളുകൾ നിന്റെ സംഭാവനകൾ കാണുമെന്ന് ഓർക്കുക.
    item2: "കടപ്പാട് നൽകുക. മറ്റുള്ളവരുടെ പ്രോഗ്രാമുകളുടെ മാറ്റം വരുത്തിയ പതിപ്പുകൾ നിനക്ക് ഉണ്ടാക്കാം - അവർക്ക് കടപ്പാട് നൽകുന്നുണ്ടെന്ന് മാത്രം ഉറപ്പാക്കുക. കടപ്പാട് നൽകാനുള്ള ഒരു ഇടം നിന്റെ പ്രോഗ്രാമിന്റെ വിവരണമാണ്. മറ്റ് ഉപയോക്താക്കളുടെ പ്രോഗ്രാമുകൾ മാറ്റുന്നതിനെക്കുറിച്ചുള്ള വിശദാംശങ്ങൾക്ക് ഈ പട്ടികയ്ക്ക് താഴെയുള്ള ഖണ്ഡിക കാണുക."
    item3: "സത്യസന്ധത പാലിക്കുക. നീ മറ്റൊരാളാണെന്ന് നടിക്കുകയോ കമ്മ്യൂണിറ്റിയെ കബളിപ്പിക്കാൻ ശ്രമിക്കുകയോ ചെയ്യരുത്."
    item4: "വ്യക്തിഗത വിവരങ്ങൾ സ്വകാര്യമായി സൂക്ഷിക്കുക. നിന്റെ ഇമെയിൽ വിലാസമോ ഫോൺ നമ്പറോ മറ്റ് വ്യക്തിഗത ബന്ധപ്പെടൽ വിവരങ്ങളോ പങ്കിടരുത്."
    item5: "സൈറ്റ് സൗഹൃദപരമായി നിലനിർത്താൻ സഹായിക്കുക. ഒരു പ്രോഗ്രാമോ കമന്റോ മറ്റുള്ളവർക്ക് ക്രൂരമോ അപമാനകരമോ അമിതമായി അക്രമാസക്തമോ മറ്റേതെങ്കിലും വിധത്തിൽ അനുചിതമോ ആയി തോന്നുമെന്ന് നിനക്ക് തോന്നിയാൽ, 'അനുചിതമെന്ന് റിപ്പോർട്ട് ചെയ്യുക' ബട്ടണിൽ ക്ലിക്ക് ചെയ്ത് ഒരു ചെറിയ വിശദീകരണം നൽകുക. Catrobat ടീം നിന്റെ റിപ്പോർട്ട് പരിശോധിക്കുകയും ഏതെങ്കിലും പ്രോഗ്രാമോ കമന്റോ പോസ്റ്റോ നീക്കം ചെയ്യുകയും ചെയ്തേക്കാം."
  list3:
    item1: "ഞങ്ങളുടെ വെബ്സൈറ്റുകളിലേക്ക് ഒരു പ്രോഗ്രാം അപ്‌ലോഡ് ചെയ്യുന്നതിലൂടെ, അപ്‌ലോഡ് ചെയ്ത Catrobat പ്രോഗ്രാമുകൾക്കുള്ള ചില സ്വതന്ത്ര ലൈസൻസുകൾക്ക് കീഴിൽ ഈ സൃഷ്ടി നൽകാൻ നീ സമ്മതിക്കുന്നു. Catrobat സിസ്റ്റം തന്നെ നിനക്ക് ലഭ്യമാക്കിയിരിക്കുന്ന സ്വതന്ത്ര ലൈസൻസുകൾ പോലെ, അപ്‌ലോഡ് ചെയ്ത Catrobat പ്രോഗ്രാമുകളുടെ ഈ സ്വതന്ത്ര ലൈസൻസുകൾ മറ്റുള്ളവർ മുമ്പ് അപ്‌ലോഡ് ചെയ്ത സൃഷ്ടികളിൽ നിന്ന് പഠിക്കാനും ആ സൃഷ്ടികൾ മാറ്റിയും റീമിക്സ് ചെയ്തും സ്വന്തം പുതിയ ആകർഷകമായ ഗെയിമുകളും ആനിമേഷനുകളും മറ്റ് പ്രോഗ്രാമുകളും നിർമ്മിക്കാനും എല്ലാവർക്കും അവകാശം നൽകുന്നു. ഇത് എല്ലാവരെയും 'സഹപ്രവർത്തകരുടെ തോളിൽ നിൽക്കാൻ' അനുവദിക്കുന്നു, അവരിൽ ഒരാൾ നീയാണ്! അങ്ങനെ നിന്റെ സൃഷ്ടി ലോകത്തിന് മുഴുവൻ പ്രയോജനപ്പെടുകയും എല്ലാവർക്കും ഉപയോഗിക്കാൻ സൗജന്യമായി തുടരുകയും ചെയ്യും, ലോകമെമ്പാടുമുള്ള സന്നദ്ധപ്രവർത്തകർ Wikipedia-യിലേക്ക് സൗജന്യമായി സംഭാവന ചെയ്യുന്ന വാചകങ്ങളും ചിത്രങ്ങളും പോലെ. ഇതിനെ മനുഷ്യരാശിക്കുള്ള നിന്റെ സമ്മാനമായി കരുതുക: നീ എല്ലാവർക്കും നൽകുന്നു, ഞങ്ങളുടെ വെബ്സൈറ്റുകളിലേക്ക് സൃഷ്ടികൾ അപ്‌ലോഡ് ചെയ്യുന്ന മറ്റെല്ലാവരും നിനക്ക് നൽകുന്നു. അതിനാൽ അപ്‌ലോഡ് ചെയ്ത ഒരു പ്രോഗ്രാം വലിയ മൂല്യമുള്ള ഒരു സമ്മാനമാണ്, അതിന്റെ ഉടമ അത് നിനക്ക് സൗജന്യമായി നൽകുന്നു, നീയും അതേ നിബന്ധനകളിൽ കമ്മ്യൂണിറ്റിയിൽ പങ്കെടുക്കണമെന്ന വ്യവസ്ഥയോടെ."
    item2: നീ സമ്മാനം സ്വീകരിക്കേണ്ടതില്ല; സ്വീകരിക്കുകയാണെങ്കിൽ, ചില നിയമങ്ങൾ ബാധകമാണ്. ഈ നിയമങ്ങളുടെ നേട്ടം, നിനക്ക് ആ സൃഷ്ടിയിൽ നിന്ന് പഠിക്കാനും അതിനെ അടിസ്ഥാനമാക്കി കൂടുതൽ രസകരമായ കാര്യങ്ങൾ സ്വയം നിർമ്മിക്കാനും കഴിയും എന്നതാണ്, അവ ഉദാഹരണത്തിന് വീണ്ടും നിന്റെ സ്വന്തമായി ഞങ്ങളുടെ വെബ്സൈറ്റുകളിലേക്ക് അപ്‌ലോഡ് ചെയ്യാം. മറ്റൊരു നേട്ടം, നിന്റെ പ്രോഗ്രാം മറ്റുള്ളവർ ഉപയോഗിക്കുന്നതിലൂടെ അവർക്ക് ഉണ്ടാകുന്ന പ്രശ്നങ്ങൾക്ക് നിന്നെ ഉത്തരവാദിയാക്കാൻ കഴിയില്ലെന്ന് ഈ ലൈസൻസുകൾ ഉറപ്പാക്കുന്നു എന്നതാണ്.
    item3: "ഒരു പ്രധാന അധിക വ്യവസ്ഥ, നിന്റെ സൃഷ്ടിക്ക് അടിസ്ഥാനമാക്കിയ സൃഷ്ടികളുടെ രചയിതാക്കൾക്ക് നീ വ്യക്തമായി കടപ്പാട് നൽകണം എന്നതാണ്. അതേസമയം, Catrobat കമ്മ്യൂണിറ്റിയിൽ നിന്നെ പ്രതിനിധീകരിക്കാൻ നീ സ്വതന്ത്രമായി തിരഞ്ഞെടുത്ത അദ്വിതീയ പേരിൽ കടപ്പാട് നൽകിയും, നിന്റെ സൃഷ്ടി എല്ലാവർക്കും, പ്രത്യേകിച്ച് അവർക്ക്, നൽകിയതിന് പരസ്യമായി നന്ദി പ്രകടിപ്പിക്കാൻ മറ്റുള്ളവർക്ക് അവസരം നൽകിയും, നിന്റെ സൃഷ്ടി നീ സംഭാവന ചെയ്തതാണെന്ന് മറ്റുള്ളവർ വ്യക്തമായി അംഗീകരിക്കാൻ ഞങ്ങൾ കഠിനമായി പ്രവർത്തിക്കും."
    item4: 'കൃത്യമായ നിയമ നിബന്ധനകൾക്കും വ്യവസ്ഥകൾക്കും %link-licenseUploaded% കാണുക.'
  list4:
    item1: "Catrobat സിസ്റ്റവുമായി ബന്ധപ്പെട്ട ഞങ്ങളുടെ എല്ലാ സോഫ്റ്റ്‌വെയറും ഇന്റർനെറ്റ് ഉറവിടങ്ങളും, ഉദാഹരണത്തിന് Catrobat ടീം എഴുതിയ സോഫ്റ്റ്‌വെയർ, ഞങ്ങളുടെ വെബ്സൈറ്റുകളും ഇന്റർനെറ്റ് ഉറവിടങ്ങളും, Catrobat സിസ്റ്റവുമായി ബന്ധപ്പെട്ട ഞങ്ങളുടെ സോഴ്സ് കോഡും, ചിത്രങ്ങൾ, ശബ്ദങ്ങൾ, വാചകങ്ങൾ തുടങ്ങിയ എല്ലാ അധിക സാമഗ്രികളും ഇപ്പോഴും ഭാവിയിലും Catrobat-ന്റെ സ്വതന്ത്ര ലൈസൻസുകൾക്ക് കീഴിൽ ഞങ്ങൾ നിനക്ക് നൽകുന്നു."
    item2: ഈ ലൈസൻസുകൾ Catrobat-ന്റെ എല്ലാ ഭാഗങ്ങളും നിനക്ക് സൗജന്യമാക്കുന്നു, കൂടാതെ നിനക്ക് ഇഷ്ടമുള്ളതുപോലെ ഉപയോഗിക്കാനുള്ള സ്വാതന്ത്ര്യവും നൽകുന്നു; Catrobat സിസ്റ്റം എന്നും എല്ലാവർക്കും സൗജന്യവും ഉപയോഗപ്രദവുമായി തുടരുമെന്ന് ഉറപ്പാക്കുന്ന ഏതാനും നിയന്ത്രണങ്ങൾ മാത്രമേയുള്ളൂ.
    item3: 'കൃത്യമായ നിയമ നിബന്ധനകൾക്കും വ്യവസ്ഥകൾക്കും %link-licenseToPlay% കാണുക. Catrobat സിസ്റ്റത്തിന്റെ സോഴ്സ് കോഡും മറ്റ് നിരവധി രേഖകളും ഉറവിടങ്ങളും %link-developer% വഴി ലഭ്യമാണ്.'
  list5:
    item1: 'നീയോ, നിനക്ക് 13 വയസ്സിൽ താഴെയാണെങ്കിൽ നിന്റെ രക്ഷിതാക്കളോ നിയമപരമായ സംരക്ഷകരോ, വ്യാപകമായ സ്വകാര്യതാ ലംഘനങ്ങളിലും/അല്ലെങ്കിൽ കൂട്ട നിരീക്ഷണത്തിലും ഏർപ്പെട്ടിരിക്കുന്നതോ അതിന് ഉത്തരവാദിത്തമുള്ളതോ ആയ ഒരു സ്ഥാപനവുമായി ബന്ധപ്പെട്ടിട്ടുണ്ടെങ്കിൽ, ഞങ്ങളുടെ സോഫ്റ്റ്‌വെയർ ആപ്ലിക്കേഷനുകൾ ഉപയോഗിക്കാനും ഞങ്ങളുടെ സേവനങ്ങൾ ആക്സസ് ചെയ്യാനും നിനക്ക് അനുവാദമില്ല. ഈ നിയന്ത്രണത്തിന്റെ കൃത്യമായ വിശദാംശങ്ങളും ചില ഒഴിവാക്കലുകളും ഞങ്ങളുടെ %link-termsOfUse%-ലെ 4.a, 4.b വിഭാഗങ്ങളിൽ വിവരിച്ചിരിക്കുന്നു.'
    item2: നിനക്ക് 13 വയസ്സിൽ താഴെയാണെങ്കിൽ, Catrobat-ന്റെ സോഫ്റ്റ്‌വെയർ ആപ്ലിക്കേഷനുകളും സേവനങ്ങളും ഉപയോഗിക്കാൻ അനുവദിക്കുമോ എന്ന് നിന്റെ രക്ഷിതാക്കളോടോ നിയമപരമായ സംരക്ഷകരോടോ ചോദിക്കണം.
    item3: "Catrobat-ന്റെ വെബ്സൈറ്റുകളിലേക്ക് അപ്‌ലോഡ് ചെയ്ത പ്രോഗ്രാമുകളും ഉപയോക്തൃ അക്കൗണ്ടുകളും ഏതെങ്കിലും ഡിജിറ്റൽ സാമഗ്രികളും എപ്പോൾ വേണമെങ്കിലും ഞങ്ങളുടെ വിവേചനാധികാരത്തിൽ നിരസിക്കാനോ ഇല്ലാതാക്കാനോ മറയ്ക്കാനോ ഉള്ള അവകാശം ഞങ്ങൾക്കുണ്ട്, ഉദാഹരണത്തിന് ഒരു പ്രോഗ്രാമിൽ അനുചിതമായ ഉള്ളടക്കമുണ്ടെന്നോ ഒരു ഉപയോക്താവ് മറ്റുള്ളവരുടെ അവകാശങ്ങൾ ലംഘിക്കുന്നുവെന്നോ ഞങ്ങൾ കണ്ടെത്തിയാൽ."
    item4: "Catrobat-ന്റെ എല്ലാ സോഫ്റ്റ്‌വെയറും ഇന്റർനെറ്റ് ഉറവിടങ്ങളും ഉപയോഗപ്രദമാകുമെന്ന പ്രതീക്ഷയിൽ നൽകുന്നു, എന്നാൽ യാതൊരു വാറന്റിയുമില്ലാതെ."
    item5: 'മുകളിലുള്ള കാര്യങ്ങളുടെ കൃത്യമായ രൂപീകരണത്തിനും ചില അധിക നിയമ നിബന്ധനകൾക്കും ഞങ്ങളുടെ %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service കാണുക.'
  bottom1: ഞങ്ങൾ എപ്പോഴും ഉപയോഗ നിബന്ധനകൾ മെച്ചപ്പെടുത്താൻ ശ്രമിക്കുന്നതിനാൽ, ഇടയ്ക്കിടെ ഇവിടെ വന്ന് പരിശോധിക്കുക.
  bottom2: 'ഈ ഉപയോഗ നിബന്ധനകളെക്കുറിച്ചുള്ള നിർദ്ദേശങ്ങൾ %email-webmaster%-ലേക്ക് മെയിൽ ചെയ്യുക.'
