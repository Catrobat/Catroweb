newAccountConfirmation:
  subject: "നിന്റെ ഇമെയിൽ വിലാസം സ്ഥിരീകരിക്കുക"
  welcome: "Catrobat-ലേക്ക് സ്വാഗതം!"
  greeting: "സൈൻ അപ്പ് ചെയ്തതിന് നന്ദി! തുടങ്ങാൻ ദയവായി നിന്റെ ഇമെയിൽ വിലാസം സ്ഥിരീകരിക്കുക."
  message: "നിന്റെ ഇമെയിൽ സ്ഥിരീകരിക്കാൻ താഴെയുള്ള ബട്ടണിൽ ക്ലിക്ക് ചെയ്യുക. ഈ ലിങ്ക് %time% വരെ സാധുവാണ്, ഒരു തവണ മാത്രമേ ഉപയോഗിക്കാനാകൂ."
  button: "ഇമെയിൽ വിലാസം സ്ഥിരീകരിക്കുക"
  ignore: "നീ ഒരു Catrobat അക്കൗണ്ട് സൃഷ്ടിച്ചിട്ടില്ലെങ്കിൽ, ഈ ഇമെയിൽ അവഗണിക്കാം."
  autoDelete: "സ്ഥിരീകരിക്കാത്ത അക്കൗണ്ടുകൾ 30 ദിവസത്തിനുശേഷം സ്വയം ഇല്ലാതാക്കപ്പെടും."
consent:
  email:
    subject: "നിന്റെ കുട്ടിയുടെ Catrobat അക്കൗണ്ടിന് രക്ഷിതാവിന്റെ സമ്മതം ആവശ്യമാണ്"
    title: "രക്ഷിതാവിന്റെ സമ്മതം ആവശ്യമാണ്"
    greeting: "ഹലോ,"
    message: "നിന്റെ കുട്ടി %username% Catrobat-ൽ ഒരു അക്കൗണ്ട് സൃഷ്ടിക്കുകയും ഇമെയിൽ വിലാസം സ്ഥിരീകരിക്കുകയും ചെയ്തു."
    explanation: "കോഡിംഗ് പഠിക്കാൻ കുട്ടികളും യുവാക്കളും ആപ്പുകളും ഗെയിമുകളും ആനിമേഷനുകളും സൃഷ്ടിക്കുന്ന ഒരു സൗജന്യ വിദ്യാഭ്യാസ പ്ലാറ്റ്‌ഫോമാണ് Catrobat. EU ബാല സംരക്ഷണ നിയമങ്ങൾ പ്രകാരം, നിന്റെ കുട്ടിക്ക് കമ്മ്യൂണിറ്റിയിൽ പൂർണ്ണമായി പങ്കെടുക്കാൻ നിന്റെ സമ്മതം ആവശ്യമാണ്. സമ്മതം നൽകാൻ താഴെയുള്ള ബട്ടണിൽ ക്ലിക്ക് ചെയ്യുക."
    button: "രക്ഷിതാവിന്റെ സമ്മതം നൽകുക"
    ignore: "ഈ ഇമെയിൽ നീ പ്രതീക്ഷിച്ചിരുന്നില്ലെങ്കിൽ, ഇത് അവഗണിക്കാം. സമ്മതമില്ലാതെ അക്കൗണ്ടിന് പരിമിതമായ പ്രവർത്തനങ്ങൾ മാത്രമേ ഉണ്ടാകൂ."
    whatIsCatrobat: "Catrobat ഒരു സൗജന്യ, ലാഭേച്ഛയില്ലാത്ത വിദ്യാഭ്യാസ പ്രോഗ്രാമിംഗ് പ്ലാറ്റ്‌ഫോമാണ്. കൂടുതലറിയാൻ catrobat.org സന്ദർശിക്കുക."
    manageLink: 'നിന്റെ കുട്ടിയുടെ അക്കൗണ്ട് എപ്പോൾ വേണമെങ്കിലും ഞങ്ങളുടെ <a href="%portalUrl%" style="color: #00acc1;">രക്ഷിതാക്കളുടെ പോർട്ടൽ</a> വഴി നിയന്ത്രിക്കാം. <a href="%infoUrl%" style="color: #00acc1;">രക്ഷിതാവ് എന്ന നിലയിലുള്ള നിന്റെ അവകാശങ്ങളെക്കുറിച്ച്</a> കൂടുതലറിയുക.'
  confirmed:
    title: "സമ്മതം നൽകി"
    message: "നന്ദി! %username%-ന്റെ അക്കൗണ്ട് ഇപ്പോൾ പൂർണ്ണമായി സജീവമാണ്."
    continueButton: "പ്രോജക്റ്റുകൾ കണ്ടെത്തുക"
parent:
  footer:
    link: "രക്ഷിതാക്കളും സംരക്ഷകരും"
  info:
    title: "രക്ഷിതാക്കൾക്കും സംരക്ഷകർക്കുമുള്ള വിവരങ്ങൾ"
    intro: "യുവ ഉപയോക്താക്കളുടെ സുരക്ഷയും സ്വകാര്യതയും Catrobat ഗൗരവമായി കാണുന്നു. നിന്റെ കുട്ടിയെ ഞങ്ങൾ എങ്ങനെ സംരക്ഷിക്കുന്നുവെന്നും നിനക്ക് എന്തൊക്കെ അവകാശങ്ങളുണ്ടെന്നും ഈ പേജ് വിശദീകരിക്കുന്നു."
    whatIsCatrobat:
      title: "എന്താണ് Catrobat?"
      text: "കുട്ടികളും യുവാക്കളും സ്വന്തം ആപ്പുകളും ഗെയിമുകളും ആനിമേഷനുകളും സൃഷ്ടിച്ച് പ്രോഗ്രാമിംഗ് പഠിക്കുന്ന ഒരു സൗജന്യ, ലാഭേച്ഛയില്ലാത്ത വിദ്യാഭ്യാസ പ്ലാറ്റ്‌ഫോമാണ് Catrobat. ഈ പ്ലാറ്റ്‌ഫോം ലോകമെമ്പാടും ലഭ്യമാണ്, വിദ്യാഭ്യാസ രംഗത്ത് ഉപയോഗിക്കപ്പെടുന്നു."
    dataCollected:
      title: "ഞങ്ങൾ എന്ത് ഡാറ്റയാണ് ശേഖരിക്കുന്നത്?"
      text: "പ്ലാറ്റ്‌ഫോം പ്രവർത്തിപ്പിക്കാൻ ആവശ്യമായ ഏറ്റവും കുറഞ്ഞ ഡാറ്റ മാത്രമേ ഞങ്ങൾ ശേഖരിക്കുന്നുള്ളൂ: ഉപയോക്തൃനാമം, ഇമെയിൽ വിലാസം, ജനനത്തീയതി, നിന്റെ കുട്ടി സൃഷ്ടിച്ച് അപ്‌ലോഡ് ചെയ്യുന്ന പ്രോജക്റ്റുകൾ. 14 വയസ്സിൽ താഴെയുള്ള ഉപയോക്താക്കൾക്കായി, സമ്മതം ആവശ്യങ്ങൾക്കായി ഒരു രക്ഷിതാവിന്റെ/സംരക്ഷകന്റെ ഇമെയിൽ വിലാസവും ഞങ്ങൾ സൂക്ഷിക്കുന്നു. വ്യക്തിഗത ഡാറ്റ ഞങ്ങൾ മൂന്നാം കക്ഷികൾക്ക് വിൽക്കുകയോ പങ്കിടുകയോ ചെയ്യുന്നില്ല."
    yourRights:
      title: "രക്ഷിതാവ് അല്ലെങ്കിൽ സംരക്ഷകൻ എന്ന നിലയിലുള്ള നിന്റെ അവകാശങ്ങൾ"
      text: "EU ബാല സംരക്ഷണ നിയമങ്ങൾ (GDPR), COPPA എന്നിവ പ്രകാരം നിനക്ക് ഈ അവകാശങ്ങളുണ്ട്: നിന്റെ കുട്ടിയെക്കുറിച്ച് ഞങ്ങൾ സൂക്ഷിക്കുന്ന ഡാറ്റ പരിശോധിക്കുക, ആ ഡാറ്റയുടെ ഒരു പകർപ്പ് ആവശ്യപ്പെടുക, എപ്പോൾ വേണമെങ്കിലും നിന്റെ സമ്മതം പിൻവലിക്കുക (ഇത് അക്കൗണ്ടിനെ പരിമിതപ്പെടുത്തും), നിന്റെ കുട്ടിയുടെ അക്കൗണ്ടും ബന്ധപ്പെട്ട എല്ലാ ഡാറ്റയും സ്ഥിരമായി ഇല്ലാതാക്കാൻ ആവശ്യപ്പെടുക."
    minorRestrictions:
      title: "പ്രായപൂർത്തിയാകാത്തവരുടെ അക്കൗണ്ടുകൾക്ക് എന്തൊക്കെ നിയന്ത്രണങ്ങളുണ്ട്?"
      text: "16 വയസ്സിൽ താഴെയുള്ള ഉപയോക്താക്കൾക്ക് കമന്റുകൾ പോസ്റ്റ് ചെയ്യാനോ വായിക്കാനോ, മറ്റ് ഉപയോക്താക്കളെ പിന്തുടരാനോ, കുട്ടികൾക്ക് അനുയോജ്യമല്ലെന്ന് അടയാളപ്പെടുത്തിയ ഉള്ളടക്കം കാണാനോ കഴിയില്ല. എന്നാൽ അവർക്ക് പ്രോജക്റ്റുകൾ സൃഷ്ടിച്ച് അപ്‌ലോഡ് ചെയ്യാനും പൊതു പ്രോജക്റ്റുകൾ ബ്രൗസ് ചെയ്യാനും ലൈക്കുകളിലൂടെ പ്രതികരിക്കാനും കഴിയും. സുരക്ഷിതമായ പഠന അന്തരീക്ഷം ഒരുക്കാനാണ് ഈ നിയന്ത്രണങ്ങൾ."
    manageButton: "നിന്റെ കുട്ടിയുടെ അക്കൗണ്ട് നിയന്ത്രിക്കുക"
  portal:
    title: "രക്ഷിതാക്കളുടെ പോർട്ടൽ"
    description: "നിന്റെ കുട്ടിയുടെ Catrobat അക്കൗണ്ട് നിയന്ത്രിക്കാനുള്ള സുരക്ഷിത ലിങ്ക് ലഭിക്കാൻ നിന്റെ ഇമെയിൽ വിലാസം നൽകുക. രജിസ്ട്രേഷൻ സമയത്ത് നൽകിയ ഇമെയിൽ വിലാസത്തിലേക്ക് ലിങ്ക് അയയ്ക്കും."
