  message: "ਪਿਆਰੇ %username%,\nਤੂੰ %appplication_url% 'ਤੇ ਆਪਣਾ ਪਾਸਵਰਡ ਰੀਸੈੱਟ ਕਰਨ ਦੀ ਬੇਨਤੀ ਕੀਤੀ ਹੈ ਕਿਉਂਕਿ ਤੂੰ ਆਪਣਾ ਪਾਸਵਰਡ ਭੁੱਲ ਗਿਆ ਹੈਂ।\nਜੇ ਤੂੰ ਇਹ ਬੇਨਤੀ ਨਹੀਂ ਕੀਤੀ, ਤਾਂ ਕਿਰਪਾ ਕਰਕੇ ਇਸਨੂੰ ਅਣਡਿੱਠ ਕਰ। ਇਹ 24 ਘੰਟਿਆਂ ਵਿੱਚ ਖਤਮ ਹੋ ਕੇ ਬੇਕਾਰ ਹੋ ਜਾਵੇਗੀ।\nਆਪਣਾ ਪਾਸਵਰਡ ਰੀਸੈੱਟ ਕਰਨ ਅਤੇ ਨਵਾਂ ਬਣਾਉਣ ਲਈ, ਕਿਰਪਾ ਕਰਕੇ ਇਸ ਪੰਨੇ 'ਤੇ ਜਾ: %confirmationUrl%\nਤੂੰ ਕਿਸੇ ਵੀ ਵੇਲੇ ਆਪਣੇ ਵਰਤੋਂਕਾਰ ਨਾਮ ਅਤੇ ਪਾਸਵਰਡ ਨਾਲ %appplication_url% ਕਮਿਊਨਿਟੀ ਵਿੱਚ ਆ ਸਕਦਾ ਹੈਂ।\nਇਸ ਲਈ ਬੱਸ ਇਸ ਪੰਨੇ 'ਤੇ ਜਾ: %loginPage%\nਆਪਣੀ ਪ੍ਰੋਫਾਈਲ ਦੇ ਵੇਰਵੇ ਸੋਧਣ ਲਈ, ਇਸ ਪੰਨੇ 'ਤੇ ਜਾ: %profilePage%\nਸ਼ੁਭਕਾਮਨਾਵਾਂ,\nਤੇਰੀ Catrobat ਟੀਮ।\n"
  messageHtml: "<p>\nਪਿਆਰੇ %username%,<br>\n<br>\nਤੂੰ <a href=\"%appplication_url%\">Pocket Code</a> 'ਤੇ ਆਪਣਾ ਪਾਸਵਰਡ ਰੀਸੈੱਟ ਕਰਨ ਦੀ ਬੇਨਤੀ ਕੀਤੀ ਹੈ ਕਿਉਂਕਿ ਤੂੰ ਆਪਣਾ ਪਾਸਵਰਡ ਭੁੱਲ ਗਿਆ ਹੈਂ।\nਜੇ ਤੂੰ ਇਹ ਬੇਨਤੀ ਨਹੀਂ ਕੀਤੀ, ਤਾਂ ਕਿਰਪਾ ਕਰਕੇ ਇਸਨੂੰ ਅਣਡਿੱਠ ਕਰ। ਇਹ 24 ਘੰਟਿਆਂ ਵਿੱਚ ਖਤਮ ਹੋ ਕੇ ਬੇਕਾਰ ਹੋ ਜਾਵੇਗੀ।<br>\n<br>\nਆਪਣਾ ਪਾਸਵਰਡ ਰੀਸੈੱਟ ਕਰਨ ਅਤੇ ਨਵਾਂ ਬਣਾਉਣ ਲਈ, ਕਿਰਪਾ ਕਰਕੇ <a href=\"%confirmationUrl%\">ਇੱਥੇ ਕਲਿੱਕ ਕਰ।</a><br>\n<br>\nਤੂੰ ਕਿਸੇ ਵੀ ਵੇਲੇ ਆਪਣੇ ਵਰਤੋਂਕਾਰ ਨਾਮ ਅਤੇ ਪਾਸਵਰਡ ਨਾਲ <a href=\"%appplication_url%\">Pocket Code</a> ਕਮਿਊਨਿਟੀ ਵਿੱਚ ਆ ਸਕਦਾ ਹੈਂ।<br>\nਇਸ ਲਈ ਬੱਸ ਇਸ ਪੰਨੇ 'ਤੇ ਜਾ: <a href=\"%loginPage%\">ਲੌਗ ਇਨ ਪੰਨਾ</a><br>\nਆਪਣੀ ਪ੍ਰੋਫਾਈਲ ਦੇ ਵੇਰਵੇ ਸੋਧਣ ਲਈ, ਇਸ <a href=\"%profilePage%\">ਪੰਨੇ</a> 'ਤੇ ਜਾ।<br>\n<br>\nਸ਼ੁਭਕਾਮਨਾਵਾਂ,<br>\nਤੇਰੀ Catrobat ਟੀਮ।\n</p>\n"
