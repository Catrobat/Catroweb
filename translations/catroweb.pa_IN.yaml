licenseToPlay:
  link: 'ਖੇਡਣ ਲਈ ਲਾਇਸੈਂਸ'
  title: 'ਖੇਡਣ ਦਾ ਲਾਇਸੈਂਸ - ਕ੍ਰੈਡਿਟ ਦੇ ਅਤੇ ਸਾਂਝਾ ਕਰ'
  text1: 'ਕਲਪਨਾ ਕਰ ਕਿ ਹਰ Catrobat ਪ੍ਰੋਜੈਕਟ ਇੱਕ ਕੇਕ ਹੈ, ਇੱਕ ਬਹੁਤ ਹੀ ਖ਼ਾਸ ਕੇਕ ਜੋ ਆਪਣੀ ਵਿਧੀ (ਪ੍ਰੋਗਰਾਮਿੰਗ ਬਲਾਕ) ਨਾਲ ਆਉਂਦਾ ਹੈ। Catrobat ਕਮਿਊਨਿਟੀ ਦੇ ਸਾਰੇ ਮੈਂਬਰ ਆਪਣੇ ਕੇਕ ਉਹਨਾਂ ਦੀਆਂ ਵਿਧੀਆਂ ਸਮੇਤ ਸਾਂਝੇ ਕਰਦੇ ਹਨ। ਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ ਤੂੰ ਕੇਕਾਂ ਦਾ ਮਜ਼ਾ ਵੀ ਲੈ ਸਕਦਾ ਹੈਂ ਅਤੇ ਖੁਦ ਉਹਨਾਂ ਨੂੰ ਬਣਾਉਣਾ ਵੀ ਸਿੱਖ ਸਕਦਾ ਹੈਂ!'
  text2: 'ਕੋਈ ਗੁਪਤ ਵਿਧੀਆਂ ਨਹੀਂ ਹਨ: ਇਹ ਕੇਕ ਬਣਾਉਣ ਦੀਆਂ ਹਦਾਇਤਾਂ ਹਰ ਕਿਸੇ ਲਈ ਖੁੱਲ੍ਹੀਆਂ ਹਨ, ਵਰਤਣ, ਦੁਬਾਰਾ ਵਰਤਣ, ਬਦਲਣ ਅਤੇ ਨਵੇਂ ਵਿਚਾਰਾਂ ਲਈ ਪ੍ਰੇਰਣਾ ਬਣਨ ਲਈ... ਮੇਰਾ ਮਤਲਬ ਕੇਕਾਂ ਲਈ।'
  text3: 'ਤੂੰ ਕੇਕ ਖਾ ਵੀ ਸਕਦਾ ਹੈਂ ਅਤੇ ਦੂਜੇ ਲੋਕਾਂ ਦੀਆਂ ਵਿਧੀਆਂ ਦੀ ਨਕਲ ਕਰਕੇ ਆਪਣਾ ਖੁਦ ਦਾ ਵੀ ਬਣਾ ਸਕਦਾ ਹੈਂ, ਸ਼ਾਇਦ ਵੱਖਰੀ ਸਮੱਗਰੀ ਨਾਲ। ਇਸ ਆਜ਼ਾਦੀ ਨਾਲ ਦੋ ਸਧਾਰਣ ਸ਼ਰਤਾਂ ਜੁੜੀਆਂ ਹਨ:'
  text4: "Catrobat ਭਾਈਚਾਰੇ ਸਥਾਪਤ ਕਰਨ ਵਿੱਚ, ਸਾਨੂੰ ਬਾਅਦ ਸਾਨੂੰ ਵਿਸ਼ਵਾਸ ਹੈ ਕਿ ਇਸ ਨੂੰ ਭਾਈਚਾਰੇ ਦੇ ਅੰਦਰ ਸਿੱਖਣ ਅਤੇ ਰਚਨਾਤਮਕਤਾ ਨੂੰ ਸਹਿਯੋਗ ਦਿੰਦਾ ਹੈ ਇਸ ਪਹੁੰਚ ਅਪਣਾਉਣ ਦਾ ਫੈਸਲਾ ਕੀਤਾ ਹੈ. ਪਕਵਾਨਾ ਅਤੇ ਸਮੱਗਰੀ (ਸਕ੍ਰਿਪਟਾਂ ਅਤੇ ਕਲਾਕਾਰੀ) ਨੂੰ ਸਾਂਝਾ ਕਰਨ ਨਾਲ, ਲੋਕ ਇਕ ਦੂਜੇ ਦੇ ਵਿਚਾਰਾਂ ਨੂੰ ਤਿਆਰ ਕਰ ਸਕਦੇ ਹਨ ਅਤੇ ਹਰੇਕ ਨੂੰ ਲਾਭ ਹੋਵੇਗਾ."
  text5: 'Catrobat ਵੈੱਬਸਾਈਟ ਡਿਜ਼ਾਈਨ ਕਰਦੇ ਸਮੇਂ, ਅਸੀਂ ਅਜਿਹੀਆਂ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਸ਼ਾਮਲ ਕੀਤੀਆਂ ਜੋ ਲੋਕਾਂ ਨੂੰ ਸਾਂਝਾ ਕਰਨ ਅਤੇ ਦੂਜਿਆਂ ਨੂੰ ਕ੍ਰੈਡਿਟ ਦੇਣ ਲਈ ਉਤਸ਼ਾਹਿਤ ਕਰਦੀਆਂ ਹਨ। ਹਰ ਪ੍ਰੋਜੈਕਟ ਪੰਨੇ ''ਤੇ, ਤੂੰ ਹਮੇਸ਼ਾ ਪ੍ਰੋਜੈਕਟ ਦੀਆਂ ਅਸਲੀ ਸਕ੍ਰਿਪਟਾਂ ਡਾਊਨਲੋਡ ਕਰ ਸਕਦਾ ਹੈਂ। ਜੇ ਤੂੰ ਕਿਸੇ ਪ੍ਰੋਜੈਕਟ ਨੂੰ ਰੀਮਿਕਸ ਕਰਦਾ ਹੈਂ (ਸਕ੍ਰਿਪਟਾਂ ਜਾਂ ਕਲਾਕਾਰੀ ਬਦਲ ਕੇ ਅਤੇ ਨਤੀਜਾ ਸਾਂਝਾ ਕਰਕੇ), ਤਾਂ ਅਸੀਂ ਤੈਨੂੰ ਉਤਸ਼ਾਹਿਤ ਕਰਦੇ ਹਾਂ ਕਿ ਪ੍ਰੋਜੈਕਟ ਨੋਟਸ ਵਿੱਚ ਕ੍ਰੈਡਿਟ ਦੇਵੇਂ, ਅਤੇ ਉਹਨਾਂ ਲੋਕਾਂ ਅਤੇ ਪ੍ਰੋਜੈਕਟ ਦਾ ਜ਼ਿਕਰ ਕਰੇਂ ਜਿਨ੍ਹਾਂ ਨੇ ਤੈਨੂੰ ਪ੍ਰੇਰਿਤ ਕੀਤਾ।'
  text6: 'Catrobat ਔਨਲਾਈਨ ਕਮਿਊਨਿਟੀ ਦੀਆਂ ਵਰਤੋਂ ਦੀਆਂ ਸ਼ਰਤਾਂ ਬਾਰੇ %link-termsOfUse% ''ਤੇ ਹੋਰ ਜਾਣ।'
  list1:
    item1: 'ਆਪਣੇ ਕੇਕ ਵਿਧੀ ਸਮੇਤ ਸਾਂਝੇ ਕਰ'
    item2: 'ਜਿਨ੍ਹਾਂ ਨੇ ਤੈਨੂੰ ਪ੍ਰੇਰਿਤ ਕੀਤਾ ਉਹਨਾਂ ਨੂੰ ਕ੍ਰੈਡਿਟ ਦੇ'
  version: ਸੰਸਕਰਣ 1.1, 2 ਅਪ੍ਰੈਲ 2013
termsOfUse:
  title: 'ਵਰਤੋਂ ਦੀਆਂ ਸ਼ਰਤਾਂ'
  headline: Catrobat ਭਾਈਚਾਰੇ ਸੁਆਗਤ ਹੈ!
  text1: 'Catrobat ਕਮਿਊਨਿਟੀ ਦਾ ਹਿੱਸਾ ਹੋਣ ਦੇ ਨਾਤੇ, ਤੂੰ ਲੋਕਾਂ ਨਾਲ ਪ੍ਰੋਜੈਕਟ ਅਤੇ ਵਿਚਾਰ ਸਾਂਝੇ ਕਰ ਰਿਹਾ ਹੈਂ:'
  text2: 'ਇਸ ਕਮਿਊਨਿਟੀ ਨੂੰ ਹਰ ਮੈਂਬਰ ਲਈ ਮਦਦਗਾਰ ਥਾਂ ਬਣਾਉਣ ਲਈ ਸਾਨੂੰ ਤੇਰੀ ਮਦਦ ਚਾਹੀਦੀ ਹੈ। ਤੂੰ ਇਸ ਤਰ੍ਹਾਂ ਮਦਦ ਕਰ ਸਕਦਾ ਹੈਂ:'
  text3: 'Catrobat ਪ੍ਰੋਜੈਕਟ ਰਾਹੀਂ ਅਸੀਂ ਸਹਿਯੋਗ ਨੂੰ ਵਧਾਉਣਾ ਚਾਹੁੰਦੇ ਹਾਂ ਅਤੇ ਸਾਰਿਆਂ ਦੀ ਰਚਨਾਤਮਕਤਾ ਨੂੰ ਸਾਰੀ ਮਨੁੱਖਤਾ ਦੇ ਭਲੇ ਲਈ ਜੋੜਨਾ ਚਾਹੁੰਦੇ ਹਾਂ। ਤੂੰ ਵੀ ਆਪਣੇ ਪ੍ਰੋਜੈਕਟ ਕਮਿਊਨਿਟੀ ਨੂੰ ਤੋਹਫ਼ੇ ਵਜੋਂ ਵਾਪਸ ਦੇ ਕੇ Catrobat ਕਮਿਊਨਿਟੀ ਦਾ ਸਰਗਰਮ ਮੈਂਬਰ ਬਣ ਸਕਦਾ ਹੈਂ, ਬਿਲਕੁਲ ਉਸੇ ਤਰ੍ਹਾਂ ਜਿਵੇਂ ਦੂਜੇ ਸਰਗਰਮ ਮੈਂਬਰ ਆਪਣੇ ਪ੍ਰੋਜੈਕਟ ਤੈਨੂੰ ਦੇ ਰਹੇ ਹਨ:'
  text4: 'ਤੇਰੇ ਲਈ ਸਾਡਾ ਤੋਹਫ਼ਾ:'
  text5: 'ਸਾਡੀ ਵਰਤੋਂ ਅਤੇ ਸੇਵਾ ਦੀਆਂ ਸ਼ਰਤਾਂ:'
  list1:
    item1: ਬਹੁਤ ਸਾਰੇ ਵੱਖ ਵੱਖ ਦੇਸ਼ ਅਤੇ ਸਭਿਆਚਾਰ ਤੱਕ
    item2: ਹਰ ਉਮਰ ਦੇ (ਛੋਟੇ ਬੱਚਿਆਂ ਤੋਂ ਲੈ ਕੇ ਕਿਸ਼ੋਰ ਅਤੇ ਦਾਦਾ-ਦਾਦੀ ਤੱਕ)
    item3: ਹਰ ਪੱਧਰ ਦੇ ਤਜ਼ਰਬੇ ਦੇ ਨਾਲ
  list2:
    item1: 'ਇੱਜ਼ਤ ਨਾਲ ਪੇਸ਼ ਆ। ਪ੍ਰੋਜੈਕਟ ਸਾਂਝੇ ਕਰਦੇ ਸਮੇਂ, ਯਾਦ ਰੱਖ ਕਿ ਵੱਖ-ਵੱਖ ਉਮਰਾਂ ਅਤੇ ਪਿਛੋਕੜਾਂ ਦੇ ਲੋਕ ਤੇਰਾ ਯੋਗਦਾਨ ਦੇਖਣਗੇ।'
    item2: 'ਕ੍ਰੈਡਿਟ ਦੇ। ਦੂਜੇ ਲੋਕਾਂ ਦੇ ਪ੍ਰੋਜੈਕਟਾਂ ਦੇ ਬਦਲੇ ਹੋਏ ਸੰਸਕਰਣ ਬੇਝਿਜਕ ਬਣਾ - ਬੱਸ ਉਹਨਾਂ ਨੂੰ ਕ੍ਰੈਡਿਟ ਦੇਣਾ ਨਾ ਭੁੱਲੀਂ। ਕ੍ਰੈਡਿਟ ਦੇਣ ਦੀ ਇੱਕ ਥਾਂ ਤੇਰੇ ਪ੍ਰੋਜੈਕਟ ਦਾ ਨੋਟਸ ਅਤੇ ਕ੍ਰੈਡਿਟ ਭਾਗ ਹੈ। ਦੂਜੇ ਵਰਤੋਂਕਾਰਾਂ ਦੇ ਪ੍ਰੋਜੈਕਟ ਬਦਲਣ ਬਾਰੇ ਵੇਰਵਿਆਂ ਲਈ ਕਿਰਪਾ ਕਰਕੇ ਇਸ ਬਿੰਦੂ-ਸੂਚੀ ਦੇ ਹੇਠਾਂ ਵਾਲਾ ਪੈਰਾ ਦੇਖ।'
    item3: 'ਇਮਾਨਦਾਰ ਬਣ। ਜੋ ਤੂੰ ਹੈਂ ਉਸ ਤੋਂ ਵੱਖਰਾ ਕੋਈ ਹੋਣ ਦਾ ਦਿਖਾਵਾ ਨਾ ਕਰ ਅਤੇ ਕਮਿਊਨਿਟੀ ਨੂੰ ਧੋਖਾ ਦੇਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਨਾ ਕਰ।'
    item4: 'ਨਿੱਜੀ ਜਾਣਕਾਰੀ ਨਿੱਜੀ ਰੱਖ। ਆਪਣਾ ਈ-ਮੇਲ ਪਤਾ, ਫ਼ੋਨ ਨੰਬਰ ਜਾਂ ਹੋਰ ਨਿੱਜੀ ਸੰਪਰਕ ਜਾਣਕਾਰੀ ਸਾਂਝੀ ਨਾ ਕਰ।'
    item5: 'ਸਾਈਟ ਨੂੰ ਦੋਸਤਾਨਾ ਰੱਖਣ ਵਿੱਚ ਮਦਦ ਕਰ। ਜੇ ਤੈਨੂੰ ਲੱਗਦਾ ਹੈ ਕਿ ਦੂਜਿਆਂ ਨੂੰ ਕੋਈ ਪ੍ਰੋਜੈਕਟ ਜਾਂ ਟਿੱਪਣੀ ਘਟੀਆ, ਅਪਮਾਨਜਨਕ, ਬਹੁਤ ਹਿੰਸਕ ਜਾਂ ਕਿਸੇ ਹੋਰ ਤਰ੍ਹਾਂ ਅਣਉਚਿਤ ਲੱਗੇਗੀ, ਤਾਂ ਬੱਸ ''ਅਣਉਚਿਤ ਵਜੋਂ ਰਿਪੋਰਟ ਕਰ'' ਬਟਨ ''ਤੇ ਕਲਿੱਕ ਕਰ ਅਤੇ ਛੋਟਾ ਜਿਹਾ ਕਾਰਨ ਲਿਖ। Catrobat ਟੀਮ ਤੇਰੀ ਰਿਪੋਰਟ ਦੀ ਸਮੀਖਿਆ ਕਰੇਗੀ ਅਤੇ ਕੋਈ ਵੀ ਪ੍ਰੋਜੈਕਟ, ਟਿੱਪਣੀ ਜਾਂ ਪੋਸਟ ਹਟਾ ਸਕਦੀ ਹੈ।'
  list3:
    item1: 'ਸਾਡੀਆਂ ਵੈੱਬਸਾਈਟਾਂ ''ਤੇ ਪ੍ਰੋਜੈਕਟ ਅੱਪਲੋਡ ਕਰਕੇ, ਤੂੰ ਇਸ ਕੰਮ ਨੂੰ ਅੱਪਲੋਡ ਕੀਤੇ Catrobat ਪ੍ਰੋਜੈਕਟਾਂ ਦੇ ਕੁਝ ਮੁਫ਼ਤ ਲਾਇਸੈਂਸਾਂ ਅਧੀਨ ਰੱਖਣਾ ਸਵੀਕਾਰ ਕਰਦਾ ਹੈਂ ਅਤੇ ਇਸ ਨਾਲ ਸਹਿਮਤ ਹੁੰਦਾ ਹੈਂ। ਉਹਨਾਂ ਮੁਫ਼ਤ ਲਾਇਸੈਂਸਾਂ ਵਾਂਗ ਜਿਨ੍ਹਾਂ ਅਧੀਨ Catrobat ਸਿਸਟਮ ਖੁਦ ਤੈਨੂੰ ਮਿਲਦਾ ਹੈ, ਅੱਪਲੋਡ ਕੀਤੇ Catrobat ਪ੍ਰੋਜੈਕਟਾਂ ਦੇ ਇਹ ਮੁਫ਼ਤ ਲਾਇਸੈਂਸ ਹਰ ਕਿਸੇ ਨੂੰ ਇਹ ਅਧਿਕਾਰ ਦਿੰਦੇ ਹਨ ਕਿ ਉਹ ਦੂਜਿਆਂ ਵੱਲੋਂ ਪਹਿਲਾਂ ਅੱਪਲੋਡ ਕੀਤੇ ਕੰਮ ਤੋਂ ਸਿੱਖੇ ਅਤੇ ਉਸ ਕੰਮ ਨੂੰ ਬਦਲ ਅਤੇ ਰੀਮਿਕਸ ਕਰਕੇ ਆਪਣੀਆਂ ਨਵੀਆਂ ਦਿਲਚਸਪ ਗੇਮਾਂ, ਐਨੀਮੇਸ਼ਨਾਂ ਅਤੇ ਹੋਰ ਪ੍ਰੋਜੈਕਟ ਬਣਾਏ। ਇਸ ਨਾਲ ਹਰ ਕੋਈ ''ਆਪਣੇ ਸਾਥੀਆਂ ਦੇ ਮੋਢਿਆਂ ''ਤੇ ਖੜ੍ਹ'' ਸਕਦਾ ਹੈ, ਅਤੇ ਉਹਨਾਂ ਵਿੱਚੋਂ ਇੱਕ ਤੂੰ ਹੈਂ! ਇਸ ਤਰ੍ਹਾਂ ਤੇਰੇ ਕੰਮ ਦਾ ਫ਼ਾਇਦਾ ਸਾਰੀ ਦੁਨੀਆ ਨੂੰ ਹੋਵੇਗਾ ਅਤੇ ਇਹ ਸਾਰਿਆਂ ਲਈ ਵਰਤਣ ਲਈ ਮੁਫ਼ਤ ਰਹੇਗਾ, ਕੁਝ ਉਸ ਲਿਖਤ ਅਤੇ ਤਸਵੀਰਾਂ ਵਾਂਗ ਜੋ ਦੁਨੀਆ ਭਰ ਦੇ ਵਲੰਟੀਅਰ ਖੁੱਲ੍ਹੇ ਦਿਲ ਨਾਲ Wikipedia ਨੂੰ ਦਿੰਦੇ ਹਨ। ਇਸਨੂੰ ਮਨੁੱਖਤਾ ਲਈ ਆਪਣਾ ਤੋਹਫ਼ਾ ਸਮਝ: ਤੂੰ ਸਾਰਿਆਂ ਨੂੰ ਦਿੰਦਾ ਹੈਂ, ਅਤੇ ਸਾਡੀਆਂ ਵੈੱਬਸਾਈਟਾਂ ''ਤੇ ਆਪਣਾ ਕੰਮ ਅੱਪਲੋਡ ਕਰਨ ਵਾਲੇ ਬਾਕੀ ਸਾਰੇ ਤੈਨੂੰ ਦਿੰਦੇ ਹਨ। ਇਸ ਤਰ੍ਹਾਂ ਅੱਪਲੋਡ ਕੀਤਾ ਪ੍ਰੋਜੈਕਟ ਇੱਕ ਬਹੁਤ ਕੀਮਤੀ ਤੋਹਫ਼ਾ ਹੈ ਜੋ ਉਸਦਾ ਮਾਲਕ ਤੈਨੂੰ ਮੁਫ਼ਤ ਦੇ ਰਿਹਾ ਹੈ, ਇਸ ਸ਼ਰਤ ਨਾਲ ਕਿ ਤੂੰ ਵੀ ਉਹਨਾਂ ਹੀ ਸ਼ਰਤਾਂ ''ਤੇ ਕਮਿਊਨਿਟੀ ਵਿੱਚ ਹਿੱਸਾ ਲਵੇਂ।'
    item2: 'ਤੈਨੂੰ ਤੋਹਫ਼ਾ ਸਵੀਕਾਰ ਕਰਨਾ ਜ਼ਰੂਰੀ ਨਹੀਂ; ਜੇ ਕਰਦਾ ਹੈਂ, ਤਾਂ ਕੁਝ ਨਿਯਮ ਲਾਗੂ ਹੁੰਦੇ ਹਨ। ਇਹਨਾਂ ਨਿਯਮਾਂ ਦਾ ਫ਼ਾਇਦਾ ਇਹ ਹੈ ਕਿ ਤੂੰ ਕੰਮ ਤੋਂ ਸਿੱਖ ਸਕਦਾ ਹੈਂ ਅਤੇ ਉਸ ''ਤੇ ਅੱਗੇ ਬਣਾ ਕੇ ਖੁਦ ਹੋਰ ਵੀ ਵਧੀਆ ਚੀਜ਼ਾਂ ਬਣਾ ਸਕਦਾ ਹੈਂ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਤੂੰ ਫਿਰ, ਮਿਸਾਲ ਵਜੋਂ, ਆਪਣੇ ਕੰਮ ਵਜੋਂ ਸਾਡੀਆਂ ਵੈੱਬਸਾਈਟਾਂ ''ਤੇ ਦੁਬਾਰਾ ਅੱਪਲੋਡ ਕਰ ਸਕਦਾ ਹੈਂ। ਇੱਕ ਹੋਰ ਫ਼ਾਇਦਾ ਇਹ ਹੈ ਕਿ ਇਹ ਲਾਇਸੈਂਸ ਪੱਕਾ ਕਰਦੇ ਹਨ ਕਿ ਦੂਜਿਆਂ ਵੱਲੋਂ ਤੇਰੇ ਪ੍ਰੋਜੈਕਟ ਦੀ ਵਰਤੋਂ ਨਾਲ ਉਹਨਾਂ ਨੂੰ ਹੋਣ ਵਾਲੀਆਂ ਕਿਸੇ ਵੀ ਸਮੱਸਿਆਵਾਂ ਲਈ ਤੈਨੂੰ ਜ਼ਿੰਮੇਵਾਰ ਨਹੀਂ ਠਹਿਰਾਇਆ ਜਾ ਸਕਦਾ।'
    item3: 'ਇੱਕ ਅਹਿਮ ਵਾਧੂ ਸ਼ਰਤ ਇਹ ਹੈ ਕਿ ਤੂੰ ਉਹਨਾਂ ਲੇਖਕਾਂ ਨੂੰ ਸਾਫ਼-ਸਾਫ਼ ਕ੍ਰੈਡਿਟ ਦੇਵੇਂ ਜਿਨ੍ਹਾਂ ਦੇ ਕੰਮ ''ਤੇ ਤੂੰ ਆਪਣਾ ਕੰਮ ਅਧਾਰਿਤ ਕੀਤਾ ਹੈ। ਇਸਦੇ ਨਾਲ ਹੀ, ਅਸੀਂ ਪੂਰੀ ਕੋਸ਼ਿਸ਼ ਕਰਾਂਗੇ ਕਿ ਦੂਜੇ ਸਾਫ਼-ਸਾਫ਼ ਪਛਾਣਨ ਕਿ ਇਹ ਕੰਮ ਤੇਰਾ ਯੋਗਦਾਨ ਹੈ: ਉਸ ਵਿਲੱਖਣ ਨਾਮ ਨੂੰ ਕ੍ਰੈਡਿਟ ਦੇ ਕੇ ਜੋ ਤੂੰ Catrobat ਕਮਿਊਨਿਟੀ ਵਿੱਚ ਆਪਣੀ ਪਛਾਣ ਲਈ ਆਪਣੀ ਮਰਜ਼ੀ ਨਾਲ ਚੁਣਿਆ ਹੈ, ਅਤੇ ਦੂਜਿਆਂ ਨੂੰ ਇਹ ਮੌਕਾ ਦੇ ਕੇ ਕਿ ਉਹ ਤੇਰਾ ਕੰਮ ਸਾਰਿਆਂ ਨੂੰ, ਅਤੇ ਖ਼ਾਸ ਕਰਕੇ ਉਹਨਾਂ ਨੂੰ, ਦੇਣ ਲਈ ਜਨਤਕ ਤੌਰ ''ਤੇ ਤੇਰਾ ਧੰਨਵਾਦ ਕਰ ਸਕਣ।'
    item4: 'ਸਹੀ ਕਾਨੂੰਨੀ ਨਿਯਮਾਂ ਅਤੇ ਸ਼ਰਤਾਂ ਲਈ ਕਿਰਪਾ ਕਰਕੇ %link-licenseUploaded% ਦੇਖ।'
  list4:
    item1: 'ਅਸੀਂ Catrobat ਸਿਸਟਮ ਨਾਲ ਜੁੜੇ ਆਪਣੇ ਸਾਰੇ ਸਾਫ਼ਟਵੇਅਰ ਅਤੇ ਇੰਟਰਨੈੱਟ ਸਰੋਤ, ਜਿਵੇਂ ਕਿ Catrobat ਟੀਮ ਵੱਲੋਂ ਲਿਖਿਆ ਸਾਫ਼ਟਵੇਅਰ, ਸਾਡੀਆਂ ਵੈੱਬਸਾਈਟਾਂ ਅਤੇ ਇੰਟਰਨੈੱਟ ਸਰੋਤ, Catrobat ਸਿਸਟਮ ਨਾਲ ਜੁੜਿਆ ਸਾਡਾ ਆਪਣਾ ਸੋਰਸ ਕੋਡ, ਅਤੇ ਸਾਰੀ ਵਾਧੂ ਸ਼ਾਮਲ ਸਮੱਗਰੀ ਜਿਵੇਂ ਤਸਵੀਰਾਂ, ਆਵਾਜ਼ਾਂ ਅਤੇ ਲਿਖਤਾਂ, ਹੁਣ ਅਤੇ ਭਵਿੱਖ ਵਿੱਚ Catrobat ਦੇ ਮੁਫ਼ਤ ਲਾਇਸੈਂਸਾਂ ਅਧੀਨ ਤੈਨੂੰ ਪੇਸ਼ ਕਰਦੇ ਹਾਂ।'
    item2: 'ਇਹ ਲਾਇਸੈਂਸ Catrobat ਦੇ ਸਾਰੇ ਹਿੱਸਿਆਂ ਨੂੰ ਤੇਰੇ ਲਈ ਮੁਫ਼ਤ ਵੀ ਬਣਾਉਂਦੇ ਹਨ ਅਤੇ ਆਜ਼ਾਦ ਵੀ, ਭਾਵ ਤੈਨੂੰ ਉਹਨਾਂ ਨੂੰ ਜਿਵੇਂ ਮਰਜ਼ੀ ਵਰਤਣ ਦੀ ਆਜ਼ਾਦੀ ਦਿੰਦੇ ਹਨ, ਸਿਰਫ਼ ਕੁਝ ਪਾਬੰਦੀਆਂ ਨਾਲ ਜੋ ਹੋਰ ਗੱਲਾਂ ਦੇ ਨਾਲ ਇਹ ਪੱਕਾ ਕਰਦੀਆਂ ਹਨ ਕਿ Catrobat ਸਿਸਟਮ ਹਮੇਸ਼ਾ ਸਾਰਿਆਂ ਲਈ ਆਜ਼ਾਦ ਅਤੇ ਲਾਭਦਾਇਕ ਰਹੇ।'
    item3: 'ਸਹੀ ਕਾਨੂੰਨੀ ਨਿਯਮਾਂ ਅਤੇ ਸ਼ਰਤਾਂ ਲਈ ਕਿਰਪਾ ਕਰਕੇ %link-licenseToPlay% ਦੇਖ। Catrobat ਸਿਸਟਮ ਦਾ ਸੋਰਸ ਕੋਡ ਅਤੇ ਹੋਰ ਬਹੁਤ ਸਾਰੇ ਦਸਤਾਵੇਜ਼ ਅਤੇ ਸਰੋਤ %link-developer% ਰਾਹੀਂ ਉਪਲਬਧ ਹਨ।'
  list5:
    item1: 'ਜੇ ਤੂੰ, ਜਾਂ ਜੇ ਤੇਰੀ ਉਮਰ 13 ਸਾਲ ਤੋਂ ਘੱਟ ਹੈ ਤਾਂ ਤੇਰੇ ਮਾਪੇ ਜਾਂ ਕਾਨੂੰਨੀ ਸਰਪ੍ਰਸਤ, ਕਿਸੇ ਅਜਿਹੇ ਸੰਗਠਨ ਨਾਲ ਜੁੜੇ ਹੋ ਜੋ ਵੱਡੇ ਪੱਧਰ ''ਤੇ ਪਰਦੇਦਾਰੀ ਦੀ ਉਲੰਘਣਾ ਅਤੇ/ਜਾਂ ਥੋਕ ਜਾਂ ਸਮੂਹਿਕ ਨਿਗਰਾਨੀ ਵਿੱਚ ਸ਼ਾਮਲ ਜਾਂ ਉਸ ਲਈ ਜ਼ਿੰਮੇਵਾਰ ਹੈ, ਤਾਂ ਤੈਨੂੰ ਸਾਡੀਆਂ ਸਾਫ਼ਟਵੇਅਰ ਐਪਲੀਕੇਸ਼ਨਾਂ ਵਰਤਣ ਅਤੇ ਸਾਡੀਆਂ ਸੇਵਾਵਾਂ ਤੱਕ ਪਹੁੰਚਣ ਦੀ ਇਜਾਜ਼ਤ ਨਹੀਂ ਹੈ। ਇਸ ਪਾਬੰਦੀ ਦੇ ਸਹੀ ਵੇਰਵੇ ਅਤੇ ਇਸਦੇ ਕੁਝ ਅਪਵਾਦ ਸਾਡੀਆਂ %link-termsOfUse% ਦੀਆਂ ਧਾਰਾਵਾਂ 4.a ਅਤੇ 4.b ਵਿੱਚ ਦੱਸੇ ਗਏ ਹਨ।'
    item2: 'ਜੇ ਤੇਰੀ ਉਮਰ 13 ਸਾਲ ਤੋਂ ਘੱਟ ਹੈ, ਤਾਂ ਤੈਨੂੰ ਆਪਣੇ ਮਾਪਿਆਂ ਜਾਂ ਕਾਨੂੰਨੀ ਸਰਪ੍ਰਸਤਾਂ ਤੋਂ ਪੁੱਛਣਾ ਪਵੇਗਾ ਕਿ ਕੀ ਉਹ ਤੈਨੂੰ Catrobat ਦੀਆਂ ਸਾਫ਼ਟਵੇਅਰ ਐਪਲੀਕੇਸ਼ਨਾਂ ਅਤੇ ਸੇਵਾਵਾਂ ਵਰਤਣ ਦੀ ਇਜਾਜ਼ਤ ਦਿੰਦੇ ਹਨ।'
    item3: 'ਅਸੀਂ ਇਹ ਅਧਿਕਾਰ ਰੱਖਦੇ ਹਾਂ ਕਿ ਆਪਣੀ ਮਰਜ਼ੀ ਨਾਲ ਕਿਸੇ ਵੀ ਵੇਲੇ Catrobat ਦੀਆਂ ਵੈੱਬਸਾਈਟਾਂ ''ਤੇ ਅੱਪਲੋਡ ਕੀਤੇ ਪ੍ਰੋਜੈਕਟ, ਵਰਤੋਂਕਾਰ ਖਾਤੇ ਅਤੇ ਕੋਈ ਵੀ ਡਿਜੀਟਲ ਸਮੱਗਰੀ ਰੱਦ ਕਰੀਏ, ਮਿਟਾਈਏ ਜਾਂ ਲੁਕਾਈਏ, ਮਿਸਾਲ ਵਜੋਂ ਜੇ ਸਾਨੂੰ ਲੱਗੇ ਕਿ ਕਿਸੇ ਪ੍ਰੋਜੈਕਟ ਵਿੱਚ ਅਣਉਚਿਤ ਸਮੱਗਰੀ ਹੈ ਜਾਂ ਕੋਈ ਵਰਤੋਂਕਾਰ ਦੂਜੇ ਲੋਕਾਂ ਦੇ ਅਧਿਕਾਰਾਂ ਦੀ ਉਲੰਘਣਾ ਕਰਦਾ ਹੈ।'
    item4: 'Catrobat ਦੇ ਸਾਰੇ ਸਾਫ਼ਟਵੇਅਰ ਅਤੇ ਇੰਟਰਨੈੱਟ ਸਰੋਤ ਇਸ ਉਮੀਦ ਨਾਲ ਪੇਸ਼ ਕੀਤੇ ਜਾਂਦੇ ਹਨ ਕਿ ਉਹ ਲਾਭਦਾਇਕ ਹੋਣਗੇ, ਪਰ ਬਿਨਾਂ ਕਿਸੇ ਗਾਰੰਟੀ ਦੇ।'
    item5: 'ਉੱਪਰ ਦਿੱਤੇ ਨੁਕਤਿਆਂ ਦੇ ਸਹੀ ਸ਼ਬਦਾਂ ਅਤੇ ਕੁਝ ਵਾਧੂ ਕਾਨੂੰਨੀ ਨਿਯਮਾਂ ਅਤੇ ਸ਼ਰਤਾਂ ਲਈ ਕਿਰਪਾ ਕਰਕੇ ਸਾਡੀਆਂ %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service ਦੇਖ।'
  bottom1: 'ਸਮੇਂ-ਸਮੇਂ ''ਤੇ ਇੱਥੇ ਆ ਕੇ ਦੇਖਦਾ ਰਹੀਂ, ਕਿਉਂਕਿ ਅਸੀਂ ਹਮੇਸ਼ਾ ਆਪਣੀਆਂ ਵਰਤੋਂ ਦੀਆਂ ਸ਼ਰਤਾਂ ਨੂੰ ਸੁਧਾਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰਦੇ ਰਹਿੰਦੇ ਹਾਂ।'
  bottom2: 'ਇਹਨਾਂ ਵਰਤੋਂ ਦੀਆਂ ਸ਼ਰਤਾਂ ਬਾਰੇ ਕੋਈ ਵੀ ਸੁਝਾਅ ਕਿਰਪਾ ਕਰਕੇ %email-webmaster% ਨੂੰ ਈ-ਮੇਲ ਕਰ।'
