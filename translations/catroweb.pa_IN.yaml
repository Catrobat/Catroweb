  text: '%project_count% ਸ਼ਾਨਦਾਰ ਪ੍ਰੋਜੈਕਟ ਪਹਿਲਾਂ ਹੀ ਸਾਂਝੇ ਹੋ ਚੁੱਕੇ ਹਨ, ਅਗਲਾ ਤੇਰਾ ਹੋ ਸਕਦਾ ਹੈ। ਸਾਡੀ ਐਪ ਡਾਊਨਲੋਡ ਕਰ ਅਤੇ ਅੱਜ ਹੀ ਬਣਾਉਣਾ ਸ਼ੁਰੂ ਕਰ'
privacy-policy:
  header: ਪਰਾਈਵੇਟ ਨੀਤੀ
  version: ਸੰਸਕਰਣ 2.2, 17 ਅਕਤੂਬਰ 2019
  text1: 'ਤੈਨੂੰ ਸਾਡੀਆਂ ਸੇਵਾਵਾਂ ਅਤੇ ਸੰਬੰਧਿਤ ਖਾਤੇ ਦੇ ਸਾਰੇ ਫ਼ਾਇਦੇ ਦੇਣ ਲਈ, ਤੇਰੇ ਤੋਂ ਕੁਝ ਡਾਟਾ ਇਕੱਠਾ ਕਰਨਾ ਜ਼ਰੂਰੀ ਹੈ।'
  text2: 'ਆਪਣੀਆਂ ਸੇਵਾਵਾਂ (ਐਪਾਂ ਅਤੇ ਵੈੱਬਸਾਈਟਾਂ) ਨੂੰ ਚਲਾਉਣ ਅਤੇ ਬਿਹਤਰ ਬਣਾਉਣ ਲਈ ਅਤੇ ICT ਅਤੇ STEM/STEAM ਸਿੱਖਿਆ ''ਤੇ ਵਿਗਿਆਨਕ ਖੋਜ ਕਰਨ ਲਈ, ਅਸੀਂ Google LLC (USA) ਦੇ Google Analytics, Crashlytics ਅਤੇ Firebase, ਅਤੇ Dynatrace LLC (USA) ਦਾ Dynatrace ਵਰਤਦੇ ਹਾਂ ਤਾਂ ਜੋ ਸਾਡੀਆਂ ਸੇਵਾਵਾਂ ਦੀ ਵਰਤੋਂ ਬਾਰੇ ਮੈਟਾਡਾਟਾ ਮਿਲ ਸਕੇ, ਜਿਵੇਂ ਕ੍ਰੈਸ਼ ਜਾਣਕਾਰੀ, ਸਮਾਂ-ਮੋਹਰਾਂ, ਦੇਖੇ ਗਏ ਪੰਨੇ/ਸਕ੍ਰੀਨਾਂ, ਸਾਡੀਆਂ ਐਪਾਂ ਅਤੇ ਸੇਵਾਵਾਂ ਦੀ ਵਰਤੋਂ, ਵਰਤਿਆ ਗਿਆ ਓਪਰੇਟਿੰਗ ਸਿਸਟਮ, ਅਤੇ ਨੈੱਟਵਰਕ ਪ੍ਰਦਾਤਾ ਬਾਰੇ ਜਾਣਕਾਰੀ। ਇਹ ਵਿਸ਼ਲੇਸ਼ਣ ਅਤੇ ਇਕੱਠਾ ਕੀਤਾ ਡਾਟਾ ਤੇਰੀ ਪ੍ਰੋਫਾਈਲ ਨਾਲ ਜੁੜਿਆ ਨਹੀਂ ਹੈ ਅਤੇ ਇਸ ਵਿੱਚ ਕੋਈ ਨਿੱਜੀ ਜਾਣਕਾਰੀ ਨਹੀਂ ਹੁੰਦੀ (IP ਪਤੇ ਦੇ ਆਖਰੀ ਹਿੱਸੇ ਗੁਮਨਾਮ ਕਰ ਦਿੱਤੇ ਜਾਂਦੇ ਹਨ)। ਫਿਰ ਵੀ, ਇਕੱਠਾ ਕੀਤਾ ਡਾਟਾ ਸੇਵਾ ਪ੍ਰਦਾਤਾਵਾਂ (Google LLC, USA ਅਤੇ Dynatrace LLC, USA) ਨੂੰ ਭੇਜਿਆ ਜਾਵੇਗਾ। ਡਾਟਾ ਪ੍ਰੋਸੈਸਿੰਗ Google LLC ਅਤੇ Dynatrace LLC ਨਾਲ ਸਮਝੌਤਿਆਂ ''ਤੇ ਅਧਾਰਿਤ ਹੈ। ਸੇਵਾ ਪ੍ਰਦਾਤਾਵਾਂ ਨਾਲ ਇਹ ਸੰਬੰਧ ਯੂਰਪੀ ਯੂਨੀਅਨ ਦੇ ਜਨਰਲ ਡਾਟਾ ਪ੍ਰੋਟੈਕਸ਼ਨ ਰੈਗੂਲੇਸ਼ਨ (EU GDPR) ਅਤੇ EU-USA "Privacy Shield" ਸਮਝੌਤੇ ਦੇ ਅਨੁਸਾਰ ਹੈ।'
  text3: 'ਸਾਡੇ ਸਿਸਟਮਾਂ ਵਿੱਚ ਖਾਤਾ ਬਣਾਉਣ ਅਤੇ ਵਰਤਣ ਲਈ, ਅਤੇ ਤੈਨੂੰ ਤੇਰੇ ਖਾਤੇ ਬਾਰੇ ਜ਼ਰੂਰੀ ਤਬਦੀਲੀਆਂ, ਜਿਵੇਂ ਕਿ ਸਾਡੀਆਂ ਵਰਤੋਂ ਅਤੇ ਸੇਵਾ ਦੀਆਂ ਸ਼ਰਤਾਂ, ਕਮਿਊਨਿਟੀ ਨਿਯਮਾਂ ਜਾਂ ਨੀਤੀਆਂ ਦੇ ਅਪਡੇਟ ਜਾਂ ਉਲੰਘਣਾ ਬਾਰੇ ਈ-ਮੇਲ ਰਾਹੀਂ ਦੱਸਣ ਲਈ, ਅਸੀਂ ਤੇਰਾ ਵਰਤੋਂਕਾਰ ਨਾਮ ਅਤੇ, ਜੇ ਤੂੰ ਦਿੱਤਾ ਹੈ, ਤੇਰਾ ਈ-ਮੇਲ ਪਤਾ ਸੰਭਾਲ ਕੇ ਰੱਖਾਂਗੇ। ਜੇ ਤੂੰ ਆਪਣਾ ਖਾਤਾ Google Plus ਜਾਂ Facebook ਰਾਹੀਂ ਜੋੜਿਆ ਹੈ, ਤਾਂ ਅਸੀਂ ਇਹਨਾਂ ਸੇਵਾਵਾਂ ''ਤੇ ਤੇਰੇ ਖਾਤੇ ਨਾਲ ਜੁੜੀ ਇੱਕ ਪਛਾਣ ਕੁੰਜੀ ਵੀ ਸੰਭਾਲਦੇ ਹਾਂ। ਅਸੀਂ ਇਹ ਡਾਟਾ ਕਿਸੇ ਹੋਰ (ਜਿਵੇਂ ਮਾਰਕੀਟਿੰਗ) ਮਕਸਦ ਲਈ ਨਹੀਂ ਵਰਤਾਂਗੇ, ਜਦੋਂ ਤੱਕ ਤੂੰ ਸਾਨੂੰ ਸਾਫ਼ ਤੌਰ ''ਤੇ ਇਸਦੀ ਇਜਾਜ਼ਤ ਨਹੀਂ ਦਿੰਦਾ।'
  text4: 'ਆਪਣੀ ਮਰਜ਼ੀ ਨਾਲ, ਤੂੰ ਸ਼ੇਅਰਿੰਗ ਸਾਈਟ ''ਤੇ ਆਪਣੇ ਖਾਤੇ ਦੇ ਪੰਨੇ ਰਾਹੀਂ ਸਾਨੂੰ ਆਪਣੇ ਰਿਹਾਇਸ਼ੀ ਦੇਸ਼ ਬਾਰੇ ਦੱਸ ਸਕਦਾ ਹੈਂ। ਇਹ ਤੇਰੀ ਜਨਤਕ ਪ੍ਰੋਫਾਈਲ ''ਤੇ ਦਿਖਾਇਆ ਜਾਵੇਗਾ ਅਤੇ ਅਸੀਂ ਇਸਨੂੰ ਸਿਰਫ਼ ਅੰਕੜਿਆਂ ਅਤੇ ਖੋਜ ਲਈ ਵਰਤਾਂਗੇ। ਤੂੰ ਇਸਨੂੰ ਕਿਸੇ ਵੀ ਵੇਲੇ ਆਪਣੀਆਂ ਪ੍ਰੋਫਾਈਲ ਸੈਟਿੰਗਾਂ ਵਿੱਚੋਂ ਹਟਾ ਸਕਦਾ ਹੈਂ।'
  text5: 'ਤੂੰ https://share.catrob.at/ ''ਤੇ ਆਪਣੇ ਪ੍ਰੋਫਾਈਲ ਪੰਨੇ ਰਾਹੀਂ ਆਪਣਾ ਖਾਤਾ ਮਿਟਾ ਕੇ ਕਿਸੇ ਵੀ ਵੇਲੇ ਆਪਣੇ ਖਾਤੇ ਨਾਲ ਜੁੜੇ ਨਿੱਜੀ ਡਾਟਾ ਦੀ ਵਰਤੋਂ ਦੀ ਇਜਾਜ਼ਤ ਵਾਪਸ ਲੈ ਸਕਦਾ ਹੈਂ। ਖਾਤਾ ਮਿਟਾਉਣ ਤੋਂ ਬਾਅਦ ਤੂੰ ਫਿਰ ਵੀ ਦਿੱਤੀਆਂ ਸੇਵਾਵਾਂ ਵਰਤ ਸਕੇਂਗਾ, ਪਰ ਸਹਿਯੋਗ ਨਹੀਂ ਕਰ ਸਕੇਂਗਾ, ਜਿਵੇਂ ਪ੍ਰੋਗਰਾਮ ਅੱਪਲੋਡ ਕਰਨਾ, ਟਿੱਪਣੀ ਕਰਨਾ ਜਾਂ ਲਾਈਕ ਕਰਨਾ। ਨਾਲ ਹੀ, ਤੇਰੇ ਖਾਤੇ ਨਾਲ ਜੁੜੀ ਸਾਰੀ ਸਮੱਗਰੀ, ਜਿਵੇਂ ਅੱਪਲੋਡ ਕੀਤੇ ਪ੍ਰੋਗਰਾਮ, ਟਿੱਪਣੀਆਂ ਆਦਿ, ਮਿਟਾ ਦਿੱਤੀ ਜਾਵੇਗੀ।'
  text6: ਸਾਡੀਆਂ ਸੇਵਾਵਾਂ ਦੀ ਦੁਰਵਰਤੋਂ ਤੋਂ ਬਚਣ ਲਈ, ਉਦਾਹਰਣ ਵਜੋਂ, ਨਾਜਾਇਜ਼ ਉਦੇਸ਼ਾਂ ਲਈ ਉਪਭੋਗਤਾ ਦੁਆਰਾ ਦਿੱਤੇ ਅਪਲੋਡਾਂ ਜਾਂ ਟਿੱਪਣੀਆਂ ਦੁਆਰਾ, ਸਾਰੇ ਉਪਭੋਗਤਾ ਦੁਆਰਾ ਤਿਆਰ ਕੀਤੇ ਜਨਤਕ ਡੇਟਾ (ਅਪਲੋਡਸ, ਟਿਪਣੀਆਂ) ਇੱਕ ਟਾਈਮਸਟੈਂਪ ਅਤੇ ਵਰਤੇ ਇੰਟਰਨੈਟ ਪਤੇ ਦੇ ਨਾਲ, ਇੱਕ ਡੇਟਾਬੇਸ ਵਿੱਚ ਅੰਦਰੂਨੀ ਰੂਪ ਵਿੱਚ ਸਟੋਰ ਕੀਤੇ ਜਾਣਗੇ. ਇਹ ਡੇਟਾ ਕਿਸੇ ਵੀ ਸੰਸਥਾ ਦੁਆਰਾ ਇਸਤੇਮਾਲ ਜਾਂ ਅੱਗੇ ਨਹੀਂ ਵਰਤਿਆ ਜਾਏਗਾ, ਜਦ ਤੱਕ ਕਿ ਕਾਫ਼ੀ ਗੈਰ ਕਾਨੂੰਨੀ ਕਾਰਵਾਈਆਂ ਨੂੰ ਉਚਿਤ ਤੌਰ 'ਤੇ ਸ਼ੱਕ ਨਹੀਂ ਕੀਤਾ ਜਾਂਦਾ ਅਤੇ ਅਧਿਕਾਰਤ ਤੌਰ' ਤੇ ਹੱਕਦਾਰ ਕਾਨੂੰਨੀ ਸੰਸਥਾਵਾਂ ਲਾਗੂ ਕਾਨੂੰਨ ਦੇ ਅਧਾਰ ਤੇ ਇਸ ਦੀ ਬੇਨਤੀ ਨਹੀਂ ਕਰਦੀਆਂ. ਹਰ ਕੇਸ ਦੀ ਪਹਿਲਾਂ ਸਾਡੇ ਦੁਆਰਾ ਵਿਅਕਤੀਗਤ ਅਧਾਰ 'ਤੇ ਚੰਗੀ ਤਰ੍ਹਾਂ ਜਾਂਚ ਕੀਤੀ ਜਾਏਗੀ.
  text7: 'ਤੂੰ ਆਪਣੀ ਮਰਜ਼ੀ ਨਾਲ https://catrob.at/newsletter ''ਤੇ Catrobat ਨਿਊਜ਼ਲੈਟਰ ਦੀ ਗਾਹਕੀ ਲੈ ਸਕਦਾ ਹੈਂ, ਜੋ ਅਸੀਂ MailChimp ਸੇਵਾ (The Rocket Science Group LLC d/b/a MailChimp, USA) ਰਾਹੀਂ ਦਿੰਦੇ ਹਾਂ। ਫਿਰ ਤੈਨੂੰ ਤੇਰੇ ਦਿੱਤੇ ਈ-ਮੇਲ ਪਤੇ ''ਤੇ Catrobat ਪ੍ਰੋਜੈਕਟ ਅਤੇ ਇਸਦੀਆਂ ਸੇਵਾਵਾਂ ਬਾਰੇ ਅਪਡੇਟ ਮਿਲਣਗੇ। ਤੂੰ ਹਰ ਨਿਊਜ਼ਲੈਟਰ ਦੇ ਹੇਠਾਂ ਦਿੱਤੇ "unsubscribe" ਲਿੰਕ ਨਾਲ ਕਿਸੇ ਵੀ ਵੇਲੇ ਨਿਊਜ਼ਲੈਟਰ ਬੰਦ ਕਰ ਸਕਦਾ ਹੈਂ। ਇਹ ਨਿਊਜ਼ਲੈਟਰ MailChimp ਵੱਲੋਂ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ, ਜਿਸ ਨਾਲ ਸਾਡਾ ਡਾਟਾ-ਪ੍ਰੋਸੈਸਿੰਗ ਸਮਝੌਤਾ ਹੈ ਅਤੇ ਜੋ EU ਜਨਰਲ ਡਾਟਾ ਪ੍ਰੋਟੈਕਸ਼ਨ ਰੈਗੂਲੇਸ਼ਨ ਅਤੇ EU-USA "Privacy Shield" ਪ੍ਰਤੀ ਵਚਨਬੱਧ ਹੈ। MailChimp ਬਾਰੇ ਹੋਰ ਵੇਰਵਿਆਂ ਲਈ ਕਿਰਪਾ ਕਰਕੇ MailChimp ਦੀ ਪਰਦੇਦਾਰੀ ਨੀਤੀ ਅਤੇ ਵਰਤੋਂ ਦੀਆਂ ਸ਼ਰਤਾਂ ਵੀ ਦੇਖ।'
  text8: 'ਸਾਰੀਆਂ ਸੇਵਾਵਾਂ ਮੁਫ਼ਤ ਓਪਨ ਸੋਰਸ Catrobat ਪ੍ਰੋਜੈਕਟ ਵੱਲੋਂ International Catrobat Association – Verein zur Förderung freier Software ਦੀ ਛਤਰੀ ਹੇਠ ਦਿੱਤੀਆਂ ਜਾਂਦੀਆਂ ਹਨ, ਜੋ Graz, Austria (ਯੂਰਪੀ ਯੂਨੀਅਨ) ਵਿੱਚ ਰਜਿਸਟਰਡ ਇੱਕ ਗੈਰ-ਮੁਨਾਫ਼ਾ NGO ਹੈ। ਸਾਡੀਆਂ ਨੀਤੀਆਂ EU ਅਤੇ ਆਸਟ੍ਰੀਆ ਦੇ ਡਾਟਾ ਸੁਰੱਖਿਆ ਕਾਨੂੰਨ (GDPR) ਦਾ ਸਨਮਾਨ ਕਰਦੀਆਂ ਹਨ। ਸਾਡੇ ਨਾਲ ਸੰਪਰਕ ਕਰਨ ਲਈ, ਕਿਰਪਾ ਕਰਕੇ contact@catrobat.org ''ਤੇ ਈ-ਮੇਲ ਭੇਜ ਜਾਂ ਸਾਨੂੰ ਇਸ ਪਤੇ ''ਤੇ ਡਾਕ ਭੇਜ: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union)।'
  text9: 'ਜੇ ਤੇਰੀ ਉਮਰ 14 ਸਾਲ ਤੋਂ ਘੱਟ ਹੈ, ਤਾਂ ਇਹ ਨੀਤੀ ਕਿਸੇ ਕਾਨੂੰਨੀ ਸਰਪ੍ਰਸਤ (ਆਮ ਤੌਰ ''ਤੇ ਮਾਪੇ) ਵੱਲੋਂ ਸਵੀਕਾਰ ਕੀਤੀ ਜਾਣੀ ਜ਼ਰੂਰੀ ਹੈ।'
  text10: Catrobat ਦੇ ਅਧਿਕਾਰੀ ਅੰਗਰੇਜ਼ੀ ਭਾਸ਼ਾ ਗੁਪਤ ਨੀਤੀ%privacy_policy% ਤਹਿਤ ਵੈੱਬ 'ਤੇ ਉਪਲੱਬਧ ਹੈ.
  disagree-text: ਮਨਜ਼ੂਰੀ ਤੋਂ ਬਿਨਾਂ, ਅਸੀਂ ਕੋਈ ਖਾਤਾ ਨਹੀਂ ਬਣਾ ਸਕਦੇ ਪਰ ਮੁੱਖ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਅਜੇ ਵੀ ਪਹੁੰਚਯੋਗ ਹਨ.
