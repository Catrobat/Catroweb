parent:
  footer:
    link: 'ਮਾਪੇ ਅਤੇ ਸਰਪ੍ਰਸਤ'
  info:
    title: 'ਮਾਪਿਆਂ ਅਤੇ ਸਰਪ੍ਰਸਤਾਂ ਲਈ ਜਾਣਕਾਰੀ'
    intro: 'Catrobat ਨੌਜਵਾਨ ਵਰਤੋਂਕਾਰਾਂ ਦੀ ਸੁਰੱਖਿਆ ਅਤੇ ਪਰਦੇਦਾਰੀ ਨੂੰ ਗੰਭੀਰਤਾ ਨਾਲ ਲੈਂਦਾ ਹੈ। ਇਹ ਪੰਨਾ ਦੱਸਦਾ ਹੈ ਕਿ ਅਸੀਂ ਤੇਰੇ ਬੱਚੇ ਦੀ ਰੱਖਿਆ ਕਿਵੇਂ ਕਰਦੇ ਹਾਂ ਅਤੇ ਤੇਰੇ ਕੀ ਅਧਿਕਾਰ ਹਨ।'
    whatIsCatrobat:
      title: 'Catrobat ਕੀ ਹੈ?'
      text: 'Catrobat ਇੱਕ ਮੁਫ਼ਤ, ਗੈਰ-ਮੁਨਾਫ਼ਾ ਵਿਦਿਅਕ ਪਲੇਟਫਾਰਮ ਹੈ ਜਿੱਥੇ ਨੌਜਵਾਨ ਆਪਣੀਆਂ ਐਪਾਂ, ਗੇਮਾਂ ਅਤੇ ਐਨੀਮੇਸ਼ਨਾਂ ਬਣਾ ਕੇ ਪ੍ਰੋਗਰਾਮਿੰਗ ਸਿੱਖਦੇ ਹਨ। ਇਹ ਪਲੇਟਫਾਰਮ ਦੁਨੀਆ ਭਰ ਵਿੱਚ ਉਪਲਬਧ ਹੈ ਅਤੇ ਵਿਦਿਅਕ ਮਾਹੌਲ ਵਿੱਚ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ।'
    dataCollected:
      title: 'ਅਸੀਂ ਕਿਹੜਾ ਡਾਟਾ ਇਕੱਠਾ ਕਰਦੇ ਹਾਂ?'
      text: 'ਅਸੀਂ ਪਲੇਟਫਾਰਮ ਚਲਾਉਣ ਲਈ ਲੋੜੀਂਦਾ ਘੱਟ ਤੋਂ ਘੱਟ ਡਾਟਾ ਇਕੱਠਾ ਕਰਦੇ ਹਾਂ: ਵਰਤੋਂਕਾਰ ਨਾਮ, ਈ-ਮੇਲ ਪਤਾ, ਜਨਮ ਮਿਤੀ, ਅਤੇ ਤੇਰੇ ਬੱਚੇ ਵੱਲੋਂ ਬਣਾਏ ਅਤੇ ਅੱਪਲੋਡ ਕੀਤੇ ਪ੍ਰੋਜੈਕਟ। 14 ਸਾਲ ਤੋਂ ਘੱਟ ਉਮਰ ਦੇ ਵਰਤੋਂਕਾਰਾਂ ਲਈ, ਅਸੀਂ ਸਹਿਮਤੀ ਲਈ ਮਾਪੇ/ਸਰਪ੍ਰਸਤ ਦਾ ਈ-ਮੇਲ ਪਤਾ ਵੀ ਰੱਖਦੇ ਹਾਂ। ਅਸੀਂ ਨਿੱਜੀ ਡਾਟਾ ਨਾ ਵੇਚਦੇ ਹਾਂ ਅਤੇ ਨਾ ਹੀ ਕਿਸੇ ਤੀਜੀ ਧਿਰ ਨਾਲ ਸਾਂਝਾ ਕਰਦੇ ਹਾਂ।'
    yourRights:
      title: 'ਮਾਪੇ ਜਾਂ ਸਰਪ੍ਰਸਤ ਵਜੋਂ ਤੇਰੇ ਅਧਿਕਾਰ'
      text: 'EU ਬਾਲ ਸੁਰੱਖਿਆ ਨਿਯਮਾਂ (GDPR) ਅਤੇ COPPA ਅਧੀਨ, ਤੈਨੂੰ ਇਹ ਅਧਿਕਾਰ ਹੈ: ਤੇਰੇ ਬੱਚੇ ਬਾਰੇ ਸਾਡੇ ਕੋਲ ਮੌਜੂਦ ਡਾਟਾ ਦੇਖਣਾ, ਉਸ ਡਾਟਾ ਦੀ ਕਾਪੀ ਮੰਗਣਾ, ਕਿਸੇ ਵੀ ਵੇਲੇ ਆਪਣੀ ਸਹਿਮਤੀ ਵਾਪਸ ਲੈਣਾ (ਜਿਸ ਨਾਲ ਖਾਤਾ ਸੀਮਿਤ ਹੋ ਜਾਂਦਾ ਹੈ), ਅਤੇ ਆਪਣੇ ਬੱਚੇ ਦੇ ਖਾਤੇ ਅਤੇ ਸਾਰੇ ਸੰਬੰਧਿਤ ਡਾਟਾ ਨੂੰ ਹਮੇਸ਼ਾ ਲਈ ਮਿਟਾਉਣ ਦੀ ਬੇਨਤੀ ਕਰਨਾ।'
    minorRestrictions:
      title: 'ਨਾਬਾਲਗ ਖਾਤਿਆਂ ''ਤੇ ਕਿਹੜੀਆਂ ਪਾਬੰਦੀਆਂ ਲਾਗੂ ਹੁੰਦੀਆਂ ਹਨ?'
      text: '16 ਸਾਲ ਤੋਂ ਘੱਟ ਉਮਰ ਦੇ ਵਰਤੋਂਕਾਰ ਟਿੱਪਣੀਆਂ ਨਾ ਲਿਖ ਸਕਦੇ ਹਨ ਨਾ ਪੜ੍ਹ ਸਕਦੇ ਹਨ, ਦੂਜੇ ਵਰਤੋਂਕਾਰਾਂ ਨੂੰ ਫਾਲੋ ਨਹੀਂ ਕਰ ਸਕਦੇ, ਅਤੇ ਬੱਚਿਆਂ ਲਈ ਅਣਉਚਿਤ ਵਜੋਂ ਨਿਸ਼ਾਨਬੱਧ ਸਮੱਗਰੀ ਨਹੀਂ ਦੇਖ ਸਕਦੇ। ਉਹ ਫਿਰ ਵੀ ਪ੍ਰੋਜੈਕਟ ਬਣਾ ਅਤੇ ਅੱਪਲੋਡ ਕਰ ਸਕਦੇ ਹਨ, ਜਨਤਕ ਪ੍ਰੋਜੈਕਟ ਦੇਖ ਸਕਦੇ ਹਨ, ਅਤੇ ਪ੍ਰੋਜੈਕਟਾਂ ਨੂੰ ਲਾਈਕ ਕਰ ਸਕਦੇ ਹਨ। ਇਹ ਪਾਬੰਦੀਆਂ ਸਿੱਖਣ ਦਾ ਸੁਰੱਖਿਅਤ ਮਾਹੌਲ ਦੇਣ ਲਈ ਹਨ।'
    manageButton: 'ਆਪਣੇ ਬੱਚੇ ਦਾ ਖਾਤਾ ਸੰਭਾਲ'
