  info:
    title: 'اطلاعات برای والدین و سرپرستان'
    intro: 'Catrobat ایمنی و حریم خصوصی کاربران جوان را جدی می‌گیرد. این صفحه توضیح می‌دهد که چطور از فرزندت محافظت می‌کنیم و چه حقوقی داری.'
    whatIsCatrobat:
      title: 'Catrobat چیست؟'
      text: 'Catrobat یک پلتفرم آموزشی رایگان و غیرانتفاعی است که در آن جوانان با ساختن اپلیکیشن، بازی و انیمیشن‌های خودشان برنامه‌نویسی یاد می‌گیرند. این پلتفرم در سراسر جهان در دسترس است و در محیط‌های آموزشی استفاده می‌شود.'
    dataCollected:
      title: 'چه داده‌هایی جمع‌آوری می‌کنیم؟'
      text: 'ما حداقل داده‌های لازم برای اداره پلتفرم را جمع‌آوری می‌کنیم: نام کاربری، آدرس ایمیل، تاریخ تولد و پروژه‌هایی که فرزندت می‌سازد و بارگذاری می‌کند. برای کاربران زیر ۱۴ سال، آدرس ایمیل والد/سرپرست را هم برای اخذ رضایت ذخیره می‌کنیم. ما داده‌های شخصی را به اشخاص ثالث نمی‌فروشیم و با آن‌ها به اشتراک نمی‌گذاریم.'
    yourRights:
      title: 'حقوق تو به‌عنوان والد یا سرپرست'
      text: 'طبق مقررات حمایت از کودکان اتحادیه اروپا (GDPR) و COPPA، تو حق داری: داده‌هایی را که درباره فرزندت نگه می‌داریم بررسی کنی، یک نسخه از آن داده‌ها را درخواست کنی، هر زمان رضایتت را پس بگیری (که حساب را محدود می‌کند) و حذف دائمی حساب فرزندت و همه داده‌های مرتبط را درخواست کنی.'
    minorRestrictions:
      title: 'چه محدودیت‌هایی برای حساب‌های افراد زیر سن قانونی اعمال می‌شود؟'
      text: 'کاربران زیر ۱۶ سال نمی‌توانند نظر بنویسند یا بخوانند، کاربران دیگر را دنبال کنند یا محتوای علامت‌خورده به‌عنوان نامناسب برای کودکان را ببینند. آن‌ها همچنان می‌توانند پروژه بسازند و بارگذاری کنند، پروژه‌های عمومی را مرور کنند و با لایک به پروژه‌ها واکنش نشان دهند. این محدودیت‌ها برای فراهم کردن یک محیط یادگیری امن وضع شده‌اند.'
