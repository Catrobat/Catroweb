  text: 'با %project_count% پروژه شگفت‌انگیز که تا حالا به اشتراک گذاشته شده، پروژه بعدی می‌تواند مال تو باشد. اپلیکیشن ما را دانلود کن و از همین امروز شروع به ساختن کن'
privacy-policy:
  header: سیاست حفظ حریم خصوصی
  version: نسخه ۲٫۲، ۱۷ اکتبر ۲۰۱۹
  text1: 'برای اینکه همه مزایای خدمات ما و حساب مربوط به آن را در اختیارت بگذاریم، لازم است داده‌های مشخصی از تو جمع‌آوری کنیم.'
  text2: 'برای نگهداری و بهبود خدماتمان (اپلیکیشن‌ها و وب‌سایت‌ها) و انجام پژوهش علمی در زمینه آموزش ICT و STEM/STEAM، از Google Analytics، Crashlytics و Firebase، همه از Google LLC (آمریکا)، و همچنین Dynatrace از Dynatrace LLC (آمریکا) استفاده می‌کنیم تا فراداده‌هایی درباره استفاده از خدماتمان به دست آوریم، مثلاً اطلاعات خرابی، زمان‌ها، صفحه‌ها/نماهای بازدیدشده، استفاده از اپلیکیشن‌ها و خدمات ما، سیستم‌عامل مورد استفاده و اطلاعات ارائه‌دهنده شبکه. این تحلیل و داده‌های جمع‌آوری‌شده به پروفایلت پیوند داده نمی‌شوند و هیچ اطلاعات شخصی ندارند (آخرین بیت‌های آدرس IP ناشناس می‌شوند). با این حال، داده‌های جمع‌آوری‌شده به ارائه‌دهندگان خدمات (Google LLC، آمریکا و Dynatrace LLC، آمریکا) منتقل می‌شوند. پردازش داده‌ها بر اساس توافق‌نامه با Google LLC و Dynatrace LLC انجام می‌شود. این رابطه با ارائه‌دهندگان خدمات با مقررات عمومی حفاظت از داده‌های اتحادیه اروپا (EU GDPR) و توافق‌نامه «سپر حریم خصوصی» اتحادیه اروپا و آمریکا مطابقت دارد.'
  text3: 'برای ساختن و استفاده از حساب در سیستم‌های ما و برای اینکه درباره تغییرات لازم در حسابت از طریق ایمیل به تو خبر بدهیم، مثلاً به‌روزرسانی‌ها یا نقض شرایط استفاده و خدمات، قوانین جامعه یا سیاست‌های ما، نام کاربری‌ات و، اگر وارد کرده باشی، آدرس ایمیلت را ذخیره می‌کنیم. اگر حسابت را از طریق Google Plus یا Facebook متصل کرده‌ای، یک کلید شناسایی مرتبط با حسابت در این سرویس‌ها را هم ذخیره می‌کنیم. از این داده‌ها برای هیچ هدف دیگری (مثلاً بازاریابی) استفاده نمی‌کنیم، مگر اینکه صریحاً به ما اجازه داده باشی.'
  text4: 'به‌صورت داوطلبانه می‌توانی کشور محل زندگی‌ات را از طریق صفحه حسابت در سایت اشتراک‌گذاری به ما بدهی. این در پروفایل عمومی‌ات نمایش داده می‌شود و فقط برای اهداف آماری و پژوهشی توسط ما استفاده می‌شود. هر زمان می‌توانی آن را در تنظیمات پروفایلت حذف کنی.'
  text5: 'هر زمان می‌توانی با حذف حسابت از طریق صفحه پروفایلت در https://share.catrob.at/ اجازه استفاده از داده‌های شخصی مربوط به حسابت را پس بگیری. پس از حذف حسابت همچنان می‌توانی از خدمات ارائه‌شده استفاده کنی، اما نمی‌توانی همکاری کنی، مثلاً با بارگذاری برنامه، نظر دادن یا لایک کردن. همچنین همه محتوای مرتبط با حسابت، مثلاً برنامه‌های بارگذاری‌شده، نظرها و غیره، حذف می‌شوند.'
  text6: برای اجتناب از سوء استفاده از خدمات ما، به عنوان مثال، از طریق کاربر آپلود یا نظرات غیرقانونی، تمام داده های عمومی تولید شده (آپلود ها، نظرات) به صورت داخلی در یک پایگاه داده ذخیره می شود، همراه با یک نوار تایپ و آدرس اینترنت استفاده می شود. این داده ها به هیچ وجه به هیچ وجه مورد استفاده قرار نمی گیرند، مگر اینکه اقدامات غیرقانونی غیرقانونی به طور منطقی مظنون باشند و به طور رسمی موسسات حقوقی را بر اساس قانون قابل اجرا درخواست کنند. هر قضیه به طور کامل بر اساس یک فرد اول توسط ما بررسی خواهد شد.
  text7: 'می‌توانی به‌صورت داوطلبانه در خبرنامه Catrobat در https://catrob.at/newsletter مشترک شوی که ما از طریق سرویس MailChimp (The Rocket Science Group LLC d/b/a MailChimp، آمریکا) ارائه می‌دهیم. پس از آن، خبرهای پروژه Catrobat و خدماتش را در آدرس ایمیلی که وارد کرده‌ای دریافت می‌کنی. هر زمان می‌توانی با استفاده از لینک «لغو اشتراک» در پایین هر خبرنامه اشتراکت را لغو کنی. این خبرنامه توسط MailChimp ارائه می‌شود که با آن توافق‌نامه پردازش داده داریم و به مقررات عمومی حفاظت از داده‌های اتحادیه اروپا و «سپر حریم خصوصی» اتحادیه اروپا و آمریکا متعهد است. برای جزئیات بیشتر درباره MailChimp، سیاست حریم خصوصی و شرایط استفاده MailChimp را هم ببین.'
  text8: 'همه خدمات توسط پروژه آزاد و متن‌باز Catrobat زیر چتر انجمن بین‌المللی Catrobat – Verein zur Förderung freier Software، یک سازمان غیردولتی غیرانتفاعی ثبت‌شده در گراتس، اتریش (اتحادیه اروپا) ارائه می‌شوند. سیاست‌های ما به قوانین حفاظت از داده اتحادیه اروپا و اتریش (GDPR) احترام می‌گذارند. برای تماس با ما، لطفاً به contact@catrobat.org ایمیل بزن یا نامه‌ات را به این آدرس بفرست: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz، اتریش (اتحادیه اروپا).'
  text9: 'اگر کمتر از ۱۴ سال داری، این سیاست باید توسط یک سرپرست قانونی (معمولاً پدر یا مادر) پذیرفته شود.'
  text10: سیاست حفظ حریم خصوصی زبان انگلیسی Catrobat در وب زیر %privacy_policy% در دسترس است.
  disagree-text: بدون تایید، ما نمی توانیم یک حساب کاربری ایجاد کنیم، اما ویژگی های اصلی هنوز قابل دسترسی هستند.
