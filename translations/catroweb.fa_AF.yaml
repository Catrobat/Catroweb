licenseToPlay:
  link: 'مجوز بازی'
  title: 'مجوز بازی - اعتبار بده و به مشارکت بزار'
  text1: 'تصور کن هر پروژه Catrobat یک کیک است، یک کیک خیلی خاص که همراه دستور پختش (بلوک‌های برنامه‌نویسی) می‌آید. همه اعضای جامعه Catrobat کیک‌هایشان را همراه دستور پختشان به اشتراک می‌گذارند. یعنی تو می‌توانی از کیک‌ها لذت ببری و یاد بگیری چطور خودت آن‌ها را بپزی!'
  text2: 'هیچ دستور پخت پنهانی وجود نداره: دستورالعمل چگونگی پخت این کیک ها برای استفاده،استفاده مجدد،تصحیح و سرو کردن بعنوان الهام ایده های جدید... یعنی کیک ها برای همه باز است.'
  text3: "تو میتونی کیک ها رو بخوری همانطوری که میتونی دستور پخت دیگران رو شاید با مواد اولیه دیگری برای پخت کیک خودت کپی کنی. این آزادی دوتا شرط ساده داره:"
  text4: "در راه اندازی انجمن کت ربات از آنجایی که معتقدیم این روش یادگیری و خلاقیت را در درون انجمن پشتیبانی می کند، ما تصمیم گرفتیم آن را به کار ببریم. با مشارکت دستورهای پخت و مواد لازم (اثر هنری و اسکریپت)، همه اشخاص میتونن کیک هایشان را بر اساس عقاید دیگران درست کنند و این به سود همه است."
  text5: 'در طراحی وب‌سایت Catrobat، قابلیت‌هایی گذاشتیم تا مردم را به اشتراک‌گذاری و قدردانی از دیگران تشویق کنیم. در صفحه هر پروژه همیشه می‌توانی اسکریپت‌های اصلی آن پروژه را دانلود کنی. اگر پروژه‌ای را ریمیکس می‌کنی (اسکریپت‌ها یا آثار هنری را تغییر می‌دهی و نتیجه را به اشتراک می‌گذاری)، تشویقت می‌کنیم که در یادداشت‌های پروژه از افراد و پروژه‌ای که الهام‌بخشت بوده‌اند نام ببری و قدردانی کنی.'
  text6: 'در مورد شرایط استفاده از انجمن آنلاین "کت ربات" در %link-termsOfUse% بیشتر یاد بگیر.'
  list1:
    item1: کیک هایت را همراه با دستورپخت آنها به اشتراک بگذار
    item2: دادن اعتبار به کسانی که الهامبخش تو بوده اند
  version: نسخهٔ 1.1 2 آوریل 2013
termsOfUse:
  title: شرایط استفاده
  headline: 'به جامعه Catrobat خوش آمدی!'
  text1: 'به‌عنوان بخشی از جامعه Catrobat، تو پروژه‌ها و ایده‌هایت را با دیگران به اشتراک می‌گذاری:'
  text2: "ما به کمکت نیازمندیم تا این انجمن را به یک مکان قابل پشتیبانی برای هر عضو ایجاد کنیم. این که چجوری به ما کمک کنی اینجاست:"
  text3: 'از طریق پروژه Catrobat می‌خواهیم همکاری را تقویت کنیم و بگذاریم خلاقیت همه برای سود همه بشریت کنار هم قرار بگیرد. تو هم می‌توانی با هدیه دادن پروژه‌هایت به جامعه، عضو فعال جامعه Catrobat شوی، همان‌طور که اعضای فعال دیگر پروژه‌هایشان را به تو هدیه می‌دهند:'
  text4: 'هدیه ما به تو:'
  text5: 'شرایط استفاده و خدمات:'
  list1:
    item1: از بسیاری از کشورها و فرهنگ های مختلف
    item2: همه سنین (از کودکان و نوجوانان تا پدربزرگ ها و مادربزرگ ها)
    item3: با تمام سطوح تجربی
  list2:
    item1: 'با احترام رفتار کن. هنگام به اشتراک گذاشتن پروژه‌ها یادت باشد که آدم‌های زیادی از سنین و پیشینه‌های مختلف کارهایت را می‌بینند.'
    item2: "Give credit. Feel free to make modified versions of other people's projects - just make sure to give them credit. One place to give credit is in your project's credits section. Please see the paragraph below this dotted list for details about modifying projects of other users."
    item3: "صادق باش. خودت را جای کس دیگری جا نزن یا سعی نکن که انجمن را فریب بدهی."
    item4: "اطلاعات شخصی ات را محرمانه نگه دار. آدرس ایمیل، شماره تیلفون یا دیگر اطلاعات شخصی ات را به اشتراک نگذار."
    item5: 'کمک کن سایت دوستانه بماند. اگر فکر می‌کنی دیگران یک پروژه یا نظر را بدجنسانه، توهین‌آمیز، بیش از حد خشن یا به هر شکل دیگری نامناسب می‌دانند، فقط روی دکمه «گزارش به‌عنوان نامناسب» کلیک کن و یک توضیح کوتاه بنویس. تیم Catrobat گزارشت را بررسی می‌کند و ممکن است هر پروژه، نظر یا پستی را حذف کند.'
  list3:
    item1: 'با بارگذاری یک پروژه در وب‌سایت‌های ما، می‌پذیری و موافقت می‌کنی که این اثر تحت مجوزهای آزاد خاص پروژه‌های بارگذاری‌شده Catrobat قرار بگیرد. مشابه مجوزهای آزادی که خود سیستم Catrobat تحت آن‌ها در اختیار تو است، این مجوزهای آزاد به همه این حق را می‌دهند که از آثاری که دیگران قبلاً بارگذاری کرده‌اند یاد بگیرند و آن‌ها را تغییر دهند و ریمیکس کنند تا بازی‌ها، انیمیشن‌ها و پروژه‌های جذاب جدید خودشان را بسازند. این کار به همه اجازه می‌دهد «روی شانه‌های همتایان خود بایستند»، که یکی از آن‌ها تو هستی! به این ترتیب کار تو به سود همه جهان خواهد بود و برای استفاده همه آزاد می‌ماند، کمی شبیه متن‌ها و تصاویری که داوطلبان از سراسر جهان آزادانه به ویکی‌پدیا اهدا می‌کنند. آن را هدیه خودت به بشریت بدان: تو به همه می‌دهی و همه کسانی که کارشان را در وب‌سایت‌های ما بارگذاری می‌کنند به تو می‌دهند. پس یک پروژه بارگذاری‌شده هدیه‌ای بسیار ارزشمند است که صاحبش آن را رایگان به تو می‌دهد، به این شرط که تو هم با همین شرایط در جامعه مشارکت کنی.'
    item2: 'لازم نیست این هدیه را بپذیری؛ اگر بپذیری، قوانین خاصی اعمال می‌شود. فایده این قوانین این است که می‌توانی از آن اثر یاد بگیری و بر پایه‌اش چیزهای جالب‌تری بسازی و بعد، مثلاً، دوباره آن را به‌عنوان کار خودت در وب‌سایت‌های ما بارگذاری کنی. فایده دیگر این است که این مجوزها تضمین می‌کنند که تو مسئول مشکلاتی نیستی که برای دیگران از استفاده از پروژه‌ات پیش می‌آید.'
    item3: "یک شرط مهم دیگر این است که تو به نویسندگانی که روی برنامشون کار کردی اعتبار میدی. همزمان ما به وضوح روی برنامه تو کار می کنیم تا توسط دیگران شناخته شود با اسم خاصی که خودت به صورت آزادانه برای معرفی در انجمن \"کت ربات\" معرفی می کنی و با دادن فرصت به دیگران برای اظهار لطف به تو به صورت عمومی به خاطر در اختیار گذاشتن کارت برای همه."
    item4: 'لطفا %link-licenseUploaded% برای شرایط و ضوابط قانونی خاص مشاوره کن.'
  list4:
    item1: 'ما همه نرم‌افزارها و منابع اینترنتی خودمان مرتبط با سیستم Catrobat را، مثلاً نرم‌افزارهایی که تیم Catrobat نوشته، وب‌سایت‌ها و منابع اینترنتی ما، کد منبع خودمان مرتبط با سیستم Catrobat و همه مواد اضافی همراه مثل تصاویر، صداها و متن‌ها را، اکنون و در آینده، تحت مجوزهای آزاد Catrobat در اختیار تو می‌گذاریم.'
    item2: این مجوزها همه ی قسمت های کت ربات را رایگان می کند و تو نه تنها هزینه ای نمی پردازی بلکه این آزادی را به تو می دهد که از آن هر طور که می خواهی استفاده کنی با محدودیت های کمی که تضمین می کند سیستم کت ربات برای همیشه رایگان و مفید در دسترس همه باشد.
    item3: 'لطفا مشاوره کن %link-licenseToPlay% برای شرایط و ضوابط قانونی خاص. کد منبع سیستم کت ربات مانند خیلی از مدارک و منابع دیگر از طریق لینک %link-developer% قابل دسترسی است.'
  list5:
    item1: 'اگر تو زیر سیزده سال هستی، والدین ویا قیمان قانونی تو با سازمان هایی که به حریم خصوصی تعرض می کنند در ارتباطند،و نظارت فشرده دارند، در این صورت تو اجازه استفاده از اپلیکیشن های نرم افزاری و دسترسی به سرویس های ما رو نداری. جزئیات دقیقتر این شرط و استثنائات خاص آن در قسمت های 4.الف و 4.ب روی %link-termsOfUse% مشخص شده.'
    item2: اگر کمتر از سیزده سال سن داری، باید از والدین و یا قیمین قانونیت اجازه بگیری که از اپلیکیشن ها و سرویس های نرم افزار "کت ربات" استفاده کنی.
    item3: "ما حقوق را برای رد کردن، حذف، یا پنهان کردن پروژه ها، حساب های کاربر، و هر گونه مواد دیجیتال به وب سایت های Catrobat در هر زمان که در اختیار ما قرار می دهیم حقوق افراد دیگر."
    item4: "همه ی نرم افزار کت ربات و منابع اینترنتی با امید به مفید بودن اما بدون هیچ تضمینی ارائه می شود."
    item5: 'لطفاً برای عبارت‌بندی دقیق نکات بالا و برخی شرایط و ضوابط حقوقی دیگر، %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service ما را ببین.'
  bottom1: مرتب اینجا را چک کن، چون ما همیشه در حال ارتقا ضوابط استفاده هستیم.
  bottom2: 'لطفا پیشنهاداتت رو در مورد ضوابط استفاده به %email-webmaster% ایمیل کن.'
  version: نسخهٔ ۱.۳، ۴ مارس ۲۰۱۴
