licenseToPlay:
  link: 'Giấy phép để chơi'
  title: 'Giấy phép để chơi - cung cấp bản quyền và chia sẻ'
  text1: 'Hãy tưởng tượng mỗi dự án Catrobat là một chiếc bánh, một chiếc bánh rất đặc biệt đi kèm công thức của nó (các khối lập trình). Mọi thành viên trong cộng đồng Catrobat đều chia sẻ bánh của mình cùng với công thức. Nghĩa là bạn vừa được thưởng thức bánh, vừa học được cách tự làm chúng!'
  text2: 'Không có bất kỳ công thức nấu ăn bí mật nào: hướng dẫn để làm các loại bánh được mở cho bất cứ ai sử dụng, tái sử dụng, sửa đổi, và phục vụ như là nguồn cảm hứng cho những ý tưởng mới... Ý tôi là bánh.'
  text3: "Bạn có thể ăn các loại bánh, cũng như sao chép công thức nấu ăn của người khác để làm một chiếc cho riêng bạn, có lẽ với các thành phần khác. Sự tự do này đi kèm với hai yêu cầu đơn giản:"
  text4: "Trong việc thiết lập cộng đồng Catrobat, chúng tôi đã quyết định áp dụng phương pháp này kể từ khi chúng tôi tin rằng nó sẽ hỗ trợ quá trình học tập và sáng tạo trong cộng đồng. Bằng cách chia sẻ công thức nấu ăn và các nguyên liệu (tập lệnh và hình ảnh), người sử dụng có thể xây dựng dựa trên ý tưởng của nhau và tất cả mọi người sẽ được hưởng lợi."
  text5: 'Khi thiết kế trang web Catrobat, chúng mình đã thêm các tính năng khuyến khích mọi người chia sẻ và ghi công cho người khác. Trên mỗi trang dự án, bạn luôn có thể tải về các kịch bản gốc của dự án. Nếu bạn remix một dự án (sửa kịch bản hoặc hình ảnh rồi chia sẻ kết quả), chúng mình khuyến khích bạn ghi công trong phần ghi chú của dự án, nhắc đến những người và dự án đã truyền cảm hứng cho bạn.'
  text6: 'Tìm hiểu thêm về các điều khoản sử dụng của cộng đồng trực tuyến Catrobat trên %link-termsOfUse%.'
  list1:
    item1: chia sẻ chiếc bánh của bạn cùng với công thức
    item2: cung cấp bản quyền cho những người đã truyền cảm hứng cho bạn
  version: Phiên bản 1.1, ngày 2 tháng 4 năm 2013
termsOfUse:
  title: Điều khoản sử dụng
  headline: Chào mừng đến với cộng đồng Catrobat!
  text1: 'Là một phần của cộng đồng Catrobat, bạn đang chia sẻ dự án và ý tưởng với mọi người:'
  text2: "Chúng tôi cần sự giúp đỡ của bạn để làm cho cộng đồng này thành một nơi hỗ trợ cho mọi thành viên. Dưới đây là cách bạn có thể giúp:"
  text3: 'Thông qua dự án Catrobat, chúng mình muốn thúc đẩy sự hợp tác và để sức sáng tạo của mọi người kết hợp lại vì lợi ích của toàn nhân loại. Bạn cũng có thể trở thành thành viên tích cực của cộng đồng Catrobat bằng cách tặng lại dự án của mình cho cộng đồng như một món quà, giống như các thành viên tích cực khác đang tặng dự án của họ cho bạn:'
  text4: 'Món quà của chúng tôi cho bạn:'
  text5: 'Điều khoản sử dụng và dịch vụ của chúng tôi:'
  list1:
    item1: từ nhiều quốc gia và các nền văn hóa khác nhau
    item2: ở mọi lứa tuổi (từ trẻ em đến thiếu niên và người cao tuổi)
    item3: với tất cả các cấp kinh nghiệm
  list2:
    item1: 'Hãy tôn trọng người khác. Khi chia sẻ dự án, hãy nhớ rằng những người ở nhiều độ tuổi và hoàn cảnh khác nhau sẽ xem đóng góp của bạn.'
    item2: 'Hãy ghi công. Bạn cứ thoải mái tạo phiên bản chỉnh sửa từ dự án của người khác - chỉ cần nhớ ghi công cho họ. Một nơi để ghi công là phần ghi chú và ghi công của dự án. Hãy xem đoạn văn bên dưới danh sách này để biết chi tiết về việc chỉnh sửa dự án của người dùng khác.'
    item3: "Hãy trung thực. Đừng giả vờ là bất cứ ai ngoài chính bạn hoặc cố gắng để lừa dối cộng đồng."
    item4: "Giữ thông tin cá nhân riêng tư. Đừng chia sẻ địa chỉ email, số điện thoại hoặc thông tin liên lạc cá nhân khác."
    item5: "Hãy giúp giữ cho trang web thân thiện. Nếu bạn thấy một dự án hoặc bình luận có thể gây tổn thương, xúc phạm, quá bạo lực hoặc không phù hợp theo cách nào đó, chỉ cần nhấn nút 'báo cáo là không phù hợp' và để lại lời giải thích ngắn. Đội ngũ Catrobat sẽ xem xét báo cáo của bạn và có thể xóa bất kỳ dự án, bình luận hoặc bài đăng nào."
  list3:
    item1: "Khi tải một dự án lên các trang web của chúng mình, bạn chấp nhận và đồng ý đặt tác phẩm này dưới một số giấy phép tự do dành cho các dự án Catrobat được tải lên. Tương tự như các giấy phép tự do mà nhờ đó bạn được dùng chính hệ thống Catrobat, các giấy phép tự do này cho mọi người quyền học hỏi từ những tác phẩm người khác đã tải lên trước đó, đồng thời chỉnh sửa và remix chúng để tạo ra những trò chơi, hoạt hình và dự án mới thú vị của riêng mình. Điều này cho phép mọi người 'đứng trên vai những người bạn đồng hành', và một trong số đó chính là bạn! Nhờ vậy tác phẩm của bạn sẽ mang lại lợi ích cho cả thế giới và luôn miễn phí cho mọi người sử dụng, phần nào giống như các văn bản và hình ảnh được tình nguyện viên khắp thế giới đóng góp miễn phí cho Wikipedia. Hãy xem đó là món quà của bạn dành cho nhân loại: bạn tặng cho mọi người, và tất cả những người khác tải tác phẩm của họ lên trang web của chúng mình cũng tặng cho bạn. Vì vậy, một dự án được tải lên là một món quà rất giá trị mà chủ sở hữu tặng miễn phí cho bạn, với điều kiện bạn tham gia cộng đồng theo cùng các điều khoản đó."
    item2: 'Bạn không bắt buộc phải nhận món quà; nếu nhận, một số quy tắc sẽ được áp dụng. Lợi ích của các quy tắc này là bạn có thể học hỏi từ tác phẩm và phát triển tiếp để tự làm ra những thứ còn tuyệt hơn, ví dụ như sau đó bạn có thể tải chúng lên trang web của chúng mình như tác phẩm của bạn. Một lợi ích khác là các giấy phép này đảm bảo bạn không phải chịu trách nhiệm về bất kỳ vấn đề nào phát sinh với người khác khi họ sử dụng dự án của bạn.'
    item3: "Một trong những điều kiện quan trọng bổ sung là bạn rõ ràng đã đóng góp tới những tác giả, người đã làm việc dựa trên tác phẩm của riêng bạn. Cùng lúc đó, chúng tôi sẽ làm việc chăm chỉ để những công việc, đóng góp của bạn sẽ được trân trọng bởi những người dùng khác, bằng cách tự do lựa chọn cho mình một cái tên độc nhất sẽ đại diện cho bạn trong cộng đồng của Catrobat, và bằng cách cho những người khác cơ hội để thể hiện lòng biết ơn của họ tới bạn một cách công khai khi mà bạn cống hiến công việc của bạn để tất cả mọi người, và đặc biệt cho họ."
    item4: 'Xin vui lòng tham khảo ý kiến %link-licenseUploaded% cho các điều kiện và điều khoản pháp lý.'
  list4:
    item1: "Chúng tôi cung cấp tất cả các phần mềm và tài nguyên Internet liên quan đến hệ thống Catrobat, ví dụ như, phần mềm được viết bởi đội ngũ Catrobat, trang web và tài nguyên Internet của chúng tôi, mã nguồn của riêng của chúng tôi liên quan đến hệ thống Catrobat, và bao gồm tất cả các tài nguyên khác chẳng hạn, ví dụ như, hình ảnh, âm thanh và văn bản cho bạn, bây giờ và trong tương lai dưới bản quyền miễn phí của Catrobat."
    item2: Các bản quyền này làm cho tất cả các phần của Catrobat miễn phí cho bạn cũng như miễn phí đem lại cho bạn sự tự do để sử dụng chúng theo cách bạn muốn giữa những người sử dụng khác, với chỉ một vài hạn chế để đảm bảo, rằng hệ thống Catrobat sẽ mãi mãi duy trì miễn phí và hữu ích cho tất cả mọi người.
    item3: 'Xin vui lòng tham khảo ý kiến %link-licenseToPlay% cho điều kiện và điều khoản pháp lý. Mã nguồn của hệ thống Catrobat cũng như nhiều tài liệu khác và tài nguyên có sẵn thông qua %link-developer%.'
  list5:
    item1: 'Nếu bạn dưới 13 tuổi, hoặc cha mẹ bạn hoặc người giám hộ hợp pháp của bạn, hợp tác với một tổ chức nào đó tham gia vào hoặc chịu trách nhiệm cho các loại hành vi vi phạm bảo mật và/hoặc đang bị giám sát, thì bạn không được phép sử dụng các ứng dụng phần mềm và truy cập vào dịch vụ của chúng tôi. Các chi tiết chính xác của hạn chế này và các ngoại lệ nhất định được phân chia trong phần 4.a và 4.b trên %link-termsOfUse% của chúng tôi.'
    item2: Nếu bạn là dưới 13 tuổi, sau đó bạn cần phải hỏi cha mẹ hoặc người giám hộ hợp pháp của bạn xem họ có cho phép bạn sử dụng phần mềm và dịch vụ của Catrobat hay không.
    item3: 'Chúng mình có quyền từ chối, xóa hoặc ẩn dự án, tài khoản người dùng và mọi tài liệu kỹ thuật số được tải lên các trang web của Catrobat vào bất cứ lúc nào theo quyết định riêng của chúng mình, ví dụ khi phát hiện một dự án chứa nội dung không phù hợp hoặc một người dùng xâm phạm quyền của người khác.'
    item4: "Tất cả các phần mềm của Catrobat và tài nguyên Internet được cung cấp với hy vọng rằng chúng sẽ hữu ích, nhưng không có bất kỳ bảo đảm."
    item5: 'Xin vui lòng tham khảo ý kiến của chúng tôi developer.catrobat.org/terms_of_use_and_service %link-termsOfUse% về các qui định chính xác cho các điểm trên cũng như một số các điều khoản và điều kiện bổ sung hợp pháp.'
  bottom1: Hãy ghé thăm lại tại mọi thời điểm, vì chúng tôi luôn luôn cố gắng hoàn thiện điều khoản sử dụng của mình.
  bottom2: 'Vui lòng gửi bất cứ gợi ý nào về điều khoản sự dụng tới %email-webmaster%.'
