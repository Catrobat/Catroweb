privacy-policy:
  header: 'Chính sách quyền riêng tư'
  version: 'Phiên bản 2.2, ngày 17 tháng 10 năm 2019'
  text1: 'Để mang đến cho bạn mọi lợi ích từ dịch vụ của chúng mình và tài khoản đi kèm, chúng mình cần thu thập một số dữ liệu của bạn.'
  text2: 'Để duy trì và cải thiện dịch vụ (ứng dụng và trang web) cũng như nghiên cứu khoa học về giáo dục ICT và STEM/STEAM, chúng mình sử dụng Google Analytics, Crashlytics và Firebase, đều của Google LLC (Mỹ), cùng Dynatrace của Dynatrace LLC (Mỹ) để thu thập siêu dữ liệu về việc sử dụng dịch vụ, ví dụ thông tin sự cố, dấu thời gian, các trang/màn hình đã truy cập, cách sử dụng ứng dụng và dịch vụ, hệ điều hành đang dùng và thông tin về nhà cung cấp mạng. Việc phân tích này và dữ liệu thu thập được không liên kết với hồ sơ của bạn và không chứa thông tin cá nhân nào (các bit cuối của địa chỉ IP được ẩn danh). Tuy nhiên, dữ liệu thu thập được sẽ được chuyển cho các nhà cung cấp dịch vụ (Google LLC, Mỹ và Dynatrace LLC, Mỹ). Việc xử lý dữ liệu dựa trên thỏa thuận với Google LLC và Dynatrace LLC. Mối quan hệ với các nhà cung cấp dịch vụ này tuân thủ Quy định chung về bảo vệ dữ liệu của Liên minh châu Âu (EU GDPR) và thỏa thuận "Privacy Shield" giữa EU và Mỹ.'
  text3: 'Để tạo và sử dụng tài khoản trong hệ thống của chúng mình, cũng như thông báo cho bạn qua email về những thay đổi cần thiết liên quan đến tài khoản, ví dụ cập nhật hoặc vi phạm Điều khoản sử dụng và dịch vụ, quy tắc cộng đồng hay chính sách của chúng mình, chúng mình sẽ lưu tên đăng nhập và, nếu bạn cung cấp, địa chỉ email của bạn. Nếu bạn đã kết nối tài khoản qua Google Plus hoặc Facebook, chúng mình còn lưu thêm một mã định danh gắn với tài khoản của bạn trên các dịch vụ đó. Chúng mình sẽ không dùng dữ liệu này cho bất kỳ mục đích nào khác (ví dụ tiếp thị), trừ khi bạn cho phép rõ ràng.'
  text4: 'Trên cơ sở tự nguyện, bạn có thể cho chúng mình biết quốc gia bạn đang sống qua trang tài khoản trên trang chia sẻ. Thông tin này sẽ hiển thị trên hồ sơ công khai của bạn và chỉ được chúng mình dùng cho mục đích thống kê và nghiên cứu. Bạn có thể xóa nó bất cứ lúc nào trong cài đặt hồ sơ.'
  text5: 'Bạn có thể rút lại việc sử dụng dữ liệu cá nhân thuộc tài khoản của mình bất cứ lúc nào bằng cách xóa tài khoản qua trang hồ sơ trên https://share.catrob.at/. Sau khi xóa tài khoản, bạn vẫn có thể dùng các dịch vụ được cung cấp nhưng không thể cộng tác, ví dụ như tải lên chương trình, bình luận hay bày tỏ cảm xúc. Ngoài ra, mọi nội dung liên kết với tài khoản của bạn, ví dụ chương trình đã tải lên, bình luận, v.v., cũng sẽ bị xóa.'
  text6: 'Để tránh việc lạm dụng dịch vụ, ví dụ qua các nội dung tải lên hoặc bình luận của người dùng nhằm mục đích bất hợp pháp, mọi dữ liệu công khai do người dùng tạo ra (nội dung tải lên, bình luận) sẽ được lưu nội bộ trong cơ sở dữ liệu, kèm dấu thời gian và địa chỉ internet đã dùng. Dữ liệu này sẽ không được bất kỳ tổ chức nào sử dụng hoặc chuyển cho bất kỳ tổ chức nào, trừ khi có nghi ngờ hợp lý về hành vi bất hợp pháp đủ nghiêm trọng và các cơ quan pháp luật có thẩm quyền chính thức yêu cầu dựa trên luật hiện hành. Mỗi trường hợp sẽ được chúng mình kiểm tra kỹ lưỡng trước, trên cơ sở từng trường hợp riêng.'
  text7: 'Bạn có thể tự nguyện đăng ký nhận Bản tin Catrobat tại https://catrob.at/newsletter, do chúng mình cung cấp qua dịch vụ MailChimp (The Rocket Science Group LLC d/b/a MailChimp, Mỹ). Khi đó bạn sẽ nhận được thông tin cập nhật về dự án Catrobat và các dịch vụ của nó qua địa chỉ email bạn đã cung cấp. Bạn có thể hủy đăng ký bản tin bất cứ lúc nào bằng liên kết "unsubscribe" ở cuối mỗi bản tin. Bản tin này được cung cấp bởi MailChimp, bên đã ký thỏa thuận xử lý dữ liệu với chúng mình và cam kết tuân thủ Quy định chung về bảo vệ dữ liệu của EU cũng như "Privacy Shield" giữa EU và Mỹ. Để biết thêm chi tiết về MailChimp, bạn cũng có thể xem Chính sách quyền riêng tư và Điều khoản sử dụng của MailChimp.'
  text8: 'Mọi dịch vụ đều được cung cấp bởi dự án mã nguồn mở miễn phí Catrobat, trực thuộc International Catrobat Association – Verein zur Förderung freier Software, một tổ chức phi chính phủ phi lợi nhuận được thành lập tại Graz, Áo (Liên minh châu Âu). Các chính sách của chúng mình tôn trọng luật bảo vệ dữ liệu của EU và Áo (GDPR). Để liên hệ với chúng mình, hãy gửi email đến contact@catrobat.org hoặc gửi thư đến Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'Nếu bạn dưới 14 tuổi, chính sách này phải được người giám hộ hợp pháp (thường là cha mẹ) chấp nhận.'
  text10: 'Chính sách quyền riêng tư chính thức bằng tiếng Anh của Catrobat có trên web tại %privacy_policy%.'
  disagree-text: 'Nếu không có sự đồng ý, chúng mình không thể tạo tài khoản, nhưng bạn vẫn có thể dùng các tính năng chính.'
