consent:
  email:
    subject: 'Cần sự đồng ý của phụ huynh cho tài khoản Catrobat của con bạn'
    title: 'Cần sự đồng ý của phụ huynh'
    greeting: 'Xin chào,'
    message: 'Con của bạn, %username%, đã tạo tài khoản trên Catrobat và đã xác minh địa chỉ email.'
    explanation: 'Catrobat là nền tảng giáo dục miễn phí, nơi các bạn trẻ học lập trình bằng cách tạo ứng dụng, trò chơi và hoạt hình. Theo quy định bảo vệ trẻ em của EU, chúng mình cần sự đồng ý của bạn trước khi con bạn có thể tham gia đầy đủ vào cộng đồng. Hãy nhấn nút bên dưới để đồng ý.'
    button: 'Đồng ý với tư cách phụ huynh'
    ignore: 'Nếu bạn không mong đợi email này, bạn có thể bỏ qua nó. Nếu không có sự đồng ý, tài khoản sẽ bị giới hạn chức năng.'
    whatIsCatrobat: 'Catrobat là nền tảng lập trình giáo dục miễn phí, phi lợi nhuận. Tìm hiểu thêm tại catrobat.org.'
    manageLink: 'Bạn có thể quản lý tài khoản của con bất cứ lúc nào qua <a href="%portalUrl%" style="color: #00acc1;">Cổng phụ huynh</a>. Tìm hiểu thêm về <a href="%infoUrl%" style="color: #00acc1;">quyền của bạn với tư cách phụ huynh</a>.'
  confirmed:
    title: 'Đã đồng ý'
    message: 'Cảm ơn bạn! Tài khoản của %username% giờ đã được kích hoạt đầy đủ.'
    continueButton: 'Khám phá dự án'
parent:
  footer:
    link: 'Phụ huynh & người giám hộ'
  info:
    title: 'Thông tin dành cho phụ huynh & người giám hộ'
    intro: 'Catrobat rất coi trọng sự an toàn và quyền riêng tư của người dùng nhỏ tuổi. Trang này giải thích cách chúng mình bảo vệ con bạn và bạn có những quyền gì.'
    whatIsCatrobat:
      title: 'Catrobat là gì?'
      text: 'Catrobat là nền tảng giáo dục miễn phí, phi lợi nhuận, nơi các bạn trẻ học lập trình bằng cách tạo ứng dụng, trò chơi và hoạt hình của riêng mình. Nền tảng có mặt trên toàn thế giới và được dùng trong môi trường giáo dục.'
    dataCollected:
      title: 'Chúng mình thu thập dữ liệu gì?'
      text: 'Chúng mình chỉ thu thập lượng dữ liệu tối thiểu cần để vận hành nền tảng: tên đăng nhập, địa chỉ email, ngày sinh và các dự án con bạn tạo và tải lên. Với người dùng dưới 14 tuổi, chúng mình cũng lưu địa chỉ email của phụ huynh/người giám hộ cho mục đích xin đồng ý. Chúng mình không bán hay chia sẻ dữ liệu cá nhân với bên thứ ba.'
    yourRights:
      title: 'Quyền của bạn với tư cách phụ huynh hoặc người giám hộ'
      text: 'Theo quy định bảo vệ trẻ em của EU (GDPR) và COPPA, bạn có quyền: xem dữ liệu chúng mình lưu về con bạn, yêu cầu bản sao dữ liệu đó, rút lại sự đồng ý bất cứ lúc nào (khi đó tài khoản sẽ bị giới hạn) và yêu cầu xóa vĩnh viễn tài khoản của con bạn cùng mọi dữ liệu liên quan.'
    minorRestrictions:
      title: 'Tài khoản của trẻ vị thành niên có những giới hạn nào?'
      text: 'Người dùng dưới 16 tuổi không thể đăng hoặc đọc bình luận, theo dõi người dùng khác hay xem nội dung được đánh dấu là không phù hợp với trẻ em. Các bạn vẫn có thể tạo và tải lên dự án, duyệt các dự án công khai và bày tỏ cảm xúc với dự án bằng lượt thích. Những giới hạn này nhằm tạo ra một môi trường học tập an toàn.'
