parent:
  footer:
    link: 'Roditelji i staratelji'
  info:
    title: 'Informacije za roditelje i staratelje'
    intro: 'Catrobat ozbiljno shvata bezbednost i privatnost mladih korisnika. Ova stranica objašnjava kako štitimo tvoje dete i koja prava imaš.'
    whatIsCatrobat:
      title: 'Šta je Catrobat?'
      text: 'Catrobat je besplatna, neprofitna obrazovna platforma na kojoj mladi uče programiranje praveći sopstvene aplikacije, igre i animacije. Platforma je dostupna širom sveta i koristi se u obrazovnim okruženjima.'
    dataCollected:
      title: 'Koje podatke prikupljamo?'
      text: 'Prikupljamo samo podatke neophodne za rad platforme: korisničko ime, e-mail adresu, datum rođenja i projekte koje tvoje dete napravi i otpremi. Za korisnike mlađe od 14 godina čuvamo i e-mail adresu roditelja/staratelja radi davanja saglasnosti. Lične podatke ne prodajemo niti delimo sa trećim stranama.'
    yourRights:
      title: 'Tvoja prava kao roditelja ili staratelja'
      text: 'Prema propisima EU o zaštiti dece (GDPR) i COPPA imaš pravo da: pregledaš podatke koje čuvamo o tvom detetu, zatražiš kopiju tih podataka, u bilo kom trenutku povučeš saglasnost (čime se nalog ograničava) i zatražiš trajno brisanje naloga tvog deteta i svih povezanih podataka.'
    minorRestrictions:
      title: 'Koja ograničenja važe za naloge maloletnika?'
      text: 'Korisnici mlađi od 16 godina ne mogu da objavljuju ni čitaju komentare, prate druge korisnike niti gledaju sadržaj označen kao neprikladan za decu. I dalje mogu da prave i otpremaju projekte, pregledaju javne projekte i reaguju na projekte sviđanjima. Ova ograničenja postoje da bi se obezbedilo bezbedno okruženje za učenje.'
    manageButton: 'Upravljaj nalogom svog deteta'
