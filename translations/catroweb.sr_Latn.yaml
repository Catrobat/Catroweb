licenseToPlay:
  link: 'Licenca za reproduciranje'
  title: 'Licenca za reproduciranje - Daj kredit i podeli'
  text1: "Zamisli da je svaki Catrobat projekat specijalan kolač koji ima svoj recept. (programski blokovi)\nSvi članovi Catrobat zajednice dele svoje kolače uključujući i recepte. To znači da možeš uživati u kolaču i naučiti kako da ga sam napraviš!"
  text2: 'Ne postoje tajni recepti: uputstva kako da napraviš te kolače dostupna su svima za korišćenje, ponovnu upotrebu, izmenu i kao inspiracija za nove ideje... mislim, kolače.'
  text3: "Možeš jesti te kolače, kao i kopirati recepte od drugih da bi napravio svoj lični, ali možda sa drugim sastojcima.\nTa sloboda dolazi sa dva jednostavna uslova:"
  text4: "Uspostavljajući Catrobat zajednicu, odlučili smo se za ovaj pristup jer verujemo da podržava učenje i kreativnost u zajednici. Deljenjem recepata i sastojaka (skripte i umetnička dela) ljudi mogu nadograditi ideje drugih i svi će imati koristi."
  text5: 'Prilikom dizajniranja Catrobat veb stranice uključili smo funkcije koje podstiču ljude da dele i odaju priznanje drugima. Na stranici svakog projekta uvek možeš preuzeti originalne skripte projekta. Ako remiksuješ projekat (izmeniš skripte ili umetnička dela i podeliš rezultat), podstičemo te da odaš priznanje u napomenama projekta, navodeći ljude i projekat koji su te inspirisali.'
  text6: 'Saznaj više o uslovima korišćenja Catrobat onlajn zajednice na %link-termsOfUse%.'
  list1:
    item1: podeli svoje kolače zajedno sa receptima
    item2: 'daj priznanje onima koji su te inspirisali'
  version: Verzija 1.1, 2 april 2013
termsOfUse:
  title: Uslovi korišćenja
  headline: Dobrodošli u Catrobat zajednicu!
  text1: 'Kao deo Catrobat zajednice, deliš projekte i ideje sa ljudima:'
  text2: 'Potrebna nam je tvoja pomoć da ova zajednica bude mesto podrške za svakog člana. Evo kako možeš pomoći:'
  text3: 'Kroz Catrobat projekat želimo da podstaknemo saradnju i omogućimo da se svačija kreativnost kombinuje u korist čitavog čovečanstva. I ti možeš postati aktivan član Catrobat zajednice tako što ćeš svoje projekte dati zajednici kao poklon, na isti način na koji drugi aktivni članovi daju svoje projekte tebi:'
  text4: 'Naš poklon za tebe:'
  text5: 'Naši uslovi korišćenja i usluge:'
  list1:
    item1: iz više različitih država i kultura
    item2: 'svih uzrasta (od male dece i tinejdžera do baka i deka)'
    item3: sa različitim nivoima iskustava
  list2:
    item1: 'Budi pun/puna poštovanja. Kada deliš projekte, imaj na umu da tvoje doprinose vide ljudi različitih uzrasta i porekla.'
    item2: 'Odaj priznanje. Slobodno pravi izmenjene verzije projekata drugih ljudi - samo se pobrini da im odaš priznanje. Jedno mesto za to je odeljak „Napomene i zasluge“ tvog projekta. Pogledaj paragraf ispod ove liste za detalje o izmenama projekata drugih korisnika.'
    item3: "Budi iskren. Ne pretvaraj se da si neko drugi da bi prevario zajednicu."
    item4: "Čuvaj lične podatke. Ne deli svoju e-mail adresu, broj telefona ili druge lične podatke za kontakt."
    item5: "Pomozi da stranica ostane prijatna. Ako primetiš neki projekat ili komentar uvredljivog, nasilnog ili bilo kakvog drugog neprikladnog karaktera, samo klikni na dugme 'prijavi kao neprikladno' i ostavi kratko objašnjenje. Catrobat tim će pregledati prijave i tako može ukloniti bilo koji projekat, komentar ili slično."
  list3:
    item1: 'Otpremanjem projekta na naše veb lokacije prihvataš i pristaješ da to delo staviš pod određene besplatne licence za otpremljene Catrobat projekte. Slično besplatnim licencama pod kojima ti je dostupan i sam Catrobat sistem, ove besplatne licence za otpremljene Catrobat projekte daju svima pravo da uče iz radova koje su drugi ranije otpremili i da ih prilagode i remiksuju kako bi napravili sopstvene nove fascinantne igre, animacije i druge projekte. To svima omogućava da „stoje na ramenima svojih vršnjaka“, a jedan od njih si i ti! Tvoj rad će tako koristiti celom svetu i ostati besplatan za svakoga, pomalo slično tekstovima i slikama koje su na Vikipediju slobodno doprineli volonteri iz celog sveta. Zamisli to kao svoj poklon čovečanstvu: ti daješ svima, a svi ostali koji otpreme svoj rad na naše veb lokacije daju tebi. Tako je otpremljen projekat poklon velike vrednosti koji ti njegov vlasnik daje besplatno, pod uslovom da učestvuješ u zajednici pod istim uslovima.'
    item2: 'Ne moraš prihvatiti poklon; ako ga prihvatiš, važe određena pravila. Prednost ovih pravila je u tome što možeš učiti iz tog rada i nadograditi ga da sam/sama napraviš još bolje stvari, koje onda možeš, na primer, ponovo otpremiti na naše veb lokacije kao svoje. Druga prednost je što ove licence obezbeđuju da ne možeš biti odgovoran/odgovorna za probleme koji drugima nastanu zbog korišćenja tvog projekta.'
    item3: 'Jedan važan dodatni uslov je da jasno navedeš autore na čijim si radovima zasnovao/la svoj rad. Istovremeno, trudićemo se da drugi jasno vide da je tvoj rad tvoj doprinos, tako što ćemo ga pripisati jedinstvenom imenu koje si slobodno izabrao/la da te predstavlja u Catrobat zajednici, i tako što ćemo drugima dati priliku da ti javno izraze zahvalnost što si svoj rad dao/la svima, a posebno njima.'
    item4: 'Pogledaj %link-licenseUploaded% za precizne pravne uslove i odredbe.'
  list4:
    item1: 'Sav naš sopstveni softver i internet resurse vezane za Catrobat sistem, npr. softver koji je napisao Catrobat tim, naše veb stranice i internet resurse, naš izvorni kod vezan za Catrobat sistem i sve dodatne uključene materijale kao što su slike, zvukovi i tekstovi, nudimo ti sada i u budućnosti pod Catrobat-ovim besplatnim licencama.'
    item2: 'Ove licence čine sve delove Catrobat-a besplatnim za tebe, ali i slobodnim u smislu da imaš slobodu da ih koristiš kako god želiš, uz samo nekoliko ograničenja koja, između ostalog, obezbeđuju da Catrobat sistem zauvek ostane besplatan i koristan za sve.'
    item3: 'Pogledaj %link-licenseToPlay% za precizne pravne uslove i odredbe. Izvorni kod Catrobat sistema, kao i mnogi drugi dokumenti i resursi, dostupni su preko %link-developer%.'
  list5:
    item1: 'Ako si ti ili, ako si mlađi/mlađa od 13 godina, tvoji roditelji ili zakonski staratelji, povezan/a sa organizacijom koja učestvuje u masovnim kršenjima privatnosti ili masovnom nadzoru ili je za njih odgovorna, nije ti dozvoljeno da koristiš naše softverske aplikacije i pristupaš našim uslugama. Precizni detalji ovog ograničenja i određeni izuzeci navedeni su u odeljcima 4.a i 4.b na našoj stranici %link-termsOfUse%.'
    item2: 'Ako si mlađi/mlađa od 13 godina, moraš pitati roditelje ili zakonske staratelje da li ti dozvoljavaju da koristiš Catrobat-ove softverske aplikacije i usluge.'
    item3: 'Zadržavamo pravo da u bilo kom trenutku, po sopstvenom nahođenju, odbijemo, obrišemo ili sakrijemo projekte, korisničke naloge i bilo koji digitalni materijal otpremljen na Catrobat-ove veb stranice, na primer ako utvrdimo da projekat sadrži neprikladan materijal ili da korisnik krši prava drugih osoba.'
    item4: "Sav softver i internet resursi Catrobat-a nude se u nadi da će biti korisni, ali bez ikakve garancije."
    item5: 'Pogledaj naše %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service za precizne formulacije gornjih tačaka i neke dodatne pravne uslove i odredbe.'
  bottom1: 'Svrati ovde s vremena na vreme, jer stalno pokušavamo da poboljšamo naše Uslove korišćenja.'
  bottom2: 'Sve predloge u vezi sa ovim Uslovima korišćenja pošalji na %email-webmaster%.'
  version: Verzija 1.3, 4. mart. 2014
