    manageLink: 'Nalogom svog deteta možeš u bilo kom trenutku upravljati preko našeg <a href="%portalUrl%" style="color: #00acc1;">portala za roditelje</a>. Saznaj više o <a href="%infoUrl%" style="color: #00acc1;">svojim pravima kao roditelja</a>.'
