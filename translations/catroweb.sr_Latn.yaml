privacy-policy:
  header: Pravila o privatnosti
  version: Verzija 2.2, 17. oktobar 2019
  text1: 'Da bismo ti ponudili sve prednosti naših usluga i povezanog naloga, potrebno je da od tebe prikupimo određene podatke.'
  text2: 'Da bismo održavali i poboljšavali naše usluge (aplikacije i veb stranice) i sprovodili naučna istraživanja o obrazovanju u oblasti IKT i STEM/STEAM, koristimo Google Analytics, Crashlytics i Firebase, sve od kompanije Google LLC (SAD), kao i Dynatrace kompanije Dynatrace LLC (SAD), kako bismo dobili metapodatke o korišćenju naših usluga, npr. informacije o padovima aplikacije, vremenske oznake, posećene stranice/ekrane, korišćenje naših aplikacija i usluga, korišćeni operativni sistem i informacije o mrežnom provajderu. Ova analiza i prikupljeni podaci nisu povezani sa tvojim profilom i ne sadrže lične podatke (poslednji delovi IP adrese se anonimizuju). Međutim, prikupljeni podaci se prenose pružaocima usluga (Google LLC, SAD i Dynatrace LLC, SAD). Obrada podataka zasniva se na ugovorima sa kompanijama Google LLC i Dynatrace LLC. Ovaj odnos sa pružaocima usluga usklađen je sa Opštom uredbom Evropske unije o zaštiti podataka (EU GDPR) i sporazumom EU-SAD „Privacy Shield“.'
  text3: 'Da bismo ti omogućili da napraviš i koristiš nalog u našim sistemima i da te putem e-maila obaveštavamo o potrebnim promenama u vezi sa tvojim nalogom, npr. ažuriranjima ili kršenjima naših Uslova korišćenja i usluge, pravila zajednice ili smernica, čuvaćemo tvoje korisničko ime i, ako si je naveo/la, tvoju e-mail adresu. Ako si svoj nalog povezao/la preko Google Plus-a ili Facebook-a, dodatno čuvamo identifikacioni ključ povezan sa tvojim nalogom na tim servisima. Te podatke nećemo koristiti ni u koje druge svrhe (npr. marketing), osim ako nam to izričito nisi dozvolio/la.'
  text4: 'Dobrovoljno možeš da nam navedeš svoju zemlju prebivališta preko stranice svog naloga na sajtu za deljenje. Ona će biti prikazana na tvom javnom profilu i koristićemo je samo u statističke i istraživačke svrhe. Možeš je ukloniti u bilo kom trenutku u podešavanjima profila.'
  text5: 'Korišćenje ličnih podataka koji pripadaju tvom nalogu možeš u bilo kom trenutku povući brisanjem naloga preko stranice svog profila na https://share.catrob.at/. Nakon brisanja naloga i dalje ćeš moći da koristiš pružene usluge, ali ne i da sarađuješ, npr. otpremanjem programa, komentarisanjem ili sviđanjima. Takođe, sav sadržaj povezan sa tvojim nalogom, npr. otpremljeni programi, komentari itd., biće obrisan.'
  text6: 'Da bi se izbegla zloupotreba naših usluga, npr. otpremanjem sadržaja ili komentarima u nezakonite svrhe, svi javni podaci koje korisnici generišu (otpremanja, komentari) čuvaju se interno u bazi podataka, zajedno sa vremenskom oznakom i korišćenom internet adresom. Ove podatke nećemo koristiti niti prosleđivati nijednoj instituciji, osim ako postoji osnovana sumnja na nezakonite radnje i ako ih nadležne pravne institucije zatraže na osnovu važećeg zakona. Svaki slučaj ćemo prvo detaljno pojedinačno proveriti.'
  text7: 'Možeš se dobrovoljno pretplatiti na Catrobat bilten na https://catrob.at/newsletter, koji pružamo preko servisa MailChimp (The Rocket Science Group LLC d/b/a MailChimp, SAD). Tada ćeš na svoju e-mail adresu dobijati novosti o projektu Catrobat i njegovim uslugama. Od biltena možeš da se odjaviš u bilo kom trenutku pomoću linka „odjava“ u podnožju svakog biltena. Bilten pruža MailChimp, sa kojim imamo ugovor o obradi podataka i koji se obavezao na Opštu uredbu EU o zaštiti podataka i „Privacy Shield“ između EU i SAD. Za više detalja o MailChimp-u pogledaj i MailChimp-ovu politiku privatnosti i uslove korišćenja.'
  text8: Sve usluge pružaju besplatni otvoreni izvorni Catrobat projekti pod okriljem Međunarodnog udruženja Catrobat - Verein zur Forderung freier Softvare, neprofitne nevladine organizacije osnovane u Gracu, Austrija (Evropska unija). Naše politike poštuju EU i austrijski zakon o zaštiti podataka (GDPR). Da biste stupili u kontakt s nama, pošaljite nam e-mail na contact@catrobat.org ili nam pišite na Catrobat, c/o Institut za softversku tehnologiju, Tehnički univerzitet u Gracu, Inffeldgasse 16b, A-8010 Graz, Austrija (Evropska unija).
  text9: 'Ako si mlađi/mlađa od 14 godina, ova pravila mora da prihvati zakonski staratelj (obično roditelj).'
  text10: 'Zvanična Catrobat politika privatnosti na engleskom jeziku dostupna je na vebu na %privacy_policy%.'
  disagree-text: 'Bez saglasnosti ne možemo da napravimo nalog, ali osnovne funkcije su i dalje dostupne.'
