    greeting: 'Zdravo,'
    message: 'Tvoje dete %username% je napravilo nalog na Catrobat-u i potvrdilo svoju e-mail adresu.'
    explanation: 'Catrobat je besplatna obrazovna platforma na kojoj mladi uče programiranje praveći aplikacije, igre i animacije. Prema propisima EU o zaštiti dece potrebna nam je tvoja saglasnost pre nego što tvoje dete može u potpunosti da učestvuje u zajednici. Klikni na dugme ispod da daš saglasnost.'
