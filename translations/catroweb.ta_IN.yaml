passwordRecovery:
  subject: உங்கள் கேட்ரோபாட் கடவுச்சொல் மீட்பு
  message: |
    அன்புள்ள %username%

     உங்கள் கடவுச்சொல்லை மறந்துவிட்டதால் உங்கள் கடவுச்சொல்லை %appplication_url% இல் மீட்டமைக்க கோரியுள்ளீர்கள்.
     இதை நீங்கள் கோரவில்லை என்றால், தயவுசெய்து புறக்கணிக்கவும். இது 24 மணி நேரத்தில் காலாவதியாகி பயனற்றதாகிவிடும்.

     உங்கள் கடவுச்சொல்லை மீட்டமைக்க மற்றும் புதிய ஒன்றை உருவாக்க, பின்வரும் பக்கத்தைப் பார்வையிடவும்: %confirmationUrl%

     %appplication_url% சமூகத்தை அணுக எந்த நேரத்திலும் உங்கள் பயனர்பெயர் மற்றும் கடவுச்சொல்லைப் பயன்படுத்தலாம்.
     அவ்வாறு செய்ய, பின்வரும் பக்கத்தைப் பார்வையிடவும்: %loginPage%
     உங்கள் சுயவிவர விவரங்களைத் திருத்த, இந்தப் பக்கத்திற்குச் செல்லவும்: %profilePage%

     வாழ்த்துக்கள்,
     உங்கள் கேட்ரோபாட் குழு.
  messageHtml: |
    <p>
     அன்புள்ள %username%. <br>
     <br>
     உங்கள் கடவுச்சொல்லை மறந்துவிட்டதால், உங்கள் கடவுச்சொல்லை <a href="%appplication_url%"> Pocket Code </a> இல் மீட்டமைக்க கோரியுள்ளீர்கள்.
     இதை நீங்கள் கோரவில்லை என்றால், தயவுசெய்து புறக்கணிக்கவும். இது 24 மணி நேரத்தில் காலாவதியாகி பயனற்றதாகிவிடும். <br>
     <br>
     உங்கள் கடவுச்சொல்லை மீட்டமைத்து புதிய ஒன்றை உருவாக்க, தயவுசெய்து இங்கே <a href="%confirmationUrl%"> ஐக் கிளிக் செய்க. </a> <br>
     <br>
     <a href="%appplication_url%"> Pocket Code </a> சமூகத்தை அணுக எந்த நேரத்திலும் உங்கள் பயனர்பெயர் மற்றும் கடவுச்சொல்லைப் பயன்படுத்தலாம். <br>
     அவ்வாறு செய்ய, பின்வரும் பக்கத்தைப் பார்வையிடவும்: <a href="%loginPage%"> உள்நுழைவு பக்கம் </a> <br>
     உங்கள் சுயவிவர விவரங்களைத் திருத்த, இந்த <a href="%profilePage%"> பக்கத்திற்கு </a> செல்லவும். <br>
     <br>
     வாழ்த்துக்கள், <br>
     உங்கள் கேட்ரோபாட் குழு.
     </p>
