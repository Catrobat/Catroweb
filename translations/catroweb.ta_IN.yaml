  deleteAccount: கணக்கை நீக்கு
  deleteAccountWarning: "கவனி:\nநீ %num_projects% திட்டம்(கள்) உருவாக்கியுள்ளாய், உனக்கு %num_followers% பின்தொடர்பவர்(கள்) உள்ளனர். உன் எல்லாத் திட்டங்களும் நீக்கப்படும். இனி உன்னால் உள்நுழைய முடியாது, உன் திட்டங்கள் எல்லாப் பட்டியல்களிலிருந்தும் மறைந்துவிடும். சுயவிவரத்தை நீக்குவதைத் திரும்பப் பெற முடியாது!\nஎங்களை விட்டுப் போக உறுதியா?\n"
  exportData: 'என் தரவைப் பதிவிறக்கு'
