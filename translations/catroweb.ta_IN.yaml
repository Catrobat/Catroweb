  subject: 'உன் மின்னஞ்சல் முகவரியைச் சரிபார்'
  welcome: 'Catrobat-க்கு வரவேற்கிறோம்!'
  greeting: 'பதிவு செய்ததற்கு நன்றி! தொடங்க உன் மின்னஞ்சல் முகவரியைச் சரிபார்.'
