parent:
  footer:
    link: 'பெற்றோர் & பாதுகாவலர்கள்'
  info:
    title: 'பெற்றோர் & பாதுகாவலர்களுக்கான தகவல்'
    intro: 'Catrobat இளம் பயனர்களின் பாதுகாப்பையும் தனியுரிமையையும் தீவிரமாகக் கருதுகிறது. உன் குழந்தையை நாங்கள் எப்படிப் பாதுகாக்கிறோம், உனக்கு என்ன உரிமைகள் உள்ளன என்பதை இந்தப் பக்கம் விளக்குகிறது.'
    whatIsCatrobat:
      title: 'Catrobat என்றால் என்ன?'
      text: 'Catrobat என்பது இளைஞர்கள் தங்கள் சொந்தச் செயலிகள், விளையாட்டுகள், அனிமேஷன்களை உருவாக்கி நிரலாக்கம் கற்கும் இலவச, இலாப நோக்கற்ற கல்வித் தளம். இந்தத் தளம் உலகம் முழுவதும் கிடைக்கிறது, கல்விச் சூழல்களில் பயன்படுத்தப்படுகிறது.'
    dataCollected:
      title: 'நாங்கள் என்ன தரவைச் சேகரிக்கிறோம்?'
      text: 'தளத்தை இயக்கத் தேவையான குறைந்தபட்சத் தரவை மட்டுமே சேகரிக்கிறோம்: பயனர் பெயர், மின்னஞ்சல் முகவரி, பிறந்த தேதி, உன் குழந்தை உருவாக்கிப் பதிவேற்றும் திட்டங்கள். 14 வயதுக்குட்பட்ட பயனர்களுக்கு, ஒப்புதலுக்காகப் பெற்றோர்/பாதுகாவலர் மின்னஞ்சல் முகவரியையும் சேமிக்கிறோம். தனிப்பட்ட தரவை மூன்றாம் தரப்பினருக்கு விற்கவோ பகிரவோ மாட்டோம்.'
    yourRights:
      title: 'பெற்றோர் அல்லது பாதுகாவலராக உன் உரிமைகள்'
      text: 'EU குழந்தைப் பாதுகாப்பு விதிமுறைகள் (GDPR) மற்றும் COPPA-இன் கீழ், உனக்கு இந்த உரிமைகள் உள்ளன: உன் குழந்தை பற்றி நாங்கள் வைத்திருக்கும் தரவைப் பார்ப்பது, அந்தத் தரவின் நகலைக் கோருவது, எப்போது வேண்டுமானாலும் உன் ஒப்புதலைத் திரும்பப் பெறுவது (இது கணக்கைக் கட்டுப்படுத்தும்), உன் குழந்தையின் கணக்கையும் தொடர்புடைய எல்லாத் தரவையும் நிரந்தரமாக நீக்கக் கோருவது.'
    minorRestrictions:
      title: 'சிறார் கணக்குகளுக்கு என்ன கட்டுப்பாடுகள் உள்ளன?'
      text: '16 வயதுக்குட்பட்ட பயனர்கள் கருத்துகளை இடவோ படிக்கவோ, மற்ற பயனர்களைப் பின்தொடரவோ, குழந்தைகளுக்கு ஏற்றதல்ல எனக் குறிக்கப்பட்ட உள்ளடக்கத்தைப் பார்க்கவோ முடியாது. அவர்கள் இன்னும் திட்டங்களை உருவாக்கிப் பதிவேற்றலாம், பொதுத் திட்டங்களை உலாவலாம், திட்டங்களுக்கு லைக் மூலம் எதிர்வினையாற்றலாம். பாதுகாப்பான கற்றல் சூழலை வழங்க இந்தக் கட்டுப்பாடுகள் உள்ளன.'
    manageButton: 'உன் குழந்தையின் கணக்கை நிர்வகி'
