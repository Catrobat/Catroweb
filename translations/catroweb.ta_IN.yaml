accountConfirmation:
  subject: உங்கள் கேட்ரோபேட் கணக்கு உறுதிப்படுத்தல்
  message: |
    அன்புள்ள %username%.
     உங்கள் கணக்கைச் செயல்படுத்துவதை முடிக்க - தயவுசெய்து %confirmationUrl% ஐப் பார்வையிடவும்
