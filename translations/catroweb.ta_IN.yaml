     உங்கள் கணக்கைச் செயல்படுத்துவதை முடிக்க - <a href="%confirmationUrl%"> இங்கே கிளிக் செய்க. </a><br>
     <br>
     உங்கள் கணக்கை சரிபார்க்க இந்த இணைப்பு ஒரு முறை மட்டுமே பயன்படுத்தப்பட முடியும். <br>
     <br>
     வாழ்த்துக்கள், <br>
     உங்கள் கேட்ரோபாட் குழு.
     </p>
