  title: 'ಆಡಲು ಪರವಾನಗಿ - ಶ್ರೇಯ ನೀಡು ಮತ್ತು ಹಂಚಿಕೊ'
  text1: ಪ್ರತಿಯೊಂದು ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಪ್ರಾಜೆಕ್ಟ್ ಒಂದು ಕೇಕ್ ಎಂದು ಊಹಿಸಿಕೊ, ತನ್ನ ಪಾಕವಿಧಾನದೊಂದಿಗೆ (ಪ್ರೋಗ್ರಾಮಿಂಗ್ ಬ್ಲಾಕ್‌ಗಳು) ಬರುವ ಒಂದು ವಿಶೇಷ ಕೇಕ್. ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಸಮುದಾಯದ ಎಲ್ಲಾ ಸದಸ್ಯರು ತಮ್ಮ ಕೇಕ್‌ಗಳನ್ನು ಅವುಗಳ ಪಾಕವಿಧಾನಗಳೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳುತ್ತಾರೆ. ಅಂದರೆ ನೀನು ಕೇಕ್‌ಗಳನ್ನು ಸವಿಯಬಹುದು ಮತ್ತು ಅವುಗಳನ್ನು ನೀನೇ ಮಾಡುವುದನ್ನು ಕಲಿಯಬಹುದು!
  text2: 'ಯಾವುದೇ ರಹಸ್ಯ ಪಾಕವಿಧಾನಗಳಿಲ್ಲ: ಈ ಕೇಕ್‌ಗಳನ್ನು ಮಾಡುವ ಸೂಚನೆಗಳು ಯಾರು ಬೇಕಾದರೂ ಬಳಸಲು, ಮರುಬಳಸಲು, ಬದಲಾಯಿಸಲು ಮತ್ತು ಹೊಸ ಆಲೋಚನೆಗಳಿಗೆ... ಅಂದರೆ ಕೇಕ್‌ಗಳಿಗೆ ಸ್ಫೂರ್ತಿಯಾಗಿ ಬಳಸಲು ತೆರೆದಿವೆ.'
  text3: "ನೀನು ಕೇಕ್‌ಗಳನ್ನು ತಿನ್ನಬಹುದು ಮತ್ತು ಬೇರೆಯವರ ಪಾಕವಿಧಾನಗಳನ್ನು ನಕಲಿಸಿ ನಿನ್ನದೇ ಕೇಕ್ ಮಾಡಬಹುದು, ಬಹುಶಃ ಬೇರೆ ಪದಾರ್ಥಗಳೊಂದಿಗೆ. ಈ ಸ್ವಾತಂತ್ರ್ಯದೊಂದಿಗೆ ಎರಡು ಸರಳ ಷರತ್ತುಗಳಿವೆ:"
  text4: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಸಮುದಾಯವನ್ನು ಸ್ಥಾಪಿಸುವಾಗ, ನಾವು ಈ ವಿಧಾನವನ್ನು ಅಳವಡಿಸಿಕೊಳ್ಳಲು ನಿರ್ಧರಿಸಿದೆವು, ಏಕೆಂದರೆ ಇದು ಸಮುದಾಯದಲ್ಲಿ ಕಲಿಕೆ ಮತ್ತು ಸೃಜನಶೀಲತೆಯನ್ನು ಬೆಂಬಲಿಸುತ್ತದೆ ಎಂದು ನಾವು ನಂಬುತ್ತೇವೆ. ಪಾಕವಿಧಾನಗಳು ಮತ್ತು ಪದಾರ್ಥಗಳನ್ನು (ಸ್ಕ್ರಿಪ್ಟ್‌ಗಳು ಮತ್ತು ಕಲಾಕೃತಿಗಳು) ಹಂಚಿಕೊಳ್ಳುವ ಮೂಲಕ, ಜನರು ಒಬ್ಬರ ಆಲೋಚನೆಗಳ ಮೇಲೆ ಇನ್ನೊಬ್ಬರು ನಿರ್ಮಿಸಬಹುದು ಮತ್ತು ಎಲ್ಲರಿಗೂ ಲಾಭವಾಗುತ್ತದೆ."
  text5: ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ವೆಬ್‌ಸೈಟ್ ವಿನ್ಯಾಸಗೊಳಿಸುವಾಗ, ಜನರು ಹಂಚಿಕೊಳ್ಳಲು ಮತ್ತು ಇತರರಿಗೆ ಶ್ರೇಯ ನೀಡಲು ಪ್ರೋತ್ಸಾಹಿಸುವ ವೈಶಿಷ್ಟ್ಯಗಳನ್ನು ನಾವು ಸೇರಿಸಿದ್ದೇವೆ. ಪ್ರತಿ ಪ್ರಾಜೆಕ್ಟ್ ಪುಟದಲ್ಲಿ, ಪ್ರಾಜೆಕ್ಟ್‌ನ ಮೂಲ ಸ್ಕ್ರಿಪ್ಟ್‌ಗಳನ್ನು ನೀನು ಯಾವಾಗಲೂ ಡೌನ್‌ಲೋಡ್ ಮಾಡಬಹುದು. ನೀನು ಒಂದು ಪ್ರಾಜೆಕ್ಟ್ ಅನ್ನು ರಿಮಿಕ್ಸ್ ಮಾಡಿದರೆ (ಸ್ಕ್ರಿಪ್ಟ್‌ಗಳು ಅಥವಾ ಕಲಾಕೃತಿಗಳನ್ನು ಬದಲಾಯಿಸಿ ಫಲಿತಾಂಶವನ್ನು ಹಂಚಿಕೊಂಡರೆ), ನಿನಗೆ ಸ್ಫೂರ್ತಿ ನೀಡಿದ ಜನರು ಮತ್ತು ಪ್ರಾಜೆಕ್ಟ್ ಅನ್ನು ಪ್ರಾಜೆಕ್ಟ್ ಟಿಪ್ಪಣಿಗಳಲ್ಲಿ ಉಲ್ಲೇಖಿಸಿ ಶ್ರೇಯ ನೀಡಲು ನಾವು ಪ್ರೋತ್ಸಾಹಿಸುತ್ತೇವೆ.
  text6: 'ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಆನ್‌ಲೈನ್ ಸಮುದಾಯದ ಬಳಕೆಯ ನಿಯಮಗಳ ಬಗ್ಗೆ %link-termsOfUse% ನಲ್ಲಿ ಇನ್ನಷ್ಟು ತಿಳಿ.'
  list1:
    item1: ನಿನ್ನ ಕೇಕ್‌ಗಳನ್ನು ಪಾಕವಿಧಾನದೊಂದಿಗೆ ಹಂಚಿಕೊ
    item2: ನಿನಗೆ ಸ್ಫೂರ್ತಿ ನೀಡಿದವರಿಗೆ ಶ್ರೇಯ ನೀಡು
  version: ಆವೃತ್ತಿ 1.1, 2 ಏಪ್ರಿಲ್ 2013
termsOfUse:
  title: ಬಳಕೆಯ ನಿಯಮಗಳು
  headline: ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಸಮುದಾಯಕ್ಕೆ ಸುಸ್ವಾಗತ!
  text1: 'ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಸಮುದಾಯದ ಭಾಗವಾಗಿ, ನೀನು ಈ ಜನರೊಂದಿಗೆ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳು ಮತ್ತು ಆಲೋಚನೆಗಳನ್ನು ಹಂಚಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯ:'
  text2: "ಈ ಸಮುದಾಯವನ್ನು ಪ್ರತಿಯೊಬ್ಬ ಸದಸ್ಯನಿಗೂ ಬೆಂಬಲ ನೀಡುವ ಸ್ಥಳವನ್ನಾಗಿ ಮಾಡಲು ನಮಗೆ ನಿನ್ನ ಸಹಾಯ ಬೇಕು. ನೀನು ಹೀಗೆ ಸಹಾಯ ಮಾಡಬಹುದು:"
  text3: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಪ್ರಾಜೆಕ್ಟ್ ಮೂಲಕ ನಾವು ಸಹಕಾರವನ್ನು ಬೆಳೆಸಲು ಮತ್ತು ಎಲ್ಲರ ಸೃಜನಶೀಲತೆಯನ್ನು ಇಡೀ ಮಾನವಕುಲದ ಒಳಿತಿಗಾಗಿ ಒಗ್ಗೂಡಿಸಲು ಬಯಸುತ್ತೇವೆ. ಇತರ ಸಕ್ರಿಯ ಸದಸ್ಯರು ತಮ್ಮ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳನ್ನು ನಿನಗೆ ನೀಡುವಂತೆಯೇ, ನಿನ್ನ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳನ್ನು ಸಮುದಾಯಕ್ಕೆ ಉಡುಗೊರೆಯಾಗಿ ನೀಡುವ ಮೂಲಕ ನೀನೂ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಸಮುದಾಯದ ಸಕ್ರಿಯ ಸದಸ್ಯನಾಗಬಹುದು:"
  text4: 'ನಿನಗೆ ನಮ್ಮ ಉಡುಗೊರೆ:'
  text5: 'ನಮ್ಮ ಬಳಕೆ ಮತ್ತು ಸೇವೆಯ ನಿಯಮಗಳು:'
  list1:
    item1: ಅನೇಕ ವಿಭಿನ್ನ ದೇಶಗಳು ಮತ್ತು ಸಂಸ್ಕೃತಿಗಳಿಂದ
    item2: ಎಲ್ಲಾ ವಯಸ್ಸಿನವರು (ಚಿಕ್ಕ ಮಕ್ಕಳಿಂದ ಹದಿಹರೆಯದವರು ಮತ್ತು ಅಜ್ಜ-ಅಜ್ಜಿಯರವರೆಗೆ)
    item3: ಎಲ್ಲಾ ಮಟ್ಟದ ಅನುಭವ ಹೊಂದಿರುವವರು
  list2:
    item1: ಗೌರವದಿಂದಿರು. ಪ್ರಾಜೆಕ್ಟ್‌ಗಳನ್ನು ಹಂಚಿಕೊಳ್ಳುವಾಗ, ವಿಭಿನ್ನ ವಯಸ್ಸು ಮತ್ತು ಹಿನ್ನೆಲೆಯ ಅನೇಕ ಜನರು ನಿನ್ನ ಕೊಡುಗೆಗಳನ್ನು ನೋಡುತ್ತಾರೆ ಎಂಬುದನ್ನು ನೆನಪಿಡು.
    item2: "ಶ್ರೇಯ ನೀಡು. ಬೇರೆಯವರ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳ ಬದಲಾಯಿಸಿದ ಆವೃತ್ತಿಗಳನ್ನು ಮುಕ್ತವಾಗಿ ಮಾಡು - ಅವರಿಗೆ ಶ್ರೇಯ ನೀಡುವುದನ್ನು ಮಾತ್ರ ಖಚಿತಪಡಿಸಿಕೊ. ಶ್ರೇಯ ನೀಡಲು ಒಂದು ಸ್ಥಳ ನಿನ್ನ ಪ್ರಾಜೆಕ್ಟ್‌ನ ಕೃತಜ್ಞತೆಗಳ ವಿಭಾಗ. ಇತರ ಬಳಕೆದಾರರ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳನ್ನು ಬದಲಾಯಿಸುವ ಬಗ್ಗೆ ವಿವರಗಳಿಗಾಗಿ ಈ ಪಟ್ಟಿಯ ಕೆಳಗಿನ ಪ್ಯಾರಾಗ್ರಾಫ್ ನೋಡು."
    item3: "ಪ್ರಾಮಾಣಿಕನಾಗಿರು. ನೀನು ಅಲ್ಲದ ಬೇರೆ ಯಾರೋ ಎಂದು ನಟಿಸಬೇಡ ಅಥವಾ ಸಮುದಾಯವನ್ನು ಮೋಸಗೊಳಿಸಲು ಪ್ರಯತ್ನಿಸಬೇಡ."
    item4: "ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಖಾಸಗಿಯಾಗಿಡು. ನಿನ್ನ ಇಮೇಲ್ ವಿಳಾಸ, ಫೋನ್ ಸಂಖ್ಯೆ ಅಥವಾ ಇತರ ವೈಯಕ್ತಿಕ ಸಂಪರ್ಕ ಮಾಹಿತಿಯನ್ನು ಹಂಚಿಕೊಳ್ಳಬೇಡ."
    item5: "ತಾಣವನ್ನು ಸ್ನೇಹಪರವಾಗಿಡಲು ಸಹಾಯ ಮಾಡು. ಒಂದು ಪ್ರಾಜೆಕ್ಟ್ ಅಥವಾ ಕಾಮೆಂಟ್ ಕೆಟ್ಟದ್ದು, ಅವಮಾನಕರ, ತುಂಬಾ ಹಿಂಸಾತ್ಮಕ ಅಥವಾ ಅನುಚಿತ ಎಂದು ಇತರರಿಗೆ ಅನಿಸಬಹುದು ಎಂದು ನಿನಗೆ ಅನಿಸಿದರೆ, 'ಅನುಚಿತ ಎಂದು ವರದಿ ಮಾಡು' ಬಟನ್ ಕ್ಲಿಕ್ ಮಾಡಿ ಚಿಕ್ಕ ವಿವರಣೆ ಬರೆ. ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ತಂಡವು ನಿನ್ನ ವರದಿಯನ್ನು ಪರಿಶೀಲಿಸಿ ಯಾವುದೇ ಪ್ರಾಜೆಕ್ಟ್, ಕಾಮೆಂಟ್ ಅಥವಾ ಪೋಸ್ಟ್ ಅನ್ನು ತೆಗೆದುಹಾಕಬಹುದು."
  list3:
    item1: "ನಮ್ಮ ವೆಬ್‌ಸೈಟ್‌ಗಳಿಗೆ ಪ್ರಾಜೆಕ್ಟ್ ಅಪ್‌ಲೋಡ್ ಮಾಡುವ ಮೂಲಕ, ಈ ಕೃತಿಯನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳ ಕೆಲವು ಮುಕ್ತ ಪರವಾನಗಿಗಳ ಅಡಿಯಲ್ಲಿ ಇಡಲು ನೀನು ಒಪ್ಪುತ್ತೀಯ. ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ವ್ಯವಸ್ಥೆಯೇ ನಿನಗೆ ಲಭ್ಯವಿರುವ ಮುಕ್ತ ಪರವಾನಗಿಗಳಂತೆಯೇ, ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳ ಈ ಮುಕ್ತ ಪರವಾನಗಿಗಳು ಇತರರು ಹಿಂದೆ ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಕೃತಿಯಿಂದ ಕಲಿಯುವ ಮತ್ತು ಆ ಕೃತಿಯನ್ನು ಅಳವಡಿಸಿ ರಿಮಿಕ್ಸ್ ಮಾಡಿ ತಮ್ಮದೇ ಹೊಸ ಆಕರ್ಷಕ ಆಟಗಳು, ಅನಿಮೇಷನ್‌ಗಳು ಮತ್ತು ಇತರ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳನ್ನು ನಿರ್ಮಿಸುವ ಹಕ್ಕನ್ನು ಎಲ್ಲರಿಗೂ ನೀಡುತ್ತವೆ. ಇದು ಎಲ್ಲರಿಗೂ 'ತಮ್ಮ ಸಹಪಾಠಿಗಳ ಹೆಗಲ ಮೇಲೆ ನಿಲ್ಲಲು' ಅವಕಾಶ ನೀಡುತ್ತದೆ, ಅವರಲ್ಲಿ ಒಬ್ಬರು ನೀನು! ಹೀಗೆ ನಿನ್ನ ಕೃತಿ ಇಡೀ ಜಗತ್ತಿಗೆ ಉಪಯೋಗವಾಗುತ್ತದೆ ಮತ್ತು ಎಲ್ಲರಿಗೂ ಬಳಸಲು ಮುಕ್ತವಾಗಿರುತ್ತದೆ, ಪ್ರಪಂಚದಾದ್ಯಂತದ ಸ್ವಯಂಸೇವಕರು ವಿಕಿಪೀಡಿಯಾಗೆ ಮುಕ್ತವಾಗಿ ನೀಡುವ ಪಠ್ಯ ಮತ್ತು ಚಿತ್ರಗಳಂತೆ. ಇದನ್ನು ಮಾನವಕುಲಕ್ಕೆ ನಿನ್ನ ಉಡುಗೊರೆ ಎಂದು ಯೋಚಿಸು: ನೀನು ಎಲ್ಲರಿಗೂ ನೀಡುತ್ತೀಯ, ಮತ್ತು ನಮ್ಮ ವೆಬ್‌ಸೈಟ್‌ಗಳಿಗೆ ತಮ್ಮ ಕೃತಿ ಅಪ್‌ಲೋಡ್ ಮಾಡುವ ಇತರರೆಲ್ಲರೂ ನಿನಗೆ ನೀಡುತ್ತಾರೆ. ಹೀಗೆ ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಪ್ರಾಜೆಕ್ಟ್ ಅದರ ಮಾಲೀಕರು ನಿನಗೆ ಉಚಿತವಾಗಿ ನೀಡುವ ಅತ್ಯಮೂಲ್ಯ ಉಡುಗೊರೆಯಾಗಿದೆ, ನೀನು ಅದೇ ನಿಯಮಗಳ ಮೇಲೆ ಸಮುದಾಯದಲ್ಲಿ ಭಾಗವಹಿಸಬೇಕು ಎಂಬ ಷರತ್ತಿನೊಂದಿಗೆ."
    item2: ನೀನು ಈ ಉಡುಗೊರೆಯನ್ನು ಸ್ವೀಕರಿಸಬೇಕಾಗಿಲ್ಲ; ಸ್ವೀಕರಿಸಿದರೆ, ಕೆಲವು ನಿಯಮಗಳು ಅನ್ವಯಿಸುತ್ತವೆ. ಈ ನಿಯಮಗಳ ಲಾಭವೆಂದರೆ ನೀನು ಆ ಕೃತಿಯಿಂದ ಕಲಿಯಬಹುದು ಮತ್ತು ಅದರ ಮೇಲೆ ನಿರ್ಮಿಸಿ ಇನ್ನೂ ಅದ್ಭುತವಾದ ವಸ್ತುಗಳನ್ನು ನೀನೇ ಮಾಡಬಹುದು, ಅದನ್ನು ನೀನು ಉದಾ. ಮತ್ತೆ ನಿನ್ನದೇ ಎಂದು ನಮ್ಮ ವೆಬ್‌ಸೈಟ್‌ಗಳಿಗೆ ಅಪ್‌ಲೋಡ್ ಮಾಡಬಹುದು. ಇನ್ನೊಂದು ಲಾಭವೆಂದರೆ, ಇತರರು ನಿನ್ನ ಪ್ರಾಜೆಕ್ಟ್ ಬಳಸುವುದರಿಂದ ಅವರಿಗೆ ಉಂಟಾಗುವ ಯಾವುದೇ ಸಮಸ್ಯೆಗಳಿಗೆ ನಿನ್ನನ್ನು ಹೊಣೆಗಾರನನ್ನಾಗಿ ಮಾಡಲಾಗುವುದಿಲ್ಲ ಎಂದು ಈ ಪರವಾನಗಿಗಳು ಖಚಿತಪಡಿಸುತ್ತವೆ.
    item3: "ಒಂದು ಮುಖ್ಯ ಹೆಚ್ಚುವರಿ ಷರತ್ತು ಎಂದರೆ, ನಿನ್ನ ಕೃತಿಗೆ ಆಧಾರವಾದ ಕೃತಿಗಳ ಲೇಖಕರಿಗೆ ನೀನು ಸ್ಪಷ್ಟವಾಗಿ ಶ್ರೇಯ ನೀಡಬೇಕು. ಅದೇ ಸಮಯದಲ್ಲಿ, ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಸಮುದಾಯದಲ್ಲಿ ನಿನ್ನನ್ನು ಪ್ರತಿನಿಧಿಸಲು ನೀನು ಮುಕ್ತವಾಗಿ ಆಯ್ಕೆ ಮಾಡಿದ ವಿಶಿಷ್ಟ ಹೆಸರಿಗೆ ಶ್ರೇಯ ನೀಡುವ ಮೂಲಕ, ಮತ್ತು ನಿನ್ನ ಕೃತಿಯನ್ನು ಎಲ್ಲರಿಗೂ, ವಿಶೇಷವಾಗಿ ಅವರಿಗೆ ನೀಡಿದ್ದಕ್ಕಾಗಿ ಸಾರ್ವಜನಿಕವಾಗಿ ಕೃತಜ್ಞತೆ ವ್ಯಕ್ತಪಡಿಸಲು ಇತರರಿಗೆ ಅವಕಾಶ ನೀಡುವ ಮೂಲಕ, ನಿನ್ನ ಕೃತಿ ನಿನ್ನ ಕೊಡುಗೆ ಎಂದು ಇತರರು ಸ್ಪಷ್ಟವಾಗಿ ಮೆಚ್ಚುವಂತೆ ನಾವು ಶ್ರಮಿಸುತ್ತೇವೆ."
    item4: 'ನಿಖರವಾದ ಕಾನೂನು ನಿಯಮಗಳು ಮತ್ತು ಷರತ್ತುಗಳಿಗಾಗಿ ದಯವಿಟ್ಟು %link-licenseUploaded% ನೋಡು.'
  list4:
    item1: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ವ್ಯವಸ್ಥೆಗೆ ಸಂಬಂಧಿಸಿದ ನಮ್ಮ ಎಲ್ಲಾ ಸಾಫ್ಟ್‌ವೇರ್ ಮತ್ತು ಇಂಟರ್ನೆಟ್ ಸಂಪನ್ಮೂಲಗಳನ್ನು, ಉದಾ. ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ತಂಡ ಬರೆದ ಸಾಫ್ಟ್‌ವೇರ್, ನಮ್ಮ ವೆಬ್‌ಸೈಟ್‌ಗಳು ಮತ್ತು ಇಂಟರ್ನೆಟ್ ಸಂಪನ್ಮೂಲಗಳು, ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ವ್ಯವಸ್ಥೆಗೆ ಸಂಬಂಧಿಸಿದ ನಮ್ಮ ಸ್ವಂತ ಮೂಲ ಕೋಡ್, ಮತ್ತು ಉದಾ. ಚಿತ್ರಗಳು, ಧ್ವನಿಗಳು ಮತ್ತು ಪಠ್ಯಗಳಂತಹ ಎಲ್ಲಾ ಹೆಚ್ಚುವರಿ ಸಾಮಗ್ರಿಗಳನ್ನು, ಈಗ ಮತ್ತು ಭವಿಷ್ಯದಲ್ಲಿ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್‌ನ ಮುಕ್ತ ಪರವಾನಗಿಗಳ ಅಡಿಯಲ್ಲಿ ನಾವು ನಿನಗೆ ನೀಡುತ್ತೇವೆ."
    item2: ಈ ಪರವಾನಗಿಗಳು ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್‌ನ ಎಲ್ಲಾ ಭಾಗಗಳನ್ನು ನಿನಗೆ ಉಚಿತವಾಗಿಸುತ್ತವೆ ಮತ್ತು ನಿನಗೆ ಬೇಕಾದಂತೆ ಬಳಸುವ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡುತ್ತವೆ, ಕೆಲವೇ ನಿರ್ಬಂಧಗಳೊಂದಿಗೆ, ಇವು ಇತರ ವಿಷಯಗಳ ಜೊತೆಗೆ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ವ್ಯವಸ್ಥೆ ಎಂದೆಂದಿಗೂ ಎಲ್ಲರಿಗೂ ಮುಕ್ತ ಮತ್ತು ಉಪಯುಕ್ತವಾಗಿ ಉಳಿಯುವುದನ್ನು ಖಚಿತಪಡಿಸುತ್ತವೆ.
    item3: 'ನಿಖರವಾದ ಕಾನೂನು ನಿಯಮಗಳು ಮತ್ತು ಷರತ್ತುಗಳಿಗಾಗಿ ದಯವಿಟ್ಟು %link-licenseToPlay% ನೋಡು. ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ವ್ಯವಸ್ಥೆಯ ಮೂಲ ಕೋಡ್ ಮತ್ತು ಇತರ ಅನೇಕ ದಾಖಲೆಗಳು ಹಾಗೂ ಸಂಪನ್ಮೂಲಗಳು %link-developer% ಮೂಲಕ ಲಭ್ಯವಿವೆ.'
  list5:
    item1: 'ನೀನು, ಅಥವಾ ನೀನು 13 ವರ್ಷದೊಳಗಿನವನಾಗಿದ್ದರೆ ನಿನ್ನ ಪೋಷಕರು ಅಥವಾ ಕಾನೂನುಬದ್ಧ ಪಾಲಕರು, ವ್ಯಾಪಕ ಗೌಪ್ಯತೆ ಉಲ್ಲಂಘನೆಗಳು ಮತ್ತು/ಅಥವಾ ಸಾಮೂಹಿಕ ಕಣ್ಗಾವಲಿನಲ್ಲಿ ತೊಡಗಿರುವ ಅಥವಾ ಅದಕ್ಕೆ ಜವಾಬ್ದಾರರಾದ ಸಂಸ್ಥೆಯೊಂದಿಗೆ ಸಂಬಂಧ ಹೊಂದಿದ್ದರೆ, ನಮ್ಮ ಸಾಫ್ಟ್‌ವೇರ್ ಅಪ್ಲಿಕೇಶನ್‌ಗಳನ್ನು ಬಳಸಲು ಮತ್ತು ನಮ್ಮ ಸೇವೆಗಳನ್ನು ಪ್ರವೇಶಿಸಲು ನಿನಗೆ ಅನುಮತಿ ಇಲ್ಲ. ಈ ನಿರ್ಬಂಧದ ನಿಖರ ವಿವರಗಳು ಮತ್ತು ಅದರ ಕೆಲವು ವಿನಾಯಿತಿಗಳನ್ನು ನಮ್ಮ %link-termsOfUse% ನ ವಿಭಾಗ 4.a ಮತ್ತು 4.b ನಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.'
    item2: ನೀನು 13 ವರ್ಷದೊಳಗಿನವನಾಗಿದ್ದರೆ, ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್‌ನ ಸಾಫ್ಟ್‌ವೇರ್ ಅಪ್ಲಿಕೇಶನ್‌ಗಳು ಮತ್ತು ಸೇವೆಗಳನ್ನು ಬಳಸಲು ಅವರು ಅನುಮತಿಸುತ್ತಾರೆಯೇ ಎಂದು ನಿನ್ನ ಪೋಷಕರು ಅಥವಾ ಕಾನೂನುಬದ್ಧ ಪಾಲಕರನ್ನು ಕೇಳಬೇಕು.
    item3: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್‌ನ ವೆಬ್‌ಸೈಟ್‌ಗಳಿಗೆ ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳು, ಬಳಕೆದಾರ ಖಾತೆಗಳು ಮತ್ತು ಯಾವುದೇ ಡಿಜಿಟಲ್ ಸಾಮಗ್ರಿಗಳನ್ನು ಯಾವಾಗ ಬೇಕಾದರೂ ನಮ್ಮ ಸ್ವಂತ ವಿವೇಚನೆಯಿಂದ ತಿರಸ್ಕರಿಸುವ, ಅಳಿಸುವ ಅಥವಾ ಮರೆಮಾಡುವ ಹಕ್ಕನ್ನು ನಾವು ಕಾಯ್ದಿರಿಸಿಕೊಂಡಿದ್ದೇವೆ, ಉದಾಹರಣೆಗೆ ಒಂದು ಪ್ರಾಜೆಕ್ಟ್‌ನಲ್ಲಿ ಅನುಚಿತ ವಿಷಯವಿದೆ ಅಥವಾ ಒಬ್ಬ ಬಳಕೆದಾರ ಇತರ ವ್ಯಕ್ತಿಗಳ ಹಕ್ಕುಗಳನ್ನು ಉಲ್ಲಂಘಿಸುತ್ತಿದ್ದಾರೆ ಎಂದು ನಮಗೆ ಕಂಡುಬಂದರೆ."
    item4: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್‌ನ ಎಲ್ಲಾ ಸಾಫ್ಟ್‌ವೇರ್ ಮತ್ತು ಇಂಟರ್ನೆಟ್ ಸಂಪನ್ಮೂಲಗಳನ್ನು ಅವು ಉಪಯುಕ್ತವಾಗುತ್ತವೆ ಎಂಬ ಆಶಯದೊಂದಿಗೆ ನೀಡಲಾಗುತ್ತದೆ, ಆದರೆ ಯಾವುದೇ ಖಾತರಿಯಿಲ್ಲದೆ."
    item5: 'ಮೇಲಿನ ಅಂಶಗಳ ನಿಖರ ರೂಪಗಳು ಮತ್ತು ಕೆಲವು ಹೆಚ್ಚುವರಿ ಕಾನೂನು ನಿಯಮಗಳು ಹಾಗೂ ಷರತ್ತುಗಳಿಗಾಗಿ ದಯವಿಟ್ಟು ನಮ್ಮ %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service ನೋಡು.'
  bottom1: ಆಗಾಗ ಇಲ್ಲಿ ಮತ್ತೆ ನೋಡು, ಏಕೆಂದರೆ ನಾವು ನಮ್ಮ ಬಳಕೆಯ ನಿಯಮಗಳನ್ನು ಸುಧಾರಿಸಲು ಯಾವಾಗಲೂ ಪ್ರಯತ್ನಿಸುತ್ತಿದ್ದೇವೆ.
  bottom2: 'ಈ ಬಳಕೆಯ ನಿಯಮಗಳ ಬಗ್ಗೆ ಯಾವುದೇ ಸಲಹೆಗಳನ್ನು ದಯವಿಟ್ಟು %email-webmaster% ಗೆ ಮೇಲ್ ಮಾಡು.'
