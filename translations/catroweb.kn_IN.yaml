privacy-policy:
  header: ಗೌಪ್ಯತಾ ನೀತಿ
  version: ಆವೃತ್ತಿ 2.2, 17 ಅಕ್ಟೋಬರ್ 2019
  text1: ನಮ್ಮ ಸೇವೆಗಳ ಮತ್ತು ಸಂಬಂಧಿತ ಖಾತೆಯ ಎಲ್ಲಾ ಪ್ರಯೋಜನಗಳನ್ನು ನಿನಗೆ ನೀಡಲು, ನಿನ್ನಿಂದ ಕೆಲವು ಡೇಟಾ ಸಂಗ್ರಹಿಸುವುದು ಅಗತ್ಯ.
  text2: ನಮ್ಮ ಸೇವೆಗಳನ್ನು (ಆ್ಯಪ್‌ಗಳು ಮತ್ತು ವೆಬ್‌ಸೈಟ್‌ಗಳು) ನಿರ್ವಹಿಸಲು ಮತ್ತು ಸುಧಾರಿಸಲು ಹಾಗೂ ICT ಮತ್ತು STEM/STEAM ಶಿಕ್ಷಣದ ಬಗ್ಗೆ ವೈಜ್ಞಾನಿಕ ಸಂಶೋಧನೆ ನಡೆಸಲು, ನಮ್ಮ ಸೇವೆಗಳ ಬಳಕೆಯ ಬಗ್ಗೆ ಮೆಟಾಡೇಟಾ ಪಡೆಯಲು ನಾವು Google LLC (USA) ಯ Google Analytics, Crashlytics ಮತ್ತು Firebase ಹಾಗೂ Dynatrace LLC (USA) ಯ Dynatrace ಬಳಸುತ್ತೇವೆ, ಉದಾ. ಕ್ರ್ಯಾಶ್ ಮಾಹಿತಿ, ಸಮಯಮುದ್ರೆಗಳು, ಭೇಟಿ ನೀಡಿದ ಪುಟಗಳು/ಪರದೆಗಳು, ನಮ್ಮ ಆ್ಯಪ್‌ಗಳು ಮತ್ತು ಸೇವೆಗಳ ಬಳಕೆ, ಬಳಸಿದ ಆಪರೇಟಿಂಗ್ ಸಿಸ್ಟಮ್, ಮತ್ತು ನೆಟ್‌ವರ್ಕ್ ಪೂರೈಕೆದಾರರ ಮಾಹಿತಿ. ಈ ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ಸಂಗ್ರಹಿಸಿದ ಡೇಟಾ ನಿನ್ನ ಪ್ರೊಫೈಲ್‌ಗೆ ಸಂಬಂಧಿಸಿಲ್ಲ ಮತ್ತು ಯಾವುದೇ ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಒಳಗೊಂಡಿಲ್ಲ (IP ವಿಳಾಸದ ಕೊನೆಯ ಬಿಟ್‌ಗಳನ್ನು ಅನಾಮಧೇಯಗೊಳಿಸಲಾಗುತ್ತದೆ). ಆದರೆ, ಸಂಗ್ರಹಿಸಿದ ಡೇಟಾವನ್ನು ಸೇವಾ ಪೂರೈಕೆದಾರರಿಗೆ (Google LLC, USA ಮತ್ತು Dynatrace LLC, USA) ವರ್ಗಾಯಿಸಲಾಗುತ್ತದೆ. ಡೇಟಾ ಸಂಸ್ಕರಣೆ Google LLC ಮತ್ತು Dynatrace LLC ಯೊಂದಿಗಿನ ಒಪ್ಪಂದಗಳನ್ನು ಆಧರಿಸಿದೆ. ಸೇವಾ ಪೂರೈಕೆದಾರರೊಂದಿಗಿನ ಈ ಸಂಬಂಧವು ಯುರೋಪಿಯನ್ ಒಕ್ಕೂಟದ ಸಾಮಾನ್ಯ ಡೇಟಾ ಸಂರಕ್ಷಣಾ ನಿಯಂತ್ರಣ (EU GDPR) ಮತ್ತು EU-USA "Privacy Shield" ಒಪ್ಪಂದಕ್ಕೆ ಅನುಗುಣವಾಗಿದೆ.
  text3: ನಮ್ಮ ವ್ಯವಸ್ಥೆಗಳಲ್ಲಿ ಖಾತೆ ರಚಿಸಲು ಮತ್ತು ಬಳಸಲು, ಹಾಗೂ ನಿನ್ನ ಖಾತೆಗೆ ಸಂಬಂಧಿಸಿದ ಅಗತ್ಯ ಬದಲಾವಣೆಗಳ ಬಗ್ಗೆ ಇಮೇಲ್ ಮೂಲಕ ತಿಳಿಸಲು, ಉದಾ. ನಮ್ಮ ಬಳಕೆ ಮತ್ತು ಸೇವೆಯ ನಿಯಮಗಳು, ಸಮುದಾಯ ನಿಯಮಗಳು ಅಥವಾ ನೀತಿಗಳ ಅಪ್‌ಡೇಟ್‌ಗಳು ಅಥವಾ ಉಲ್ಲಂಘನೆಗಳು, ನಾವು ನಿನ್ನ ಬಳಕೆದಾರ ಹೆಸರನ್ನು ಮತ್ತು ನೀನು ನೀಡಿದ್ದರೆ ನಿನ್ನ ಇಮೇಲ್ ವಿಳಾಸವನ್ನು ಸಂಗ್ರಹಿಸುತ್ತೇವೆ. ನೀನು ನಿನ್ನ ಖಾತೆಯನ್ನು Google Plus ಅಥವಾ Facebook ಮೂಲಕ ಸಂಪರ್ಕಿಸಿದ್ದರೆ, ಆ ಸೇವೆಗಳಲ್ಲಿನ ನಿನ್ನ ಖಾತೆಗೆ ಸಂಬಂಧಿಸಿದ ಗುರುತಿನ ಕೀಯನ್ನು ಹೆಚ್ಚುವರಿಯಾಗಿ ಸಂಗ್ರಹಿಸುತ್ತೇವೆ. ನೀನು ಸ್ಪಷ್ಟವಾಗಿ ಅನುಮತಿಸದ ಹೊರತು, ನಾವು ಈ ಡೇಟಾವನ್ನು ಬೇರೆ ಯಾವುದೇ (ಉದಾ. ಮಾರ್ಕೆಟಿಂಗ್) ಉದ್ದೇಶಗಳಿಗೆ ಬಳಸುವುದಿಲ್ಲ.
  text4: ಸ್ವಯಂಪ್ರೇರಿತವಾಗಿ, ಹಂಚಿಕೆ ತಾಣದಲ್ಲಿನ ನಿನ್ನ ಖಾತೆ ಪುಟದ ಮೂಲಕ ನಿನ್ನ ವಾಸದ ದೇಶವನ್ನು ನಮಗೆ ನೀಡಬಹುದು. ಇದು ನಿನ್ನ ಸಾರ್ವಜನಿಕ ಪ್ರೊಫೈಲ್‌ನಲ್ಲಿ ಪ್ರದರ್ಶಿಸಲ್ಪಡುತ್ತದೆ ಮತ್ತು ನಾವು ಅಂಕಿಅಂಶ ಹಾಗೂ ಸಂಶೋಧನಾ ಉದ್ದೇಶಗಳಿಗೆ ಮಾತ್ರ ಬಳಸುತ್ತೇವೆ. ಇದನ್ನು ನಿನ್ನ ಪ್ರೊಫೈಲ್ ಸೆಟ್ಟಿಂಗ್‌ಗಳಲ್ಲಿ ಯಾವಾಗ ಬೇಕಾದರೂ ತೆಗೆದುಹಾಕಬಹುದು.
  text5: https://share.catrob.at/ ನಲ್ಲಿನ ನಿನ್ನ ಪ್ರೊಫೈಲ್ ಪುಟದ ಮೂಲಕ ನಿನ್ನ ಖಾತೆಯನ್ನು ಅಳಿಸಿ, ನಿನ್ನ ಖಾತೆಗೆ ಸೇರಿದ ವೈಯಕ್ತಿಕ ಡೇಟಾದ ಬಳಕೆಯನ್ನು ಯಾವಾಗ ಬೇಕಾದರೂ ಹಿಂಪಡೆಯಬಹುದು. ನಿನ್ನ ಖಾತೆ ಅಳಿಸಿದ ನಂತರವೂ ನೀನು ಒದಗಿಸಿದ ಸೇವೆಗಳನ್ನು ಬಳಸಬಹುದು, ಆದರೆ ಸಹಯೋಗ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ, ಉದಾ. ಪ್ರೋಗ್ರಾಂಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡುವುದು, ಕಾಮೆಂಟ್ ಮಾಡುವುದು ಅಥವಾ ಲೈಕ್ ಮಾಡುವುದು. ಅಲ್ಲದೆ, ನಿನ್ನ ಖಾತೆಗೆ ಸಂಬಂಧಿಸಿದ ಎಲ್ಲಾ ವಿಷಯಗಳು, ಉದಾ. ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಪ್ರೋಗ್ರಾಂಗಳು, ಕಾಮೆಂಟ್‌ಗಳು ಇತ್ಯಾದಿ ಅಳಿಸಲ್ಪಡುತ್ತವೆ.
  text6: ನಮ್ಮ ಸೇವೆಗಳ ದುರುಪಯೋಗವನ್ನು ತಪ್ಪಿಸಲು, ಉದಾ. ಕಾನೂನುಬಾಹಿರ ಉದ್ದೇಶಗಳಿಗಾಗಿ ಬಳಕೆದಾರರ ಅಪ್‌ಲೋಡ್‌ಗಳು ಅಥವಾ ಕಾಮೆಂಟ್‌ಗಳು, ಬಳಕೆದಾರರು ರಚಿಸಿದ ಎಲ್ಲಾ ಸಾರ್ವಜನಿಕ ಡೇಟಾವನ್ನು (ಅಪ್‌ಲೋಡ್‌ಗಳು, ಕಾಮೆಂಟ್‌ಗಳು) ಸಮಯಮುದ್ರೆ ಮತ್ತು ಬಳಸಿದ ಇಂಟರ್ನೆಟ್ ವಿಳಾಸದೊಂದಿಗೆ ಆಂತರಿಕವಾಗಿ ಡೇಟಾಬೇಸ್‌ನಲ್ಲಿ ಸಂಗ್ರಹಿಸಲಾಗುತ್ತದೆ. ಸಾಕಷ್ಟು ಕಾನೂನುಬಾಹಿರ ಕ್ರಿಯೆಗಳ ಬಗ್ಗೆ ಸಮಂಜಸವಾದ ಶಂಕೆ ಇದ್ದು, ಅಧಿಕೃತ ಕಾನೂನು ಸಂಸ್ಥೆಗಳು ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನ ಆಧಾರದ ಮೇಲೆ ಕೇಳದ ಹೊರತು, ಈ ಡೇಟಾವನ್ನು ಯಾವುದೇ ಸಂಸ್ಥೆಗಳು ಬಳಸುವುದಿಲ್ಲ ಅಥವಾ ಅವುಗಳಿಗೆ ರವಾನಿಸಲಾಗುವುದಿಲ್ಲ. ಪ್ರತಿ ಪ್ರಕರಣವನ್ನು ಮೊದಲು ನಾವು ವೈಯಕ್ತಿಕವಾಗಿ ಸಂಪೂರ್ಣವಾಗಿ ಪರಿಶೀಲಿಸುತ್ತೇವೆ.
  text7: MailChimp ಸೇವೆಯ (The Rocket Science Group LLC d/b/a MailChimp, USA) ಮೂಲಕ ನಾವು ಒದಗಿಸುವ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಸುದ್ದಿಪತ್ರಕ್ಕೆ https://catrob.at/newsletter ನಲ್ಲಿ ನೀನು ಸ್ವಯಂಪ್ರೇರಿತವಾಗಿ ಚಂದಾದಾರನಾಗಬಹುದು. ಆಗ ನೀನು ನೀಡಿದ ಇಮೇಲ್ ವಿಳಾಸಕ್ಕೆ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಪ್ರಾಜೆಕ್ಟ್ ಮತ್ತು ಅದರ ಸೇವೆಗಳ ಬಗ್ಗೆ ಅಪ್‌ಡೇಟ್‌ಗಳು ಬರುತ್ತವೆ. ಪ್ರತಿ ಸುದ್ದಿಪತ್ರದ ಅಡಿಭಾಗದಲ್ಲಿರುವ "unsubscribe" ಲಿಂಕ್ ಬಳಸಿ ಯಾವಾಗ ಬೇಕಾದರೂ ಸುದ್ದಿಪತ್ರವನ್ನು ನಿಲ್ಲಿಸಬಹುದು. ಈ ಸುದ್ದಿಪತ್ರವನ್ನು MailChimp ಒದಗಿಸುತ್ತದೆ, ಅವರೊಂದಿಗೆ ನಮಗೆ ಡೇಟಾ ಸಂಸ್ಕರಣಾ ಒಪ್ಪಂದವಿದೆ ಮತ್ತು ಅವರು EU ಸಾಮಾನ್ಯ ಡೇಟಾ ಸಂರಕ್ಷಣಾ ನಿಯಂತ್ರಣ ಹಾಗೂ EU-USA "Privacy Shield" ಗೆ ಬದ್ಧರಾಗಿದ್ದಾರೆ. MailChimp ಬಗ್ಗೆ ಹೆಚ್ಚಿನ ವಿವರಗಳಿಗಾಗಿ ದಯವಿಟ್ಟು MailChimp ನ ಗೌಪ್ಯತಾ ನೀತಿ ಮತ್ತು ಬಳಕೆಯ ನಿಯಮಗಳನ್ನೂ ನೋಡು.
  text8: ಎಲ್ಲಾ ಸೇವೆಗಳನ್ನು International Catrobat Association – Verein zur Förderung freier Software ಎಂಬ, ಗ್ರಾಜ್, ಆಸ್ಟ್ರಿಯಾ (ಯುರೋಪಿಯನ್ ಒಕ್ಕೂಟ) ದಲ್ಲಿ ನೋಂದಾಯಿತ ಲಾಭರಹಿತ NGO ಅಡಿಯಲ್ಲಿ, ಉಚಿತ ಮುಕ್ತ ಮೂಲ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಪ್ರಾಜೆಕ್ಟ್ ಒದಗಿಸುತ್ತದೆ. ನಮ್ಮ ನೀತಿಗಳು EU ಮತ್ತು ಆಸ್ಟ್ರಿಯನ್ ಡೇಟಾ ಸಂರಕ್ಷಣಾ ಕಾನೂನನ್ನು (GDPR) ಗೌರವಿಸುತ್ತವೆ. ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಲು, ದಯವಿಟ್ಟು contact@catrobat.org ಗೆ ಇಮೇಲ್ ಕಳುಹಿಸು ಅಥವಾ Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union) ಗೆ ಪತ್ರ ಬರೆ.
  text9: ನೀನು 14 ವರ್ಷದೊಳಗಿನವನಾಗಿದ್ದರೆ, ಈ ನೀತಿಯನ್ನು ಕಾನೂನುಬದ್ಧ ಪಾಲಕರು (ಸಾಮಾನ್ಯವಾಗಿ ಪೋಷಕರು) ಒಪ್ಪಿಕೊಳ್ಳಬೇಕು.
  text10: ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್‌ನ ಅಧಿಕೃತ ಇಂಗ್ಲಿಷ್ ಭಾಷೆಯ ಗೌಪ್ಯತಾ ನೀತಿ ವೆಬ್‌ನಲ್ಲಿ %privacy_policy% ನಲ್ಲಿ ಲಭ್ಯವಿದೆ.
  disagree-text: ಒಪ್ಪಿಗೆ ಇಲ್ಲದೆ ನಾವು ಖಾತೆ ರಚಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ, ಆದರೆ ಮುಖ್ಯ ವೈಶಿಷ್ಟ್ಯಗಳು ಈಗಲೂ ಲಭ್ಯವಿವೆ.
