consent:
  email:
    subject: "ನಿನ್ನ ಮಗುವಿನ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಖಾತೆಗೆ ಪೋಷಕರ ಒಪ್ಪಿಗೆ ಬೇಕು"
    title: "ಪೋಷಕರ ಒಪ್ಪಿಗೆ ಅಗತ್ಯವಿದೆ"
    greeting: "ನಮಸ್ಕಾರ,"
    message: "ನಿನ್ನ ಮಗು %username% ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್‌ನಲ್ಲಿ ಖಾತೆ ರಚಿಸಿದೆ ಮತ್ತು ತನ್ನ ಇಮೇಲ್ ವಿಳಾಸವನ್ನು ಪರಿಶೀಲಿಸಿದೆ."
    explanation: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಒಂದು ಉಚಿತ ಶೈಕ್ಷಣಿಕ ವೇದಿಕೆಯಾಗಿದ್ದು, ಇಲ್ಲಿ ಯುವಜನರು ಆ್ಯಪ್‌ಗಳು, ಆಟಗಳು ಮತ್ತು ಅನಿಮೇಷನ್‌ಗಳನ್ನು ರಚಿಸುತ್ತಾ ಕೋಡಿಂಗ್ ಕಲಿಯುತ್ತಾರೆ. EU ಮಕ್ಕಳ ರಕ್ಷಣಾ ನಿಯಮಗಳ ಪ್ರಕಾರ, ನಿನ್ನ ಮಗು ಸಮುದಾಯದಲ್ಲಿ ಪೂರ್ಣವಾಗಿ ಭಾಗವಹಿಸುವ ಮೊದಲು ನಮಗೆ ನಿನ್ನ ಒಪ್ಪಿಗೆ ಬೇಕು. ಒಪ್ಪಿಗೆ ನೀಡಲು ದಯವಿಟ್ಟು ಕೆಳಗಿನ ಬಟನ್ ಕ್ಲಿಕ್ ಮಾಡು."
    button: "ಪೋಷಕರ ಒಪ್ಪಿಗೆ ನೀಡು"
    ignore: "ನೀನು ಈ ಇಮೇಲ್ ನಿರೀಕ್ಷಿಸದಿದ್ದರೆ, ಇದನ್ನು ನಿರ್ಲಕ್ಷಿಸಬಹುದು. ಒಪ್ಪಿಗೆ ಇಲ್ಲದೆ, ಖಾತೆಯ ಕಾರ್ಯಗಳು ಸೀಮಿತವಾಗಿರುತ್ತವೆ."
    whatIsCatrobat: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಒಂದು ಉಚಿತ, ಲಾಭರಹಿತ ಶೈಕ್ಷಣಿಕ ಪ್ರೋಗ್ರಾಮಿಂಗ್ ವೇದಿಕೆ. ಹೆಚ್ಚಿನ ಮಾಹಿತಿಗೆ catrobat.org ನೋಡು."
    manageLink: 'ನಮ್ಮ <a href="%portalUrl%" style="color: #00acc1;">ಪೋಷಕರ ಪೋರ್ಟಲ್</a> ಮೂಲಕ ನೀನು ಯಾವಾಗ ಬೇಕಾದರೂ ನಿನ್ನ ಮಗುವಿನ ಖಾತೆಯನ್ನು ನಿರ್ವಹಿಸಬಹುದು. <a href="%infoUrl%" style="color: #00acc1;">ಪೋಷಕರಾಗಿ ನಿನ್ನ ಹಕ್ಕುಗಳ</a> ಬಗ್ಗೆ ಇನ್ನಷ್ಟು ತಿಳಿ.'
