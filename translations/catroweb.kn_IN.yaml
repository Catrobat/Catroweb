parent:
  footer:
    link: "ಪೋಷಕರು ಮತ್ತು ಪಾಲಕರು"
  info:
    title: "ಪೋಷಕರು ಮತ್ತು ಪಾಲಕರಿಗೆ ಮಾಹಿತಿ"
    intro: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಯುವ ಬಳಕೆದಾರರ ಸುರಕ್ಷತೆ ಮತ್ತು ಗೌಪ್ಯತೆಯನ್ನು ಗಂಭೀರವಾಗಿ ಪರಿಗಣಿಸುತ್ತದೆ. ನಾವು ನಿನ್ನ ಮಗುವನ್ನು ಹೇಗೆ ರಕ್ಷಿಸುತ್ತೇವೆ ಮತ್ತು ನಿನಗೆ ಯಾವ ಹಕ್ಕುಗಳಿವೆ ಎಂಬುದನ್ನು ಈ ಪುಟ ವಿವರಿಸುತ್ತದೆ."
    whatIsCatrobat:
      title: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಎಂದರೇನು?"
      text: "ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಒಂದು ಉಚಿತ, ಲಾಭರಹಿತ ಶೈಕ್ಷಣಿಕ ವೇದಿಕೆಯಾಗಿದ್ದು, ಇಲ್ಲಿ ಯುವಜನರು ತಮ್ಮದೇ ಆ್ಯಪ್‌ಗಳು, ಆಟಗಳು ಮತ್ತು ಅನಿಮೇಷನ್‌ಗಳನ್ನು ರಚಿಸುತ್ತಾ ಪ್ರೋಗ್ರಾಮಿಂಗ್ ಕಲಿಯುತ್ತಾರೆ. ಈ ವೇದಿಕೆ ವಿಶ್ವಾದ್ಯಂತ ಲಭ್ಯವಿದೆ ಮತ್ತು ಶೈಕ್ಷಣಿಕ ಸಂದರ್ಭಗಳಲ್ಲಿ ಬಳಸಲಾಗುತ್ತದೆ."
    dataCollected:
      title: "ನಾವು ಯಾವ ಡೇಟಾ ಸಂಗ್ರಹಿಸುತ್ತೇವೆ?"
      text: "ವೇದಿಕೆಯನ್ನು ನಡೆಸಲು ಅಗತ್ಯವಿರುವ ಕನಿಷ್ಠ ಡೇಟಾವನ್ನು ಮಾತ್ರ ನಾವು ಸಂಗ್ರಹಿಸುತ್ತೇವೆ: ಬಳಕೆದಾರ ಹೆಸರು, ಇಮೇಲ್ ವಿಳಾಸ, ಜನ್ಮ ದಿನಾಂಕ, ಮತ್ತು ನಿನ್ನ ಮಗು ರಚಿಸಿ ಅಪ್‌ಲೋಡ್ ಮಾಡುವ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳು. 14 ವರ್ಷದೊಳಗಿನ ಬಳಕೆದಾರರಿಗೆ, ಒಪ್ಪಿಗೆಯ ಉದ್ದೇಶಕ್ಕಾಗಿ ಪೋಷಕ/ಪಾಲಕರ ಇಮೇಲ್ ವಿಳಾಸವನ್ನೂ ಸಂಗ್ರಹಿಸುತ್ತೇವೆ. ನಾವು ವೈಯಕ್ತಿಕ ಡೇಟಾವನ್ನು ಮೂರನೇ ವ್ಯಕ್ತಿಗಳಿಗೆ ಮಾರುವುದಿಲ್ಲ ಅಥವಾ ಹಂಚಿಕೊಳ್ಳುವುದಿಲ್ಲ."
    yourRights:
      title: "ಪೋಷಕ ಅಥವಾ ಪಾಲಕನಾಗಿ ನಿನ್ನ ಹಕ್ಕುಗಳು"
      text: "EU ಮಕ್ಕಳ ರಕ್ಷಣಾ ನಿಯಮಗಳು (GDPR) ಮತ್ತು COPPA ಅಡಿಯಲ್ಲಿ, ನಿನಗೆ ಈ ಹಕ್ಕುಗಳಿವೆ: ನಿನ್ನ ಮಗುವಿನ ಬಗ್ಗೆ ನಾವು ಹೊಂದಿರುವ ಡೇಟಾವನ್ನು ಪರಿಶೀಲಿಸುವುದು, ಆ ಡೇಟಾದ ಪ್ರತಿಯನ್ನು ಕೇಳುವುದು, ಯಾವಾಗ ಬೇಕಾದರೂ ನಿನ್ನ ಒಪ್ಪಿಗೆಯನ್ನು ಹಿಂಪಡೆಯುವುದು (ಇದು ಖಾತೆಯನ್ನು ನಿರ್ಬಂಧಿಸುತ್ತದೆ), ಮತ್ತು ನಿನ್ನ ಮಗುವಿನ ಖಾತೆ ಹಾಗೂ ಸಂಬಂಧಿತ ಎಲ್ಲಾ ಡೇಟಾವನ್ನು ಶಾಶ್ವತವಾಗಿ ಅಳಿಸಲು ಕೇಳುವುದು."
    minorRestrictions:
      title: "ಅಪ್ರಾಪ್ತ ವಯಸ್ಕರ ಖಾತೆಗಳಿಗೆ ಯಾವ ನಿರ್ಬಂಧಗಳು ಅನ್ವಯಿಸುತ್ತವೆ?"
      text: "16 ವರ್ಷದೊಳಗಿನ ಬಳಕೆದಾರರು ಕಾಮೆಂಟ್‌ಗಳನ್ನು ಪೋಸ್ಟ್ ಮಾಡಲು ಅಥವಾ ಓದಲು, ಇತರ ಬಳಕೆದಾರರನ್ನು ಅನುಸರಿಸಲು, ಅಥವಾ ಮಕ್ಕಳಿಗೆ ಸೂಕ್ತವಲ್ಲ ಎಂದು ಗುರುತಿಸಲಾದ ವಿಷಯವನ್ನು ನೋಡಲು ಸಾಧ್ಯವಿಲ್ಲ. ಅವರು ಈಗಲೂ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳನ್ನು ರಚಿಸಬಹುದು ಮತ್ತು ಅಪ್‌ಲೋಡ್ ಮಾಡಬಹುದು, ಸಾರ್ವಜನಿಕ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳನ್ನು ನೋಡಬಹುದು ಮತ್ತು ಲೈಕ್‌ಗಳ ಮೂಲಕ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳಿಗೆ ಪ್ರತಿಕ್ರಿಯಿಸಬಹುದು. ಸುರಕ್ಷಿತ ಕಲಿಕೆಯ ವಾತಾವರಣ ಒದಗಿಸಲು ಈ ನಿರ್ಬಂಧಗಳಿವೆ."
    manageButton: "ನಿನ್ನ ಮಗುವಿನ ಖಾತೆ ನಿರ್ವಹಿಸು"
  portal:
    title: "ಪೋಷಕರ ಪೋರ್ಟಲ್"
    description: "ನಿನ್ನ ಮಗುವಿನ ಕ್ಯಾಟ್ರೊಬ್ಯಾಟ್ ಖಾತೆಯನ್ನು ನಿರ್ವಹಿಸಲು ಸುರಕ್ಷಿತ ಲಿಂಕ್ ಪಡೆಯಲು ನಿನ್ನ ಇಮೇಲ್ ವಿಳಾಸ ನಮೂದಿಸು. ನೋಂದಣಿಯ ಸಮಯದಲ್ಲಿ ನೀಡಿದ ಇಮೇಲ್ ವಿಳಾಸಕ್ಕೆ ಲಿಂಕ್ ಕಳುಹಿಸಲಾಗುತ್ತದೆ."
