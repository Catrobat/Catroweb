passwordRecovery:
  subject: Recuperación do teu contrasinal
  message: |
    Ola, %username%.
    Solicitaches restablecer o teu contrasinal en %appplication_url% porque o esqueciches.
    Se non o solicitaches, ignora esta mensaxe. Caducará e deixará de valer dentro de 24 horas.
    Para restablecer o teu contrasinal e crear un novo, visita a seguinte páxina: %confirmationUrl%
    Podes usar o teu nome de usuario e o teu contrasinal en calquera momento para acceder á comunidade %appplication_url%.
    Para iso, só tes que visitar a seguinte páxina: %loginPage%
    Para editar os datos do teu perfil, vai a esta páxina: %profilePage%
    Un saúdo,
    O equipo de Catrobat.
  messageHtml: |
    <p>
    Ola, %username%.<br>
    <br>
    Solicitaches restablecer o teu contrasinal en <a href="%appplication_url%">Pocket Code</a> porque o esqueciches.
    Se non o solicitaches, ignora esta mensaxe. Caducará e deixará de valer dentro de 24 horas.<br>
    <br>
    Para restablecer o teu contrasinal e crear un novo, preme <a href="%confirmationUrl%">aquí.</a><br>
    <br>
    Podes usar o teu nome de usuario e o teu contrasinal en calquera momento para acceder á comunidade <a href="%appplication_url%">Pocket Code</a>.<br>
    Para iso, só tes que visitar a seguinte páxina: <a href="%loginPage%">Páxina de inicio de sesión</a><br>
    Para editar os datos do teu perfil, vai a esta <a href="%profilePage%">páxina</a>.<br>
    <br>
    Un saúdo,<br>
    O equipo de Catrobat.
    </p>
