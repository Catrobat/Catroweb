consent:
  email:
    subject: 'Precísase o consentimento parental para a conta de Catrobat do teu fillo ou filla'
    title: 'Precísase o consentimento parental'
    greeting: 'Ola:'
    message: 'O teu fillo ou filla %username% creou unha conta en Catrobat e verificou o seu enderezo de correo electrónico.'
    explanation: 'Catrobat é unha plataforma educativa gratuíta onde a mocidade aprende a programar creando aplicacións, xogos e animacións. Segundo a normativa da UE de protección da infancia, precisamos o teu consentimento para que o teu fillo ou filla poida participar plenamente na comunidade. Preme o botón de abaixo para dar o teu consentimento.'
    button: 'Dar o consentimento parental'
    ignore: 'Se non esperabas este correo, podes ignoralo sen problema. Sen consentimento, a conta terá funcións limitadas.'
    whatIsCatrobat: 'Catrobat é unha plataforma educativa de programación gratuíta e sen ánimo de lucro. Máis información en catrobat.org.'
    manageLink: 'Podes xestionar a conta do teu fillo ou filla en calquera momento desde o noso <a href="%portalUrl%" style="color: #00acc1;">Portal para familias</a>. Infórmate sobre <a href="%infoUrl%" style="color: #00acc1;">os teus dereitos como pai ou nai</a>.'
  confirmed:
    title: 'Consentimento outorgado'
    message: 'Grazas! A conta de %username% xa está totalmente activada.'
    continueButton: 'Descubrir proxectos'
parent:
  footer:
    link: 'Familias e titores'
  info:
    title: 'Información para familias e titores'
    intro: 'Catrobat toma en serio a seguridade e a privacidade dos usuarios novos. Nesta páxina explicamos como protexemos o teu fillo ou filla e que dereitos tes.'
    whatIsCatrobat:
      title: 'Que é Catrobat?'
      text: 'Catrobat é unha plataforma educativa gratuíta e sen ánimo de lucro onde a mocidade aprende a programar creando as súas propias aplicacións, xogos e animacións. A plataforma está dispoñible en todo o mundo e úsase en contextos educativos.'
    dataCollected:
      title: 'Que datos recollemos?'
      text: 'Recollemos os datos mínimos necesarios para facer funcionar a plataforma: nome de usuario, enderezo de correo electrónico, data de nacemento e os proxectos que o teu fillo ou filla cree e suba. Para os usuarios menores de 14 anos, tamén gardamos o enderezo de correo electrónico dun pai, nai ou titor para fins de consentimento. Non vendemos nin compartimos datos persoais con terceiros.'
    yourRights:
      title: 'Os teus dereitos como pai, nai ou titor'
      text: 'Segundo a normativa da UE de protección da infancia (RXPD) e a COPPA, tes dereito a: revisar os datos que temos sobre o teu fillo ou filla, solicitar unha copia deses datos, retirar o teu consentimento en calquera momento (o que restrinxe a conta) e solicitar a eliminación definitiva da conta do teu fillo ou filla e de todos os datos asociados.'
    minorRestrictions:
      title: 'Que restricións se aplican ás contas de menores?'
      text: 'Os usuarios menores de 16 anos non poden publicar nin ler comentarios, seguir outros usuarios nin ver contido marcado como non apto para nenos. Si poden crear e subir proxectos, explorar proxectos públicos e reaccionar aos proxectos con "gústame". Estas restricións existen para ofrecer un ambiente de aprendizaxe seguro.'
    manageButton: 'Xestionar a conta do teu fillo ou filla'
  portal:
    title: 'Portal para familias'
    description: 'Introduce o teu enderezo de correo electrónico para recibir unha ligazón segura para xestionar a conta de Catrobat do teu fillo ou filla. A ligazón enviarase ao enderezo de correo electrónico que indicaches durante o rexistro.'
    emailLabel: 'O teu enderezo de correo electrónico'
    submitButton: 'Enviar a ligazón de xestión'
    infoLink: 'Máis información'
    success:
      title: 'Revisa a túa caixa de entrada'
      message: 'Se hai unha conta asociada a este correo, enviámosche unha ligazón de xestión. Revisa a túa caixa de entrada e segue a ligazón para xestionar a conta do teu fillo ou filla.'
  manage:
