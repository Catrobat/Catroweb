licenseToPlay:
  link: 'Licenza para xogar'
  title: 'Licenza para xogar - Recoñece méritos e comparte'
  text1: 'Imaxina que cada proxecto de Catrobat é unha torta, unha torta moi especial que vén coa súa receita (bloques de programación). Todos os membros da comunidade Catrobat comparten as súas tortas xunto coas súas receitas. Isto significa que podes gozar das tortas e aprender a facelas ti mesmo!'
  text2: 'Non hai receitas secretas: as instrucións sobre como facer estas tortas están á disposición de todos os usuarios, polo que calquera pode empregalas, modificalas e utilizalas como inspiración para novas ideas... quero dicir, tortas.'
  text3: 'Podes comer as tortas ou copiar as receitas doutros para facer a túa propia, quizais con ingredientes diferentes. Só precisas cumprir dous requisitos básicos:'
  text4: "Cando fundamos a comunidade Catrobat, decidimos adoptar este enfoque, xa que pensamos que fomenta a aprendizaxe e a creatividade na comunidade. Compartindo receitas e ingredientes (scripts e artwork), os usuarios poden desenvolver as ideas doutros e deste xeito todos saen beneficiados."
  text5: 'Ao deseñar o sitio web de Catrobat, incluímos funcións para animar a xente a compartir e a recoñecer o mérito dos demais. En cada páxina de proxecto podes descargar sempre os scripts orixinais do proxecto. Se remesturas un proxecto (modificando os scripts ou os deseños e compartindo o resultado), animámoste a recoñecer o mérito nas notas do proxecto, mencionando as persoas e o proxecto que te inspiraron.'
  text6: 'Máis información sobre as condicións de uso da comunidade en liña de Catrobat en %link-termsOfUse%.'
  list1:
    item1: 'Comparte as túas tortas xunto coa receita'
    item2: Recoñece o mérito daqueles nos que te inspiraches
  version: 'Versión 1.1, 2 de abril de 2013'
termsOfUse:
  title: Condicións de uso
  headline: Benvido á comunidade Catrobat!
  text1: 'Como parte da comunidade Catrobat, compartes proxectos e ideas con persoas:'
  text2: 'Precisamos da túa axuda para facer desta comunidade un lugar de apoio para todos os membros. Explicámosche como podes axudar:'
  text3: 'Co proxecto Catrobat queremos fomentar a cooperación e permitir que a creatividade de todos se combine en beneficio de toda a humanidade. Ti tamén podes converterte nun membro activo da comunidade Catrobat devolvendo os teus proxectos á comunidade como agasallo, do mesmo xeito que outros membros activos che dan os seus proxectos a ti:'
  text4: 'O noso regalo para ti:'
  text5: 'As nosas condicións de uso e servizo:'
  list1:
    item1: 'desde moitos países e culturas'
    item2: 'de todas as idades (desde nenos e adolescentes ata avós)'
    item3: con todos os niveis de experiencia
  list2:
    item1: 'Sé respectuoso. Cando compartas proxectos, lembra que persoas de idades e orixes moi diferentes verán as túas achegas.'
    item2: 'Recoñece o mérito. Podes facer versións modificadas dos proxectos doutras persoas, pero asegúrate de recoñecerllelo. Un lugar para facelo é a sección de créditos do teu proxecto. Consulta o parágrafo debaixo desta lista para máis detalles sobre como modificar proxectos doutros usuarios.'
    item3: "Sé honesto. Non pretendas ser alguén que non es ou tentes enganar á comunidade."
    item4: "Mantén a túa información persoal privada. Non compartas o teu enderezo de correo electrónico, número de teléfono ou outra información de contacto persoal."
    item5: 'Axuda a manter o sitio agradable. Se cres que outras persoas poderían considerar un proxecto ou comentario ofensivo, insultante, demasiado violento ou inapropiado doutro xeito, preme o botón ''denunciar como inapropiado'' e deixa unha breve explicación. O equipo de Catrobat revisará a túa denuncia e pode eliminar calquera proxecto, comentario ou publicación.'
  list3:
    item1: 'Ao subir un proxecto aos nosos sitios web, aceptas poñer ese traballo baixo certas licenzas libres dos proxectos de Catrobat subidos. Do mesmo xeito que as licenzas libres baixo as que tes dispoñible o propio sistema Catrobat, estas licenzas libres dos proxectos de Catrobat subidos dan a todo o mundo o dereito de aprender do traballo que outros subiron antes e de adaptalo e remesturalo para crear os seus propios xogos, animacións e outros proxectos novos e fascinantes. Isto permite que todos se ''suban aos ombreiros dos seus compañeiros'', e un deles es ti! Así, o teu traballo beneficiará a todo o mundo e seguirá sendo libre para que calquera o use, un pouco como os textos e imaxes que voluntarios de todo o mundo achegan libremente á Wikipedia. Considérao o teu agasallo á humanidade: ti dás a todos, e todos os demais que suben o seu traballo aos nosos sitios web dánche a ti. Así, un proxecto subido é un agasallo de gran valor que o seu propietario che dá gratis, coa condición de que participes na comunidade nas mesmas condicións.'
    item2: 'Non tes que aceptar o agasallo; se o aceptas, aplícanse certas regras. A vantaxe destas regras é que podes aprender do traballo e construír sobre el para facer cousas aínda máis chulas ti mesmo, que despois podes, por exemplo, volver subir aos nosos sitios web como túas. Outra vantaxe é que estas licenzas garanten que non se te poida responsabilizar dos problemas que lles xurdan a outros polo uso do teu proxecto.'
    item3: 'Unha condición adicional importante é que recoñezas claramente a autoría das persoas en cuxos traballos baseaches o teu. Ao mesmo tempo, esforzarémonos para que os demais recoñezan claramente que o teu traballo é unha achega túa, atribuíndoo ao nome único que escolliches libremente para representarte na comunidade Catrobat, e dándolles aos demais a oportunidade de expresarche publicamente a súa gratitude por teres dado o teu traballo a todos, e en especial a eles.'
    item4: 'Consulta %link-licenseUploaded% para ver os termos e condicións legais exactos.'
  list4:
    item1: 'Ofrecémosche, agora e no futuro, baixo as licenzas libres de Catrobat todo o noso software e recursos de Internet relacionados co sistema Catrobat, por exemplo, o software escrito polo equipo de Catrobat, os nosos sitios web e recursos de Internet, o noso propio código fonte relacionado co sistema Catrobat e todos os materiais adicionais incluídos, como imaxes, sons e textos.'
    item2: 'Estas licenzas fan que todas as partes de Catrobat sexan gratuítas para ti e tamén libres, no sentido de que tes liberdade para usalas como queiras, con só unhas poucas restricións que garanten, entre outras cousas, que o sistema Catrobat siga sendo sempre libre e útil para todos.'
    item3: 'Consulta %link-licenseToPlay% para ver os termos e condicións legais exactos. O código fonte do sistema Catrobat, así como moitos outros documentos e recursos, están dispoñibles en %link-developer%.'
  list5:
    item1: 'Se ti, ou os teus pais ou titores legais se tes menos de 13 anos, estades vinculados a unha organización implicada ou responsable de violacións masivas da privacidade e/ou de vixilancia masiva, non tes permitido usar as nosas aplicacións de software nin acceder aos nosos servizos. Os detalles exactos desta restrición e certas excepcións descríbense nas seccións 4.a e 4.b dos nosos %link-termsOfUse%.'
    item2: 'Se tes menos de 13 anos, tes que preguntarlles aos teus pais ou titores legais se che permiten usar as aplicacións de software e os servizos de Catrobat.'
    item3: 'Reservámonos o dereito de rexeitar, eliminar ou ocultar en calquera momento, ao noso criterio, proxectos, contas de usuario e calquera material dixital subido aos sitios web de Catrobat, por exemplo se vemos que un proxecto contén material inapropiado ou que un usuario infrinxe os dereitos doutras persoas.'
    item4: 'Todo o software e os recursos de Internet de Catrobat ofrécense coa esperanza de que sexan útiles, pero sen ningunha garantía.'
    item5: 'Consulta os nosos %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service para ver a redacción exacta dos puntos anteriores e algúns termos e condicións legais adicionais.'
  bottom1: 'Volve por aquí de cando en vez, porque sempre tentamos mellorar as nosas condicións de uso.'
  bottom2: 'Envía calquera suxestión sobre estas condicións de uso a %email-webmaster%.'
  version: 'Versión 1.3, 4 de marzo de 2014'
