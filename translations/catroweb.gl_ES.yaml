privacy-policy:
  header: Política de privacidade
  version: 'Versión 2.2, 17 de outubro de 2019'
  text1: 'Para ofrecerche todas as vantaxes dos nosos servizos e da conta asociada, é necesario recoller certos datos teus.'
  text2: 'Para manter e mellorar os nosos servizos (aplicacións e sitios web) e para facer investigación científica sobre a educación en TIC e STEM/STEAM, usamos Google Analytics, Crashlytics e Firebase, todos de Google LLC (EUA), así como Dynatrace de Dynatrace LLC (EUA), para obter metadatos sobre o uso dos nosos servizos, por exemplo, información sobre fallos, marcas de tempo, páxinas/pantallas visitadas, uso das nosas aplicacións e servizos, sistema operativo usado e información sobre o provedor de rede. Esta análise e os datos recollidos non están vinculados ao teu perfil e non conteñen ningunha información persoal (os últimos bits do enderezo IP anonimízanse). Porén, os datos recollidos transfírense aos provedores de servizos (Google LLC, EUA e Dynatrace LLC, EUA). O tratamento de datos baséase en acordos con Google LLC e Dynatrace LLC. Esta relación cos provedores de servizos cumpre o Regulamento xeral de protección de datos da Unión Europea (RXPD da UE) e o acordo UE-EUA "Privacy Shield".'
  text3: 'Para crear e usar unha conta nos nosos sistemas, e para informarte por correo electrónico de cambios necesarios na túa conta, por exemplo, actualizacións ou infraccións das nosas condicións de uso e servizo, das nosas normas da comunidade ou das nosas políticas, gardaremos o teu nome de usuario e, se nolo dás, o teu enderezo de correo electrónico. Se conectaches a túa conta mediante Google Plus ou Facebook, gardamos ademais unha clave de identificación vinculada á túa conta nestes servizos. Non usaremos estes datos para ningún outro fin (por exemplo, mercadotecnia), salvo que nolo permitas explicitamente.'
  text4: 'De forma voluntaria, podes indicarnos o teu país de residencia na páxina da túa conta no sitio para compartir. Amosarase no teu perfil público e só o usaremos con fins estatísticos e de investigación. Podes quitalo en calquera momento na configuración do teu perfil.'
  text5: 'Podes retirar en calquera momento o uso dos datos persoais da túa conta eliminando a túa conta desde a páxina do teu perfil en https://share.catrob.at/. Despois de eliminar a túa conta, poderás seguir usando os servizos ofrecidos, pero non colaborar, por exemplo, subindo programas, comentando ou dando "gústame". Ademais, eliminarase todo o contido vinculado á túa conta, por exemplo, programas subidos, comentarios, etc.'
  text6: 'Para evitar o mal uso dos nosos servizos, por exemplo, mediante subidas ou comentarios de usuarios con fins ilegais, todos os datos públicos xerados polos usuarios (subidas, comentarios) gárdanse internamente nunha base de datos, xunto cunha marca de tempo e o enderezo de Internet usado. Estes datos non os usará nin se lles enviarán a ningunha institución, salvo que haxa sospeitas razoables de accións suficientemente ilegais e institucións xurídicas oficialmente autorizadas os soliciten segundo a lei aplicable. Primeiro revisaremos a fondo cada caso de forma individual.'
  text7: 'Podes subscribirte voluntariamente ao boletín de Catrobat, en https://catrob.at/newsletter, que ofrecemos mediante o servizo MailChimp (The Rocket Science Group LLC d/b/a MailChimp, EUA). Recibirás entón novidades sobre o proxecto Catrobat e os seus servizos no enderezo de correo electrónico que indicaches. Podes darte de baixa do boletín en calquera momento usando a ligazón "unsubscribe" no pé de cada boletín. Este boletín ofrécese mediante MailChimp, co que temos un acordo de tratamento de datos e que se comprometeu co Regulamento xeral de protección de datos da UE e co "Privacy Shield" UE-EUA. Para máis detalles sobre MailChimp, consulta tamén a política de privacidade e as condicións de uso de MailChimp.'
  text8: 'Todos os servizos ofréceos o proxecto libre e de código aberto Catrobat baixo o paraugas da International Catrobat Association – Verein zur Förderung freier Software, unha ONG sen ánimo de lucro constituída en Graz, Austria (Unión Europea). As nosas políticas respectan a lexislación de protección de datos da UE e de Austria (RXPD). Para contactar connosco, envía un correo electrónico a contact@catrobat.org ou escríbenos a Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Unión Europea).'
  text9: 'Se tes menos de 14 anos, esta política debe aceptala un titor legal (normalmente o pai ou a nai).'
  text10: 'A política de privacidade oficial de Catrobat en inglés está dispoñible na web en %privacy_policy%.'
  disagree-text: 'Sen a túa aprobación non podemos crear unha conta, pero as funcións principais seguen dispoñibles.'
