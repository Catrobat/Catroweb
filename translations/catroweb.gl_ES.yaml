    title: 'Información para familias e titores'
    intro: 'Catrobat toma en serio a seguridade e a privacidade dos usuarios novos. Nesta páxina explicamos como protexemos o teu fillo ou filla e que dereitos tes.'
    whatIsCatrobat:
      title: 'Que é Catrobat?'
      text: 'Catrobat é unha plataforma educativa gratuíta e sen ánimo de lucro onde a mocidade aprende a programar creando as súas propias aplicacións, xogos e animacións. A plataforma está dispoñible en todo o mundo e úsase en contextos educativos.'
    dataCollected:
      title: 'Que datos recollemos?'
      text: 'Recollemos os datos mínimos necesarios para facer funcionar a plataforma: nome de usuario, enderezo de correo electrónico, data de nacemento e os proxectos que o teu fillo ou filla cree e suba. Para os usuarios menores de 14 anos, tamén gardamos o enderezo de correo electrónico dun pai, nai ou titor para fins de consentimento. Non vendemos nin compartimos datos persoais con terceiros.'
    yourRights:
      title: 'Os teus dereitos como pai, nai ou titor'
      text: 'Segundo a normativa da UE de protección da infancia (RXPD) e a COPPA, tes dereito a: revisar os datos que temos sobre o teu fillo ou filla, solicitar unha copia deses datos, retirar o teu consentimento en calquera momento (o que restrinxe a conta) e solicitar a eliminación definitiva da conta do teu fillo ou filla e de todos os datos asociados.'
    minorRestrictions:
      title: 'Que restricións se aplican ás contas de menores?'
      text: 'Os usuarios menores de 16 anos non poden publicar nin ler comentarios, seguir outros usuarios nin ver contido marcado como non apto para nenos. Si poden crear e subir proxectos, explorar proxectos públicos e reaccionar aos proxectos con "gústame". Estas restricións existen para ofrecer un ambiente de aprendizaxe seguro.'
