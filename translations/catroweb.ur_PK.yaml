licenseToPlay:
  link: کھیلنے کا لائسنس
  title: کھیلنے کا لائسنس - کریڈٹ دو اور شیئر کرو
  text1: سوچو کہ ہر Catrobat پروجیکٹ ایک کیک ہے، ایک بہت خاص کیک جو اپنی ترکیب (پروگرامنگ بلاکس) کے ساتھ آتا ہے۔ Catrobat کمیونٹی کے تمام ارکان اپنے کیک ان کی ترکیبوں کے ساتھ شیئر کرتے ہیں۔ اس کا مطلب ہے کہ تم کیک کا مزہ بھی لے سکتے ہو اور خود بنانا بھی سیکھ سکتے ہو!
  text2: 'کوئی خفیہ ترکیب نہیں ہے: یہ کیک بنانے کی ہدایات ہر کسی کے لیے کھلی ہیں کہ وہ انہیں استعمال کرے، دوبارہ استعمال کرے، بدلے، اور نئے خیالات کی... میرا مطلب ہے نئے کیکوں کی، تحریک کے طور پر لے۔'
  text3: 'تم کیک کھا بھی سکتے ہو اور دوسروں کی ترکیبیں کاپی کر کے اپنے کیک بھی بنا سکتے ہو، شاید مختلف اجزاء کے ساتھ۔ اس آزادی کے ساتھ دو آسان شرطیں ہیں:'
  text4: Catrobat کمیونٹی بناتے وقت ہم نے یہ طریقہ اپنانے کا فیصلہ کیا کیونکہ ہمیں یقین ہے کہ یہ کمیونٹی میں سیکھنے اور تخلیقی صلاحیت کو فروغ دیتا ہے۔ ترکیبیں اور اجزاء (اسکرپٹس اور آرٹ ورک) شیئر کر کے لوگ ایک دوسرے کے خیالات کو آگے بڑھا سکتے ہیں اور سب کو فائدہ ہوتا ہے۔
  text5: Catrobat ویب سائٹ ڈیزائن کرتے وقت ہم نے ایسی خصوصیات شامل کیں جو لوگوں کو شیئر کرنے اور دوسروں کو کریڈٹ دینے کی ترغیب دیتی ہیں۔ ہر پروجیکٹ کے صفحے پر تم ہمیشہ اس پروجیکٹ کے اصل اسکرپٹس ڈاؤن لوڈ کر سکتے ہو۔ اگر تم کسی پروجیکٹ کو ریمکس کرو (اسکرپٹس یا آرٹ ورک بدل کر نتیجہ شیئر کرو)، تو ہم چاہتے ہیں کہ تم پروجیکٹ کے نوٹس میں کریڈٹ دو اور ان لوگوں اور پروجیکٹ کا ذکر کرو جنہوں نے تمہیں متاثر کیا۔
  text6: Catrobat آن لائن کمیونٹی کے استعمال کی شرائط کے بارے میں %link-termsOfUse% پر مزید جانو۔
  list1:
    item1: اپنے کیک ترکیب کے ساتھ شیئر کرو
    item2: جنہوں نے تمہیں متاثر کیا انہیں کریڈٹ دو
  version: ورژن 1.1، 2 اپریل 2013
termsOfUse:
  title: استعمال کی شرائط
  headline: Catrobat کمیونٹی میں خوش آمدید!
  text1: 'Catrobat کمیونٹی کا حصہ ہونے کے ناطے تم ان لوگوں کے ساتھ پروجیکٹس اور خیالات شیئر کر رہے ہو جو:'
  text2: 'اس کمیونٹی کو ہر رکن کے لیے مددگار جگہ بنانے کے لیے ہمیں تمہاری مدد چاہیے۔ تم اس طرح مدد کر سکتے ہو:'
  text3: 'Catrobat پروجیکٹ کے ذریعے ہم تعاون کو فروغ دینا چاہتے ہیں اور سب کی تخلیقی صلاحیتوں کو پوری انسانیت کے فائدے کے لیے یکجا ہونے دینا چاہتے ہیں۔ تم بھی Catrobat کمیونٹی کے فعال رکن بن سکتے ہو، اپنے پروجیکٹس کمیونٹی کو تحفے کے طور پر واپس دے کر، بالکل ویسے ہی جیسے دوسرے فعال ارکان اپنے پروجیکٹس تمہیں دے رہے ہیں:'
  text4: 'ہماری طرف سے تمہارے لیے تحفہ:'
  text5: 'ہماری خدمات اور استعمال کی شرائط:'
  list1:
    item1: بہت سے مختلف ممالک اور ثقافتوں سے ہیں
    item2: ہر عمر کے ہیں (چھوٹے بچوں سے لے کر نوجوانوں اور دادا دادی تک)
    item3: ہر سطح کا تجربہ رکھتے ہیں
  list2:
    item1: احترام کرو۔ پروجیکٹس شیئر کرتے وقت یاد رکھو کہ بہت سی مختلف عمروں اور پس منظر کے لوگ تمہارا کام دیکھیں گے۔
    item2: کریڈٹ دو۔ دوسرے لوگوں کے پروجیکٹس کے بدلے ہوئے ورژن بنانے میں بلا جھجک آگے بڑھو - بس انہیں کریڈٹ دینا یقینی بناؤ۔ کریڈٹ دینے کی ایک جگہ تمہارے پروجیکٹ کا نوٹس اور کریڈٹس والا حصہ ہے۔ دوسرے صارفین کے پروجیکٹس بدلنے کے بارے میں تفصیلات کے لیے براہ کرم اس نقطوں والی فہرست کے نیچے والا پیراگراف دیکھو۔
    item3: ایماندار رہو۔ خود کو کوئی اور ظاہر نہ کرو اور کمیونٹی کو دھوکا دینے کی کوشش نہ کرو۔
    item4: ذاتی معلومات نجی رکھو۔ اپنا ای میل ایڈریس، فون نمبر یا دوسری ذاتی رابطے کی معلومات شیئر نہ کرو۔
    item5: سائٹ کو دوستانہ رکھنے میں مدد کرو۔ اگر تمہیں لگے کہ دوسروں کو کوئی پروجیکٹ یا تبصرہ برا، توہین آمیز، بہت پرتشدد یا کسی اور طرح نامناسب لگے گا، تو بس 'نامناسب کے طور پر رپورٹ کرو' بٹن پر کلک کرو اور مختصر وضاحت لکھ دو۔ Catrobat ٹیم تمہاری رپورٹ کا جائزہ لے گی اور کسی بھی پروجیکٹ، تبصرے یا پوسٹ کو ہٹا سکتی ہے۔
  list3:
    item1: 'ہماری ویب سائٹس پر پروجیکٹ اپ لوڈ کر کے تم اس کام کو اپ لوڈ شدہ Catrobat پروجیکٹس کے مخصوص مفت لائسنسوں کے تحت رکھنا قبول کرتے ہو اور اس سے اتفاق کرتے ہو۔ جیسے Catrobat سسٹم خود تمہیں مفت لائسنسوں کے تحت دستیاب ہے، ویسے ہی اپ لوڈ شدہ Catrobat پروجیکٹس کے یہ مفت لائسنس ہر کسی کو یہ حق دیتے ہیں کہ وہ دوسروں کے پہلے سے اپ لوڈ کیے گئے کام سے سیکھے، اور اس کام کو ڈھال کر اور ریمکس کر کے اپنے نئے دلچسپ گیمز، اینیمیشنز اور دوسرے پروجیکٹس بنائے۔ اس سے ہر کوئی ''اپنے ساتھیوں کے کندھوں پر کھڑا'' ہو سکتا ہے، اور ان ساتھیوں میں سے ایک تم ہو! اس طرح تمہارا کام پوری دنیا کو فائدہ دے گا اور سب کے استعمال کے لیے آزاد رہے گا، کچھ ویسے ہی جیسے دنیا بھر کے رضاکار Wikipedia میں آزادانہ طور پر متن اور تصاویر دیتے ہیں۔ اسے انسانیت کے لیے اپنا تحفہ سمجھو: تم سب کو دیتے ہو، اور وہ سب جو اپنا کام ہماری ویب سائٹس پر اپ لوڈ کرتے ہیں تمہیں دیتے ہیں۔ یوں ایک اپ لوڈ کیا گیا پروجیکٹ بہت قیمتی تحفہ ہے جو اس کا مالک تمہیں مفت دے رہا ہے، اس شرط کے ساتھ کہ تم بھی انہی شرائط پر کمیونٹی میں حصہ لو۔'
    item2: تمہیں یہ تحفہ قبول کرنا ضروری نہیں؛ اگر تم قبول کرتے ہو تو کچھ اصول لاگو ہوتے ہیں۔ ان اصولوں کا فائدہ یہ ہے کہ تم اس کام سے سیکھ سکتے ہو اور اس پر آگے بنا کر خود اس سے بھی زبردست چیزیں بنا سکتے ہو، جنہیں تم پھر، مثلاً، اپنے کام کے طور پر دوبارہ ہماری ویب سائٹس پر اپ لوڈ کر سکتے ہو۔ ایک اور فائدہ یہ ہے کہ یہ لائسنس یقینی بناتے ہیں کہ تمہارے پروجیکٹ کے استعمال سے دوسروں کو پیش آنے والے کسی مسئلے کے لیے تمہیں ذمہ دار نہیں ٹھہرایا جا سکتا۔
    item3: ایک اہم اضافی شرط یہ ہے کہ تم ان مصنفین کو واضح طور پر کریڈٹ دو جن کے کام پر تم نے اپنا کام بنایا۔ ساتھ ہی ہم پوری کوشش کریں گے کہ دوسرے واضح طور پر جانیں اور سراہیں کہ یہ کام تم نے دیا ہے، اس منفرد نام کے ذریعے جو تم نے Catrobat کی کمیونٹی میں اپنی پہچان کے لیے آزادانہ طور پر چنا ہے، اور دوسروں کو یہ موقع دے کر کہ وہ سب کو، اور خاص طور پر انہیں، اپنا کام دینے پر عوامی طور پر تمہارا شکریہ ادا کر سکیں۔
    item4: درست قانونی شرائط و ضوابط کے لیے براہ کرم %link-licenseUploaded% دیکھو۔
  list4:
    item1: ہم Catrobat سسٹم سے متعلق اپنے تمام سافٹ ویئر اور انٹرنیٹ وسائل، مثلاً Catrobat ٹیم کا لکھا ہوا سافٹ ویئر، ہماری ویب سائٹس اور انٹرنیٹ وسائل، Catrobat سسٹم سے متعلق ہمارا اپنا سورس کوڈ، اور تمام اضافی شامل مواد جیسے تصاویر، آوازیں اور متن، اب اور آئندہ بھی تمہیں Catrobat کے مفت لائسنسوں کے تحت پیش کرتے ہیں۔
    item2: یہ لائسنس Catrobat کے تمام حصوں کو تمہارے لیے مفت بھی بناتے ہیں اور اس معنی میں آزاد بھی کہ تم انہیں جیسے چاہو استعمال کر سکتے ہو، صرف چند پابندیوں کے ساتھ جو دوسری باتوں کے علاوہ یہ یقینی بناتی ہیں کہ Catrobat سسٹم ہمیشہ سب کے لیے آزاد اور مفید رہے۔
    item3: درست قانونی شرائط و ضوابط کے لیے براہ کرم %link-licenseToPlay% دیکھو۔ Catrobat سسٹم کا سورس کوڈ اور بہت سی دوسری دستاویزات اور وسائل %link-developer% پر دستیاب ہیں۔
  list5:
    item1: اگر تم، یا اگر تمہاری عمر 13 سال سے کم ہے تو تمہارے والدین یا قانونی سرپرست، کسی ایسی تنظیم سے وابستہ ہو جو بڑے پیمانے پر پرائیویسی کی خلاف ورزیوں اور/یا اجتماعی نگرانی میں ملوث یا اس کی ذمہ دار ہے، تو تمہیں ہماری سافٹ ویئر ایپلیکیشنز استعمال کرنے اور ہماری خدمات تک رسائی کی اجازت نہیں ہے۔ اس پابندی کی درست تفصیلات اور اس کی کچھ استثنائی صورتیں ہمارے %link-termsOfUse% کے سیکشن 4.a اور 4.b میں بیان کی گئی ہیں۔
    item2: اگر تمہاری عمر 13 سال سے کم ہے تو تمہیں اپنے والدین یا قانونی سرپرستوں سے پوچھنا ہوگا کہ کیا وہ تمہیں Catrobat کی سافٹ ویئر ایپلیکیشنز اور خدمات استعمال کرنے کی اجازت دیتے ہیں۔
    item3: ہم یہ حق محفوظ رکھتے ہیں کہ کسی بھی وقت اپنی مرضی سے Catrobat کی ویب سائٹس پر اپ لوڈ کیے گئے پروجیکٹس، صارف اکاؤنٹس اور کسی بھی ڈیجیٹل مواد کو مسترد، حذف یا چھپا دیں، مثلاً اگر ہمیں لگے کہ کسی پروجیکٹ میں نامناسب مواد ہے یا کوئی صارف دوسرے لوگوں کے حقوق کی خلاف ورزی کر رہا ہے۔
    item4: "کیٹروبیٹ کے تمام سافٹ ویئر اور انٹرنیٹ وسائل اس امید پیش کئے جاتے ہیں کہ وہ مفید ثابت ہونگے، لیکن بغیر کسی گارنٹی کے۔"
    item5: اوپر دیے گئے نکات کی درست عبارت اور کچھ اضافی قانونی شرائط و ضوابط کے لیے براہ کرم ہمارے %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service دیکھو۔
  bottom1: وقتاً فوقتاً یہاں دوبارہ دیکھتے رہو، کیونکہ ہم ہمیشہ اپنی استعمال کی شرائط کو بہتر بنانے کی کوشش کر رہے ہیں۔
  bottom2: استعمال کی ان شرائط کے بارے میں کوئی بھی تجویز براہ کرم %email-webmaster% پر ای میل کرو۔
  version: ورژن 1.3، 4 مارچ 2014
