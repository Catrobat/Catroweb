privacy-policy:
  header: پرائیویسی پالیسی
  version: ورژن 2.2، 17 اکتوبر 2019
  text1: تمہیں ہماری خدمات اور ان سے منسلک اکاؤنٹ کے تمام فوائد دینے کے لیے تم سے کچھ ڈیٹا جمع کرنا ضروری ہے۔
  text2: اپنی خدمات (ایپس اور ویب سائٹس) کو برقرار رکھنے اور بہتر بنانے، اور ICT اور STEM/STEAM تعلیم پر سائنسی تحقیق کے لیے ہم Google Analytics، Crashlytics اور Firebase (سب Google LLC، USA کے) نیز Dynatrace LLC (USA) کا Dynatrace استعمال کرتے ہیں تاکہ اپنی خدمات کے استعمال کے بارے میں میٹا ڈیٹا حاصل کریں، مثلاً کریش کی معلومات، ٹائم اسٹیمپس، دیکھے گئے صفحات/اسکرینز، ہماری ایپس اور خدمات کا استعمال، استعمال شدہ آپریٹنگ سسٹم، اور نیٹ ورک فراہم کنندہ کے بارے میں معلومات۔ یہ تجزیہ اور جمع کیا گیا ڈیٹا تمہاری پروفائل سے منسلک نہیں ہوتا اور اس میں کوئی ذاتی معلومات شامل نہیں ہوتیں (IP ایڈریس کے آخری حصے گمنام کر دیے جاتے ہیں)۔ تاہم، جمع کیا گیا ڈیٹا سروس فراہم کنندگان (Google LLC، USA اور Dynatrace LLC، USA) کو منتقل کیا جائے گا۔ ڈیٹا پروسیسنگ Google LLC اور Dynatrace LLC کے ساتھ معاہدوں کی بنیاد پر ہوتی ہے۔ سروس فراہم کنندگان کے ساتھ یہ تعلق یورپی یونین کے جنرل ڈیٹا پروٹیکشن ریگولیشن (EU GDPR) اور EU-USA "Privacy Shield" معاہدے کے مطابق ہے۔
  text3: ہمارے سسٹمز میں اکاؤنٹ بنانے اور استعمال کرنے، اور تمہیں ای میل کے ذریعے تمہارے اکاؤنٹ سے متعلق ضروری تبدیلیوں سے آگاہ کرنے کے لیے، مثلاً ہماری استعمال اور خدمات کی شرائط، کمیونٹی کے اصولوں یا پالیسیوں میں اپ ڈیٹس یا ان کی خلاف ورزیاں، ہم تمہارا صارف نام اور، اگر تم نے دیا ہو تو، تمہارا ای میل ایڈریس محفوظ کریں گے۔ اگر تم نے اپنا اکاؤنٹ Google Plus یا Facebook کے ذریعے جوڑا ہے تو ہم ان خدمات پر تمہارے اکاؤنٹ سے منسلک ایک شناختی کلید بھی محفوظ کرتے ہیں۔ ہم یہ ڈیٹا کسی اور مقصد (مثلاً مارکیٹنگ) کے لیے استعمال نہیں کریں گے، جب تک کہ تم نے ہمیں واضح طور پر اس کی اجازت نہ دی ہو۔
  text4: اپنی مرضی سے تم شیئرنگ سائٹ پر اپنے اکاؤنٹ کے صفحے کے ذریعے ہمیں اپنی رہائش کا ملک بتا سکتے ہو۔ یہ تمہاری عوامی پروفائل پر دکھایا جائے گا اور ہم اسے صرف اعداد و شمار اور تحقیق کے مقاصد کے لیے استعمال کریں گے۔ تم اسے کسی بھی وقت اپنی پروفائل کی سیٹنگز میں ہٹا سکتے ہو۔
  text5: تم https://share.catrob.at/ پر اپنی پروفائل کے صفحے کے ذریعے اپنا اکاؤنٹ حذف کر کے کسی بھی وقت اپنے اکاؤنٹ سے متعلق ذاتی ڈیٹا کا استعمال واپس لے سکتے ہو۔ اکاؤنٹ حذف کرنے کے بعد بھی تم فراہم کردہ خدمات استعمال کر سکو گے، لیکن تعاون نہیں کر سکو گے، مثلاً پروگرامز اپ لوڈ کرنا، تبصرے کرنا یا لائک کرنا۔ اس کے علاوہ تمہارے اکاؤنٹ سے منسلک تمام مواد، مثلاً اپ لوڈ کیے گئے پروگرامز، تبصرے وغیرہ، حذف کر دیے جائیں گے۔
  text6: ہماری خدمات کے غلط استعمال سے بچنے کے لیے، مثلاً صارفین کی طرف سے غیر قانونی مقاصد کے لیے اپ لوڈز یا تبصروں کے ذریعے، صارفین کا بنایا ہوا تمام عوامی ڈیٹا (اپ لوڈز، تبصرے) ٹائم اسٹیمپ اور استعمال شدہ انٹرنیٹ ایڈریس کے ساتھ اندرونی طور پر ایک ڈیٹا بیس میں محفوظ کیا جائے گا۔ یہ ڈیٹا کسی ادارے کو استعمال کے لیے نہیں دیا جائے گا اور نہ آگے بھیجا جائے گا، جب تک کہ کافی حد تک غیر قانونی کارروائیوں کا معقول شبہ نہ ہو اور سرکاری طور پر مجاز قانونی ادارے لاگو قانون کی بنیاد پر اس کی درخواست نہ کریں۔ ہر معاملے کی پہلے ہم انفرادی طور پر اچھی طرح جانچ کریں گے۔
  text7: تم اپنی مرضی سے https://catrob.at/newsletter پر Catrobat نیوز لیٹر سبسکرائب کر سکتے ہو، جو ہم MailChimp سروس (The Rocket Science Group LLC d/b/a MailChimp، USA) کے ذریعے فراہم کرتے ہیں۔ اس کے بعد تمہیں تمہارے دیے گئے ای میل ایڈریس پر Catrobat پروجیکٹ اور اس کی خدمات کے بارے میں اپ ڈیٹس ملیں گی۔ تم ہر نیوز لیٹر کے فوٹر میں "unsubscribe" لنک استعمال کر کے کسی بھی وقت نیوز لیٹر بند کر سکتے ہو۔ یہ نیوز لیٹر MailChimp فراہم کرتا ہے، جس کے ساتھ ہمارا ڈیٹا پروسیسنگ معاہدہ ہے اور جس نے EU جنرل ڈیٹا پروٹیکشن ریگولیشن اور EU-USA "Privacy Shield" کی پابندی کا عہد کیا ہے۔ MailChimp کے بارے میں مزید تفصیلات کے لیے براہ کرم MailChimp کی پرائیویسی پالیسی اور استعمال کی شرائط بھی دیکھو۔
  text8: 'تمام خدمات مفت اوپن سورس Catrobat پروجیکٹ فراہم کرتا ہے، جو International Catrobat Association – Verein zur Förderung freier Software کے تحت ہے، جو Graz، آسٹریا (یورپی یونین) میں رجسٹرڈ ایک غیر منافع بخش NGO ہے۔ ہماری پالیسیاں یورپی یونین اور آسٹریا کے ڈیٹا پروٹیکشن قانون (GDPR) کا احترام کرتی ہیں۔ ہم سے رابطہ کرنے کے لیے براہ کرم contact@catrobat.org پر ای میل بھیجو یا اس پتے پر خط لکھو: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union)۔'
  text9: اگر تمہاری عمر 14 سال سے کم ہے تو یہ پالیسی کسی قانونی سرپرست (عام طور پر والدین) کو قبول کرنی ہوگی۔
  text10: Catrobat کی سرکاری انگریزی پرائیویسی پالیسی ویب پر %privacy_policy% پر دستیاب ہے۔
  disagree-text: منظوری کے بغیر ہم اکاؤنٹ نہیں بنا سکتے، لیکن بنیادی خصوصیات پھر بھی دستیاب ہیں۔
