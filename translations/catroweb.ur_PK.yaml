parent:
  footer:
    link: والدین اور سرپرست
  info:
    title: والدین اور سرپرستوں کے لیے معلومات
    intro: Catrobat کم عمر صارفین کی حفاظت اور پرائیویسی کو سنجیدگی سے لیتا ہے۔ یہ صفحہ بتاتا ہے کہ ہم تمہارے بچے کی حفاظت کیسے کرتے ہیں اور تمہارے کیا حقوق ہیں۔
    whatIsCatrobat:
      title: Catrobat کیا ہے؟
      text: Catrobat ایک مفت، غیر منافع بخش تعلیمی پلیٹ فارم ہے جہاں نوجوان اپنی ایپس، گیمز اور اینیمیشنز بنا کر پروگرامنگ سیکھتے ہیں۔ یہ پلیٹ فارم دنیا بھر میں دستیاب ہے اور تعلیمی اداروں میں استعمال ہوتا ہے۔
    dataCollected:
      title: ہم کون سا ڈیٹا جمع کرتے ہیں؟
      text: 'ہم پلیٹ فارم چلانے کے لیے کم سے کم ضروری ڈیٹا جمع کرتے ہیں: صارف نام، ای میل ایڈریس، تاریخِ پیدائش، اور وہ پروجیکٹس جو تمہارا بچہ بناتا اور اپ لوڈ کرتا ہے۔ 14 سال سے کم عمر صارفین کے لیے ہم رضامندی کی خاطر والدین/سرپرست کا ای میل ایڈریس بھی محفوظ کرتے ہیں۔ ہم ذاتی ڈیٹا نہ بیچتے ہیں اور نہ ہی کسی تیسرے فریق کے ساتھ شیئر کرتے ہیں۔'
    yourRights:
      title: والدین یا سرپرست کے طور پر تمہارے حقوق
      text: 'یورپی یونین کے بچوں کے تحفظ کے قوانین (GDPR) اور COPPA کے تحت تمہیں یہ حق حاصل ہے کہ: تم ہمارے پاس موجود اپنے بچے کا ڈیٹا دیکھو، اس ڈیٹا کی کاپی مانگو، کسی بھی وقت اپنی رضامندی واپس لو (جس سے اکاؤنٹ محدود ہو جاتا ہے)، اور اپنے بچے کے اکاؤنٹ اور اس سے متعلق تمام ڈیٹا کو ہمیشہ کے لیے حذف کرنے کی درخواست کرو۔'
    minorRestrictions:
      title: نابالغ صارفین کے اکاؤنٹس پر کون سی پابندیاں ہیں؟
      text: 16 سال سے کم عمر صارفین تبصرے نہ لکھ سکتے ہیں نہ پڑھ سکتے ہیں، دوسرے صارفین کو فالو نہیں کر سکتے، اور بچوں کے لیے نامناسب نشان زد مواد نہیں دیکھ سکتے۔ وہ پھر بھی پروجیکٹس بنا اور اپ لوڈ کر سکتے ہیں، عوامی پروجیکٹس دیکھ سکتے ہیں، اور لائکس کے ذریعے پروجیکٹس پر ردعمل دے سکتے ہیں۔ یہ پابندیاں سیکھنے کا ایک محفوظ ماحول فراہم کرنے کے لیے ہیں۔
    manageButton: اپنے بچے کا اکاؤنٹ سنبھالو
  portal:
