privacy-policy:
  header: Політика конфіденційності
  version: Версія 2.2, 17 жовтня 2019 року
  text1: "Щоб запропонувати тобі всі переваги наших послуг і пов'язаного з ними облікового запису, нам потрібно зібрати від тебе певні дані."
  text2: "Для підтримки та вдосконалення наших послуг (застосунків та вебсайтів) і наукових досліджень з ІКТ та STEM/STEAM-освіти ми використовуємо Google Analytics, Crashlytics та Firebase, усі від Google LLC (США), а також Dynatrace від Dynatrace LLC (США), щоб отримувати метадані про використання наших послуг, наприклад інформацію про збої, позначки часу, відвідані сторінки/екрани, використання наших застосунків і послуг, операційну систему та інформацію про постачальника мережі. Цей аналіз і зібрані дані не пов'язані з твоїм профілем і не містять жодної особистої інформації (останні біти IP-адреси анонімізуються). Однак зібрані дані буде передано постачальникам послуг (Google LLC, США, і Dynatrace LLC, США). Обробка даних ґрунтується на договорах з Google LLC і Dynatrace LLC. Ці відносини з постачальниками послуг відповідають Загальному регламенту ЄС про захист даних (GDPR) та угоді «Щит конфіденційності» між ЄС та США."
  text3: "Для створення та використання облікового запису в наших системах, а також щоб повідомляти тебе електронною поштою про важливі зміни щодо твого облікового запису, наприклад оновлення або порушення наших Умов використання та послуг, наших правил спільноти чи нашої політики, ми зберігатимемо твоє ім'я користувача та, якщо ти її надав(-ла), твою адресу електронної пошти. Якщо ти підключив(-ла) свій обліковий запис через Google Plus або Facebook, ми додатково зберігаємо ідентифікаційний ключ, пов'язаний з твоїм обліковим записом у цих службах. Ми не використовуватимемо ці дані для жодних інших (наприклад, маркетингових) цілей, якщо ти явно не дозволиш нам це."
  text4: "За бажанням ти можеш вказати свою країну проживання на сторінці свого облікового запису на сайті. Вона відображатиметься у твоєму публічному профілі, і ми використовуватимемо її лише для статистичних і дослідницьких цілей. Її можна будь-коли видалити в налаштуваннях профілю."
  text5: "Ти можеш будь-коли припинити використання персональних даних, що належать твоєму обліковому запису, видаливши свій обліковий запис на сторінці профілю на https://share.catrob.at/. Після видалення облікового запису ти й надалі зможеш користуватися наданими послугами, але не зможеш долучатися, наприклад, завантажувати програми, коментувати чи ставити вподобайки. Крім того, весь наданий вміст, пов'язаний з твоїм обліковим записом, наприклад завантажені програми, коментарі тощо, буде видалено."
  text6: Щоб уникнути неправильного використання наших послуг, наприклад, за допомогою завантажень або коментарів користувачів для незаконних цілей, усі створені користувачем публічні дані (завантаження, коментарі) будуть зберігатися усередині бази даних разом із міткою часу та використаною інтернет-адресою. Ці дані не будуть використовуватися або передаватися будь-яким установам, якщо тільки в достатній мірі незаконні дії не будуть обґрунтовано підозрювані і офіційно уповноважені юридичні установи вимагатимуть їх на основі чинного законодавства. Кожен випадок буде ретельно перевірений на індивідуальній основі нами в першу чергу.
  text7: "Ти можеш за бажанням підписатися на розсилку новин Catrobat на https://catrob.at/newsletter, яку ми надаємо через сервіс MailChimp (The Rocket Science Group LLC d/b/a MailChimp, США). Тоді ти отримуватимеш новини про проєкт Catrobat та його послуги на вказану адресу електронної пошти. Ти можеш будь-коли відписатися від розсилки за посиланням «скасувати підписку» внизу кожного листа розсилки. Розсилку надає MailChimp, з яким у нас є угода про обробку даних і який взяв на себе зобов’язання щодо Загального регламенту ЄС про захист даних та «Щита конфіденційності» між ЄС та США. Більше інформації про MailChimp дивись у політиці конфіденційності та умовах використання MailChimp."
  text8: "Усі послуги надає безкоштовний проєкт Catrobat з відкритим вихідним кодом під егідою Міжнародної асоціації Catrobat – Verein zur Förderung freier Software, некомерційної неурядової організації, зареєстрованої в Граці, Австрія (Європейський Союз). Наша політика ґрунтується на законодавстві ЄС та Австрії про захист даних (GDPR). Щоб зв'язатися з нами, напиши на contact@catrobat.org або надішли нам листа на адресу: Catrobat, Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Австрія (Європейський Союз)."
  text9: "Якщо тобі ще не виповнилося 14 років, цю політику має прийняти твій законний опікун (як правило, один із батьків)."
  text10: Офіційна політика конфіденційності Catrobat англійською мовою доступна в Інтернеті під %privacy_policy%.
  disagree-text: Без схвалення ми не можемо створити обліковий запис, але основні функції усе ще доступні.
