    explanation: "Catrobat — це безкоштовна освітня платформа, де молодь вчиться програмувати, створюючи застосунки, ігри та анімації. Відповідно до правил ЄС щодо захисту дітей нам потрібна твоя згода, перш ніж твоя дитина зможе повноцінно брати участь у спільноті. Натисни кнопку нижче, щоб надати згоду."
    button: "Надати батьківську згоду"
    ignore: "Якщо ти не очікував(-ла) цього листа, просто проігноруй його. Без згоди функції облікового запису будуть обмежені."
    whatIsCatrobat: "Catrobat — це безкоштовна некомерційна освітня платформа для програмування. Дізнайся більше на catrobat.org."
    manageLink: "Ти можеш будь-коли керувати обліковим записом своєї дитини через наш <a href=\"%portalUrl%\" style=\"color: #00acc1;\">Портал для батьків</a>. Дізнайся більше про <a href=\"%infoUrl%\" style=\"color: #00acc1;\">свої права як батька чи матері</a>."
  confirmed:
    title: "Згоду надано"
    message: "Дякуємо! Обліковий запис %username% тепер повністю активовано."
    continueButton: "Відкривати проєкти"
parent:
  footer:
    link: "Батькам і опікунам"
  info:
    title: "Інформація для батьків і опікунів"
    intro: "Catrobat серйозно ставиться до безпеки та конфіденційності юних користувачів. На цій сторінці пояснено, як ми захищаємо твою дитину і які права ти маєш."
    whatIsCatrobat:
      title: "Що таке Catrobat?"
      text: "Catrobat — це безкоштовна некомерційна освітня платформа, де молодь вчиться програмувати, створюючи власні застосунки, ігри та анімації. Платформа доступна в усьому світі й використовується в навчальних закладах."
    dataCollected:
      title: "Які дані ми збираємо?"
      text: "Ми збираємо лише мінімум даних, потрібних для роботи платформи: ім’я користувача, адресу електронної пошти, дату народження та проєкти, які твоя дитина створює й завантажує. Для користувачів, молодших за 14 років, ми також зберігаємо адресу електронної пошти батьків чи опікуна для отримання згоди. Ми не продаємо і не передаємо персональні дані третім особам."
    yourRights:
      title: "Твої права як батьків чи опікуна"
      text: "Відповідно до правил ЄС щодо захисту дітей (GDPR) та COPPA ти маєш право: переглянути дані, які ми зберігаємо про твою дитину, запросити копію цих даних, будь-коли відкликати свою згоду (що обмежує обліковий запис) і вимагати остаточного видалення облікового запису дитини та всіх пов’язаних даних."
    minorRestrictions:
      title: "Які обмеження діють для облікових записів неповнолітніх?"
      text: "Користувачі, молодші за 16 років, не можуть писати й читати коментарі, підписуватися на інших користувачів або переглядати вміст, позначений як непридатний для дітей. Вони й надалі можуть створювати та завантажувати проєкти, переглядати публічні проєкти й ставити вподобайки. Ці обмеження діють, щоб забезпечити безпечне середовище для навчання."
    manageButton: "Керувати обліковим записом дитини"
  portal:
    title: "Портал для батьків"
    description: "Введи свою адресу електронної пошти, щоб отримати захищене посилання для керування обліковим записом Catrobat твоєї дитини. Посилання буде надіслано на адресу, яку вказали під час реєстрації."
    emailLabel: "Твоя адреса електронної пошти"
    submitButton: "Надіслати посилання для керування"
    infoLink: "Дізнатися більше"
    success:
      title: "Перевір свою пошту"
      message: "Якщо з цією адресою пов’язано обліковий запис, ми надіслали посилання для керування. Перевір пошту й перейди за посиланням, щоб керувати обліковим записом своєї дитини."
  manage:
    title: "Керування обліковими записами дітей"
    description: "Ти керуєш обліковими записами, пов’язаними з %email%."
    consentStatus: "Статус згоди"
    accountCreated: "Обліковий запис створено"
    email: "Електронна пошта дитини"
    status:
      granted: "Надано"
      pending: "На розгляді"
      revoked: "Відкликано"
    grantButton: "Надати згоду"
    revokeButton: "Відкликати згоду"
    revokeConfirm: "Ти справді хочеш відкликати згоду? Функції облікового запису будуть обмежені."
    exportButton: "Експортувати дані"
    deleteButton: "Видалити обліковий запис"
    deleteConfirm: "Ти справді хочеш остаточно видалити цей обліковий запис? Цю дію не можна скасувати."
  management:
    email:
      subject: "Керування обліковим записом Catrobat твоєї дитини"
      title: "Керування обліковим записом"
      greeting: "Привіт!"
      message: "Ти запросив(-ла) посилання для керування обліковим записом Catrobat своєї дитини (%usernames%). Натисни кнопку нижче, щоб переглянути обліковий запис і керувати ним."
      button: "Керувати обліковим записом"
      ignore: "Якщо ти цього не запитував(-ла), просто проігноруй цей лист."
passwordRecovery:
  subject: Відновлення пароля Catrobat
  message: |
    Привіт, %username%!
    Ти попросив(-ла) скинути пароль на %appplication_url%, оскільки забув(-ла) його.
    Якщо ти цього не просив(-ла), будь ласка, проігноруй це. Він закінчиться і стане марним через 24 години.
    Щоб скинути пароль і створити новий, відвідай наступну сторінку: %confirmationUrl%
    Ти можеш будь-коли використовувати своє імʼя користувача та пароль для доступу до спільноти %appplication_url%.
    Для цього просто відвідай наступну сторінку: %loginPage%
    Щоб змінити відомості про профіль, перейди на цю сторінку: %profilePage%
    З найщирішими побажаннями
    Команда Catrobat.
  messageHtml: |
    <p>
    Привіт, %username%!<br>
    <br>
    Ти запросив(-ла) скинути пароль в <a href="%appplication_url%">Pocket Code</a>, оскільки забув(-ла) його.
    Якщо ти цього не просив(-ла), будь ласка, проігноруй це. Він закінчиться і стане марним через 24 години. <br>
    <br>
    Щоб скинути пароль і створити новий, натисни <a href="%confirmationUrl%">тут</a>.<br>
    <br>
    Ти можеш використовувати своє імʼя користувача та пароль у будь-який час для доступу до спільноти <a href="%appplication_url%">Pocket Code</a>.<br>
    Для цього просто відвідай наступну сторінку: <a href="%loginPage%">Сторінка входу</a><br>
    Щоб змінити відомості профілю, перейди на цю <a href="%profilePage%">сторінку</a>.<br>
    <br>
    З найщирішими побажаннями<br>
    Команда Catrobat.
    </p>
