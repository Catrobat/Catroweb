licenseToPlay:
  link: 'Ліцензія на гру'
  title: "Ліцензія на гру — вказуй джерело і ділися"
  text1: "Уяви собі, що кожен проєкт Catrobat — це торт, дуже особливий торт, який поставляється зі своїм рецептом (блоками програмування). Усі члени спільноти Catrobat діляться своїми тортами разом зі своїми рецептами. Це означає, що ти можеш насолоджуватися тортами й навчитися робити їх самостійно!"
  text2: 'Немає ніяких секретних рецептів: інструкція про те, як зробити ці торти, відкрита для будь-кого, щоб використовувати, повторно використовувати, модифікувати та служити натхненням для нових ідей ... Я маю на увазі торти.'
  text3: "Ти можеш їсти торти, а також копіювати чужі рецепти, щоб зробити свій власний, можливо, з іншими інгредієнтами. Ця свобода має дві прості вимоги:"
  text4: "Створюючи спільноту Catrobat, ми вирішили прийняти цей підхід, оскільки вважаємо, що він підтримує навчання та творчість у спільноті. Ділячись рецептами та інгредієнтами (скриптами та виглядами), люди можуть спиратися на ідеї один одного, і кожен отримає користь."
  text5: "Розробляючи сайт Catrobat, ми додали функції, які заохочують людей ділитися та віддавати належне іншим. На кожній сторінці проєкту ти завжди можеш завантажити оригінальні скрипти проєкту. Якщо ти робиш ремікс проєкту (змінюєш скрипти чи вигляди та ділишся результатом), ми радимо тобі відзначити в примітках проєкту людей і проєкт, які тебе надихнули."
  text6: "Дізнайся більше про умови використання онлайн-спільноти Catrobat за цим посиланням: %link-termsOfUse%."
  list1:
    item1: "Ділися своїми тортами разом з рецептом"
    item2: "Віддай належне тим, хто тебе надихнув"
  version: Версія 1.1, 2 квітня 2013 р.
termsOfUse:
  title: Умови використання
  headline: Ласкаво просимо до спільноти Catrobat
  text1: "Як частина спільноти Catrobat, ти ділишся проєктами та ідеями з людьми:"
  text2: "Нам потрібна твоя допомога, щоб зробити цю спільноту приємним місцем для кожного учасника. Ось як ти можеш допомогти:"
  text3: "Завдяки проєкту Catrobat ми хочемо сприяти співпраці та дозволити творчості кожного об'єднатися на благо всього людства. Ти також можеш стати активним членом спільноти Catrobat, віддаючи свої проєкти назад спільноті як подарунок, так само як інші активні учасники дають тобі свої проєкти:"
  text4: "Наш подарунок тобі:"
  text5: 'Наші умови використання та послуги:'
  list1:
    item1: З різних країн і культур
    item2: Будь-якого віку (від маленьких дітей до підлітків і бабусь і дідусів)
    item3: з усіма рівнями досвіду
  list2:
    item1: "Будь шанобливим(-ою). Ділячись проєктами, пам'ятай, що твій внесок побачать люди різного віку та походження."
    item2: "Не забувай про авторів. Не соромся створювати змінені версії проєктів інших людей — просто не забудь віддати їм належне. Одне з місць, де можна віддати належне, — розділ приміток та авторів твого проєкту. Дивись абзац під цим маркованим списком, щоб дізнатися більше про зміну проєктів інших користувачів."
    item3: "Будь чесним(-ою). Не прикидайся кимось іншим і не намагайся обдурити спільноту."
    item4: "Зберігай особисту інформацію приватною. Не ділися своєю адресою електронної пошти, номером телефону або іншою особистою контактною інформацією."
    item5: "Допоможи зберегти сайт дружнім. Якщо ти вважаєш, що проєкт або коментар підлий, образливий, занадто жорстокий або іншим чином недоречний, просто натисни кнопку «поскаржитись як недоречний» і залиш коротке пояснення. Команда Catrobat перегляне твою скаргу і зможе видалити будь-який проєкт, коментар або публікацію."
  list3:
    item1: "Завантажуючи проєкт на наші вебсайти, ти приймаєш умову і погоджуєшся розмістити цю роботу під певними вільними ліцензіями для завантажених проєктів Catrobat. Подібно до вільних ліцензій, за якими тобі доступна сама система Catrobat, ці вільні ліцензії на завантажені проєкти Catrobat дають кожному право вчитися на роботах, раніше завантажених іншими, а також адаптувати й реміксувати їх, працюючи над створенням власних нових захопливих ігор, анімацій та інших проєктів. Це дозволяє кожному «стояти на плечах своїх однолітків», і один з них — ти! Таким чином твоя робота принесе користь усьому світу і залишиться вільною для всіх, трохи схоже на тексти й фотографії, які волонтери з усього світу вільно додають до Вікіпедії. Думай про це як про свій подарунок людству: ти даєш усім, і всі інші, хто завантажує свою роботу на наші вебсайти, дають тобі. Отже, завантажений проєкт — це подарунок великої цінності, який його власник безкоштовно дарує тобі з умовою, що ти береш участь у спільноті на тих самих умовах."
    item2: "Ти не зобов’язаний(-а) приймати подарунок; якщо ти це зробиш, діють певні правила. Перевага цих правил у тому, що ти можеш вчитися на роботі й спиратися на неї, щоб самостійно створити ще крутіші речі, які потім можеш, наприклад, знову завантажити на наші вебсайти як свої власні. Ще одна перевага в тому, що ці ліцензії гарантують, що ти не нестимеш відповідальності за будь-які проблеми, які виникнуть в інших через використання твого проєкту."
    item3: "Однією з важливих додаткових умов є те, що ти чітко вказуєш авторів, на роботах яких ґрунтується твоя власна робота. Водночас ми докладемо всіх зусиль, щоб інші чітко визнавали твій внесок, вказуючи унікальне ім’я, яке ти вільно обрав(-ла), щоб представляти себе в спільноті Catrobat, і даючи іншим можливість публічно висловити тобі вдячність за те, що ти поділився(-лася) своєю роботою з усіма, і особливо з ними."
    item4: "Точні юридичні умови дивись тут: %link-licenseUploaded%."
  list4:
    item1: "Ми пропонуємо тобі все наше власне програмне забезпечення та інтернет-ресурси, пов'язані з системою Catrobat, наприклад програмне забезпечення, написане командою Catrobat, наші вебсайти та інтернет-ресурси, наш власний вихідний код, пов'язаний з системою Catrobat, і всі додаткові матеріали, як-от зображення, звуки та тексти, зараз і в майбутньому, за вільними ліцензіями Catrobat."
    item2: "Ці ліцензії роблять усі частини Catrobat безплатними для тебе і водночас вільними — тобто дають тобі свободу використовувати їх так, як тобі подобається, лише з кількома обмеженнями, які гарантують, серед іншого, що система Catrobat назавжди залишиться вільною та корисною для всіх."
    item3: "Точні юридичні умови дивись тут: %link-licenseToPlay%. Вихідний код системи Catrobat, а також багато інших документів і ресурсів доступні через %link-developer%."
  list5:
    item1: "Якщо ти або (якщо тобі ще не виповнилося 13 років) твої батьки чи законні опікуни пов’язані з організацією, яка бере участь у масовому порушенні конфіденційності типу Dragnet та/або масовому стеженні чи несе за це відповідальність, тобі не дозволяється використовувати наші програмні застосунки та отримувати доступ до наших послуг. Точні деталі цього обмеження та деякі винятки з нього описано в розділах 4.a та 4.b наших %link-termsOfUse%."
    item2: "Якщо тобі ще не виповнилося 13 років, ти маєш запитати своїх батьків або законних опікунів, чи дозволяють вони тобі використовувати програмні застосунки та послуги Catrobat."
    item3: "Ми залишаємо за собою право відхиляти, видаляти або приховувати проєкти, облікові записи користувачів і будь-які цифрові матеріали, завантажені на сайти Catrobat в будь-який час на власний розсуд, наприклад, якщо ми виявимо, що проєкт містить невідповідні матеріали або що користувач порушує права інших осіб."
    item4: "Все програмне забезпечення та інтернет-ресурси Catrobat пропонуються в надії, що вони будуть корисні, але без будь-яких гарантій."
    item5: "Ознайомся з нашими повними умовами %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service, щоб побачити точні формулювання наведених вище пунктів та деякі додаткові юридичні положення й умови."
  bottom1: "Час від часу заглядай сюди, бо ми постійно намагаємося покращувати наші умови використання."
  bottom2: 'Надсилай будь-які пропозиції щодо цих Умов використання на %email-webmaster%.'
  version: Версія 1.3, 4 березня 2014
