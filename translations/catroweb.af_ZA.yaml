passwordRecovery:
  subject: Herstel van jou Catrobat-wagwoord
  message: |
    Liewe %username%.
    Jy het versoek om jou wagwoord op %appplication_url% terug te stel omdat jy jou wagwoord vergeet het.
    As jy dit nie versoek het nie, ignoreer dit asseblief. Dit sal binne 24 uur verval en onbruikbaar word.
    Besoek asseblief die volgende blad om jou wagwoord terug te stel en 'n nuwe een te skep: %confirmationUrl%
    Jy kan jou gebruikersnaam en wagwoord enige tyd gebruik om toegang tot die %appplication_url%-gemeenskap te kry.
    Besoek daarvoor net die volgende blad: %loginPage%
    Gaan na hierdie blad om jou profielbesonderhede te wysig: %profilePage%
    Groete,
    Jou Catrobat-span.
  messageHtml: |
    <p>
    Liewe %username%.<br>
    <br>
    Jy het versoek om jou wagwoord op <a href="%appplication_url%">Pocket Code</a> terug te stel omdat jy jou wagwoord vergeet het.
    As jy dit nie versoek het nie, ignoreer dit asseblief. Dit sal binne 24 uur verval en onbruikbaar word.<br>
    <br>
    Klik asseblief <a href="%confirmationUrl%">hier</a> om jou wagwoord terug te stel en 'n nuwe een te skep.<br>
    <br>
    Jy kan jou gebruikersnaam en wagwoord enige tyd gebruik om toegang tot die <a href="%appplication_url%">Pocket Code</a>-gemeenskap te kry.<br>
    Besoek daarvoor net die volgende blad: <a href="%loginPage%">Aantekenblad</a><br>
    Gaan na hierdie <a href="%profilePage%">blad</a> om jou profielbesonderhede te wysig.<br>
    <br>
    Groete,<br>
    Jou Catrobat-span.
    </p>
