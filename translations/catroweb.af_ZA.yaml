consent:
  email:
    subject: "Ouertoestemming nodig vir jou kind se Catrobat-rekening"
    title: "Ouertoestemming vereis"
    greeting: "Hallo,"
    message: "Jou kind %username% het 'n rekening op Catrobat geskep en sy of haar e-posadres geverifieer."
    explanation: "Catrobat is 'n gratis opvoedkundige platform waar jongmense leer programmeer deur apps, speletjies en animasies te skep. Volgens EU-regulasies vir kinderbeskerming het ons jou toestemming nodig voordat jou kind ten volle aan die gemeenskap kan deelneem. Klik asseblief op die knoppie hieronder om toestemming te gee."
    button: "Gee ouertoestemming"
    ignore: "As jy hierdie e-pos nie verwag het nie, kan jy dit veilig ignoreer. Sonder toestemming sal die rekening beperkte funksies hê."
    whatIsCatrobat: "Catrobat is 'n gratis, nie-winsgewende opvoedkundige programmeerplatform. Kom meer te wete by catrobat.org."
    manageLink: 'Jy kan jou kind se rekening enige tyd via ons <a href="%portalUrl%" style="color: #00acc1;">Ouerportaal</a> bestuur. Kom meer te wete oor <a href="%infoUrl%" style="color: #00acc1;">jou regte as ouer</a>.' #00acc1;">Parent Portal</a>. Learn more about <a href="%infoUrl%" style="color: #00acc1;">your rights as a parent</a>.'
  confirmed:
    title: "Toestemming gegee"
    message: "Dankie! %username% se rekening is nou ten volle geaktiveer."
    continueButton: "Ontdek projekte"
parent:
  footer:
    link: "Ouers en voogde"
  info:
    title: "Inligting vir ouers en voogde"
    intro: "Catrobat neem die veiligheid en privaatheid van jong gebruikers ernstig op. Hierdie blad verduidelik hoe ons jou kind beskerm en watter regte jy het."
    whatIsCatrobat:
      title: "Wat is Catrobat?"
      text: "Catrobat is 'n gratis, nie-winsgewende opvoedkundige platform waar jongmense leer programmeer deur hul eie apps, speletjies en animasies te skep. Die platform is wêreldwyd beskikbaar en word in onderwysomgewings gebruik."
    dataCollected:
      title: "Watter data versamel ons?"
      text: "Ons versamel die minimum data wat nodig is om die platform te bedryf: gebruikersnaam, e-posadres, geboortedatum en enige projekte wat jou kind skep en oplaai. Vir gebruikers onder 14 stoor ons ook 'n ouer/voog se e-posadres vir toestemmingsdoeleindes. Ons verkoop of deel nie persoonlike data met derde partye nie."
    yourRights:
      title: "Jou regte as ouer of voog"
      text: "Volgens EU-regulasies vir kinderbeskerming (GDPR) en COPPA het jy die reg om: die data wat ons oor jou kind hou, na te gaan, 'n afskrif van daardie data aan te vra, jou toestemming enige tyd terug te trek (wat die rekening beperk), en permanente skrapping van jou kind se rekening en alle verwante data aan te vra."
    minorRestrictions:
      title: "Watter beperkings geld vir rekeninge van minderjariges?"
      text: "Gebruikers onder 16 kan nie kommentaar plaas of lees, ander gebruikers volg of inhoud bekyk wat as nie geskik vir kinders gemerk is nie. Hulle kan steeds projekte skep en oplaai, deur publieke projekte blaai en met likes op projekte reageer. Hierdie beperkings is daar om 'n veilige leeromgewing te bied."
    manageButton: "Bestuur jou kind se rekening"
  portal:
    title: "Ouerportaal"
    description: "Voer jou e-posadres in om 'n veilige skakel te ontvang waarmee jy jou kind se Catrobat-rekening kan bestuur. Die skakel sal gestuur word na die e-posadres wat jy tydens registrasie verskaf het."
    emailLabel: "Jou e-posadres"
    submitButton: "Stuur bestuurskakel"
    infoLink: "Kom meer te wete"
    success:
      title: "Kyk in jou inkassie"
      message: "As 'n rekening aan hierdie e-posadres gekoppel is, het ons 'n bestuurskakel gestuur. Kyk asseblief in jou inkassie en volg die skakel om jou kind se rekening te bestuur."
  manage:
