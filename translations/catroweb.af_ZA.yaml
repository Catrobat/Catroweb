privacy-policy:
  header: Privaatheidsbeleid
  version: Weergawe 2.2, 17 Oktober 2019
  text1: Om jou al die voordele van ons dienste en die gepaardgaande rekening te bied, is dit nodig om sekere data van jou te versamel.
  text2: Om ons dienste (apps en webwerwe) in stand te hou en te verbeter en om wetenskaplike navorsing oor IKT- en STEM/STEAM-onderwys te doen, gebruik ons Google Analytics, Crashlytics en Firebase, almal van Google LLC (VSA), asook Dynatrace van Dynatrace LLC (VSA), om metadata oor die gebruik van ons dienste te kry, bv. omvalinligting, tydstempels, besoekte blaaie/skerms, gebruik van ons apps en dienste, die bedryfstelsel wat gebruik word, en inligting oor die netwerkverskaffer. Hierdie ontleding en die versamelde data is nie aan jou profiel gekoppel nie en bevat geen persoonlike inligting nie (die laaste bisse van die IP-adres word geanonimiseer). Die versamelde data word egter na die diensverskaffers (Google LLC, VSA en Dynatrace LLC, VSA) oorgedra. Dataverwerking is gebaseer op ooreenkomste met Google LLC en Dynatrace LLC. Hierdie verhouding met die diensverskaffers voldoen aan die Europese Unie se Algemene Databeskermingsregulasie (EU GDPR) en die EU-VSA "Privacy Shield"-ooreenkoms.
  text3: Om 'n rekening in ons stelsels te skep en te gebruik, en om jou per e-pos in te lig oor nodige veranderinge aan jou rekening, bv. opdaterings of oortredings van ons gebruiks- en diensvoorwaardes, ons gemeenskapsreëls of ons beleide, stoor ons jou gebruikersnaam en, indien jy dit verskaf, jou e-posadres. As jy jou rekening via Google Plus of Facebook gekoppel het, stoor ons ook 'n identifikasiesleutel wat aan jou rekening op daardie dienste gekoppel is. Ons sal hierdie data nie vir enige ander (bv. bemarkings-) doeleindes gebruik nie, tensy jy ons uitdruklik toestemming gegee het.
  text4: Op 'n vrywillige basis kan jy ons jou land van verblyf gee via jou rekeningblad op die deelwerf. Dit sal op jou publieke profiel vertoon word en slegs vir statistiese en navorsingsdoeleindes deur ons gebruik word. Dit kan enige tyd in jou profielinstellings verwyder word.
  text5: Jy kan die gebruik van die persoonlike data van jou rekening enige tyd terugtrek deur jou rekening via jou profielblad op https://share.catrob.at/ te skrap. Nadat jy jou rekening geskrap het, sal jy steeds die verskafde dienste kan gebruik, maar nie kan saamwerk nie, bv. deur programme op te laai, kommentaar te lewer of te like. Alle verskafde inhoud wat aan jou rekening gekoppel is, bv. opgelaaide programme, kommentaar ens., sal ook geskrap word.
  text6: Om misbruik van ons dienste te voorkom, bv. deur gebruikersbydraes of kommentaar vir onwettige doeleindes, word alle publieke data wat deur gebruikers gegenereer word (oplaaie, kommentaar) intern in 'n databasis gestoor, saam met 'n tydstempel en die gebruikte internetadres. Hierdie data sal nie deur enige instellings gebruik of aan hulle deurgestuur word nie, tensy voldoende onwettige optrede redelikerwys vermoed word en amptelik gemagtigde regsinstellings dit op grond van toepaslike wetgewing aanvra. Elke geval sal eers deeglik op 'n individuele basis deur ons nagegaan word.
  text7: Jy kan vrywillig inteken op die Catrobat-nuusbrief op https://catrob.at/newsletter, wat ons via die MailChimp-diens (The Rocket Science Group LLC d/b/a MailChimp, VSA) aanbied. Jy sal dan opdaterings oor die Catrobat-projek en sy dienste na jou verskafde e-posadres ontvang. Jy kan die nuusbrief enige tyd opsê deur die "unsubscribe"-skakel onderaan elke nuusbrief te gebruik. Hierdie nuusbrief word aangebied deur MailChimp, met wie ons 'n dataverwerkingsooreenkoms het en wat hulle verbind het tot die EU se Algemene Databeskermingsregulasie en EU-VSA "Privacy Shield". Vir meer besonderhede oor MailChimp, kyk ook na MailChimp se privaatheidsbeleid en gebruiksvoorwaardes.
  text8: Alle dienste word aangebied deur die gratis oopbron-Catrobat-projek onder die sambreel van die International Catrobat Association – Verein zur Förderung freier Software, 'n nie-winsgewende NRO wat in Graz, Oostenryk (Europese Unie) geïnkorporeer is. Ons beleide respekteer EU- en Oostenrykse databeskermingswetgewing (GDPR). Om met ons in verbinding te tree, stuur asseblief 'n e-pos na contact@catrobat.org of skryf aan Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Oostenryk (Europese Unie).
  text9: As jy jonger as 14 is, moet hierdie beleid deur 'n wettige voog (gewoonlik 'n ouer) aanvaar word.
  text10: Catrobat se amptelike Engelstalige privaatheidsbeleid is op die web beskikbaar by %privacy_policy%.
  disagree-text: Sonder goedkeuring kan ons nie 'n rekening skep nie, maar die kernfunksies is steeds toeganklik.
