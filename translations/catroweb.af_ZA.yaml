licenseToPlay:
  link: 'Lisensie om te speel'
  title: 'Lisensie om te speel - Gee erkenning en deel'
  text1: Stel jou voor elke Catrobat-projek is 'n koek, 'n baie spesiale koek wat saam met sy resep (programmeerblokke) kom. Alle lede van die Catrobat-gemeenskap deel hul koeke saam met hul resepte. Dit beteken jy kan die koeke geniet en leer hoe om hulle self te maak!
  text2: 'Daar is geen geheime resepte nie: die instruksies om hierdie koeke te maak is oop vir enigiemand om te gebruik, te hergebruik, aan te pas en as inspirasie vir nuwe idees te dien... ek bedoel koeke.'
  text3: "Jy kan die koeke eet en ook ander mense se resepte kopieer om jou eie te maak, miskien met ander bestanddele. Hierdie vryheid kom met twee eenvoudige vereistes:"
  text4: "Toe ons die Catrobat-gemeenskap opgestel het, het ons besluit om hierdie benadering te volg omdat ons glo dat dit leer en kreatiwiteit in die gemeenskap ondersteun. Deur resepte en bestanddele (skripte en kunswerk) te deel, kan mense op mekaar se idees bou en almal trek voordeel."
  text5: Met die ontwerp van die Catrobat-webwerf het ons funksies ingesluit om mense aan te moedig om te deel en erkenning aan ander te gee. Op elke projekblad kan jy altyd die oorspronklike skripte van die projek aflaai. As jy 'n projek remix (die skripte of kunswerk verander en die resultaat deel), moedig ons jou aan om in die projeknotas erkenning te gee aan die mense en projek wat jou geïnspireer het.
  text6: 'Kom meer te wete oor die gebruiksvoorwaardes van die Catrobat-aanlyngemeenskap op %link-termsOfUse%.'
  list1:
    item1: deel jou koeke saam met die resep
    item2: gee erkenning aan diegene wat jou geïnspireer het
  version: Weergawe 1.1, 2 April 2013
termsOfUse:
  title: Gebruiksvoorwaardes
  headline: Welkom by die Catrobat-gemeenskap!
  text1: 'As deel van die Catrobat-gemeenskap deel jy projekte en idees met mense:'
  text2: "Ons het jou hulp nodig om van hierdie gemeenskap 'n ondersteunende plek vir elke lid te maak. So kan jy help:"
  text3: "Deur die Catrobat-projek wil ons samewerking bevorder en almal se kreatiwiteit laat saamsmelt tot voordeel van die hele mensdom. Jy kan ook 'n aktiewe lid van die Catrobat-gemeenskap word deur jou projekte as 'n geskenk aan die gemeenskap terug te gee, net soos ander aktiewe lede hul projekte aan jou gee:"
  text4: 'Ons geskenk aan jou:'
  text5: 'Ons gebruiks- en diensvoorwaardes:'
  list1:
    item1: van baie verskillende lande en kulture
    item2: van alle ouderdomme (van jong kinders tot tieners en grootouers)
    item3: met alle vlakke van ervaring
  list2:
    item1: Wees respekvol. Wanneer jy projekte deel, onthou asseblief dat mense van baie verskillende ouderdomme en agtergronde jou bydraes sal sien.
    item2: "Gee erkenning. Voel vry om aangepaste weergawes van ander mense se projekte te maak - maak net seker dat jy hulle erkenning gee. Een plek om erkenning te gee is in jou projek se erkenningsafdeling. Sien die paragraaf onder hierdie lys vir besonderhede oor die aanpassing van ander gebruikers se projekte."
    item3: "Wees eerlik. Moenie voorgee dat jy iemand anders is nie en moenie probeer om die gemeenskap te kul nie."
    item4: "Hou persoonlike inligting privaat. Moenie jou e-posadres, telefoonnommer of ander persoonlike kontakinligting deel nie."
    item5: "Help om die werf vriendelik te hou. As jy voel dat ander 'n projek of kommentaar gemeen, beledigend, te gewelddadig of andersins onvanpas sou vind, klik net op die 'rapporteer as onvanpas'-knoppie en laat 'n kort verduideliking. Die Catrobat-span sal jou verslag nagaan en kan enige projek, kommentaar of plasing verwyder."
  list3:
    item1: "Deur 'n projek na ons webwerwe op te laai, aanvaar jy en stem jy in om hierdie werk onder sekere vrye lisensies vir opgelaaide Catrobat-projekte te plaas. Soortgelyk aan die vrye lisensies waaronder die Catrobat-stelsel self vir jou beskikbaar is, gee hierdie vrye lisensies vir opgelaaide Catrobat-projekte aan almal die reg om te leer uit werk wat voorheen deur ander opgelaai is, en om daardie werk aan te pas en te remix om hul eie nuwe, fassinerende speletjies, animasies en ander projekte te bou. Dit laat almal toe om 'op die skouers van hul eweknieë te staan', en een van hulle is jy! Jou werk sal dus die hele wêreld bevoordeel en vry bly vir almal om te gebruik, 'n bietjie soos teks en prente wat vrywilligers van oral oor die wêreld gratis tot Wikipedia bydra. Dink daaraan as jou geskenk aan die mensdom: jy gee aan almal, en almal wat hul werk na ons webwerwe oplaai, gee aan jou. 'n Opgelaaide projek is dus 'n geskenk van groot waarde wat die eienaar gratis aan jou gee, op voorwaarde dat jy op dieselfde voorwaardes aan die gemeenskap deelneem."
    item2: Jy hoef nie die geskenk te aanvaar nie; as jy dit wel doen, geld sekere reëls. Die voordeel van hierdie reëls is dat jy uit die werk kan leer en daarop kan bou om self nog cooler goed te maak, wat jy dan, bv., weer as jou eie na ons webwerwe kan oplaai. Nog 'n voordeel is dat hierdie lisensies verseker dat jy nie aanspreeklik gehou kan word vir enige probleme wat vir ander ontstaan deur hul gebruik van jou projek nie.
    item3: "Een belangrike bykomende voorwaarde is dat jy duidelik erkenning gee aan die outeurs op wie se werk jy jou eie werk gebaseer het. Terselfdertyd sal ons hard werk sodat ander duidelik sal sien dat jou werk deur jou bygedra is, deur erkenning te gee aan die unieke naam wat jy vrylik gekies het om jou in die Catrobat-gemeenskap te verteenwoordig, en deur ander die geleentheid te gee om in die openbaar hul dankbaarheid aan jou uit te spreek omdat jy jou werk aan almal, en veral aan hulle, gegee het."
    item4: 'Raadpleeg asseblief %link-licenseUploaded% vir die presiese regsbepalings en -voorwaardes.'
  list4:
    item1: "Ons bied al ons eie sagteware en internethulpbronne wat met die Catrobat-stelsel verband hou, bv. die sagteware wat deur die Catrobat-span geskryf is, ons webwerwe en internethulpbronne, ons eie bronkode wat met die Catrobat-stelsel verband hou, en alle bykomende ingeslote materiaal soos bv. prente, klanke en tekste, nou en in die toekoms aan jou onder Catrobat se vrye lisensies."
    item2: Hierdie lisensies maak alle dele van Catrobat vir jou gratis sowel as vry, in die sin dat jy die vryheid het om dit te gebruik soos jy wil, met slegs 'n paar beperkings wat onder meer verseker dat die Catrobat-stelsel vir altyd vry en nuttig vir almal sal bly.
    item3: 'Raadpleeg asseblief %link-licenseToPlay% vir die presiese regsbepalings en -voorwaardes. Die bronkode van die Catrobat-stelsel sowel as baie ander dokumente en hulpbronne is beskikbaar via %link-developer%.'
  list5:
    item1: 'As jy, of, as jy jonger as 13 jaar is, jou ouers of wettige voogde, verbonde is aan ''n organisasie wat betrokke is by of verantwoordelik is vir sleepnet-tipe privaatheidskendings en/of grootskaalse of massa-toesig, mag jy nie ons sagteware-toepassings gebruik of toegang tot ons dienste kry nie. Die presiese besonderhede van hierdie beperking en sekere uitsonderings daarop word in Afdelings 4.a en 4.b op ons %link-termsOfUse% uiteengesit.'
    item2: As jy jonger as 13 jaar is, moet jy jou ouers of wettige voogde vra of hulle jou toelaat om Catrobat se sagteware-toepassings en dienste te gebruik.
    item3: "Ons behou die reg voor om projekte, gebruikersrekeninge en enige digitale materiaal wat na Catrobat se webwerwe opgelaai is, enige tyd na ons eie goeddunke te verwerp, te skrap of te versteek, byvoorbeeld as ons vind dat 'n projek onvanpaste materiaal bevat of dat 'n gebruiker op die regte van ander persone inbreuk maak."
    item4: "Al Catrobat se sagteware en internethulpbronne word aangebied in die hoop dat dit nuttig sal wees, maar sonder enige waarborg."
    item5: 'Raadpleeg asseblief ons %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service vir presiese formulerings van bogenoemde punte en ''n paar bykomende regsbepalings en -voorwaardes.'
  bottom1: Kyk van tyd tot tyd weer hier, want ons probeer altyd om ons gebruiksvoorwaardes te verbeter.
  bottom2: 'Stuur asseblief enige voorstelle oor hierdie gebruiksvoorwaardes na %email-webmaster%.'
  version: Weergawe 1.3, 4 Maart 2014
