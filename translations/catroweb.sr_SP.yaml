    dataCollected:
      title: Које податке прикупљамо?
      text: 'Прикупљамо најмање податке потребне за рад платформе: корисничко име, имејл адресу, датум рођења и пројекте које твоје дете направи и отпреми. За кориснике млађе од 14 година чувамо и имејл адресу родитеља/старатеља ради сагласности. Личне податке не продајемо нити делимо са трећим лицима.'
    yourRights:
      title: Твоја права као родитеља или старатеља
      text: 'Према прописима ЕУ о заштити деце (GDPR) и COPPA, имаш право да: прегледаш податке које чувамо о твом детету, затражиш копију тих података, повучеш сагласност у било ком тренутку (што ограничава налог) и затражиш трајно брисање налога свог детета и свих повезаних података.'
    minorRestrictions:
      title: Која ограничења важе за налоге малолетника?
      text: Корисници млађи од 16 година не могу да пишу ни читају коментаре, прате друге кориснике нити гледају садржај означен као неприкладан за децу. И даље могу да праве и отпремају пројекте, прегледају јавне пројекте и реагују на пројекте лајковима. Ова ограничења постоје да би се обезбедило безбедно окружење за учење.
    manageButton: Управљај налогом свог детета
  portal:
    title: Портал за родитеље
    description: Унеси своју имејл адресу да би добио безбедан линк за управљање Catrobat налогом свог детета. Линк ће бити послат на имејл адресу коју си навео при регистрацији.
    emailLabel: Твоја имејл адреса
    submitButton: Пошаљи линк за управљање
    infoLink: Сазнај више
    success:
      title: Провери пријемно сандуче
      message: Ако је са овим имејлом повезан неки налог, послали смо линк за управљање. Провери пријемно сандуче и прати линк да би управљао налогом свог детета.
  manage:
    title: Управљање налозима деце
    description: Управљаш налозима повезаним са %email%.
    consentStatus: Статус сагласности
