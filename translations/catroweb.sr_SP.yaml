passwordRecovery:
  subject: Опоравак твоје Catrobat лозинке
  message: |
    Здраво %username%,
    Затражио си ресетовање лозинке на %appplication_url% јер си је заборавио.
    Ако ово ниси затражио, занемари ову поруку. Захтев ће истећи и постати неважећи за 24 сата.
    Да би ресетовао лозинку и направио нову, посети следећу страницу: %confirmationUrl%
    Својим корисничким именом и лозинком можеш у било ком тренутку приступити заједници %appplication_url%.
    Да би то урадио, само посети следећу страницу: %loginPage%
    Да би уредио податке свог профила, иди на ову страницу: %profilePage%
    Срдачан поздрав,
    Твој Catrobat тим.
  messageHtml: |
    <p>
    Здраво %username%,<br>
    <br>
    Затражио си ресетовање лозинке на <a href="%appplication_url%">Pocket Code</a> јер си је заборавио.
    Ако ово ниси затражио, занемари ову поруку. Захтев ће истећи и постати неважећи за 24 сата.<br>
    <br>
    Да би ресетовао лозинку и направио нову, кликни <a href="%confirmationUrl%">овде.</a><br>
    <br>
    Својим корисничким именом и лозинком можеш у било ком тренутку приступити <a href="%appplication_url%">Pocket Code</a> заједници.<br>
    Да би то урадио, само посети следећу страницу: <a href="%loginPage%">Страница за пријаву</a><br>
    Да би уредио податке свог профила, иди на ову <a href="%profilePage%">страницу</a>.<br>
    <br>
    Срдачан поздрав,<br>
    Твој Catrobat тим.
    </p>
