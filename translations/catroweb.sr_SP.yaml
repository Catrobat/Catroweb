licenseToPlay:
  link: 'Лиценца за игру'
  title: Лиценца за игру – наведи заслуге и дели
  text1: Замисли да је сваки Catrobat пројекат колач, веома посебан колач који долази са својим рецептом (програмским блоковима). Сви чланови Catrobat заједнице деле своје колаче заједно са рецептима. То значи да можеш уживати у колачима и научити да их сам правиш!
  text2: 'Нема тајних рецепата: упутства о томе како направити ове колаче су отворена за свакога ко их користи, поново користи, мења и служи као инспирација за нове идеје... Мислим на колаче.'
  text3: 'Можеш да једеш колаче, али и да копираш туђе рецепте да би направио своје, можда са другачијим састојцима. Ова слобода долази са два једноставна захтева:'
  text4: "Успостављајући Catrobat заједницу, одлучили смо се за овај приступ јер верујемо да подржава учење и креативност у заједници. Дељењем рецепата и састојака (скрипте и уметничка дела) људи могу надоградити идеје других и сви ће имати користи."
  text5: При осмишљавању Catrobat сајта додали смо функције које подстичу људе да деле и да наводе заслуге других. На страници сваког пројекта увек можеш преузети оригиналне скрипте пројекта. Ако ремиксујеш пројекат (измениш скрипте или графику и поделиш резултат), подстичемо те да наведеш заслуге у белешкама пројекта и поменеш људе и пројекат који су те инспирисали.
  text6: Сазнај више о условима коришћења Catrobat онлајн заједнице на %link-termsOfUse%.
  list1:
    item1: подели своје колаче заједно са рецептом
    item2: наведи оне који су те инспирисали
  version: Верзија 1.1, 2. април 2013.
termsOfUse:
  title: Услови коришћења
  headline: Добродошли у Catrobat заједницу!
  text1: 'Као део Catrobat заједнице, делиш пројекте и идеје са људима:'
  text2: 'Потребна нам је твоја помоћ да ова заједница постане место подршке за сваког члана. Ево како можеш да помогнеш:'
  text3: 'Кроз пројекат Catrobat желимо да подстакнемо сарадњу и омогућимо да се креативност свих споји на добробит целог човечанства. И ти можеш постати активан члан Catrobat заједнице тако што ћеш своје пројекте поклонити заједници, на исти начин на који ти други активни чланови поклањају своје пројекте:'
  text4: 'Наш поклон теби:'
  text5: 'Наши Услови коришћења и услуге:'
  list1:
    item1: из многих разних земаља и култура
    item2: свих узраста (од мале деце до тинејџера и бака и дека)
    item3: са свим нивоима искуства
  list2:
    item1: Буди пун поштовања. Када делиш пројекте, имај на уму да ће твоје доприносе видети људи различитих узраста и порекла.
    item2: Наведи заслуге. Слободно прави измењене верзије туђих пројеката – само обавезно наведи њихове ауторе. Једно место за то је одељак белешки и заслуга твог пројекта. Детаље о мењању пројеката других корисника прочитај у пасусу испод ове листе.
    item3: Буди искрен. Немој да се претвараш да си неко други или да покушаваш да превариш заједницу.
    item4: Чувај своје личне податке. Немој да делиш своју имејл адресу, број телефона или друге личне контакт податке.
    item5: Помози да сајт остане пријатељски. Ако мислиш да би други неки пројекат или коментар сматрали злобним, увредљивим, превише насилним или на други начин неприкладним, само кликни на дугме „пријави као неприкладно“ и остави кратко објашњење. Catrobat тим ће прегледати твоју пријаву и може уклонити било који пројекат, коментар или објаву.
  list3:
    item1: 'Отпремањем пројекта на наше сајтове прихваташ и пристајеш да ово дело ставиш под одређене слободне лиценце за отпремљене Catrobat пројекте. Слично слободним лиценцама под којима ти је доступан сам Catrobat систем, ове слободне лиценце отпремљених Catrobat пројеката свакоме дају право да учи из дела која су други раније отпремили и да та дела прилагођава и ремиксује како би направио сопствене нове, фасцинантне игре, анимације и друге пројекте. Тако свако може да „стоји на раменима својих вршњака“, а један од њих си и ти! Твоје дело ће тако користити целом свету и остати слободно за коришћење свима, слично тексту и сликама које добровољци из целог света слободно доприносе Википедији. Замисли то као свој поклон човечанству: ти дајеш свима, а сви остали који отпремају своја дела на наше сајтове дају теби. Отпремљени пројекат је зато поклон велике вредности који ти његов власник даје бесплатно, под условом да учествујеш у заједници под истим условима.'
    item2: Не мораш да прихватиш поклон; ако га прихватиш, важе одређена правила. Предност ових правила је што можеш да учиш из дела и надограђујеш га да би сам направио још кул ствари, које онда можеш, на пример, поново отпремити на наше сајтове као своје. Још једна предност је што ове лиценце обезбеђују да не можеш бити одговоран за проблеме који настану другима коришћењем твог пројекта.
    item3: Један важан додатни услов је да јасно наведеш ауторе на чијим делима си засновао своје дело. Истовремено ћемо се потрудити да други јасно цене твој допринос, тако што ћемо навести јединствено име које си слободно изабрао да те представља у Catrobat заједници и тако што ћемо другима пружити прилику да ти јавно изразе захвалност што си своје дело дао свима, а посебно њима.
    item4: За тачне правне услове погледај %link-licenseUploaded%.
  list4:
    item1: Сав наш софтвер и интернет ресурсе повезане са Catrobat системом, нпр. софтвер који је написао Catrobat тим, наше сајтове и интернет ресурсе, наш изворни код повезан са Catrobat системом и све додатне укључене материјале као што су, нпр., слике, звукови и текстови, нудимо ти сада и у будућности под Catrobat слободним лиценцама.
    item2: Ове лиценце чине све делове Catrobat-а бесплатним за тебе, али и слободним у смислу да ти дају слободу да их користиш како год желиш, уз само неколико ограничења која, између осталог, обезбеђују да Catrobat систем заувек остане слободан и користан за све.
    item3: За тачне правне услове погледај %link-licenseToPlay%. Изворни код Catrobat система, као и многи други документи и ресурси, доступни су преко %link-developer%.
  list5:
    item1: Ако си ти, или, ако си млађи од 13 година, твоји родитељи или законски старатељи, повезан са организацијом која учествује у масовном кршењу приватности и/или масовном надзору или је за њега одговорна, онда ти није дозвољено да користиш наше софтверске апликације и приступаш нашим услугама. Тачни детаљи овог ограничења и одређени изузеци од њега наведени су у одељцима 4.a и 4.b на нашим %link-termsOfUse%.
    item2: Ако си млађи од 13 година, мораш питати своје родитеље или законске старатеље да ли ти дозвољавају да користиш Catrobat софтверске апликације и услуге.
    item3: Задржавамо право да у било ком тренутку, по сопственом нахођењу, одбијемо, обришемо или сакријемо пројекте, корисничке налоге и било какве дигиталне материјале отпремљене на Catrobat сајтове, на пример ако утврдимо да пројекат садржи неприкладан материјал или да корисник крши права других особа.
    item4: Сав Catrobat софтвер и интернет ресурси нуде се у нади да ће бити корисни, али без икакве гаранције.
    item5: За тачне формулације горњих тачака и неке додатне правне услове погледај наше %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service.
  bottom1: Повремено се врати овде, јер стално покушавамо да побољшамо наше Услове коришћења.
  bottom2: Предлоге у вези са овим Условима коришћења пошаљи на %email-webmaster%.
  version: Верзија 1.3, 4. март 2014.
