privacy-policy:
  header: Правила о приватности
  version: Верзија 2.2, 17. октобар 2019.
  text1: Да бисмо ти понудили све предности наших услуга и припадајућег налога, неопходно је да прикупимо одређене податке о теби.
  text2: Да бисмо одржавали и унапређивали наше услуге (апликације и сајтове) и спроводили научна истраживања о ИКТ и STEM/STEAM образовању, користимо Google Analytics, Crashlytics и Firebase, све од компаније Google LLC (САД), као и Dynatrace компаније Dynatrace LLC (САД), да бисмо добили метаподатке о коришћењу наших услуга, нпр. информације о падовима, временске ознаке, посећене странице/екране, коришћење наших апликација и услуга, коришћени оперативни систем и информације о мрежном провајдеру. Ова анализа и прикупљени подаци нису повезани са твојим профилом и не садрже личне податке (последњи делови IP адресе се анонимизују). Међутим, прикупљени подаци се преносе пружаоцима услуга (Google LLC, САД и Dynatrace LLC, САД). Обрада података се заснива на уговорима са Google LLC и Dynatrace LLC. Овај однос са пружаоцима услуга усклађен је са Општом уредбом Европске уније о заштити података (EU GDPR) и споразумом ЕУ–САД „Privacy Shield“.
  text3: Да бисмо направили и користили налог у нашим системима и обавештавали те имејлом о неопходним променама у вези са твојим налогом, нпр. ажурирањима или кршењима наших Услова коришћења и услуге, правила заједнице или наших политика, чуваћемо твоје корисничко име и, ако си је навео, твоју имејл адресу. Ако си повезао свој налог преко Google Plus-а или Facebook-а, додатно чувамо идентификациони кључ повезан са твојим налогом на тим услугама. Ове податке нећемо користити ни у какве друге сврхе (нпр. маркетинг), осим ако нам то изричито не дозволиш.
  text4: Добровољно нам можеш навести државу у којој живиш преко странице свог налога на сајту за дељење. Она ће бити приказана на твом јавном профилу и користићемо је само у статистичке и истраживачке сврхе. Можеш је уклонити у било ком тренутку у подешавањима профила.
  text5: Коришћење личних података који припадају твом налогу можеш повући у било ком тренутку брисањем налога преко странице свог профила на https://share.catrob.at/. Након брисања налога и даље ћеш моћи да користиш понуђене услуге, али не и да сарађујеш, нпр. отпремањем програма, коментарисањем или лајковањем. Такође, сав садржај повезан са твојим налогом, нпр. отпремљени програми, коментари итд., биће обрисан.
  text6: Да бисмо спречили злоупотребу наших услуга, нпр. кроз отпремања или коментаре корисника у незаконите сврхе, сви јавни подаци које генеришу корисници (отпремања, коментари) чувају се интерно у бази података, заједно са временском ознаком и коришћеном интернет адресом. Ови подаци се неће користити нити прослеђивати ниједној институцији, осим ако постоји основана сумња на довољно незаконите радње и ако их службено овлашћене правне институције затраже на основу важећег закона. Сваки случај ћемо најпре појединачно и темељно проверити.
  text7: Можеш се добровољно претплатити на Catrobat билтен на https://catrob.at/newsletter, који пружамо преко услуге MailChimp (The Rocket Science Group LLC d/b/a MailChimp, САД). Тада ћеш на имејл адресу коју си навео добијати новости о пројекту Catrobat и његовим услугама. Билтен можеш отказати у било ком тренутку помоћу линка „unsubscribe“ у подножју сваког билтена. Билтен пружа MailChimp, са којим имамо уговор о обради података и који се обавезао на Општу уредбу ЕУ о заштити података и „Privacy Shield“ ЕУ–САД. За више детаља о MailChimp-у погледај и MailChimp-ову Политику приватности и Услове коришћења.
  text8: Све услуге пружа бесплатни пројекат отвореног кода Catrobat под окриљем удружења International Catrobat Association – Verein zur Förderung freier Software, непрофитне невладине организације регистроване у Грацу, Аустрија (Европска унија). Наше политике поштују закон ЕУ и Аустрије о заштити података (GDPR). Да би нас контактирао, пошаљи имејл на contact@catrobat.org или нам пиши на адресу Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Европска унија).
  text9: Ако си млађи од 14 година, ову политику мора да прихвати законски старатељ (обично родитељ).
  text10: Званична Catrobat политика приватности на енглеском језику доступна је на вебу на %privacy_policy%.
  disagree-text: Без сагласности не можемо да направимо налог, али основне функције су и даље доступне.
