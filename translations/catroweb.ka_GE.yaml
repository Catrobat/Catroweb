    title: "საჭიროა მშობლის თანხმობა"
    greeting: "გამარჯობა,"
    message: "შენმა შვილმა %username% შექმნა ანგარიში Catrobat-ზე და დაადასტურა თავისი ელფოსტის მისამართი."
    explanation: "Catrobat არის უფასო საგანმანათლებლო პლატფორმა, სადაც ახალგაზრდები სწავლობენ პროგრამირებას აპების, თამაშებისა და ანიმაციების შექმნით. ევროკავშირის ბავშვთა დაცვის რეგულაციების მიხედვით, საჭიროა შენი თანხმობა, სანამ შენი შვილი სრულად ჩაერთვება საზოგადოებაში. გთხოვ, თანხმობის მისაცემად დააწკაპუნე ქვემოთ მოცემულ ღილაკზე."
    button: "მშობლის თანხმობის მიცემა"
    ignore: "თუ ამ წერილს არ ელოდი, შეგიძლია უგულებელყო. თანხმობის გარეშე ანგარიშს შეზღუდული ფუნქციონალი ექნება."
    whatIsCatrobat: "Catrobat არის უფასო, არაკომერციული საგანმანათლებლო პროგრამირების პლატფორმა. გაიგე მეტი catrobat.org-ზე."
    manageLink: "შენი შვილის ანგარიშის მართვა ნებისმიერ დროს შეგიძლია ჩვენი <a href=\"%portalUrl%\" style=\"color: #00acc1;\">მშობლის პორტალით</a>. გაიგე მეტი <a href=\"%infoUrl%\" style=\"color: #00acc1;\">შენი, როგორც მშობლის, უფლებების</a> შესახებ."
