passwordRecovery:
  subject: "შენი Catrobat პაროლის აღდგენა"
  message: "ძვირფასო %username%.\nშენ მოითხოვე პაროლის აღდგენა %appplication_url%-ზე, რადგან დაგავიწყდა პაროლი.\nთუ ეს არ მოგითხოვია, უბრალოდ უგულებელყავი. ის 24 საათში ვადაგასული და გამოუსადეგარი გახდება.\nპაროლის აღსადგენად და ახლის შესაქმნელად ეწვიე შემდეგ გვერდს: %confirmationUrl%\nშენი მომხმარებლის სახელითა და პაროლით ნებისმიერ დროს შეგიძლია შეხვიდე %appplication_url%-ის საზოგადოებაში.\nამისთვის უბრალოდ ეწვიე შემდეგ გვერდს: %loginPage%\nპროფილის მონაცემების შესაცვლელად გადადი ამ გვერდზე: %profilePage%\nსაუკეთესო სურვილებით,\nშენი Catrobat-ის გუნდი.\n"
  messageHtml: "<p>\nძვირფასო %username%.<br>\n<br>\nშენ მოითხოვე პაროლის აღდგენა <a href=\"%appplication_url%\">Pocket Code</a>-ზე, რადგან დაგავიწყდა პაროლი.\nთუ ეს არ მოგითხოვია, უბრალოდ უგულებელყავი. ის 24 საათში ვადაგასული და გამოუსადეგარი გახდება.<br>\n<br>\nპაროლის აღსადგენად და ახლის შესაქმნელად დააწკაპუნე <a href=\"%confirmationUrl%\">აქ.</a><br>\n<br>\nშენი მომხმარებლის სახელითა და პაროლით ნებისმიერ დროს შეგიძლია შეხვიდე <a href=\"%appplication_url%\">Pocket Code</a>-ის საზოგადოებაში.<br>\nამისთვის უბრალოდ ეწვიე შემდეგ გვერდს: <a href=\"%loginPage%\">შესვლის გვერდი</a><br>\nპროფილის მონაცემების შესაცვლელად გადადი ამ <a href=\"%profilePage%\">გვერდზე</a>.<br>\n<br>\nსაუკეთესო სურვილებით,<br>\nშენი Catrobat-ის გუნდი.\n</p>\n"
