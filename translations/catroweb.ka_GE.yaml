  info:
    title: "ინფორმაცია მშობლებისა და მეურვეებისთვის"
    intro: "Catrobat სერიოზულად ეკიდება ახალგაზრდა მომხმარებლების უსაფრთხოებასა და კონფიდენციალურობას. ეს გვერდი განმარტავს, როგორ ვიცავთ შენს შვილს და რა უფლებები გაქვს."
    whatIsCatrobat:
      title: "რა არის Catrobat?"
      text: "Catrobat არის უფასო, არაკომერციული საგანმანათლებლო პლატფორმა, სადაც ახალგაზრდები სწავლობენ პროგრამირებას საკუთარი აპების, თამაშებისა და ანიმაციების შექმნით. პლატფორმა ხელმისაწვდომია მთელ მსოფლიოში და გამოიყენება საგანმანათლებლო გარემოში."
    dataCollected:
      title: "რა მონაცემებს ვაგროვებთ?"
      text: "ჩვენ ვაგროვებთ პლატფორმის მუშაობისთვის აუცილებელ მინიმალურ მონაცემებს: მომხმარებლის სახელს, ელფოსტის მისამართს, დაბადების თარიღს და ნებისმიერ პროექტს, რომელსაც შენი შვილი ქმნის და ატვირთავს. 14 წლამდე მომხმარებლებისთვის თანხმობის მიზნით ასევე ვინახავთ მშობლის/მეურვის ელფოსტის მისამართს. პერსონალურ მონაცემებს არ ვყიდით და არ ვუზიარებთ მესამე მხარეებს."
