licenseToPlay:
  link: "თამაშის ლიცენზია"
  title: "თამაშის ლიცენზია - მიუთითე ავტორი და გააზიარე"
  text1: "წარმოიდგინე, რომ ყოველი Catrobat პროექტი ტორტია, ძალიან განსაკუთრებული ტორტი, რომელსაც თან ახლავს თავისი რეცეპტი (პროგრამირების ბლოკები). Catrobat-ის საზოგადოების ყველა წევრი თავის ტორტებს რეცეპტებთან ერთად აზიარებს. ეს ნიშნავს, რომ შეგიძლია ისიამოვნო ტორტებით და თავადაც ისწავლო მათი მომზადება!"
  text2: "საიდუმლო რეცეპტები არ არსებობს: ამ ტორტების მომზადების ინსტრუქციები ღიაა ყველასთვის, რომ გამოიყენოს, ხელახლა გამოიყენოს, შეცვალოს და ახალი იდეების... ანუ ტორტების შთაგონებად აქციოს."
  text3: "შეგიძლია მიირთვა ტორტები და ასევე დააკოპირო სხვების რეცეპტები საკუთარის მოსამზადებლად, შესაძლოა სხვა ინგრედიენტებით. ამ თავისუფლებას ორი მარტივი პირობა ახლავს:"
  text4: "Catrobat-ის საზოგადოების შექმნისას გადავწყვიტეთ ეს მიდგომა აგვერჩია, რადგან გვჯერა, რომ ის ხელს უწყობს სწავლასა და შემოქმედებითობას საზოგადოებაში. რეცეპტებისა და ინგრედიენტების (სკრიპტებისა და გრაფიკის) გაზიარებით ადამიანებს შეუძლიათ ერთმანეთის იდეებზე დააშენონ და ყველა მოიგებს."
  text5: "Catrobat-ის ვებსაიტის შექმნისას დავამატეთ ფუნქციები, რომლებიც ადამიანებს გაზიარებისა და სხვების ავტორობის მითითებისკენ უბიძგებს. ყოველი პროექტის გვერდზე ყოველთვის შეგიძლია ჩამოტვირთო პროექტის ორიგინალი სკრიპტები. თუ პროექტს რემიქსს უკეთებ (ცვლი სკრიპტებს ან გრაფიკას და აზიარებ შედეგს), გირჩევთ პროექტის შენიშვნებში მიუთითო ავტორები და ახსენო ადამიანები და პროექტი, რომლებმაც შთაგაგონა."
  text6: "გაიგე მეტი Catrobat-ის ონლაინ საზოგადოების გამოყენების პირობების შესახებ აქ: %link-termsOfUse%."
  list1:
    item1: "გააზიარე შენი ტორტები რეცეპტთან ერთად"
    item2: "მიუთითე მათი ავტორობა, ვინც შთაგაგონა"
  version: "ვერსია 1.1, 2 აპრილი 2013"
termsOfUse:
  title: "გამოყენების პირობები"
  headline: "კეთილი იყოს შენი მობრძანება Catrobat-ის საზოგადოებაში!"
  text1: "როგორც Catrobat-ის საზოგადოების წევრი, შენ პროექტებსა და იდეებს უზიარებ ადამიანებს:"
  text2: "გვჭირდება შენი დახმარება, რომ ეს საზოგადოება ყველა წევრისთვის მხარდამჭერი ადგილი იყოს. აი, როგორ შეგიძლია დაგვეხმარო:"
  text3: "Catrobat-ის პროექტით გვინდა ხელი შევუწყოთ თანამშრომლობას და საშუალება მივცეთ ყველას შემოქმედებითობას გაერთიანდეს მთელი კაცობრიობის საკეთილდღეოდ. შენც შეგიძლია გახდე Catrobat-ის საზოგადოების აქტიური წევრი, თუ შენს პროექტებს საზოგადოებას საჩუქრად გადასცემ, ისევე როგორც სხვა აქტიური წევრები გაძლევენ შენ თავიანთ პროექტებს:"
  text4: "ჩვენი საჩუქარი შენთვის:"
  text5: "ჩვენი გამოყენებისა და მომსახურების პირობები:"
  list1:
    item1: "სხვადასხვა ქვეყნიდან და კულტურიდან"
    item2: "ყველა ასაკის (პატარა ბავშვებიდან მოზარდებამდე და ბებია-ბაბუებამდე)"
    item3: "გამოცდილების ყველა დონით"
  list2:
    item1: "იყავი პატივისცემით. პროექტების გაზიარებისას გახსოვდეს, რომ შენს ნამუშევრებს სხვადასხვა ასაკისა და წარმომავლობის ადამიანები ნახავენ."
    item2: "მიუთითე ავტორი. თამამად შექმენი სხვების პროექტების შეცვლილი ვერსიები - უბრალოდ აუცილებლად მიუთითე მათი ავტორობა. ავტორობის მითითება შეგიძლია შენი პროექტის შენიშვნებისა და კრედიტების განყოფილებაში. სხვა მომხმარებლების პროექტების შეცვლის დეტალებისთვის იხილე ამ სიის ქვემოთ მოცემული აბზაცი."
    item3: "იყავი გულწრფელი. ნუ იპრეტენზიებ, რომ სხვა ვინმე ხარ და ნუ ცდილობ საზოგადოების მოტყუებას."
    item4: "პერსონალური ინფორმაცია პირადად შეინახე. ნუ გააზიარებ შენს ელფოსტის მისამართს, ტელეფონის ნომერს ან სხვა პერსონალურ საკონტაქტო ინფორმაციას."
    item5: "დაგვეხმარე საიტის მეგობრულად შენარჩუნებაში. თუ ფიქრობ, რომ სხვები პროექტს ან კომენტარს ბოროტად, შეურაცხმყოფელად, ზედმეტად ძალადობრივად ან სხვაგვარად შეუსაბამოდ ჩათვლიან, უბრალოდ დააწკაპუნე ღილაკზე 'შეუსაბამოდ მონიშვნა' და დატოვე მოკლე განმარტება. Catrobat-ის გუნდი განიხილავს შენს რეპორტს და შეიძლება წაშალოს ნებისმიერი პროექტი, კომენტარი ან პოსტი."
  list3:
    item1: "ჩვენს ვებსაიტებზე პროექტის ატვირთვით შენ ეთანხმები, რომ ეს ნამუშევარი ატვირთული Catrobat პროექტების გარკვეული თავისუფალი ლიცენზიებით გავრცელდეს. ისევე როგორც თავისუფალი ლიცენზიები, რომლებითაც თავად Catrobat-ის სისტემაა შენთვის ხელმისაწვდომი, ატვირთული Catrobat პროექტების ეს თავისუფალი ლიცენზიები ყველას აძლევს უფლებას ისწავლოს სხვების მიერ ადრე ატვირთული ნამუშევრებიდან და მოარგოს და რემიქსი გაუკეთოს მათ საკუთარი ახალი საოცარი თამაშების, ანიმაციებისა და სხვა პროექტების შესაქმნელად. ეს ყველას საშუალებას აძლევს 'თანატოლების მხრებზე დადგეს', და ერთ-ერთი მათგანი შენ ხარ! ამრიგად, შენი ნამუშევარი მთელ მსოფლიოს გამოადგება და ყველასთვის თავისუფლად გამოსაყენებელი დარჩება, რაღაცით მსგავსად ტექსტებისა და სურათებისა, რომლებსაც მთელი მსოფლიოს მოხალისეები თავისუფლად აწვდიან Wikipedia-ს. წარმოიდგინე ეს, როგორც შენი საჩუქარი კაცობრიობისთვის: შენ აძლევ ყველას და ყველა სხვა, ვინც თავის ნამუშევარს ჩვენს ვებსაიტებზე ატვირთავს, გაძლევს შენ. ამრიგად, ატვირთული პროექტი დიდი ღირებულების საჩუქარია, რომელსაც მისი მფლობელი უფასოდ გაძლევს, იმ პირობით, რომ საზოგადოებაში იგივე პირობებით მიიღებ მონაწილეობას."
    item2: "საჩუქრის მიღება სავალდებულო არ არის; თუ მიიღებ, გარკვეული წესები მოქმედებს. ამ წესების უპირატესობა ისაა, რომ შეგიძლია ისწავლო ნამუშევრიდან და მასზე დაყრდნობით კიდევ უფრო მაგარი რამ შექმნა, რომელიც შემდეგ, მაგალითად, ისევ შეგიძლია ატვირთო ჩვენს ვებგვერდებზე, როგორც შენი საკუთარი. კიდევ ერთი უპირატესობა ისაა, რომ ეს ლიცენზიები უზრუნველყოფს, რომ შენ არ იყო პასუხისმგებელი იმ პრობლემებზე, რომლებიც სხვებს შენი პროექტის გამოყენებისას შეიძლება შეექმნათ."
    item3: "ერთი მნიშვნელოვანი დამატებითი პირობაა, რომ მკაფიოდ მიუთითო იმ ავტორების ვინაობა, რომელთა ნამუშევრებს დაეყრდენი შენს ნამუშევარში. ამავდროულად, ჩვენ ყველაფერს გავაკეთებთ, რომ სხვებმა მკაფიოდ დააფასონ შენი წვლილი — შენი უნიკალური სახელის მითითებით, რომელიც თავისუფლად აირჩიე Catrobat-ის საზოგადოებაში შენს წარმოსადგენად, და სხვებისთვის საშუალების მიცემით, საჯაროდ გამოხატონ მადლიერება იმისთვის, რომ შენი ნამუშევარი ყველას, და განსაკუთრებით მათ, გაუზიარე."
    item4: "ზუსტი სამართლებრივი პირობებისთვის გაეცანი %link-licenseUploaded%."
  list4:
    item1: "ჩვენ გთავაზობთ ჩვენს მთელ პროგრამულ უზრუნველყოფას და Catrobat-ის სისტემასთან დაკავშირებულ ინტერნეტ-რესურსებს, მაგ., Catrobat-ის გუნდის მიერ დაწერილ პროგრამებს, ჩვენს ვებგვერდებსა და ინტერნეტ-რესურსებს, Catrobat-ის სისტემასთან დაკავშირებულ ჩვენს საწყის კოდს და ყველა დამატებით მასალას, მაგ., სურათებს, ხმებსა და ტექსტებს, ახლა და მომავალში Catrobat-ის თავისუფალი ლიცენზიებით."
    item2: "ეს ლიცენზიები Catrobat-ის ყველა ნაწილს შენთვის უფასოს ხდის და ასევე თავისუფალს იმ გაგებით, რომ შეგიძლია ისინი ისე გამოიყენო, როგორც გინდა, მხოლოდ რამდენიმე შეზღუდვით, რომლებიც, სხვა საკითხებთან ერთად, უზრუნველყოფს, რომ Catrobat-ის სისტემა სამუდამოდ დარჩეს თავისუფალი და სასარგებლო ყველასთვის."
    item3: "ზუსტი სამართლებრივი პირობებისთვის გაეცანი %link-licenseToPlay%. Catrobat-ის სისტემის საწყისი კოდი და ბევრი სხვა დოკუმენტი და რესურსი ხელმისაწვდომია %link-developer%-ის მეშვეობით."
  list5:
    item1: "თუ შენ, ან, თუ 13 წლამდე ხარ, შენი მშობლები ან კანონიერი მეურვეები დაკავშირებული არიან ორგანიზაციასთან, რომელიც მონაწილეობს ან პასუხისმგებელია კონფიდენციალურობის მასობრივ დარღვევაზე და/ან მასობრივ თვალთვალზე, მაშინ არ გაქვს უფლება გამოიყენო ჩვენი პროგრამები და ჩვენი სერვისები. ამ შეზღუდვის ზუსტი დეტალები და მისი გარკვეული გამონაკლისები აღწერილია ჩვენი %link-termsOfUse%-ის 4.a და 4.b ნაწილებში."
    item2: "თუ 13 წლამდე ხარ, უნდა ჰკითხო შენს მშობლებს ან კანონიერ მეურვეებს, გაძლევენ თუ არა უფლებას, გამოიყენო Catrobat-ის პროგრამები და სერვისები."
    item3: "ჩვენ ვიტოვებთ უფლებას, ნებისმიერ დროს, საკუთარი შეხედულებისამებრ, უარვყოთ, წავშალოთ ან დავმალოთ პროექტები, მომხმარებლის ანგარიშები და Catrobat-ის ვებგვერდებზე ატვირთული ნებისმიერი ციფრული მასალა, მაგალითად, თუ აღმოვაჩენთ, რომ პროექტი შეუსაბამო მასალას შეიცავს ან მომხმარებელი სხვა პირების უფლებებს არღვევს."
    item4: "Catrobat-ის მთელი პროგრამული უზრუნველყოფა და ინტერნეტ-რესურსები შემოთავაზებულია იმ იმედით, რომ სასარგებლო იქნება, მაგრამ ყოველგვარი გარანტიის გარეშე."
    item5: "ზემოთ ჩამოთვლილი პუნქტების ზუსტი ფორმულირებებისა და ზოგიერთი დამატებითი სამართლებრივი პირობისთვის გაეცანი ჩვენს %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service."
