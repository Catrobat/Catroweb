  text1: "იმისთვის, რომ შემოგთავაზოთ ჩვენი სერვისებისა და მასთან დაკავშირებული ანგარიშის ყველა უპირატესობა, საჭიროა შენგან გარკვეული მონაცემების შეგროვება."
  text2: "ჩვენი სერვისების (აპებისა და ვებსაიტების) შესანარჩუნებლად და გასაუმჯობესებლად, ასევე ICT და STEM/STEAM განათლების სამეცნიერო კვლევისთვის, ვიყენებთ Google Analytics-ს, Crashlytics-ს და Firebase-ს (ყველა Google LLC, აშშ), ასევე Dynatrace-ს (Dynatrace LLC, აშშ), რათა მივიღოთ მეტამონაცემები ჩვენი სერვისების გამოყენების შესახებ, მაგ., ავარიების ინფორმაცია, დროის ნიშნულები, მონახულებული გვერდები/ეკრანები, ჩვენი აპებისა და სერვისების გამოყენება, გამოყენებული ოპერაციული სისტემა და ინფორმაცია ქსელის პროვაიდერის შესახებ. ეს ანალიზი და შეგროვებული მონაცემები არ არის დაკავშირებული შენს პროფილთან და არ შეიცავს პირად ინფორმაციას (IP მისამართის ბოლო ბიტები ანონიმიზდება). თუმცა შეგროვებული მონაცემები გადაეცემა სერვისის მიმწოდებლებს (Google LLC, აშშ და Dynatrace LLC, აშშ). მონაცემთა დამუშავება ეფუძნება შეთანხმებებს Google LLC-სა და Dynatrace LLC-სთან. ეს ურთიერთობა სერვისის მიმწოდებლებთან შეესაბამება ევროკავშირის მონაცემთა დაცვის ზოგად რეგულაციას (EU GDPR) და ევროკავშირი-აშშ-ის \"Privacy Shield\" შეთანხმებას."
  text3: "ჩვენს სისტემებში ანგარიშის შესაქმნელად და გამოსაყენებლად, ასევე შენი ანგარიშის შესახებ აუცილებელი ცვლილებების შესახებ ელფოსტით შესატყობინებლად, მაგ., განახლებები ან ჩვენი გამოყენების პირობების, საზოგადოების წესების ან პოლიტიკის დარღვევები, ჩვენ შევინახავთ შენს მომხმარებლის სახელს და, თუ მოგვაწვდი, შენს ელფოსტის მისამართს. თუ შენი ანგარიში დაკავშირებულია Google Plus-ით ან Facebook-ით, დამატებით ვინახავთ ამ სერვისებზე შენს ანგარიშთან დაკავშირებულ საიდენტიფიკაციო გასაღებს. ამ მონაცემებს არ გამოვიყენებთ სხვა (მაგ., მარკეტინგული) მიზნებისთვის, თუ ამის უფლებას პირდაპირ არ მოგვცემ."
  text4: "ნებაყოფლობით შეგიძლია მოგვაწოდო შენი საცხოვრებელი ქვეყანა გაზიარების საიტზე შენი ანგარიშის გვერდის მეშვეობით. ის გამოჩნდება შენს საჯარო პროფილზე და ჩვენ მას მხოლოდ სტატისტიკური და კვლევითი მიზნებისთვის გამოვიყენებთ. მისი წაშლა ნებისმიერ დროს შეგიძლია პროფილის პარამეტრებში."
  text5: "შენს ანგარიშთან დაკავშირებული პირადი მონაცემების გამოყენებაზე თანხმობის გაუქმება ნებისმიერ დროს შეგიძლია, თუ წაშლი შენს ანგარიშს პროფილის გვერდიდან https://share.catrob.at/-ზე. ანგარიშის წაშლის შემდეგ კვლავ შეძლებ მოწოდებული სერვისების გამოყენებას, მაგრამ ვერ ითანამშრომლებ, მაგ., პროგრამების ატვირთვით, კომენტარებით ან მოწონებით. ასევე წაიშლება შენს ანგარიშთან დაკავშირებული ყველა კონტენტი, მაგ., ატვირთული პროგრამები, კომენტარები და ა.შ."
  text6: "ჩვენი სერვისების ბოროტად გამოყენების თავიდან ასაცილებლად, მაგ., მომხმარებლების მიერ ატვირთული ფაილებით ან კომენტარებით უკანონო მიზნებისთვის, მომხმარებლის მიერ შექმნილი ყველა საჯარო მონაცემი (ატვირთვები, კომენტარები) შიდა მონაცემთა ბაზაში ინახება დროის ნიშნულთან და გამოყენებულ ინტერნეტ მისამართთან ერთად. ეს მონაცემები არ იქნება გამოყენებული ან გადაცემული რომელიმე დაწესებულებისთვის, გარდა იმ შემთხვევისა, როცა არსებობს საკმარისად დასაბუთებული ეჭვი უკანონო ქმედებებზე და ოფიციალურად უფლებამოსილი სამართლებრივი დაწესებულებები ამას მოითხოვენ მოქმედი კანონმდებლობის საფუძველზე. თითოეულ შემთხვევას ჯერ ჩვენ საფუძვლიანად და ინდივიდუალურად შევამოწმებთ."
  text7: "ნებაყოფლობით შეგიძლია გამოიწერო Catrobat-ის საინფორმაციო ბიულეტენი https://catrob.at/newsletter-ზე, რომელსაც ვაწვდით MailChimp სერვისის მეშვეობით (The Rocket Science Group LLC d/b/a MailChimp, აშშ). ამის შემდეგ მიიღებ სიახლეებს Catrobat-ის პროექტისა და მისი სერვისების შესახებ შენს მითითებულ ელფოსტაზე. ბიულეტენის გაუქმება ნებისმიერ დროს შეგიძლია ყოველი ბიულეტენის ქვედა ნაწილში არსებული \"გამოწერის გაუქმება\" ბმულით. ამ ბიულეტენს აწვდის MailChimp, რომელთანაც გვაქვს მონაცემთა დამუშავების შეთანხმება და რომელიც ვალდებულია დაიცვას ევროკავშირის მონაცემთა დაცვის ზოგადი რეგულაცია და ევროკავშირი-აშშ-ის \"Privacy Shield\". MailChimp-ის შესახებ დამატებითი ინფორმაციისთვის გაეცანი MailChimp-ის კონფიდენციალურობის პოლიტიკას და გამოყენების პირობებს."
  text8: "ყველა სერვისს აწვდის თავისუფალი ღია კოდის პროექტი Catrobat, International Catrobat Association – Verein zur Förderung freier Software-ის ეგიდით, რომელიც არის არაკომერციული არასამთავრობო ორგანიზაცია, რეგისტრირებული გრაცში, ავსტრია (ევროკავშირი). ჩვენი პოლიტიკა პატივს სცემს ევროკავშირისა და ავსტრიის მონაცემთა დაცვის კანონმდებლობას (GDPR). ჩვენთან დასაკავშირებლად გამოგზავნე ელფოსტა მისამართზე contact@catrobat.org ან მოგვწერე ფოსტით: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union)."
  text9: "თუ 14 წელზე ნაკლების ხარ, ეს პოლიტიკა უნდა მიიღოს კანონიერმა მეურვემ (ჩვეულებრივ, მშობელმა)."
  text10: "Catrobat-ის ოფიციალური ინგლისურენოვანი კონფიდენციალურობის პოლიტიკა ხელმისაწვდომია ვებში: %privacy_policy%."
  disagree-text: "თანხმობის გარეშე ანგარიშს ვერ შევქმნით, მაგრამ ძირითადი ფუნქციები მაინც ხელმისაწვდომია."
