  exportDataDescription: "გაქვს უფლება მიიღო შენი პერსონალური მონაცემების ასლი. ეს მოიცავს პროფილის ინფორმაციას, პროექტებს, კომენტარებს, რეაქციებსა და გამომწერებს."
  exportDataLoading: "იტვირთება..."
  exportDataError: "მონაცემების ექსპორტისას რაღაც შეცდომა მოხდა. გთხოვ, მოგვიანებით სცადო."
  exportDataRateLimited: "მონაცემების ექსპორტი დღეში მხოლოდ ერთხელ შეგიძლია. გთხოვ, ხვალ სცადო."
  profileChangeSuccess: "შენი პროფილი წარმატებით შეიცვალა."
  unspecifiedError: "პროფილის შეცვლისას რაღაც არ გამოვიდა. გთხოვ, თავიდან სცადო ან შეგვატყობინე, თუ ეს განმეორდება!"
  verifyAccountText: "გამოგიგზავნით წერილს ბმულით ანგარიშის დასადასტურებლად. დარწმუნდი, რომ ბმულზე მომდევნო ერთი საათის განმავლობაში დააწკაპუნებ. დღეში მხოლოდ ერთი წერილის მოთხოვნა შეგიძლია."
