privacy-policy:
  header: "Tasertit n tbaḍnit"
  version: "Lqem 2.2, 17 Tubeṛ 2019"
  text1: "Akken ad ak-d-nefk akk tifadiwin n tenfa-nneɣ d umiḍan yeqqnen ɣur-sent, ilaq ad nleqqeḍ kra n yisefka fell-ak."
  text2: "Akken ad nḥerrez u ad nesnerni tanfa-nneɣ (isnasen d yismal) u ad nexdem anadi ussnan ɣef uselmed ICT d STEM/STEAM, nesseqdac Google Analytics, Crashlytics, d Firebase, akk sɣur Google LLC (USA), akked Dynatrace sɣur Dynatrace LLC (USA) akken ad d-naf isefka n tallit ɣef useqdec n tenfa-nneɣ, am talɣut n uɣelluy, tizmilin n wakud, isebtar/igdilen yettwarzan, aseqdec n yisnasen d tenfa-nneɣ, anagraw n wammud yettwasqedcen, d talɣut ɣef usaǧǧaw n uẓeṭṭa. Tasleḍt-a d yisefka yettwalqeḍen ur qqinen ara ɣer umaɣnu-ik u ur gbiren ara talɣut tudmawant (ibitten ineggura n tansa IP ttwarran d irussinen). Maca, isefka yettwalqeḍen ad ttwaznen ɣer yisaǧǧawen n tenfa (Google LLC, USA d Dynatrace LLC, USA). Asesfer n yisefka yebna ɣef yimtawan d Google LLC d Dynatrace LLC. Assaɣ-a d yisaǧǧawen n tenfa yemṣada d Ulugen Amatu n Tḥuḍa n Yisefka n Tdukli Tawrupit (EU GDPR) d umtawa EU-USA \"Privacy Shield\"."
  text3: "Akken ad texleqḍ u ad tesqedceḍ amiḍan deg yinagrawen-nneɣ, u akken ad k-nessefhem ɣef yisnifal ilaqen n umiḍan-ik s imayl, am ileqman neɣ tikerḍiwin n tewtilin-nneɣ n useqdec d tenfa, ilugan n tmɣiwant, neɣ tisertiyin-nneɣ, ad nkels isem-ik n useqdac, u ma tefkiḍ-tt-id, tansa-ik imayl. Ma tqqneḍ amiḍan-ik s Google Plus neɣ Facebook, nkeles daɣen tasarut n usulay yeqqnen ɣer umiḍan-ik deg tenfiwin-a. Ur nseqdac ara isefka-a i yiswi-nniḍen (am usnezzi), ala ma tsirgeḍ-aɣ s tbanin."
  text4: "S lebɣi-ik, tzemreḍ ad aɣ-d-tefkeḍ tamurt n wanda tzedɣeḍ s usebter n umiḍan-ik deg usmel n beṭṭu. Ad d-tettwaskan deg umaɣnu-ik azayez u ad tettwaseqdac kan i yiswi n tidaddanin d unadi sɣur-neɣ. Tezmer ad tettwakkes melmi i tebɣiḍ deg yiɣewwaṛen n umaɣnu-ik."
  text5: "Tzemreḍ ad tḥebseḍ aseqdec n yisefka udmawanen n umiḍan-ik melmi i tebɣiḍ s tukksa n umiḍan-ik seg usebter n umaɣnu-ik deg https://share.catrob.at/. Deffir tukksa n umiḍan-ik, ad tizmireḍ kan ad tesqedceḍ tanfiwin, maca mačči ad tekkiḍ, am usali n yisenfaren, iwenniten neɣ tisedmirin. Daɣen, akk agbur yeqqnen ɣer umiḍan-ik, am yisenfaren yulin, iwenniten, atg., ad yettwakkes."
  text6: "Akken ad nesḥebs aseqdec n diri n tenfa-nneɣ, am yisaliyen neɣ iwenniten n yiseqdacen i yiswi ur nelli ara d isaridanen, akk isefka izayzen i d-snulfan yiseqdacen (isaliyen, iwenniten) ad ttwakelsen deg daxel deg taffa n yisefka, akked tezmilt n wakud d tansa n Internet yettwasqedcen. Isefka-a ur ttwaseqdacen ara, ur ttwaznen ara ɣer tkebbaniyin, ala ma yella ccekk iwulmen ɣef tigawin ur nelli ara d isaridanen u tisuddas tusḍifin yettwasirgen ssutrent-ten s usaḍuf n uzref. Yal tadyant ad tettwasenqed s telqay sɣur-neɣ send."
  text7: "Tzemreḍ s lebɣi-ik ad tjerdeḍ deg tebrat n yisallen n Catrobat, deg https://catrob.at/newsletter i d-nettak s tenfa MailChimp (The Rocket Science Group LLC d/b/a MailChimp, USA). Ad d-teṭṭfeḍ ileqman ɣef usenfar Catrobat d tenfiwin-is ɣer tansa imayl i d-tefkiḍ. Tzemreḍ ad tḥebseḍ tabrat n yisallen melmi i tebɣiḍ s useqdec n useɣwen \"unsubscribe\" deg uḍar n yal tabrat. Tabrat-a n yisallen tettunefk sɣur MailChimp, i yesɛan yid-neɣ amtawa n usesfer n yisefka u yeqbel Ulugen Amatu n Tḥuḍa n Yisefka n UE d \"Privacy Shield\" EU-USA. I ugar n telqayt ɣef MailChimp, ttxil-k wali daɣen Tasertit n tbaḍnit d Tiwtilin n useqdec n MailChimp."
  text8: "Akk tanfiwin ttunefkent sɣur asenfar ilelli n uɣbalu yeldin Catrobat ddaw tsiwant n International Catrobat Association – Verein zur Förderung freier Software, d tamesbanit war tanfa i yettwaxedmen deg Graz, Ustriya (Tadukli Tawrupit). Tisertiyin-nneɣ qadrent azref n tḥuḍa n yisefka n UE d Ustriya (GDPR). Akken ad aɣ-tnermseḍ, ttxil-k azen imayl ɣer contact@catrobat.org neɣ azen-aɣ-d tabrat ɣer Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Ustriya (Tadukli Tawrupit)."
  text9: "Ma yella ddaw 14 n yiseggasen, tasertit-a ilaq ad tettwaqbel sɣur ameḥraz usḍif (s umata amawal)."
  text10: "Tasertit tunṣibt n tbaḍnit n Catrobat s tutlayt taglizit tella deg web ddaw %privacy_policy%."
  disagree-text: "War tamtawit, ur nezmir ara ad nexleq amiḍan maca timahilin tigejdanin mazal-itent."
