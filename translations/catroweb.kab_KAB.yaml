consent:
  email:
    subject: "Ilaq-d tasiregt n yimawlan i umiḍan Catrobat n mmi-k/yelli-k"
    title: "Tasiregt n yimawlan tettwasra"
    greeting: "Azul,"
    message: "Mmi-k/yelli-k %username% yexleq amiḍan deg Catrobat u yesenqed tansa-s imayl."
    explanation: "Catrobat d tiɣerɣert n uselmed baṭel anida ilmeẓyen ttlemmiden asihel s usnulfu n yisnasen, n wuraren d tunuɣin. S ilugan n UE n tḥuḍa n yigerdan, nesra tasiregt-ik send ad yizmir mmi-k/yelli-k ad yekki s lekmal deg tmɣiwant. Ttxil-k sit ɣef tqeffalt ddaw-a akken ad tefkeḍ tasiregt."
    button: "Efk tasiregt n yimawlan"
    ignore: "Ma ur tettṛaǧuḍ ara imayl-a, tzemreḍ ad t-tzegleḍ war ugur. War tasiregt, amiḍan ad yesɛu timahilin yettwaḥeddan."
    whatIsCatrobat: "Catrobat d tiɣerɣert n usihel n uselmed baṭel, war tanfa. Issin ugar deg catrobat.org."
    manageLink: "Tzemreḍ ad tesferkeḍ amiḍan n mmi-k/yelli-k melmi i tebɣiḍ s <a href=\"%portalUrl%\" style=\"color: #00acc1;\">Tawwurt n yimawlan</a>. Issin ugar ɣef <a href=\"%infoUrl%\" style=\"color: #00acc1;\">izerfan-ik d amawal</a>."
  confirmed:
    title: "Tasiregt tettunefk"
    message: "Tanemmirt! Amiḍan n %username% yermed tura s lekmal."
    continueButton: "Af-d isenfaren"
parent:
  footer:
    link: "Imawlan d yimeḥraz"
  info:
    title: "Talɣut i yimawlan d yimeḥraz"
    intro: "Catrobat yettaṭṭaf s lǧed taɣellist d tbaḍnit n yiseqdacen imecṭaḥ. Asebter-a yessegzay amek i nḥerrez mmi-k/yelli-k d wacu n yizerfan i tesɛiḍ."
    whatIsCatrobat:
      title: "D acu i d Catrobat?"
      text: "Catrobat d tiɣerɣert n uselmed baṭel, war tanfa, anida ilmeẓyen ttlemmiden asihel s usnulfu n yisnasen, n wuraren d tunuɣin-nsen. Tiɣerɣert tella deg umaḍal akk u tettwaseqdac deg uselmed."
    dataCollected:
      title: "Anwi isefka i nleqqeḍ?"
      text: "Nleqqeḍ kan isefka ilaqen i usexdem n tɣerɣert: isem n useqdac, tansa imayl, azemz n tlalit, d yisenfaren i d-yesnulfa mmi-k/yelli-k u yessali. I yiseqdacen ddaw 14 n yiseggasen, nkeles daɣen tansa imayl n umawal/umeḥraz i tesrigt. Ur nzenz ara, ur nbeṭṭu ara isefka udmawanen d wiyaḍ."
    yourRights:
      title: "Izerfan-ik d amawal neɣ d ameḥraz"
      text: "S ilugan n UE n tḥuḍa n yigerdan (GDPR) d COPPA, ɣur-k azref ad: twaliḍ isefka i nesɛa ɣef mmi-k/yelli-k, ad tessutreḍ anɣal n yisefka-a, ad tekkseḍ tasiregt-ik melmi i tebɣiḍ (ayen ara yeḥden amiḍan), u ad tessutreḍ tukksa i lebda n umiḍan d yisefka-s akk."
    minorRestrictions:
      title: "Anwi ilugan i yimiḍanen n yimecṭaḥ?"
      text: "Iseqdacen ddaw 16 n yiseggasen ur zmiren ara ad aren neɣ ad ɣṛen iwenniten, ad ḍefren iseqdacen-nniḍen, neɣ ad walin agbur yettwacerḍen d win ur yelhin ara i yigerdan. Zemren kan ad d-snulfun u ad salin isenfaren, ad snirmen isenfaren izayzen u ad sedmiren ɣef yisenfaren. Ilugan-a llan akken ad d-fken tawennaḍt n ulmad taɣellsant."
