licenseToPlay:
  link: "Turagt n wurar"
  title: "Turagt n wurar - Snemmer u bḍu"
  text1: "Xemmem belli yal asenfar Catrobat d tagaṭuṭ, tagaṭuṭ tamezwarut i d-yettasen s tiwṣaft-is (iḥedren n usihel). Akk iɛeggalen n tmɣiwant Catrobat beṭṭun tigaṭuṭin-nsen akked tiwṣafin-nsent. Aya yebɣa ad yini tzemreḍ ad tesfeṛḥeḍ s tigaṭuṭin u ad tlemdeḍ amek ara tent-txedmeḍ s yiman-ik!"
  text2: "Ulac tiwṣafin tuffirin: iwellihen ɣef wamek ara ttwaxedment tigaṭuṭin-a ldin i yal yiwen ad ten-yesqedcen, ad ten-yales, ad ten-yesnifel, ad ilin d asedhu i tikta timaynutin... tigaṭuṭin, bɣiɣ ad iniɣ."
  text3: "Tzemreḍ ad tetteḍ tigaṭuṭin, u ad tneɣleḍ tiwṣafin n wiyaḍ akken ad txedmeḍ tidak-ik, ahat s yiferdisen nniḍen. Tilelli-a tettas-d s snat n tewtilin fessusen:"
  text4: "Mi nesbedd tamɣiwant Catrobat, nefren abrid-a acku numen yettɛawan ulmad d tesnulfa deg tmɣiwant. S beṭṭu n tiwṣafin d yiferdisen (iskripten d tugniwin), imdanen zemren ad bnun ɣef tikta n wiyaḍ u yal yiwen ad yerbeḥ."
  text5: "Mi nesbedd asmel web Catrobat, nerna timahilin i usnerni n beṭṭu d usnemmer i wiyaḍ. Deg yal asebter n usenfar, tzemreḍ yal tikkelt ad tsadreḍ iskripten iɣbula n usenfar. Ma txedmeḍ remix i usenfar (tbeddleḍ iskripten neɣ tugniwin, u tebḍiḍ agmuḍ), nessutur-ak ad tesnemmreḍ deg tezmilin n usenfar, s ubder n yimdanen d usenfar i k-yessedhan."
  text6: "Issin ugar ɣef tewtilin n useqdec n tmɣiwant Catrobat deg %link-termsOfUse%."
  list1:
    item1: "bḍu tigaṭuṭin-ik akked tiwṣaft"
    item2: "snemmer wid i k-yessedhan"
  version: "Lqem 1.1, 2 Yebrir 2013"
termsOfUse:
  title: "Tiwtilin n useqdec"
  headline: "Ansuf ɣer tmɣiwant Catrobat!"
  text1: "Am uɛeggal n tmɣiwant Catrobat, tbeṭṭuḍ isenfaren d tikta d yimdanen:"
  text2: "Nesra tallalt-ik akken ad nerr tamɣiwant-a d adeg n tallalt i yal aɛeggal. Ha-t-a amek ara tɛiwneḍ:"
  text3: "S usenfar Catrobat nebɣa ad nesnerni attekki u ad neǧǧ tasnulfa n yal yiwen ad temlil i lfayda n tmagit akk. Tzemreḍ daɣen ad tuɣaleḍ d aɛeggal urmid n tmɣiwant Catrobat s tikci n yisenfaren-ik i tmɣiwant d tikci, am akken ttakken-ak-d iɛeggalen-nniḍen isenfaren-nsen:"
  text4: "Tikci-nneɣ i kečč:"
  text5: "Tiwtilin-nneɣ n useqdec d tenfa:"
  list1:
    item1: "seg waṭas n tmura d yidelsan yemgaraden"
    item2: "n yal leɛmeṛ (seg yigerdan imecṭaḥ ɣer yilmeẓyen d jeddi d yemma-s n jeddi)"
    item3: "s yal aswir n tirmit"
  list2:
    item1: "Qadeṛ. Mi ara tebḍuḍ isenfaren, cfu belli imdanen n waṭas n leɛmeṛ d tmenḍawin ad walin attekki-inek."
    item2: "Snemmer. Tzemreḍ ad txedmeḍ ileqman ibeddlen n yisenfaren n wiyaḍ - ḥrez kan ad ten-tesnemmreḍ. Yiwen n wadeg i usnemmer d tigezmi n tezmilin d yisnemmiren n usenfar-ik. Ttxil-k wali taseddart ddaw tebdart-a i ugar n talqayt ɣef ubeddel n yisenfaren n yiseqdacen-nniḍen."
    item3: "Ili d anezzuh. Ur ttmeslay ara am akken d yiwen-nniḍen, ur ttɛeṛṛiḍ ara ad tkellxeḍ tamɣiwant."
    item4: "Eǧǧ talɣut tudmawant d tusligt. Ur bḍu ara tansa-ik imayl, uṭṭun n tilifun-ik, neɣ talɣut-nniḍen n unermis udmawan."
    item5: "Ɛiwen-aɣ ad yeqqim usmel d amḥeddi. Ma tḥulfaḍ belli wiyaḍ ad afen asenfar neɣ awennit d ucriḍ, yettsejhilen, d amennuɣ aṭas, neɣ d awezɣi, sit kan ɣef tqeffalt 'mmel d awezɣi' u eǧǧ asegzi wezzilen. Tarbaɛt Catrobat ad tesenqed aneqqis-ik u tezmer ad tekkes yal asenfar, awennit neɣ tasuffeɣt."
  list3:
    item1: "S usali n usenfar ɣer yismal-nneɣ, tqebleḍ u tmeɛnaḍ ad terreḍ axeddim-a ddaw kra n turagin tilelliyin n yisenfaren Catrobat yulin. Am turagin tilelliyin ddaw-nsent i yella unagraw Catrobat i kečč, turagin-a fkant i yal yiwen azref ad yelmed seg uxeddim i d-salin wiyaḍ u ad t-yesnifel u ad yexdem remix akken ad d-yesnulfu uraren, tunuɣin d yisenfaren-nniḍen imaynuten. Aya yeǧǧa yal yiwen ad 'yebded ɣef tuyat n yimeddukal-is', yiwen seg-sen d kečč! Axeddim-ik ad yenfeɛ amaḍal akk u ad yeqqim d ilelli i yal yiwen, am uḍris d tugniwin i d-fkan s tilelli yiwiziwen n umaḍal akk i Wikipedia. Xemmem fell-as am tikci-inek i tmagit: tettakeḍ i yal yiwen, u wiyaḍ akk i d-yessalayen axeddim-nsen ɣer yismal-nneɣ ttaken-ak. Ihi asenfar yulin d tikci n wazal ameqqran i k-yettak bab-is baṭel, s tewtilt ad tekkiḍ deg tmɣiwant s yiwet n tewtilt."
    item2: "Ur tesɛiḍ ara ad tqebleḍ tikci; ma tqebleḍ-tt, kra n yilugan ttwasnasen. Lfayda n yilugan-a d akken tzemreḍ ad tlemdeḍ seg uxeddim u ad tebnuḍ fell-as akken ad txedmeḍ ayen yelhan ugar s yiman-ik, i tzemreḍ ad tessaliḍ daɣen ɣer yismal-nneɣ am wayla-k. Lfayda-nniḍen d akken turagin-a ḥerrzent-k seg yal tamsulit ɣef yiɣeblan i yeḍran i wiyaḍ s useqdec n usenfar-ik."
    item3: "Yiwet n tewtilt tamqerrant-nniḍen d akken ilaq ad tesnemmreḍ s tbanin imeskaren n yixeddimen ɣef i tebniḍ axeddim-ik. Deg yiwen n wakud, ad nexdem ayen akk nezmer akken axeddim-ik ad yettwassen s tbanin d win i d-tefkiḍ, s usnemmer i yisem asuf i tferneḍ s tilelli deg tmɣiwant Catrobat, u s tikci i wiyaḍ n tegnit ad ak-d-sbanen tanemmirt-nsen s tbanin acku tefkiḍ axeddim-ik i yal yiwen, ladɣa i nutni."
    item4: "Ttxil-k wali %link-licenseUploaded% i tewtilin tusḍifin s telqay."
  list4:
    item1: "Nettak-ak-d akk iseɣzanen-nneɣ d yiɣbula n Internet icudden ɣer unagraw Catrobat, am iseɣzanen yura tarbaɛt Catrobat, ismal-nneɣ, tangalt-nneɣ taɣbalut d yiferdisen-nniḍen am tugniwin, imeslan d yiḍrisen, tura d uzekka ddaw turagin tilelliyin n Catrobat."
    item2: "Turagin-a rrent akk iḥricen n Catrobat baṭel i kečč u d ilelliyen, s tikci n tlelli ad ten-tesqedceḍ akken tebɣiḍ, s kra n yilugan kan i yeṭṭfen, gar wiyaḍ, belli anagraw Catrobat ad yeqqim d ilelli u d anafaɛ i yal yiwen i lebda."
    item3: "Ttxil-k wali %link-licenseToPlay% i tewtilin tusḍifin s telqay. Tangalt taɣbalut n unagraw Catrobat akked waṭas n yisemliyen d yiɣbula-nniḍen llan s %link-developer%."
  list5:
    item1: "Ma yella kečč, neɣ ma yella ddaw 13 n yiseggasen, imawlan-ik neɣ imeḥraz-ik usḍifen, qqnen ɣer tkebbanit yettekkin neɣ d tamasult n tkerḍa tamatut n tbaḍnit d/neɣ n uɛassi ameqqran, ur tettusirgeḍ ara ad tesqedceḍ isnasen-nneɣ neɣ ad tkecmeḍ ɣer tenfa-nneɣ. Talqayt n ulugen-a d kra n tsuraf-is ttwaglemnt deg tgezmiyin 4.a d 4.b deg %link-termsOfUse%."
    item2: "Ma yella ddaw 13 n yiseggasen, ilaq ad testeqsiḍ imawlan-ik neɣ imeḥraz-ik usḍifen ma sirgen-k ad tesqedceḍ isnasen d tenfa n Catrobat."
    item3: "Nḥerrez azref ad nugi, ad nekkes neɣ ad neffer isenfaren, imiḍanen n yiseqdacen, d yal aferdis umḍin yulin ɣer yismal n Catrobat melmi i nebɣa s tegzemt-nneɣ kan, am akken ma nufa belli asenfar yegber agbur awezɣi neɣ aseqdac yettekriḍ izerfan n wiyaḍ."
    item4: "Akk iseɣzanen d yiɣbula n Internet n Catrobat ttunefken s usirem ad ilin d inafaɛen, maca war ṭmana."
    item5: "Ttxil-k wali %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service i tira tusḍift n tnaḍin-a d kra n tewtilin tusḍifin-nniḍen."
  bottom1: "Uɣal-d ɣer da yal tikkelt, acku nettɛaraḍ yal tikkelt ad nesnerni tiwtilin-nneɣ n useqdec."
  bottom2: "Ttxil-k azen yal asumer ɣef tewtilin-a n useqdec ɣer %email-webmaster%."
  version: "Lqem 1.3, 4 Meɣres 2014"
