    title: 'Szülői beleegyezés szükséges'
    greeting: 'Szia!'
    message: 'Gyermeked, %username% fiókot hozott létre a Catrobaton, és megerősítette az e-mail-címét.'
    explanation: 'A Catrobat egy ingyenes oktatási platform, ahol a fiatalok alkalmazások, játékok és animációk készítésével tanulnak programozni. Az uniós gyermekvédelmi előírások értelmében a beleegyezésedre van szükségünk, mielőtt gyermeked teljes mértékben részt vehet a közösségben. A beleegyezés megadásához kattints az alábbi gombra.'
