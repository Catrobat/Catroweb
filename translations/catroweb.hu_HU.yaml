privacy-policy:
  header: 'Adatvédelmi irányelvek'
  version: '2.2-es verzió, 2019. október 17.'
  text1: 'Ahhoz, hogy szolgáltatásaink és a hozzájuk tartozó fiók minden előnyét kínálhassuk neked, bizonyos adatokat kell gyűjtenünk rólad.'
  text2: 'Szolgáltatásaink (alkalmazások és weboldalak) fenntartásához és fejlesztéséhez, valamint az IKT- és STEM/STEAM-oktatással kapcsolatos tudományos kutatáshoz a Google LLC (USA) által nyújtott Google Analytics, Crashlytics és Firebase szolgáltatásokat, valamint a Dynatrace LLC (USA) Dynatrace szolgáltatását használjuk, hogy metaadatokat kapjunk szolgáltatásaink használatáról, például összeomlási információkat, időbélyegeket, meglátogatott oldalakat/képernyőket, alkalmazásaink és szolgáltatásaink használatát, a használt operációs rendszert és a hálózati szolgáltatóra vonatkozó információkat. Ez az elemzés és az összegyűjtött adatok nincsenek a profilodhoz kapcsolva, és nem tartalmaznak személyes adatokat (az IP-cím utolsó bitjeit anonimizáljuk). Az összegyűjtött adatokat azonban továbbítjuk a szolgáltatóknak (Google LLC, USA és Dynatrace LLC, USA). Az adatkezelés a Google LLC-vel és a Dynatrace LLC-vel kötött megállapodásokon alapul. A szolgáltatókkal fennálló kapcsolat megfelel az Európai Unió általános adatvédelmi rendeletének (EU GDPR) és az EU–USA „Privacy Shield” megállapodásnak.'
  text3: 'Ahhoz, hogy fiókot hozhass létre és használhass rendszereinkben, és hogy e-mailben tájékoztathassunk a fiókodat érintő szükséges változásokról, például frissítésekről vagy a felhasználási és szolgáltatási feltételeink, közösségi szabályaink vagy irányelveink megsértéséről, tároljuk a felhasználónevedet és – ha megadtad – az e-mail-címedet. Ha a fiókodat Google Plus vagy Facebook segítségével kapcsoltad össze, ezenkívül egy, az ezeken a szolgáltatásokon lévő fiókodhoz kapcsolódó azonosító kulcsot is tárolunk. Ezeket az adatokat semmilyen más (például marketing) célra nem használjuk, hacsak kifejezetten meg nem engedted.'
  text4: 'Önkéntes alapon a megosztó oldal fiókoldalán megadhatod a lakóhelyed szerinti országot. Ez megjelenik a nyilvános profilodon, és csak statisztikai és kutatási célokra használjuk. A profilbeállításaidban bármikor eltávolíthatod.'
  text5: 'A fiókodhoz tartozó személyes adatok használatát bármikor visszavonhatod, ha a https://share.catrob.at/ oldalon a profiloldaladon törlöd a fiókodat. A fiókod törlése után továbbra is használhatod a nyújtott szolgáltatásokat, de együttműködni – például programokat feltölteni, hozzászólni vagy kedvelni – már nem. Emellett a fiókodhoz kapcsolódó minden tartalom, például a feltöltött programok, hozzászólások stb. is törlődik.'
  text6: 'Szolgáltatásaink visszaélésszerű használatának – például a felhasználók által illegális célokra feltöltött tartalmaknak vagy hozzászólásoknak – megelőzése érdekében minden, felhasználók által létrehozott nyilvános adatot (feltöltések, hozzászólások) belsőleg egy adatbázisban tárolunk, időbélyeggel és a használt internetcímmel együtt. Ezeket az adatokat semmilyen intézmény nem használja, és nem továbbítjuk nekik, kivéve, ha kellően megalapozottan illegális cselekmény gyanúja áll fenn, és hivatalosan felhatalmazott jogi intézmények az alkalmazandó jog alapján kérik. Minden esetet először egyenként alaposan megvizsgálunk.'
  text7: 'Önkéntesen feliratkozhatsz a Catrobat hírlevelére a https://catrob.at/newsletter oldalon, amelyet a MailChimp szolgáltatáson (The Rocket Science Group LLC d/b/a MailChimp, USA) keresztül nyújtunk. Ezután a megadott e-mail-címedre hírt kapsz a Catrobat projektről és szolgáltatásairól. A hírlevélről bármikor leiratkozhatsz az egyes hírlevelek alján található „leiratkozás” linkkel. A hírlevelet a MailChimp nyújtja, amellyel adatfeldolgozási megállapodásunk van, és amely elkötelezte magát az EU általános adatvédelmi rendelete és az EU–USA „Privacy Shield” mellett. A MailChimppel kapcsolatos további részletekért tekintsd meg a MailChimp adatvédelmi irányelveit és felhasználási feltételeit is.'
  text8: 'Minden szolgáltatást a szabad, nyílt forráskódú Catrobat projekt nyújt az International Catrobat Association – Verein zur Förderung freier Software égisze alatt, amely egy Grazban (Ausztria, Európai Unió) bejegyzett nonprofit civil szervezet. Irányelveink tiszteletben tartják az uniós és az osztrák adatvédelmi jogot (GDPR). Ha kapcsolatba szeretnél lépni velünk, írj e-mailt a contact@catrobat.org címre, vagy postai levelet ide: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Ausztria (Európai Unió).'
  text9: 'Ha 14 évesnél fiatalabb vagy, ezeket az irányelveket egy törvényes gondviselőnek (általában a szülődnek) kell elfogadnia.'
  text10: 'A Catrobat hivatalos angol nyelvű adatvédelmi irányelvei itt érhetők el: %privacy_policy%.'
  disagree-text: 'Beleegyezés nélkül nem tudunk fiókot létrehozni, de az alapfunkciók továbbra is elérhetők.'
