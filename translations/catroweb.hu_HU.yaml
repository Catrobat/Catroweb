    manageLink: 'Gyermeked fiókját bármikor kezelheted a <a href="%portalUrl%" style="color: #00acc1;">Szülői portálon</a>. Tudj meg többet <a href="%infoUrl%" style="color: #00acc1;">szülői jogaidról</a>.'
