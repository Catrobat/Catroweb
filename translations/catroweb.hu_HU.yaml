parent:
  footer:
    link: 'Szülőknek és gondviselőknek'
  info:
    title: 'Információ szülőknek és gondviselőknek'
    intro: 'A Catrobat komolyan veszi a fiatal felhasználók biztonságát és adatainak védelmét. Ez az oldal elmagyarázza, hogyan védjük gyermekedet, és milyen jogaid vannak.'
    whatIsCatrobat:
      title: 'Mi a Catrobat?'
      text: 'A Catrobat egy ingyenes, nonprofit oktatási platform, ahol a fiatalok saját alkalmazások, játékok és animációk készítésével tanulnak programozni. A platform világszerte elérhető, és oktatási környezetben is használják.'
    dataCollected:
      title: 'Milyen adatokat gyűjtünk?'
      text: 'Csak a platform működtetéséhez szükséges minimális adatokat gyűjtjük: felhasználónév, e-mail-cím, születési dátum, valamint a gyermeked által készített és feltöltött projektek. 14 év alatti felhasználók esetén a beleegyezés céljából egy szülői/gondviselői e-mail-címet is tárolunk. Személyes adatokat nem adunk el és nem osztunk meg harmadik felekkel.'
    yourRights:
      title: 'Jogaid szülőként vagy gondviselőként'
      text: 'Az uniós gyermekvédelmi előírások (GDPR) és a COPPA értelmében jogod van: megtekinteni a gyermekedről tárolt adatokat, másolatot kérni ezekről az adatokról, bármikor visszavonni a beleegyezésedet (ami korlátozza a fiókot), valamint kérni gyermeked fiókjának és minden kapcsolódó adatának végleges törlését.'
    minorRestrictions:
      title: 'Milyen korlátozások vonatkoznak a kiskorúak fiókjaira?'
      text: 'A 16 év alatti felhasználók nem írhatnak és nem olvashatnak hozzászólásokat, nem követhetnek más felhasználókat, és nem láthatják a gyerekeknek nem megfelelőként megjelölt tartalmakat. Ettől függetlenül készíthetnek és feltölthetnek projekteket, böngészhetik a nyilvános projekteket, és reagálhatnak a projektekre. Ezek a korlátozások a biztonságos tanulási környezetet szolgálják.'
    manageButton: 'Gyermeked fiókjának kezelése'
