licenseToPlay:
  link: 'Játékengedély'
  title: 'Játékengedély – Adj elismerést és ossz meg'
  text1: 'Képzeld el, hogy minden Catrobat-projekt egy torta, egy nagyon különleges torta, amelyhez a recept (programozási blokkok) is jár. A Catrobat közösség minden tagja megosztja a tortáit a receptjeikkel együtt. Ez azt jelenti, hogy élvezheted a tortákat, és megtanulhatod, hogyan készítsd el őket te magad!'
  text2: 'Nincsenek titkos receptek: a torták elkészítésének útmutatója bárki számára nyitott, hogy használja, újrahasznosítsa, módosítsa, és inspirációként szolgáljon új ötletekhez... vagyis tortákhoz.'
  text3: 'Megeheted a tortákat, és lemásolhatod mások receptjeit, hogy elkészítsd a sajátodat, akár más hozzávalókkal. Ehhez a szabadsághoz két egyszerű feltétel tartozik:'
  text4: 'A Catrobat közösség létrehozásakor azért döntöttünk e megközelítés mellett, mert hisszük, hogy ez támogatja a tanulást és a kreativitást a közösségen belül. A receptek és hozzávalók (szkriptek és grafikák) megosztásával az emberek egymás ötleteire építhetnek, és ebből mindenki profitál.'
  text5: 'A Catrobat weboldal tervezésekor olyan funkciókat építettünk be, amelyek arra ösztönöznek, hogy megoszd a munkáidat és elismerd mások munkáját. Minden projektoldalon letöltheted a projekt eredeti szkriptjeit. Ha remixelsz egy projektet (módosítod a szkripteket vagy a grafikákat, és megosztod az eredményt), arra biztatunk, hogy a projekt jegyzeteiben említsd meg azokat az embereket és projekteket, akik és amelyek inspiráltak.'
  text6: 'A Catrobat online közösség felhasználási feltételeiről itt tudhatsz meg többet: %link-termsOfUse%.'
  list1:
    item1: oszd meg a süteményeket és azok receptjeit
    item2: ismerd el azokat, akik inspiráltak
  version: '1.1-es verzió, 2013. április 2.'
termsOfUse:
  title: Felhasználási feltételek
  headline: Üdvözlünk a Catrobat Közösségben!
  text1: 'A Catrobat közösség tagjaként projekteket és ötleteket osztasz meg másokkal:'
  text2: "A te segítségedre is szükség van hogy mindenki számára támogató közösséget alakíthassunk ki. Így segíthetsz:"
  text3: 'A Catrobat projekttel az együttműködést szeretnénk előmozdítani, és lehetővé tenni, hogy mindenki kreativitása az egész emberiség javára egyesüljön. Te is a Catrobat közösség aktív tagjává válhatsz, ha a projektjeidet ajándékként visszaadod a közösségnek, ugyanúgy, ahogy más aktív tagok is neked adják a projektjeiket:'
  text4: 'A mi ajándékunk:'
  text5: 'Felhasználási feltételek:'
  list1:
    item1: sok különféle országból és kultúrából
    item2: minden korosztálynak (gyermekektől tinédzserekig és nagyszülőkig)
    item3: minden tapasztalati szintre
  list2:
    item1: 'Légy tisztelettudó. Amikor projekteket osztasz meg, ne feledd, hogy sokféle korú és hátterű ember látja majd a hozzájárulásaidat.'
    item2: 'Ismerd el mások munkáját. Nyugodtan készíts módosított változatokat mások projektjeiből – csak ügyelj arra, hogy megemlítsd őket. Ezt például a projekted jegyzetek és köszönetnyilvánítás részében teheted meg. A más felhasználók projektjeinek módosításáról a felsorolás alatti bekezdésben olvashatsz részletesen.'
    item3: "Légy őszinte. Ne tettesd másvalakinek magad és ne próbáld meg becsapni a közösséget semmilyen módon."
    item4: "Tartsd biztonságban a személyes információidat. Ne oszd meg az e-mail címedet, telefonszámodat vagy más személyes adatot."
    item5: 'Segíts barátságosan tartani az oldalt. Ha úgy érzed, mások egy projektet vagy hozzászólást bántónak, sértőnek, túl erőszakosnak vagy más módon nem megfelelőnek találnának, egyszerűen kattints a „jelentés nem megfelelőként” gombra, és írj egy rövid magyarázatot. A Catrobat csapata átnézi a jelentésedet, és eltávolíthat bármilyen projektet, hozzászólást vagy bejegyzést.'
  list3:
    item1: 'Azzal, hogy feltöltesz egy projektet a weboldalainkra, elfogadod és beleegyezel, hogy ez a munka a feltöltött Catrobat-projektekre vonatkozó bizonyos szabad licencek alá kerüljön. Ahhoz hasonlóan, ahogy maga a Catrobat rendszer is szabad licencek alatt érhető el számodra, a feltöltött Catrobat-projektek szabad licencei mindenkinek jogot adnak arra, hogy tanuljon a mások által korábban feltöltött munkákból, és hogy átdolgozza és remixelje azokat saját új, lenyűgöző játékok, animációk és más projektek készítéséhez. Így mindenki „a társai vállán állhat”, és ezek egyike te vagy! A munkád így az egész világ javát szolgálja, és mindenki számára szabadon használható marad, kicsit hasonlóan a világ minden tájáról érkező önkéntesek által a Wikipédiának szabadon adományozott szövegekhez és képekhez. Gondolj rá úgy, mint az ajándékodra az emberiségnek: te adsz mindenkinek, és mindenki más, aki feltölti a munkáját a weboldalainkra, neked ad. Egy feltöltött projekt tehát nagy értékű ajándék, amelyet a tulajdonosa ingyen ad neked, azzal a feltétellel, hogy ugyanilyen feltételekkel veszel részt a közösségben.'
    item2: 'Nem kötelező elfogadnod az ajándékot; ha elfogadod, bizonyos szabályok érvényesek. E szabályok előnye, hogy tanulhatsz a munkából, és építhetsz rá, hogy még menőbb dolgokat készíts, amelyeket aztán például ismét feltölthetsz a weboldalainkra a saját munkádként. További előny, hogy ezek a licencek biztosítják, hogy nem vonhatnak felelősségre semmilyen olyan problémáért, amely másoknál a projekted használata során merül fel.'
    item3: 'Egy fontos további feltétel, hogy egyértelműen fel kell tüntetned azoknak a szerzőknek a nevét, akiknek a munkájára a sajátodat építetted. Ugyanakkor mi is keményen dolgozunk azon, hogy mások egyértelműen elismerjék a te hozzájárulásodat: feltüntetjük azt az egyedi nevet, amelyet szabadon választottál, hogy képviseljen a Catrobat közösségben, és lehetőséget adunk másoknak, hogy nyilvánosan kifejezzék hálájukat, amiért a munkádat mindenkinek, és különösen nekik, odaadtad.'
    item4: 'A pontos jogi feltételekért lásd: %link-licenseUploaded%.'
  list4:
    item1: 'Minden saját szoftverünket és a Catrobat rendszerhez kapcsolódó internetes erőforrásunkat – például a Catrobat csapata által írt szoftvert, weboldalainkat és internetes erőforrásainkat, a Catrobat rendszerhez kapcsolódó saját forráskódunkat, valamint minden további mellékelt anyagot, például képeket, hangokat és szövegeket – most és a jövőben is a Catrobat szabad licencei alatt kínáljuk neked.'
    item2: 'Ezek a licencek a Catrobat minden részét ingyenessé teszik számodra, és szabaddá is abban az értelemben, hogy szabadon használhatod őket, ahogy csak szeretnéd, csupán néhány olyan korlátozással, amelyek többek között biztosítják, hogy a Catrobat rendszer örökre szabad és mindenki számára hasznos maradjon.'
    item3: 'A pontos jogi feltételekért lásd: %link-licenseToPlay%. A Catrobat rendszer forráskódja, valamint sok más dokumentum és erőforrás itt érhető el: %link-developer%.'
  list5:
    item1: 'Ha te – vagy ha 13 évesnél fiatalabb vagy, a szüleid vagy törvényes gondviselőid – olyan szervezethez kapcsolódsz, amely részt vesz vagy felelős a magánszféra hálószerű megsértéséért és/vagy tömeges megfigyelésért, akkor nem használhatod szoftveralkalmazásainkat, és nem férhetsz hozzá szolgáltatásainkhoz. E korlátozás pontos részleteit és bizonyos kivételeit a %link-termsOfUse% 4.a és 4.b pontja tartalmazza.'
    item2: 'Ha 13 évesnél fiatalabb vagy, meg kell kérdezned a szüleidet vagy törvényes gondviselőidet, hogy megengedik-e, hogy használd a Catrobat szoftveralkalmazásait és szolgáltatásait.'
    item3: 'Fenntartjuk a jogot, hogy saját belátásunk szerint bármikor elutasítsunk, töröljünk vagy elrejtsünk projekteket, felhasználói fiókokat és bármilyen, a Catrobat weboldalaira feltöltött digitális anyagot, például ha úgy találjuk, hogy egy projekt nem megfelelő tartalmat tartalmaz, vagy egy felhasználó mások jogait sérti.'
    item4: 'A Catrobat minden szoftverét és internetes erőforrását abban a reményben kínáljuk, hogy hasznosak lesznek, de mindenféle garancia nélkül.'
    item5: 'A fenti pontok pontos megfogalmazásáért és néhány további jogi feltételért lásd: %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service.'
  bottom1: 'Nézz vissza ide időről időre, mert folyamatosan igyekszünk javítani a felhasználási feltételeinken.'
  bottom2: 'A felhasználási feltételekkel kapcsolatos javaslataidat küldd el ide: %email-webmaster%.'
  version: '1.3-as verzió, 2014. március 4.'
