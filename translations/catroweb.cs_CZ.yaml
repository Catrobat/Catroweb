licenseToPlay:
  link: 'Licence'
  title: 'Licence k hraní - cituj zdroje a sdílej'
  text1: Představ si, že každý projekt Catrobat je dort, úplně zvláštní dort, ke kterému patří i recept (programovací bloky). Všichni členové komunity Catrobat sdílejí své dorty i s recepty. To znamená, že si dorty můžeš vychutnat a naučit se je péct sám!
  text2: 'Neexistují žádné tajné recepty: návody jak upéct tyto dortíky jsou otevřeny pro každého, k použití, předělání, úpravě a slouží jako inspirace pro nové nápady... Mám na mysli dortíky.'
  text3: "Můžeš jíst tyto dortíky, stejně jako kopírovat recepty jiných lidí k vytvoření vlastního, možná s jinými přísadami. Tato svoboda je podmíněna dvěma malými požadavky:"
  text4: "Při zakládání komunity Catrobat jsme se rozhodli přijmout tento přístup, protože jsme přesvědčeni, že podporuje učení a tvořivost v rámci komunity. Sdílením receptů a ingrediencí (skriptů a kreseb) mohou lidé stavět na nápadech jiných a prospěch z toho budou mít všichni."
  text5: In designing the Catrobat website, we included features to encourage people to share and to give credit to others. On each project page, you can always download the original scripts for the project. If you remix a project (modifying the scripts or artwork, and sharing the result), we encourage you to give credit in the Project Notes, mentioning the people and project that inspired you.
  text6: 'Další informace o podmínkách použití on-line komunity Catrobat nalezneš na %link-termsOfUse%.'
  list1:
    item1: sdílej své dortíky spolu s receptem
    item2: cituj ty, kteří tě inspirovali
  version: Verze 1.1, 2. dubna 2013
termsOfUse:
  title: Podmínky použití
  headline: Vítejte do Catrobot Community!
  text1: 'Jako součást komunity Catrobat sdílíš projekty a nápady s lidmi:'
  text2: "Potřebujeme vaši pomoc, aby se tato komunita stala podpůrným místem pro každého člena. Zde je, jak můžete pomoci:"
  text3: "Projektem Catrobat chceme podporovat spolupráci a umožnit, aby se kreativita všech spojila ve prospěch celého lidstva. I ty se můžeš stát aktivním členem komunity Catrobat tím, že své projekty dáš komunitě darem, stejně jako ti své projekty dávají ostatní aktivní členové:"
  text4: 'Náš dárek pro vás:'
  text5: 'Naše podmínky používání a služby:'
  list1:
    item1: z mnoha různých zemí a kultur
    item2: všech věkových skupin (od malých dětí po teenagery a prarodiče)
    item3: s jakoukoli úrovní zkušeností
  list2:
    item1: Buď ohleduplný. Při sdílení projektů pamatuj, že tvé příspěvky uvidí lidé mnoha různých věkových skupin a z různého prostředí.
    item2: "Give credit. Feel free to make modified versions of other people's projects - just make sure to give them credit. One place to give credit is in your project's credits section. Please see the paragraph below this dotted list for details about modifying projects of other users."
    item3: "Buďte upřímní. Nevydávejte se za někoho, kdo nejste nebo neklamte komunitu."
    item4: "Chraň své osobní údaje. Nesdílej svou e-mailovou adresu, telefonní číslo ani jiné osobní kontaktní údaje."
    item5: "Pomoz udržet stránku přátelskou. Pokud si myslíš, že by ostatní mohli projekt nebo komentář považovat za zlý, urážlivý, příliš násilný nebo jinak nevhodný, klikni na tlačítko 'nahlásit jako nevhodné' a přidej krátké vysvětlení. Tým Catrobat tvé nahlášení prověří a může jakýkoli projekt, komentář nebo příspěvek odstranit."
  list3:
    item1: "Nahráním projektu na naše webové stránky souhlasíš s tím, že toto dílo dáš pod určité svobodné licence pro nahrané projekty Catrobat. Podobně jako svobodné licence, pod kterými máš k dispozici samotný systém Catrobat, dávají tyto svobodné licence nahraných projektů Catrobat každému právo učit se z děl, která dříve nahráli jiní, a upravovat je a remixovat, aby z nich vytvořil vlastní nové úžasné hry, animace a další projekty. Díky tomu může každý 'stát na ramenou svých vrstevníků' – a jedním z nich jsi i ty! Tvé dílo tak bude přínosem pro celý svět a zůstane volně k použití pro všechny, trochu podobně jako texty a obrázky, které do Wikipedie zdarma přispívají dobrovolníci z celého světa. Ber to jako svůj dar lidstvu: ty dáváš všem a všichni ostatní, kdo nahrávají svá díla na naše stránky, dávají tobě. Nahraný projekt je tedy dar velké hodnoty, který ti jeho vlastník dává zdarma, pod podmínkou, že se do komunity zapojíš za stejných podmínek."
    item2: Dar přijmout nemusíš; pokud ho přijmeš, platí určitá pravidla. Výhodou těchto pravidel je, že se z díla můžeš učit a stavět na něm a vytvořit ještě lepší věci, které pak můžeš např. znovu nahrát na naše stránky jako své vlastní. Další výhodou je, že tyto licence zajišťují, že nemůžeš nést odpovědnost za žádné problémy, které ostatním vzniknou používáním tvého projektu.
    item3: "Jednou důležitou doplňující podmínkou je, že jasně uvedeš autory, na jejichž dílech jsi své dílo založil. Zároveň se budeme snažit, aby ostatní jasně ocenili, že dílo pochází od tebe – uvedením jedinečného jména, které sis svobodně zvolil jako svou identitu v komunitě Catrobat, a tím, že ostatním dáme možnost veřejně ti poděkovat za to, že jsi své dílo dal všem, a zvlášť jim."
    item4: 'Přesné právní podmínky najdeš na %link-licenseUploaded%.'
  list4:
    item1: "Veškerý náš vlastní software a internetové zdroje související se systémem Catrobat, např. software napsaný týmem Catrobat, naše webové stránky a internetové zdroje, náš vlastní zdrojový kód související se systémem Catrobat a všechny další přiložené materiály, jako např. obrázky, zvuky a texty, ti nyní i v budoucnu nabízíme pod svobodnými licencemi Catrobatu."
    item2: Díky těmto licencím jsou všechny části Catrobatu pro tebe zdarma a zároveň svobodné v tom smyslu, že je můžeš používat, jak chceš, jen s několika omezeními, která mimo jiné zajišťují, že systém Catrobat zůstane navždy svobodný a užitečný pro všechny.
    item3: 'Přesné právní podmínky najdeš na %link-licenseToPlay%. Zdrojový kód systému Catrobat i mnoho dalších dokumentů a zdrojů je dostupných přes %link-developer%.'
  list5:
    item1: 'Pokud ty, nebo – pokud je ti méně než 13 let – tvoji rodiče či zákonní zástupci, jste spojeni s organizací, která se podílí na plošném narušování soukromí a/nebo hromadném či masovém sledování nebo za ně odpovídá, nesmíš používat naše softwarové aplikace ani přistupovat k našim službám. Přesné podrobnosti tohoto omezení a určité výjimky z něj jsou popsány v oddílech 4.a a 4.b na stránce %link-termsOfUse%.'
    item2: Pokud je ti méně než 13 let, musíš se zeptat svých rodičů nebo zákonných zástupců, zda ti dovolí používat softwarové aplikace a služby Catrobatu.
    item3: "Vyhrazujeme si právo kdykoli podle vlastního uvážení odmítnout, smazat nebo skrýt projekty, uživatelské účty a jakékoli digitální materiály nahrané na webové stránky Catrobatu, například pokud zjistíme, že projekt obsahuje nevhodný materiál nebo že uživatel porušuje práva jiných osob."
    item4: "Veškerý software a internetové zdroje Catrobatu jsou nabízeny v naději, že budou užitečné, ale bez jakékoli záruky."
    item5: 'Přesné znění výše uvedených bodů a některé další právní podmínky najdeš na %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service.'
  bottom1: Občas se sem vrať, protože se naše podmínky použití neustále snažíme zlepšovat.
  bottom2: 'Jakékoli návrhy k těmto podmínkám použití posílej na %email-webmaster%.'
  version: Verze 1.3, 4. března 2014
