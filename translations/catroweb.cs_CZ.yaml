consent:
  email:
    subject: "Pro účet Catrobat tvého dítěte je potřeba souhlas rodiče"
    title: "Je potřeba souhlas rodiče"
    greeting: "Dobrý den,"
    message: "Tvé dítě %username% si vytvořilo účet na Catrobatu a ověřilo svou e-mailovou adresu."
    explanation: "Catrobat je bezplatná vzdělávací platforma, kde se mladí lidé učí programovat tvorbou aplikací, her a animací. Podle předpisů EU na ochranu dětí potřebujeme tvůj souhlas, než se tvé dítě bude moci plně zapojit do komunity. Klikni prosím na tlačítko níže a dej souhlas."
    button: "Dát souhlas rodiče"
    ignore: "Pokud jsi tento e-mail nečekal, můžeš ho klidně ignorovat. Bez souhlasu bude mít účet omezené funkce."
    whatIsCatrobat: "Catrobat je bezplatná nezisková vzdělávací programovací platforma. Více se dozvíš na catrobat.org."
    manageLink: 'Účet svého dítěte můžeš kdykoli spravovat přes náš <a href="%portalUrl%" style="color: #00acc1;">portál pro rodiče</a>. Zjisti víc o <a href="%infoUrl%" style="color: #00acc1;">svých právech jako rodič</a>.'
  confirmed:
    title: "Souhlas udělen"
    message: "Děkujeme! Účet uživatele %username% je teď plně aktivovaný."
    continueButton: "Objevuj projekty"
parent:
  footer:
    link: "Rodiče a opatrovníci"
  info:
    title: "Informace pro rodiče a opatrovníky"
    intro: "Catrobat bere bezpečnost a soukromí mladých uživatelů vážně. Tato stránka vysvětluje, jak chráníme tvé dítě a jaká máš práva."
    whatIsCatrobat:
      title: "Co je Catrobat?"
      text: "Catrobat je bezplatná nezisková vzdělávací platforma, kde se mladí lidé učí programovat tvorbou vlastních aplikací, her a animací. Platforma je dostupná po celém světě a používá se ve vzdělávání."
    dataCollected:
      title: "Jaká data shromažďujeme?"
      text: "Shromažďujeme jen minimum dat potřebných k provozu platformy: uživatelské jméno, e-mailovou adresu, datum narození a projekty, které tvé dítě vytvoří a nahraje. U uživatelů mladších 14 let ukládáme kvůli souhlasu také e-mailovou adresu rodiče/opatrovníka. Osobní údaje neprodáváme ani nesdílíme se třetími stranami."
    yourRights:
      title: "Tvá práva jako rodiče nebo opatrovníka"
      text: "Podle předpisů EU na ochranu dětí (GDPR) a COPPA máš právo: nahlédnout do dat, která o tvém dítěti uchováváme, požádat o kopii těchto dat, kdykoli odvolat svůj souhlas (čímž se účet omezí) a požádat o trvalé smazání účtu tvého dítěte a všech souvisejících dat."
    minorRestrictions:
      title: "Jaká omezení platí pro účty nezletilých?"
      text: "Uživatelé mladší 16 let nemohou psát ani číst komentáře, sledovat jiné uživatele ani zobrazovat obsah označený jako nevhodný pro děti. Stále mohou vytvářet a nahrávat projekty, procházet veřejné projekty a reagovat na projekty lajky. Tato omezení zajišťují bezpečné prostředí pro učení."
    manageButton: "Spravovat účet svého dítěte"
  portal:
    title: "Portál pro rodiče"
    description: "Zadej svou e-mailovou adresu a dostaneš zabezpečený odkaz pro správu účtu Catrobat svého dítěte. Odkaz bude odeslán na e-mailovou adresu, kterou jsi uvedl při registraci."
