licenseToPlay:
  link: 'Ikike ịkpọ egwu'
  title: 'Ikike ịkpọ egwu - Nye ekele ma kesaa'
  text1: "Chee na ọrụ Catrobat ọ bụla bụ achịcha, achịcha pụrụ iche nke ji usoro esi nri ya (blọk mmemme) abịa. Ndị otu obodo Catrobat niile na-ekesa achịcha ha ya na usoro esi nri ha. Nke a pụtara na ị nwere ike ịnụ ụtọ achịcha ndị ahụ ma mụta otu e si eme ha n'onwe gị!"
  text2: 'Enweghị usoro esi nri nzuzo: ntuziaka otu e si eme achịcha ndị a ghe oghe ka onye ọ bụla jiri, jigharịa, gbanwee ma were ya dị ka mkpali maka echiche ọhụrụ... achịcha ka m na-ekwu.'
  text3: 'Ị nwere ike iri achịcha ndị ahụ ma detuo usoro esi nri ndị ọzọ iji mee nke gị, ma eleghị anya ya na ihe mejupụtara dị iche. Nnwere onwe a na-abịa ya na ihe abụọ dị mfe a chọrọ:'
  text4: "Mgbe anyị na-ewulite obodo Catrobat, anyị kpebiri iji ụzọ a n'ihi na anyị kwenyere na ọ na-akwado mmụta na okike n'ime obodo. Site n'ịkesa usoro esi nri na ihe mejupụtara (script na ihe osise), ndị mmadụ nwere ike iwulite n'elu echiche ibe ha, onye ọ bụla ga-erite uru."
  text5: In designing the Catrobat website, we included features to encourage people to share and to give credit to others. On each project page, you can always download the original scripts for the project. If you remix a project (modifying the scripts or artwork, and sharing the result), we encourage you to give credit in the Project Notes, mentioning the people and project that inspired you.
  text6: 'Mụtakwuo gbasara usoro ojiji nke obodo ịntanetị Catrobat na %link-termsOfUse%.'
  list1:
    item1: 'kesaa achịcha gị ya na usoro esi nri ya'
    item2: 'nye ndị kpaliri gị ekele'
  version: 'Ụdị 1.1, 2 Eprel 2013'
termsOfUse:
  title: 'Usoro ojiji'
  headline: Welcome to the Catrobat Community!
  text1: 'Dị ka akụkụ nke obodo Catrobat, ị na-ekesa ọrụ na echiche na ndị mmadụ:'
  text2: 'Anyị chọrọ enyemaka gị ime ka obodo a bụrụ ebe na-akwado onye otu ọ bụla. Lee otu ị ga-esi nyere aka:'
  text3: "Site n'ọrụ Catrobat, anyị chọrọ ịkwalite imekọ ihe ọnụ ma kwe ka okike onye ọ bụla jikọta maka uru mmadụ niile. Ị nwekwara ike ịghọ onye otu na-arụsi ọrụ ike n'obodo Catrobat site n'inyeghachi ọrụ gị n'obodo dị ka onyinye, otu ụzọ ahụ ndị otu ọzọ na-arụsi ọrụ ike si enye gị ọrụ ha:"
  text4: 'Onyinye anyị nye gị:'
  text5: 'Usoro ojiji na ọrụ anyị:'
  list1:
    item1: "si n'ọtụtụ obodo na omenala dị iche iche"
    item2: "nke afọ niile (site na ụmụntakịrị ruo ndị nọ n'afọ iri na ụma na nna na nne ochie)"
    item3: 'nwere ọkwa ahụmịhe niile'
  list2:
    item1: 'Nwee nkwanye ugwu. Mgbe ị na-ekesa ọrụ, biko cheta na ndị nwere afọ na nzụlite dị iche iche ga-ahụ ihe i nyere.'
    item2: "Give credit. Feel free to make modified versions of other people's projects - just make sure to give them credit. One place to give credit is in your project's credits section. Please see the paragraph below this dotted list for details about modifying projects of other users."
    item3: 'Kwụwa aka ọtọ. Emela ka ị bụ onye ọzọ ma ọ bụ gbalịa ịghọgbu obodo.'
    item4: 'Debe ozi onwe gị na nzuzo. Ekesala adreesị ozi-e gị, nọmba ekwentị gị ma ọ bụ ozi kọntaktị onwe gị ndị ọzọ.'
    item5: "Nyere aka mee ka saịtị ahụ nọgide na-enwe obi ọma. Ọ bụrụ na i chere na ndị ọzọ ga-ahụ ọrụ ma ọ bụ nkọwa dị ka ihe ọjọọ, mkparị, ime ihe ike karịrị akarị ma ọ bụ ihe na-ekwesịghị ekwesị n'ụzọ ọzọ, naanị pịa bọtịnụ 'kọọ dị ka ihe na-ekwesịghị ekwesị' ma hapụ nkọwa dị mkpirikpi. Otu Catrobat ga-enyocha akụkọ gị ma nwee ike iwepụ ọrụ, nkọwa ma ọ bụ ozi ọ bụla."
  list3:
    item1: "Site n'ibulite ọrụ na weebụsaịtị anyị, ị nabatara ma kwenye itinye ọrụ a n'okpuru ụfọdụ ikike n'efu nke ọrụ Catrobat e bulitere. Dị ka ikike n'efu nke e ji nye gị sistemụ Catrobat n'onwe ya, ikike n'efu ndị a nke ọrụ Catrobat e bulitere na-enye onye ọ bụla ikike ịmụta site n'ọrụ ndị ọzọ bulitere na mbụ, na ịgbanwe ma remix ọrụ ahụ iji wuo egwuregwu ọhụrụ na-adọrọ mmasị nke ha, eserese na-emegharị ahụ na ọrụ ndị ọzọ. Nke a na-enye onye ọ bụla ohere 'iguzo n'ubu ndị ọgbọ ya', otu n'ime ha bụ gị! Ọrụ gị ga-abara ụwa niile uru ma nọgide na-adị n'efu ka onye ọ bụla jiri, dịtụ ka ederede na foto ndị ọrụ afọ ofufo si n'ụwa niile na-enye Wikipedia n'efu. Were ya dị ka onyinye gị nye mmadụ: ị na-enye onye ọ bụla, ndị ọzọ niile na-ebulite ọrụ ha na weebụsaịtị anyị na-enyekwa gị. Ya mere ọrụ e bulitere bụ onyinye bara ezigbo uru nke onye nwe ya na-enye gị n'efu, ma ọ bụrụ na ị sonye n'obodo n'otu usoro ahụ."
    item2: "Ị nweghị ịnabata onyinye ahụ; ọ bụrụ na i mee, ụfọdụ iwu na-emetụta. Uru iwu ndị a bara bụ na ị nwere ike ịmụta site n'ọrụ ahụ ma wulite n'elu ya iji mee ihe ka mma n'onwe gị, nke ị nwere ike, dịka ọmụmaatụ, ibulite ọzọ na weebụsaịtị anyị dị ka nke gị. Uru ọzọ bụ na ikike ndị a na-ahụ na a gaghị ejide gị maka nsogbu ọ bụla na-esite n'iji ndị ọzọ ji ọrụ gị."
    item3: "Otu ọnọdụ ọzọ dị mkpa bụ na ị ga-enye ndị edemede nke ọrụ ha ka i ji wuo ọrụ nke gị ekele nke ọma. N'otu oge ahụ, anyị ga-agbasi mbọ ike ka ndị ọzọ mata nke ọma na ọ bụ gị nyere ọrụ gị, site n'inye ekele n'aha pụrụ iche nke i ji aka gị họrọ ịnọchite anya gị n'obodo Catrobat, na site n'inye ndị ọzọ ohere igosi gị ekele ha n'ihu ọha maka inye onye ọ bụla ọrụ gị, karịsịa ha."
    item4: 'Biko lelee %link-licenseUploaded% maka usoro na ọnọdụ iwu kpọmkwem.'
  list4:
    item1: "Anyị na-enye gị ngwanrọ na akụrụngwa ịntanetị anyị niile metụtara sistemụ Catrobat, dịka ọmụmaatụ, ngwanrọ otu Catrobat dere, weebụsaịtị na akụrụngwa ịntanetị anyị, koodu isi anyị metụtara sistemụ Catrobat, na ihe ndị ọzọ niile gụnyere dịka foto, ụda na ederede, ugbu a na n'ọdịnihu n'okpuru ikike n'efu nke Catrobat."
    item2: "Ikike ndị a na-eme ka akụkụ niile nke Catrobat bụrụ n'efu nye gị ma nwekwa onwe ha n'echiche inye gị nnwere onwe iji ha mee ihe ọ bụla masịrị gị, naanị na mgbochi ole na ole na-ahụ, n'etiti ihe ndị ọzọ, na sistemụ Catrobat ga-anọgide na-adị n'efu ma baara onye ọ bụla uru ruo mgbe ebighị ebi."
    item3: 'Biko lelee %link-licenseToPlay% maka usoro na ọnọdụ iwu kpọmkwem. Koodu isi nke sistemụ Catrobat na ọtụtụ akwụkwọ na akụrụngwa ndị ọzọ dị site na %link-developer%.'
  list5:
    item1: "Ọ bụrụ na gị, ma ọ bụ, ọ bụrụ na ị na-erubeghị afọ 13, nne na nna gị ma ọ bụ ndị nlekọta gị n'iwu, nwere njikọ na otu nzukọ na-etinye aka ma ọ bụ nwee ọrụ maka mmebi nzuzo ụdị dragnet na/ma ọ bụ nleba anya n'ọtụtụ ma ọ bụ nke ọha, mgbe ahụ a gaghị ekwe gị iji ngwa ngwanrọ anyị ma ọ bụ banye n'ọrụ anyị. Nkọwa kpọmkwem nke mgbochi a na ụfọdụ ndị a napụrụ na ya dị na Nkebi 4.a na 4.b na %link-termsOfUse% anyị."
    item2: "Ọ bụrụ na ị na-erubeghị afọ 13, ị ga-ajụ nne na nna gị ma ọ bụ ndị nlekọta gị n'iwu ma ha kwere ka i jiri Ngwa ngwanrọ na Ọrụ Catrobat."
    item3: 'Anyị nwere ikike ịjụ, ihichapụ ma ọ bụ zoo ọrụ, akaụntụ onye ọrụ na ihe dijitalụ ọ bụla e bulitere na weebụsaịtị Catrobat oge ọ bụla dị ka anyị kpebiri, dịka ọmụmaatụ ma anyị chọpụta na ọrụ nwere ihe na-ekwesịghị ekwesị ma ọ bụ na onye ọrụ na-emebi ikike ndị ọzọ.'
    item4: "A na-enye ngwanrọ na akụrụngwa ịntanetị Catrobat niile n'olileanya na ha ga-aba uru, mana na-enweghị nkwa ọ bụla."
    item5: "Biko lelee %link-termsOfUse% anyị developer.catrobat.org/terms_of_use_and_service maka nkọwa kpọmkwem nke isi okwu ndị a dị n'elu na ụfọdụ usoro na ọnọdụ iwu ndị ọzọ."
  bottom1: "Na-alaghachi ebe a site n'oge ruo n'oge, n'ihi na anyị na-agbalị mgbe niile imeziwanye Usoro ojiji anyị."
  bottom2: 'Biko zigara aro ọ bụla gbasara Usoro ojiji ndị a na %email-webmaster%.'
