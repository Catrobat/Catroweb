parent:
  footer:
    link: 'Nne na nna & ndị nlekọta'
  info:
    title: 'Ozi maka nne na nna & ndị nlekọta'
    intro: 'Catrobat na-ewere nchekwa na nzuzo ndị ọrụ na-eto eto kpọrọ ihe. Peeji a na-akọwa otu anyị si echebe nwa gị na ikike i nwere.'
    whatIsCatrobat:
      title: 'Gịnị bụ Catrobat?'
      text: "Catrobat bụ ikpo okwu agụmakwụkwọ n'efu, nke na-anaghị achọ uru, ebe ndị na-eto eto na-amụ mmemme site n'ịmepụta ngwa, egwuregwu na eserese na-emegharị ahụ nke ha. Ikpo okwu ahụ dị n'ụwa niile, a na-ejikwa ya eme ihe n'ebe agụmakwụkwọ."
    dataCollected:
      title: 'Kedu data anyị na-anakọta?'
      text: 'Anyị na-anakọta data kacha nta dị mkpa iji rụọ ikpo okwu ahụ: aha njirimara, adreesị ozi-e, ụbọchị ọmụmụ na ọrụ ọ bụla nwa gị mepụtara ma bulite. Maka ndị ọrụ na-erubeghị afọ 14, anyị na-echekwakwa adreesị ozi-e nne/nna ma ọ bụ onye nlekọta maka nkwenye. Anyị anaghị ere ma ọ bụ kesaa data onwe onye na ndị ọzọ.'
    yourRights:
      title: 'Ikike gị dị ka nne, nna ma ọ bụ onye nlekọta'
      text: "N'okpuru iwu nchekwa ụmụaka nke EU (GDPR) na COPPA, ị nwere ikike: ilele data anyị nwere gbasara nwa gị, ịrịọ maka otu nnomi data ahụ, ịkagbu nkwenye gị oge ọ bụla (nke na-egbochi akaụntụ ahụ), na ịrịọ ka e hichapụ akaụntụ nwa gị na data niile metụtara ya kpamkpam."
    minorRestrictions:
      title: 'Kedu mgbochi dị na akaụntụ ụmụaka?'
      text: "Ndị ọrụ na-erubeghị afọ 16 enweghị ike ide ma ọ bụ ịgụ nkọwa, iso ndị ọrụ ọzọ, ma ọ bụ ilele ọdịnaya a kara dị ka nke na-adabaghị ụmụaka. Ha ka nwere ike ịmepụta ma bulite ọrụ, lelee ọrụ ọha, ma meghachi omume n'ọrụ site na ịkpọ ha asị. Mgbochi ndị a dị iji nye ebe mmụta dị nchebe."
    manageButton: 'Jikwaa akaụntụ nwa gị'
  portal:
    title: 'Ọnụ ụzọ nne na nna'
    description: 'Tinye adreesị ozi-e gị iji nata njikọ echekwara maka ijikwa akaụntụ Catrobat nwa gị. A ga-ezigara njikọ ahụ na adreesị ozi-e i nyere mgbe e debanyere aha.'
