privacy-policy:
  header: Privacy Policy
  version: 'Ụdị 2.2, 17 Ọktoba 2019'
  text1: "Iji nye gị uru niile nke ọrụ anyị na akaụntụ metụtara ya, ọ dị mkpa ịnakọta ụfọdụ data n'aka gị."
  text2: 'Iji debe ma meziwanye ọrụ anyị (ngwa na weebụsaịtị) na ime nchọpụta sayensị gbasara agụmakwụkwọ ICT na STEM/STEAM, anyị na-eji Google Analytics, Crashlytics na Firebase, nke Google LLC (USA) niile, yana Dynatrace nke Dynatrace LLC (USA) iji nweta metadata gbasara ojiji ọrụ anyị, dịka ozi mkpọka, oge, peeji/ihuenyo e lere, ojiji ngwa na ọrụ anyị, sistemụ arụmọrụ e ji eme ihe na ozi gbasara onye na-eweta netwọk. Nyocha a na data a nakọtara ejikọtaghị na profaịlụ gị, ọ nweghịkwa ozi onwe onye ọ bụla (a na-ezochi akụkụ ikpeazụ nke adreesị IP). Otú ọ dị, a ga-ebuga data a nakọtara n''aka ndị na-eweta ọrụ (Google LLC, USA na Dynatrace LLC, USA). Nhazi data dabere na nkwekọrịta ya na Google LLC na Dynatrace LLC. Mmekọrịta a na ndị na-eweta ọrụ dabara na Iwu Nchekwa Data Izugbe nke European Union (EU GDPR) na nkwekọrịta EU-USA "Privacy Shield".'
  text3: 'Iji mepụta ma jiri akaụntụ na sistemụ anyị, na ịgwa gị gbasara mgbanwe dị mkpa gbasara akaụntụ gị site na ozi-e, dịka mmelite ma ọ bụ mmebi nke Usoro ojiji na ọrụ anyị, iwu obodo anyị ma ọ bụ iwu anyị, anyị ga-echekwa aha njirimara gị na, ọ bụrụ na i nyere ya, adreesị ozi-e gị. Ọ bụrụ na i jikọtara akaụntụ gị site na Google Plus ma ọ bụ Facebook, anyị na-echekwakwa igodo njirimara jikọtara na akaụntụ gị na ọrụ ndị ahụ. Anyị agaghị eji data a mee ihe ọ bụla ọzọ (dịka ahịa), ma ọ bụrụ na i kwereghị anyị kpọmkwem ime ya.'
  text4: "Site n'afọ ofufo, ị nwere ike inye anyị obodo ị bi na ya site na peeji akaụntụ gị na saịtị nkesa. A ga-egosi nke a na profaịlụ ọha gị, anyị ga-ejikwa ya naanị maka ebumnuche ọnụ ọgụgụ na nchọpụta. Ị nwere ike iwepụ ya oge ọ bụla na ntọala profaịlụ gị."
  text5: "Ị nwere ike ịkwụsị ojiji data onwe gị nke akaụntụ gị oge ọ bụla site n'ihichapụ akaụntụ gị site na peeji profaịlụ gị na https://share.catrob.at/. Mgbe i hichapụrụ akaụntụ gị, ị ka ga-enwe ike iji ọrụ e nyere, mana ọ bụghị imekọ ihe ọnụ, dịka site n'ibulite mmemme, ide nkọwa ma ọ bụ ịkpọ ihe asị. Ọzọkwa, a ga-ehichapụ ọdịnaya niile e nyere jikọtara na akaụntụ gị, dịka mmemme e bulitere, nkọwa, wdg."
  text6: "Iji gbochie iji ọrụ anyị eme ihe ọjọọ, dịka site na mbulite ma ọ bụ nkọwa ndị ọrụ maka ebumnuche megidere iwu, a ga-echekwa data ọha niile ndị ọrụ mepụtara (mbulite, nkọwa) n'ime ọdụ data, ya na oge na adreesị ịntanetị e ji mee ihe. Ụlọ ọrụ ọ bụla agaghị eji data a ma ọ bụ a gaghị ebugara ha ya, ma ọ bụrụ na a na-enyo enyo n'ezie omume megidere iwu, ụlọ ọrụ iwu nwere ikike rịọkwa ya dabere n'iwu kwesịrị ekwesị. Anyị ga-ebu ụzọ nyochaa okwu ọ bụla nke ọma n'otu n'otu."
  text7: 'Ị nwere ike n''afọ ofufo idenye aha na Akwụkwọ ozi Catrobat, na https://catrob.at/newsletter nke anyị na-enye site n''ọrụ MailChimp (The Rocket Science Group LLC d/b/a MailChimp, USA). Ị ga-enweta mmelite gbasara ọrụ Catrobat na ọrụ ya na adreesị ozi-e i nyere. Ị nwere ike ịkwụsị akwụkwọ ozi ahụ oge ọ bụla site n''iji njikọ "unsubscribe" dị n''ala akwụkwọ ozi ọ bụla. MailChimp na-enye akwụkwọ ozi a, anyị na ha nwere nkwekọrịta nhazi data, ha kwekwara nkwa na Iwu Nchekwa Data Izugbe nke EU na EU-USA "Privacy Shield". Maka nkọwa ndị ọzọ gbasara MailChimp, biko lelee Iwu nzuzo na Usoro ojiji MailChimp.'
  text8: "Ọrụ Catrobat n'efu na nke ghe oghe na-enye Ọrụ niile n'okpuru nche nke International Catrobat Association – Verein zur Förderung freier Software, otu NGO na-anaghị achọ uru e debanyere na Graz, Austria (European Union). Iwu anyị na-asọpụrụ iwu nchekwa data nke EU na Austria (GDPR). Iji kpọtụrụ anyị, biko zipu ozi-e na contact@catrobat.org ma ọ bụ degara anyị akwụkwọ na Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union)."
  text9: "Ọ bụrụ na ị na-erubeghị afọ 14, onye nlekọta n'iwu (na-abụkarị nne ma ọ bụ nna) ga-anabata iwu a."
  text10: "Iwu nzuzo gọọmentị Catrobat n'asụsụ Bekee dị na weebụ na %privacy_policy%."
  disagree-text: 'Na-enweghị nkwenye, anyị enweghị ike ịmepụta akaụntụ mana atụmatụ ndị bụ isi ka dị.'
