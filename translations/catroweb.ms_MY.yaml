licenseToPlay:
  link: "Lesen untuk bermain"
  title: "Lesen untuk bermain - Beri kredit dan kongsi"
  text1: "Bayangkan setiap projek Catrobat ialah sebiji kek, kek yang sangat istimewa yang datang bersama resipinya (blok pengaturcaraan). Semua ahli komuniti Catrobat berkongsi kek mereka bersama resipinya. Ini bermakna kamu boleh menikmati kek itu dan belajar cara membuatnya sendiri!"
  text2: "Tiada resipi rahsia: arahan cara membuat kek ini terbuka untuk sesiapa sahaja menggunakan, menggunakan semula, mengubah suai dan dijadikan inspirasi untuk idea baharu... maksud saya kek."
  text3: "Kamu boleh makan kek itu dan juga menyalin resipi orang lain untuk membuat kek kamu sendiri, mungkin dengan bahan yang berbeza. Kebebasan ini datang dengan dua syarat mudah:"
  text4: "Semasa menubuhkan komuniti Catrobat, kami memutuskan untuk menggunakan pendekatan ini kerana kami percaya ia menyokong pembelajaran dan kreativiti dalam komuniti. Dengan berkongsi resipi dan bahan (skrip dan karya seni), orang ramai boleh membina di atas idea satu sama lain dan semua orang akan mendapat manfaat."
  text5: "Semasa mereka bentuk laman web Catrobat, kami menyertakan ciri untuk menggalakkan orang berkongsi dan memberi kredit kepada orang lain. Pada setiap halaman projek, kamu sentiasa boleh memuat turun skrip asal projek tersebut. Jika kamu me-remix projek (mengubah suai skrip atau karya seni, dan berkongsi hasilnya), kami menggalakkan kamu memberi kredit dalam nota projek, dengan menyebut orang dan projek yang memberi inspirasi kepada kamu."
  text6: "Ketahui lebih lanjut tentang terma penggunaan komuniti dalam talian Catrobat di %link-termsOfUse%."
  list1:
    item1: "kongsi kek kamu bersama resipinya"
    item2: "beri kredit kepada mereka yang memberi inspirasi kepada kamu"
  version: "Versi 1.1, 2 April 2013"
termsOfUse:
  title: "Terma Penggunaan"
  headline: "Selamat datang ke komuniti Catrobat!"
  text1: "Sebagai sebahagian daripada komuniti Catrobat, kamu berkongsi projek dan idea dengan orang:"
  text2: "Kami memerlukan bantuan kamu untuk menjadikan komuniti ini tempat yang menyokong setiap ahli. Begini cara kamu boleh membantu:"
  text3: "Melalui projek Catrobat, kami mahu memupuk kerjasama dan membolehkan kreativiti semua orang bergabung demi manfaat seluruh umat manusia. Kamu juga boleh menjadi ahli aktif komuniti Catrobat dengan memberikan projek kamu kembali kepada komuniti sebagai hadiah, sama seperti ahli aktif lain memberikan projek mereka kepada kamu:"
  text4: "Hadiah kami untuk kamu:"
  text5: "Terma Penggunaan dan Perkhidmatan kami:"
  list1:
    item1: "dari pelbagai negara dan budaya"
    item2: "dari semua peringkat umur (dari kanak-kanak kecil hingga remaja dan datuk nenek)"
    item3: "dengan semua tahap pengalaman"
  list2:
    item1: "Hormati orang lain. Semasa berkongsi projek, ingatlah bahawa orang dari pelbagai umur dan latar belakang akan melihat sumbangan kamu."
    item2: "Beri kredit. Kamu bebas membuat versi ubah suai projek orang lain - pastikan sahaja kamu memberi kredit kepada mereka. Satu tempat untuk memberi kredit ialah bahagian kredit projek kamu. Sila lihat perenggan di bawah senarai bertitik ini untuk butiran tentang mengubah suai projek pengguna lain."
    item3: "Jujur. Jangan berpura-pura menjadi orang lain atau cuba menipu komuniti."
    item4: "Rahsiakan maklumat peribadi. Jangan kongsi alamat e-mel, nombor telefon atau maklumat hubungan peribadi kamu yang lain."
    item5: "Bantu kekalkan laman ini mesra. Jika kamu rasa orang lain akan mendapati sesuatu projek atau komen itu kejam, menghina, terlalu ganas atau tidak sesuai, klik sahaja butang 'laporkan sebagai tidak sesuai' dan tinggalkan penjelasan ringkas. Pasukan Catrobat akan menyemak laporan kamu dan mungkin membuang mana-mana projek, komen atau hantaran."
  list3:
    item1: "Dengan memuat naik projek ke laman web kami, kamu menerima dan bersetuju untuk meletakkan karya ini di bawah lesen bebas tertentu bagi projek Catrobat yang dimuat naik. Sama seperti lesen bebas yang membolehkan sistem Catrobat itu sendiri tersedia kepada kamu, lesen bebas projek Catrobat yang dimuat naik ini memberi semua orang hak untuk belajar daripada karya yang telah dimuat naik oleh orang lain dan untuk mengadaptasi serta me-remix karya itu bagi membina permainan, animasi dan projek baharu mereka sendiri yang menarik. Ini membolehkan semua orang 'berdiri di atas bahu rakan sebaya', dan salah seorang daripadanya ialah kamu! Karya kamu dengan itu akan memberi manfaat kepada seluruh dunia dan kekal bebas untuk digunakan oleh semua orang, agak serupa dengan teks dan gambar yang disumbangkan secara bebas ke Wikipedia oleh sukarelawan dari seluruh dunia. Anggaplah ia sebagai hadiah kamu kepada manusia sejagat: kamu memberi kepada semua orang, dan semua orang lain yang memuat naik karya mereka ke laman web kami memberi kepada kamu. Oleh itu, projek yang dimuat naik ialah hadiah yang sangat bernilai yang diberikan oleh pemiliknya kepada kamu secara percuma, dengan syarat kamu menyertai komuniti dengan terma yang sama."
    item2: "Kamu tidak wajib menerima hadiah ini; jika kamu menerimanya, peraturan tertentu terpakai. Manfaat peraturan ini ialah kamu boleh belajar daripada karya tersebut dan membina di atasnya untuk menghasilkan sesuatu yang lebih hebat sendiri, yang kemudian boleh kamu, contohnya, muat naik semula ke laman web kami sebagai karya kamu sendiri. Manfaat lain ialah lesen ini memastikan kamu tidak boleh dipertanggungjawabkan atas sebarang masalah yang timbul kepada orang lain melalui penggunaan projek kamu oleh mereka."
    item3: "Satu syarat tambahan yang penting ialah kamu mesti memberi atribusi dengan jelas kepada pengarang yang karyanya menjadi asas karya kamu sendiri. Pada masa yang sama, kami akan berusaha keras supaya karya kamu dihargai dengan jelas oleh orang lain sebagai sumbangan kamu, dengan memberi atribusi kepada nama unik yang kamu pilih secara bebas untuk mewakili kamu dalam komuniti Catrobat, dan dengan memberi peluang kepada orang lain untuk menyatakan penghargaan mereka kepada kamu secara terbuka kerana telah memberikan karya kamu kepada semua orang, dan khususnya kepada mereka."
    item4: "Sila rujuk %link-licenseUploaded% untuk terma dan syarat undang-undang yang tepat."
  list4:
    item1: "Kami menawarkan semua perisian dan sumber Internet kami sendiri yang berkaitan dengan sistem Catrobat, contohnya perisian yang ditulis oleh pasukan Catrobat, laman web dan sumber Internet kami, kod sumber kami sendiri yang berkaitan dengan sistem Catrobat, dan semua bahan tambahan yang disertakan seperti gambar, bunyi dan teks, sekarang dan pada masa hadapan kepada kamu di bawah lesen bebas Catrobat."
    item2: "Lesen ini menjadikan semua bahagian Catrobat percuma untuk kamu dan juga bebas dalam erti kata memberi kamu kebebasan untuk menggunakannya mengikut kehendak kamu, dengan hanya beberapa sekatan yang memastikan, antara lain, bahawa sistem Catrobat akan kekal bebas dan berguna untuk semua orang selama-lamanya."
    item3: "Sila rujuk %link-licenseToPlay% untuk terma dan syarat undang-undang yang tepat. Kod sumber sistem Catrobat serta banyak dokumen dan sumber lain tersedia melalui %link-developer%."
  list5:
    item1: "Jika kamu, atau jika kamu berumur di bawah 13 tahun, ibu bapa atau penjaga sah kamu, mempunyai kaitan dengan organisasi yang terlibat dalam atau bertanggungjawab atas pelanggaran privasi jenis pukat tunda dan/atau pengawasan pukal atau besar-besaran, maka kamu tidak dibenarkan menggunakan aplikasi perisian kami dan mengakses perkhidmatan kami. Butiran tepat sekatan ini dan pengecualian tertentu kepadanya dinyatakan dalam Seksyen 4.a dan 4.b pada %link-termsOfUse% kami."
    item2: "Jika kamu berumur di bawah 13 tahun, kamu perlu bertanya kepada ibu bapa atau penjaga sah kamu sama ada mereka membenarkan kamu menggunakan Aplikasi Perisian dan Perkhidmatan Catrobat."
    item3: "Kami berhak untuk menolak, memadam atau menyembunyikan projek, akaun pengguna dan sebarang bahan digital yang dimuat naik ke laman web Catrobat pada bila-bila masa mengikut budi bicara kami sepenuhnya, contohnya jika kami mendapati sesuatu projek mengandungi bahan yang tidak sesuai atau seseorang pengguna melanggar hak orang lain."
    item4: "Semua perisian dan sumber Internet Catrobat ditawarkan dengan harapan ia akan berguna, tetapi tanpa sebarang waranti."
    item5: "Sila rujuk %link-termsOfUse% kami di developer.catrobat.org/terms_of_use_and_service untuk rumusan tepat perkara di atas dan beberapa terma serta syarat undang-undang tambahan."
  bottom1: "Semak semula di sini dari semasa ke semasa, kerana kami sentiasa berusaha menambah baik Terma Penggunaan kami."
  bottom2: "Sila e-melkan sebarang cadangan mengenai Terma Penggunaan ini kepada %email-webmaster%."
  version: "Versi 1.3, 4 Mac 2014"
