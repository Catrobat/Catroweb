passwordRecovery:
  subject: "Pemulihan kata laluan Catrobat kamu"
  message: |
    Hai %username%.
    Kamu telah meminta untuk menetapkan semula kata laluan kamu di %appplication_url% kerana kamu terlupa kata laluan.
    Jika kamu tidak membuat permintaan ini, sila abaikannya. Ia akan tamat tempoh dan tidak boleh digunakan lagi dalam masa 24 jam.
    Untuk menetapkan semula kata laluan dan mencipta yang baharu, sila lawati halaman berikut: %confirmationUrl%
    Kamu boleh menggunakan nama pengguna dan kata laluan kamu pada bila-bila masa untuk mengakses komuniti %appplication_url%.
    Untuk berbuat demikian, lawati sahaja halaman berikut: %loginPage%
    Untuk menyunting butiran profil kamu, pergi ke halaman ini: %profilePage%
    Salam mesra,
