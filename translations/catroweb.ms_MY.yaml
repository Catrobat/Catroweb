    Hai %username%.<br>
    <br>
    Kamu telah meminta untuk menetapkan semula kata laluan kamu di <a href="%appplication_url%">Pocket Code</a> kerana kamu terlupa kata laluan.
    Jika kamu tidak membuat permintaan ini, sila abaikannya. Ia akan tamat tempoh dan tidak boleh digunakan lagi dalam masa 24 jam.<br>
    <br>
    Untuk menetapkan semula kata laluan dan mencipta yang baharu, sila klik <a href="%confirmationUrl%">di sini.</a><br>
    <br>
    Kamu boleh menggunakan nama pengguna dan kata laluan kamu pada bila-bila masa untuk mengakses komuniti <a href="%appplication_url%">Pocket Code</a>.<br>
    Untuk berbuat demikian, lawati sahaja halaman berikut: <a href="%loginPage%">Halaman Log Masuk</a><br>
    Untuk menyunting butiran profil kamu, pergi ke <a href="%profilePage%">halaman</a> ini.<br>
    <br>
    Salam mesra,<br>
    Pasukan Catrobat kamu.
    </p>
