consent:
  email:
    subject: "Kebenaran ibu bapa diperlukan untuk akaun Catrobat anak kamu"
    title: "Kebenaran Ibu Bapa Diperlukan"
    greeting: "Hai,"
    message: "Anak kamu %username% telah mencipta akaun di Catrobat dan telah mengesahkan alamat e-melnya."
    explanation: "Catrobat ialah platform pendidikan percuma di mana golongan muda belajar mengekod dengan mencipta aplikasi, permainan dan animasi. Di bawah peraturan perlindungan kanak-kanak EU, kami memerlukan kebenaran kamu sebelum anak kamu boleh menyertai komuniti sepenuhnya. Sila klik butang di bawah untuk memberi kebenaran."
    button: "Beri Kebenaran Ibu Bapa"
    ignore: "Jika kamu tidak menjangkakan e-mel ini, kamu boleh abaikannya. Tanpa kebenaran, akaun ini akan mempunyai fungsi yang terhad."
    whatIsCatrobat: "Catrobat ialah platform pengaturcaraan pendidikan yang percuma dan bukan untung. Ketahui lebih lanjut di catrobat.org."
    manageLink: "Kamu boleh mengurus akaun anak kamu pada bila-bila masa melalui <a href=\"%portalUrl%\" style=\"color: #00acc1;\">Portal Ibu Bapa</a> kami. Ketahui lebih lanjut tentang <a href=\"%infoUrl%\" style=\"color: #00acc1;\">hak kamu sebagai ibu bapa</a>."
  confirmed:
    title: "Kebenaran Diberikan"
    message: "Terima kasih! Akaun %username% kini diaktifkan sepenuhnya."
    continueButton: "Terokai projek"
parent:
  footer:
    link: "Ibu Bapa & Penjaga"
  info:
    title: "Maklumat untuk Ibu Bapa & Penjaga"
    intro: "Catrobat mengambil serius keselamatan dan privasi pengguna muda. Halaman ini menerangkan cara kami melindungi anak kamu dan hak yang kamu miliki."
    whatIsCatrobat:
      title: "Apakah itu Catrobat?"
      text: "Catrobat ialah platform pendidikan percuma dan bukan untung di mana golongan muda belajar pengaturcaraan dengan mencipta aplikasi, permainan dan animasi mereka sendiri. Platform ini tersedia di seluruh dunia dan digunakan dalam persekitaran pendidikan."
    dataCollected:
      title: "Data apakah yang kami kumpul?"
      text: "Kami mengumpul data minimum yang diperlukan untuk mengendalikan platform: nama pengguna, alamat e-mel, tarikh lahir dan sebarang projek yang dicipta serta dimuat naik oleh anak kamu. Untuk pengguna di bawah 14 tahun, kami juga menyimpan alamat e-mel ibu bapa/penjaga bagi tujuan kebenaran. Kami tidak menjual atau berkongsi data peribadi dengan pihak ketiga."
    yourRights:
      title: "Hak kamu sebagai ibu bapa atau penjaga"
      text: "Di bawah peraturan perlindungan kanak-kanak EU (GDPR) dan COPPA, kamu berhak untuk: menyemak data yang kami simpan tentang anak kamu, meminta salinan data tersebut, menarik balik kebenaran kamu pada bila-bila masa (yang akan menyekat akaun), dan meminta pemadaman kekal akaun anak kamu serta semua data berkaitan."
    minorRestrictions:
      title: "Apakah sekatan yang dikenakan pada akaun bawah umur?"
      text: "Pengguna di bawah 16 tahun tidak boleh menghantar atau membaca komen, mengikuti pengguna lain atau melihat kandungan yang ditandakan sebagai tidak sesuai untuk kanak-kanak. Mereka masih boleh mencipta dan memuat naik projek, melayari projek awam dan memberi reaksi suka pada projek. Sekatan ini diadakan untuk menyediakan persekitaran pembelajaran yang selamat."
    manageButton: "Urus Akaun Anak Kamu"
  portal:
    title: "Portal Ibu Bapa"
    description: "Masukkan alamat e-mel kamu untuk menerima pautan selamat bagi mengurus akaun Catrobat anak kamu. Pautan akan dihantar ke alamat e-mel yang kamu berikan semasa pendaftaran."
