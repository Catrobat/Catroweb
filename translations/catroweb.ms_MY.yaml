footer:
  title: "Sertai Lebih %user_count% Minda Kreatif!"
  text: "Dengan %project_count% Projek Hebat yang sudah dikongsi, projek seterusnya mungkin milik kamu. Muat turun aplikasi kami dan mula mencipta hari ini"
privacy-policy:
  header: "Dasar privasi"
  version: "Versi 2.2, 17 Oktober 2019"
  text1: "Untuk menawarkan semua manfaat perkhidmatan kami dan akaun yang berkaitan kepada kamu, kami perlu mengumpul data tertentu daripada kamu."
  text2: "Untuk menyelenggara dan menambah baik perkhidmatan kami (aplikasi dan laman web) serta menjalankan penyelidikan saintifik tentang pendidikan ICT dan STEM/STEAM, kami menggunakan Google Analytics, Crashlytics dan Firebase, semuanya oleh Google LLC (AS), serta Dynatrace oleh Dynatrace LLC (AS) untuk mendapatkan metadata tentang penggunaan perkhidmatan kami, contohnya maklumat ranap, cap masa, halaman/skrin yang dilawati, penggunaan aplikasi dan perkhidmatan kami, sistem pengendalian yang digunakan dan maklumat tentang penyedia rangkaian. Analisis ini dan data yang dikumpul tidak dikaitkan dengan profil kamu dan tidak mengandungi sebarang maklumat peribadi (bit terakhir alamat IP dianonimkan). Walau bagaimanapun, data yang dikumpul akan dipindahkan kepada penyedia perkhidmatan (Google LLC, AS dan Dynatrace LLC, AS). Pemprosesan data adalah berdasarkan perjanjian dengan Google LLC dan Dynatrace LLC. Hubungan dengan penyedia perkhidmatan ini mematuhi Peraturan Perlindungan Data Am Kesatuan Eropah (EU GDPR) dan perjanjian EU-AS \"Privacy Shield\"."
  text3: "Untuk mencipta dan menggunakan akaun dalam sistem kami, dan untuk memaklumkan kamu melalui e-mel tentang perubahan yang perlu mengenai akaun kamu, contohnya kemas kini atau pelanggaran Terma Penggunaan dan Perkhidmatan, peraturan komuniti atau dasar kami, kami akan menyimpan nama pengguna kamu dan, jika kamu berikan, alamat e-mel kamu. Jika kamu telah menyambungkan akaun kamu melalui Google Plus atau Facebook, kami juga menyimpan kunci pengenalan yang dikaitkan dengan akaun kamu pada perkhidmatan tersebut. Kami tidak akan menggunakan data ini untuk sebarang tujuan lain (contohnya pemasaran), melainkan kamu membenarkan kami secara jelas."
  text4: "Secara sukarela, kamu boleh memberikan negara tempat tinggal kamu melalui halaman akaun kamu di laman perkongsian. Ini akan dipaparkan pada profil awam kamu dan hanya digunakan oleh kami untuk tujuan statistik dan penyelidikan. Ia boleh dibuang pada bila-bila masa dalam tetapan profil kamu."
  text5: "Kamu boleh menarik balik penggunaan data peribadi milik akaun kamu pada bila-bila masa dengan memadam akaun kamu melalui halaman profil kamu di https://share.catrob.at/. Selepas memadam akaun, kamu masih boleh menggunakan perkhidmatan yang disediakan, tetapi tidak boleh bekerjasama, contohnya melalui memuat naik program, mengulas atau menyukai. Selain itu, semua kandungan yang dikaitkan dengan akaun kamu, contohnya program yang dimuat naik, komen dan lain-lain, akan dipadam."
  text6: "Untuk mengelakkan penyalahgunaan perkhidmatan kami, contohnya melalui muat naik atau komen pengguna untuk tujuan haram, semua data awam yang dijana pengguna (muat naik, komen) akan disimpan secara dalaman dalam pangkalan data, bersama cap masa dan alamat internet yang digunakan. Data ini tidak akan digunakan oleh atau dihantar kepada mana-mana institusi, melainkan terdapat syak wasangka munasabah tentang tindakan yang cukup menyalahi undang-undang dan institusi undang-undang yang berhak secara rasmi memintanya berdasarkan undang-undang yang terpakai. Setiap kes akan disemak dengan teliti secara individu oleh kami terlebih dahulu."
  text7: "Kamu boleh melanggan Surat Berita Catrobat secara sukarela di https://catrob.at/newsletter yang disediakan oleh kami melalui perkhidmatan MailChimp (The Rocket Science Group LLC d/b/a MailChimp, AS). Kamu kemudian akan menerima kemas kini tentang projek Catrobat dan perkhidmatannya ke alamat e-mel yang kamu berikan. Kamu boleh berhenti melanggan surat berita pada bila-bila masa dengan menggunakan pautan \"unsubscribe\" di bahagian bawah setiap surat berita. Surat berita ini disediakan oleh MailChimp yang dengannya kami mempunyai perjanjian pemprosesan data dan yang komited kepada Peraturan Perlindungan Data Am EU dan \"Privacy Shield\" EU-AS. Untuk butiran lanjut tentang MailChimp, sila rujuk juga Dasar Privasi dan Terma Penggunaan MailChimp."
  text8: "Semua Perkhidmatan disediakan oleh projek sumber terbuka percuma Catrobat di bawah naungan International Catrobat Association – Verein zur Förderung freier Software, sebuah NGO bukan untung yang diperbadankan di Graz, Austria (Kesatuan Eropah). Dasar kami menghormati undang-undang perlindungan data EU dan Austria (GDPR). Untuk menghubungi kami, sila hantar e-mel ke contact@catrobat.org atau pos kepada kami di Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (Kesatuan Eropah)."
  text9: "Jika kamu berumur di bawah 14 tahun, dasar ini mesti diterima oleh penjaga sah (biasanya ibu bapa)."
  text10: "Dasar privasi rasmi Catrobat dalam bahasa Inggeris tersedia di web di %privacy_policy%."
  disagree-text: "Tanpa persetujuan, kami tidak dapat mencipta akaun tetapi ciri teras masih boleh diakses."
