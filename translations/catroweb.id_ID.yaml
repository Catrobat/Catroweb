      message: 'Jika ada akun yang terhubung dengan email ini, kami sudah mengirimkan tautan pengelolaan. Cek kotak masukmu dan ikuti tautannya untuk mengelola akun anakmu.'
  manage:
    title: 'Kelola Akun Anak'
    description: 'Kamu sedang mengelola akun yang terhubung dengan %email%.'
    consentStatus: 'Status izin'
    accountCreated: 'Akun dibuat'
    email: 'Email anak'
    status:
