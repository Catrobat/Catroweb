newAccountConfirmation:
  subject: 'Verifikasi alamat emailmu'
  welcome: 'Selamat datang di Catrobat!'
  greeting: 'Terima kasih sudah mendaftar! Verifikasi alamat emailmu untuk memulai.'
  message: 'Klik tombol di bawah untuk mengonfirmasi emailmu. Tautan ini berlaku sampai %time% dan hanya bisa digunakan sekali.'
  button: 'Verifikasi Alamat Email'
