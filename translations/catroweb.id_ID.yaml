parent:
  footer:
    link: 'Orang Tua & Wali'
  info:
    title: 'Informasi untuk Orang Tua & Wali'
    intro: 'Catrobat serius menjaga keamanan dan privasi pengguna muda. Halaman ini menjelaskan bagaimana kami melindungi anakmu dan hak apa saja yang kamu miliki.'
    whatIsCatrobat:
      title: 'Apa itu Catrobat?'
      text: 'Catrobat adalah platform pendidikan gratis dan nirlaba tempat anak muda belajar pemrograman dengan membuat aplikasi, game, dan animasi mereka sendiri. Platform ini tersedia di seluruh dunia dan digunakan di lingkungan pendidikan.'
    dataCollected:
      title: 'Data apa yang kami kumpulkan?'
      text: 'Kami hanya mengumpulkan data minimum yang diperlukan untuk menjalankan platform: nama pengguna, alamat email, tanggal lahir, dan proyek yang dibuat serta diunggah anakmu. Untuk pengguna di bawah 14 tahun, kami juga menyimpan alamat email orang tua/wali untuk keperluan izin. Kami tidak menjual atau membagikan data pribadi kepada pihak ketiga.'
    yourRights:
      title: 'Hakmu sebagai orang tua atau wali'
      text: 'Berdasarkan peraturan perlindungan anak Uni Eropa (GDPR) dan COPPA, kamu berhak untuk: meninjau data yang kami simpan tentang anakmu, meminta salinan data tersebut, mencabut izinmu kapan saja (yang akan membatasi akun), dan meminta penghapusan permanen akun anakmu beserta semua data terkait.'
    minorRestrictions:
      title: 'Pembatasan apa yang berlaku untuk akun anak di bawah umur?'
      text: 'Pengguna di bawah 16 tahun tidak bisa menulis atau membaca komentar, mengikuti pengguna lain, atau melihat konten yang ditandai tidak cocok untuk anak-anak. Mereka tetap bisa membuat dan mengunggah proyek, menjelajahi proyek publik, dan bereaksi pada proyek dengan suka. Pembatasan ini ada untuk menyediakan lingkungan belajar yang aman.'
    manageButton: 'Kelola Akun Anakmu'
