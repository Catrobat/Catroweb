licenseToPlay:
  link: 'Lisensi untuk bermain'
  title: 'Lisensi untuk bermain - memberikan kredit dan berbagi'
  text1: Bayangkan bahwa setiap proyek Catrobat adalah kue, kue yang sangat istimewa yang dilengkapi dengan resepnya (blok pemrograman). Semua anggota komunitas Catrobat berbagi kue mereka bersama dengan resep mereka. Artinya, kamu dapat menikmati kuenya dan belajar cara membuatnya sendiri!
  text2: 'Tidak ada resep rahasia: petunjuk tentang cara membuat kue ini terbuka bagi siapa saja untuk menggunakan, menggunakan kembali, memodifikasi, dan berfungsi sebagai inspirasi untuk ide-ide baru... Maksudku kue.'
  text3: "Kamu dapat makan kue serta menyalin resep orang lain untuk membuat resep kamu sendiri, mungkin dengan bahan-bahan yang berbeda. Kebebasan ini dengan dua persyaratan sederhana:"
  text4: "Dalam mendirikan komunitas Catrobat, kami memutuskan untuk mengadopsi pendekatan ini karena kami percaya bahwa itu mendukung pembelajaran dan kreativitas dalam komunitas. Dengan berbagi resep dan bahan-bahan (skrip dan karya seni), orang dapat membangun berdasarkan ide-ide satu sama lain dan setiap orang akan mendapat manfaat."
  text5: Dalam mendesain situs web Catrobat, kami menyertakan fitur untuk mendorong orang untuk berbagi dan memberikan penghargaan kepada orang lain. Di setiap halaman proyek, kamu selalu dapat mengunduh skrip asli untuk proyek tersebut. Jika kamu me-remix sebuah proyek (memodifikasi skrip atau karya seni, dan membagikan hasilnya), kami mendorong kamu untuk memberikan kredit dalam catatan proyek, menyebutkan orang-orang dan proyek yang menginspirasi kamu.
  text6: 'Pelajari lebih lanjut tentang syarat penggunaan dari komunitas online Catrobat pada %link-termsOfUse%.'
  list1:
    item1: berbagi kue kamu bersama dengan resepnya
    item2: memberikan kredit kepada mereka yang menginspirasi kamu
  version: Versi 1.1, 2 April 2013
termsOfUse:
  title: Persyaratan Penggunaan
  headline: Selamat datang di komunitas Catrobat!
  text1: 'Sebagai bagian dari komunitas Catrobat, kamu berbagi proyek dan ide dengan orang-orang:'
  text2: "Kami membutuhkan bantuan kamu untuk membuat komunitas ini menjadi tempat yang mendukung untuk setiap anggota. Berikut adalah bagaimana kamu bisa membantu:"
  text3: "Melalui proyek Catrobat kami ingin membina kerja sama dan memungkinkan kreativitas setiap orang untuk digabungkan demi kepentingan semua umat manusia. Kamu juga dapat menjadi anggota aktif komunitas Catrobat dengan memberikan proyek kamu kembali kepada komunitas sebagai hadiah, sama seperti anggota aktif lainnya memberikan proyek mereka kepada kamu:"
  text4: 'Hadiah kami kepada kamu:'
  text5: 'Syarat penggunaan dan layanan kami:'
  list1:
    item1: dari berbagai negara dan budaya
    item2: dari segala usia (dari anak-anak hingga remaja dan kakek-nenek)
    item3: dengan semua tingkat pengalaman
  list2:
    item1: Bersikaplah hormat. Saat berbagi proyek, harap diingat bahwa orang-orang dari berbagai usia dan latar belakang akan melihat kontribusi kamu.
    item2: "Berikan kredit. Jangan ragu untuk membuat versi modifikasi dari proyek orang lain - pastikan untuk memberi mereka kredit. Satu tempat untuk memberikan kredit adalah di bagian catatan dan kredit proyek kamu. Silakan lihat paragraf di bawah daftar putus-putus ini untuk detail tentang memodifikasi proyek pengguna lain."
    item3: "Bersikaplah jujur. Jangan berpura-pura menjadi orang lain selain dirimu yang sesungguhnya atau mencoba untuk menipu komunitas."
    item4: "Menyimpan informasi pribadi. Tidak berbagi alamat email, nomor telepon, atau informasi kontak pribadi lainnya."
    item5: "Bantu agar situs tetap ramah. Jika kamu merasa orang lain akan menganggap proyek atau komentar jahat, menghina, terlalu kasar, atau tidak pantas, cukup klik tombol 'laporkan sebagai tidak pantas' dan berikan penjelasan singkat. Tim Catrobat akan meninjau laporan kamu dan dapat menghapus proyek, komentar, atau kiriman apa pun."
  list3:
    item1: "Dengan mengunggah proyek ke situs web kami, kamu menerima dan setuju untuk menempatkan pekerjaan ini di bawah lisensi gratis tertentu dari proyek Catrobat yang diunggah. Mirip dengan lisensi gratis di mana sistem Catrobat itu sendiri tersedia untuk kamu, lisensi gratis dari proyek Catrobat yang diunggah ini memberi semua orang hak untuk belajar dari pekerjaan yang sebelumnya diunggah oleh orang lain dan untuk beradaptasi dan mencampur ulang yang berfungsi untuk membangun game baru mereka yang menarik, animasi, dan proyek lainnya. Hal ini memungkinkan setiap orang untuk 'berdiri di atas bahu rekan-rekannya', salah satunya adalah kamu! Dengan demikian, karya kamu akan bermanfaat bagi seluruh dunia dan tetap gratis untuk digunakan semua orang, sedikit mirip dengan teks dan gambar yang secara bebas disumbangkan ke Wikipedia oleh sukarelawan dari seluruh dunia. Anggap saja sebagai hadiah kamu untuk kemanusiaan: Kamu memberi kepada semua orang, dan semua orang lain yang mengunggah karya mereka ke situs web kami, berikan kepada kamu. Dengan demikian proyek yang diunggah adalah hadiah yang sangat berharga yang diberikan pemiliknya kepada kamu secara gratis, dengan syarat kamu berpartisipasi dalam komunitas dengan syarat yang sama."
    item2: Kamu tidak harus menerima hadiah itu; jika kamu melakukannya, aturan tertentu berlaku. Manfaat dari aturan ini adalah kamu dapat belajar dari pekerjaan dan mengembangkannya untuk membuat sendiri hal-hal yang lebih keren, yang kemudian dapat kamu, misalnya, unggah lagi ke situs web kami sebagai milik kamu. Manfaat lainnya adalah bahwa lisensi ini memastikan bahwa kamu tidak dapat dimintai pertanggungjawaban atas masalah apa pun yang timbul kepada orang lain melalui penggunaan proyek kamu oleh mereka.
    item3: "Satu syarat tambahan yang penting adalah bahwa kamu jelas memberikan atribusi pada penulis terhadap karya-karya kamu berdasarkan kerja kamu sendiri. Pada saat yang sama, kami akan bekerja keras sehingga karya kamu akan jelas dihargai oleh orang lain yang mana telah kamu sumbangkan, dengan memberikan atribusi untuk nama unik kamu bebas memilih untuk mewakili kamu di Catrobat di komunitas, dan dengan memberikan orang lain kesempatan untuk mengekspresikan rasa terima kasih kepada kamu dalam cara yang umum telah memberikan kamu bekerja untuk semua orang , dan khususnya kepada mereka."
    item4: 'Silakan berkonsultasi di %link-licenseUploaded% untuk syarat dan ketentuan hukum.'
  list4:
    item1: "Kami menawarkan semua perangkat lunak dan sumber daya Internet yang berkaitan dengan sistem Catrobat, misalnya, perangkat lunak yang ditulis oleh tim Catrobat, website kami dan Internet sumber daya, kode sumber kita sendiri yang berkaitan dengan sistem Catrobat, kami sendiri dan semua tambahan termasuk bahan-bahan seperti, misalnya, Gambar, suara dan teks, sekarang dan di masa depan untuk kamu di bawah lisensi bebas Catrobat."
    item2: Lisensi ini membuat semua bagian dari Catrobat gratis untuk kamu serta gratis dalam arti memberikan kamu kebebasan untuk menggunakannya bagaimanapun kamu menyukainya, dengan hanya beberapa pembatasan memastikan, antara lain, bahwa sistem Catrobat akan selamanya tetap gratis dan berguna bagi semua orang.
    item3: 'Silakan berkonsultasi di %link-licenseToPlay% untuk syarat dan ketentuan hukum. Kode sumber dari sistem Catrobat serta banyak dokumen dan sumber daya lainnya tersedia melalui %link-developer%.'
  list5:
    item1: 'Jika kamu, atau, jika kamu berada di bawah usia 13 tahun, orang tua atau wali hukum kamu, berhubungan dengan organisasi yang terlibat dalam atau bertanggung jawab atas pelanggaran privasi jenis Dragnet dan/atau atau surveilans massal , maka kamu tidak diizinkan untuk menggunakan aplikasi perangkat lunak kami dan untuk mengakses layanan kami. Rincian yang tepat dari pembatasan dan pengecualian tertentu itu digambarkan pada bagian 4.a dan b. pada %link-termsOfUse% kami.'
    item2: Jika kamu berusia di bawah 13 tahun, maka kamu harus meminta orang tua atau wali kamu apakah mereka mengijinkan kamu untuk menggunakan  aplikasi perangkat lunak Catrobat's  dan layanannya.
    item3: "Kami berhak untuk menolak, menghapus, atau menyembunyikan proyek, akun pengguna, dan materi digital apa pun yang diunggah ke situs web Catrobat kapan saja atas kebijakan kami sendiri, misalnya jika kami menemukan bahwa sebuah proyek berisi materi yang tidak pantas atau bahwa pengguna melanggar hak orang lain."
    item4: "Semua Catrobat di perangkat lunak dan sumber daya Internet yang ditawarkan dengan harapan bahwa mereka akan berguna, tetapi tanpa adanya jaminan."
    item5: 'Silakan hubungi developer kami %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service untuk rumusan yang tepat dari poin-point di atas dan beberapa syarat dan ketentuan hukum tambahan.'
  bottom1: Periksa kembali di sini dari waktu ke waktu, karena kami selalu berusaha untuk memperbaiki syarat penggunaan kami.
  bottom2: 'Silahkan email saran-saran mengenai syarat penggunaan ke %email-webmaster%.'
