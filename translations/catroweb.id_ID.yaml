passwordRecovery:
  subject: Pemulihan Kata Sandi Catrobat kamu
  message: |
    %username% yang terhormat.
    Kamu telah meminta untuk menyetel ulang kata sandi kamu di %appplication_url% karena kamu lupa kata sandi kamu.
    Jika kamu tidak memintanya, harap abaikan. Ini akan kedaluwarsa dan menjadi tidak berguna dalam waktu 24 jam.
    Untuk mereset kata sandi kamu dan membuat yang baru, silakan kunjungi halaman berikut: %confirmationUrl%
    Kamu dapat menggunakan nama pengguna dan sandi kamu kapan saja untuk mengakses komunitas %appplication_url%.
    Untuk melakukannya, cukup kunjungi halaman berikut: %loginPage%
    Untuk mengedit detail profil kamu, buka halaman ini: %profilePage%
    Salam Hormat,
    Tim Catrobat.
  messageHtml: |
    <p>
    Halo %username%. <br>
    <br>
    Kamu telah meminta untuk mengatur ulang kata sandi kamu di <a href="%appplication_url%"> Pocket Code </a> karena kamu lupa kata sandi kamu.
    Jika kamu tidak memintanya, harap abaikan. Ini akan kedaluwarsa dan menjadi tidak berguna dalam waktu 24 jam. <br>
    <br>
    Untuk menyetel ulang sandi kamu dan membuat yang baru, harap klik <a href="%confirmationUrl%"> di sini. </a> <br>
    <br>
    Kamu dapat menggunakan nama pengguna dan sandi kamu kapan saja untuk mengakses komunitas <a href="%appplication_url%"> Pocket Code </a>. <br>
    Untuk melakukannya, cukup kunjungi halaman berikut: <a href="%loginPage%"> Halaman Login </a> <br>
    Untuk mengedit detail profil kamu, buka <a href="%profilePage%"> halaman </a> ini. <br>
    <br>
    Salam, <br>
    Tim Catrobat.
    </p>
