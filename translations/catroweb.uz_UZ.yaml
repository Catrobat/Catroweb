licenseToPlay:
  link: "Oʻynash litsenziyasi"
  title: "Oʻynash litsenziyasi - Muallifni koʻrsat va ulash"
  text1: "Tasavvur qil, har bir Catrobat loyihasi — tort, oʻz retsepti (dasturlash bloklari) bilan keladigan juda maxsus tort. Catrobat hamjamiyatining barcha aʼzolari tortlarini retseptlari bilan birga ulashadi. Demak, tortlardan bahramand boʻlishing va ularni oʻzing qanday tayyorlashni oʻrganishing mumkin!"
  text2: "Maxfiy retseptlar yoʻq: bu tortlarni tayyorlash boʻyicha koʻrsatmalar hamma uchun ochiq — foydalanish, qayta ishlatish, oʻzgartirish va yangi gʻoyalar... yaʼni tortlar uchun ilhom manbai boʻlishi mumkin."
  text3: "Tortlarni yeyishing va oʻzingnikini, balki boshqa masalliqlar bilan tayyorlash uchun boshqalarning retseptlarini nusxalashing mumkin. Bu erkinlik ikkita oddiy shart bilan keladi:"
  text4: "Catrobat hamjamiyatini yaratishda biz bu yondashuvni tanladik, chunki u hamjamiyatda oʻrganish va ijodkorlikni qoʻllab-quvvatlaydi deb hisoblaymiz. Retseptlar va masalliqlarni (skriptlar va rasmlarni) ulashish orqali odamlar bir-birining gʻoyalari ustiga qurishi mumkin va bundan hamma foyda koʻradi."
  text5: "Catrobat saytini yaratishda biz odamlarni ulashishga va boshqalarni muallif sifatida koʻrsatishga undaydigan funksiyalarni qoʻshdik. Har bir loyiha sahifasida loyihaning asl skriptlarini doim yuklab olishing mumkin. Agar loyihani remiks qilsang (skriptlar yoki rasmlarni oʻzgartirib, natijani ulashsang), seni ilhomlantirgan odamlar va loyihani Loyiha eslatmalarida koʻrsatishingni tavsiya qilamiz."
  text6: "Catrobat onlayn hamjamiyatidan foydalanish shartlari haqida batafsil: %link-termsOfUse%."
  list1:
    item1: "tortlaringni retsepti bilan birga ulash"
    item2: "seni ilhomlantirganlarni muallif sifatida koʻrsat"
  version: "Versiya 1.1, 2013-yil 2-aprel"
termsOfUse:
  title: "Foydalanish shartlari"
  headline: "Catrobat hamjamiyatiga xush kelibsan!"
  text1: "Catrobat hamjamiyatining bir qismi sifatida sen loyiha va gʻoyalaringni quyidagi odamlar bilan ulashasan:"
  text2: "Bu hamjamiyatni har bir aʼzo uchun qoʻllab-quvvatlovchi joyga aylantirishda yordaming kerak. Mana qanday yordam berishing mumkin:"
  text3: "Catrobat loyihasi orqali biz hamkorlikni rivojlantirish va hammaning ijodkorligini butun insoniyat manfaati uchun birlashtirishni xohlaymiz. Boshqa faol aʼzolar senga oʻz loyihalarini berganidek, sen ham loyihalaringni hamjamiyatga sovgʻa sifatida qaytarib, Catrobat hamjamiyatining faol aʼzosiga aylanishing mumkin:"
  text4: "Bizning senga sovgʻamiz:"
  text5: "Bizning foydalanish va xizmat koʻrsatish shartlarimiz:"
  list1:
    item1: "turli mamlakatlar va madaniyatlardan"
    item2: "barcha yoshdagi (kichik bolalardan oʻsmirlar va bobo-buvilargacha)"
    item3: "turli tajriba darajasidagi"
  list2:
    item1: "Hurmatli boʻl. Loyihalarni ulashganda, sening hissangni turli yosh va kelib chiqishdagi odamlar koʻrishini unutma."
    item2: "Muallifni koʻrsat. Boshqalarning loyihalarini bemalol oʻzgartirib, oʻz versiyangni yaratishing mumkin - faqat ularni muallif sifatida koʻrsatishni unutma. Buning uchun bir joy - loyihangning mualliflar boʻlimi. Boshqa foydalanuvchilarning loyihalarini oʻzgartirish haqida batafsil maʼlumot uchun ushbu roʻyxat ostidagi paragrafni oʻqi."
    item3: "Rostgoʻy boʻl. Oʻzingni boshqa odam qilib koʻrsatma va hamjamiyatni aldashga urinma."
    item4: "Shaxsiy maʼlumotlarni maxfiy saqla. E-pochta manziling, telefon raqaming yoki boshqa shaxsiy aloqa maʼlumotlaringni ulashma."
    item5: "Saytni doʻstona saqlashga yordam ber. Agar biror loyiha yoki izohni boshqalar yomon, haqoratli, haddan tashqari zoʻravon yoki boshqacha nomaqbul deb bilishi mumkin deb oʻylasang, 'nomaqbul deb shikoyat qilish' tugmasini bos va qisqa izoh qoldir. Catrobat jamoasi shikoyatingni koʻrib chiqadi va har qanday loyiha, izoh yoki postni oʻchirishi mumkin."
  list3:
    item1: "Saytlarimizga loyiha yuklash orqali sen bu ishni yuklangan Catrobat loyihalarining maʼlum erkin litsenziyalari ostida joylashtirishga rozilik bildirasan. Catrobat tizimining oʻzi senga taqdim etilgan erkin litsenziyalar singari, yuklangan Catrobat loyihalarining bu erkin litsenziyalari hammaga boshqalar oldin yuklagan ishlardan oʻrganish, ularni moslashtirish va remiks qilib oʻzining yangi qiziqarli oʻyinlari, animatsiyalari va boshqa loyihalarini yaratish huquqini beradi. Bu hammaga 'tengdoshlarining yelkasida turish' imkonini beradi, ulardan biri sensan! Shu tariqa sening ishing butun dunyoga foyda keltiradi va hamma uchun erkin qoladi — butun dunyodan koʻngillilar Vikipediyaga erkin qoʻshgan matn va rasmlarga biroz oʻxshab. Buni insoniyatga sovgʻang deb bil: sen hammaga berasan, ishini saytlarimizga yuklagan boshqalar esa senga beradi. Shunday qilib, yuklangan loyiha — egasi senga tekin beradigan katta qiymatli sovgʻa, sharti shuki, sen ham hamjamiyatda xuddi shu shartlar asosida ishtirok etasan."
    item2: "Sovgʻani qabul qilishing shart emas; agar qabul qilsang, maʼlum qoidalar amal qiladi. Bu qoidalarning foydasi shundaki, sen ishdan oʻrganib, uning ustiga yanada ajoyibroq narsalar qurishing va keyin, masalan, ularni oʻzingniki sifatida yana saytlarimizga yuklashing mumkin. Yana bir foydasi — bu litsenziyalar boshqalar loyihangdan foydalanishi natijasida yuzaga keladigan muammolar uchun javobgar boʻlmasligingni taʼminlaydi."
    item3: "Muhim qoʻshimcha shartlardan biri — oʻz ishingga asos qilib olgan asarlar mualliflarini aniq koʻrsatishing. Shu bilan birga, biz sening ishing boshqalar tomonidan aynan sen qoʻshgan hissa sifatida qadrlanishi uchun astoydil harakat qilamiz: Catrobat hamjamiyatida seni ifodalash uchun oʻzing erkin tanlagan noyob nomingni koʻrsatamiz va boshqalarga ishingni hammaga, xususan ularga berganing uchun senga ochiq minnatdorchilik bildirish imkonini beramiz."
    item4: "Aniq huquqiy shartlar uchun %link-licenseUploaded% bilan tanishib chiq."
  list4:
    item1: "Biz Catrobat tizimiga oid barcha dasturiy taʼminot va internet resurslarimizni, masalan, Catrobat jamoasi yozgan dasturlarni, veb-saytlarimiz va internet resurslarimizni, Catrobat tizimiga oid oʻz manba kodimizni hamda rasmlar, tovushlar va matnlar kabi barcha qoʻshimcha materiallarni hozir va kelajakda senga Catrobat'ning erkin litsenziyalari ostida taqdim etamiz."
    item2: "Bu litsenziyalar Catrobat'ning barcha qismlarini senga ham bepul, ham erkin qiladi — yaʼni ulardan xohlaganingcha foydalanish erkinligini beradi, faqat bir nechta cheklovlar bilan, ular boshqa narsalar qatori Catrobat tizimi abadiy erkin va hamma uchun foydali boʻlib qolishini taʼminlaydi."
    item3: "Aniq huquqiy shartlar uchun %link-licenseToPlay% bilan tanishib chiq. Catrobat tizimining manba kodi hamda boshqa koʻplab hujjat va resurslar %link-developer% orqali mavjud."
  list5:
    item1: "Agar sen yoki, 13 yoshga toʻlmagan boʻlsang, ota-onang yoki qonuniy vasiylaring keng qamrovli maxfiylik buzilishlari va/yoki ommaviy kuzatuvda ishtirok etuvchi yoki unga masʼul tashkilot bilan bogʻliq boʻlsa, dasturiy ilovalarimizdan foydalanishing va xizmatlarimizga kirishing taqiqlanadi. Bu cheklovning aniq tafsilotlari va undagi baʼzi istisnolar %link-termsOfUse% sahifamizning 4.a va 4.b boʻlimlarida bayon etilgan."
    item2: "Agar 13 yoshga toʻlmagan boʻlsang, ota-onang yoki qonuniy vasiylaringdan Catrobat dasturiy ilovalari va xizmatlaridan foydalanishga ruxsat berishlarini soʻrashing kerak."
    item3: "Biz Catrobat saytlariga yuklangan loyihalar, foydalanuvchi hisoblari va har qanday raqamli materiallarni istalgan vaqtda oʻz ixtiyorimizga koʻra rad etish, oʻchirish yoki yashirish huquqini oʻzimizda saqlab qolamiz, masalan, loyihada nomaqbul material borligini yoki foydalanuvchi boshqa shaxslarning huquqlarini buzayotganini aniqlasak."
    item4: "Catrobat'ning barcha dasturiy taʼminoti va internet resurslari foydali boʻladi degan umidda, lekin hech qanday kafolatsiz taqdim etiladi."
    item5: "Yuqoridagi bandlarning aniq ifodalari va baʼzi qoʻshimcha huquqiy shartlar uchun %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service sahifamiz bilan tanishib chiq."
  bottom1: "Vaqti-vaqti bilan bu yerga qaytib tur, chunki biz foydalanish shartlarimizni doim yaxshilashga harakat qilamiz."
  bottom2: "Bu foydalanish shartlari boʻyicha takliflaringni %email-webmaster% manziliga yubor."
  version: "Versiya 1.3, 2014-yil 4-mart"
