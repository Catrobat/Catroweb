privacy-policy:
  header: "Maxfiylik siyosati"
  version: "Versiya 2.2, 2019-yil 17-oktabr"
  text1: "Xizmatlarimiz va unga bogʻliq hisobning barcha afzalliklarini taqdim etish uchun sendan maʼlum maʼlumotlarni yigʻishimiz zarur."
  text2: "Xizmatlarimizni (ilovalar va veb-saytlar) qoʻllab-quvvatlash va yaxshilash hamda AKT va STEM/STEAM taʼlimi boʻyicha ilmiy tadqiqotlar olib borish uchun xizmatlarimizdan foydalanish haqida metamaʼlumotlarni, masalan, ishdan chiqish maʼlumotlari, vaqt belgilari, tashrif buyurilgan sahifalar/ekranlar, ilova va xizmatlarimizdan foydalanish, ishlatilgan operatsion tizim va tarmoq provayderi haqidagi maʼlumotlarni olish uchun Google LLC (AQSh) kompaniyasining Google Analytics, Crashlytics va Firebase xizmatlaridan hamda Dynatrace LLC (AQSh) kompaniyasining Dynatrace xizmatidan foydalanamiz. Bu tahlil va yigʻilgan maʼlumotlar profilingga bogʻlanmaydi va hech qanday shaxsiy maʼlumotni oʻz ichiga olmaydi (IP manzilning oxirgi bitlari anonimlashtiriladi). Biroq yigʻilgan maʼlumotlar xizmat koʻrsatuvchilarga (Google LLC, AQSh va Dynatrace LLC, AQSh) uzatiladi. Maʼlumotlarni qayta ishlash Google LLC va Dynatrace LLC bilan tuzilgan kelishuvlarga asoslanadi. Xizmat koʻrsatuvchilar bilan bu munosabat Yevropa Ittifoqining Maʼlumotlarni himoya qilish umumiy reglamenti (EU GDPR) va YeI-AQSh \"Privacy Shield\" kelishuviga mos keladi."
  text3: "Tizimlarimizda hisob yaratish va undan foydalanish hamda hisobing boʻyicha zarur oʻzgarishlar, masalan, yangilanishlar yoki foydalanish va xizmat koʻrsatish shartlarimiz, hamjamiyat qoidalarimiz yoki siyosatlarimiz buzilishi haqida e-pochta orqali xabar berish uchun foydalanuvchi nomingni va, agar koʻrsatgan boʻlsang, e-pochta manzilingni saqlaymiz. Agar hisobingni Google Plus yoki Facebook orqali ulagan boʻlsang, qoʻshimcha ravishda bu xizmatlardagi hisobingga bogʻlangan identifikatsiya kalitini saqlaymiz. Bu maʼlumotlardan, sen bizga aniq ruxsat bermaguningcha, boshqa (masalan, marketing) maqsadlarda foydalanmaymiz."
  text4: "Ixtiyoriy ravishda ulashish saytidagi hisob sahifang orqali yashash mamlakatingni koʻrsatishing mumkin. U ommaviy profilingda koʻrsatiladi va biz tomonidan faqat statistika va tadqiqot maqsadlarida ishlatiladi. Uni istalgan vaqtda profil sozlamalaringda olib tashlashing mumkin."
  text5: "Hisobingga tegishli shaxsiy maʼlumotlardan foydalanishni istalgan vaqtda https://share.catrob.at/ saytidagi profil sahifang orqali hisobingni oʻchirib bekor qilishing mumkin. Hisobingni oʻchirgandan soʻng ham taqdim etilgan xizmatlardan foydalanishing mumkin, lekin hamkorlik qila olmaysan, masalan, dastur yuklash, izoh yozish yoki layk bosish. Shuningdek, hisobingga bogʻlangan barcha kontent, masalan, yuklangan dasturlar, izohlar va hokazo oʻchiriladi."
  text6: "Xizmatlarimizdan suiisteʼmol qilishning, masalan, foydalanuvchilar yuklagan fayllar yoki izohlardan noqonuniy maqsadlarda foydalanishning oldini olish uchun foydalanuvchilar yaratgan barcha ommaviy maʼlumotlar (yuklamalar, izohlar) vaqt belgisi va ishlatilgan internet manzili bilan birga ichki maʼlumotlar bazasida saqlanadi. Bu maʼlumotlar, agar jiddiy noqonuniy harakatlarga asosli shubha boʻlmasa va rasman vakolatli huquqiy idoralar amaldagi qonunchilik asosida talab qilmasa, hech qanday muassasa tomonidan ishlatilmaydi va ularga uzatilmaydi. Har bir holat avval biz tomonidan alohida sinchiklab tekshiriladi."
  text7: "Biz MailChimp xizmati (The Rocket Science Group LLC d/b/a MailChimp, AQSh) orqali taqdim etadigan Catrobat axborotnomasiga https://catrob.at/newsletter sahifasida ixtiyoriy obuna boʻlishing mumkin. Shundan soʻng koʻrsatgan e-pochta manzilingga Catrobat loyihasi va uning xizmatlari haqida yangiliklar olasan. Axborotnomadan istalgan vaqtda har bir axborotnoma pastidagi \"unsubscribe\" havolasi orqali voz kechishing mumkin. Bu axborotnoma biz bilan maʼlumotlarni qayta ishlash kelishuviga ega boʻlgan va YeI Maʼlumotlarni himoya qilish umumiy reglamenti hamda YeI-AQSh \"Privacy Shield\" kelishuviga rioya qilish majburiyatini olgan MailChimp tomonidan taqdim etiladi. MailChimp haqida batafsil maʼlumot uchun MailChimp'ning maxfiylik siyosati va foydalanish shartlari bilan ham tanishib chiq."
  text8: "Barcha xizmatlar bepul ochiq manbali Catrobat loyihasi tomonidan Graz, Avstriya (Yevropa Ittifoqi)da roʻyxatdan oʻtgan notijorat NNT — International Catrobat Association – Verein zur Förderung freier Software homiyligida taqdim etiladi. Siyosatlarimiz YeI va Avstriya maʼlumotlarni himoya qilish qonunchiligini (GDPR) hurmat qiladi. Biz bilan bogʻlanish uchun contact@catrobat.org manziliga xat yubor yoki quyidagi manzilga pochta orqali yoz: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union)."
  text9: "Agar 14 yoshga toʻlmagan boʻlsang, bu siyosatni qonuniy vasiy (odatda ota-ona) qabul qilishi kerak."
  text10: "Catrobat'ning rasmiy ingliz tilidagi maxfiylik siyosati internetda %privacy_policy% manzilida mavjud."
  disagree-text: "Roziliksiz hisob yarata olmaymiz, lekin asosiy funksiyalar baribir mavjud."
