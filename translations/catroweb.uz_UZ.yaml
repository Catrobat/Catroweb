consent:
  email:
    subject: "Farzandingizning Catrobat hisobi uchun ota-ona roziligi kerak"
    title: "Ota-ona roziligi talab qilinadi"
    greeting: "Salom,"
    message: "Farzandingiz %username% Catrobat'da hisob yaratdi va e-pochta manzilini tasdiqladi."
    explanation: "Catrobat — yoshlar ilovalar, oʻyinlar va animatsiyalar yaratib dasturlashni oʻrganadigan bepul taʼlim platformasi. YeI bolalarni himoya qilish qoidalariga koʻra, farzandingiz hamjamiyatda toʻliq ishtirok etishi uchun sizning roziligingiz kerak. Rozilik berish uchun quyidagi tugmani bosing."
    button: "Ota-ona roziligini berish"
    ignore: "Agar bu xatni kutmagan boʻlsangiz, unga eʼtibor bermasangiz ham boʻladi. Roziliksiz hisob cheklangan imkoniyatlarga ega boʻladi."
    whatIsCatrobat: "Catrobat — bepul, notijorat taʼlimiy dasturlash platformasi. Batafsil: catrobat.org."
    manageLink: "Farzandingiz hisobini istalgan vaqtda <a href=\"%portalUrl%\" style=\"color: #00acc1;\">Ota-onalar portali</a> orqali boshqarishingiz mumkin. <a href=\"%infoUrl%\" style=\"color: #00acc1;\">Ota-ona sifatidagi huquqlaringiz</a> haqida koʻproq bilib oling."
  confirmed:
    title: "Rozilik berildi"
    message: "Rahmat! %username% hisobi endi toʻliq faollashtirildi."
    continueButton: "Loyihalarni kashf qilish"
parent:
  footer:
    link: "Ota-onalar va vasiylar"
  info:
    title: "Ota-onalar va vasiylar uchun maʼlumot"
    intro: "Catrobat yosh foydalanuvchilarning xavfsizligi va maxfiyligiga jiddiy yondashadi. Bu sahifada farzandingizni qanday himoya qilishimiz va qanday huquqlarga ega ekaningiz tushuntiriladi."
    whatIsCatrobat:
      title: "Catrobat nima?"
      text: "Catrobat — yoshlar oʻz ilovalari, oʻyinlari va animatsiyalarini yaratib dasturlashni oʻrganadigan bepul, notijorat taʼlim platformasi. Platforma butun dunyoda mavjud va taʼlim muassasalarida qoʻllaniladi."
    dataCollected:
      title: "Qanday maʼlumotlarni yigʻamiz?"
      text: "Platformani ishlatish uchun zarur boʻlgan minimal maʼlumotlarni yigʻamiz: foydalanuvchi nomi, e-pochta manzili, tugʻilgan sana va farzandingiz yaratib yuklagan loyihalar. 14 yoshgacha boʻlgan foydalanuvchilar uchun rozilik maqsadida ota-ona/vasiy e-pochta manzilini ham saqlaymiz. Shaxsiy maʼlumotlarni uchinchi shaxslarga sotmaymiz va bermaymiz."
    yourRights:
      title: "Ota-ona yoki vasiy sifatidagi huquqlaringiz"
      text: "YeI bolalarni himoya qilish qoidalari (GDPR) va COPPA'ga koʻra, siz quyidagi huquqlarga egasiz: farzandingiz haqida saqlanayotgan maʼlumotlarni koʻrish, ularning nusxasini soʻrash, roziligingizni istalgan vaqtda qaytarib olish (bu hisobni cheklaydi) va farzandingiz hisobi hamda unga bogʻliq barcha maʼlumotlarni butunlay oʻchirishni soʻrash."
    minorRestrictions:
      title: "Voyaga yetmaganlar hisoblariga qanday cheklovlar qoʻllaniladi?"
      text: "16 yoshgacha boʻlgan foydalanuvchilar izoh yoza olmaydi va oʻqiy olmaydi, boshqa foydalanuvchilarga obuna boʻla olmaydi yoki bolalar uchun mos emas deb belgilangan kontentni koʻra olmaydi. Ular baribir loyihalar yaratib yuklashi, ommaviy loyihalarni koʻrishi va loyihalarga layk bilan reaksiya bildirishi mumkin. Bu cheklovlar xavfsiz oʻquv muhitini taʼminlash uchun joriy qilingan."
    manageButton: "Farzandingiz hisobini boshqarish"
