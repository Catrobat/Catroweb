consent:
  email:
    subject: "Potrebna je roditeljska suglasnost za Catrobat račun tvog djeteta"
    title: "Potrebna je roditeljska suglasnost"
    greeting: "Bok,"
    message: "Tvoje dijete %username% izradilo je račun na Catrobatu i potvrdilo svoju e-adresu."
    explanation: "Catrobat je besplatna obrazovna platforma na kojoj mladi uče programirati izrađujući aplikacije, igre i animacije. Prema propisima EU-a o zaštiti djece potrebna nam je tvoja suglasnost prije nego što tvoje dijete može u potpunosti sudjelovati u zajednici. Za davanje suglasnosti klikni gumb ispod."
    button: "Daj roditeljsku suglasnost"
    ignore: "Ako nisi očekivao/la ovaj e-mail, slobodno ga zanemari. Bez suglasnosti račun će imati ograničene funkcije."
    whatIsCatrobat: "Catrobat je besplatna, neprofitna obrazovna platforma za programiranje. Saznaj više na catrobat.org."
    manageLink: 'Računom svog djeteta možeš upravljati u bilo kojem trenutku putem našeg <a href="%portalUrl%" style="color: #00acc1;">Roditeljskog portala</a>. Saznaj više o <a href="%infoUrl%" style="color: #00acc1;">svojim pravima kao roditelj</a>.'
  confirmed:
    title: "Suglasnost dana"
    message: "Hvala! Račun korisnika %username% sada je potpuno aktiviran."
    continueButton: "Otkrij projekte"
parent:
  footer:
    link: "Roditelji i skrbnici"
  info:
    title: "Informacije za roditelje i skrbnike"
    intro: "Catrobat ozbiljno shvaća sigurnost i privatnost mladih korisnika. Ova stranica objašnjava kako štitimo tvoje dijete i koja prava imaš."
    whatIsCatrobat:
      title: "Što je Catrobat?"
      text: "Catrobat je besplatna, neprofitna obrazovna platforma na kojoj mladi uče programirati izrađujući vlastite aplikacije, igre i animacije. Platforma je dostupna u cijelom svijetu i koristi se u obrazovanju."
    dataCollected:
      title: "Koje podatke prikupljamo?"
      text: "Prikupljamo samo podatke nužne za rad platforme: korisničko ime, e-adresu, datum rođenja te projekte koje tvoje dijete izradi i prenese. Za korisnike mlađe od 14 godina pohranjujemo i e-adresu roditelja/skrbnika radi suglasnosti. Osobne podatke ne prodajemo niti dijelimo s trećim stranama."
    yourRights:
      title: "Tvoja prava kao roditelja ili skrbnika"
      text: "Prema propisima EU-a o zaštiti djece (GDPR) i COPPA-i imaš pravo: pregledati podatke koje imamo o tvom djetetu, zatražiti kopiju tih podataka, u bilo kojem trenutku povući suglasnost (čime se račun ograničava) te zatražiti trajno brisanje računa svog djeteta i svih povezanih podataka."
    minorRestrictions:
      title: "Koja ograničenja vrijede za račune maloljetnika?"
      text: "Korisnici mlađi od 16 godina ne mogu objavljivati ni čitati komentare, pratiti druge korisnike niti gledati sadržaj označen kao neprikladan za djecu. I dalje mogu izrađivati i prenositi projekte, pregledavati javne projekte i reagirati na projekte sviđanjima. Ova ograničenja postoje kako bi okruženje za učenje bilo sigurno."
    manageButton: "Upravljaj računom svog djeteta"
  portal:
    title: "Roditeljski portal"
    description: "Unesi svoju e-adresu i dobit ćeš sigurnu poveznicu za upravljanje Catrobat računom svog djeteta. Poveznica će biti poslana na e-adresu navedenu pri registraciji."
