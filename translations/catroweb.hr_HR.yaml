licenseToPlay:
  link: 'Licenca za reproduciranje'
  title: 'Licenca za reproduciranje – daj zasluge i podijeli'
  text1: Zamisli da je svaki Catrobat program kolač, i to vrlo poseban kolač koji dolazi sa svojim receptom (programskim blokovima). Svi članovi Catrobat zajednice dijele kolače zajedno s receptima. To znači da možeš uživati u kolačima i sam/a naučiti kako ih napraviti!
  text2: 'Nema tajnih recepata: upute kako napraviti ove kolače dostupne su svima za korištenje, ponovnu upotrebu, mijenjanje i kao inspiracija za nove ideje... mislim, kolače.'
  text3: "Možeš jesti te kolače, kao i kopirati recepte od drugih da bi napravio svoj osobni, ali možda sa drugim sastojcima.\nTa sloboda dolazi sa dva jednostavna uslova:"
  text4: "Pri postavljanju Catrobat zajednice odlučili smo prihvatiti ovaj pristup jer vjerujemo da podržava učenje i kreativnost unutar zajednice. Dijeljenjem recepata i sastojaka (skripti i ilustracija) ljudi mogu nadograđivati tuđe ideje i svi od toga imaju koristi."
  text5: Pri dizajniranju Catrobat web-stranice uključili smo značajke koje potiču ljude da dijele i odaju zasluge drugima. Na stranici svakog programa uvijek možeš preuzeti originalne skripte programa. Ako napraviš remiks programa (promijeniš skripte ili ilustracije i podijeliš rezultat), potičemo te da u bilješkama programa odaš zasluge i spomeneš ljude i program koji su te inspirirali.
  text6: 'Saznaj više o uvjetima korištenja Catrobat online zajednice na %link-termsOfUse%.'
  list1:
    item1: podijeli svoje kolače zajedno sa receptima
    item2: daj zasluge onome tko te inspirirao
  version: Verzija 1.1, 2 travanj 2013
termsOfUse:
  title: Uvjeti korištenja
  headline: Dobrodošao/la u Catrobat zajednicu!
  text1: 'Kao dio Catrobat zajednice, dijeliš programe i ideje s ljudima:'
  text2: "Trebamo tvoju pomoć kako bi ova zajednica bila mjesto podrške za svakog člana. Evo kako možeš pomoći:"
  text3: "Kroz projekt Catrobat želimo poticati suradnju i omogućiti da se svačija kreativnost kombinira na dobrobit cijelog čovječanstva.\nI ti možeš postati aktivan član Catrobat zajednice tako da svoje programe podijeliš sa zajednicom kao dar, na isti način na koji drugi aktivni članovi dijele svoje programe s tobom:"
  text4: 'Naš poklon za tebe:'
  text5: 'Naši uvjeti korištenja i usluga:'
  list1:
    item1: iz više različitih država i kultura
    item2: svih uzrasta (od djece i tinejdžera do baka i dјedova)
    item3: sa različitim razinama iskustava
  list2:
    item1: Imaj razumijevanja. Prilikom zajedničkog korištenja programa, imaj na umu da ljudi mnogih različitih dobi i porijekla vide tvoj doprinos.
    item2: "Daj kredit. Slobodno modificiraj programe drugih ljudi - samo pazi da im daš kredit. Jedno mjesto gdje možeš dati kredit je u opisu tvog programa. Molimo pogledaj odlomak, ispod ovog popisa, sa detaljima o modificiranju programa drugih korisnika."
    item3: "Budi iskren. Ne pretvaraj se da si netko drugi da bi prevario zajednicu."
    item4: "Čuvaj osobne podatke. Ne dijeli svoju email adresu, broj telefona ili druge osobne podatke za kontakt."
    item5: "Pomozi održati stranicu ljubaznom. Ako misliš da bi drugi mogli pronaći neki program ili značenje komentara, uvredljivim, previše nasilnim ili na neki drugi način neprikladnim, samo klikni na gumb \"prijavi kao neprikladan\" i ostavi kratko objašnjenje. Catrobat tim će pregledati izvješće i može ukloniti program, komentar ili objavu."
  list3:
    item1: "Prenošenjem programa na našu web-stranicu prihvaćaš objavu svog rada pod određenim besplatnim licencama za Catrobat programe, slično besplatnim licencama pod kojima ti je dostupan sustav Catrobat. Te besplatne licence za prenesene Catrobat programe daju svima pravo da uče iz prethodno prenesenih programa te da prilagođavaju i remiksaju taj rad kako bi izradili vlastite zadivljujuće igre, animacije i druge programe. To svima omogućuje da 'stoje na ramenima svojih kolega' – a jedan od njih si i ti! Tvoj rad koristit će cijelom svijetu i ostati besplatan za sve, slično tekstovima i slikama koje volonteri iz cijelog svijeta besplatno doprinose Wikipediji. Zamisli to kao dar čovječanstvu: dijeliš sa svima, a svi drugi dijele svoj rad na web-stranici s tobom.\nStoga je svaki preneseni program dar velike vrijednosti koji ti vlasnik daje besplatno, pod uvjetom da i ti sudjeluješ u zajednici pod istim uvjetima."
    item2: Dar ne moraš prihvatiti; ako ga prihvatiš, vrijede određena pravila. Prednost tih pravila je što možeš učiti iz tuđeg rada i nadograđivati ga te tako izraditi još bolje stvari, koje zatim možeš, npr., ponovno prenijeti na naše web-stranice kao svoje. Još jedna prednost je što te licence osiguravaju da ne možeš odgovarati za probleme koji drugima nastanu korištenjem tvog projekta.
    item3: "Jedan važan dodatni uvjet je da jasno navedeš autore na čijim se radovima temelji tvoj rad. Istodobno ćemo se truditi da drugi jasno prepoznaju tvoj doprinos – navođenjem jedinstvenog imena koje si slobodno odabrao/la da te predstavlja u Catrobat zajednici – te da drugima damo priliku da ti javno zahvale što si svoj rad dao/la svima, a posebno njima."
    item4: 'Točne pravne uvjete potraži na %link-licenseUploaded%.'
  list4:
    item1: "Sav naš vlastiti softver i internetske resurse povezane sa sustavom Catrobat, npr. softver koji je napisao Catrobat tim, naše web-stranice i internetske resurse, naš vlastiti izvorni kod povezan sa sustavom Catrobat te sve dodatne uključene materijale poput slika, zvukova i tekstova, nudimo ti sada i ubuduće pod besplatnim Catrobat licencama."
    item2: Te licence čine sve dijelove Catrobata besplatnima za tebe, ali i slobodnima u smislu da ih možeš koristiti kako god želiš, uz samo nekoliko ograničenja koja, među ostalim, osiguravaju da sustav Catrobat zauvijek ostane slobodan i koristan za sve.
    item3: 'Točne pravne uvjete potraži na %link-licenseToPlay%. Izvorni kod sustava Catrobat, kao i mnogi drugi dokumenti i resursi, dostupni su putem %link-developer%.'
  list5:
    item1: 'Ako si ti ili, ako si mlađi/a od 13 godina, tvoji roditelji ili zakonski skrbnici povezani s organizacijom koja je uključena u masovno kršenje privatnosti i/ili masovni nadzor ili je za to odgovorna, ne smiješ koristiti naše softverske aplikacije niti pristupati našim uslugama. Točni detalji ovog ograničenja i određene iznimke opisani su u odjeljcima 4.a i 4.b na našoj stranici %link-termsOfUse%.'
    item2: Ako si mlađi od 13 godina, moraš pitati roditelje ili zakonske skrbnike da li će ti oni dopustiti da koristiš Catrobat softver aplikacije i usluge.
    item3: "Zadržavamo pravo da u bilo kojem trenutku, prema vlastitom nahođenju, odbijemo, izbrišemo ili sakrijemo projekte, korisničke račune i sve digitalne materijale prenesene na Catrobat web-stranice, primjerice ako utvrdimo da projekt sadrži neprikladan materijal ili da korisnik krši prava drugih osoba."
    item4: "Svi Catrobat softveri i internet sredstva su ponuđeni u nadi da će biti korisni, ali bez jamstva."
    item5: 'Točne formulacije gornjih točaka i neke dodatne pravne uvjete potraži na našoj stranici %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service.'
  bottom1: Navrati ovdje s vremena na vrijeme, jer mi uvijek pokušavamo da poboljšamo naše uvjete korištenja.
  bottom2: 'Prijedloge u vezi s ovim Uvjetima korištenja pošalji na %email-webmaster%.'
  version: Verzija 1.3, 4 Ožujak 2014
