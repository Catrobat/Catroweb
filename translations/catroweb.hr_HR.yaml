  email:
    subject: "Potrebna je roditeljska suglasnost za Catrobat račun tvog djeteta"
    title: "Potrebna je roditeljska suglasnost"
    greeting: "Bok,"
    message: "Tvoje dijete %username% izradilo je račun na Catrobatu i potvrdilo svoju e-adresu."
    explanation: "Catrobat je besplatna obrazovna platforma na kojoj mladi uče programirati izrađujući aplikacije, igre i animacije. Prema propisima EU-a o zaštiti djece potrebna nam je tvoja suglasnost prije nego što tvoje dijete može u potpunosti sudjelovati u zajednici. Za davanje suglasnosti klikni gumb ispod."
