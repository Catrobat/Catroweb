passwordRecovery:
  subject: Oporavak tvoje Catrobat lozinke
  message: |
    Bok %username%,

    zatražio/la si ponovno postavljanje lozinke na %appplication_url% jer si zaboravio/la lozinku.
    Ako ovo nisi zatražio/la, zanemari ovu poruku. Poveznica istječe za 24 sata i nakon toga se više ne može koristiti.

    Za ponovno postavljanje lozinke i izradu nove posjeti sljedeću stranicu: %confirmationUrl%

    Svojim korisničkim imenom i lozinkom u bilo kojem trenutku možeš pristupiti zajednici %appplication_url%.
    Za to samo posjeti sljedeću stranicu: %loginPage%
    Za uređivanje podataka profila idi na ovu stranicu: %profilePage%

    Srdačan pozdrav,
    tvoj Catrobat tim
  messageHtml: |
    <p>
    Bok %username%,<br>
    <br>
    zatražio/la si ponovno postavljanje lozinke na <a href="%appplication_url%">Pocket Code</a> jer si zaboravio/la lozinku.
    Ako ovo nisi zatražio/la, zanemari ovu poruku. Poveznica istječe za 24 sata i nakon toga se više ne može koristiti.<br>
    <br>
    Za ponovno postavljanje lozinke i izradu nove klikni <a href="%confirmationUrl%">ovdje.</a><br>
    <br>
    Svojim korisničkim imenom i lozinkom u bilo kojem trenutku možeš pristupiti zajednici <a href="%appplication_url%">Pocket Code</a>.<br>
    Za to samo posjeti sljedeću stranicu: <a href="%loginPage%">Stranica za prijavu</a><br>
    Za uređivanje podataka profila idi na ovu <a href="%profilePage%">stranicu</a>.<br>
    <br>
    Srdačan pozdrav,<br>
    tvoj Catrobat tim
    </p>
