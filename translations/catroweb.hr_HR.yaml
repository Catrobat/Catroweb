privacy-policy:
  header: Pravila privatnosti
  version: Verzija 2.2, 17. listopada 2019.
  text1: Kako bismo ti mogli ponuditi sve prednosti naših usluga i pripadajućeg računa, potrebno je prikupiti određene podatke o tebi.
  text2: Za održavanje i poboljšanje naših usluga (aplikacija i web-stranica) te za znanstveno istraživanje obrazovanja u području IKT-a i STEM/STEAM-a koristimo Google Analytics, Crashlytics i Firebase, sve od tvrtke Google LLC (SAD), kao i Dynatrace tvrtke Dynatrace LLC (SAD), kako bismo dobili metapodatke o korištenju naših usluga, npr. informacije o rušenjima, vremenske oznake, posjećene stranice/zaslone, korištenje naših aplikacija i usluga, korišteni operacijski sustav i informacije o mrežnom operateru. Ova analiza i prikupljeni podaci nisu povezani s tvojim profilom i ne sadrže osobne podatke (posljednji dijelovi IP adrese se anonimiziraju). Međutim, prikupljeni podaci prenose se pružateljima usluga (Google LLC, SAD i Dynatrace LLC, SAD). Obrada podataka temelji se na ugovorima s tvrtkama Google LLC i Dynatrace LLC. Ovaj odnos s pružateljima usluga usklađen je s Općom uredbom o zaštiti podataka Europske unije (EU GDPR) i sporazumom EU-SAD "Privacy Shield".
  text3: Kako bismo izradili tvoj račun u našim sustavima, omogućili ti njegovo korištenje i e-mailom te obavještavali o potrebnim promjenama vezanima uz tvoj račun, npr. ažuriranjima ili kršenjima naših Uvjeta korištenja i usluge, pravila zajednice ili naših pravila, pohranit ćemo tvoje korisničko ime i, ako je navedeš, tvoju e-adresu. Ako je tvoj račun povezan putem Google Plusa ili Facebooka, dodatno pohranjujemo identifikacijski ključ povezan s tvojim računom na tim uslugama. Te podatke nećemo koristiti ni u koje druge svrhe (npr. marketinške), osim ako nam to izričito ne dopustiš.
  text4: Dobrovoljno nam možeš navesti svoju državu prebivališta na stranici svog računa na stranici za dijeljenje. Ona će se prikazivati na tvom javnom profilu i koristit ćemo je samo u statističke i istraživačke svrhe. U bilo kojem trenutku možeš je ukloniti u postavkama profila.
  text5: Korištenje osobnih podataka povezanih s tvojim računom možeš u bilo kojem trenutku povući brisanjem računa na stranici svog profila na https://share.catrob.at/. Nakon brisanja računa i dalje ćeš moći koristiti ponuđene usluge, ali ne i surađivati, npr. prenošenjem programa, komentiranjem ili sviđanjima. Također će se izbrisati sav sadržaj povezan s tvojim računom, npr. preneseni programi, komentari itd.
  text6: Kako bismo spriječili zlouporabu naših usluga, npr. prijenosima ili komentarima u nezakonite svrhe, svi javni podaci koje stvore korisnici (prijenosi, komentari) interno se pohranjuju u bazu podataka zajedno s vremenskom oznakom i korištenom internetskom adresom. Ti se podaci neće koristiti niti prosljeđivati nikakvim institucijama, osim ako postoji opravdana sumnja na dovoljno ozbiljne nezakonite radnje i službeno ovlaštene pravne institucije to zatraže na temelju važećeg zakona. Svaki ćemo slučaj najprije temeljito pojedinačno provjeriti.
  text7: Možeš se dobrovoljno pretplatiti na Catrobat newsletter na https://catrob.at/newsletter, koji pružamo putem usluge MailChimp (The Rocket Science Group LLC d/b/a MailChimp, SAD). Tada ćeš na navedenu e-adresu primati novosti o projektu Catrobat i njegovim uslugama. Pretplatu možeš otkazati u bilo kojem trenutku putem poveznice "unsubscribe" u podnožju svakog newslettera. Newsletter pruža MailChimp, s kojim imamo ugovor o obradi podataka i koji se obvezao poštovati Opću uredbu EU-a o zaštiti podataka i "Privacy Shield" EU-SAD. Za više detalja o MailChimpu pogledaj i MailChimpova Pravila privatnosti i Uvjete korištenja.
  text8: Sve usluge pruža slobodni projekt otvorenog koda Catrobat pod okriljem udruge International Catrobat Association – Verein zur Förderung freier Software, neprofitne nevladine organizacije registrirane u Grazu, Austrija (Europska unija). Naša pravila poštuju zakone EU-a i Austrije o zaštiti podataka (GDPR). Za kontakt nam pošalji e-mail na contact@catrobat.org ili nam piši na adresu Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).
  text9: Ako si mlađi/a od 14 godina, ova pravila mora prihvatiti zakonski skrbnik (obično roditelj).
  text10: Službena Catrobatova pravila privatnosti na engleskom jeziku dostupna su na webu na %privacy_policy%.
  disagree-text: Bez odobrenja ne možemo izraditi račun, ali osnovne značajke i dalje su dostupne.
