    Votre équipe Catrobat.
    </p>
newAccountConfirmation:
  subject: "Vérifiez votre adresse e-mail"
  welcome: "Bienvenue sur Catrobat !"
  greeting: "Merci pour votre inscription ! Veuillez vérifier votre adresse e-mail pour commencer."
  message: "Cliquez sur le bouton ci-dessous pour confirmer votre adresse e-mail. Ce lien est valable jusqu'à %time% et ne peut être utilisé qu'une seule fois."
  button: "Vérifier l'adresse e-mail"
  ignore: "Si vous n'avez pas créé de compte Catrobat, vous pouvez ignorer cet e-mail."
  autoDelete: "Les comptes non vérifiés sont supprimés automatiquement après 30 jours."
consent:
  email:
    subject: "Consentement parental requis pour le compte Catrobat de votre enfant"
    title: "Consentement parental requis"
    greeting: "Bonjour,"
    message: "Votre enfant %username% a créé un compte sur Catrobat et a vérifié son adresse e-mail."
    explanation: "Catrobat est une plateforme éducative gratuite où les jeunes apprennent à programmer en créant des applications, des jeux et des animations. Conformément à la réglementation européenne sur la protection des enfants, nous avons besoin de votre consentement avant que votre enfant puisse participer pleinement à la communauté. Veuillez cliquer sur le bouton ci-dessous pour donner votre consentement."
    button: "Donner le consentement parental"
    ignore: "Si vous n'attendiez pas cet e-mail, vous pouvez l'ignorer. Sans consentement, le compte aura des fonctionnalités limitées."
    whatIsCatrobat: "Catrobat est une plateforme éducative de programmation gratuite et à but non lucratif. Pour en savoir plus : catrobat.org."
    manageLink: 'Vous pouvez gérer le compte de votre enfant à tout moment via notre <a href="%portalUrl%" style="color: #00acc1;">Espace parents</a>. En savoir plus sur <a href="%infoUrl%" style="color: #00acc1;">vos droits en tant que parent</a>.'
  confirmed:
    title: "Consentement accordé"
    message: "Merci ! Le compte de %username% est maintenant entièrement activé."
    continueButton: "Découvrir des projets"
parent:
  footer:
    link: "Parents et tuteurs"
  info:
    title: "Informations pour les parents et tuteurs"
    intro: "Catrobat prend au sérieux la sécurité et la vie privée des jeunes utilisateurs. Cette page explique comment nous protégeons votre enfant et quels sont vos droits."
    whatIsCatrobat:
      title: "Qu'est-ce que Catrobat ?"
      text: "Catrobat est une plateforme éducative gratuite et à but non lucratif où les jeunes apprennent la programmation en créant leurs propres applications, jeux et animations. La plateforme est disponible dans le monde entier et utilisée dans des contextes éducatifs."
    dataCollected:
      title: "Quelles données collectons-nous ?"
      text: "Nous collectons uniquement les données nécessaires au fonctionnement de la plateforme : nom d'utilisateur, adresse e-mail, date de naissance et les projets que votre enfant crée et publie. Pour les utilisateurs de moins de 14 ans, nous enregistrons également l'adresse e-mail d'un parent ou tuteur à des fins de consentement. Nous ne vendons ni ne partageons aucune donnée personnelle avec des tiers."
    yourRights:
      title: "Vos droits en tant que parent ou tuteur"
      text: "Conformément à la réglementation européenne sur la protection des enfants (RGPD) et à la COPPA, vous avez le droit de : consulter les données que nous détenons sur votre enfant, en demander une copie, retirer votre consentement à tout moment (ce qui restreint le compte) et demander la suppression définitive du compte de votre enfant et de toutes les données associées."
    minorRestrictions:
      title: "Quelles restrictions s'appliquent aux comptes de mineurs ?"
      text: "Les utilisateurs de moins de 16 ans ne peuvent pas publier ni lire de commentaires, suivre d'autres utilisateurs ou voir les contenus marqués comme inadaptés aux enfants. Ils peuvent toujours créer et publier des projets, parcourir les projets publics et réagir aux projets avec des « j'aime ». Ces restrictions visent à offrir un environnement d'apprentissage sûr."
    manageButton: "Gérer le compte de votre enfant"
  portal:
    title: "Espace parents"
    description: "Saisissez votre adresse e-mail pour recevoir un lien sécurisé permettant de gérer le compte Catrobat de votre enfant. Le lien sera envoyé à l'adresse e-mail indiquée lors de l'inscription."
    emailLabel: "Votre adresse e-mail"
    submitButton: "Envoyer le lien de gestion"
    infoLink: "En savoir plus"
    success:
      title: "Consultez votre boîte de réception"
      message: "Si un compte est associé à cette adresse e-mail, nous avons envoyé un lien de gestion. Veuillez consulter votre boîte de réception et suivre le lien pour gérer le compte de votre enfant."
  manage:
    title: "Gérer les comptes enfants"
    description: "Vous gérez les comptes associés à %email%."
    consentStatus: "Statut du consentement"
    accountCreated: "Compte créé"
    email: "E-mail de l'enfant"
    status:
      granted: "Accordé"
      pending: "En attente"
      revoked: "Retiré"
    grantButton: "Accorder le consentement"
    revokeButton: "Retirer le consentement"
    revokeConfirm: "Voulez-vous vraiment retirer votre consentement ? Le compte aura des fonctionnalités limitées."
    exportButton: "Exporter les données"
    deleteButton: "Supprimer le compte"
    deleteConfirm: "Voulez-vous vraiment supprimer définitivement ce compte ? Cette action est irréversible."
  management:
    email:
      subject: "Gérer le compte Catrobat de votre enfant"
      title: "Gestion du compte"
      greeting: "Bonjour,"
      message: "Vous avez demandé un lien pour gérer le compte Catrobat de votre enfant (%usernames%). Cliquez sur le bouton ci-dessous pour consulter et gérer le compte."
      button: "Gérer le compte"
      ignore: "Si vous n'êtes pas à l'origine de cette demande, vous pouvez ignorer cet e-mail."
passwordRecovery:
  subject: Votre récupération de mot de passe Catrobat
  message: |
    Cher %username%.
    Vous avez demandé à réinitialiser votre mot de passe sur %appplication_url% car vous avez oublié votre mot de passe.
    Si vous n'avez pas fait cette demande, veuillez l'ignorer. Il expirera et deviendra inutile dans 24 heures.
    Pour réinitialiser votre mot de passe et en créer un nouveau, veuillez visiter la page suivante : %confirmationUrl%
    Vous pouvez utiliser votre nom d'utilisateur et votre mot de passe à tout moment pour accéder à la communauté %appplication_url%.
    Pour ce faire, il vous suffit de vous rendre sur la page suivante : %loginPage%
    Pour modifier les détails de votre profil, rendez-vous sur cette page : %profilePage%
    Meilleures salutations,
    Votre équipe Catrobat.
  messageHtml: |
    <p>
    Cher %username%.<br>
    <br>
    Vous avez demandé la réinitialisation de votre mot de passe sur <a href="%appplication_url%">Pocket Code</a> car vous avez oublié votre mot de passe.
    Si vous n'avez pas fait cette demande, veuillez l'ignorer. Il expirera et deviendra inutile dans 24 heures.<br>
    <br>
    Pour réinitialiser votre mot de passe et en créer un nouveau, veuillez cliquer sur <a href="%confirmationUrl%">ici.</a><br>
    <br>
    Vous pouvez utiliser votre nom d'utilisateur et votre mot de passe à tout moment pour accéder à la communauté <a href="%appplication_url%">Pocket Code</a>.<br>
    Pour ce faire, il vous suffit de vous rendre sur la page suivante : <a href="%loginPage%">Page de connexion</a><br>
    Pour modifier les détails de votre profil, rendez-vous sur cette <a href="%profilePage%">page</a>.<br>
    <br>
    Meilleures salutations,<br>
    Votre équipe Catrobat.
    </p>
