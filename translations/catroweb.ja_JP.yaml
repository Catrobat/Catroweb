passwordRecovery:
  subject: あなたの Catrobat パスワードを回復
  message: |
    親愛なる %username%。
    パスワードを忘れたため、%appplication_url%でパスワードのリセットを要求しました。
    リクエストしていない場合は、無視してください。24時間後には期限切れとなり、使えなくなります。
    パスワードをリセットして新しいパスワードを作成するには、以下のページにアクセスしてください。%confirmationUrl% です。
    ユーザー名とパスワードを使って、いつでも%appplication_url%コミュニティにアクセスすることができます。
    これを行うには、次のページにアクセスしてください。%loginPage% (ログインページ)
    プロフィールの詳細を編集するには、このページにアクセスしてください。%profilePage%
    よろしくお願いします。
    Your Catrobat Team.
  messageHtml: "<p>\n%username% 様<br>\n<br>\nパスワードをお忘れになったため、<a href=\"%appplication_url%\">Pocket Code</a> のパスワードの再設定がリクエストされました。\nリクエストしていない場合は、このメールを無視してください。24 時間後に期限切れとなり、使えなくなります。<br>\n<br>\nパスワードを再設定して新しいパスワードを作成するには、<a href=\"%confirmationUrl%\">ここをクリックしてください。</a><br>\n<br>\nユーザー名とパスワードを使って、いつでも <a href=\"%appplication_url%\">Pocket Code</a> コミュニティにアクセスできます。<br>\n次のページにアクセスしてください：<a href=\"%loginPage%\">ログインページ</a><br>\nプロフィールの詳細を編集するには、こちらの<a href=\"%profilePage%\">ページ</a>にアクセスしてください。<br>\n<br>\nよろしくお願いいたします。<br>\nCatrobat チーム\n</p>\n"
