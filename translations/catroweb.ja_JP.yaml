parent:
  footer:
    link: "保護者の方へ"
  info:
    title: "保護者の方へのご案内"
    intro: "Catrobat は、若いユーザーの安全とプライバシーを真剣に考えています。このページでは、お子さまをどのように守っているか、また保護者にどのような権利があるかを説明します。"
    whatIsCatrobat:
      title: "Catrobat とは？"
      text: "Catrobat は、若い人たちが自分でアプリ、ゲーム、アニメーションを作りながらプログラミングを学べる、無料の非営利の教育プラットフォームです。世界中で利用でき、教育の現場でも使われています。"
    dataCollected:
      title: "どのようなデータを収集していますか？"
      text: "プラットフォームの運営に必要な最小限のデータのみを収集しています：ユーザー名、メールアドレス、生年月日、そしてお子さまが作成・アップロードしたプロジェクトです。14 歳未満のユーザーについては、同意を得るために保護者のメールアドレスも保存します。個人データを販売したり、第三者と共有したりすることはありません。"
    yourRights:
      title: "保護者の権利"
      text: "EU の児童保護規則（GDPR）および COPPA に基づき、保護者には次の権利があります：お子さまについて当社が保有するデータの確認、そのデータのコピーの請求、いつでも同意を取り消すこと（アカウントは制限されます）、そしてお子さまのアカウントとすべての関連データの完全な削除の請求です。"
