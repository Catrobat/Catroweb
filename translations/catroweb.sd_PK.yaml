licenseToPlay:
  link: 'کيڏڻ جو اجازت نامو'
  title: 'کيڏڻ جو اجازت نامو - ڪريڊٽ ڏي ۽ شيئر ڪر'
  text1: 'تصور ڪر ته هر Catrobat پروجيڪٽ هڪ ڪيڪ آهي، هڪ تمام خاص ڪيڪ جنهن سان ان جي ترڪيب (پروگرامنگ بلاڪ) به اچي ٿي. Catrobat ڪميونٽي جا سڀ ميمبر پنهنجا ڪيڪ ترڪيبن سميت شيئر ڪن ٿا. ان جو مطلب آهي ته تون ڪيڪن جو مزو وٺي سگهين ٿو ۽ پاڻ انهن کي ٺاهڻ به سکي سگهين ٿو!'
  text2: 'هتي ڪي بہ ڳجها ٽوٽڪا نہ آهن: ڪيڪَ ڪيئن ٺاهبا جون هدايتون هر هڪ لاءِاستعمال لاءِ کليل آهن، ٻيهر استعمال، ڦيرڦار، ۽ بطور خدمت نون اساه خيالن لاءِ... منهنجو مطلب ڪيڪَ.'
  text3: 'تون ڪيڪ کائي به سگهين ٿو ۽ ٻين ماڻهن جون ترڪيبون ڪاپي ڪري پنهنجا ڪيڪ به ٺاهي سگهين ٿو، شايد مختلف اجزا سان. هن آزادي سان ٻه سادا شرط آهن:'
  text4: 'Catrobat ڪميونٽي قائم ڪندي، اسان اهو طريقو اختيار ڪرڻ جو فيصلو ڪيو ڇو ته اسان سمجهون ٿا ته اهو ڪميونٽي ۾ سکيا ۽ تخليقيت کي سهارو ڏئي ٿو. ترڪيبون ۽ اجزا (اسڪرپٽ ۽ آرٽ ورڪ) شيئر ڪرڻ سان، ماڻهو هڪ ٻئي جي خيالن تي اڏاوت ڪري سگهن ٿا ۽ هر ڪنهن کي فائدو ٿيندو.'
  text5: 'Catrobat ويب سائيٽ ٺاهيندي، اسان اهڙيون خاصيتون شامل ڪيون جيڪي ماڻهن کي شيئر ڪرڻ ۽ ٻين کي ڪريڊٽ ڏيڻ لاءِ همٿائين. هر پروجيڪٽ صفحي تي، تون هميشه پروجيڪٽ جا اصل اسڪرپٽ ڊائونلوڊ ڪري سگهين ٿو. جيڪڏهن تون ڪنهن پروجيڪٽ کي ريمڪس ڪرين (اسڪرپٽ يا آرٽ ورڪ بدلائي، نتيجو شيئر ڪرين)، ته اسان توکي همٿايون ٿا ته پروجيڪٽ نوٽس ۾ ڪريڊٽ ڏي، انهن ماڻهن ۽ پروجيڪٽ جو ذڪر ڪري جن توکي متاثر ڪيو.'
  text6: 'آن لائين Catrobat ڪميونٽي جي استعمال جي شرطن بابت وڌيڪ ڄاڻڻ لاءِ %link-termsOfUse% ڏس.'
  list1:
    item1: 'پنهنجو ڪيڪ ترڪيب سميت شيئر ڪر'
    item2: 'انهن کي ڪريڊٽ ڏي جن توکي متاثر ڪيو'
  version: مسودو 1.1، اپريل 2، 2013ع
termsOfUse:
  title: استعمال جا شرط شروط
  headline: 'Catrobat ڪميونٽي ۾ ڀليڪار!'
  text1: 'Catrobat ڪميونٽي جي حصي طور، تون ماڻهن سان پروجيڪٽ ۽ خيال شيئر ڪري رهيو آهين:'
  text2: 'هن ڪميونٽي کي مددگار جڳهه بڻائڻ لاءِ اسان کي تنهنجي مدد گهرجي. تون هن طرح اسان جي مدد ڪري سگهين ٿو:'
  text3: 'Catrobat پروجيڪٽ ذريعي اسان تعاون کي وڌائڻ ٿا چاهيون ۽ هر ڪنهن جي تخليقيت کي سڄي انسانيت جي ڀلائي لاءِ گڏ ٿيڻ جو موقعو ڏيڻ ٿا چاهيون. تون به Catrobat ڪميونٽي جو سرگرم ميمبر بڻجي سگهين ٿو پنهنجا پروجيڪٽ ڪميونٽي کي تحفي طور واپس ڏئي، ساڳي طرح جيئن ٻيا سرگرم ميمبر پنهنجا پروجيڪٽ توکي ڏئي رهيا آهن:'
  text4: 'تنهنجي لاءِ اسان جو تحفو:'
  text5: 'استعمال ۽ خدمات لاءِ اسان جا شرط:'
  list1:
    item1: ڪيترن ئي مختلف ملڪن ۽ ثقافتن مان
    item2: هر عمر (نوجوان ٻارن کان ڳڀرو تائين ۽ ڏاڏن پڙڏاڏن تائين)
    item3: هر سطح جو تجربو
  list2:
    item1: 'عزت سان پيش اچ. پروجيڪٽ شيئر ڪندي، مهرباني ڪري ياد رک ته مختلف عمرين ۽ پسمنظرن جا ماڻهو تنهنجو ڪم ڏسندا.'
    item2: 'ڪريڊٽ ڏي. ٻين ماڻهن جي پروجيڪٽن جا بدليل ورزن بنا جهجهڪ ٺاهه - بس پڪ ڪر ته انهن کي ڪريڊٽ ڏين. ڪريڊٽ ڏيڻ جي هڪ جڳهه تنهنجي پروجيڪٽ جو ڪريڊٽس وارو حصو آهي. ٻين يوزرن جا پروجيڪٽ بدلائڻ بابت تفصيل لاءِ مهرباني ڪري هن نقطن واري لسٽ هيٺ ڏنل پيراگراف ڏس.'
    item3: 'ايمانداري ڏيکار. مهرباني ڪري ٻيو ڪو بڻجي ڪميونٽي کي ٺڳڻ جي ڪوشش نه ڪر.'
    item4: 'ذاتي معلومات پرائيويٽ رک. پنهنجي اي ميل ايڊريس، فون نمبر يا ٻي ذاتي رابطي جي معلومات شيئر نه ڪر.'
    item5: 'سائيٽ کي دوستاڻو رکڻ ۾ مدد ڪر. جيڪڏهن توکي لڳي ته ٻين کي ڪو پروجيڪٽ يا تبصرو بدتميز، توهين آميز، تمام گهڻو تشدد وارو يا ٻي طرح نامناسب لڳندو، ته بس ''نامناسب طور رپورٽ ڪر'' بٽڻ تي ڪلڪ ڪر ۽ مختصر وضاحت لک. Catrobat ٽيم تنهنجي رپورٽ جو جائزو وٺندي ۽ ڪو به پروجيڪٽ، تبصرو يا پوسٽ هٽائي سگهي ٿي.'
  list3:
    item1: 'اسان جي ويب سائيٽن تي پروجيڪٽ اپلوڊ ڪري، تون قبول ڪرين ٿو ۽ متفق آهين ته هي ڪم اپلوڊ ٿيل Catrobat پروجيڪٽن جي ڪجهه مفت لائسنسن هيٺ رکين. انهن مفت لائسنسن وانگر جن هيٺ Catrobat سسٽم پاڻ توکي ملي ٿو، اپلوڊ ٿيل Catrobat پروجيڪٽن جا هي مفت لائسنس هر ڪنهن کي حق ڏين ٿا ته ٻين جي اڳ ۾ اپلوڊ ڪيل ڪم مان سکن ۽ ان ڪم کي ترتيب ڏئي ۽ ريمڪس ڪري پنهنجون نيون دلچسپ رانديون، اينيميشنون ۽ ٻيا پروجيڪٽ ٺاهين. ان سان هر ڪو ''پنهنجن ساٿين جي ڪلهن تي بيهي'' سگهي ٿو، جن مان هڪ تون به آهين! اهڙي طرح تنهنجو ڪم سڄي دنيا کي فائدو ڏيندو ۽ هر ڪنهن جي استعمال لاءِ مفت رهندو، ڪجهه حد تائين انهن لکتن ۽ تصويرن وانگر جيڪي سڄي دنيا جا رضاڪار وڪيپيڊيا کي مفت ۾ ڏين ٿا. ان کي انسانيت لاءِ پنهنجو تحفو سمجهه: تون هر ڪنهن کي ڏين ٿو، ۽ اهي سڀ ٻيا جيڪي اسان جي ويب سائيٽن تي پنهنجو ڪم اپلوڊ ڪن ٿا توکي ڏين ٿا. اهڙي طرح اپلوڊ ٿيل پروجيڪٽ هڪ وڏي قدر وارو تحفو آهي جيڪو ان جو مالڪ توکي مفت ۾ ڏئي ٿو، ان شرط سان ته تون به ساڳين شرطن تي ڪميونٽي ۾ حصو وٺين.'
    item2: 'توکي تحفو قبول ڪرڻ ضروري ناهي؛ جيڪڏهن ڪرين ٿو ته ڪجهه ضابطا لاڳو ٿين ٿا. انهن ضابطن جا فائدا اهي آهن ته تون ڪم مان سکي سگهين ٿو ۽ ان تي اڏاوت ڪري پاڻ اڃا به وڌيڪ شاندار شيون ٺاهي سگهين ٿو، جيڪي تون پوءِ، مثال طور، ٻيهر اسان جي ويب سائيٽن تي پنهنجي طور اپلوڊ ڪري سگهين ٿو. ٻيو فائدو اهو آهي ته هي لائسنس پڪ ڪن ٿا ته تنهنجي پروجيڪٽ جي استعمال سبب ٻين کي پيش ايندڙ ڪنهن به مسئلي جو ذميوار توکي نٿو بڻائي سگهجي.'
    item3: 'هڪ اهم اضافي شرط اهو آهي ته تون انهن ليکڪن کي واضح طور ڪريڊٽ ڏين جن جي ڪم تي تو پنهنجو ڪم ٻڌل ڪيو. ساڳئي وقت، اسان سخت محنت ڪنداسين ته ٻيا واضح طور تسليم ڪن ته تنهنجو ڪم تو ڏنو آهي، ان منفرد نالي کي ڪريڊٽ ڏئي جيڪو تو Catrobat جي ڪميونٽي ۾ پنهنجي نمائندگي لاءِ آزاديءَ سان چونڊيو آهي، ۽ ٻين کي موقعو ڏئي ته اهي پنهنجو ڪم هر ڪنهن کي، ۽ خاص طور تي انهن کي، ڏيڻ تي عوامي طور تنهنجو شڪريو ادا ڪن.'
    item4: 'درست قانوني شرطن ۽ ضابطن لاءِ مهرباني ڪري %link-licenseUploaded% ڏس.'
  list4:
    item1: 'اسان Catrobat سسٽم سان لاڳاپيل پنهنجا سڀ سافٽ ويئر ۽ انٽرنيٽ وسيلا، مثال طور Catrobat ٽيم جو لکيل سافٽ ويئر، اسان جون ويب سائيٽون ۽ انٽرنيٽ وسيلا، Catrobat سسٽم سان لاڳاپيل اسان جو پنهنجو سورس ڪوڊ، ۽ سڀ اضافي شامل مواد جهڙوڪ تصويرون، آواز ۽ لکتون، هاڻي ۽ مستقبل ۾ Catrobat جي مفت لائسنسن هيٺ توکي پيش ڪريون ٿا.'
    item2: 'هي لائسنس Catrobat جا سڀ حصا توکي مفت به ڏين ٿا ۽ آزاد به، ان معنيٰ ۾ ته توکي انهن کي جيئن چاهين استعمال ڪرڻ جي آزادي آهي، صرف ڪجهه پابندين سان جيڪي ٻين ڳالهين سان گڏ پڪ ڪن ٿيون ته Catrobat سسٽم هميشه لاءِ هر ڪنهن لاءِ مفت ۽ ڪارآمد رهي.'
    item3: 'درست قانوني شرطن ۽ ضابطن لاءِ مهرباني ڪري %link-licenseToPlay% ڏس. Catrobat سسٽم جو سورس ڪوڊ ۽ ٻيا ڪيترائي دستاويز ۽ وسيلا %link-developer% ذريعي موجود آهن.'
  list5:
    item1: 'جيڪڏهن تون، يا جيڪڏهن تنهنجي عمر 13 سالن کان گهٽ آهي ته تنهنجا والدين يا قانوني سرپرست، ڪنهن اهڙي اداري سان لاڳاپيل آهن جيڪو وڏي پيماني تي پرائيويسي جي خلاف ورزين ۽/يا اجتماعي نگراني ۾ ملوث يا ذميوار آهي، ته پوءِ توکي اسان جون سافٽ ويئر ايپليڪيشنون استعمال ڪرڻ ۽ اسان جي خدمتن تائين پهچڻ جي اجازت ناهي. هن پابندي جا درست تفصيل ۽ ان جون ڪجهه استثنائون اسان جي %link-termsOfUse% جي سيڪشن 4.a ۽ 4.b ۾ بيان ٿيل آهن.'
    item2: 'جيڪڏهن تنهنجي عمر 13 سالن کان گهٽ آهي ته توکي پنهنجي والدين يا قانوني سرپرستن کان پڇڻو پوندو ته ڇا اهي توکي Catrobat جون سافٽ ويئر ايپليڪيشنون ۽ خدمتون استعمال ڪرڻ جي اجازت ڏين ٿا.'
    item3: 'اسان کي حق آهي ته Catrobat جي ويب سائيٽن تي اپلوڊ ٿيل پروجيڪٽ، يوزر کاتا ۽ ڪو به ڊجيٽل مواد ڪنهن به وقت پنهنجي مرضي سان رد، ڊليٽ يا لڪايون، مثال طور جيڪڏهن اسان کي معلوم ٿئي ته ڪنهن پروجيڪٽ ۾ نامناسب مواد آهي يا ڪو يوزر ٻين ماڻهن جي حقن جي خلاف ورزي ڪري ٿو.'
    item4: 'Catrobat جا سڀ سافٽ ويئر ۽ انٽرنيٽ وسيلا ان اميد سان پيش ڪيا وڃن ٿا ته اهي ڪارآمد ثابت ٿيندا، پر بنا ڪنهن ضمانت جي.'
    item5: 'مٿين نقطن جي درست لفظن ۽ ڪجهه اضافي قانوني شرطن ۽ ضابطن لاءِ مهرباني ڪري اسان جا %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service ڏس.'
  bottom1: 'وقت بوقت هتي واپس اچي ڏسندو رهه، ڇو ته اسان هميشه پنهنجي استعمال جي شرطن کي بهتر ڪرڻ جي ڪوشش ڪندا رهون ٿا.'
  bottom2: 'هنن استعمال جي شرطن بابت ڪا به تجويز %email-webmaster% تي اي ميل ڪر.'
  version: 'ورزن 1.3، 4 مارچ 2014'
