    explanation: 'Catrobat هڪ مفت تعليمي پليٽ فارم آهي جتي نوجوان ايپس، رانديون ۽ اينيميشنون ٺاهي ڪوڊنگ سکن ٿا. EU جي ٻارن جي تحفظ جي ضابطن تحت، تنهنجي ٻار جي ڪميونٽي ۾ مڪمل شرڪت کان اڳ اسان کي تنهنجي رضامندي گهرجي. مهرباني ڪري رضامندي ڏيڻ لاءِ هيٺ ڏنل بٽڻ تي ڪلڪ ڪر.'
