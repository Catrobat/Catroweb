privacy-policy:
  header: پرئيويسي پوليسي
  version: 'ورزن 2.2، 17 آڪٽوبر 2019'
  text1: 'توکي اسان جي خدمتن ۽ لاڳاپيل کاتي جا سڀ فائدا ڏيڻ لاءِ، توکان ڪجهه ڊيٽا گڏ ڪرڻ ضروري آهي.'
  text2: 'پنهنجي خدمتن (ايپس ۽ ويب سائيٽن) کي برقرار رکڻ ۽ بهتر ڪرڻ ۽ ICT ۽ STEM/STEAM تعليم تي سائنسي تحقيق لاءِ، اسان Google LLC (آمريڪا) جا Google Analytics، Crashlytics ۽ Firebase، ۽ Dynatrace LLC (آمريڪا) جو Dynatrace استعمال ڪريون ٿا ته جيئن پنهنجي خدمتن جي استعمال بابت ميٽا ڊيٽا حاصل ڪريون، مثال طور ڪريش جي معلومات، ٽائيم اسٽيمپ، ڏٺل صفحا/اسڪرينون، اسان جي ايپس ۽ خدمتن جو استعمال، استعمال ٿيل آپريٽنگ سسٽم، ۽ نيٽ ورڪ فراهم ڪندڙ بابت معلومات. هي تجزيو ۽ گڏ ڪيل ڊيٽا تنهنجي پروفائل سان ڳنڍيل ناهي ۽ ان ۾ ڪا به ذاتي معلومات ناهي (IP ايڊريس جا آخري حصا گمنام ڪيا وڃن ٿا). پر گڏ ڪيل ڊيٽا خدمت فراهم ڪندڙن (Google LLC، آمريڪا ۽ Dynatrace LLC، آمريڪا) ڏانهن منتقل ٿيندي. ڊيٽا پروسيسنگ Google LLC ۽ Dynatrace LLC سان معاهدن تي ٻڌل آهي. خدمت فراهم ڪندڙن سان هي تعلق يورپي يونين جي جنرل ڊيٽا پروٽيڪشن ريگيوليشن (EU GDPR) ۽ EU-USA "Privacy Shield" معاهدي مطابق آهي.'
  text3: 'اسان جي سسٽم ۾ کاتو ٺاهڻ ۽ استعمال ڪرڻ لاءِ، ۽ توکي تنهنجي کاتي بابت ضروري تبديلين جي اي ميل ذريعي خبر ڏيڻ لاءِ، مثال طور اپڊيٽس يا اسان جي استعمال ۽ خدمت جي شرطن، ڪميونٽي ضابطن يا پاليسين جي خلاف ورزيون، اسان تنهنجو يوزرنيم ۽، جيڪڏهن تو ڏني هجي ته، تنهنجي اي ميل ايڊريس محفوظ ڪنداسين. جيڪڏهن تو پنهنجو کاتو Google Plus يا Facebook ذريعي ڳنڍيو آهي ته اسان انهن خدمتن تي تنهنجي کاتي سان ڳنڍيل هڪ سڃاڻپ ڪي به محفوظ ڪريون ٿا. اسان هي ڊيٽا ڪنهن ٻئي (مثال طور مارڪيٽنگ) مقصد لاءِ استعمال نه ڪنداسين، جيستائين تو اسان کي واضح طور اجازت نه ڏني هجي.'
  text4: 'پنهنجي مرضي سان، تون شيئرنگ سائيٽ تي پنهنجي کاتي جي صفحي ذريعي اسان کي پنهنجي رهائش جو ملڪ ٻڌائي سگهين ٿو. اهو تنهنجي پبلڪ پروفائل تي ڏيکاريو ويندو ۽ اسان صرف انگ اکرن ۽ تحقيق جي مقصدن لاءِ استعمال ڪنداسين. تون ان کي ڪنهن به وقت پنهنجي پروفائل سيٽنگن ۾ هٽائي سگهين ٿو.'
  text5: 'تون ڪنهن به وقت https://share.catrob.at/ تي پنهنجي پروفائل صفحي ذريعي پنهنجو کاتو ڊليٽ ڪري پنهنجي کاتي سان لاڳاپيل ذاتي ڊيٽا جو استعمال واپس وٺي سگهين ٿو. کاتو ڊليٽ ڪرڻ کانپوءِ تون پوءِ به فراهم ڪيل خدمتون استعمال ڪري سگهندين، پر تعاون نه ڪري سگهندين، مثال طور پروگرام اپلوڊ ڪرڻ، تبصرا ڪرڻ يا لائيڪ ڪرڻ. ان سان گڏ، تنهنجي کاتي سان ڳنڍيل سڄو مواد، مثال طور اپلوڊ ٿيل پروگرام، تبصرا وغيره، ڊليٽ ٿي ويندو.'
  text6: 'اسان جي خدمتن جي غلط استعمال کان بچڻ لاءِ، مثال طور غير قانوني مقصدن لاءِ يوزرن جا اپلوڊ يا تبصرا، يوزرن جو ٺاهيل سڄو پبلڪ ڊيٽا (اپلوڊ، تبصرا) ٽائيم اسٽيمپ ۽ استعمال ٿيل انٽرنيٽ ايڊريس سميت اندروني طور ڊيٽابيس ۾ محفوظ ڪيو ويندو. هي ڊيٽا ڪنهن به اداري طرفان استعمال نه ڪيو ويندو ۽ نه ئي ڪنهن ڏانهن موڪليو ويندو، جيستائين ڪافي غير قانوني عمل جو معقول شڪ نه هجي ۽ سرڪاري طور بااختيار قانوني ادارا لاڳو قانون تحت ان جي گهر نه ڪن. هر ڪيس کي پهرين اسان پاڻ انفرادي طور چڱي طرح جانچينداسين.'
  text7: 'تون پنهنجي مرضي سان https://catrob.at/newsletter تي Catrobat نيوز ليٽر جي رڪنيت وٺي سگهين ٿو، جيڪو اسان MailChimp خدمت (The Rocket Science Group LLC d/b/a MailChimp، آمريڪا) ذريعي فراهم ڪريون ٿا. پوءِ توکي تنهنجي ڏنل اي ميل ايڊريس تي Catrobat پروجيڪٽ ۽ ان جي خدمتن بابت اپڊيٽس ملنديون. تون هر نيوز ليٽر جي فوٽر ۾ "unsubscribe" لنڪ استعمال ڪري ڪنهن به وقت نيوز ليٽر بند ڪري سگهين ٿو. هي نيوز ليٽر MailChimp فراهم ڪري ٿو، جنهن سان اسان جو ڊيٽا پروسيسنگ معاهدو آهي ۽ جيڪو EU جنرل ڊيٽا پروٽيڪشن ريگيوليشن ۽ EU-USA "Privacy Shield" جو پابند آهي. MailChimp بابت وڌيڪ تفصيل لاءِ MailChimp جي پرائيويسي پاليسي ۽ استعمال جا شرط به ڏس.'
  text8: 'سڀ خدمتون مفت اوپن سورس Catrobat پروجيڪٽ طرفان International Catrobat Association – Verein zur Förderung freier Software جي ڇٽيءَ هيٺ فراهم ڪيون وڃن ٿيون، جيڪا گراز، آسٽريا (يورپي يونين) ۾ رجسٽرڊ هڪ غير منافع بخش NGO آهي. اسان جون پاليسيون EU ۽ آسٽريا جي ڊيٽا تحفظ قانون (GDPR) جو احترام ڪن ٿيون. اسان سان رابطي لاءِ، مهرباني ڪري contact@catrobat.org تي اي ميل موڪل يا هن پتي تي خط لک: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'جيڪڏهن تنهنجي عمر 14 سالن کان گهٽ آهي ته هي پاليسي ڪنهن قانوني سرپرست (عام طور والدين) کي قبول ڪرڻي پوندي.'
  text10: 'Catrobat جي سرڪاري انگريزي پرائيويسي پاليسي ويب تي %privacy_policy% تي موجود آهي.'
  disagree-text: 'منظوري کانسواءِ اسان کاتو نٿا ٺاهي سگهون، پر بنيادي خاصيتون پوءِ به استعمال ڪري سگهجن ٿيون.'
