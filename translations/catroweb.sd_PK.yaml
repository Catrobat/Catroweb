parent:
  footer:
    link: 'والدين ۽ سرپرست'
  info:
    title: 'والدين ۽ سرپرستن لاءِ معلومات'
    intro: 'Catrobat ننڍن يوزرن جي حفاظت ۽ پرائيويسي کي سنجيدگي سان وٺي ٿو. هي صفحو ٻڌائي ٿو ته اسان تنهنجي ٻار جي ڪيئن حفاظت ڪريون ٿا ۽ تنهنجا ڪهڙا حق آهن.'
    whatIsCatrobat:
      title: 'Catrobat ڇا آهي؟'
      text: 'Catrobat هڪ مفت، غير منافع بخش تعليمي پليٽ فارم آهي جتي نوجوان پنهنجون ايپس، رانديون ۽ اينيميشنون ٺاهي پروگرامنگ سکن ٿا. هي پليٽ فارم سڄي دنيا ۾ موجود آهي ۽ تعليمي ماحول ۾ استعمال ٿيندو آهي.'
    dataCollected:
      title: 'اسان ڪهڙو ڊيٽا گڏ ڪريون ٿا؟'
      text: 'اسان پليٽ فارم هلائڻ لاءِ گهٽ ۾ گهٽ ضروري ڊيٽا گڏ ڪريون ٿا: يوزرنيم، اي ميل ايڊريس، ڄمڻ جي تاريخ، ۽ اهي پروجيڪٽ جيڪي تنهنجو ٻار ٺاهي ۽ اپلوڊ ڪري ٿو. 14 سالن کان گهٽ يوزرن لاءِ، اسان رضامندي جي مقصد لاءِ والدين/سرپرست جي اي ميل ايڊريس به محفوظ ڪريون ٿا. اسان ذاتي ڊيٽا ٽئين ڌر کي نه وڪڻون ٿا ۽ نه شيئر ڪريون ٿا.'
    yourRights:
      title: 'والدين يا سرپرست طور تنهنجا حق'
      text: 'EU جي ٻارن جي تحفظ جي ضابطن (GDPR) ۽ COPPA تحت، توکي حق آهي ته: تنهنجي ٻار بابت اسان وٽ موجود ڊيٽا ڏسين، ان ڊيٽا جي ڪاپي گهرين، ڪنهن به وقت پنهنجي رضامندي واپس وٺين (جنهن سان کاتو محدود ٿي ويندو)، ۽ پنهنجي ٻار جي کاتي ۽ ان سان لاڳاپيل سڄي ڊيٽا کي هميشه لاءِ ڊليٽ ڪرڻ جي درخواست ڪرين.'
    minorRestrictions:
      title: 'نابالغ کاتن تي ڪهڙيون پابنديون لاڳو آهن؟'
      text: '16 سالن کان گهٽ يوزر تبصرا لکي يا پڙهي نٿا سگهن، ٻين يوزرن کي فالو نٿا ڪري سگهن، ۽ ٻارن لاءِ نامناسب نشان لڳل مواد نٿا ڏسي سگهن. اهي پوءِ به پروجيڪٽ ٺاهي ۽ اپلوڊ ڪري سگهن ٿا، پبلڪ پروجيڪٽ ڏسي سگهن ٿا، ۽ لائيڪس سان پروجيڪٽن تي ردعمل ڏئي سگهن ٿا. اهي پابنديون محفوظ سکيا جو ماحول فراهم ڪرڻ لاءِ آهن.'
