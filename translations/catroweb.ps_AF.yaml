  text2: 'زموږ د خدماتو (اپونو او ویب پاڼو) د ساتلو او ښه کولو، او د ICT او STEM/STEAM زده کړې په اړه د علمي څېړنې لپاره، موږ Google Analytics، Crashlytics او Firebase، چې ټول د Google LLC (USA) دي، او همدارنګه د Dynatrace LLC (USA) Dynatrace کاروو څو زموږ د خدماتو د کارولو په اړه میټاډاټا ترلاسه کړو، لکه د کرش معلومات، وختونه، لیدل شوې پاڼې/سکرینونه، زموږ د اپونو او خدماتو کارول، کارول شوی عملیاتي سیسټم، او د شبکې د برابرونکي په اړه معلومات. دا تحلیل او راټول شوي معلومات ستا له پروفایل سره نه تړل کېږي او هیڅ شخصي معلومات نه لري (د IP پتې وروستي بټونه ناپېژندل کېږي). خو راټول شوي معلومات به خدمت برابرونکو (Google LLC، USA او Dynatrace LLC، USA) ته لېږدول کېږي. د معلوماتو پروسس د Google LLC او Dynatrace LLC سره پر تړونونو ولاړ دی. له خدمت برابرونکو سره دا اړیکه د اروپايي اتحادیې د معلوماتو د ساتنې له عمومي مقرراتو (EU GDPR) او د EU-USA "Privacy Shield" تړون سره سمون لري.'
  text3: 'زموږ په سیسټمونو کې د حساب د جوړولو او کارولو لپاره، او د دې لپاره چې تا ته د ایمیل له لارې ستا د حساب په اړه د اړینو بدلونونو خبر درکړو، لکه زموږ د کارولو او خدماتو د شرایطو، د ټولنې د قواعدو یا پالیسیو تازه کول یا سرغړونې، موږ به ستا کارن نوم او، که دې ورکړې وي، ستا ایمیل پته خوندي کړو. که دې خپل حساب د Google Plus یا Facebook له لارې نښلولی وي، موږ په دې خدماتو کې ستا له حساب سره تړلې د پېژندنې کیلي هم ساتو. موږ به دا معلومات د بلې کومې موخې (لکه بازارموندنې) لپاره ونه کاروو، مګر دا چې تا موږ ته په ښکاره ډول اجازه راکړې وي.'
  text4: 'په خپله خوښه، ته کولی شې د شریکولو پاڼې کې د خپل حساب د پاڼې له لارې موږ ته د خپل استوګنې هېواد ووایې. دا به ستا په عامه پروفایل کې ښکاره شي او موږ به یې یوازې د احصایې او څېړنې لپاره کاروو. ته کولی شې هر وخت یې د خپل پروفایل په تنظیماتو کې لرې کړې.'
  text5: 'ته کولی شې هر وخت په https://share.catrob.at/ کې د خپل پروفایل د پاڼې له لارې د خپل حساب په حذف کولو سره ستا د حساب د شخصي معلوماتو کارول بېرته واخلې. د حساب له حذف کولو وروسته به لا هم وړاندې شوي خدمات کارولی شې، خو همکاري نه، لکه د پروګرامونو پورته کول، تبصره کول یا خوښول. همدارنګه، ستا له حساب سره تړلې ټولې منځپانګې، لکه پورته شوي پروګرامونه، تبصرې او نور، به حذف شي.'
  text6: زموږ د خدماتو څخه د ناوړه ګټې اخیستنې مخنیوي لپاره، د بیلګې په توګه، د غیرقانوني موخو لپاره د کاروونکي لخوا د اپلوډونو یا تبصرو له لارې، د کاروونکي ټول تولید شوي عامه ډاټا (اپلوډونه، تبصرې) به په ډیټابیس کې دننه ذخیره شي، د مهال ویش او کارول شوي انټرنیټ پته سره. دا معلومات به د هیڅ ادارې لخوا نه کارول کیږي یا لیږل کیږي، پرته لدې چې په کافي اندازه غیرقانوني کړنې په معقول ډول شکمن وي او په رسمي توګه حق لرونکي حقوقي ادارې د پلي شوي قانون پراساس د دې غوښتنه کوي. هره قضیه به لومړی زموږ لخوا په انفرادي ډول په کلکه وڅیړل شي.
  text7: 'ته کولی شې په خپله خوښه د Catrobat خبرپاڼې ګډون وکړې، په https://catrob.at/newsletter کې چې موږ یې د MailChimp خدمت (The Rocket Science Group LLC d/b/a MailChimp, USA) له لارې وړاندې کوو. بیا به ستا ورکړې ایمیل پتې ته د Catrobat پروژې او د هغې د خدماتو تازه معلومات درشي. ته کولی شې هر وخت د هرې خبرپاڼې په پای کې د "unsubscribe" لینک په کارولو سره خبرپاڼه لغوه کړې. دا خبرپاڼه د MailChimp لخوا وړاندې کېږي چې موږ ورسره د معلوماتو د پروسس تړون لرو او د اروپايي اتحادیې د معلوماتو د ساتنې عمومي مقرراتو او EU-USA "Privacy Shield" ته ژمن دی. د MailChimp په اړه د نورو جزییاتو لپاره مهرباني وکړه د MailChimp د محرمیت پالیسي او د کارولو شرایط هم وګوره.'
  text8: 'ټول خدمات د وړیا خلاصې سرچینې Catrobat پروژې لخوا د International Catrobat Association – Verein zur Förderung freier Software تر چتر لاندې وړاندې کېږي، چې یوه غیر انتفاعي NGO ده او په ګراتس، اتریش (اروپايي اتحادیه) کې ثبت شوې. زموږ پالیسۍ د اروپايي اتحادیې او اتریش د معلوماتو د ساتنې قانون (GDPR) ته درناوی کوي. له موږ سره د اړیکې لپاره، مهرباني وکړه contact@catrobat.org ته ایمیل ولېږه یا دې پتې ته لیک ولېږه: Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Austria (European Union).'
  text9: 'که له 14 کلونو کم عمر لرې، دا پالیسي باید د یوه قانوني سرپرست (معمولاً مور یا پلار) لخوا ومنل شي.'
  text10: د Catrobat رسمي انګلیسي ژبې د محرمیت پالیسي په ویب کې د  %privacy_policy% لاندې شتون لري.
  disagree-text: د تایید پرته، موږ نشو کولی حساب جوړ کړو مګر اصلي ځانګړتیاوې لاهم د لاسرسي وړ دي.
