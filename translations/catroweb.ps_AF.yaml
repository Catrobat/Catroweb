  text4: "د Catrobat ټولنې په جوړولو کې، موږ پریکړه وکړه چې دا طریقه غوره کړو ځکه چې موږ باور لرو چې دا په ټولنه کې د زده کړې او خلاقیت ملاتړ کوي. د ترکیبونو او اجزاوو (سکریپټونو او هنري کارونو) په شریکولو سره، خلک کولی شي د یو بل نظرونه جوړ کړي او هرڅوک به ګټه پورته کړي."
  text5: 'د Catrobat ویب پاڼې په جوړولو کې، موږ داسې ځانګړتیاوې ورزیاتې کړې چې خلک شریکولو او نورو ته د کریډیټ ورکولو ته وهڅوي. د هرې پروژې په پاڼه کې، ته تل کولی شې د پروژې اصلي سکریپټونه ډاونلوډ کړې. که یوه پروژه ریمکس کړې (سکریپټونه یا هنري کار بدل کړې او پایله شریکه کړې)، موږ تا هڅوو چې د پروژې په یادښتونو کې کریډیټ ورکړې او هغه کسان او پروژه یاد کړې چې تا ته یې الهام درکړ.'
  text6: 'د Catrobat آنلاین ټولنې د کارولو د شرایطو په اړه نور معلومات په %link-termsOfUse% کې ترلاسه کړه.'
