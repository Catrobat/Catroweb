  text1: 'تصور وکړه چې د Catrobat هره پروژه یو کیک دی، یو ډېر ځانګړی کیک چې له خپل ترکیب (د پروګرام جوړونې بلاکونو) سره راځي. د Catrobat ټولنې ټول غړي خپل کیکونه له خپلو ترکیبونو سره شریکوي. دا پدې مانا ده چې ته کولی شې له کیکونو خوند واخلې او زده کړې چې څنګه یې پخپله جوړ کړې!'
  text2: 'هیڅ پټ ترکیبونه شتون نلري: د دې کیک جوړولو څرنګوالي لارښوونې د هرچا لپاره خلاصې دي چې د نوي نظرونو لپاره د الهام په توګه د کارولو ، بیا کارولو ، ترمیم کولو او خدمت کولو لپاره خلاص دي ... زما مطلب دی کیک.'
