parent:
  footer:
    link: "Eltern & Erziehungsberechtigte"
  info:
    title: "Informationen für Eltern & Erziehungsberechtigte"
    intro: "Catrobat nimmt die Sicherheit und den Datenschutz junger Nutzerinnen und Nutzer ernst. Auf dieser Seite erfährst du, wie wir dein Kind schützen und welche Rechte du hast."
    whatIsCatrobat:
      title: "Was ist Catrobat?"
      text: "Catrobat ist eine kostenlose, gemeinnützige Bildungsplattform, auf der junge Menschen programmieren lernen, indem sie ihre eigenen Apps, Spiele und Animationen erstellen. Die Plattform ist weltweit verfügbar und wird im Unterricht eingesetzt."
    dataCollected:
      title: "Welche Daten erheben wir?"
      text: "Wir erheben nur die Daten, die für den Betrieb der Plattform nötig sind: Benutzername, E-Mail-Adresse, Geburtsdatum und alle Projekte, die dein Kind erstellt und hochlädt. Bei Nutzerinnen und Nutzern unter 14 Jahren speichern wir zusätzlich die E-Mail-Adresse eines Elternteils bzw. Erziehungsberechtigten für die Einwilligung. Wir verkaufen keine personenbezogenen Daten und geben sie nicht an Dritte weiter."
    yourRights:
      title: "Deine Rechte als Elternteil oder Erziehungsberechtigte(r)"
      text: "Nach den EU-Kinderschutzbestimmungen (DSGVO) und COPPA hast du das Recht: die Daten einzusehen, die wir über dein Kind speichern, eine Kopie dieser Daten anzufordern, deine Zustimmung jederzeit zu widerrufen (wodurch das Konto eingeschränkt wird) und die endgültige Löschung des Kontos deines Kindes samt aller zugehörigen Daten zu verlangen."
    minorRestrictions:
      title: "Welche Einschränkungen gelten für Konten von Minderjährigen?"
      text: "Nutzerinnen und Nutzer unter 16 Jahren können keine Kommentare schreiben oder lesen, anderen nicht folgen und keine Inhalte sehen, die als nicht für Kinder geeignet markiert sind. Sie können aber weiterhin Projekte erstellen und hochladen, öffentliche Projekte ansehen und mit Likes auf Projekte reagieren. Diese Einschränkungen sorgen für eine sichere Lernumgebung."
    manageButton: "Konto deines Kindes verwalten"
  portal:
    title: "Elternportal"
    description: "Gib deine E-Mail-Adresse ein, um einen sicheren Link zur Verwaltung des Catrobat-Kontos deines Kindes zu erhalten. Der Link wird an die E-Mail-Adresse gesendet, die bei der Registrierung angegeben wurde."
