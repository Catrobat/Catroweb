newAccountConfirmation:
  subject: "Bitte verifiziere deine E-Mail-Adresse"
  welcome: "Willkommen in der Catrobat Community!"
  greeting: "Danke für deine Registrierung! Bitte bestätige deine E-Mail-Adresse, um loszulegen."
  message: "Bitte überprüfe deine E-Mail-Adresse\nWillkommen in der Catrobat-Community\nMit nur einem Klick auf den Button unten\nkannst du deine Anmeldung bei Catrobat bestätigen.\nDieser Link ist bis %time% gültig und kann nur einmal\nzur Bestätigung deiner E-Mail-Adresse verwendet werden."
