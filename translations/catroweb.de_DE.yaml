consent:
  email:
    subject: "Elterliche Zustimmung für das Catrobat-Konto Ihres Kindes erforderlich"
    title: "Elterliche Zustimmung erforderlich"
    greeting: "Hallo,"
    message: "Ihr Kind %username% hat ein Konto bei Catrobat erstellt und seine E-Mail-Adresse bestätigt."
    explanation: "Catrobat ist eine kostenlose Bildungsplattform, auf der junge Menschen programmieren lernen, indem sie Apps, Spiele und Animationen erstellen. Gemäß den EU-Kinderschutzbestimmungen benötigen wir Ihre Zustimmung, bevor Ihr Kind uneingeschränkt an der Community teilnehmen kann. Bitte klicken Sie auf die Schaltfläche unten, um Ihre Zustimmung zu erteilen."
    button: "Elterliche Zustimmung erteilen"
    ignore: "Wenn Sie diese E-Mail nicht erwartet haben, können Sie sie einfach ignorieren. Ohne Zustimmung ist das Konto nur eingeschränkt nutzbar."
    whatIsCatrobat: "Catrobat ist eine kostenlose, gemeinnützige Lernplattform zum Programmieren. Mehr erfahren Sie auf catrobat.org."
    manageLink: 'Sie können das Konto Ihres Kindes jederzeit über unser <a href="%portalUrl%" style="color: #00acc1;">Elternportal</a> verwalten. Erfahren Sie mehr über <a href="%infoUrl%" style="color: #00acc1;">Ihre Rechte als Elternteil</a>.'
  confirmed:
    title: "Zustimmung erteilt"
    message: "Vielen Dank! Das Konto von %username% ist jetzt vollständig aktiviert."
    continueButton: "Projekte entdecken"
parent:
  footer:
    link: "Eltern & Erziehungsberechtigte"
  info:
    title: "Informationen für Eltern & Erziehungsberechtigte"
    intro: "Catrobat nimmt die Sicherheit und den Datenschutz junger Nutzerinnen und Nutzer ernst. Auf dieser Seite erfahren Sie, wie wir Ihr Kind schützen und welche Rechte Sie haben."
    whatIsCatrobat:
      title: "Was ist Catrobat?"
      text: "Catrobat ist eine kostenlose, gemeinnützige Bildungsplattform, auf der junge Menschen programmieren lernen, indem sie ihre eigenen Apps, Spiele und Animationen erstellen. Die Plattform ist weltweit verfügbar und wird im Unterricht eingesetzt."
    dataCollected:
      title: "Welche Daten erheben wir?"
      text: "Wir erheben nur die Daten, die für den Betrieb der Plattform nötig sind: Benutzername, E-Mail-Adresse, Geburtsdatum und alle Projekte, die Ihr Kind erstellt und hochlädt. Bei Nutzerinnen und Nutzern unter 14 Jahren speichern wir zusätzlich die E-Mail-Adresse eines Elternteils bzw. Erziehungsberechtigten für die Einwilligung. Wir verkaufen keine personenbezogenen Daten und geben sie nicht an Dritte weiter."
    yourRights:
      title: "Ihre Rechte als Elternteil oder Erziehungsberechtigte(r)"
      text: "Nach den EU-Kinderschutzbestimmungen (DSGVO) und COPPA haben Sie das Recht: die Daten einzusehen, die wir über Ihr Kind speichern, eine Kopie dieser Daten anzufordern, Ihre Zustimmung jederzeit zu widerrufen (wodurch das Konto eingeschränkt wird) und die endgültige Löschung des Kontos Ihres Kindes samt aller zugehörigen Daten zu verlangen."
    minorRestrictions:
      title: "Welche Einschränkungen gelten für Konten von Minderjährigen?"
      text: "Nutzerinnen und Nutzer unter 16 Jahren können keine Kommentare schreiben oder lesen, anderen nicht folgen und keine Inhalte sehen, die als nicht für Kinder geeignet markiert sind. Sie können aber weiterhin Projekte erstellen und hochladen, öffentliche Projekte ansehen und mit Likes auf Projekte reagieren. Diese Einschränkungen sorgen für eine sichere Lernumgebung."
    manageButton: "Konto Ihres Kindes verwalten"
  portal:
    title: "Elternportal"
    description: "Geben Sie Ihre E-Mail-Adresse ein, um einen sicheren Link zur Verwaltung des Catrobat-Kontos Ihres Kindes zu erhalten. Der Link wird an die E-Mail-Adresse gesendet, die bei der Registrierung angegeben wurde."
    emailLabel: "Ihre E-Mail-Adresse"
    submitButton: "Verwaltungslink senden"
    infoLink: "Mehr erfahren"
    success:
      title: "Bitte prüfen Sie Ihr Postfach"
      message: "Falls ein Konto mit dieser E-Mail-Adresse verknüpft ist, haben wir einen Verwaltungslink gesendet. Bitte prüfen Sie Ihr Postfach und folgen Sie dem Link, um das Konto Ihres Kindes zu verwalten."
  manage:
    title: "Kinderkonten verwalten"
    description: "Sie verwalten die Konten, die mit %email% verknüpft sind."
    consentStatus: "Zustimmungsstatus"
    accountCreated: "Konto erstellt"
    email: "E-Mail des Kindes"
    status:
      granted: "Erteilt"
      pending: "Ausstehend"
      revoked: "Widerrufen"
    grantButton: "Zustimmung erteilen"
    revokeButton: "Zustimmung widerrufen"
    revokeConfirm: "Sind Sie sicher, dass Sie die Zustimmung widerrufen möchten? Das Konto ist dann nur eingeschränkt nutzbar."
