      message: 'Если с этим адресом связан аккаунт, мы отправили ссылку для управления. Проверьте почту и перейдите по ссылке, чтобы управлять аккаунтом вашего ребёнка.'
  manage:
    title: 'Управление аккаунтами детей'
    description: 'Вы управляете аккаунтами, связанными с адресом %email%.'
    consentStatus: 'Статус согласия'
    accountCreated: 'Аккаунт создан'
