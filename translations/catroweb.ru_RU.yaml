parent:
  footer:
    link: 'Родителям и опекунам'
  info:
    title: 'Информация для родителей и опекунов'
    intro: 'Catrobat серьёзно относится к безопасности и конфиденциальности юных пользователей. На этой странице объясняется, как мы защищаем вашего ребёнка и какие у вас есть права.'
    whatIsCatrobat:
      title: 'Что такое Catrobat?'
      text: 'Catrobat — бесплатная некоммерческая образовательная платформа, на которой молодые люди учатся программированию, создавая собственные приложения, игры и анимации. Платформа доступна по всему миру и используется в образовательных учреждениях.'
    dataCollected:
      title: 'Какие данные мы собираем?'
      text: 'Мы собираем минимум данных, необходимых для работы платформы: имя пользователя, адрес электронной почты, дату рождения и проекты, которые ваш ребёнок создаёт и загружает. Для пользователей младше 14 лет мы также храним адрес электронной почты родителя или опекуна для получения согласия. Мы не продаём и не передаём персональные данные третьим лицам.'
    yourRights:
      title: 'Ваши права как родителя или опекуна'
      text: 'Согласно правилам ЕС о защите детей (GDPR) и COPPA, вы имеете право: просматривать данные о вашем ребёнке, которые мы храним, запросить копию этих данных, в любое время отозвать своё согласие (что ограничит аккаунт) и потребовать окончательного удаления аккаунта вашего ребёнка и всех связанных с ним данных.'
    minorRestrictions:
      title: 'Какие ограничения действуют для аккаунтов несовершеннолетних?'
      text: 'Пользователи младше 16 лет не могут писать и читать комментарии, подписываться на других пользователей или просматривать контент, отмеченный как неподходящий для детей. При этом они могут создавать и загружать проекты, просматривать общедоступные проекты и ставить проектам лайки. Эти ограничения нужны, чтобы обеспечить безопасную среду для обучения.'
    manageButton: 'Управлять аккаунтом ребёнка'
