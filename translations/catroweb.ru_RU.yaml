passwordRecovery:
  subject: Восстановление пароля от вашего аккаунта Catrobat
  message: |
    Уважаемый(-ая) %username%.
    Мы получили запрос на восстановление вашего пароля на %appplication_url%, потому что вы забыли ваш пароль
    Если вы не запрашивали изменение пароля, пожалуйста, проигнорируйте это письмо. Срок действия ссылки закончится через 24 часа.
    Чтобы сбросить пароль и создать новый, перейдите по ссылке: %confirmationUrl%
    Вы можете использовать свой логин и пароль для доступа в сообщество %appplication_url% в любое время.
    Для этого просто перейдите по ссылке: %loginPage%
    Если вы хотите изменить информацию в своем профиле, перейдите по ссылке: %profilePage%

    С уважением,
    Команда Catrobat.
  messageHtml: |
    <p>
    Уважаемый(-ая) %username%.<br>
    <br>
    Мы получили запрос на восстановления вашего пароля на <a href="%appplication_url%">Pocket Code</a>.
    Если вы не отправляли такой запрос, пожалуйста проигнорируйте данное письмо. Срок действия ссылки закончится через 24 часа.<br>
    <br>
    Для изменения пароля пройдите по <a href="%confirmationUrl%">ссылке.</a><br>
    <br>
    Вы можете использовать свое имя пользователя и пароль для доступа к сообществу <a href="%appplication_url%">Pocket Code</a> в любое время.
    <br>
    Для этого просто перейдите по <a href="%loginPage%">этой ссылке</a><br>
    Если вы хотите изменить свой профиль, перейдите на <a href="%profilePage%">эту страницу</a>.<br>
    <br>
    С наилучшими пожеланиями,<br>
    Команда Catrobat.
    </p>
