licenseToPlay:
  link: 'Licens til at lege'
  title: 'Licens til at lege - Giv kredit og del'
  text1: Forestil dig, at hvert Catrobat-projekt er en kage, en helt særlig kage, der kommer med sin opskrift (programmeringsklodserne). Alle medlemmer af Catrobat-fællesskabet deler deres kager sammen med opskrifterne. Det betyder, at du kan nyde kagerne og lære at lave dem selv!
  text2: 'Der er ingen hemmelige opskrifter: instruktionerne til at lave disse kager er åbne for alle, så de kan bruges, genbruges, ændres og give inspiration til nye idéer... jeg mener kager.'
  text3: "Du kan spise kagerne og også kopiere andres opskrifter for at lave dine egne, måske med andre ingredienser. Denne frihed har to enkle krav:"
  text4: "Da vi skabte Catrobat-fællesskabet, valgte vi denne tilgang, fordi vi mener, at den fremmer læring og kreativitet i fællesskabet. Ved at dele opskrifter og ingredienser (scripts og grafik) kan folk bygge videre på hinandens idéer, og alle får glæde af det."
  text5: Da vi designede Catrobat-hjemmesiden, tilføjede vi funktioner, der opmuntrer folk til at dele og give kredit til andre. På hver projektside kan du altid downloade projektets originale scripts. Hvis du remixer et projekt (ændrer scripts eller grafik og deler resultatet), opfordrer vi dig til at give kredit i projektnoterne og nævne de personer og projekter, der inspirerede dig.
  text6: 'Læs mere om vilkårene for brug af Catrobats onlinefællesskab på %link-termsOfUse%.'
  list1:
    item1: del dine kager sammen med opskriften
    item2: giv kredit til dem, der inspirerede dig
  version: Version 1.1, 2. april 2013
termsOfUse:
  title: Brugsvilkår
  headline: Velkommen til Catrobat-fællesskabet!
  text1: 'Som en del af Catrobat-fællesskabet deler du projekter og idéer med mennesker:'
  text2: "Vi har brug for din hjælp til at gøre dette fællesskab til et støttende sted for alle medlemmer. Sådan kan du hjælpe:"
  text3: "Med Catrobat-projektet vil vi fremme samarbejde og lade alles kreativitet gå sammen til gavn for hele menneskeheden. Du kan også blive et aktivt medlem af Catrobat-fællesskabet ved at give dine projekter tilbage til fællesskabet som en gave, på samme måde som andre aktive medlemmer giver deres projekter til dig:"
  text4: 'Vores gave til dig:'
  text5: 'Vores brugs- og servicevilkår:'
  list1:
    item1: fra mange forskellige lande og kulturer
    item2: i alle aldre (fra små børn til teenagere og bedsteforældre)
    item3: med alle niveauer af erfaring
  list2:
    item1: Vær respektfuld. Når du deler projekter, så husk, at mennesker i mange forskellige aldre og med forskellige baggrunde vil se dine bidrag.
    item2: "Giv kredit. Du må gerne lave ændrede versioner af andres projekter - bare sørg for at give dem kredit. Et sted at give kredit er i projektets tak-afsnit. Se afsnittet under denne punktliste for detaljer om at ændre andre brugeres projekter."
    item3: "Vær ærlig. Lad være med at udgive dig for at være en anden, end du er, eller prøve at narre fællesskabet."
    item4: "Hold personlige oplysninger private. Del ikke din e-mailadresse, dit telefonnummer eller andre personlige kontaktoplysninger."
    item5: "Hjælp med at holde siden venlig. Hvis du tror, at andre vil synes, at et projekt eller en kommentar er ondskabsfuld, fornærmende, for voldelig eller på anden måde upassende, så klik bare på knappen 'anmeld som upassende' og skriv en kort forklaring. Catrobat-teamet gennemgår din anmeldelse og kan fjerne ethvert projekt, enhver kommentar eller ethvert opslag."
  list3:
    item1: "Når du uploader et projekt til vores hjemmesider, accepterer du at stille dette værk til rådighed under bestemte frie licenser for uploadede Catrobat-projekter. Ligesom de frie licenser, som Catrobat-systemet selv er tilgængeligt for dig under, giver disse frie licenser for uploadede Catrobat-projekter alle ret til at lære af værker, som andre tidligere har uploadet, og til at tilpasse og remixe disse værker for at bygge deres egne nye, fascinerende spil, animationer og andre projekter. Det gør det muligt for alle at 'stå på skuldrene af ligesindede', og en af dem er dig! Dit værk vil dermed gavne hele verden og forblive frit for alle at bruge, lidt ligesom tekst og billeder, som frivillige fra hele verden frit bidrager med til Wikipedia. Tænk på det som din gave til menneskeheden: du giver til alle, og alle andre, der uploader deres værker til vores hjemmesider, giver til dig. Et uploadet projekt er altså en gave af stor værdi, som ejeren giver dig gratis, på betingelse af at du deltager i fællesskabet på de samme vilkår."
    item2: Du behøver ikke tage imod gaven; hvis du gør, gælder der bestemte regler. Fordelen ved disse regler er, at du kan lære af værket og bygge videre på det for selv at lave endnu sejere ting, som du så f.eks. igen kan uploade til vores hjemmesider som dit eget. En anden fordel er, at disse licenser sikrer, at du ikke kan holdes ansvarlig for problemer, der opstår for andre, når de bruger dit projekt.
    item3: "En vigtig ekstra betingelse er, at du tydeligt krediterer de ophavspersoner, hvis værker du har bygget dit eget værk på. Samtidig vil vi gøre os umage for, at andre tydeligt kan se, at dit værk er bidraget af dig, ved at kreditere det unikke navn, du frit har valgt til at repræsentere dig i Catrobats fællesskab, og ved at give andre mulighed for offentligt at vise deres taknemmelighed over, at du har givet dit værk til alle, og især til dem."
    item4: 'Se %link-licenseUploaded% for de præcise juridiske vilkår og betingelser.'
  list4:
    item1: "Vi tilbyder dig al vores egen software og alle vores internetressourcer i forbindelse med Catrobat-systemet, f.eks. den software, som Catrobat-teamet har skrevet, vores hjemmesider og internetressourcer, vores egen kildekode i forbindelse med Catrobat-systemet og alt yderligere inkluderet materiale såsom f.eks. billeder, lyde og tekster, nu og i fremtiden, under Catrobats frie licenser."
    item2: Disse licenser gør alle dele af Catrobat både gratis for dig og frie i den forstand, at du har frihed til at bruge dem, som du vil, med kun få begrænsninger, der blandt andet sikrer, at Catrobat-systemet for altid forbliver frit og nyttigt for alle.
    item3: 'Se %link-licenseToPlay% for de præcise juridiske vilkår og betingelser. Kildekoden til Catrobat-systemet samt mange andre dokumenter og ressourcer er tilgængelige via %link-developer%.'
  list5:
    item1: 'Hvis du, eller dine forældre eller værger, hvis du er under 13 år, er tilknyttet en organisation, der er involveret i eller ansvarlig for krænkelser af privatlivet i form af masseovervågning og/eller storstilet overvågning, må du ikke bruge vores softwareapplikationer og få adgang til vores tjenester. De præcise detaljer om denne begrænsning og visse undtagelser fra den er beskrevet i afsnit 4.a og 4.b i vores %link-termsOfUse%.'
    item2: Hvis du er under 13 år, skal du spørge dine forældre eller værger, om de tillader dig at bruge Catrobats softwareapplikationer og tjenester.
    item3: "Vi forbeholder os ret til når som helst og efter eget skøn at afvise, slette eller skjule projekter, brugerkonti og alt digitalt materiale, der er uploadet til Catrobats hjemmesider, for eksempel hvis vi finder ud af, at et projekt indeholder upassende materiale, eller at en bruger krænker andres rettigheder."
    item4: "Al Catrobats software og alle internetressourcer tilbydes i håb om, at de vil være nyttige, men uden nogen form for garanti."
    item5: 'Se vores %link-termsOfUse% developer.catrobat.org/terms_of_use_and_service for de præcise formuleringer af ovenstående punkter og nogle yderligere juridiske vilkår og betingelser.'
  bottom1: Kig forbi her en gang imellem, for vi prøver hele tiden at forbedre vores brugsvilkår.
  bottom2: 'Send venligst forslag til disse brugsvilkår til %email-webmaster%.'
  version: Version 1.3, 4. marts 2014
