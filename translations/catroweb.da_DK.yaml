newAccountConfirmation:
  subject: "Bekræft din e-mailadresse"
  welcome: "Velkommen til Catrobat!"
  greeting: "Tak, fordi du har tilmeldt dig! Bekræft din e-mailadresse for at komme i gang."
  message: "Klik på knappen nedenfor for at bekræfte din e-mail. Dette link er gyldigt indtil %time% og kan kun bruges én gang."
