passwordRecovery:
  subject: Gendannelse af din Catrobat-adgangskode
  message: |
    Kære %username%.
    Du har bedt om at nulstille din adgangskode på %appplication_url%, fordi du har glemt din adgangskode.
    Hvis du ikke har bedt om dette, så ignorer denne besked. Anmodningen udløber og bliver ugyldig om 24 timer.
    For at nulstille din adgangskode og oprette en ny, besøg følgende side: %confirmationUrl%
    Du kan til enhver tid bruge dit brugernavn og din adgangskode til at få adgang til %appplication_url%-fællesskabet.
    Det gør du ved at besøge følgende side: %loginPage%
    For at redigere dine profiloplysninger, gå til denne side: %profilePage%
    Med venlig hilsen
    Dit Catrobat-team.
  messageHtml: |
    <p>
    Kære %username%.<br>
    <br>
    Du har bedt om at nulstille din adgangskode på <a href="%appplication_url%">Pocket Code</a>, fordi du har glemt din adgangskode.
    Hvis du ikke har bedt om dette, så ignorer denne besked. Anmodningen udløber og bliver ugyldig om 24 timer.<br>
    <br>
    For at nulstille din adgangskode og oprette en ny, klik <a href="%confirmationUrl%">her.</a><br>
    <br>
    Du kan til enhver tid bruge dit brugernavn og din adgangskode til at få adgang til <a href="%appplication_url%">Pocket Code</a>-fællesskabet.<br>
    Det gør du ved at besøge følgende side: <a href="%loginPage%">Login-side</a><br>
    For at redigere dine profiloplysninger, gå til denne <a href="%profilePage%">side</a>.<br>
    <br>
    Med venlig hilsen<br>
    Dit Catrobat-team.
    </p>
