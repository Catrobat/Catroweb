consent:
  email:
    subject: "Forældresamtykke er nødvendigt til dit barns Catrobat-konto"
    title: "Forældresamtykke påkrævet"
    greeting: "Hej,"
    message: "Dit barn %username% har oprettet en konto på Catrobat og har bekræftet sin e-mailadresse."
    explanation: "Catrobat er en gratis læringsplatform, hvor unge lærer at programmere ved at lave apps, spil og animationer. Ifølge EU's regler om beskyttelse af børn skal vi have dit samtykke, før dit barn kan deltage fuldt ud i fællesskabet. Klik på knappen nedenfor for at give samtykke."
    button: "Giv forældresamtykke"
    ignore: "Hvis du ikke forventede denne e-mail, kan du roligt ignorere den. Uden samtykke har kontoen begrænset funktionalitet."
    whatIsCatrobat: "Catrobat er en gratis, almennyttig læringsplatform for programmering. Læs mere på catrobat.org."
    manageLink: 'Du kan til enhver tid administrere dit barns konto via vores <a href="%portalUrl%" style="color: #00acc1;">forældreportal</a>. Læs mere om <a href="%infoUrl%" style="color: #00acc1;">dine rettigheder som forælder</a>.'
  confirmed:
    title: "Samtykke givet"
    message: "Tak! %username%s konto er nu fuldt aktiveret."
    continueButton: "Opdag projekter"
parent:
  footer:
    link: "Forældre og værger"
  info:
    title: "Information til forældre og værger"
    intro: "Catrobat tager unge brugeres sikkerhed og privatliv alvorligt. Denne side forklarer, hvordan vi beskytter dit barn, og hvilke rettigheder du har."
    whatIsCatrobat:
      title: "Hvad er Catrobat?"
      text: "Catrobat er en gratis, almennyttig læringsplatform, hvor unge lærer at programmere ved at lave deres egne apps, spil og animationer. Platformen er tilgængelig i hele verden og bruges i undervisning."
    dataCollected:
      title: "Hvilke data indsamler vi?"
      text: "Vi indsamler kun de data, der er nødvendige for at drive platformen: brugernavn, e-mailadresse, fødselsdato og de projekter, dit barn laver og uploader. For brugere under 14 år gemmer vi også en e-mailadresse til en forælder/værge af hensyn til samtykke. Vi sælger eller deler ikke personoplysninger med tredjeparter."
    yourRights:
      title: "Dine rettigheder som forælder eller værge"
      text: "Ifølge EU's regler om beskyttelse af børn (GDPR) og COPPA har du ret til at: se de data, vi har om dit barn, anmode om en kopi af disse data, trække dit samtykke tilbage når som helst (hvilket begrænser kontoen) og anmode om permanent sletning af dit barns konto og alle tilknyttede data."
    minorRestrictions:
      title: "Hvilke begrænsninger gælder for mindreåriges konti?"
      text: "Brugere under 16 år kan ikke skrive eller læse kommentarer, følge andre brugere eller se indhold, der er markeret som uegnet for børn. De kan stadig lave og uploade projekter, gennemse offentlige projekter og reagere på projekter med likes. Disse begrænsninger findes for at give et trygt læringsmiljø."
    manageButton: "Administrer dit barns konto"
  portal:
    title: "Forældreportal"
    description: "Indtast din e-mailadresse for at få et sikkert link til at administrere dit barns Catrobat-konto. Linket sendes til den e-mailadresse, du angav ved registreringen."
    emailLabel: "Din e-mailadresse"
    submitButton: "Send administrationslink"
    infoLink: "Læs mere"
    success:
      title: "Tjek din indbakke"
      message: "Hvis en konto er knyttet til denne e-mail, har vi sendt et administrationslink. Tjek din indbakke, og følg linket for at administrere dit barns konto."
  manage:
    title: "Administrer børnekonti"
    description: "Du administrerer konti, der er knyttet til %email%."
    consentStatus: "Status for samtykke"
    accountCreated: "Konto oprettet"
    email: "Barnets e-mail"
    status:
      granted: "Givet"
      pending: "Afventer"
      revoked: "Trukket tilbage"
    grantButton: "Giv samtykke"
    revokeButton: "Træk samtykke tilbage"
    revokeConfirm: "Er du sikker på, at du vil trække samtykket tilbage? Kontoen får begrænset funktionalitet."
    exportButton: "Eksportér data"
    deleteButton: "Slet konto"
    deleteConfirm: "Er du sikker på, at du vil slette denne konto permanent? Det kan ikke fortrydes."
  management:
    email:
      subject: "Administrer dit barns Catrobat-konto"
      title: "Kontoadministration"
      greeting: "Hej,"
      message: "Du har bedt om et link til at administrere dit barns Catrobat-konto (%usernames%). Klik på knappen nedenfor for at se og administrere kontoen."
