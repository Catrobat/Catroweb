privacy-policy:
  header: Privatlivspolitik
  version: Version 2.2, 17. oktober 2019
  text1: For at kunne tilbyde dig alle fordelene ved vores tjenester og den tilhørende konto er det nødvendigt at indsamle visse data fra dig.
  text2: For at vedligeholde og forbedre vores tjenester (apps og hjemmesider) og for at lave videnskabelig forskning inden for IKT- og STEM/STEAM-undervisning bruger vi Google Analytics, Crashlytics og Firebase, alle fra Google LLC (USA), samt Dynatrace fra Dynatrace LLC (USA) til at få metadata om brugen af vores tjenester, f.eks. oplysninger om nedbrud, tidsstempler, besøgte sider/skærme, brug af vores apps og tjenester, anvendt styresystem og oplysninger om netværksudbyderen. Denne analyse og de indsamlede data er ikke knyttet til din profil og indeholder ingen personoplysninger (de sidste bits af IP-adressen anonymiseres). De indsamlede data overføres dog til tjenesteudbyderne (Google LLC, USA og Dynatrace LLC, USA). Databehandlingen er baseret på aftaler med Google LLC og Dynatrace LLC. Dette forhold til tjenesteudbyderne overholder Den Europæiske Unions generelle databeskyttelsesforordning (EU GDPR) og EU-USA-aftalen "Privacy Shield".
  text3: For at du kan oprette og bruge en konto i vores systemer, og for at vi kan informere dig om nødvendige ændringer af din konto via e-mail, f.eks. opdateringer eller overtrædelser af vores brugs- og servicevilkår, vores fællesskabsregler eller vores politikker, gemmer vi dit brugernavn og, hvis du har angivet den, din e-mailadresse. Hvis du har forbundet din konto via Google Plus eller Facebook, gemmer vi desuden en identifikationsnøgle, der er knyttet til din konto på disse tjenester. Vi bruger ikke disse data til andre formål (f.eks. markedsføring), medmindre du udtrykkeligt har givet os lov til det.
  text4: Frivilligt kan du oplyse dit bopælsland via din kontoside på delingssiden. Det vises på din offentlige profil og bruges kun af os til statistik og forskning. Det kan til enhver tid fjernes i dine profilindstillinger.
  text5: Du kan til enhver tid trække brugen af personoplysningerne knyttet til din konto tilbage ved at slette din konto via din profilside på https://share.catrob.at/. Når du har slettet din konto, kan du stadig bruge de tilbudte tjenester, men ikke samarbejde, f.eks. ved at uploade programmer, kommentere eller give likes. Alt indhold knyttet til din konto, f.eks. uploadede programmer, kommentarer osv., bliver også slettet.
  text6: For at undgå misbrug af vores tjenester, f.eks. gennem uploads eller kommentarer fra brugere til ulovlige formål, gemmes alle offentlige data skabt af brugere (uploads, kommentarer) internt i en database sammen med et tidsstempel og den anvendte internetadresse. Disse data bliver ikke brugt af eller videregivet til nogen institutioner, medmindre der er begrundet mistanke om tilstrækkeligt ulovlige handlinger, og officielt bemyndigede juridiske institutioner anmoder om dem på grundlag af gældende lov. Hver sag bliver først grundigt undersøgt individuelt af os.
  text7: Du kan frivilligt abonnere på Catrobats nyhedsbrev på https://catrob.at/newsletter, som vi tilbyder via tjenesten MailChimp (The Rocket Science Group LLC d/b/a MailChimp, USA). Du modtager så nyheder om Catrobat-projektet og dets tjenester på den e-mailadresse, du har angivet. Du kan til enhver tid afmelde nyhedsbrevet ved at bruge linket "unsubscribe" nederst i hvert nyhedsbrev. Dette nyhedsbrev leveres af MailChimp, som vi har en databehandleraftale med, og som har forpligtet sig til EU's generelle databeskyttelsesforordning og EU-USA-aftalen "Privacy Shield". Se også MailChimps privatlivspolitik og brugsvilkår for flere detaljer om MailChimp.
  text8: Alle tjenester leveres af det frie open source-projekt Catrobat under paraplyen International Catrobat Association – Verein zur Förderung freier Software, en almennyttig NGO registreret i Graz, Østrig (Den Europæiske Union). Vores politikker respekterer EU's og Østrigs databeskyttelseslovgivning (GDPR). Du kan kontakte os ved at sende en e-mail til contact@catrobat.org eller skrive til Catrobat, c/o Institute of Software Technology, Graz University of Technology, Inffeldgasse 16b, A-8010 Graz, Østrig (Den Europæiske Union).
  text9: Hvis du er under 14 år, skal denne politik accepteres af en værge (som regel en forælder).
  text10: Catrobats officielle privatlivspolitik på engelsk findes på nettet under %privacy_policy%.
  disagree-text: Uden godkendelse kan vi ikke oprette en konto, men de centrale funktioner er stadig tilgængelige.
