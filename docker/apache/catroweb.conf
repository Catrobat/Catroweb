<VirtualHost *:80>
        ServerName catroweb
        ServerAlias share.catrobat.org
        DocumentRoot /var/www/catroweb/public

        <Directory /var/www/catroweb/public>
             RewriteEngine On

             # Project bytes must never bypass application authorization, including legacy URLs.
             RewriteRule ^(?:resources(?:_test)?/(?:programs|projects|extract|assets)(?:/|$)|(?:extract|programs|__protected-project-resources)(?:/|$)) - [R=404,L,NC]
             RewriteRule ^project-files/ index.php [END]

             # Redirect images to webp-on-demand.php (if browser supports webp)
             RewriteCond %{HTTP_ACCEPT} image/webp
             RewriteCond %{REQUEST_FILENAME} -f
             RewriteRule ^(.*)\.(jpe?g|png)$ /webp-on-demand.php?source=%{SCRIPT_FILENAME} [NC,L]
             AddType image/webp .webp

             # Default Symfony routing
             DirectoryIndex /index.php
             FallbackResource /index.php
        </Directory>

        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

        # Compression
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml
        </IfModule>

        # Browser caching for static assets
        <IfModule mod_headers.c>
            <FilesMatch "\.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$">
                Header set Cache-Control "max-age=2592000, public"
            </FilesMatch>
            <FilesMatch "\.(css|js)$">
                Header set Cache-Control "max-age=31536000, public, immutable"
            </FilesMatch>
        </IfModule>

        # Override static-image caching for protected routes and rejected legacy paths.
        <LocationMatch "^/(?:index(?:_test)?\.php/)?(?:project-files/|resources(?:_test)?/(?:programs|projects|extract|assets)(?:/|$)|(?:extract|programs|__protected-project-resources)(?:/|$))">
            <IfModule mod_headers.c>
                Header unset Cache-Control
                Header always unset Cache-Control
                Header always set Cache-Control "private, no-store"
            </IfModule>
        </LocationMatch>

        # Security headers
        #
        # Single source of truth: src/Security/SecurityHeadersSubscriber.php enforces
        # the full set of response headers (X-Frame-Options, Referrer-Policy,
        # Permissions-Policy, COOP, CORP, HSTS, CSP) at the Symfony layer.
        # The Apache fallback below covers static-asset responses that bypass PHP.
        <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
        </IfModule>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
